ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 8 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"花卉學-114-一","s":"花卉學","y":114,"n":"一","t":"玫瑰修剪目的","body":"<h2>第一題｜玫瑰修剪目的（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>玫瑰修剪目的<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>去病枯、弱枝及過老枝，培養強健更新枝；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先由當期新梢理解開花<\/strong><\/p>\n<p>多數切花玫瑰的花在當期伸長枝頂端形成，採切或修剪後由腋芽再萌生花枝。剪口位置、保留葉量與芽的成熟狀態會影響新枝粗度、長度與採收時間，不能只用長日或短日分類解釋。<\/p>\n<p><strong>偃枝保留供源，直立花枝作為主要庫<\/strong><\/p>\n<p>將部分營養枝彎折，使其減弱頂端優勢與直立競爭，保留葉面積供應同化物；基部或保留芽形成直立採花枝。彎而不折斷維管束、維持葉片受光和健康，是效益成立的條件。<\/p>\n<p><strong>修剪要同時更新與避免過度減葉<\/strong><\/p>\n<p>去病弱、老化與交叉枝可改善通風並促更新；若重剪時去除大量有效葉，短期供碳反而不足。應按品種、市場枝長、採花節奏與季節光量調整，並防彎枝層過密。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>剪得愈重不一定產量愈高，重剪會減少葉面積、延後首批採花。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>去病枯、弱枝及過老枝，培養強健更新枝；<\/p>\n<p>調節頂端優勢、枝條數量與結果／開花位置，促使粗壯花莖、集中養分，維持通風採光；<\/p>\n<p>配合市場安排萌芽至開花期，改善採切效率及切花等級。<\/p>\n<p>多數切花玫瑰的花在當期伸長枝頂端形成，採切或修剪後由腋芽再萌生花枝。剪口位置、保留葉量與芽的成熟狀態會影響新枝粗度、長度與採收時間，不能只用長日或短日分類解釋。<\/p>\n<p>將部分營養枝彎折，使其減弱頂端優勢與直立競爭，保留葉面積供應同化物；基部或保留芽形成直立採花枝。彎而不折斷維管束、維持葉片受光和健康，是效益成立的條件。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>冬季低光期若仍大幅去除偃枝葉片，後續採花枝可能細弱；維持健康供源層並合理調整採枝數，比只追求萌芽數更能維持合格花枝。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：更新、防病採光、樹勢品質、採期與修剪取捨。<\/p>\n<ul>\n<li><strong>防病採光<\/strong><\/li>\n<li><strong>樹勢品質<\/strong><\/li>\n<li><strong>採期與修剪取捨<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把偃枝當作把供源葉全部剪除。<\/li>\n<\/ul>","source":"../../B114.pdf#page=2","md":"114年花卉學_逐題教學詳解.md","search":"玫瑰修剪目的 ## 第一題｜玫瑰修剪目的（10 分）\n\n### 題意與作答範圍\n\n本題重點：**玫瑰修剪目的**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b114.pdf#page=2)。\n\n### 先掌握答案\n\n去病枯、弱枝及過老枝，培養強健更新枝；\n\n### 原理拆解：為什麼會這樣？\n\n**先由當期新梢理解開花**\n\n多數切花玫瑰的花在當期伸長枝頂端形成，採切或修剪後由腋芽再萌生花枝。剪口位置、保留葉量與芽的成熟狀態會影響新枝粗度、長度與採收時間，不能只用長日或短日分類解釋。\n\n**偃枝保留供源，直立花枝作為主要庫**\n\n將部分營養枝彎折，使其減弱頂端優勢與直立競爭，保留葉面積供應同化物；基部或保留芽形成直立採花枝。彎而不折斷維管束、維持葉片受光和健康，是效益成立的條件。\n\n**修剪要同時更新與避免過度減葉**\n\n去病弱、老化與交叉枝可改善通風並促更新；若重剪時去除大量有效葉，短期供碳反而不足。應按品種、市場枝長、採花節奏與季節光量調整，並防彎枝層過密。\n\n### 這題要特別注意\n\n剪得愈重不一定產量愈高，重剪會減少葉面積、延後首批採花。\n\n### 可直接練寫的完整答案\n\n去病枯、弱枝及過老枝，培養強健更新枝；\n\n調節頂端優勢、枝條數量與結果／開花位置，促使粗壯花莖、集中養分，維持通風採光；\n\n配合市場安排萌芽至開花期，改善採切效率及切花等級。\n\n多數切花玫瑰的花在當期伸長枝頂端形成，採切或修剪後由腋芽再萌生花枝。剪口位置、保留葉量與芽的成熟狀態會影響新枝粗度、長度與採收時間，不能只用長日或短日分類解釋。\n\n將部分營養枝彎折，使其減弱頂端優勢與直立競爭，保留葉面積供應同化物；基部或保留芽形成直立採花枝。彎而不折斷維管束、維持葉片受光和健康，是效益成立的條件。\n\n### 實例：把原理用在情境中\n\n冬季低光期若仍大幅去除偃枝葉片，後續採花枝可能細弱；維持健康供源層並合理調整採枝數，比只追求萌芽數更能維持合格花枝。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：更新、防病採光、樹勢品質、採期與修剪取捨。\n\n- **防病採光**\n- **樹勢品質**\n- **採期與修剪取捨**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把偃枝當作把供源葉全部剪除。\n 114 花卉學"},{"id":"花卉學-114-二","s":"花卉學","y":114,"n":"二","t":"三種喜酸花卉與產區","body":"<h2>第二題｜三種喜酸花卉與產區（9 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>三種喜酸花卉與產區<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>杜鵑 azalea（Rhododendron simsii 及園藝雜交群）：北部陽明山、淡水等；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<p><strong>第一步是分清吸收、運輸與需求<\/strong><\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p><strong>用新老葉位置推理<\/strong><\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<p><strong>最後必須用適當樣本驗證<\/strong><\/p>\n<p>依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>學名與適酸性必須搭配；<\/p>\n<p>上述為代表性產地，非限定唯一產區。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>杜鵑 azalea（Rhododendron simsii 及園藝雜交群）：北部陽明山、淡水等；<\/p>\n<p>茶花 camellia（Camellia japonica）：北部及中部較涼產區；<\/p>\n<p>繡球花 hydrangea（Hydrangea macrophylla）：陽明山、竹子湖及中海拔涼地。<\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<p>老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>9 分：三作物各中文、學名、商業產區；喜酸與低 pH 生理。<\/p>\n<ul>\n<li><strong>三作物各中文<\/strong><\/li>\n<li><strong>商業產區<\/strong><\/li>\n<li><strong>喜酸與低 pH 生理<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<li>只寫缺肥會黃葉，沒有指出葉齡與黃化分布。<\/li>\n<\/ul>","source":"../../B114.pdf#page=2","md":"114年花卉學_逐題教學詳解.md","search":"三種喜酸花卉與產區 ## 第二題｜三種喜酸花卉與產區（9 分）\n\n### 題意與作答範圍\n\n本題重點：**三種喜酸花卉與產區**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b114.pdf#page=2)。\n\n### 先掌握答案\n\n杜鵑 azalea（rhododendron simsii 及園藝雜交群）：北部陽明山、淡水等；\n\n### 原理拆解：為什麼會這樣？\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n**第一步是分清吸收、運輸與需求**\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n**用新老葉位置推理**\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n**最後必須用適當樣本驗證**\n\n依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。\n\n### 這題要特別注意\n\n學名與適酸性必須搭配；\n\n上述為代表性產地，非限定唯一產區。\n\n### 可直接練寫的完整答案\n\n杜鵑 azalea（rhododendron simsii 及園藝雜交群）：北部陽明山、淡水等；\n\n茶花 camellia（camellia japonica）：北部及中部較涼產區；\n\n繡球花 hydrangea（hydrangea macrophylla）：陽明山、竹子湖及中海拔涼地。\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n### 實例：把原理用在情境中\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。\n\n### 配分重點：哪些內容不能漏？\n\n9 分：三作物各中文、學名、商業產區；喜酸與低 ph 生理。\n\n- **三作物各中文**\n- **商業產區**\n- **喜酸與低 ph 生理**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將連作障礙全部歸因於缺肥。\n- 只寫缺肥會黃葉，沒有指出葉齡與黃化分布。\n 114 花卉學"},{"id":"花卉學-114-三","s":"花卉學","y":114,"n":"三","t":"優良培養土條件","body":"<h2>第三題｜優良培養土條件（11 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>優良培養土條件<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>排水、通氣與保水兼具；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>根需要水，也需要氧<\/strong><\/p>\n<p>介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。<\/p>\n<p><strong>化學性質會改變肥培結果<\/strong><\/p>\n<p>pH 影響元素溶解與有效性，EC 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 EC 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；pH 與 EC 是不同指標，不能相互替代。<\/p>\n<p><strong>配方應可重複而且衛生<\/strong><\/p>\n<p>選擇穩定、無病原與雜草種子、粒徑一致的材料，混合後實測保水、通氣、pH 及 EC。泥炭、椰纖、樹皮等有機材料會分解或吸附養分；珍珠石等材料的作用也受比例與粒徑影響，配方必須搭配灌肥管理。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>孔隙不是愈大愈好，應同時保留足夠有效水，尤其小盆與穴盤更敏感。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>排水、通氣與保水兼具；<\/p>\n<p>有適當容重及穩定結構，不易壓實或快速腐解；<\/p>\n<p>pH、EC 與養分適作物，具適度緩衝及交換能力；<\/p>\n<p>無病蟲、雜草種子及毒物；<\/p>\n<p>來源穩定、均一、易潤濕、成本合理並可妥善處理或再用。<\/p>\n<p>介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。<\/p>\n<p>pH 影響元素溶解與有效性，EC 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 EC 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；pH 與 EC 是不同指標，不能相互替代。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一泥炭與珍珠石配方用於矮盆時，底部飽和區占比可能較高；若又照高盆的頻率灌水，根部缺氧風險便增加。應從盆器與水分實測修正，而非只換肥料。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>11 分：物理、化學、生物與供應經濟條件。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無土介質寫成完全不含有機物。<\/li>\n<\/ul>","source":"../../B114.pdf#page=2","md":"114年花卉學_逐題教學詳解.md","search":"優良培養土條件 ## 第三題｜優良培養土條件（11 分）\n\n### 題意與作答範圍\n\n本題重點：**優良培養土條件**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b114.pdf#page=2)。\n\n### 先掌握答案\n\n排水、通氣與保水兼具；\n\n### 原理拆解：為什麼會這樣？\n\n**根需要水，也需要氧**\n\n介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。\n\n**化學性質會改變肥培結果**\n\nph 影響元素溶解與有效性，ec 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 ec 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；ph 與 ec 是不同指標，不能相互替代。\n\n**配方應可重複而且衛生**\n\n選擇穩定、無病原與雜草種子、粒徑一致的材料，混合後實測保水、通氣、ph 及 ec。泥炭、椰纖、樹皮等有機材料會分解或吸附養分；珍珠石等材料的作用也受比例與粒徑影響，配方必須搭配灌肥管理。\n\n### 這題要特別注意\n\n孔隙不是愈大愈好，應同時保留足夠有效水，尤其小盆與穴盤更敏感。\n\n### 可直接練寫的完整答案\n\n排水、通氣與保水兼具；\n\n有適當容重及穩定結構，不易壓實或快速腐解；\n\nph、ec 與養分適作物，具適度緩衝及交換能力；\n\n無病蟲、雜草種子及毒物；\n\n來源穩定、均一、易潤濕、成本合理並可妥善處理或再用。\n\n介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。\n\nph 影響元素溶解與有效性，ec 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 ec 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；ph 與 ec 是不同指標，不能相互替代。\n\n### 實例：把原理用在情境中\n\n同一泥炭與珍珠石配方用於矮盆時，底部飽和區占比可能較高；若又照高盆的頻率灌水，根部缺氧風險便增加。應從盆器與水分實測修正，而非只換肥料。\n\n### 配分重點：哪些內容不能漏？\n\n11 分：物理、化學、生物與供應經濟條件。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無土介質寫成完全不含有機物。\n 114 花卉學"},{"id":"花卉學-114-四","s":"花卉學","y":114,"n":"四","t":"蘭花生態與增生習性分類","body":"<h2>第四題｜蘭花生態與增生習性分類（12 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>蘭花生態與增生習性分類<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>自然生長分地生蘭（如蕙蘭 Cymbidium）、附生蘭（如蝴蝶蘭 Phalaenopsis）、岩生蘭（如部分石斛 Dendrobium）；<\/p>\n<p>按莖增生分單莖性（主軸持續延長，如萬代蘭 Vanda）與複莖性（各生長軸有限、由根莖側芽更新，如嘉德麗亞蘭 Cattleya）。若將兩軸交叉，可舉地生複莖蕙蘭、附生單莖蝴蝶蘭、附生複莖文心蘭等。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>器官來源比外觀名稱更可靠<\/strong><\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<p><strong>不同分類軸不能混用<\/strong><\/p>\n<p>花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。<\/p>\n<p><strong>名稱與例子要一對一<\/strong><\/p>\n<p>寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>按莖增生分單莖性（主軸持續延長，如萬代蘭 Vanda）與複莖性（各生長軸有限、由根莖側芽更新，如嘉德麗亞蘭 Cattleya）。若將兩軸交叉，可舉地生複莖蕙蘭、附生單莖蝴蝶蘭、附生複莖文心蘭等。<\/td>\n<td>是橫走的莖，具有節與芽；蓮藕、薑雖俗稱根，實際為莖。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>這題要特別注意<\/h3>\n<p>地生／附生與單莖／複莖是獨立分類，不能互相等同；<\/p>\n<p>同屬內生態亦可能不同。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>自然生長分地生蘭（如蕙蘭 Cymbidium）、附生蘭（如蝴蝶蘭 Phalaenopsis）、岩生蘭（如部分石斛 Dendrobium）；<\/p>\n<p>按莖增生分單莖性（主軸持續延長，如萬代蘭 Vanda）與複莖性（各生長軸有限、由根莖側芽更新，如嘉德麗亞蘭 Cattleya）。若將兩軸交叉，可舉地生複莖蕙蘭、附生單莖蝴蝶蘭、附生複莖文心蘭等。<\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>12 分：自然生態與莖增生兩分類軸、各不重複蘭例。<\/p>\n<ul>\n<li><strong>自然生態與莖增生兩分類軸<\/strong><\/li>\n<li><strong>各不重複蘭例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>看到地下器官就全部寫成根。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../B114.pdf#page=2","md":"114年花卉學_逐題教學詳解.md","search":"蘭花生態與增生習性分類 ## 第四題｜蘭花生態與增生習性分類（12 分）\n\n### 題意與作答範圍\n\n本題重點：**蘭花生態與增生習性分類**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b114.pdf#page=2)。\n\n### 先掌握答案\n\n自然生長分地生蘭（如蕙蘭 cymbidium）、附生蘭（如蝴蝶蘭 phalaenopsis）、岩生蘭（如部分石斛 dendrobium）；\n\n按莖增生分單莖性（主軸持續延長，如萬代蘭 vanda）與複莖性（各生長軸有限、由根莖側芽更新，如嘉德麗亞蘭 cattleya）。若將兩軸交叉，可舉地生複莖蕙蘭、附生單莖蝴蝶蘭、附生複莖文心蘭等。\n\n### 原理拆解：為什麼會這樣？\n\n**器官來源比外觀名稱更可靠**\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n**不同分類軸不能混用**\n\n花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。\n\n**名稱與例子要一對一**\n\n寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| 按莖增生分單莖性（主軸持續延長，如萬代蘭 vanda）與複莖性（各生長軸有限、由根莖側芽更新，如嘉德麗亞蘭 cattleya）。若將兩軸交叉，可舉地生複莖蕙蘭、附生單莖蝴蝶蘭、附生複莖文心蘭等。 | 是橫走的莖，具有節與芽；蓮藕、薑雖俗稱根，實際為莖。 |\n\n### 這題要特別注意\n\n地生／附生與單莖／複莖是獨立分類，不能互相等同；\n\n同屬內生態亦可能不同。\n\n### 可直接練寫的完整答案\n\n自然生長分地生蘭（如蕙蘭 cymbidium）、附生蘭（如蝴蝶蘭 phalaenopsis）、岩生蘭（如部分石斛 dendrobium）；\n\n按莖增生分單莖性（主軸持續延長，如萬代蘭 vanda）與複莖性（各生長軸有限、由根莖側芽更新，如嘉德麗亞蘭 cattleya）。若將兩軸交叉，可舉地生複莖蕙蘭、附生單莖蝴蝶蘭、附生複莖文心蘭等。\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n### 實例：把原理用在情境中\n\n馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。\n\n### 配分重點：哪些內容不能漏？\n\n12 分：自然生態與莖增生兩分類軸、各不重複蘭例。\n\n- **自然生態與莖增生兩分類軸**\n- **各不重複蘭例**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 看到地下器官就全部寫成根。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 114 花卉學"},{"id":"花卉學-114-五","s":"花卉學","y":114,"n":"五","t":"噴霧扦插優點","body":"<h2>第五題｜噴霧扦插優點（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>噴霧扦插優點<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>定時間歇霧化提高葉周濕度並降葉溫，減少未生根插穗蒸散；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>噴的是維持葉水分所需霧量，不是讓介質長期飽水；<\/p>\n<p>過濕會缺氧腐爛。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>定時間歇霧化提高葉周濕度並降葉溫，減少未生根插穗蒸散；<\/p>\n<p>可保留葉片進行光合，提高存活與發根整齊度，減少遮蔭程度與人工澆水，有利大批繁殖。<\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：葉水分、降溫保葉、發根均一與大批管理、過濕缺氧限制。<\/p>\n<ul>\n<li><strong>葉水分<\/strong><\/li>\n<li><strong>降溫保葉<\/strong><\/li>\n<li><strong>發根均一與大批管理<\/strong><\/li>\n<li><strong>過濕缺氧限制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<\/ul>","source":"../../B114.pdf#page=2","md":"114年花卉學_逐題教學詳解.md","search":"噴霧扦插優點 ## 第五題｜噴霧扦插優點（10 分）\n\n### 題意與作答範圍\n\n本題重點：**噴霧扦插優點**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b114.pdf#page=2)。\n\n### 先掌握答案\n\n定時間歇霧化提高葉周濕度並降葉溫，減少未生根插穗蒸散；\n\n### 原理拆解：為什麼會這樣？\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n### 這題要特別注意\n\n噴的是維持葉水分所需霧量，不是讓介質長期飽水；\n\n過濕會缺氧腐爛。\n\n### 可直接練寫的完整答案\n\n定時間歇霧化提高葉周濕度並降葉溫，減少未生根插穗蒸散；\n\n可保留葉片進行光合，提高存活與發根整齊度，減少遮蔭程度與人工澆水，有利大批繁殖。\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n### 實例：把原理用在情境中\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：葉水分、降溫保葉、發根均一與大批管理、過濕缺氧限制。\n\n- **葉水分**\n- **降溫保葉**\n- **發根均一與大批管理**\n- **過濕缺氧限制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無性繁殖與無病毒畫上等號。\n 114 花卉學"},{"id":"花卉學-114-六","s":"花卉學","y":114,"n":"六","t":"設施栽培六項效益","body":"<h2>第六題｜設施栽培六項效益（12 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>設施栽培六項效益<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>①避雨減少病斑與花傷。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>設施先改變能量與物質交換<\/strong><\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p><strong>各因子必須一起管理<\/strong><\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<p><strong>控制成效要用植株與環境資料驗證<\/strong><\/p>\n<p>以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>設施只提供調控手段，需通風、防蟲網與環控配套才有實際效益。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>①避雨減少病斑與花傷。<\/p>\n<p>②保溫防寒與促成。<\/p>\n<p>③遮蔭、通風或蒸發降溫，減熱傷。<\/p>\n<p>④防風、防雹與減少機械傷。<\/p>\n<p>⑤控制日長及補光、調節開花。<\/p>\n<p>⑥配合灌溉施肥及隔離病蟲，提高品質、整齊度與計畫生產能力。<\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>12 分：六項效益各 2 分，環境因子對生長品質。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將溫室直接等同低溫環境。<\/li>\n<\/ul>","source":"../../B114.pdf#page=2","md":"114年花卉學_逐題教學詳解.md","search":"設施栽培六項效益 ## 第六題｜設施栽培六項效益（12 分）\n\n### 題意與作答範圍\n\n本題重點：**設施栽培六項效益**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b114.pdf#page=2)。\n\n### 先掌握答案\n\n①避雨減少病斑與花傷。\n\n### 原理拆解：為什麼會這樣？\n\n**設施先改變能量與物質交換**\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n**各因子必須一起管理**\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n**控制成效要用植株與環境資料驗證**\n\n以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。\n\n### 這題要特別注意\n\n設施只提供調控手段，需通風、防蟲網與環控配套才有實際效益。\n\n### 可直接練寫的完整答案\n\n①避雨減少病斑與花傷。\n\n②保溫防寒與促成。\n\n③遮蔭、通風或蒸發降溫，減熱傷。\n\n④防風、防雹與減少機械傷。\n\n⑤控制日長及補光、調節開花。\n\n⑥配合灌溉施肥及隔離病蟲，提高品質、整齊度與計畫生產能力。\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n### 實例：把原理用在情境中\n\n臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。\n\n### 配分重點：哪些內容不能漏？\n\n12 分：六項效益各 2 分，環境因子對生長品質。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將溫室直接等同低溫環境。\n 114 花卉學"},{"id":"花卉學-114-七","s":"花卉學","y":114,"n":"七","t":"十種花序","body":"<h2>第七題｜十種花序（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>十種花序<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>馬鞭草無限穗狀；<\/p>\n<p>石竹有限聚繖；<\/p>\n<p>唐菖蒲無限穗狀；<\/p>\n<p>火鶴花無限肉穗；<\/p>\n<p>棋盤腳無限總狀；<\/p>\n<p>仙丹花有限複聚繖；<\/p>\n<p>紅蝴蝶若指洋金鳳為無限總狀；<\/p>\n<p>鳶尾有限蠍尾狀聚繖；<\/p>\n<p>文殊蘭教材常列無限繖形（發育解釋有異）；<\/p>\n<p>向日葵無限頭狀。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先看主軸頂端是否終止於花<\/strong><\/p>\n<p>無限花序主軸可持續延伸，常見基部或周緣先開、往頂端或中心續開；有限花序主軸以頂花終止，後由側軸接續，常見頂端或中央先開。需看發育次序，不只看成熟時外形。<\/p>\n<p><strong>再看花梗、軸長與分枝<\/strong><\/p>\n<p>總狀花序具明顯主軸與有梗小花；穗狀小花無梗或近無梗；繖形花梗集中於近同一點；頭狀花序小花密集於膨大花托；肉穗花序的花軸肉質，常伴佛焰苞。<\/p>\n<p><strong>複合結構與俗名要註清<\/strong><\/p>\n<p>圓錐花序常由分枝總狀系統構成，複聚繖則由有限分枝重複。某些花序外觀近似繖形但發育屬聚繖，教材口徑可能不同，答題可在主要分類後註明，不宜用外形直接否定發育分類。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>俗名與文殊蘭分類的限制，見本冊 112 年第一題；<\/p>\n<p>本題仍完整列答以便逐卷練習。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>馬鞭草無限穗狀；<\/p>\n<p>石竹有限聚繖；<\/p>\n<p>唐菖蒲無限穗狀；<\/p>\n<p>火鶴花無限肉穗；<\/p>\n<p>棋盤腳無限總狀；<\/p>\n<p>仙丹花有限複聚繖；<\/p>\n<p>紅蝴蝶若指洋金鳳為無限總狀；<\/p>\n<p>鳶尾有限蠍尾狀聚繖；<\/p>\n<p>文殊蘭教材常列無限繖形（發育解釋有異）；<\/p>\n<p>向日葵無限頭狀。<\/p>\n<p>無限花序主軸可持續延伸，常見基部或周緣先開、往頂端或中心續開；有限花序主軸以頂花終止，後由側軸接續，常見頂端或中央先開。需看發育次序，不只看成熟時外形。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>向日葵看似一朵大花，實為多個舌狀與管狀小花構成頭狀花序；火鶴則以肉穗花序承載許多小花，外側顯著彩色部分是佛焰苞。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：十種各 2 分，先有限／無限再專名。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把花序名稱與花冠形狀混寫。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../B114.pdf#page=2","md":"114年花卉學_逐題教學詳解.md","search":"十種花序 ## 第七題｜十種花序（20 分）\n\n### 題意與作答範圍\n\n本題重點：**十種花序**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b114.pdf#page=2)。\n\n### 先掌握答案\n\n馬鞭草無限穗狀；\n\n石竹有限聚繖；\n\n唐菖蒲無限穗狀；\n\n火鶴花無限肉穗；\n\n棋盤腳無限總狀；\n\n仙丹花有限複聚繖；\n\n紅蝴蝶若指洋金鳳為無限總狀；\n\n鳶尾有限蠍尾狀聚繖；\n\n文殊蘭教材常列無限繖形（發育解釋有異）；\n\n向日葵無限頭狀。\n\n### 原理拆解：為什麼會這樣？\n\n**先看主軸頂端是否終止於花**\n\n無限花序主軸可持續延伸，常見基部或周緣先開、往頂端或中心續開；有限花序主軸以頂花終止，後由側軸接續，常見頂端或中央先開。需看發育次序，不只看成熟時外形。\n\n**再看花梗、軸長與分枝**\n\n總狀花序具明顯主軸與有梗小花；穗狀小花無梗或近無梗；繖形花梗集中於近同一點；頭狀花序小花密集於膨大花托；肉穗花序的花軸肉質，常伴佛焰苞。\n\n**複合結構與俗名要註清**\n\n圓錐花序常由分枝總狀系統構成，複聚繖則由有限分枝重複。某些花序外觀近似繖形但發育屬聚繖，教材口徑可能不同，答題可在主要分類後註明，不宜用外形直接否定發育分類。\n\n### 這題要特別注意\n\n俗名與文殊蘭分類的限制，見本冊 112 年第一題；\n\n本題仍完整列答以便逐卷練習。\n\n### 可直接練寫的完整答案\n\n馬鞭草無限穗狀；\n\n石竹有限聚繖；\n\n唐菖蒲無限穗狀；\n\n火鶴花無限肉穗；\n\n棋盤腳無限總狀；\n\n仙丹花有限複聚繖；\n\n紅蝴蝶若指洋金鳳為無限總狀；\n\n鳶尾有限蠍尾狀聚繖；\n\n文殊蘭教材常列無限繖形（發育解釋有異）；\n\n向日葵無限頭狀。\n\n無限花序主軸可持續延伸，常見基部或周緣先開、往頂端或中心續開；有限花序主軸以頂花終止，後由側軸接續，常見頂端或中央先開。需看發育次序，不只看成熟時外形。\n\n### 實例：把原理用在情境中\n\n向日葵看似一朵大花，實為多個舌狀與管狀小花構成頭狀花序；火鶴則以肉穗花序承載許多小花，外側顯著彩色部分是佛焰苞。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：十種各 2 分，先有限／無限再專名。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把花序名稱與花冠形狀混寫。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 114 花卉學"},{"id":"花卉學-114-八","s":"花卉學","y":114,"n":"八","t":"八名詞","body":"<h2>第八題｜八名詞（16 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>八名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>觀賞植物：以形態、色彩、香氣等供觀賞利用的植物。花卉產業：涵蓋種苗、栽培、採後、流通、零售與應用的產業鏈。中性植物：成花對日長無特定要求。離層酸 ABA：參與乾旱反應、氣孔關閉、休眠等調節的激素。胡蘿蔔素 carotene：不含氧類胡蘿蔔素色素，參與集光、光保護，呈黃橙色。<\/p>\n<p>切花前處理劑：產地採後短期使用以補水、補糖、抑菌或抗乙烯的藥液。誘變育種：以物理或化學方式提高突變頻率，再選拔有益變異。地下芽植物 geophyte：不利季節將更新芽保護在地下貯藏器官中的植物，如鬱金香。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>感應的是日夜節律，常以夜長最關鍵<\/strong><\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<p><strong>感光與光合作用不是同一需求<\/strong><\/p>\n<p>暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。<\/p>\n<p><strong>產期調節須兼顧可感應階段<\/strong><\/p>\n<p>植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。<\/p>\n<p><strong>激素作用依器官與時期改變<\/strong><\/p>\n<p>生長素、吉貝素、細胞分裂素、乙烯與 ABA 均有多重功能；相同物質在不同濃度、器官和時期可能呈不同結果。必須用「作物＋物質＋時期＋目的」完整描述，不能只列藥名。<\/p>\n<p><strong>外施處理是在改變既有訊號系統<\/strong><\/p>\n<p>生長素可用於促不定根，也可能依條件疏果或減落果；GA 可促伸長、果粒膨大或調整種子發育；乙烯可誘導鳳梨開花，亦可能加速敏感花卉衰老。作用不能跨作物無條件推論。<\/p>\n<p><strong>生產應以核准用途與小量驗證為準<\/strong><\/p>\n<p>濃度、吸收量、天氣與施用位置會影響效果及藥害。考題可以說明機制，但不應從教材例子直接推定所有地區皆核准使用；回答時仍應保留品種、適期與合法用途的條件。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>觀賞植物：以形態、色彩、香氣等供觀賞利用的植物。花卉產業：涵蓋種苗、栽培、採後、流通、零售與應用的產業鏈。中性植物：成花對日長無特定要求。離層酸 ABA：參與乾旱反應、氣孔關閉、休眠等調節的激素。胡蘿蔔素 carotene：不含氧類胡蘿蔔素色素，參與集光、光保護，呈黃橙色。<\/td>\n<td>成花對日長沒有特定需求，不表示不需要光或完全不受每日光積量影響。 離層酸名稱容易誤導，主要作答可由乾旱訊號、氣孔關閉、種子或芽休眠等功能說明。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>這題要特別注意<\/h3>\n<p>ABA 名稱雖與離層相關，許多器官脫落的直接主導訊號是乙烯，不能只依名稱推論。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>觀賞植物：以形態、色彩、香氣等供觀賞利用的植物。花卉產業：涵蓋種苗、栽培、採後、流通、零售與應用的產業鏈。中性植物：成花對日長無特定要求。離層酸 ABA：參與乾旱反應、氣孔關閉、休眠等調節的激素。胡蘿蔔素 carotene：不含氧類胡蘿蔔素色素，參與集光、光保護，呈黃橙色。<\/p>\n<p>切花前處理劑：產地採後短期使用以補水、補糖、抑菌或抗乙烯的藥液。誘變育種：以物理或化學方式提高突變頻率，再選拔有益變異。地下芽植物 geophyte：不利季節將更新芽保護在地下貯藏器官中的植物，如鬱金香。<\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。<\/p>\n<p>IBA 用於扦插促根，而 GA₃ 可用於適當葡萄品種的無子化及膨大；兩者處理部位與時期不同，不能因同屬調節劑便互換。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>16 分：八項各 2 分，定義、作用與例，ABA 不直接等同脫落激素。<\/p>\n<ul>\n<li><strong>八項各 2 分，定義<\/strong><\/li>\n<li><strong>作用與例，ABA 不直接等同脫落激素<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短日反應簡化為光越少花越多。<\/li>\n<li>只背某激素「促進生長」，不寫促進哪個器官或過程。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../B114.pdf#page=2","md":"114年花卉學_逐題教學詳解.md","search":"八名詞 ## 第八題｜八名詞（16 分）\n\n### 題意與作答範圍\n\n本題重點：**八名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b114.pdf#page=2)。\n\n### 先掌握答案\n\n觀賞植物：以形態、色彩、香氣等供觀賞利用的植物。花卉產業：涵蓋種苗、栽培、採後、流通、零售與應用的產業鏈。中性植物：成花對日長無特定要求。離層酸 aba：參與乾旱反應、氣孔關閉、休眠等調節的激素。胡蘿蔔素 carotene：不含氧類胡蘿蔔素色素，參與集光、光保護，呈黃橙色。\n\n切花前處理劑：產地採後短期使用以補水、補糖、抑菌或抗乙烯的藥液。誘變育種：以物理或化學方式提高突變頻率，再選拔有益變異。地下芽植物 geophyte：不利季節將更新芽保護在地下貯藏器官中的植物，如鬱金香。\n\n### 原理拆解：為什麼會這樣？\n\n**感應的是日夜節律，常以夜長最關鍵**\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n**感光與光合作用不是同一需求**\n\n暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。\n\n**產期調節須兼顧可感應階段**\n\n植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。\n\n**激素作用依器官與時期改變**\n\n生長素、吉貝素、細胞分裂素、乙烯與 aba 均有多重功能；相同物質在不同濃度、器官和時期可能呈不同結果。必須用「作物＋物質＋時期＋目的」完整描述，不能只列藥名。\n\n**外施處理是在改變既有訊號系統**\n\n生長素可用於促不定根，也可能依條件疏果或減落果；ga 可促伸長、果粒膨大或調整種子發育；乙烯可誘導鳳梨開花，亦可能加速敏感花卉衰老。作用不能跨作物無條件推論。\n\n**生產應以核准用途與小量驗證為準**\n\n濃度、吸收量、天氣與施用位置會影響效果及藥害。考題可以說明機制，但不應從教材例子直接推定所有地區皆核准使用；回答時仍應保留品種、適期與合法用途的條件。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| 觀賞植物：以形態、色彩、香氣等供觀賞利用的植物。花卉產業：涵蓋種苗、栽培、採後、流通、零售與應用的產業鏈。中性植物：成花對日長無特定要求。離層酸 aba：參與乾旱反應、氣孔關閉、休眠等調節的激素。胡蘿蔔素 carotene：不含氧類胡蘿蔔素色素，參與集光、光保護，呈黃橙色。 | 成花對日長沒有特定需求，不表示不需要光或完全不受每日光積量影響。 離層酸名稱容易誤導，主要作答可由乾旱訊號、氣孔關閉、種子或芽休眠等功能說明。 |\n\n### 這題要特別注意\n\naba 名稱雖與離層相關，許多器官脫落的直接主導訊號是乙烯，不能只依名稱推論。\n\n### 可直接練寫的完整答案\n\n觀賞植物：以形態、色彩、香氣等供觀賞利用的植物。花卉產業：涵蓋種苗、栽培、採後、流通、零售與應用的產業鏈。中性植物：成花對日長無特定要求。離層酸 aba：參與乾旱反應、氣孔關閉、休眠等調節的激素。胡蘿蔔素 carotene：不含氧類胡蘿蔔素色素，參與集光、光保護，呈黃橙色。\n\n切花前處理劑：產地採後短期使用以補水、補糖、抑菌或抗乙烯的藥液。誘變育種：以物理或化學方式提高突變頻率，再選拔有益變異。地下芽植物 geophyte：不利季節將更新芽保護在地下貯藏器官中的植物，如鬱金香。\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n### 實例：把原理用在情境中\n\n菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。\n\niba 用於扦插促根，而 ga₃ 可用於適當葡萄品種的無子化及膨大；兩者處理部位與時期不同，不能因同屬調節劑便互換。\n\n### 配分重點：哪些內容不能漏？\n\n16 分：八項各 2 分，定義、作用與例，aba 不直接等同脫落激素。\n\n- **八項各 2 分，定義**\n- **作用與例，aba 不直接等同脫落激素**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短日反應簡化為光越少花越多。\n- 只背某激素「促進生長」，不寫促進哪個器官或過程。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 114 花卉學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
