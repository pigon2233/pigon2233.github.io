ls{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 7 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"果樹學-95-一","s":"果樹學","y":95,"n":"一","t":"五名詞","body":"<h2>第一題｜五名詞（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=35\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Apomixis 無融合生殖；<\/p>\n<p>véraison 葡萄轉色／始熟期，果粒軟化並開始明顯糖累積及著色；<\/p>\n<p>aggregate fruit 聚合果，單花多離生子房形成，如番荔枝；<\/p>\n<p>topping 打頂，去除較長梢段以調整生長；<\/p>\n<p>effective pollination period 有效授粉期，受柱頭接受性、花粉管生長時間及胚珠壽命共同限制。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先問有沒有受精<\/strong><\/p>\n<p>單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。<\/p>\n<p><strong>為何沒有正常種子仍能結果<\/strong><\/p>\n<p>正常發育種子會提供或誘導支持子房生長的激素訊號。遺傳性單為結果或外施調節劑可在缺乏受精時提供相似支持；種子敗育型則可能在初期已建立足以使果實繼續生長的條件。<\/p>\n<p><strong>無子化與膨大必須分開思考<\/strong><\/p>\n<p>有子葡萄的無子化須依品種、花期以合適處理影響種子形成，花後可能另需促果粒膨大。時機錯誤會落果、穗軸或果粒異常；不能給一個濃度宣稱適用所有葡萄。無融合生殖是無正常有性受精而產胚，仍可有種子，並非同義詞。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>aggregate fruit 聚合果，單花多離生子房形成，如番荔枝；<\/td>\n<td>通常發育成果實的核心組織；附屬花部也可參與形成可食部。<\/td>\n<\/tr>\n<tr>\n<td>effective pollination period 有效授粉期，受柱頭接受性、花粉管生長時間及胚珠壽命共同限制。<\/td>\n<td>多在受精後形成種子，胚珠與子房兩者層級不同。 負責接受花粉，與花柱的支持及花粉管通道功能不同。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Apomixis 無融合生殖；<\/p>\n<p>véraison 葡萄轉色／始熟期，果粒軟化並開始明顯糖累積及著色；<\/p>\n<p>aggregate fruit 聚合果，單花多離生子房形成，如番荔枝；<\/p>\n<p>topping 打頂，去除較長梢段以調整生長；<\/p>\n<p>effective pollination period 有效授粉期，受柱頭接受性、花粉管生長時間及胚珠壽命共同限制。<\/p>\n<p>單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>栽培香蕉可用作單為結果例，許多無子葡萄作種子敗育例；柑橘珠心胚說明無融合生殖可產生帶胚種子，三者不能互換。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：各 4 分，定義及典型例。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有無子葡萄都說成未曾受精。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=35","md":"95年果樹學_逐題教學詳解.md","search":"五名詞 ## 第一題｜五名詞（20 分）\n\n### 題意與作答範圍\n\n本題重點：**五名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=35)。\n\n### 先掌握答案\n\napomixis 無融合生殖；\n\nvéraison 葡萄轉色／始熟期，果粒軟化並開始明顯糖累積及著色；\n\naggregate fruit 聚合果，單花多離生子房形成，如番荔枝；\n\ntopping 打頂，去除較長梢段以調整生長；\n\neffective pollination period 有效授粉期，受柱頭接受性、花粉管生長時間及胚珠壽命共同限制。\n\n### 原理拆解：為什麼會這樣？\n\n**先問有沒有受精**\n\n單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。\n\n**為何沒有正常種子仍能結果**\n\n正常發育種子會提供或誘導支持子房生長的激素訊號。遺傳性單為結果或外施調節劑可在缺乏受精時提供相似支持；種子敗育型則可能在初期已建立足以使果實繼續生長的條件。\n\n**無子化與膨大必須分開思考**\n\n有子葡萄的無子化須依品種、花期以合適處理影響種子形成，花後可能另需促果粒膨大。時機錯誤會落果、穗軸或果粒異常；不能給一個濃度宣稱適用所有葡萄。無融合生殖是無正常有性受精而產胚，仍可有種子，並非同義詞。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| aggregate fruit 聚合果，單花多離生子房形成，如番荔枝； | 通常發育成果實的核心組織；附屬花部也可參與形成可食部。 |\n| effective pollination period 有效授粉期，受柱頭接受性、花粉管生長時間及胚珠壽命共同限制。 | 多在受精後形成種子，胚珠與子房兩者層級不同。 負責接受花粉，與花柱的支持及花粉管通道功能不同。 |\n\n### 可直接練寫的完整答案\n\napomixis 無融合生殖；\n\nvéraison 葡萄轉色／始熟期，果粒軟化並開始明顯糖累積及著色；\n\naggregate fruit 聚合果，單花多離生子房形成，如番荔枝；\n\ntopping 打頂，去除較長梢段以調整生長；\n\neffective pollination period 有效授粉期，受柱頭接受性、花粉管生長時間及胚珠壽命共同限制。\n\n單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。\n\n### 實例：把原理用在情境中\n\n栽培香蕉可用作單為結果例，許多無子葡萄作種子敗育例；柑橘珠心胚說明無融合生殖可產生帶胚種子，三者不能互換。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：各 4 分，定義及典型例。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有無子葡萄都說成未曾受精。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 95 果樹學"},{"id":"果樹學-95-二","s":"果樹學","y":95,"n":"二","t":"需冷量與地理配置（100 字內）","body":"<h2>第二題｜需冷量與地理配置（100 字內）（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>需冷量與地理配置（100 字內）<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=35\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>需冷量是解除芽內生休眠所需有效低溫。原則上高需冷種類配置較高海拔或北部，中需冷於中海拔，低需冷可於較暖低地；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>用限制來源分類<\/strong><\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p><strong>冬天的冷與春天的暖做不同工作<\/strong><\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<p><strong>技術必須對應真正瓶頸<\/strong><\/p>\n<p>摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>原題有限字要求；下列保留精簡作答，詳細原理請讀上方。<\/p>\n<p>需冷量是解除芽內生休眠所需有效低溫。原則上高需冷種類配置較高海拔或北部，中需冷於中海拔，低需冷可於較暖低地；仍須合併春季熱量、霜害與品種評估，如高山梨與平地低需冷桃。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：定義、三類配置與例，保持字數限制。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把需冷不足與萌芽後霜害混為同一問題。<\/li>\n<li>把教學詳解全部抄進考卷，超過原題字數限制。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=35","md":"95年果樹學_逐題教學詳解.md","search":"需冷量與地理配置（100 字內） ## 第二題｜需冷量與地理配置（100 字內）（10 分）\n\n### 題意與作答範圍\n\n本題重點：**需冷量與地理配置（100 字內）**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=35)。\n\n### 先掌握答案\n\n需冷量是解除芽內生休眠所需有效低溫。原則上高需冷種類配置較高海拔或北部，中需冷於中海拔，低需冷可於較暖低地；\n\n### 原理拆解：為什麼會這樣？\n\n**用限制來源分類**\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n**冬天的冷與春天的暖做不同工作**\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n**技術必須對應真正瓶頸**\n\n摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。\n\n### 可直接練寫的完整答案\n\n原題有限字要求；下列保留精簡作答，詳細原理請讀上方。\n\n需冷量是解除芽內生休眠所需有效低溫。原則上高需冷種類配置較高海拔或北部，中需冷於中海拔，低需冷可於較暖低地；仍須合併春季熱量、霜害與品種評估，如高山梨與平地低需冷桃。\n\n### 實例：把原理用在情境中\n\n平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：定義、三類配置與例，保持字數限制。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把需冷不足與萌芽後霜害混為同一問題。\n- 把教學詳解全部抄進考卷，超過原題字數限制。\n 95 果樹學"},{"id":"果樹學-95-三","s":"果樹學","y":95,"n":"三","t":"配置例外（50 字內）","body":"<h2>第三題｜配置例外（50 字內）（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>配置例外（50 字內）<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=35\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>平地高接梨可嫁接已在冷地完成需冷的花芽穗，於暖地開花結果，故栽培地本身不必滿足接穗冬季需冷。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>看似違反需冷配置，其實需求已在別處滿足<\/strong><\/p>\n<p>高接梨的花芽穗可在冷地形成並完成必要低溫，再移至低地嫁接；低地主要提供接合後的供水、養分與花果發育條件。這不是高需冷品種突然不需冷，而是感受低溫的地點和結果地點分開。每年接穗品質、嫁接成活與授粉仍是生產關鍵。<\/p>\n<p><strong>用限制來源分類<\/strong><\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p><strong>冬天的冷與春天的暖做不同工作<\/strong><\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<p><strong>技術必須對應真正瓶頸<\/strong><\/p>\n<p>摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。<\/p>\n<p><strong>形成層接觸是癒合的重要基礎<\/strong><\/p>\n<p>砧穗需健康且具親和性，切面平整並避免失水與污染。粗細不一致時至少對準一側形成層，不是只把木質部中心對在一起；綁紮須固定且不造成後續勒傷。<\/p>\n<p><strong>從癒傷橋到維管束連續<\/strong><\/p>\n<p>傷口附近細胞增生形成癒傷組織，接觸後建立連接，進一步形成連續形成層並分化新木質部與韌皮部，才逐漸恢復供水與同化物運輸。接穗短期萌芽可使用原存養分，不足以證明已成功癒合。<\/p>\n<p><strong>成功還包含長期親和性<\/strong><\/p>\n<p>砧木可影響樹勢、抗逆、礦養與成熟，但通常不會把接穗果實的基因型改成砧木品種。若有延遲不親和，早期成活後仍可能在接口或樹勢上出問題，須持續觀察。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>原題有限字要求；下列保留精簡作答，詳細原理請讀上方。<\/p>\n<p>平地高接梨可嫁接已在冷地完成需冷的花芽穗，於暖地開花結果，故栽培地本身不必滿足接穗冬季需冷。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。<\/p>\n<p>切接後接穗先抽芽但隨後萎凋，可能是儲藏養分暫時支持萌芽，維管束卻未充分連接；應回查形成層對準、保濕與砧穗親和。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：具名例與已完成需冷機制。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把需冷不足與萌芽後霜害混為同一問題。<\/li>\n<li>只對準髓部，忽略形成層。<\/li>\n<li>把教學詳解全部抄進考卷，超過原題字數限制。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=35","md":"95年果樹學_逐題教學詳解.md","search":"配置例外（50 字內） ## 第三題｜配置例外（50 字內）（10 分）\n\n### 題意與作答範圍\n\n本題重點：**配置例外（50 字內）**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=35)。\n\n### 先掌握答案\n\n平地高接梨可嫁接已在冷地完成需冷的花芽穗，於暖地開花結果，故栽培地本身不必滿足接穗冬季需冷。\n\n### 原理拆解：為什麼會這樣？\n\n**看似違反需冷配置，其實需求已在別處滿足**\n\n高接梨的花芽穗可在冷地形成並完成必要低溫，再移至低地嫁接；低地主要提供接合後的供水、養分與花果發育條件。這不是高需冷品種突然不需冷，而是感受低溫的地點和結果地點分開。每年接穗品質、嫁接成活與授粉仍是生產關鍵。\n\n**用限制來源分類**\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n**冬天的冷與春天的暖做不同工作**\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n**技術必須對應真正瓶頸**\n\n摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。\n\n**形成層接觸是癒合的重要基礎**\n\n砧穗需健康且具親和性，切面平整並避免失水與污染。粗細不一致時至少對準一側形成層，不是只把木質部中心對在一起；綁紮須固定且不造成後續勒傷。\n\n**從癒傷橋到維管束連續**\n\n傷口附近細胞增生形成癒傷組織，接觸後建立連接，進一步形成連續形成層並分化新木質部與韌皮部，才逐漸恢復供水與同化物運輸。接穗短期萌芽可使用原存養分，不足以證明已成功癒合。\n\n**成功還包含長期親和性**\n\n砧木可影響樹勢、抗逆、礦養與成熟，但通常不會把接穗果實的基因型改成砧木品種。若有延遲不親和，早期成活後仍可能在接口或樹勢上出問題，須持續觀察。\n\n### 可直接練寫的完整答案\n\n原題有限字要求；下列保留精簡作答，詳細原理請讀上方。\n\n平地高接梨可嫁接已在冷地完成需冷的花芽穗，於暖地開花結果，故栽培地本身不必滿足接穗冬季需冷。\n\n### 實例：把原理用在情境中\n\n平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。\n\n切接後接穗先抽芽但隨後萎凋，可能是儲藏養分暫時支持萌芽，維管束卻未充分連接；應回查形成層對準、保濕與砧穗親和。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：具名例與已完成需冷機制。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把需冷不足與萌芽後霜害混為同一問題。\n- 只對準髓部，忽略形成層。\n- 把教學詳解全部抄進考卷，超過原題字數限制。\n 95 果樹學"},{"id":"果樹學-95-四","s":"果樹學","y":95,"n":"四","t":"多年生育種困難","body":"<h2>第四題｜多年生育種困難（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>多年生育種困難<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=35\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>幼年期長與世代慢使雜交後多年才可評果，株體大需大片試驗地；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>幼年期長與世代慢使雜交後多年才可評果，株體大需大片試驗地；<\/p>\n<p>高雜合與自交不親和使優良基因難固定，果實品質、大小年及環境交互作用又需多季驗證。無性繁殖能保存優株卻會傳病，因此要結合健康母本、早選與多地試驗。<\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：至少四限制、原因與後果。<\/p>\n<ul>\n<li><strong>至少四限制<\/strong><\/li>\n<li><strong>原因與後果<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=35","md":"95年果樹學_逐題教學詳解.md","search":"多年生育種困難 ## 第四題｜多年生育種困難（10 分）\n\n### 題意與作答範圍\n\n本題重點：**多年生育種困難**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=35)。\n\n### 先掌握答案\n\n幼年期長與世代慢使雜交後多年才可評果，株體大需大片試驗地；\n\n### 原理拆解：為什麼會這樣？\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n### 可直接練寫的完整答案\n\n幼年期長與世代慢使雜交後多年才可評果，株體大需大片試驗地；\n\n高雜合與自交不親和使優良基因難固定，果實品質、大小年及環境交互作用又需多季驗證。無性繁殖能保存優株卻會傳病，因此要結合健康母本、早選與多地試驗。\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n### 實例：把原理用在情境中\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：至少四限制、原因與後果。\n\n- **至少四限制**\n- **原因與後果**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把轉入基因成功直接等同育成可商業化品種。\n 95 果樹學"},{"id":"果樹學-95-五","s":"果樹學","y":95,"n":"五","t":"源庫過程","body":"<h2>第五題｜源庫過程（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>源庫過程<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=35\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>葉肉合成糖後裝入篩管，經葉脈—葉柄—枝幹—果梗到果實卸載，果肉利用或液泡貯藏。輸送由源庫壓力差推動，跨膜運輸、胞間連絲、糖裂解與庫生長調節速率；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把源與庫接起來<\/strong><\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<p><strong>壓力流與跨膜運輸不是同一層次<\/strong><\/p>\n<p>源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；H⁺-ATPase 建立電化學梯度，可支援 H⁺／蔗糖共運輸。<\/p>\n<p><strong>庫強決定競爭，不只看果實大小<\/strong><\/p>\n<p>庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>葉肉合成糖後裝入篩管，經葉脈—葉柄—枝幹—果梗到果實卸載，果肉利用或液泡貯藏。輸送由源庫壓力差推動，跨膜運輸、胞間連絲、糖裂解與庫生長調節速率；<\/p>\n<p>不同發育期的途徑可變。<\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<p>源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；H⁺-ATPase 建立電化學梯度，可支援 H⁺／蔗糖共運輸。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：順序、壓力流、裝卸載路徑與調節。<\/p>\n<ul>\n<li><strong>壓力流<\/strong><\/li>\n<li><strong>裝卸載路徑與調節<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把長距離糖運輸寫成主要沿木質部。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=35","md":"95年果樹學_逐題教學詳解.md","search":"源庫過程 ## 第五題｜源庫過程（10 分）\n\n### 題意與作答範圍\n\n本題重點：**源庫過程**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=35)。\n\n### 先掌握答案\n\n葉肉合成糖後裝入篩管，經葉脈—葉柄—枝幹—果梗到果實卸載，果肉利用或液泡貯藏。輸送由源庫壓力差推動，跨膜運輸、胞間連絲、糖裂解與庫生長調節速率；\n\n### 原理拆解：為什麼會這樣？\n\n**先把源與庫接起來**\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n**壓力流與跨膜運輸不是同一層次**\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n**庫強決定競爭，不只看果實大小**\n\n庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。\n\n### 可直接練寫的完整答案\n\n葉肉合成糖後裝入篩管，經葉脈—葉柄—枝幹—果梗到果實卸載，果肉利用或液泡貯藏。輸送由源庫壓力差推動，跨膜運輸、胞間連絲、糖裂解與庫生長調節速率；\n\n不同發育期的途徑可變。\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n### 實例：把原理用在情境中\n\n同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：順序、壓力流、裝卸載路徑與調節。\n\n- **壓力流**\n- **裝卸載路徑與調節**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把長距離糖運輸寫成主要沿木質部。\n 95 果樹學"},{"id":"果樹學-95-六","s":"果樹學","y":95,"n":"六","t":"N、P、Ca、Fe、B 吸收移動與症狀","body":"<h2>第六題｜N、P、Ca、Fe、B 吸收移動與症狀（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>N、P、Ca、Fe、B 吸收移動與症狀<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=35\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>N 以 NO₃⁻、NH₄⁺ 吸收，體內易再移動，老葉均勻黃化；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>第一步是分清吸收、運輸與需求<\/strong><\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p><strong>用新老葉位置推理<\/strong><\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<p><strong>最後必須用適當樣本驗證<\/strong><\/p>\n<p>依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>N 以 NO₃⁻、NH₄⁺ 吸收，體內易再移動，老葉均勻黃化；<\/p>\n<p>P 常以 H₂PO₄⁻／HPO₄²⁻ 吸收、易移動，老葉暗綠或紫、長勢慢；<\/p>\n<p>Ca²⁺ 多隨木質部、難再移動，新葉畸形頂芽壞死及果實障礙；<\/p>\n<p>Fe 多經還原 Fe²⁺ 或螯合途徑吸收、難再移動，幼葉脈間黃化；<\/p>\n<p>B 主要 H₃BO₃，通常再移動有限，但山梨醇運輸果樹可較易移動，缺乏傷分生組織與結實。<\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：五元素各按吸收型態、移動、首發部位、症狀四欄寫，B 移動例外加註。<\/p>\n<ul>\n<li><strong>五元素各按吸收型態<\/strong><\/li>\n<li><strong>首發部位<\/strong><\/li>\n<li><strong>症狀四欄寫，B 移動例外加註<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>只寫缺肥會黃葉，沒有指出葉齡與黃化分布。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=35","md":"95年果樹學_逐題教學詳解.md","search":"n、p、ca、fe、b 吸收移動與症狀 ## 第六題｜n、p、ca、fe、b 吸收移動與症狀（20 分）\n\n### 題意與作答範圍\n\n本題重點：**n、p、ca、fe、b 吸收移動與症狀**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=35)。\n\n### 先掌握答案\n\nn 以 no₃⁻、nh₄⁺ 吸收，體內易再移動，老葉均勻黃化；\n\n### 原理拆解：為什麼會這樣？\n\n**第一步是分清吸收、運輸與需求**\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n**用新老葉位置推理**\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n**最後必須用適當樣本驗證**\n\n依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。\n\n### 可直接練寫的完整答案\n\nn 以 no₃⁻、nh₄⁺ 吸收，體內易再移動，老葉均勻黃化；\n\np 常以 h₂po₄⁻／hpo₄²⁻ 吸收、易移動，老葉暗綠或紫、長勢慢；\n\nca²⁺ 多隨木質部、難再移動，新葉畸形頂芽壞死及果實障礙；\n\nfe 多經還原 fe²⁺ 或螯合途徑吸收、難再移動，幼葉脈間黃化；\n\nb 主要 h₃bo₃，通常再移動有限，但山梨醇運輸果樹可較易移動，缺乏傷分生組織與結實。\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n### 實例：把原理用在情境中\n\n老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：五元素各按吸收型態、移動、首發部位、症狀四欄寫，b 移動例外加註。\n\n- **五元素各按吸收型態**\n- **首發部位**\n- **症狀四欄寫，b 移動例外加註**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 只寫缺肥會黃葉，沒有指出葉齡與黃化分布。\n 95 果樹學"},{"id":"果樹學-95-七","s":"果樹學","y":95,"n":"七","t":"木瓜輸日四難題","body":"<h2>第七題｜木瓜輸日四難題（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>木瓜輸日四難題<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=35\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>防傷腐敗：輕採、去乳汁、分級緩衝、清潔與採前病害管理；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>為何採後仍會變差<\/strong><\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p><strong>低溫有效，但有適用範圍<\/strong><\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<p><strong>把全程串起來<\/strong><\/p>\n<p>採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。<\/p>\n<p><strong>先建立可預防的栽培條件<\/strong><\/p>\n<p>健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。<\/p>\n<p><strong>監測後再選處理<\/strong><\/p>\n<p>定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。<\/p>\n<p><strong>整合與追蹤效果<\/strong><\/p>\n<p>不同手段應互相相容，保護天敵並避免抗藥性累積。處理後確認受害是否降低，保存用藥、環境與採收紀錄；有機生產也須依規範使用資材，並不代表可以省略病蟲管理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>防傷腐敗：輕採、去乳汁、分級緩衝、清潔與採前病害管理；<\/p>\n<p>減緩老化：適熟採與不致寒害冷鏈、適當氣體及乙烯管理；<\/p>\n<p>檢疫：依目的國核准蒸熱等程序、合格設施及防再污染包裝；<\/p>\n<p>食品安全：供果園用藥紀錄、依殘留限量與安全期、批次檢測及追溯文件。採後處理無法補救田間超標殘留。<\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。<\/p>\n<p>番茄管理可由健康苗、防蟲設施與田間監測降低媒介昆蟲傳播病毒的機會；已感染植株的處置與媒介控制須配合，不能只噴一次藥便認定病毒消失。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：四面向各約 5 分，技術、程序與可驗證紀錄。<\/p>\n<ul>\n<li><strong>四面向各約 5 分，技術<\/strong><\/li>\n<li><strong>程序與可驗證紀錄<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>認為溫度越低、保存效果一定越好。<\/li>\n<li>把有機栽培理解成完全不防治。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=35","md":"95年果樹學_逐題教學詳解.md","search":"木瓜輸日四難題 ## 第七題｜木瓜輸日四難題（20 分）\n\n### 題意與作答範圍\n\n本題重點：**木瓜輸日四難題**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=35)。\n\n### 先掌握答案\n\n防傷腐敗：輕採、去乳汁、分級緩衝、清潔與採前病害管理；\n\n### 原理拆解：為什麼會這樣？\n\n**為何採後仍會變差**\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n**低溫有效，但有適用範圍**\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n**把全程串起來**\n\n採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。\n\n**先建立可預防的栽培條件**\n\n健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。\n\n**監測後再選處理**\n\n定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。\n\n**整合與追蹤效果**\n\n不同手段應互相相容，保護天敵並避免抗藥性累積。處理後確認受害是否降低，保存用藥、環境與採收紀錄；有機生產也須依規範使用資材，並不代表可以省略病蟲管理。\n\n### 可直接練寫的完整答案\n\n防傷腐敗：輕採、去乳汁、分級緩衝、清潔與採前病害管理；\n\n減緩老化：適熟採與不致寒害冷鏈、適當氣體及乙烯管理；\n\n檢疫：依目的國核准蒸熱等程序、合格設施及防再污染包裝；\n\n食品安全：供果園用藥紀錄、依殘留限量與安全期、批次檢測及追溯文件。採後處理無法補救田間超標殘留。\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n### 實例：把原理用在情境中\n\n驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。\n\n番茄管理可由健康苗、防蟲設施與田間監測降低媒介昆蟲傳播病毒的機會；已感染植株的處置與媒介控制須配合，不能只噴一次藥便認定病毒消失。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：四面向各約 5 分，技術、程序與可驗證紀錄。\n\n- **四面向各約 5 分，技術**\n- **程序與可驗證紀錄**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 認為溫度越低、保存效果一定越好。\n- 把有機栽培理解成完全不防治。\n 95 果樹學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)
