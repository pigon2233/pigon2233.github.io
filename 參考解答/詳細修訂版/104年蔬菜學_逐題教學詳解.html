ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 7 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"蔬菜學-104-一","s":"蔬菜學","y":104,"n":"一","t":"臺灣蔬菜產業特性","body":"<h2>第一題｜臺灣蔬菜產業特性（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>臺灣蔬菜產業特性<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=9\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>種類多、短期輪作與複作密集，產地依平地冷涼季、暖季及高地分工；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>採後仍活著，也仍在消耗<\/strong><\/p>\n<p>蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。<\/p>\n<p><strong>低溫與保濕要兼顧氣體交換<\/strong><\/p>\n<p>快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。<\/p>\n<p><strong>截切菜需把安全與外觀一起管理<\/strong><\/p>\n<p>流程包括原料驗收、去除不良部位、適當清洗、切割、清洗消毒、瀝乾、包裝與冷藏配送，細節依設備與產品調整。消毒水須管控有效濃度、接觸時間與有機物負荷，目標包含避免交叉污染，並不等於滅菌。<\/p>\n<p><strong>F1 一致性來自親本與受控交配<\/strong><\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<p><strong>制種須阻止不需要的授粉<\/strong><\/p>\n<p>去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。<\/p>\n<p><strong>F2 分離是留種限制的主因<\/strong><\/p>\n<p>F1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>種類多、短期輪作與複作密集，產地依平地冷涼季、暖季及高地分工；<\/p>\n<p>以鮮銷、易腐與即時供貨為主，小農及勞力密集，颱風豪雨引起價格大幅波動。種苗與雜交育種具基礎，設施、契作、冷鏈及出口加工發展，但仍需分級、資訊與生產排程整合，避免追價過量種植。<\/p>\n<p>蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。<\/p>\n<p>快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>截切萵苣若只處理褐變而未瀝乾與維持冷鏈，仍可能滲液、腐敗或發生微生物風險；應用同批產品的外觀、失重與衛生檢測共同決定期限。<\/p>\n<p>西瓜 F1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 F1 果實留種所得下一代，不能保證維持原果形與整齊性。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：生態、經營、供需價格、技術與產銷例。<\/p>\n<ul>\n<li><strong>供需價格<\/strong><\/li>\n<li><strong>技術與產銷例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把清洗消毒寫成可以保證完全無菌。<\/li>\n<li>寫成 F1 種子完全不能發芽。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=9","md":"104年蔬菜學_逐題教學詳解.md","search":"臺灣蔬菜產業特性 ## 第一題｜臺灣蔬菜產業特性（15 分）\n\n### 題意與作答範圍\n\n本題重點：**臺灣蔬菜產業特性**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=9)。\n\n### 先掌握答案\n\n種類多、短期輪作與複作密集，產地依平地冷涼季、暖季及高地分工；\n\n### 原理拆解：為什麼會這樣？\n\n**採後仍活著，也仍在消耗**\n\n蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。\n\n**低溫與保濕要兼顧氣體交換**\n\n快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。\n\n**截切菜需把安全與外觀一起管理**\n\n流程包括原料驗收、去除不良部位、適當清洗、切割、清洗消毒、瀝乾、包裝與冷藏配送，細節依設備與產品調整。消毒水須管控有效濃度、接觸時間與有機物負荷，目標包含避免交叉污染，並不等於滅菌。\n\n**f1 一致性來自親本與受控交配**\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n**制種須阻止不需要的授粉**\n\n去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。\n\n**f2 分離是留種限制的主因**\n\nf1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。\n\n### 可直接練寫的完整答案\n\n種類多、短期輪作與複作密集，產地依平地冷涼季、暖季及高地分工；\n\n以鮮銷、易腐與即時供貨為主，小農及勞力密集，颱風豪雨引起價格大幅波動。種苗與雜交育種具基礎，設施、契作、冷鏈及出口加工發展，但仍需分級、資訊與生產排程整合，避免追價過量種植。\n\n蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。\n\n快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。\n\n### 實例：把原理用在情境中\n\n截切萵苣若只處理褐變而未瀝乾與維持冷鏈，仍可能滲液、腐敗或發生微生物風險；應用同批產品的外觀、失重與衛生檢測共同決定期限。\n\n西瓜 f1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 f1 果實留種所得下一代，不能保證維持原果形與整齊性。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：生態、經營、供需價格、技術與產銷例。\n\n- **供需價格**\n- **技術與產銷例**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把清洗消毒寫成可以保證完全無菌。\n- 寫成 f1 種子完全不能發芽。\n 104 蔬菜學"},{"id":"蔬菜學-104-二","s":"蔬菜學","y":104,"n":"二","t":"三有機酸與品質","body":"<h2>第二題｜三有機酸與品質（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>三有機酸與品質<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=9\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>常見可舉檸檬酸、蘋果酸、草酸。糖酸比影響番茄風味；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>酸的含量與酸的種類共同決定品質<\/strong><\/p>\n<p>檸檬酸、蘋果酸與草酸在風味、代謝及營養利用上的效果不同；相同可滴定酸度也不代表完全相同口感。糖酸比反映相對平衡，仍不能取代香氣與質地；採後呼吸可能消耗有機酸，故貯藏風味變化要同時測糖、酸與失水。<\/p>\n<p><strong>三種酵素要看反應而非只背名稱<\/strong><\/p>\n<p>轉化酶水解蔗糖，生成葡萄糖與果糖；蔗糖合成酶可逆地轉換蔗糖與 UDP-葡萄糖、果糖，在許多庫組織常參與裂解；蔗糖磷酸合成酶則參與蔗糖合成。不能因名稱含「合成」就斷定反應在所有組織一定只向合成方向。<\/p>\n<p><strong>酵素改變糖種類，也影響庫的吸引力<\/strong><\/p>\n<p>庫端把蔗糖裂解可維持輸入梯度、供呼吸和細胞壁合成，己糖也具滲透與訊號作用。若成熟期蔗糖合成加強、分解下降並有足夠運入，就可能較多累積蔗糖；但結果仍受細胞區室及液泡運輸限制。<\/p>\n<p><strong>不可用一次活性推全部品質<\/strong><\/p>\n<p>應比較發育時序、酵素位置、糖總量與含水。糖度較高可能因水少，不必然是酵素使糖總量提高；有機酸也受合成、呼吸利用與液泡貯藏影響，需與糖酸比、風味一起判讀。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>常見可舉檸檬酸、蘋果酸、草酸。糖酸比影響番茄風味；<\/p>\n<p>蘋果酸等參與呼吸、貯藏期間可能消耗而改口味；<\/p>\n<p>菠菜等草酸會結合鈣並形成口感澀感、降低部分鈣利用。適酸可促風味與加工品質，但過高酸未必符合鮮食市場，酸種類及含量須分別看。<\/p>\n<p>檸檬酸、蘋果酸與草酸在風味、代謝及營養利用上的效果不同；相同可滴定酸度也不代表完全相同口感。糖酸比反映相對平衡，仍不能取代香氣與質地；採後呼吸可能消耗有機酸，故貯藏風味變化要同時測糖、酸與失水。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>研究上可同測蔗糖、葡萄糖、果糖的含量與相關酵素，若只有轉化酶較高而糖輸入不足，仍不能推定成熟果一定更甜。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：三酸例、風味、營養／加工與代謝。<\/p>\n<ul>\n<li><strong>三酸例<\/strong><\/li>\n<li><strong>營養／加工與代謝<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把蔗糖合成酶等同只能合成蔗糖。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=9","md":"104年蔬菜學_逐題教學詳解.md","search":"三有機酸與品質 ## 第二題｜三有機酸與品質（15 分）\n\n### 題意與作答範圍\n\n本題重點：**三有機酸與品質**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=9)。\n\n### 先掌握答案\n\n常見可舉檸檬酸、蘋果酸、草酸。糖酸比影響番茄風味；\n\n### 原理拆解：為什麼會這樣？\n\n**酸的含量與酸的種類共同決定品質**\n\n檸檬酸、蘋果酸與草酸在風味、代謝及營養利用上的效果不同；相同可滴定酸度也不代表完全相同口感。糖酸比反映相對平衡，仍不能取代香氣與質地；採後呼吸可能消耗有機酸，故貯藏風味變化要同時測糖、酸與失水。\n\n**三種酵素要看反應而非只背名稱**\n\n轉化酶水解蔗糖，生成葡萄糖與果糖；蔗糖合成酶可逆地轉換蔗糖與 udp-葡萄糖、果糖，在許多庫組織常參與裂解；蔗糖磷酸合成酶則參與蔗糖合成。不能因名稱含「合成」就斷定反應在所有組織一定只向合成方向。\n\n**酵素改變糖種類，也影響庫的吸引力**\n\n庫端把蔗糖裂解可維持輸入梯度、供呼吸和細胞壁合成，己糖也具滲透與訊號作用。若成熟期蔗糖合成加強、分解下降並有足夠運入，就可能較多累積蔗糖；但結果仍受細胞區室及液泡運輸限制。\n\n**不可用一次活性推全部品質**\n\n應比較發育時序、酵素位置、糖總量與含水。糖度較高可能因水少，不必然是酵素使糖總量提高；有機酸也受合成、呼吸利用與液泡貯藏影響，需與糖酸比、風味一起判讀。\n\n### 可直接練寫的完整答案\n\n常見可舉檸檬酸、蘋果酸、草酸。糖酸比影響番茄風味；\n\n蘋果酸等參與呼吸、貯藏期間可能消耗而改口味；\n\n菠菜等草酸會結合鈣並形成口感澀感、降低部分鈣利用。適酸可促風味與加工品質，但過高酸未必符合鮮食市場，酸種類及含量須分別看。\n\n檸檬酸、蘋果酸與草酸在風味、代謝及營養利用上的效果不同；相同可滴定酸度也不代表完全相同口感。糖酸比反映相對平衡，仍不能取代香氣與質地；採後呼吸可能消耗有機酸，故貯藏風味變化要同時測糖、酸與失水。\n\n### 實例：把原理用在情境中\n\n研究上可同測蔗糖、葡萄糖、果糖的含量與相關酵素，若只有轉化酶較高而糖輸入不足，仍不能推定成熟果一定更甜。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：三酸例、風味、營養／加工與代謝。\n\n- **三酸例**\n- **營養／加工與代謝**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把蔗糖合成酶等同只能合成蔗糖。\n 104 蔬菜學"},{"id":"蔬菜學-104-三","s":"蔬菜學","y":104,"n":"三","t":"青蔥產業問題與因應","body":"<h2>第三題｜青蔥產業問題與因應（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>青蔥產業問題與因應<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=9\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>主要問題為豪雨淹水與熱害、土傳病及連作、採收清洗勞力、價格波動、健康種苗與規格不一致。可高畦排水、避雨或產區分散、健康苗與輪作、合理密度水肥、共同清洗分級冷鏈、契作與產銷資訊安排播期；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<p><strong>採後仍活著，也仍在消耗<\/strong><\/p>\n<p>蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。<\/p>\n<p><strong>低溫與保濕要兼顧氣體交換<\/strong><\/p>\n<p>快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。<\/p>\n<p><strong>截切菜需把安全與外觀一起管理<\/strong><\/p>\n<p>流程包括原料驗收、去除不良部位、適當清洗、切割、清洗消毒、瀝乾、包裝與冷藏配送，細節依設備與產品調整。消毒水須管控有效濃度、接觸時間與有機物負荷，目標包含避免交叉污染，並不等於滅菌。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>主要問題為豪雨淹水與熱害、土傳病及連作、採收清洗勞力、價格波動、健康種苗與規格不一致。可高畦排水、避雨或產區分散、健康苗與輪作、合理密度水肥、共同清洗分級冷鏈、契作與產銷資訊安排播期；<\/p>\n<p>應依大蔥、北蔥／四季蔥等材料區別，不以單一品種處理全部市場。<\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<p>截切萵苣若只處理褐變而未瀝乾與維持冷鏈，仍可能滲液、腐敗或發生微生物風險；應用同批產品的外觀、失重與衛生檢測共同決定期限。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：生產、健康、勞力市場與對應策略。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<li>把清洗消毒寫成可以保證完全無菌。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=9","md":"104年蔬菜學_逐題教學詳解.md","search":"青蔥產業問題與因應 ## 第三題｜青蔥產業問題與因應（15 分）\n\n### 題意與作答範圍\n\n本題重點：**青蔥產業問題與因應**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=9)。\n\n### 先掌握答案\n\n主要問題為豪雨淹水與熱害、土傳病及連作、採收清洗勞力、價格波動、健康種苗與規格不一致。可高畦排水、避雨或產區分散、健康苗與輪作、合理密度水肥、共同清洗分級冷鏈、契作與產銷資訊安排播期；\n\n### 原理拆解：為什麼會這樣？\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n**採後仍活著，也仍在消耗**\n\n蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。\n\n**低溫與保濕要兼顧氣體交換**\n\n快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。\n\n**截切菜需把安全與外觀一起管理**\n\n流程包括原料驗收、去除不良部位、適當清洗、切割、清洗消毒、瀝乾、包裝與冷藏配送，細節依設備與產品調整。消毒水須管控有效濃度、接觸時間與有機物負荷，目標包含避免交叉污染，並不等於滅菌。\n\n### 可直接練寫的完整答案\n\n主要問題為豪雨淹水與熱害、土傳病及連作、採收清洗勞力、價格波動、健康種苗與規格不一致。可高畦排水、避雨或產區分散、健康苗與輪作、合理密度水肥、共同清洗分級冷鏈、契作與產銷資訊安排播期；\n\n應依大蔥、北蔥／四季蔥等材料區別，不以單一品種處理全部市場。\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n### 實例：把原理用在情境中\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n截切萵苣若只處理褐變而未瀝乾與維持冷鏈，仍可能滲液、腐敗或發生微生物風險；應用同批產品的外觀、失重與衛生檢測共同決定期限。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：生產、健康、勞力市場與對應策略。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將連作障礙全部歸因於缺肥。\n- 把清洗消毒寫成可以保證完全無菌。\n 104 蔬菜學"},{"id":"蔬菜學-104-四","s":"蔬菜學","y":104,"n":"四","t":"節水的株型與管理","body":"<h2>第四題｜節水的株型與管理（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>節水的株型與管理<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=9\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>選根深健、較高水分利用效率、適應當地溫熱、適當葉面積與早熟材料，避免耗水過旺品種；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先理解水勢與膨壓<\/strong><\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p><strong>由缺水到減產的連鎖<\/strong><\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<p><strong>管理不是只問澆多少<\/strong><\/p>\n<p>應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>選根深健、較高水分利用效率、適應當地溫熱、適當葉面積與早熟材料，避免耗水過旺品種；<\/p>\n<p>採滴灌／水肥一體化、覆蓋、土壤有機質、監測根域、適當密度與生育期優先供水。並非葉越小就一定高產節水，氣孔限制與減葉會降低碳固定，須以單位水商品產量評估。<\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：形態／生理選擇、供水技術、土壤與取捨指標。<\/p>\n<ul>\n<li><strong>形態／生理選擇<\/strong><\/li>\n<li><strong>供水技術<\/strong><\/li>\n<li><strong>土壤與取捨指標<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把有水等同根一定能吸到水。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=9","md":"104年蔬菜學_逐題教學詳解.md","search":"節水的株型與管理 ## 第四題｜節水的株型與管理（15 分）\n\n### 題意與作答範圍\n\n本題重點：**節水的株型與管理**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=9)。\n\n### 先掌握答案\n\n選根深健、較高水分利用效率、適應當地溫熱、適當葉面積與早熟材料，避免耗水過旺品種；\n\n### 原理拆解：為什麼會這樣？\n\n**先理解水勢與膨壓**\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n**由缺水到減產的連鎖**\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n**管理不是只問澆多少**\n\n應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。\n\n### 可直接練寫的完整答案\n\n選根深健、較高水分利用效率、適應當地溫熱、適當葉面積與早熟材料，避免耗水過旺品種；\n\n採滴灌／水肥一體化、覆蓋、土壤有機質、監測根域、適當密度與生育期優先供水。並非葉越小就一定高產節水，氣孔限制與減葉會降低碳固定，須以單位水商品產量評估。\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n### 實例：把原理用在情境中\n\n旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時 發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。\n\n**劣化涉及膜與修復能力**\n\n貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。\n\n**保存與檢測依種子特性選擇**\n\n耐乾燥的正貯型種子通常可適度乾燥、低溫與防潮保存；不耐乾燥的種子不能照抄同法。發芽試驗、加速老化、導電度或低溫試驗各反映不同面向，須選適合作物的條件與標準。\n\n### 可直接練寫的完整答案\n\n兩者多屬正儲型可乾燥種子，但蔥種子一般較短命，須更嚴格低溫乾燥與品質監測；\n\n甘藍較耐存亦會受高溫高濕劣化。脂質過氧化攻擊膜不飽和脂肪酸，產生過氧化物與醛類，破壞膜完整性、酵素及胞器，造成滲漏、發芽慢與異常苗。適水分乾燥、密封低溫及避免反覆吸濕可延壽。\n\n發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。\n\n貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。\n\n### 實例：把原理用在情境中\n\n蔥種子貯藏後即使標準發芽率尚可，活力降低也可能使育苗出苗不整；先做活力或小規模出苗比較，比直接增加播種密度更能掌握苗數。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：相對壽命、保存條件、膜氧化機制與活力症狀。\n\n- **相對壽命**\n- **保存條件**\n- **膜氧化機制與活力症狀**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有未發芽種子都判為死亡，漏掉休眠。\n 104 蔬菜學"},{"id":"蔬菜學-104-六","s":"蔬菜學","y":104,"n":"六","t":"瓜類整枝方法","body":"<h2>第六題｜瓜類整枝方法（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>瓜類整枝方法<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=9\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>依物種結果節位與市場規格選留主蔓／子蔓／孫蔓，適時摘心、除無效側芽、引蔓搭架、疏葉與疏果，保留健康受光葉支援目標果。甜瓜可在選定結果側蔓留果後摘心，西瓜留 2–3 蔓配授粉果位，苦瓜則搭棚整蔓；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>結果節位先由作物與品種決定<\/strong><\/p>\n<p>不同瓜類雌花或兩性花出現於主蔓、子蔓、孫蔓的習性不同，整枝應據此保留有效結果枝。不能把甜瓜、胡瓜、苦瓜與西瓜全部套用相同摘心節位。<\/p>\n<p><strong>整枝是調整葉果關係與通風<\/strong><\/p>\n<p>去除不需要的側枝可降低競爭、方便授粉採收並改善通風；同時保留果實所需的供源葉。疏果決定庫數目，摘心決定後續生長，兩者須一起考慮目標果重與品質。<\/p>\n<p><strong>操作規格隨栽培系統調整<\/strong><\/p>\n<p>露地與立體栽培、單蔓與多蔓、早熟與連續採收的需求不同。應先交代系統，再寫保留枝蔓、結果節位與留果量；過早重摘葉可能減少供碳並增加日燒。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>依物種結果節位與市場規格選留主蔓／子蔓／孫蔓，適時摘心、除無效側芽、引蔓搭架、疏葉與疏果，保留健康受光葉支援目標果。甜瓜可在選定結果側蔓留果後摘心，西瓜留 2–3 蔓配授粉果位，苦瓜則搭棚整蔓；<\/p>\n<p>操作過度會減同化源與日燒。<\/p>\n<p>不同瓜類雌花或兩性花出現於主蔓、子蔓、孫蔓的習性不同，整枝應據此保留有效結果枝。不能把甜瓜、胡瓜、苦瓜與西瓜全部套用相同摘心節位。<\/p>\n<p>去除不需要的側枝可降低競爭、方便授粉採收並改善通風；同時保留果實所需的供源葉。疏果決定庫數目，摘心決定後續生長，兩者須一起考慮目標果重與品質。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>網室直立甜瓜可依品種在合適子蔓上留果，控制留果數並保留上方健康葉；露地西瓜多蔓留果的操作不能直接照搬同一節位表。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：至少五操作、器官形成膨大、各瓜例與葉果比。<\/p>\n<ul>\n<li><strong>至少五操作<\/strong><\/li>\n<li><strong>器官形成膨大<\/strong><\/li>\n<li><strong>各瓜例與葉果比<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>只寫摘心，未說要促生或保留哪一級枝蔓。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=9","md":"104年蔬菜學_逐題教學詳解.md","search":"瓜類整枝方法 ## 第六題｜瓜類整枝方法（15 分）\n\n### 題意與作答範圍\n\n本題重點：**瓜類整枝方法**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=9)。\n\n### 先掌握答案\n\n依物種結果節位與市場規格選留主蔓／子蔓／孫蔓，適時摘心、除無效側芽、引蔓搭架、疏葉與疏果，保留健康受光葉支援目標果。甜瓜可在選定結果側蔓留果後摘心，西瓜留 2–3 蔓配授粉果位，苦瓜則搭棚整蔓；\n\n### 原理拆解：為什麼會這樣？\n\n**結果節位先由作物與品種決定**\n\n不同瓜類雌花或兩性花出現於主蔓、子蔓、孫蔓的習性不同，整枝應據此保留有效結果枝。不能把甜瓜、胡瓜、苦瓜與西瓜全部套用相同摘心節位。\n\n**整枝是調整葉果關係與通風**\n\n去除不需要的側枝可降低競爭、方便授粉採收並改善通風；同時保留果實所需的供源葉。疏果決定庫數目，摘心決定後續生長，兩者須一起考慮目標果重與品質。\n\n**操作規格隨栽培系統調整**\n\n露地與立體栽培、單蔓與多蔓、早熟與連續採收的需求不同。應先交代系統，再寫保留枝蔓、結果節位與留果量；過早重摘葉可能減少供碳並增加日燒。\n\n### 可直接練寫的完整答案\n\n依物種結果節位與市場規格選留主蔓／子蔓／孫蔓，適時摘心、除無效側芽、引蔓搭架、疏葉與疏果，保留健康受光葉支援目標果。甜瓜可在選定結果側蔓留果後摘心，西瓜留 2–3 蔓配授粉果位，苦瓜則搭棚整蔓；\n\n操作過度會減同化源與日燒。\n\n不同瓜類雌花或兩性花出現於主蔓、子蔓、孫蔓的習性不同，整枝應據此保留有效結果枝。不能把甜瓜、胡瓜、苦瓜與西瓜全部套用相同摘心節位。\n\n去除不需要的側枝可降低競爭、方便授粉採收並改善通風；同時保留果實所需的供源葉。疏果決定庫數目，摘心決定後續生長，兩者須一起考慮目標果重與品質。\n\n### 實例：把原理用在情境中\n\n網室直立甜瓜可依品種在合適子蔓上留果，控制留果數並保留上方健康葉；露地西瓜多蔓留果的操作不能直接照搬同一節位表。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：至少五操作、器官形成膨大、各瓜例與葉果比。\n\n- **至少五操作**\n- **器官形成膨大**\n- **各瓜例與葉果比**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 只寫摘心，未說要促生或保留哪一級枝蔓。\n 104 蔬菜學"},{"id":"蔬菜學-104-七","s":"蔬菜學","y":104,"n":"七","t":"草莓凍害英文翻譯","body":"<h2>第七題｜草莓凍害英文翻譯（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>草莓凍害英文翻譯<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=9\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。<\/p>\n<h3>完整參考譯文<\/h3>\n<p>低於冰點的溫度是溫帶草莓生產的重要限制，因此以隧道及行間覆蓋等保護栽培克服。草莓可馴化於寒冷，透過容忍根冠組織形成冰而在零下存活，其方式是水分由細胞內移至細胞外，形成細胞外冰。未保護根冠在 −9°C 可嚴重受傷，經馴化者約 −12°C 可死亡，依品種而異。春季花序開始伸展後，花器在 −1°C 便容易受損。<\/p>\n<h3>讀懂這段研究在說什麼<\/h3>\n<p><strong>根冠耐凍與花器敏感度不同<\/strong><\/p>\n<p>草莓根冠與花器是不同器官，耐低溫程度和受測階段也不同。細胞外形成冰使細胞脫水，與細胞內大量結冰造成的傷害不同。−9、−12 與 −1°C 各對應不同材料或器官，不能合併成一個草莓的固定死亡溫度；原文的品種限制也須翻出。<\/p>\n<h3>專業詞彙與翻譯辨析<\/h3>\n<table>\n<thead>\n<tr>\n<th>英文用語<\/th>\n<th>建議譯法<\/th>\n<th>讀法與限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>acclimation<\/td>\n<td>馴化<\/td>\n<td>個體對環境逐步調整<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>配分重點與檢查順序<\/h3>\n<p>10 分：細胞外結冰、馴化、三溫度與花器更敏感，保留原文條件。<\/p>\n<p>先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。<\/p>\n<h3>常見失分<\/h3>\n<ul>\n<li>把專業名詞按一般字義翻譯，或把相關性改成因果。<\/li>\n<li>省略轉折、條件或限制，使研究結論比原文更強。<\/li>\n<li>以摘要取代全文翻譯。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=9","md":"104年蔬菜學_逐題教學詳解.md","search":"草莓凍害英文翻譯 ## 第七題｜草莓凍害英文翻譯（10 分）\n\n### 題意與作答範圍\n\n本題重點：**草莓凍害英文翻譯**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=9)。\n\n### 先掌握答案\n\n這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。\n\n### 完整參考譯文\n\n低於冰點的溫度是溫帶草莓生產的重要限制，因此以隧道及行間覆蓋等保護栽培克服。草莓可馴化於寒冷，透過容忍根冠組織形成冰而在零下存活，其方式是水分由細胞內移至細胞外，形成細胞外冰。未保護根冠在 −9°c 可嚴重受傷，經馴化者約 −12°c 可死亡，依品種而異。春季花序開始伸展後，花器在 −1°c 便容易受損。\n\n### 讀懂這段研究在說什麼\n\n**根冠耐凍與花器敏感度不同**\n\n草莓根冠與花器是不同器官，耐低溫程度和受測階段也不同。細胞外形成冰使細胞脫水，與細胞內大量結冰造成的傷害不同。−9、−12 與 −1°c 各對應不同材料或器官，不能合併成一個草莓的固定死亡溫度；原文的品種限制也須翻出。\n\n### 專業詞彙與翻譯辨析\n\n| 英文用語 | 建議譯法 | 讀法與限制 |\n| --- | --- | --- |\n| acclimation | 馴化 | 個體對環境逐步調整 |\n\n### 配分重點與檢查順序\n\n10 分：細胞外結冰、馴化、三溫度與花器更敏感，保留原文條件。\n\n先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。\n\n### 常見失分\n\n- 把專業名詞按一般字義翻譯，或把相關性改成因果。\n- 省略轉折、條件或限制，使研究結論比原文更強。\n- 以摘要取代全文翻譯。\n 104 蔬菜學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
