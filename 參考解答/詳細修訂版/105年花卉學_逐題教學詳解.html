ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 5 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"花卉學-105-一","s":"花卉學","y":105,"n":"一","t":"洋桔梗國際鏈六小題","body":"<h2>第一題｜洋桔梗國際鏈六小題（35 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>洋桔梗國際鏈六小題<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=5\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>翻譯：臺灣洋桔梗切花生產是特殊的園藝方式，也是全球農業事業。雖原產美洲，市場多數商業品種由日本育成；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>從育苗障礙連到國際供應鏈<\/strong><\/p>\n<p>洋桔梗細種子發芽與早期苗期不整齊，會放大後續株高、抽薹與採收時間差異；高溫誘發簇生又可能使部分苗無法按期抽薹。專業種苗分工、品種與苗期環控的價值，在於把關鍵風險集中於可控制環節；成品端仍須採收分級、冷鏈與市場規格，不能只靠臺灣冬季氣候優勢。<\/p>\n<p><strong>微小種子使早期整齊度特別重要<\/strong><\/p>\n<p>種子小、儲藏資源有限，播種深度、光、水分及介質均一度影響出苗。表面不厚覆土並保持適當濕度，不等同讓種子長期浸水；根域仍須供氧與衛生。<\/p>\n<p><strong>高溫敏感苗期可能形成簇生<\/strong><\/p>\n<p>部分品系幼苗遇高溫後節間短、葉呈蓮座而不抽薹，稱簇生或蓮座化。這是發育反應，並非單純缺氮；品系、感受時期與溫度歷程共同決定程度，須以適合播期和育苗環控預防。<\/p>\n<p><strong>恢復抽薹與成品開花是接續階段<\/strong><\/p>\n<p>有效低溫可改善某些簇生材料，長日與適溫也影響後續抽薹開花；但不能用一組條件保證所有品種。專業育苗若先提供整齊健康苗，成品端仍需合理密度、支網、肥水與採收管理。<\/p>\n<p><strong>先說明產品和統計口徑<\/strong><\/p>\n<p>市場題應區分產量、產值、種植面積、批發與零售，以及指定年度與地區。鮮切花、盆花與蔬菜供應鏈的商品單位不同，不能把總量或售價直接互相比較。<\/p>\n<p><strong>產銷差異有可解釋的環節<\/strong><\/p>\n<p>分級、包裝、耗損、運輸、冷藏與交易成本都會影響售價；產品易腐、需求集中及天候變動會加劇短期波動。要用流程解釋差異，避免只列「成本高」而未指出環節。<\/p>\n<p><strong>歷史答案不能用今天資料代填<\/strong><\/p>\n<p>考古題要求某年排名、當時市場型態或事件時，應採當年資料。若未取得可核對的舊資料，應揭露限制；若有精確數字，列單位及來源，使讀者能確認比較基準。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>翻譯：臺灣洋桔梗切花生產是特殊的園藝方式，也是全球農業事業。雖原產美洲，市場多數商業品種由日本育成；<\/p>\n<p>日本公司售出的種子在丹麥播種育穴盤苗，約 70 天後可空運，臺灣業者採丹麥苗生產冬季切花，多外銷日本。微小種子自日本出發，旅居海外約 6–9 個月、跨越兩萬多公里，最後以亮麗花姿回到日本。其臺灣產區可舉彰化、雲林、嘉義；<\/p>\n<p>簇生化是節間短、葉叢生不抽莖，幼苗高溫易誘發，選耐簇生品種與冷涼育苗可防，低溫處理可恢復部分材料。多數為量性長日植物；<\/p>\n<p>臺灣冬季乾暖、成本與品質具供貨優勢。種子多為好光性，播種表面不厚覆土、維持濕度與適宜散射光。<\/p>\n<p>洋桔梗細種子發芽與早期苗期不整齊，會放大後續株高、抽薹與採收時間差異；高溫誘發簇生又可能使部分苗無法按期抽薹。專業種苗分工、品種與苗期環控的價值，在於把關鍵風險集中於可控制環節；成品端仍須採收分級、冷鏈與市場規格，不能只靠臺灣冬季氣候優勢。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>冬季切花若苗期一部分受高溫簇生，定植後即可能同田有正常抽薹株與蓮座株，採收難集中；應從種苗批次溫度與品系查起，不能只全面追加肥料。<\/p>\n<p>同年度產量最多的蔬菜未必產值最高，因為商品單價與品質不同；花卉拍賣價也不能直接當作零售花店售價。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>35 分：翻譯 10；產地、簇生、光週期、日本進口理由、好光播種各 5。<\/p>\n<ul>\n<li><strong>翻譯 10<\/strong><\/li>\n<li><strong>光週期<\/strong><\/li>\n<li><strong>日本進口理由<\/strong><\/li>\n<li><strong>好光播種各 5<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把簇生化說成分枝很多且越多越好。<\/li>\n<li>混用年度、產量與產值排名。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=5","md":"105年花卉學_逐題教學詳解.md","search":"洋桔梗國際鏈六小題 ## 第一題｜洋桔梗國際鏈六小題（35 分）\n\n### 題意與作答範圍\n\n本題重點：**洋桔梗國際鏈六小題**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=5)。\n\n### 先掌握答案\n\n翻譯：臺灣洋桔梗切花生產是特殊的園藝方式，也是全球農業事業。雖原產美洲，市場多數商業品種由日本育成；\n\n### 原理拆解：為什麼會這樣？\n\n**從育苗障礙連到國際供應鏈**\n\n洋桔梗細種子發芽與早期苗期不整齊，會放大後續株高、抽薹與採收時間差異；高溫誘發簇生又可能使部分苗無法按期抽薹。專業種苗分工、品種與苗期環控的價值，在於把關鍵風險集中於可控制環節；成品端仍須採收分級、冷鏈與市場規格，不能只靠臺灣冬季氣候優勢。\n\n**微小種子使早期整齊度特別重要**\n\n種子小、儲藏資源有限，播種深度、光、水分及介質均一度影響出苗。表面不厚覆土並保持適當濕度，不等同讓種子長期浸水；根域仍須供氧與衛生。\n\n**高溫敏感苗期可能形成簇生**\n\n部分品系幼苗遇高溫後節間短、葉呈蓮座而不抽薹，稱簇生或蓮座化。這是發育反應，並非單純缺氮；品系、感受時期與溫度歷程共同決定程度，須以適合播期和育苗環控預防。\n\n**恢復抽薹與成品開花是接續階段**\n\n有效低溫可改善某些簇生材料，長日與適溫也影響後續抽薹開花；但不能用一組條件保證所有品種。專業育苗若先提供整齊健康苗，成品端仍需合理密度、支網、肥水與採收管理。\n\n**先說明產品和統計口徑**\n\n市場題應區分產量、產值、種植面積、批發與零售，以及指定年度與地區。鮮切花、盆花與蔬菜供應鏈的商品單位不同，不能把總量或售價直接互相比較。\n\n**產銷差異有可解釋的環節**\n\n分級、包裝、耗損、運輸、冷藏與交易成本都會影響售價；產品易腐、需求集中及天候變動會加劇短期波動。要用流程解釋差異，避免只列「成本高」而未指出環節。\n\n**歷史答案不能用今天資料代填**\n\n考古題要求某年排名、當時市場型態或事件時，應採當年資料。若未取得可核對的舊資料，應揭露限制；若有精確數字，列單位及來源，使讀者能確認比較基準。\n\n### 可直接練寫的完整答案\n\n翻譯：臺灣洋桔梗切花生產是特殊的園藝方式，也是全球農業事業。雖原產美洲，市場多數商業品種由日本育成；\n\n日本公司售出的種子在丹麥播種育穴盤苗，約 70 天後可空運，臺灣業者採丹麥苗生產冬季切花，多外銷日本。微小種子自日本出發，旅居海外約 6–9 個月、跨越兩萬多公里，最後以亮麗花姿回到日本。其臺灣產區可舉彰化、雲林、嘉義；\n\n簇生化是節間短、葉叢生不抽莖，幼苗高溫易誘發，選耐簇生品種與冷涼育苗可防，低溫處理可恢復部分材料。多數為量性長日植物；\n\n臺灣冬季乾暖、成本與品質具供貨優勢。種子多為好光性，播種表面不厚覆土、維持濕度與適宜散射光。\n\n洋桔梗細種子發芽與早期苗期不整齊，會放大後續株高、抽薹與採收時間差異；高溫誘發簇生又可能使部分苗無法按期抽薹。專業種苗分工、品種與苗期環控的價值，在於把關鍵風險集中於可控制環節；成品端仍須採收分級、冷鏈與市場規格，不能只靠臺灣冬季氣候優勢。\n\n### 實例：把原理用在情境中\n\n冬季切花若苗期一部分受高溫簇生，定植後即可能同田有正常抽薹株與蓮座株，採收難集中；應從種苗批次溫度與品系查起，不能只全面追加肥料。\n\n同年度產量最多的蔬菜未必產值最高，因為商品單價與品質不同；花卉拍賣價也不能直接當作零售花店售價。\n\n### 配分重點：哪些內容不能漏？\n\n35 分：翻譯 10；產地、簇生、光週期、日本進口理由、好光播種各 5。\n\n- **翻譯 10**\n- **光週期**\n- **日本進口理由**\n- **好光播種各 5**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把簇生化說成分枝很多且越多越好。\n- 混用年度、產量與產值排名。\n 105 花卉學"},{"id":"花卉學-105-二","s":"花卉學","y":105,"n":"二","t":"十種花序","body":"<h2>第二題｜十種花序（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>十種花序<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=5\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>馬鞭草：無限穗狀（若指美女櫻須註材料）；<\/p>\n<p>紅蝴蝶若指洋金鳳：無限總狀；<\/p>\n<p>仙丹花：有限複聚繖；<\/p>\n<p>唐菖蒲：無限穗狀；<\/p>\n<p>棋盤腳：無限總狀；<\/p>\n<p>樟樹：無限圓錐；<\/p>\n<p>向日葵：無限頭狀；<\/p>\n<p>火鶴：無限肉穗；<\/p>\n<p>石竹：有限聚繖；<\/p>\n<p>文殊蘭：園藝教材常列無限繖形，發育分類亦有繖形狀聚繖解釋。無限主軸持續、有限以頂花終止，開花序列是判準。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先看主軸頂端是否終止於花<\/strong><\/p>\n<p>無限花序主軸可持續延伸，常見基部或周緣先開、往頂端或中心續開；有限花序主軸以頂花終止，後由側軸接續，常見頂端或中央先開。需看發育次序，不只看成熟時外形。<\/p>\n<p><strong>再看花梗、軸長與分枝<\/strong><\/p>\n<p>總狀花序具明顯主軸與有梗小花；穗狀小花無梗或近無梗；繖形花梗集中於近同一點；頭狀花序小花密集於膨大花托；肉穗花序的花軸肉質，常伴佛焰苞。<\/p>\n<p><strong>複合結構與俗名要註清<\/strong><\/p>\n<p>圓錐花序常由分枝總狀系統構成，複聚繖則由有限分枝重複。某些花序外觀近似繖形但發育屬聚繖，教材口徑可能不同，答題可在主要分類後註明，不宜用外形直接否定發育分類。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>馬鞭草：無限穗狀（若指美女櫻須註材料）；<\/p>\n<p>紅蝴蝶若指洋金鳳：無限總狀；<\/p>\n<p>仙丹花：有限複聚繖；<\/p>\n<p>唐菖蒲：無限穗狀；<\/p>\n<p>棋盤腳：無限總狀；<\/p>\n<p>樟樹：無限圓錐；<\/p>\n<p>向日葵：無限頭狀；<\/p>\n<p>火鶴：無限肉穗；<\/p>\n<p>石竹：有限聚繖；<\/p>\n<p>文殊蘭：園藝教材常列無限繖形，發育分類亦有繖形狀聚繖解釋。無限主軸持續、有限以頂花終止，開花序列是判準。<\/p>\n<p>無限花序主軸可持續延伸，常見基部或周緣先開、往頂端或中心續開；有限花序主軸以頂花終止，後由側軸接續，常見頂端或中央先開。需看發育次序，不只看成熟時外形。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>向日葵看似一朵大花，實為多個舌狀與管狀小花構成頭狀花序；火鶴則以肉穗花序承載許多小花，外側顯著彩色部分是佛焰苞。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：各 2 分，先有限／無限，再專用名稱；俗名歧義需註。<\/p>\n<ul>\n<li><strong>各 2 分，先有限／無限，再專用名稱<\/strong><\/li>\n<li><strong>俗名歧義需註<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把花序名稱與花冠形狀混寫。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=5","md":"105年花卉學_逐題教學詳解.md","search":"十種花序 ## 第二題｜十種花序（20 分）\n\n### 題意與作答範圍\n\n本題重點：**十種花序**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=5)。\n\n### 先掌握答案\n\n馬鞭草：無限穗狀（若指美女櫻須註材料）；\n\n紅蝴蝶若指洋金鳳：無限總狀；\n\n仙丹花：有限複聚繖；\n\n唐菖蒲：無限穗狀；\n\n棋盤腳：無限總狀；\n\n樟樹：無限圓錐；\n\n向日葵：無限頭狀；\n\n火鶴：無限肉穗；\n\n石竹：有限聚繖；\n\n文殊蘭：園藝教材常列無限繖形，發育分類亦有繖形狀聚繖解釋。無限主軸持續、有限以頂花終止，開花序列是判準。\n\n### 原理拆解：為什麼會這樣？\n\n**先看主軸頂端是否終止於花**\n\n無限花序主軸可持續延伸，常見基部或周緣先開、往頂端或中心續開；有限花序主軸以頂花終止，後由側軸接續，常見頂端或中央先開。需看發育次序，不只看成熟時外形。\n\n**再看花梗、軸長與分枝**\n\n總狀花序具明顯主軸與有梗小花；穗狀小花無梗或近無梗；繖形花梗集中於近同一點；頭狀花序小花密集於膨大花托；肉穗花序的花軸肉質，常伴佛焰苞。\n\n**複合結構與俗名要註清**\n\n圓錐花序常由分枝總狀系統構成，複聚繖則由有限分枝重複。某些花序外觀近似繖形但發育屬聚繖，教材口徑可能不同，答題可在主要分類後註明，不宜用外形直接否定發育分類。\n\n### 可直接練寫的完整答案\n\n馬鞭草：無限穗狀（若指美女櫻須註材料）；\n\n紅蝴蝶若指洋金鳳：無限總狀；\n\n仙丹花：有限複聚繖；\n\n唐菖蒲：無限穗狀；\n\n棋盤腳：無限總狀；\n\n樟樹：無限圓錐；\n\n向日葵：無限頭狀；\n\n火鶴：無限肉穗；\n\n石竹：有限聚繖；\n\n文殊蘭：園藝教材常列無限繖形，發育分類亦有繖形狀聚繖解釋。無限主軸持續、有限以頂花終止，開花序列是判準。\n\n無限花序主軸可持續延伸，常見基部或周緣先開、往頂端或中心續開；有限花序主軸以頂花終止，後由側軸接續，常見頂端或中央先開。需看發育次序，不只看成熟時外形。\n\n### 實例：把原理用在情境中\n\n向日葵看似一朵大花，實為多個舌狀與管狀小花構成頭狀花序；火鶴則以肉穗花序承載許多小花，外側顯著彩色部分是佛焰苞。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：各 2 分，先有限／無限，再專用名稱；俗名歧義需註。\n\n- **各 2 分，先有限／無限，再專用名稱**\n- **俗名歧義需註**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把花序名稱與花冠形狀混寫。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 105 花卉學"},{"id":"花卉學-105-三","s":"花卉學","y":105,"n":"三","t":"五種蘭的固碳型","body":"<h2>第三題｜五種蘭的固碳型（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五種蘭的固碳型<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=5\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>常見栽培群可答文心蘭 C3、仙履蘭 C3、春石斛偏 C3／可具兼性 CAM、秋石斛 CAM、萬代蘭 CAM。蘭科內同屬不同種、葉厚與水分環境會影響表現，不能只憑屬名一概而論。C3 主要白天固定 CO₂；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>夜間固定與白天利用在時間上分開<\/strong><\/p>\n<p>典型 CAM 植物夜間較易開氣孔，由 PEPC 將 CO₂ 固定為有機酸並貯存於液泡；白天多關閉氣孔，有機酸脫羧提供 CO₂，供卡爾文循環利用。並不是白天完全不進行光合作用。<\/p>\n<p><strong>圖要同時畫氣孔與酸度<\/strong><\/p>\n<p>典型日韻律為夜間酸度上升、清晨偏高，白天去酸、傍晚偏低；外界 CO₂ 淨吸收主要在夜間。實際常有清晨、傍晚過渡階段，乾旱或發育條件也可能改變曲線。<\/p>\n<p><strong>分類與灌溉要承認物種差異<\/strong><\/p>\n<p>C₃、C₄ 與 CAM 不是依葉片厚薄就能判定，兼性 CAM 會依環境調整。蘭科包含不同固碳途徑，不能把所有蘭都列 CAM；耐旱也不代表高產時不需供水或根部可以長期缺氧。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>常見栽培群可答文心蘭 C3、仙履蘭 C3、春石斛偏 C3／可具兼性 CAM、秋石斛 CAM、萬代蘭 CAM。蘭科內同屬不同種、葉厚與水分環境會影響表現，不能只憑屬名一概而論。C3 主要白天固定 CO₂；<\/p>\n<p>CAM 夜間 PEPC 固碳存蘋果酸，白天脫羧供 Calvin cycle。<\/p>\n<p>典型 CAM 植物夜間較易開氣孔，由 PEPC 將 CO₂ 固定為有機酸並貯存於液泡；白天多關閉氣孔，有機酸脫羧提供 CO₂，供卡爾文循環利用。並不是白天完全不進行光合作用。<\/p>\n<p>典型日韻律為夜間酸度上升、清晨偏高，白天去酸、傍晚偏低；外界 CO₂ 淨吸收主要在夜間。實際常有清晨、傍晚過渡階段，乾旱或發育條件也可能改變曲線。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>蝴蝶蘭常以 CAM 說明節水特性，文心蘭許多栽培材料則以 C₃ 為主；若題目只給「石斛」而未指定物種，應說明屬內差異，避免過度概括。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：五類各 2 分；春石斛需附種類與兼性條件，避免絕對化。<\/p>\n<ul>\n<li><strong>五類各 2 分<\/strong><\/li>\n<li><strong>春石斛需附種類與兼性條件，避免絕對化<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把 CAM 寫成夜間利用光能進行全部光反應。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=5","md":"105年花卉學_逐題教學詳解.md","search":"五種蘭的固碳型 ## 第三題｜五種蘭的固碳型（10 分）\n\n### 題意與作答範圍\n\n本題重點：**五種蘭的固碳型**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=5)。\n\n### 先掌握答案\n\n常見栽培群可答文心蘭 c3、仙履蘭 c3、春石斛偏 c3／可具兼性 cam、秋石斛 cam、萬代蘭 cam。蘭科內同屬不同種、葉厚與水分環境會影響表現，不能只憑屬名一概而論。c3 主要白天固定 co₂；\n\n### 原理拆解：為什麼會這樣？\n\n**夜間固定與白天利用在時間上分開**\n\n典型 cam 植物夜間較易開氣孔，由 pepc 將 co₂ 固定為有機酸並貯存於液泡；白天多關閉氣孔，有機酸脫羧提供 co₂，供卡爾文循環利用。並不是白天完全不進行光合作用。\n\n**圖要同時畫氣孔與酸度**\n\n典型日韻律為夜間酸度上升、清晨偏高，白天去酸、傍晚偏低；外界 co₂ 淨吸收主要在夜間。實際常有清晨、傍晚過渡階段，乾旱或發育條件也可能改變曲線。\n\n**分類與灌溉要承認物種差異**\n\nc₃、c₄ 與 cam 不是依葉片厚薄就能判定，兼性 cam 會依環境調整。蘭科包含不同固碳途徑，不能把所有蘭都列 cam；耐旱也不代表高產時不需供水或根部可以長期缺氧。\n\n### 可直接練寫的完整答案\n\n常見栽培群可答文心蘭 c3、仙履蘭 c3、春石斛偏 c3／可具兼性 cam、秋石斛 cam、萬代蘭 cam。蘭科內同屬不同種、葉厚與水分環境會影響表現，不能只憑屬名一概而論。c3 主要白天固定 co₂；\n\ncam 夜間 pepc 固碳存蘋果酸，白天脫羧供 calvin cycle。\n\n典型 cam 植物夜間較易開氣孔，由 pepc 將 co₂ 固定為有機酸並貯存於液泡；白天多關閉氣孔，有機酸脫羧提供 co₂，供卡爾文循環利用。並不是白天完全不進行光合作用。\n\n典型日韻律為夜間酸度上升、清晨偏高，白天去酸、傍晚偏低；外界 co₂ 淨吸收主要在夜間。實際常有清晨、傍晚過渡階段，乾旱或發育條件也可能改變曲線。\n\n### 實例：把原理用在情境中\n\n蝴蝶蘭常以 cam 說明節水特性，文心蘭許多栽培材料則以 c₃ 為主；若題目只給「石斛」而未指定物種，應說明屬內差異，避免過度概括。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：五類各 2 分；春石斛需附種類與兼性條件，避免絕對化。\n\n- **五類各 2 分**\n- **春石斛需附種類與兼性條件，避免絕對化**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把 cam 寫成夜間利用光能進行全部光反應。\n 105 花卉學"},{"id":"花卉學-105-四","s":"花卉學","y":105,"n":"四","t":"蝴蝶蘭實生與分生流程","body":"<h2>第四題｜蝴蝶蘭實生與分生流程（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>蝴蝶蘭實生與分生流程<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=5\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>實生用雜交採種、無菌播種、原球體到幼苗，目的為育種與產生變異，種子無充足胚乳需培養基供糖養分。分生由優良母株花梗節、莖頂或葉等外植體，誘導芽／PLB、增殖、分化、生根，目的為一致量繁。兩者均要消毒、防污染、出瓶馴化與規格育苗；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<p><strong>健康與整齊度要從母本或種子源開始<\/strong><\/p>\n<p>母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。<\/p>\n<p><strong>育苗目標是可定植且恢復快<\/strong><\/p>\n<p>適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。<\/p>\n<p><strong>無菌培養後仍有馴化關卡<\/strong><\/p>\n<p>瓶內高濕、低光與外加糖可使幼苗角質層、氣孔及根功能與田間不同。出瓶須逐步調整光濕條件並防感染。組培倍率、出瓶存活率與成品率應分開計算，不能只用增殖數宣稱生產效率。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>實生用雜交採種、無菌播種、原球體到幼苗，目的為育種與產生變異，種子無充足胚乳需培養基供糖養分。分生由優良母株花梗節、莖頂或葉等外植體，誘導芽／PLB、增殖、分化、生根，目的為一致量繁。兩者均要消毒、防污染、出瓶馴化與規格育苗；<\/p>\n<p>由授粉到開花或建系量產常需數年，依材料差異大。<\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<p>蝴蝶蘭分生苗可用組織培養大量增殖，但需檢測母株病毒並控制培養代數；出瓶後先馴化，再依葉片與根系生長分級，不宜把瓶苗數直接當成上市盆花數。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：目的、初代材料、增殖、出瓶及時程比較。<\/p>\n<ul>\n<li><strong>初代材料<\/strong><\/li>\n<li><strong>出瓶及時程比較<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<li>將組織培養視為自動消除所有病原。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=5","md":"105年花卉學_逐題教學詳解.md","search":"蝴蝶蘭實生與分生流程 ## 第四題｜蝴蝶蘭實生與分生流程（20 分）\n\n### 題意與作答範圍\n\n本題重點：**蝴蝶蘭實生與分生流程**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=5)。\n\n### 先掌握答案\n\n實生用雜交採種、無菌播種、原球體到幼苗，目的為育種與產生變異，種子無充足胚乳需培養基供糖養分。分生由優良母株花梗節、莖頂或葉等外植體，誘導芽／plb、增殖、分化、生根，目的為一致量繁。兩者均要消毒、防污染、出瓶馴化與規格育苗；\n\n### 原理拆解：為什麼會這樣？\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n**健康與整齊度要從母本或種子源開始**\n\n母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。\n\n**育苗目標是可定植且恢復快**\n\n適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。\n\n**無菌培養後仍有馴化關卡**\n\n瓶內高濕、低光與外加糖可使幼苗角質層、氣孔及根功能與田間不同。出瓶須逐步調整光濕條件並防感染。組培倍率、出瓶存活率與成品率應分開計算，不能只用增殖數宣稱生產效率。\n\n### 可直接練寫的完整答案\n\n實生用雜交採種、無菌播種、原球體到幼苗，目的為育種與產生變異，種子無充足胚乳需培養基供糖養分。分生由優良母株花梗節、莖頂或葉等外植體，誘導芽／plb、增殖、分化、生根，目的為一致量繁。兩者均要消毒、防污染、出瓶馴化與規格育苗；\n\n由授粉到開花或建系量產常需數年，依材料差異大。\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n### 實例：把原理用在情境中\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n蝴蝶蘭分生苗可用組織培養大量增殖，但需檢測母株病毒並控制培養代數；出瓶後先馴化，再依葉片與根系生長分級，不宜把瓶苗數直接當成上市盆花數。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：目的、初代材料、增殖、出瓶及時程比較。\n\n- **初代材料**\n- **出瓶及時程比較**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無性繁殖與無病毒畫上等號。\n- 將組織培養視為自動消除所有病原。\n 105 花卉學"},{"id":"花卉學-105-五","s":"花卉學","y":105,"n":"五","t":"聖誕紅光週期與溫度","body":"<h2>第五題｜聖誕紅光週期與溫度（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>聖誕紅光週期與溫度<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=5\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>聖誕紅屬短日／長夜成花植物，秋季夜長達品種需要後花芽分化、苞片轉色；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>感應的是日夜節律，常以夜長最關鍵<\/strong><\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<p><strong>感光與光合作用不是同一需求<\/strong><\/p>\n<p>暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。<\/p>\n<p><strong>產期調節須兼顧可感應階段<\/strong><\/p>\n<p>植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>聖誕紅屬短日／長夜成花植物，秋季夜長達品種需要後花芽分化、苞片轉色；<\/p>\n<p>夜間燈光可中斷暗期、延後開花。促成可提早遮黑提供連續長夜，延後則補光至預定日期後停止。高夜溫可能延遲花誘導，過低溫則生長慢或傷害，須依反應週數品種設定溫度與倒推上市日。<\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<p>暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：暗期、溫度、遮光與補光、反應週數。<\/p>\n<ul>\n<li><strong>遮光與補光<\/strong><\/li>\n<li><strong>反應週數<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短日反應簡化為光越少花越多。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=5","md":"105年花卉學_逐題教學詳解.md","search":"聖誕紅光週期與溫度 ## 第五題｜聖誕紅光週期與溫度（15 分）\n\n### 題意與作答範圍\n\n本題重點：**聖誕紅光週期與溫度**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=5)。\n\n### 先掌握答案\n\n聖誕紅屬短日／長夜成花植物，秋季夜長達品種需要後花芽分化、苞片轉色；\n\n### 原理拆解：為什麼會這樣？\n\n**感應的是日夜節律，常以夜長最關鍵**\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n**感光與光合作用不是同一需求**\n\n暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。\n\n**產期調節須兼顧可感應階段**\n\n植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。\n\n### 可直接練寫的完整答案\n\n聖誕紅屬短日／長夜成花植物，秋季夜長達品種需要後花芽分化、苞片轉色；\n\n夜間燈光可中斷暗期、延後開花。促成可提早遮黑提供連續長夜，延後則補光至預定日期後停止。高夜溫可能延遲花誘導，過低溫則生長慢或傷害，須依反應週數品種設定溫度與倒推上市日。\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。\n\n### 實例：把原理用在情境中\n\n菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：暗期、溫度、遮光與補光、反應週數。\n\n- **遮光與補光**\n- **反應週數**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短日反應簡化為光越少花越多。\n 105 花卉學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
