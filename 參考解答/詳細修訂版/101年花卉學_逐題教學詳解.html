ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 8 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"花卉學-101-一","s":"花卉學","y":101,"n":"一","t":"洋桔梗英文翻譯","body":"<h2>第一題｜洋桔梗英文翻譯（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>洋桔梗英文翻譯<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=17\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。<\/p>\n<h3>完整參考譯文<\/h3>\n<p>洋桔梗（Eustoma grandiflorum）於 1968 年首次引入臺灣，埔里業者曾栽作切花；<\/p>\n<p>但因當時有許多尚未釐清的栽培難題而未成功。細小種子在穴盤發芽不均、幼苗簇生等障礙，經研究者努力獲得解決。中臺灣彰化、雲林及嘉義等縣生產了臺灣多數洋桔梗切花。依日本主要種子販售業者瀧井種苗的報告，臺灣在 2008 年向日本輸出 260 萬枝，約占日本當年進口總量 320 萬枝的 81%。<\/p>\n<h3>讀懂這段研究在說什麼<\/h3>\n<p><strong>引入、栽培瓶頸與產業化的歷史順序<\/strong><\/p>\n<p>1968 年引入、早期栽培不成功、研究克服細種子與簇生障礙，再到產業發展，是連續的歷史因果。應把 rosetting 譯為節間縮短的簇生或蓮座化，不是單純葉片變多；埔里是文中的早期地點，不代表所有時期唯一產區。<\/p>\n<h3>配分重點與檢查順序<\/h3>\n<p>10 分：引進年份地點、難題、主產區、260／320 萬及 81% 均保留。<\/p>\n<p>先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。<\/p>\n<h3>常見失分<\/h3>\n<ul>\n<li>把專業名詞按一般字義翻譯，或把相關性改成因果。<\/li>\n<li>省略轉折、條件或限制，使研究結論比原文更強。<\/li>\n<li>以摘要取代全文翻譯。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=17","md":"101年花卉學_逐題教學詳解.md","search":"洋桔梗英文翻譯 ## 第一題｜洋桔梗英文翻譯（10 分）\n\n### 題意與作答範圍\n\n本題重點：**洋桔梗英文翻譯**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=17)。\n\n### 先掌握答案\n\n這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。\n\n### 完整參考譯文\n\n洋桔梗（eustoma grandiflorum）於 1968 年首次引入臺灣，埔里業者曾栽作切花；\n\n但因當時有許多尚未釐清的栽培難題而未成功。細小種子在穴盤發芽不均、幼苗簇生等障礙，經研究者努力獲得解決。中臺灣彰化、雲林及嘉義等縣生產了臺灣多數洋桔梗切花。依日本主要種子販售業者瀧井種苗的報告，臺灣在 2008 年向日本輸出 260 萬枝，約占日本當年進口總量 320 萬枝的 81%。\n\n### 讀懂這段研究在說什麼\n\n**引入、栽培瓶頸與產業化的歷史順序**\n\n1968 年引入、早期栽培不成功、研究克服細種子與簇生障礙，再到產業發展，是連續的歷史因果。應把 rosetting 譯為節間縮短的簇生或蓮座化，不是單純葉片變多；埔里是文中的早期地點，不代表所有時期唯一產區。\n\n### 配分重點與檢查順序\n\n10 分：引進年份地點、難題、主產區、260／320 萬及 81% 均保留。\n\n先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。\n\n### 常見失分\n\n- 把專業名詞按一般字義翻譯，或把相關性改成因果。\n- 省略轉折、條件或限制，使研究結論比原文更強。\n- 以摘要取代全文翻譯。\n 101 花卉學"},{"id":"花卉學-101-二","s":"花卉學","y":101,"n":"二","t":"冬季外銷切花與理由","body":"<h2>第二題｜冬季外銷切花與理由（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>冬季外銷切花與理由<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=17\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>可舉洋桔梗、菊花、文心蘭（依品種供期）或火鶴等，需依題目排除蘭花後選洋桔梗、菊花、火鶴。臺灣中南部冬季較乾暖、日照佳，生產成本與品質相對溫帶冬季加溫栽培有利，又可配日本節慶需求；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>設施先改變能量與物質交換<\/strong><\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p><strong>各因子必須一起管理<\/strong><\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<p><strong>控制成效要用植株與環境資料驗證<\/strong><\/p>\n<p>以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。<\/p>\n<p><strong>切離後的水分與碳收支轉為赤字<\/strong><\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p><strong>不同處理各有明確功能<\/strong><\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<p><strong>採收成熟度與溫度決定後續品質上限<\/strong><\/p>\n<p>過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>可舉洋桔梗、菊花、文心蘭（依品種供期）或火鶴等，需依題目排除蘭花後選洋桔梗、菊花、火鶴。臺灣中南部冬季較乾暖、日照佳，生產成本與品質相對溫帶冬季加溫栽培有利，又可配日本節慶需求；<\/p>\n<p>供貨仍需規格、冷鏈、病蟲及穩定排程。<\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。<\/p>\n<p>百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：至少三非蘭切花、氣候與成本、需求及供應品質。<\/p>\n<ul>\n<li><strong>至少三非蘭切花<\/strong><\/li>\n<li><strong>氣候與成本<\/strong><\/li>\n<li><strong>需求及供應品質<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將溫室直接等同低溫環境。<\/li>\n<li>把短時高濃度預措液與全程瓶插液視為相同用法。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=17","md":"101年花卉學_逐題教學詳解.md","search":"冬季外銷切花與理由 ## 第二題｜冬季外銷切花與理由（15 分）\n\n### 題意與作答範圍\n\n本題重點：**冬季外銷切花與理由**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=17)。\n\n### 先掌握答案\n\n可舉洋桔梗、菊花、文心蘭（依品種供期）或火鶴等，需依題目排除蘭花後選洋桔梗、菊花、火鶴。臺灣中南部冬季較乾暖、日照佳，生產成本與品質相對溫帶冬季加溫栽培有利，又可配日本節慶需求；\n\n### 原理拆解：為什麼會這樣？\n\n**設施先改變能量與物質交換**\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n**各因子必須一起管理**\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n**控制成效要用植株與環境資料驗證**\n\n以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。\n\n**切離後的水分與碳收支轉為赤字**\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n**不同處理各有明確功能**\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n**採收成熟度與溫度決定後續品質上限**\n\n過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。\n\n### 可直接練寫的完整答案\n\n可舉洋桔梗、菊花、文心蘭（依品種供期）或火鶴等，需依題目排除蘭花後選洋桔梗、菊花、火鶴。臺灣中南部冬季較乾暖、日照佳，生產成本與品質相對溫帶冬季加溫栽培有利，又可配日本節慶需求；\n\n供貨仍需規格、冷鏈、病蟲及穩定排程。\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n### 實例：把原理用在情境中\n\n臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。\n\n百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：至少三非蘭切花、氣候與成本、需求及供應品質。\n\n- **至少三非蘭切花**\n- **氣候與成本**\n- **需求及供應品質**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將溫室直接等同低溫環境。\n- 把短時高濃度預措液與全程瓶插液視為相同用法。\n 101 花卉學"},{"id":"花卉學-101-三","s":"花卉學","y":101,"n":"三","t":"CAM 日韻律圖","body":"<h2>第三題｜CAM 日韻律圖（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>CAM 日韻律圖<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=17\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>橫軸時間標示夜／晝，夜間氣孔開、PEPC 固定 CO₂ 成草醯乙酸再轉蘋果酸存液泡，因此夜間外界 CO₂ 固定率與蘋果酸淨合成較高；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>夜間固定與白天利用在時間上分開<\/strong><\/p>\n<p>典型 CAM 植物夜間較易開氣孔，由 PEPC 將 CO₂ 固定為有機酸並貯存於液泡；白天多關閉氣孔，有機酸脫羧提供 CO₂，供卡爾文循環利用。並不是白天完全不進行光合作用。<\/p>\n<p><strong>圖要同時畫氣孔與酸度<\/strong><\/p>\n<p>典型日韻律為夜間酸度上升、清晨偏高，白天去酸、傍晚偏低；外界 CO₂ 淨吸收主要在夜間。實際常有清晨、傍晚過渡階段，乾旱或發育條件也可能改變曲線。<\/p>\n<p><strong>分類與灌溉要承認物種差異<\/strong><\/p>\n<p>C₃、C₄ 與 CAM 不是依葉片厚薄就能判定，兼性 CAM 會依環境調整。蘭科包含不同固碳途徑，不能把所有蘭都列 CAM；耐旱也不代表高產時不需供水或根部可以長期缺氧。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>橫軸時間標示夜／晝，夜間氣孔開、PEPC 固定 CO₂ 成草醯乙酸再轉蘋果酸存液泡，因此夜間外界 CO₂ 固定率與蘋果酸淨合成較高；<\/p>\n<p>黎明後蘋果酸含量達高點，白天脫羧供 Rubisco，蘋果酸逐降。酸含量曲線夜升晝降，合成速率則夜正晝負／低，兩者圖不能混用。可補黎明與傍晚 C3 型直接固碳階段依環境改變。<\/p>\n<p>典型 CAM 植物夜間較易開氣孔，由 PEPC 將 CO₂ 固定為有機酸並貯存於液泡；白天多關閉氣孔，有機酸脫羧提供 CO₂，供卡爾文循環利用。並不是白天完全不進行光合作用。<\/p>\n<p>典型日韻律為夜間酸度上升、清晨偏高，白天去酸、傍晚偏低；外界 CO₂ 淨吸收主要在夜間。實際常有清晨、傍晚過渡階段，乾旱或發育條件也可能改變曲線。<\/p>\n<h3>圖解輔助<\/h3>\n<p><img alt=\"CAM 日韻律圖示意圖\" src=\"../圖解/03_CAM日韻律.svg\" /><\/p>\n<p>示意圖用來理解結構與方向；考場仍須依原題標示軸名、箭頭或構造。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>蝴蝶蘭常以 CAM 說明節水特性，文心蘭許多栽培材料則以 C₃ 為主；若題目只給「石斛」而未指定物種，應說明屬內差異，避免過度概括。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：標軸、夜固碳、酸合成與含量差別、晝脫羧。<\/p>\n<ul>\n<li><strong>夜固碳<\/strong><\/li>\n<li><strong>酸合成與含量差別<\/strong><\/li>\n<li><strong>晝脫羧<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把 CAM 寫成夜間利用光能進行全部光反應。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=17","md":"101年花卉學_逐題教學詳解.md","search":"cam 日韻律圖 ## 第三題｜cam 日韻律圖（10 分）\n\n### 題意與作答範圍\n\n本題重點：**cam 日韻律圖**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=17)。\n\n### 先掌握答案\n\n橫軸時間標示夜／晝，夜間氣孔開、pepc 固定 co₂ 成草醯乙酸再轉蘋果酸存液泡，因此夜間外界 co₂ 固定率與蘋果酸淨合成較高；\n\n### 原理拆解：為什麼會這樣？\n\n**夜間固定與白天利用在時間上分開**\n\n典型 cam 植物夜間較易開氣孔，由 pepc 將 co₂ 固定為有機酸並貯存於液泡；白天多關閉氣孔，有機酸脫羧提供 co₂，供卡爾文循環利用。並不是白天完全不進行光合作用。\n\n**圖要同時畫氣孔與酸度**\n\n典型日韻律為夜間酸度上升、清晨偏高，白天去酸、傍晚偏低；外界 co₂ 淨吸收主要在夜間。實際常有清晨、傍晚過渡階段，乾旱或發育條件也可能改變曲線。\n\n**分類與灌溉要承認物種差異**\n\nc₃、c₄ 與 cam 不是依葉片厚薄就能判定，兼性 cam 會依環境調整。蘭科包含不同固碳途徑，不能把所有蘭都列 cam；耐旱也不代表高產時不需供水或根部可以長期缺氧。\n\n### 可直接練寫的完整答案\n\n橫軸時間標示夜／晝，夜間氣孔開、pepc 固定 co₂ 成草醯乙酸再轉蘋果酸存液泡，因此夜間外界 co₂ 固定率與蘋果酸淨合成較高；\n\n黎明後蘋果酸含量達高點，白天脫羧供 rubisco，蘋果酸逐降。酸含量曲線夜升晝降，合成速率則夜正晝負／低，兩者圖不能混用。可補黎明與傍晚 c3 型直接固碳階段依環境改變。\n\n典型 cam 植物夜間較易開氣孔，由 pepc 將 co₂ 固定為有機酸並貯存於液泡；白天多關閉氣孔，有機酸脫羧提供 co₂，供卡爾文循環利用。並不是白天完全不進行光合作用。\n\n典型日韻律為夜間酸度上升、清晨偏高，白天去酸、傍晚偏低；外界 co₂ 淨吸收主要在夜間。實際常有清晨、傍晚過渡階段，乾旱或發育條件也可能改變曲線。\n\n### 圖解輔助\n\n![cam 日韻律圖示意圖](../圖解/03_cam日韻律.svg)\n\n示意圖用來理解結構與方向；考場仍須依原題標示軸名、箭頭或構造。\n\n### 實例：把原理用在情境中\n\n蝴蝶蘭常以 cam 說明節水特性，文心蘭許多栽培材料則以 c₃ 為主；若題目只給「石斛」而未指定物種，應說明屬內差異，避免過度概括。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：標軸、夜固碳、酸合成與含量差別、晝脫羧。\n\n- **夜固碳**\n- **酸合成與含量差別**\n- **晝脫羧**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把 cam 寫成夜間利用光能進行全部光反應。\n 101 花卉學"},{"id":"花卉學-101-四","s":"花卉學","y":101,"n":"四","t":"可塑性與全能性、體細胞胚","body":"<h2>第四題｜可塑性與全能性、體細胞胚（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>可塑性與全能性、體細胞胚<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=17\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>全能性指適當條件下單一植物細胞能再生成完整植株的潛力；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>全能性指適當條件下單一植物細胞能再生成完整植株的潛力；<\/p>\n<p>可塑性指細胞可依訊號改變發育命運。外植體經生長調節劑與營養誘導，部分體細胞取得胚性，形成具根端與芽端的雙極性胚，再發育為苗；<\/p>\n<p>可直接或經癒傷組織間接形成，不是每一細胞在任意培養基都能成胚。<\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：兩概念、誘導、雙極性與直接／間接路徑、限制。<\/p>\n<ul>\n<li><strong>兩概念<\/strong><\/li>\n<li><strong>雙極性與直接／間接路徑<\/strong><\/li>\n<li><strong>限制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=17","md":"101年花卉學_逐題教學詳解.md","search":"可塑性與全能性、體細胞胚 ## 第四題｜可塑性與全能性、體細胞胚（15 分）\n\n### 題意與作答範圍\n\n本題重點：**可塑性與全能性、體細胞胚**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=17)。\n\n### 先掌握答案\n\n全能性指適當條件下單一植物細胞能再生成完整植株的潛力；\n\n### 原理拆解：為什麼會這樣？\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n### 可直接練寫的完整答案\n\n全能性指適當條件下單一植物細胞能再生成完整植株的潛力；\n\n可塑性指細胞可依訊號改變發育命運。外植體經生長調節劑與營養誘導，部分體細胞取得胚性，形成具根端與芽端的雙極性胚，再發育為苗；\n\n可直接或經癒傷組織間接形成，不是每一細胞在任意培養基都能成胚。\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n### 實例：把原理用在情境中\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：兩概念、誘導、雙極性與直接／間接路徑、限制。\n\n- **兩概念**\n- **雙極性與直接／間接路徑**\n- **限制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無性繁殖與無病毒畫上等號。\n 101 花卉學"},{"id":"花卉學-101-五","s":"花卉學","y":101,"n":"五","t":"火鶴輸日關鍵","body":"<h2>第五題｜火鶴輸日關鍵（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>火鶴輸日關鍵<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=17\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>田間重視健康苗、細菌性病害與葉斑管理、遮蔭及花莖規格；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>切離後的水分與碳收支轉為赤字<\/strong><\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p><strong>不同處理各有明確功能<\/strong><\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<p><strong>採收成熟度與溫度決定後續品質上限<\/strong><\/p>\n<p>過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。<\/p>\n<p><strong>為何採後仍會變差<\/strong><\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p><strong>低溫有效，但有適用範圍<\/strong><\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<p><strong>把全程串起來<\/strong><\/p>\n<p>採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>田間重視健康苗、細菌性病害與葉斑管理、遮蔭及花莖規格；<\/p>\n<p>採收成熟肉穗與佛焰苞適期，輕採、補水、潔淨保鮮、固定肉穗防碰傷，採不致寒害的適溫運輸。配合檢疫、殘留與規格分級，改善品種單一、品質不齊和物流時效，不能用低溫越低越好的切花通則。<\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。<\/p>\n<p>驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：生產規格、病害、採後防傷防寒、外銷制度。<\/p>\n<ul>\n<li><strong>生產規格<\/strong><\/li>\n<li><strong>採後防傷防寒<\/strong><\/li>\n<li><strong>外銷制度<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短時高濃度預措液與全程瓶插液視為相同用法。<\/li>\n<li>認為溫度越低、保存效果一定越好。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=17","md":"101年花卉學_逐題教學詳解.md","search":"火鶴輸日關鍵 ## 第五題｜火鶴輸日關鍵（10 分）\n\n### 題意與作答範圍\n\n本題重點：**火鶴輸日關鍵**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=17)。\n\n### 先掌握答案\n\n田間重視健康苗、細菌性病害與葉斑管理、遮蔭及花莖規格；\n\n### 原理拆解：為什麼會這樣？\n\n**切離後的水分與碳收支轉為赤字**\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n**不同處理各有明確功能**\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n**採收成熟度與溫度決定後續品質上限**\n\n過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。\n\n**為何採後仍會變差**\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n**低溫有效，但有適用範圍**\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n**把全程串起來**\n\n採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。\n\n### 可直接練寫的完整答案\n\n 卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。<\/p>\n<p>蝴蝶蘭分生苗可用組織培養大量增殖，但需檢測母株病毒並控制培養代數；出瓶後先馴化，再依葉片與根系生長分級，不宜把瓶苗數直接當成上市盆花數。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：田間、成熟度、採後瓶頸及措施，具文心蘭特性。<\/p>\n<ul>\n<li><strong>成熟度<\/strong><\/li>\n<li><strong>採後瓶頸及措施，具文心蘭特性<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短時高濃度預措液與全程瓶插液視為相同用法。<\/li>\n<li>將組織培養視為自動消除所有病原。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=17","md":"101年花卉學_逐題教學詳解.md","search":"文心蘭生產與產品處理 ## 第六題｜文心蘭生產與產品處理（15 分）\n\n### 題意與作答範圍\n\n本題重點：**文心蘭生產與產品處理**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=17)。\n\n### 先掌握答案\n\n建立健康優良母本與一致組培苗，調成熟假球莖、光水肥及花期，支撐花梗、防花斑與蟎。採收以品種適當開花比例，避免幼蕾過多不能開，立即補水、清潔分級與緩衝包裝，維持不傷寒的適溫冷鏈並縮短物流。針對失水、落花、糖不足與病害分別驗證保鮮措施。\n\n### 原理拆解：為什麼會這樣？\n\n**切離後的水分與碳收支轉為赤字**\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n**不同處理各有明確功能**\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n**採收成熟度與溫度決定後續品質上限**\n\n過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。\n\n**健康與整齊度要從母本或種子源開始**\n\n母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。\n\n**育苗目標是可定植且恢復快**\n\n適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。\n\n**無菌培養後仍有馴化關卡**\n\n瓶內高濕、低光與外加糖可使幼苗角質層、氣孔及根功能與田間不同。出瓶須逐步調整光濕條件並防感染。組培倍率、出瓶存活率與成品率應分開計算，不能只用增殖數宣稱生產效率。\n\n### 可直接練寫的完整答案\n\n建立健康優良母本與一致組培苗，調成熟假球莖、光水肥及花期，支撐花梗、防花斑與蟎。採收以品種適當開花比例，避免幼蕾過多不能開，立即補水、清潔分級與緩衝包裝，維持不傷寒的適溫冷鏈並縮短物流。針對失水、落花、糖不足與病害分別驗證保鮮措施。\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n### 實例：把原理用在情境中\n\n百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。\n\n蝴蝶蘭分生苗可用組織培養大量增殖，但需檢測母株病毒並控制培養代數；出瓶後先馴化，再依葉片與根系生長分級，不宜把瓶苗數直接當成上市盆花數。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：田間、成熟度、採後瓶頸及措施，具文心蘭特性。\n\n- **成熟度**\n- **採後瓶頸及措施，具文心蘭特性**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短時高濃度預措液與全程瓶插液視為相同用法。\n- 將組織培養視為自動消除所有病原。\n 101 花卉學"},{"id":"花卉學-101-七","s":"花卉學","y":101,"n":"七","t":"15 種光週期分類","body":"<h2>第七題｜15 種光週期分類（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>15 種光週期分類<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=17\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>玫瑰多日中性；<\/p>\n<p>洋桔梗量性長日；<\/p>\n<p>落地生根短日；<\/p>\n<p>夏菊為高溫長日下也能開花的菊花群，臨界日長依品種；<\/p>\n<p>蝴蝶蘭主要溫度誘導、通常日中性；<\/p>\n<p>雞冠花多量性短日；<\/p>\n<p>翠菊多量性長日；<\/p>\n<p>宿根滿天星長日；<\/p>\n<p>聖誕紅短日；<\/p>\n<p>長壽花短日；<\/p>\n<p>金魚草量性長日；<\/p>\n<p>香石竹量性長日；<\/p>\n<p>秋菊短日；<\/p>\n<p>百合依群多量性長日或需冷與日長配合；<\/p>\n<p>火鶴多日中性。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>感應的是日夜節律，常以夜長最關鍵<\/strong><\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<p><strong>感光與光合作用不是同一需求<\/strong><\/p>\n<p>暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。<\/p>\n<p><strong>產期調節須兼顧可感應階段<\/strong><\/p>\n<p>植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>玫瑰多日中性；<\/p>\n<p>洋桔梗量性長日；<\/p>\n<p>落地生根短日；<\/p>\n<p>夏菊為高溫長日下也能開花的菊花群，臨界日長依品種；<\/p>\n<p>蝴蝶蘭主要溫度誘導、通常日中性；<\/p>\n<p>雞冠花多量性短日；<\/p>\n<p>翠菊多量性長日；<\/p>\n<p>宿根滿天星長日；<\/p>\n<p>聖誕紅短日；<\/p>\n<p>長壽花短日；<\/p>\n<p>金魚草量性長日；<\/p>\n<p>香石竹量性長日；<\/p>\n<p>秋菊短日；<\/p>\n<p>百合依群多量性長日或需冷與日長配合；<\/p>\n<p>火鶴多日中性。<\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：各約 1 分，夏菊、百合保留品種差異，勿強套絕對性。<\/p>\n<ul>\n<li><strong>各約 1 分，夏菊<\/strong><\/li>\n<li><strong>百合保留品種差異，勿強套絕對性<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短日反應簡化為光越少花越多。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=17","md":"101年花卉學_逐題教學詳解.md","search":"15 種光週期分類 ## 第七題｜15 種光週期分類（15 分）\n\n### 題意與作答範圍\n\n本題重點：**15 種光週期分類**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=17)。\n\n### 先掌握答案\n\n玫瑰多日中性；\n\n洋桔梗量性長日；\n\n落地生根短日；\n\n夏菊為高溫長日下也能開花的菊花群，臨界日長依品種；\n\n蝴蝶蘭主要溫度誘導、通常日中性；\n\n雞冠花多量性短日；\n\n翠菊多量性長日；\n\n宿根滿天星長日；\n\n聖誕紅短日；\n\n長壽花短日；\n\n金魚草量性長日；\n\n香石竹量性長日；\n\n秋菊短日；\n\n百合依群多量性長日或需冷與日長配合；\n\n火鶴多日中性。\n\n### 原理拆解：為什麼會這樣？\n\n**感應的是日夜節律，常以夜長最關鍵**\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n**感光與光合作用不是同一需求**\n\n暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。\n\n**產期調節須兼顧可感應階段**\n\n植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。\n\n### 可直接練寫的完整答案\n\n玫瑰多日中性；\n\n洋桔梗量性長日；\n\n落地生根短日；\n\n夏菊為高溫長日下也能開花的菊花群，臨界日長依品種；\n\n蝴蝶蘭主要溫度誘導、通常日中性；\n\n雞冠花多量性短日；\n\n翠菊多量性長日；\n\n宿根滿天星長日；\n\n聖誕紅短日；\n\n長壽花短日；\n\n金魚草量性長日；\n\n香石竹量性長日；\n\n秋菊短日；\n\n百合依群多量性長日或需冷與日長配合；\n\n火鶴多日中性。\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n### 實例：把原理用在情境中\n\n菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：各約 1 分，夏菊、百合保留品種差異，勿強套絕對性。\n\n- **各約 1 分，夏菊**\n- **百合保留品種差異，勿強套絕對性**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短日反應簡化為光越少花越多。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 101 花卉學"},{"id":"花卉學-101-八","s":"花卉學","y":101,"n":"八","t":"十種主要繁殖法","body":"<h2>第八題｜十種主要繁殖法（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>十種主要繁殖法<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=17\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>洋桔梗播種；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>洋桔梗播種；<\/p>\n<p>玫瑰扦插（部分生產用嫁接）；<\/p>\n<p>唐菖蒲球莖／子球莖；<\/p>\n<p>非洲菊組培；<\/p>\n<p>聖誕紅扦插；<\/p>\n<p>菊花扦插；<\/p>\n<p>火鶴花組培；<\/p>\n<p>天堂鳥分株（大批苗亦可播種）；<\/p>\n<p>晚香玉分球；<\/p>\n<p>仙客來播種。按「經濟大量栽培主要方式」各選一法，不是列所有可行方法。<\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：十作物各 1 分，對應主流種苗法。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=17","md":"101年花卉學_逐題教學詳解.md","search":"十種主要繁殖法 ## 第八題｜十種主要繁殖法（10 分）\n\n### 題意與作答範圍\n\n本題重點：**十種主要繁殖法**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=17)。\n\n### 先掌握答案\n\n洋桔梗播種；\n\n### 原理拆解：為什麼會這樣？\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n### 可直接練寫的完整答案\n\n洋桔梗播種；\n\n玫瑰扦插（部分生產用嫁接）；\n\n唐菖蒲球莖／子球莖；\n\n非洲菊組培；\n\n聖誕紅扦插；\n\n菊花扦插；\n\n火鶴花組培；\n\n天堂鳥分株（大批苗亦可播種）；\n\n晚香玉分球；\n\n仙客來播種。按「經濟大量栽培主要方式」各選一法，不是列所有可行方法。\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n### 實例：把原理用在情境中\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：十作物各 1 分，對應主流種苗法。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無性繁殖與無病毒畫上等號。\n 101 花卉學"}]</script><script>const <article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
