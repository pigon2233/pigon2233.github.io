ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 6 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"蔬菜學-115-一","s":"蔬菜學","y":115,"n":"一","t":"雜草定義、問題與防治","body":"<h2>第一題｜雜草定義、問題與防治（25 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>雜草定義、問題與防治<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C115.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>雜草是特定時間、地點與生產目標下不被需要、干擾管理的植物。會競爭光、水、養分及空間，寄藏病蟲、妨礙作業與採收、混入產品、增加成本，有些具化感或有毒。採綜合管理：用潔淨種苗和資材、避免結籽及根莖傳入；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>雜草是出現在不適位置的植物<\/strong><\/p>\n<p>同一植物在綠肥田可能有用，在苗床卻可能競爭資源。主要問題包括爭光、水、養分與空間，寄生病蟲、干擾採收及污染商品；有些田間植被也有保土與生態功能，須依位置管理。<\/p>\n<p><strong>關鍵在競爭時期與繁殖源<\/strong><\/p>\n<p>作物幼苗與行間尚未封閉時通常較易受競爭；種子庫與地下繁殖器官使雜草反覆出現。應在結籽或形成大量地下繁殖體前處理，避免只消除可見地上部。<\/p>\n<p><strong>整合方法降低反覆發生<\/strong><\/p>\n<p>輪作、清潔種苗、覆蓋、適當密植、中耕、人工與合規藥劑各有時機。覆蓋須注意水分、病害與殘材，除草劑須依核准作物與標示使用；不能用不分選擇性的處理傷及栽培作物。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>防除關鍵期多在幼苗期，最好控制種子庫與多年生營養繁殖體，不只處理地上草量。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>雜草是特定時間、地點與生產目標下不被需要、干擾管理的植物。會競爭光、水、養分及空間，寄藏病蟲、妨礙作業與採收、混入產品、增加成本，有些具化感或有毒。採綜合管理：用潔淨種苗和資材、避免結籽及根莖傳入；<\/p>\n<p>輪作、假播種床、覆蓋、適當密度與水分；<\/p>\n<p>早期中耕、手拔、割草或熱處理；<\/p>\n<p>必要時用該作物核准除草劑並輪替作用機制、防飄移。<\/p>\n<p>同一植物在綠肥田可能有用，在苗床卻可能競爭資源。主要問題包括爭光、水、養分與空間，寄生病蟲、干擾採收及污染商品；有些田間植被也有保土與生態功能，須依位置管理。<\/p>\n<p>作物幼苗與行間尚未封閉時通常較易受競爭；種子庫與地下繁殖器官使雜草反覆出現。應在結籽或形成大量地下繁殖體前處理，避免只消除可見地上部。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>短期葉菜可先處理播種前的雜草，再利用均勻出苗與適度密植縮短裸地期間；多年生地下莖雜草則需反覆耗竭或移除繁殖體，僅割一次常會再生。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>25 分：定義 3、問題 10、整合防治 12，競爭與種子庫。<\/p>\n<ul>\n<li><strong>定義 3<\/strong><\/li>\n<li><strong>問題 10<\/strong><\/li>\n<li><strong>整合防治 12，競爭與種子庫<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將所有田間非作物植被都視為沒有任何效益。<\/li>\n<\/ul>","source":"../../C115.pdf#page=2","md":"115年蔬菜學_逐題教學詳解.md","search":"雜草定義、問題與防治 ## 第一題｜雜草定義、問題與防治（25 分）\n\n### 題意與作答範圍\n\n本題重點：**雜草定義、問題與防治**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c115.pdf#page=2)。\n\n### 先掌握答案\n\n雜草是特定時間、地點與生產目標下不被需要、干擾管理的植物。會競爭光、水、養分及空間，寄藏病蟲、妨礙作業與採收、混入產品、增加成本，有些具化感或有毒。採綜合管理：用潔淨種苗和資材、避免結籽及根莖傳入；\n\n### 原理拆解：為什麼會這樣？\n\n**雜草是出現在不適位置的植物**\n\n同一植物在綠肥田可能有用，在苗床卻可能競爭資源。主要問題包括爭光、水、養分與空間，寄生病蟲、干擾採收及污染商品；有些田間植被也有保土與生態功能，須依位置管理。\n\n**關鍵在競爭時期與繁殖源**\n\n作物幼苗與行間尚未封閉時通常較易受競爭；種子庫與地下繁殖器官使雜草反覆出現。應在結籽或形成大量地下繁殖體前處理，避免只消除可見地上部。\n\n**整合方法降低反覆發生**\n\n輪作、清潔種苗、覆蓋、適當密植、中耕、人工與合規藥劑各有時機。覆蓋須注意水分、病害與殘材，除草劑須依核准作物與標示使用；不能用不分選擇性的處理傷及栽培作物。\n\n### 這題要特別注意\n\n防除關鍵期多在幼苗期，最好控制種子庫與多年生營養繁殖體，不只處理地上草量。\n\n### 可直接練寫的完整答案\n\n雜草是特定時間、地點與生產目標下不被需要、干擾管理的植物。會競爭光、水、養分及空間，寄藏病蟲、妨礙作業與採收、混入產品、增加成本，有些具化感或有毒。採綜合管理：用潔淨種苗和資材、避免結籽及根莖傳入；\n\n輪作、假播種床、覆蓋、適當密度與水分；\n\n早期中耕、手拔、割草或熱處理；\n\n必要時用該作物核准除草劑並輪替作用機制、防飄移。\n\n同一植物在綠肥田可能有用，在苗床卻可能競爭資源。主要問題包括爭光、水、養分與空間，寄生病蟲、干擾採收及污染商品；有些田間植被也有保土與生態功能，須依位置管理。\n\n作物幼苗與行間尚未封閉時通常較易受競爭；種子庫與地下繁殖器官使雜草反覆出現。應在結籽或形成大量地下繁殖體前處理，避免只消除可見地上部。\n\n### 實例：把原理用在情境中\n\n短期葉菜可先處理播種前的雜草，再利用均勻出苗與適度密植縮短裸地期間；多年生地下莖雜草則需反覆耗竭或移除繁殖體，僅割一次常會再生。\n\n### 配分重點：哪些內容不能漏？\n\n25 分：定義 3、問題 10、整合防治 12，競爭與種子庫。\n\n- **定義 3**\n- **問題 10**\n- **整合防治 12，競爭與種子庫**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將所有田間非作物植被都視為沒有任何效益。\n 115 蔬菜學"},{"id":"蔬菜學-115-二","s":"蔬菜學","y":115,"n":"二","t":"五種食用部位","body":"<h2>第二題｜五種食用部位（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五種食用部位<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C115.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>芹菜：葉柄及葉。抱子甘藍：短縮、膨大的腋芽小葉球。蘆筍：幼嫩新梢／嫩莖。牛蒡：肥大主根。蕪菁：肥大的下胚軸與主根（比例隨品種而異）。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>器官來源比外觀名稱更可靠<\/strong><\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<p><strong>不同分類軸不能混用<\/strong><\/p>\n<p>花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。<\/p>\n<p><strong>名稱與例子要一對一<\/strong><\/p>\n<p>寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>蕪菁屬十字花科，肥大器官並非球莖；<\/p>\n<p>本題已放大核對掃描字形，不能誤讀成芋類。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>芹菜：葉柄及葉。抱子甘藍：短縮、膨大的腋芽小葉球。蘆筍：幼嫩新梢／嫩莖。牛蒡：肥大主根。蕪菁：肥大的下胚軸與主根（比例隨品種而異）。<\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：五部位各 2 分；已放大確認第 5 項為蕪菁，含下胚軸與主根。<\/p>\n<ul>\n<li><strong>五部位各 2 分<\/strong><\/li>\n<li><strong>已放大確認第 5 項為蕪菁，含下胚軸與主根<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>看到地下器官就全部寫成根。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../C115.pdf#page=2","md":"115年蔬菜學_逐題教學詳解.md","search":"五種食用部位 ## 第二題｜五種食用部位（10 分）\n\n### 題意與作答範圍\n\n本題重點：**五種食用部位**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c115.pdf#page=2)。\n\n### 先掌握答案\n\n芹菜：葉柄及葉。抱子甘藍：短縮、膨大的腋芽小葉球。蘆筍：幼嫩新梢／嫩莖。牛蒡：肥大主根。蕪菁：肥大的下胚軸與主根（比例隨品種而異）。\n\n### 原理拆解：為什麼會這樣？\n\n**器官來源比外觀名稱更可靠**\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n**不同分類軸不能混用**\n\n花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。\n\n**名稱與例子要一對一**\n\n寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。\n\n### 這題要特別注意\n\n蕪菁屬十字花科，肥大器官並非球莖；\n\n本題已放大核對掃描字形，不能誤讀成芋類。\n\n### 可直接練寫的完整答案\n\n芹菜：葉柄及葉。抱子甘藍：短縮、膨大的腋芽小葉球。蘆筍：幼嫩新梢／嫩莖。牛蒡：肥大主根。蕪菁：肥大的下胚軸與主根（比例隨品種而異）。\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n### 實例：把原理用在情境中\n\n馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：五部位各 2 分；已放大確認第 5 項為蕪菁，含下胚軸與主根。\n\n- **五部位各 2 分**\n- **已放大確認第 5 項為蕪菁，含下胚軸與主根**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 看到地下器官就全部寫成根。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 115 蔬菜學"},{"id":"蔬菜學-115-三","s":"蔬菜學","y":115,"n":"三","t":"氮肥形式、過量與番茄後期","body":"<h2>第三題｜氮肥形式、過量與番茄後期（18 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>氮肥形式、過量與番茄後期<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C115.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>葉菜可施硝態氮、銨態氮及尿素等醯胺態氮，尿素入土後多先轉銨再硝化；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>氮為何促進營養生長<\/strong><\/p>\n<p>氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。<\/p>\n<p><strong>吸收氮不等於已同化<\/strong><\/p>\n<p>根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 GS/GOGAT 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。<\/p>\n<p><strong>形式、總量與時期一起決定結果<\/strong><\/p>\n<p>銨態並非不好，但根域容量小、緩衝弱時，過量銨容易酸化、毒害及拮抗鈣鉀鎂。果實期又須避免過氮徒長、陰蔽與品質下降。因此應依土水、光量、生育需求分次施肥，而不是只選一個氮形式就認為問題解決。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>葉菜需要氮不等於只適合銨態，番茄後期也不能完全忽略總氮量、水分與其他養分平衡。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>葉菜可施硝態氮、銨態氮及尿素等醯胺態氮，尿素入土後多先轉銨再硝化；<\/p>\n<p>依作物與根域選比例、分次追肥。過氮會徒長、葉嫩易倒伏與病害、品質及貯藏性差、延後成熟，低光下易累積硝酸鹽，也增加鹽害與環境流失。番茄結果後期多宜硝態氮為主、適量搭配銨態，避免高銨抑制 Ca、K、Mg 吸收及根域酸化，降低尻腐與根傷風險。<\/p>\n<p>氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。<\/p>\n<p>根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 GS/GOGAT 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>番茄結果後期若高氨加上灌溉不穩，果端鈣供應更易失衡；改硝態為主仍須同時控制總氮、供水與根活力，才能有效降低風險。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>18 分：氮形式 6、過氮 6、番茄後期硝態為主及鈣拮抗理由 6。<\/p>\n<ul>\n<li><strong>氮形式 6<\/strong><\/li>\n<li><strong>過氮 6<\/strong><\/li>\n<li><strong>番茄後期硝態為主及鈣拮抗理由 6<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把硝酸鹽累積說成所有氮都完全不能被利用。<\/li>\n<\/ul>","source":"../../C115.pdf#page=2","md":"115年蔬菜學_逐題教學詳解.md","search":"氮肥形式、過量與番茄後期 ## 第三題｜氮肥形式、過量與番茄後期（18 分）\n\n### 題意與作答範圍\n\n本題重點：**氮肥形式、過量與番茄後期**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c115.pdf#page=2)。\n\n### 先掌握答案\n\n葉菜可施硝態氮、銨態氮及尿素等醯胺態氮，尿素入土後多先轉銨再硝化；\n\n### 原理拆解：為什麼會這樣？\n\n**氮為何促進營養生長**\n\n氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。\n\n**吸收氮不等於已同化**\n\n根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 gs/gogat 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。\n\n**形式、總量與時期一起決定結果**\n\n銨態並非不好，但根域容量小、緩衝弱時，過量銨容易酸化、毒害及拮抗鈣鉀鎂。果實期又須避免過氮徒長、陰蔽與品質下降。因此應依土水、光量、生育需求分次施肥，而不是只選一個氮形式就認為問題解決。\n\n### 這題要特別注意\n\n葉菜需要氮不等於只適合銨態，番茄後期也不能完全忽略總氮量、水分與其他養分平衡。\n\n### 可直接練寫的完整答案\n\n葉菜可施硝態氮、銨態氮及尿素等醯胺態氮，尿素入土後多先轉銨再硝化；\n\n依作物與根域選比例、分次追肥。過氮會徒長、葉嫩易倒伏與病害、品質及貯藏性差、延後成熟，低光下易累積硝酸鹽，也增加鹽害與環境流失。番茄結果後期多宜硝態氮為主、適量搭配銨態，避免高銨抑制 ca、k、mg 吸收及根域酸化，降低尻腐與根傷風險。\n\n氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。\n\n根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 gs/gogat 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。\n\n### 實例：把原理用在情境中\n\n番茄結果後期若高氨加上灌溉不穩，果端鈣供應更易失衡；改硝態為主仍須同時控制總氮、供水與根活力，才能有效降低風險。\n\n### 配分重點：哪些內容不能漏？\n\n18 分：氮形式 6、過氮 6、番茄後期硝態為主及鈣拮抗理由 6。\n\n- **氮形式 6**\n- **過氮 6**\n- **番茄後期硝態為主及鈣拮抗理由 6**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把硝酸鹽累積說成所有氮都完全不能被利用。\n 115 蔬菜學"},{"id":"蔬菜學-115-四","s":"蔬菜學","y":115,"n":"四","t":"Baby leaf 生菜流程","body":"<h2>第四題｜Baby leaf 生菜流程（12 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>Baby leaf 生菜流程<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C115.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>冷涼時輕採、立即遮蔭→迅速預冷與低溫運送→剔病傷葉→飲用水品質清洗與經驗證消毒→輕柔脫水→適量透氣／氣調包裝→連續低溫配送、陳列。原理為迅速抑制高呼吸、減少失水萎凋，衛生處理降低交叉污染，去自由水減腐敗，包裝維濕且防缺氧。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>採後仍活著，也仍在消耗<\/strong><\/p>\n<p>蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。<\/p>\n<p><strong>低溫與保濕要兼顧氣體交換<\/strong><\/p>\n<p>快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。<\/p>\n<p><strong>截切菜需把安全與外觀一起管理<\/strong><\/p>\n<p>流程包括原料驗收、去除不良部位、適當清洗、切割、清洗消毒、瀝乾、包裝與冷藏配送，細節依設備與產品調整。消毒水須管控有效濃度、接觸時間與有機物負荷，目標包含避免交叉污染，並不等於滅菌。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>幼葉表面積大、屏障薄，處理過強會增加傷口與腐敗；<\/p>\n<p>消毒和冷藏不能取代採前安全管理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>冷涼時輕採、立即遮蔭→迅速預冷與低溫運送→剔病傷葉→飲用水品質清洗與經驗證消毒→輕柔脫水→適量透氣／氣調包裝→連續低溫配送、陳列。原理為迅速抑制高呼吸、減少失水萎凋，衛生處理降低交叉污染，去自由水減腐敗，包裝維濕且防缺氧。<\/p>\n<p>蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。<\/p>\n<p>快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>截切萵苣若只處理褐變而未瀝乾與維持冷鏈，仍可能滲液、腐敗或發生微生物風險；應用同批產品的外觀、失重與衛生檢測共同決定期限。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>12 分：步驟 6、原理 6，輕柔處理與冷鏈。<\/p>\n<ul>\n<li><strong>步驟 6<\/strong><\/li>\n<li><strong>原理 6，輕柔處理與冷鏈<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把清洗消毒寫成可以保證完全無菌。<\/li>\n<\/ul>","source":"../../C115.pdf#page=2","md":"115年蔬菜學_逐題教學詳解.md","search":"baby leaf 生菜流程 ## 第四題｜baby leaf 生菜流程（12 分）\n\n### 題意與作答範圍\n\n本題重點：**baby leaf 生菜流程**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c115.pdf#page=2)。\n\n### 先掌握答案\n\n冷涼時輕採、立即遮蔭→迅速預冷與低溫運送→剔病傷葉→飲用水品質清洗與經驗證消毒→輕柔脫水→適量透氣／氣調包裝→連續低溫配送、陳列。原理為迅速抑制高呼吸、減少失水萎凋，衛生處理降低交叉污染，去自由水減腐敗，包裝維濕且防缺氧。\n\n### 原理拆解：為什麼會這樣？\n\n**採後仍活著，也仍在消耗**\n\n蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。\n\n**低溫與保濕要兼顧氣體交換**\n\n快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。\n\n**截切菜需把安全與外觀一起管理**\n\n流程包括原料驗收、去除不良部位、適當清洗、切割、清洗消毒、瀝乾、包裝與冷藏配送，細節依設備與產品調整。消毒水須管控有效濃度、接觸時間與有機物負荷，目標包含避免交叉污染，並不等於滅菌。\n\n### 這題要特別注意\n\n幼葉表面積大、屏障薄，處理過強會增加傷口與腐敗；\n\n消毒和冷藏不能取代採前安全管理。\n\n### 可直接練寫的完整答案\n\n冷涼時輕採、立即遮蔭→迅速預冷與低溫運送→剔病傷葉→飲用水品質清洗與經驗證消毒→輕柔脫水→適量透氣／氣調包裝→連續低溫配送、陳列。原理為迅速抑制高呼吸、減少失水萎凋，衛生處理降低交叉污染，去自由水減腐敗，包裝維濕且防缺氧。\n\n蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。\n\n快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。\n\n### 實例：把原理用在情境中\n\n截切萵苣若只處理褐變而未瀝乾與維持冷鏈，仍可能滲液、腐敗或發生微生物風險；應用同批產品的外觀、失重與衛生檢測共同決定期限。\n\n### 配分重點：哪些內容不能漏？\n\n12 分：步驟 6、原理 6，輕柔處理與冷鏈。\n\n- **步驟 6**\n- **原理 6，輕柔處理與冷鏈**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把清洗消毒寫成可以保證完全無菌。\n 115 蔬菜學"},{"id":"蔬菜學-115-五","s":"蔬菜學","y":115,"n":"五","t":"六名詞","body":"<h2>第五題｜六名詞（24 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>六名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C115.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Force-air precooling（通常寫 forced-air）強制通風預冷：以壓差使冷空氣穿過產品及包裝孔隙，加速移除田間熱。Heterosis 雜種優勢：F1 在某性狀超越雙親平均或較優親本。Phytochromes 光敏素：感受紅光／遠紅光、以 Pr/Pfr 轉換調控萌芽、避陰與成花的受體。<\/p>\n<p>Growing Degree Days 生長度日：每日適用溫度超過基準溫的有效熱量累積，簡式 Σmax[0,(Tmax+Tmin)/2−Tbase]，亦可設上下限。Mulches 覆蓋物：地表有機／無機材料，調水溫、抑草與防蝕。Hermaphrodite 兩性花／雌雄同花：同一朵花有雄蕊與雌蕊。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先分清預冷與冷藏<\/strong><\/p>\n<p>採收時產品常接近田間溫度；若只把大量溫熱貨物放進冷庫，外層先冷、箱內與果心仍熱，呼吸及失水會持續。預冷的目標是迅速降低產品溫度，冷藏則是把已降溫的產品維持在適溫，兩者目的與設備負荷不同。<\/p>\n<p><strong>冷得快，必須讓熱有出口<\/strong><\/p>\n<p>壓差預冷靠風扇建立壓差，迫使冷空氣穿過箱孔與產品間隙；箱孔不對齊或氣流短路時，庫溫低也不代表果心降得快。水冷以冷水接觸傳熱，但要控制水質與交叉污染。真空預冷則降低氣壓，使組織水分在低溫蒸發，帶走潛熱。<\/p>\n<p><strong>依器官結構選方法<\/strong><\/p>\n<p>葉菜表面積相對大，真空法常有效；大果實的果心熱須先傳到外層，表皮又限制蒸發，因此真空法可能慢且失重。方法選定後，還須量果心或代表部位溫度，訂冷卻終點，而不是只記處理分鐘。<\/p>\n<p><strong>感應的是日夜節律，常以夜長最關鍵<\/strong><\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<p><strong>感光與光合作用不是同一需求<\/strong><\/p>\n<p>暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。<\/p>\n<p><strong>產期調節須兼顧可感應階段<\/strong><\/p>\n<p>植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Force-air precooling（通常寫 forced-air）強制通風預冷：以壓差使冷空氣穿過產品及包裝孔隙，加速移除田間熱。Heterosis 雜種優勢：F1 在某性狀超越雙親平均或較優親本。Phytochromes 光敏素：感受紅光／遠紅光、以 Pr/Pfr 轉換調控萌芽、避陰與成花的受體。<\/td>\n<td>主要感受紅光與遠紅光及其比例，參與光形態建成，與藍光受體向光素不同。 移除田間熱的初步快速降溫，與之後持續維持低溫的冷藏不同。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>這題要特別注意<\/h3>\n<p>GDD 的基準溫與上限依作物而定，不能用同一公式參數預測所有作物；<\/p>\n<p>雌雄同株可能分別長雄花雌花，和兩性花不同。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Force-air precooling（通常寫 forced-air）強制通風預冷：以壓差使冷空氣穿過產品及包裝孔隙，加速移除田間熱。Heterosis 雜種優勢：F1 在某性狀超越雙親平均或較優親本。Phytochromes 光敏素：感受紅光／遠紅光、以 Pr/Pfr 轉換調控萌芽、避陰與成花的受體。<\/p>\n<p>Growing Degree Days 生長度日：每日適用溫度超過基準溫的有效熱量累積，簡式 Σmax[0,(Tmax+Tmin)/2−Tbase]，亦可設上下限。Mulches 覆蓋物：地表有機／無機材料，調水溫、抑草與防蝕。Hermaphrodite 兩性花／雌雄同花：同一朵花有雄蕊與雌蕊。<\/p>\n<p>採收時產品常接近田間溫度；若只把大量溫熱貨物放進冷庫，外層先冷、箱內與果心仍熱，呼吸及失水會持續。預冷的目標是迅速降低產品溫度，冷藏則是把已降溫的產品維持在適溫，兩者目的與設備負荷不同。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>包裝場可將同一箱產品放置多點溫度計，畫降溫曲線，比較箱心與外側。這能檢查通氣孔、堆裝與風量是否合適，也可同時量失重，避免用犧牲水分換取冷卻速度。<\/p>\n<p>菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。<\/p>\n<table>\n<thead>\n<tr>\n<th>方法<\/th>\n<th>主要傳熱機制<\/th>\n<th>判斷重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>房冷<\/td>\n<td>自然或一般循環冷空氣<\/td>\n<td>便宜但箱心降溫較慢<\/td>\n<\/tr>\n<tr>\n<td>壓差<\/td>\n<td>強制冷氣穿箱<\/td>\n<td>箱孔與氣流路徑<\/td>\n<\/tr>\n<tr>\n<td>水冷<\/td>\n<td>冷水接觸傳熱<\/td>\n<td>耐水性與水衛生<\/td>\n<\/tr>\n<tr>\n<td>真空<\/td>\n<td>減壓蒸發吸熱<\/td>\n<td>表面積、失水與器官構造<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>24 分：六名詞各 4 分，定義、機制／式及例。<\/p>\n<ul>\n<li><strong>六名詞各 4 分，定義<\/strong><\/li>\n<li><strong>機制／式及例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把預冷寫成單純放進冰箱，沒有交代移除田間熱。<\/li>\n<li>把短日反應簡化為光越少花越多。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../C115.pdf#page=2","md":"115年蔬菜學_逐題教學詳解.md","search":"六名詞 ## 第五題｜六名詞（24 分）\n\n### 題意與作答範圍\n\n本題重點：**六名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c115.pdf#page=2)。\n\n### 先掌握答案\n\nforce-air precooling（通常寫 forced-air）強制通風預冷：以壓差使冷空氣穿過產品及包裝孔隙，加速移除田間熱。heterosis 雜種優勢：f1 在某性狀超越雙親平均或較優親本。phytochromes 光敏素：感受紅光／遠紅光、以 pr/pfr 轉換調控萌芽、避陰與成花的受體。\n\ngrowing degree days 生長度日：每日適用溫度超過基準溫的有效熱量累積，簡式 σmax[0,(tmax+tmin)/2−tbase]，亦可設上下限。mulches 覆蓋物：地表有機／無機材料，調水溫、抑草與防蝕。hermaphrodite 兩性花／雌雄同花：同一朵花有雄蕊與雌蕊。\n\n### 原理拆解：為什麼會這樣？\n\n**先分清預冷與冷藏**\n\n採收時產品常接近田間溫度；若只把大量溫熱貨物放進冷庫，外層先冷、箱內與果心仍熱，呼吸及失水會持續。預冷的目標是迅速降低產品溫度，冷藏則是把已降溫的產品維持在適溫，兩者目的與設備負荷不同。\n\n**冷得快，必須讓熱有出口**\n\n壓差預冷靠風扇建立壓差，迫使冷空氣穿過箱孔與產品間隙；箱孔不對齊或氣流短路時，庫溫低也不代表果心降得快。水冷以冷水接觸傳熱，但要控制水質與交叉污染。真空預冷則降低氣壓，使組織水分在低溫蒸發，帶走潛熱。\n\n**依器官結構選方法**\n\n葉菜表面積相對大，真空法常有效；大果實的果心熱須先傳到外層，表皮又限制蒸發，因此真空法可能慢且失重。方法選定後，還須量果心或代表部位溫度，訂冷卻終點，而不是只記處理分鐘。\n\n**感應的是日夜節律，常以夜長最關鍵**\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n**感光與光合作用不是同一需求**\n\n暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。\n\n**產期調節須兼顧可感應階段**\n\n植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| force-air precooling（通常寫 forced-air）強制通風預冷：以壓差使冷空氣穿過產品及包裝孔隙，加速移除田間熱。heterosis 雜種優勢：f1 在某性狀超越雙親平均或較優親本。phytochromes 光敏素：感受紅光／遠紅光、以 pr/pfr 轉換調控萌芽、避陰與成花的受體。 | 主要感受紅光與遠紅光及其比例，參與光形態建成，與藍光受體向光素不同。 移除田間熱的初步快速降溫，與之後持續維持低溫的冷藏不同。 |\n\n### 這題要特別注意\n\ngdd 的基準溫與上限依作物而定，不能用同一公式參數預測所有作物；\n\n雌雄同株可能分別長雄花雌花，和兩性花不同。\n\n### 可直接練寫的完整答案\n\nforce-air precooling（通常寫 forced-air）強制通風預冷：以壓差使冷空氣穿過產品及包裝孔隙，加速移除田間熱。heterosis 雜種優勢：f1 在某性狀超越雙親平均或較優親本。phytochromes 光敏素：感受紅光／遠紅光、以 pr/pfr 轉換調控萌芽、避陰與成花的受體。\n\ngrowing degree days 生長度日：每日適用溫度超過基準溫的有效熱量累積，簡式 σmax[0,(tmax+tmin)/2−tbase]，亦可設上下限。mulches 覆蓋物：地表有機／無機材料，調水溫、抑草與防蝕。hermaphrodite 兩性花／雌雄同花：同一朵花有雄蕊與雌蕊。\n\n採收時產品常接近田間溫度；若只把大量溫熱貨物放進冷庫，外層先冷、箱內與果心仍熱，呼吸及失水會持續。預冷的目標是迅速降低產品溫度，冷藏則是把已降溫的產品維持在適溫，兩者目的與設備負荷不同。\n\n### 實例：把原理用在情境中\n\n包裝場可將同一箱產品放置多點溫度計，畫降溫曲線，比較箱心與外側。這能檢查通氣孔、堆裝與風量是否合適，也可同時量失重，避免用犧牲水分換取冷卻速度。\n\n菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。\n\n| 方法 | 主要傳熱機制 | 判斷重點 |\n| --- | --- | --- |\n| 房冷 | 自然或一般循環冷空氣 | 便宜但箱心降溫較慢 |\n| 壓差 | 強制冷氣穿箱 | 箱孔與氣流路徑 |\n| 水冷 | 冷水接觸傳熱 | 耐水性與水衛生 |\n| 真空 | 減壓蒸發吸熱 | 表面積、失水與器官構造 |\n\n### 配分重點：哪些內容不能漏？\n\n24 分：六名詞各 4 分，定義、機制／式及例。\n\n- **六名詞各 4 分，定義**\n- **機制／式及例**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把預冷寫成單純放進冰箱，沒有交代移除田間熱。\n- 把短日反應簡化為光越少花越多。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 115 蔬菜學"},{"id":"蔬菜學-115-六","s":"蔬菜學","y":115,"n":"六","t":"英文翻譯","body":"<h2>第六題｜英文翻譯（11 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>英文翻譯<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C115.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。<\/p>\n<h3>完整參考譯文<\/h3>\n<p>番茄在營養上的重要性，主要可由其含有多種促進健康的化合物來解釋，包括維生素、類胡蘿蔔素與酚類化合物。這些生物活性化合物具有廣泛的生理性質，包括抗發炎、抗過敏、抗微生物、心臟保護與抗氧化作用。番茄富含類胡蘿蔔素，是人類飲食中茄紅素的主要來源。<\/p>\n<p>類胡蘿蔔素及多酚化合物有助於番茄的營養價值，並改善其機能屬性與感官品質，包括味道、香氣及質地。除了經濟與營養上的重要性，番茄也已成為研究肉質果實發育的模式植物。其完整基因體已完成定序，提供豐富的基因體資源；<\/p>\n<p>此物種也有遺傳圖譜、物理圖譜與分子標誌可利用。有些資料庫收錄基因表現分析資料，而番茄代謝體學的近期進展，已提供大量資訊，幫助了解此物種的初級及特化代謝，以及參與分子生合成和更新／降解的途徑。<\/p>\n<h3>讀懂這段研究在說什麼<\/h3>\n<p><strong>從營養價值延伸到模式植物資源<\/strong><\/p>\n<p>先列生物活性物質與感官品質，再說番茄作為肉質果實研究模式的基因體、圖譜、表現與代謝體資源。carotenoids 是較大類，lycopene 是其中茄紅素；specialized metabolism 為特化代謝，turnover 包含合成分解更新，不只是運輸或周轉金。<\/p>\n<h3>專業詞彙與翻譯辨析<\/h3>\n<table>\n<thead>\n<tr>\n<th>英文用語<\/th>\n<th>建議譯法<\/th>\n<th>讀法與限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>molecular markers<\/td>\n<td>分子標誌<\/td>\n<td>用於辨識基因型或連鎖區段<\/td>\n<\/tr>\n<tr>\n<td>specialized metabolism<\/td>\n<td>特化代謝<\/td>\n<td>也常與次級代謝的概念相關<\/td>\n<\/tr>\n<tr>\n<td>turnover<\/td>\n<td>更新<\/td>\n<td>合成與分解更新，非僅運輸<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>容易譯錯的地方<\/h3>\n<p>specialized metabolism 為特化代謝；turnover 包含合成與分解更新，不能只譯成運輸。<\/p>\n<h3>配分重點與檢查順序<\/h3>\n<p>11 分：色素與生物活性、感官、模式植物及基因體／代謝體資源全文。<\/p>\n<p>先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。<\/p>\n<h3>常見失分<\/h3>\n<ul>\n<li>把專業名詞按一般字義翻譯，或把相關性改成因果。<\/li>\n<li>省略轉折、條件或限制，使研究結論比原文更強。<\/li>\n<li>以摘要取代全文翻譯。<\/li>\n<\/ul>","source":"../../C115.pdf#page=2","md":"115年蔬菜學_逐題教學詳解.md","search":"英文翻譯 ## 第六題｜英文翻譯（11 分）\n\n### 題意與作答範圍\n\n本題重點：**英文翻譯**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c115.pdf#page=2)。\n\n### 先掌握答案\n\n這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。\n\n### 完整參考譯文\n\n番茄在營養上的重要性，主要可由其含有多種促進健康的化合物來解釋，包括維生素、類胡蘿蔔素與酚類化合物。這些生物活性化合物具有廣泛的生理性質，包括抗發炎、抗過敏、抗微生物、心臟保護與抗氧化作用。番茄富含類胡蘿蔔素，是人類飲食中茄紅素的主要來源。\n\n類胡蘿蔔素及多酚化合物有助於番茄的營養價值，並改善其機能屬性與感官品質，包括味道、香氣及質地。除了經濟與營養上的重要性，番茄也已成為研究肉質果實發育的模式植物。其完整基因體已完成定序，提供豐富的基因體資源；\n\n此物種也有遺傳圖譜、物理圖譜與分子標誌可利用。有些資料庫收錄基因表現分析資料，而番茄代謝體學的近期進展，已提供大量資訊，幫助了解此物種的初級及特化代謝，以及參與分子生合成和更新／降解的途徑。\n\n### 讀懂這段研究在說什麼\n\n**從營養價值延伸到模式植物資源**\n\n先列生物活性物質與感官品質，再說番茄作為肉質果實研究模式的基因體、圖譜、表現與代謝體資源。carotenoids 是較大類，lycopene 是其中茄紅素；specialized metabolism 為特化代謝，turnover 包含合成分解更新，不只是運輸或周轉金。\n\n### 專業詞彙與翻譯辨析\n\n| 英文用語 | 建議譯法 | 讀法與限制 |\n| --- | --- | --- |\n| molecular markers | 分子標誌 | 用於辨識基因型或連鎖區段 |\n| specialized metabolism | 特化代謝 | 也常與次級代謝的概念相關 |\n| turnover | 更新 | 合成與分解更新，非僅運輸 |\n\n### 容易譯錯的地方\n\nspecialized metabolism 為特化代謝；turnover 包含合成與分解更新，不能只譯成運輸。\n\n### 配分重點與檢查順序\n\n11 分：色素與生物活性、感官、模式植物及基因體／代謝體資源全文。\n\n先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。\n\n### 常見失分\n\n- 把專業名詞按一般字義翻譯，或把相關性改成因果。\n- 省略轉折、條件或限制，使研究結論比原文更強。\n- 以摘要取代全文翻譯。\n 115 蔬菜學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
