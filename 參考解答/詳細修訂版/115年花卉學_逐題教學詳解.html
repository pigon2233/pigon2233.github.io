點：<strong>扦插發根的內、外因素<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B115.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>內因有物種品種、母株健康與營養、枝條年齡成熟度、季節、葉芽保留、碳氮狀態、內生生長素及發根抑制物。外因有溫度、光量與日長、空氣濕度、介質水氣比、氧氣、病原、插穗切口及外施 IBA 等處理。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>插穗先要維持存活與能量，才可能分化不定根；<\/p>\n<p>高氮徒長枝不一定最容易根。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>內因有物種品種、母株健康與營養、枝條年齡成熟度、季節、葉芽保留、碳氮狀態、內生生長素及發根抑制物。外因有溫度、光量與日長、空氣濕度、介質水氣比、氧氣、病原、插穗切口及外施 IBA 等處理。<\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：內在與外在各多項，母株碳氮、激素及介質水氣。<\/p>\n<ul>\n<li><strong>內在與外在各多項，母株碳氮<\/strong><\/li>\n<li><strong>激素及介質水氣<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<\/ul>","source":"../../B115.pdf#page=2","md":"115年花卉學_逐題教學詳解.md","search":"扦插發根的內、外因素 ## 第一題｜扦插發根的內、外因素（10 分）\n\n### 題意與作答範圍\n\n本題重點：**扦插發根的內、外因素**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b115.pdf#page=2)。\n\n### 先掌握答案\n\n內因有物種品種、母株健康與營養、枝條年齡成熟度、季節、葉芽保留、碳氮狀態、內生生長素及發根抑制物。外因有溫度、光量與日長、空氣濕度、介質水氣比、氧氣、病原、插穗切口及外施 iba 等處理。\n\n### 原理拆解：為什麼會這樣？\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n### 這題要特別注意\n\n插穗先要維持存活與能量，才可能分化不定根；\n\n高氮徒長枝不一定最容易根。\n\n### 可直接練寫的完整答案\n\n內因有物種品種、母株健康與營養、枝條年齡成熟度、季節、葉芽保留、碳氮狀態、內生生長素及發根抑制物。外因有溫度、光量與日長、空氣濕度、介質水氣比、氧氣、病原、插穗切口及外施 iba 等處理。\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n### 實例：把原理用在情境中\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：內在與外在各多項，母株碳氮、激素及介質水氣。\n\n- **內在與外在各多項，母株碳氮**\n- **激素及介質水氣**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無性繁殖與無病毒畫上等號。\n 115 花卉學"},{"id":"花卉學-115-二","s":"花卉學","y":115,"n":"二","t":"原生蕙蘭與蝴蝶蘭物種","body":"<h2>第二題｜原生蕙蘭與蝴蝶蘭物種（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>原生蕙蘭與蝴蝶蘭物種<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B115.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>原生蕙蘭可舉報歲蘭 Cymbidium sinense、四季蘭 Cymbidium ensifolium、金稜邊 Cymbidium floribundum；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>原生種與商品雜交群要分清<\/strong><\/p>\n<p>原生蕙蘭舉例應寫到物種名，而不是僅寫 Cymbidium 一個屬；蝴蝶蘭商業品種多為複雜雜交背景，不能把所有白花商品種都當同一野生種。列原生種後可補其花色、花型、開花期或適應性作為育種資源，並注意保育、合法取得與病原檢測。<\/p>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>前半限定臺灣原生 Cymbidium，後半是經濟蘭育種所用 Phalaenopsis 物種，不能用雜交商品名替代物種名。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>原生蕙蘭可舉報歲蘭 Cymbidium sinense、四季蘭 Cymbidium ensifolium、金稜邊 Cymbidium floribundum；<\/p>\n<p>商業育種常用蝴蝶蘭原生種可舉臺灣白花蝴蝶蘭 Phalaenopsis aphrodite（臺灣分類常處理為 subsp. formosana）及姬蝴蝶蘭 Phalaenopsis equestris。<\/p>\n<p>原生蕙蘭舉例應寫到物種名，而不是僅寫 Cymbidium 一個屬；蝴蝶蘭商業品種多為複雜雜交背景，不能把所有白花商品種都當同一野生種。列原生種後可補其花色、花型、開花期或適應性作為育種資源，並注意保育、合法取得與病原檢測。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：三臺灣原生蕙蘭與二經濟育種蝴蝶蘭，物種名非商品名。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<\/ul>","source":"../../B115.pdf#page=2","md":"115年花卉學_逐題教學詳解.md","search":"原生蕙蘭與蝴蝶蘭物種 ## 第二題｜原生蕙蘭與蝴蝶蘭物種（10 分）\n\n### 題意與作答範圍\n\n本題重點：**原生蕙蘭與蝴蝶蘭物種**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b115.pdf#page=2)。\n\n### 先掌握答案\n\n原生蕙蘭可舉報歲蘭 cymbidium sinense、四季蘭 cymbidium ensifolium、金稜邊 cymbidium floribundum；\n\n### 原理拆解：為什麼會這樣？\n\n**原生種與商品雜交群要分清**\n\n原生蕙蘭舉例應寫到物種名，而不是僅寫 cymbidium 一個屬；蝴蝶蘭商業品種多為複雜雜交背景，不能把所有白花商品種都當同一野生種。列原生種後可補其花色、花型、開花期或適應性作為育種資源，並注意保育、合法取得與病原檢測。\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n### 這題要特別注意\n\n前半限定臺灣原生 cymbidium，後半是經濟蘭育種所用 phalaenopsis 物種，不能用雜交商品名替代物種名。\n\n### 可直接練寫的完整答案\n\n原生蕙蘭可舉報歲蘭 cymbidium sinense、四季蘭 cymbidium ensifolium、金稜邊 cymbidium floribundum；\n\n商業育種常用蝴蝶蘭原生種可舉臺灣白花蝴蝶蘭 phalaenopsis aphrodite（臺灣分類常處理為 subsp. formosana）及姬蝴蝶蘭 phalaenopsis equestris。\n\n原生蕙蘭舉例應寫到物種名，而不是僅寫 cymbidium 一個屬；蝴蝶蘭商業品種多為複雜雜交背景，不能把所有白花商品種都當同一野生種。列原生種後可補其花色、花型、開花期或適應性作為育種資源，並注意保育、合法取得與病原檢測。\n\n### 實例：把原理用在情境中\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：三臺灣原生蕙蘭與二經濟育種蝴蝶蘭，物種名非商品名。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把轉入基因成功直接等同育成可商業化品種。\n 115 花卉學"},{"id":"花卉學-115-三","s":"花卉學","y":115,"n":"三","t":"百合鱗莖與摘蕾","body":"<h2>第三題｜百合鱗莖與摘蕾（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>百合鱗莖與摘蕾<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B115.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>(1)抽莖初期地下有原有鱗片與基盤短縮莖、由基盤發出的基生根；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>摘蕾的效益來自改變庫競爭<\/strong><\/p>\n<p>花蕾與新鱗莖都會吸收同化物，露蕾期去除花蕾可把資源轉向地下貯藏。若連莖葉也大量去除，就同時破壞供源，未必能增球。應區分種球生產與切花生產目標：前者看球重、周徑和健康，後者須兼顧當期花枝品質，不能把相反採收目標混成同一操作。<\/p>\n<p><strong>鱗莖是當期萌發與下一期生長的貯藏器官<\/strong><\/p>\n<p>肉質鱗片葉連在基盤，提供萌芽抽莖初期的資源；隨後新葉光合，再回補新生鱗片與子球。鱗莖不是實心球莖，也不是肥大根。<\/p>\n<p><strong>種球歷程影響開花整齊度<\/strong><\/p>\n<p>品種、球徑、養球成熟度、健康與低溫處理會影響抽芽和花芽發育。採購指定規格種球是成品生產的重要起點；僅知道當地有原生百合，不能推定可直接取代商業種球。<\/p>\n<p><strong>種球生產與切花採收目標不同<\/strong><\/p>\n<p>養球可適期摘蕾減少生殖庫競爭，並保留健康莖葉供碳；切花則須在可正常開放的顯色蕾期採收並注意補水保鮮。切得過低會減少留田葉量，後續球重與再生可能受影響。<\/p>\n<p><strong>先把源與庫接起來<\/strong><\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<p><strong>壓力流與跨膜運輸不是同一層次<\/strong><\/p>\n<p>源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；H⁺-ATPase 建立電化學梯度，可支援 H⁺／蔗糖共運輸。<\/p>\n<p><strong>庫強決定競爭，不只看果實大小<\/strong><\/p>\n<p>庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>鱗莖由短縮莖與肉質鱗片葉組成，非實心球莖；<\/p>\n<p>摘蕾不會使所有母鱗片永遠不衰老。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>(1)抽莖初期地下有原有鱗片與基盤短縮莖、由基盤發出的基生根；<\/p>\n<p>地上莖伸長後地下莖部可長莖生根。原鱗片供應抽莖能量，隨新芽與新鱗片發育形成下一代貯藏組織，母鱗片逐漸耗用、衰老。<\/p>\n<p>(2)露蕾期摘蕾移除強勢生殖庫，減少花器消耗，讓葉片同化物更多回流新鱗莖與子球；<\/p>\n<p>可增加球重並延緩因開花競爭造成的鱗片耗竭，但仍需保留健康莖葉與適當生長條件。<\/p>\n<p>花蕾與新鱗莖都會吸收同化物，露蕾期去除花蕾可把資源轉向地下貯藏。若連莖葉也大量去除，就同時破壞供源，未必能增球。應區分種球生產與切花生產目標：前者看球重、周徑和健康，後者須兼顧當期花枝品質，不能把相反採收目標混成同一操作。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一品種若用不同球徑與不同低溫歷程，花枝高度和開花整齊度可能不同；試驗應先固定種球規格，再比較肥水，否則難分辨管理效果。<\/p>\n<p>同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：抽莖期鱗莖構造 5，摘蕾改源庫、球重與衰老 10。<\/p>\n<ul>\n<li><strong>抽莖期鱗莖構造 5，摘蕾改源庫<\/strong><\/li>\n<li><strong>球重與衰老 10<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將百合鱗莖誤寫成唐菖蒲式實心球莖。<\/li>\n<li>把長距離糖運輸寫成主要沿木質部。<\/li>\n<\/ul>","source":"../../B115.pdf#page=2","md":"115年花卉學_逐題教學詳解.md","search":"百合鱗莖與摘蕾 ## 第三題｜百合鱗莖與摘蕾（15 分）\n\n### 題意與作答範圍\n\n本題重點：**百合鱗莖與摘蕾**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b115.pdf#page=2)。\n\n### 先掌握答案\n\n(1)抽莖初期地下有原有鱗片與基盤短縮莖、由基盤發出的基生根；\n\n### 原理拆解：為什麼會這樣？\n\n**摘蕾的效益來自改變庫競爭**\n\n花蕾與新鱗莖都會吸收同化物，露蕾期去除花蕾可把資源轉向地下貯藏。若連莖葉也大量去除，就同時破壞供源，未必能增球。應區分種球生產與切花生產目標：前者看球重、周徑和健康，後者須兼顧當期花枝品質，不能把相反採收目標混成同一操作。\n\n**鱗莖是當期萌發與下一期生長的貯藏器官**\n\n肉質鱗片葉連在基盤，提供萌芽抽莖初期的資源；隨後新葉光合，再回補新生鱗片與子球。鱗莖不是實心球莖，也不是肥大根。\n\n**種球歷程影響開花整齊度**\n\n品種、球徑、養球成熟度、健康與低溫處理會影響抽芽和花芽發育。採購指定規格種球是成品生產的重要起點；僅知道當地有原生百合，不能推定可直接取代商業種球。\n\n**種球生產與切花採收目標不同**\n\n養球可適期摘蕾減少生殖庫競爭，並保留健康莖葉供碳；切花則須在可正常開放的顯色蕾期採收並注意補水保鮮。切得過低會減少留田葉量，後續球重與再生可能受影響。\n\n**先把源與庫接起來**\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n**壓力流與跨膜運輸不是同一層次**\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n**庫強決定競爭，不只看果實大小**\n\n庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。\n\n### 這題要特別注意\n\n鱗莖由短縮莖與肉質鱗片葉組成，非實心球莖；\n\n摘蕾不會使所有母鱗片永遠不衰老。\n\n### 可直接練寫的完整答案\n\n(1)抽莖初期地下有原有鱗片與基盤短縮莖、由基盤發出的基生根；\n\n地上莖伸長後地下莖部可長莖生根。原鱗片供應抽莖能量，隨新芽與新鱗片發育形成下一代貯藏組織，母鱗片逐漸耗用、衰老。\n\n(2)露蕾期摘蕾移除強勢生殖庫，減少花器消耗，讓葉片同化物更多回流新鱗莖與子球；\n\n可增加球重並延緩因開花競爭造成的鱗片耗竭，但仍需保留健康莖葉與適當生長條件。\n\n花蕾與新鱗莖都會吸收同化物，露蕾期去除花蕾可把資源轉向地下貯藏。若連莖葉也大量去除，就同時破壞供源，未必能增球。應區分種球生產與切花生產目標：前者看球重、周徑和健康，後者須兼顧當期花枝品質，不能把相反採收目標混成同一操作。\n\n### 實例：把原理用在情境中\n\n同一品種若用不同球徑與不同低溫歷程，花枝高度和開花整齊度可能不同；試驗應先固定種球規格，再比較肥水，否則難分辨管理效果。\n\n同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：抽莖期鱗莖構造 5，摘蕾改源庫、球重與衰老 10。\n\n- **抽莖期鱗莖構造 5，摘蕾改源庫**\n- **球重與衰老 10**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將百合鱗莖誤寫成唐菖蒲式實心球莖。\n- 把長距離糖運輸寫成主要沿木質部。\n 115 花卉學"},{"id":"花卉學-115-四","s":"花卉學","y":115,"n":"四","t":"色素有限而花色多變","body":"<h2>第四題｜色素有限而花色多變（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>色素有限而花色多變<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B115.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>花色由花青素、類胡蘿蔔素、甜菜色素等種類、含量與比例決定；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先找色素，再找影響顯色的環境<\/strong><\/p>\n<p>花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。<\/p>\n<p><strong>同一色素也能呈不同顏色<\/strong><\/p>\n<p>液泡 pH、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 pH 不會不經生理過程就等於花瓣液泡 pH。<\/p>\n<p><strong>用可驗證的機制解釋栽培或育種操作<\/strong><\/p>\n<p>繡球花的藍色涉及鋁有效性與花器內的色素複合，需同時考慮品種與介質；藍玫瑰育種則涉及花青素生合成途徑、競爭酵素與細胞條件。不能只以「施酸肥」解釋所有藍花。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>相同色素可因細胞環境呈不同色，白花也可能源自缺乏色素或光散射。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>花色由花青素、類胡蘿蔔素、甜菜色素等種類、含量與比例決定；<\/p>\n<p>再受液泡 pH、金屬離子、共色素、色素糖基化與醯基化、細胞分布、表皮細胞形狀及光學散射影響。光、溫度、營養及花齡改變生合成與降解，基因調控使花斑、條紋、漸層等多樣化。<\/p>\n<p>花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。<\/p>\n<p>液泡 pH、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 pH 不會不經生理過程就等於花瓣液泡 pH。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同品種繡球在適合條件下，可因根域酸度影響鋁有效性而改變顯色；白花或缺乏相關色素能力的品種，不能保證以同一方法轉成藍花。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：色素種類之外，pH、共色、離子、結構及環境實例。<\/p>\n<ul>\n<li><strong>色素種類之外，pH<\/strong><\/li>\n<li><strong>結構及環境實例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有黃花都歸因於花青素。<\/li>\n<\/ul>","source":"../../B115.pdf#page=2","md":"115年花卉學_逐題教學詳解.md","search":"色素有限而花色多變 ## 第四題｜色素有限而花色多變（10 分）\n\n### 題意與作答範圍\n\n本題重點：**色素有限而花色多變**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b115.pdf#page=2)。\n\n### 先掌握答案\n\n花色由花青素、類胡蘿蔔素、甜菜色素等種類、含量與比例決定；\n\n### 原理拆解：為什麼會這樣？\n\n**先找色素，再找影響顯色的環境**\n\n花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。\n\n**同一色素也能呈不同顏色**\n\n液泡 ph、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 ph 不會不經生理過程就等於花瓣液泡 ph。\n\n**用可驗證的機制解釋栽培或育種操作**\n\n繡球花的藍色涉及鋁有效性與花器內的色素複合，需同時考慮品種與介質；藍玫瑰育種則涉及花青素生合成途徑、競爭酵素與細胞條件。不能只以「施酸肥」解釋所有藍花。\n\n### 這題要特別注意\n\n相同色素可因細胞環境呈不同色，白花也可能源自缺乏色素或光散射。\n\n### 可直接練寫的完整答案\n\n花色由花青素、類胡蘿蔔素、甜菜色素等種類、含量與比例決定；\n\n再受液泡 ph、金屬離子、共色素、色素糖基化與醯基化、細胞分布、表皮細胞形狀及光學散射影響。光、溫度、營養及花齡改變生合成與降解，基因調控使花斑、條紋、漸層等多樣化。\n\n花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。\n\n液泡 ph、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色 /ul>","source":"../../B115.pdf#page=2","md":"115年花卉學_逐題教學詳解.md","search":"設施土耕連作障礙 ## 第六題｜設施土耕連作障礙（10 分）\n\n### 題意與作答範圍\n\n本題重點：**設施土耕連作障礙**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b115.pdf#page=2)。\n\n### 先掌握答案\n\n長期同作物使土傳病原與線蟲累積；\n\n### 原理拆解：為什麼會這樣？\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n### 這題要特別注意\n\n連作障礙為多因子問題，單次施殺菌劑通常不能全面解決。\n\n### 可直接練寫的完整答案\n\n長期同作物使土傳病原與線蟲累積；\n\n降雨淋洗少、施肥偏多導致鹽累積、ph 與離子失衡；\n\n有機質、結構、根系分泌物與微生物群落也會改變。改善輪作、抗病砧木與健康苗、清除殘根、蒸汽或太陽能消毒、合理灌洗排水、測土施肥、腐熟有機質與必要時改無土栽培。\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n### 實例：把原理用在情境中\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：病原、鹽化、土壤生態及各改善，單藥不足。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將連作障礙全部歸因於缺肥。\n 115 花卉學"},{"id":"花卉學-115-七","s":"花卉學","y":115,"n":"七","t":"蕾期採收與 pulse solution","body":"<h2>第七題｜蕾期採收與 pulse solution（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>蕾期採收與 pulse solution<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B115.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>蕾期採收能降低花瓣機械傷、增加包裝密度、便於長途運輸、同步市場開花並延長觀賞窗口。強制開花脈衝液通常以較高濃度糖為能源，搭配抑菌劑與酸化劑；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>切離後的水分與碳收支轉為赤字<\/strong><\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p><strong>不同處理各有明確功能<\/strong><\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<p><strong>採收成熟度與溫度決定後續品質上限<\/strong><\/p>\n<p>過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>花蕾須已達可採成熟度，過幼花蕾即使補糖也不一定正常開放；<\/p>\n<p>pulse 是短期高強度處理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>蕾期採收能降低花瓣機械傷、增加包裝密度、便於長途運輸、同步市場開花並延長觀賞窗口。強制開花脈衝液通常以較高濃度糖為能源，搭配抑菌劑與酸化劑；<\/p>\n<p>依種類另加抗乙烯成分等，短時間處理後轉正常保持液。<\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：蕾採目的、採熟門檻、糖抑菌酸化與短時脈衝特性。<\/p>\n<ul>\n<li><strong>蕾採目的<\/strong><\/li>\n<li><strong>採熟門檻<\/strong><\/li>\n<li><strong>糖抑菌酸化與短時脈衝特性<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短時高濃度預措液與全程瓶插液視為相同用法。<\/li>\n<\/ul>","source":"../../B115.pdf#page=2","md":"115年花卉學_逐題教學詳解.md","search":"蕾期採收與 pulse solution ## 第七題｜蕾期採收與 pulse solution（10 分）\n\n### 題意與作答範圍\n\n本題重點：**蕾期採收與 pulse solution**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b115.pdf#page=2)。\n\n### 先掌握答案\n\n蕾期採收能降低花瓣機械傷、增加包裝密度、便於長途運輸、同步市場開花並延長觀賞窗口。強制開花脈衝液通常以較高濃度糖為能源，搭配抑菌劑與酸化劑；\n\n### 原理拆解：為什麼會這樣？\n\n**切離後的水分與碳收支轉為赤字**\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n**不同處理各有明確功能**\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n**採收成熟度與溫度決定後續品質上限**\n\n過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。\n\n### 這題要特別注意\n\n花蕾須已達可採成熟度，過幼花蕾即使補糖也不一定正常開放；\n\npulse 是短期高強度處理。\n\n### 可直接練寫的完整答案\n\n蕾期採收能降低花瓣機械傷、增加包裝密度、便於長途運輸、同步市場開花並延長觀賞窗口。強制開花脈衝液通常以較高濃度糖為能源，搭配抑菌劑與酸化劑；\n\n依種類另加抗乙烯成分等，短時間處理後轉正常保持液。\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n### 實例：把原理用在情境中\n\n百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：蕾採目的、採熟門檻、糖抑菌酸化與短時脈衝特性。\n\n- **蕾採目的**\n- **採熟門檻**\n- **糖抑菌酸化與短時脈衝特性**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短時高濃度預措液與全程瓶插液視為相同用法。\n 115 花卉學"},{"id":"花卉學-115-八","s":"花卉學","y":115,"n":"八","t":"十項花器翻譯","body":"<h2>第八題｜十項花器翻譯（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>十項花器翻譯<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B115.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<ol>\n<li>\n<p>Petal 花瓣；<\/p>\n<\/li>\n<li>\n<p>Perianth 花被；<\/p>\n<\/li>\n<li>\n<p>Peduncle 花序梗／花梗（單花時）；<\/p>\n<\/li>\n<li>\n<p>Pistil 雌蕊；<\/p>\n<\/li>\n<li>\n<p>Ovule 胚珠；<\/p>\n<\/li>\n<li>\n<p>Ovary 子房；<\/p>\n<\/li>\n<li>\n<p>Sepal 萼片；<\/p>\n<\/li>\n<li>\n<p>Stamen 雄蕊；<\/p>\n<\/li>\n<li>\n<p>Stigma 柱頭；<\/p>\n<\/li>\n<li>\n<p>Style 花柱。<\/p>\n<\/li>\n<\/ol>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>器官來源比外觀名稱更可靠<\/strong><\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<p><strong>不同分類軸不能混用<\/strong><\/p>\n<p>花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。<\/p>\n<p><strong>名稱與例子要一對一<\/strong><\/p>\n<p>寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5. Ovule 胚珠；<\/td>\n<td>多在受精後形成種子，胚珠與子房兩者層級不同。<\/td>\n<\/tr>\n<tr>\n<td>6. Ovary 子房；<\/td>\n<td>通常發育成果實的核心組織；附屬花部也可參與形成可食部。<\/td>\n<\/tr>\n<tr>\n<td>9. Stigma 柱頭；<\/td>\n<td>負責接受花粉，與花柱的支持及花粉管通道功能不同。<\/td>\n<\/tr>\n<tr>\n<td>10. Style 花柱。<\/td>\n<td>連接柱頭與子房，花粉管可沿其組織生長，並不是花序總梗。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>這題要特別注意<\/h3>\n<p>pedicel 是小花梗，peduncle 通常為花序總梗；<\/p>\n<p>胚珠受精後形成種子，子房通常形成果實。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<ol>\n<li>\n<p>Petal 花瓣；<\/p>\n<\/li>\n<li>\n<p>Perianth 花被；<\/p>\n<\/li>\n<li>\n<p>Peduncle 花序梗／花梗（單花時）；<\/p>\n<\/li>\n<li>\n<p>Pistil 雌蕊；<\/p>\n<\/li>\n<li>\n<p>Ovule 胚珠；<\/p>\n<\/li>\n<li>\n<p>Ovary 子房；<\/p>\n<\/li>\n<li>\n<p>Sepal 萼片；<\/p>\n<\/li>\n<li>\n<p>Stamen 雄蕊；<\/p>\n<\/li>\n<li>\n<p>Stigma 柱頭；<\/p>\n<\/li>\n<li>\n<p>Style 花柱。<\/p>\n<\/li>\n<\/ol>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：十譯名各 2 分；peduncle 與 pedicel、花被與花瓣區別。<\/p>\n<ul>\n<li><strong>十譯名各 2 分<\/strong><\/li>\n<li><strong>peduncle 與 pedicel<\/strong><\/li>\n<li><strong>花被與花瓣區別<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>看到地下器官就全部寫成根。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../B115.pdf#page=2","md":"115年花卉學_逐題教學詳解.md","search":"十項花器翻譯 ## 第八題｜十項花器翻譯（20 分）\n\n### 題意與作答範圍\n\n本題重點：**十項花器翻譯**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b115.pdf#page=2)。\n\n### 先掌握答案\n\n1. petal 花瓣；\n\n2. perianth 花被；\n\n3. peduncle 花序梗／花梗（單花時）；\n\n4. pistil 雌蕊；\n\n5. ovule 胚珠；\n\n6. ovary 子房；\n\n7. sepal 萼片；\n\n8. stamen 雄蕊；\n\n9. stigma 柱頭；\n\n10. style 花柱。\n\n### 原理拆解：為什麼會這樣？\n\n**器官來源比外觀名稱更可靠**\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n**不同分類軸不能混用**\n\n花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。\n\n**名稱與例子要一對一**\n\n寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| 5. ovule 胚珠； | 多在受精後形成種子，胚珠與子房兩者層級不同。 |\n| 6. ovary 子房； | 通常發育成果實的核心組織；附屬花部也可參與形成可食部。 |\n| 9. stigma 柱頭； | 負責接受花粉，與花柱的支持及花粉管通道功能不同。 |\n| 10. style 花柱。 | 連接柱頭與子房，花粉管可沿其組織生長，並不是花序總梗。 |\n\n### 這題要特別注意\n\npedicel 是小花梗，peduncle 通常為花序總梗；\n\n胚珠受精後形成種子，子房通常形成果實。\n\n### 可直接練寫的完整答案\n\n1. petal 花瓣；\n\n2. perianth 花被；\n\n3. peduncle 花序梗／花梗（單花時）；\n\n4. pistil 雌蕊；\n\n5. ovule 胚珠；\n\n6. ovary 子房；\n\n7. sepal 萼片；\n\n8. stamen 雄蕊；\n\n9. stigma 柱頭；\n\n10. style 花柱。\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n### 實例：把原理用在情境中\n\n馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：十譯名各 2 分；peduncle 與 pedicel、花被與花瓣區別。\n\n- **十譯名各 2 分**\n- **peduncle 與 pedicel**\n- **花被與花瓣區別**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 看到地下器官就全部寫成根。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 115 花卉學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
