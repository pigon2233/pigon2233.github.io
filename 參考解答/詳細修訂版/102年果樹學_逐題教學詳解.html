ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 7 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"果樹學-102-一","s":"果樹學","y":102,"n":"一","t":"綠檸檬轉黃流程","body":"<h2>第一題｜綠檸檬轉黃流程（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>綠檸檬轉黃流程<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=13\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>使用已生理成熟、大小及果汁率達標的綠檸檬，剔病傷與過嫩果，清潔乾燥後在通風、適溫高濕且不凝水的環境，以低濃度乙烯進行經驗證的脫綠，定時換氣排 CO₂、監測轉色及腐敗，再冷卻、分級包裝出貨。乙烯促葉綠素分解，使原有黃類胡蘿蔔素顯露，不能把幼果變成熟或增加本來不足的汁量。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>成熟反應與乙烯感受<\/strong><\/p>\n<p>乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。<\/p>\n<p><strong>更年性與非更年性要比較反應型態<\/strong><\/p>\n<p>具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。<\/p>\n<p><strong>催熟與延後成熟都不能忽略品質<\/strong><\/p>\n<p>乙烯可整齊催熟已達生理成熟的果，卻不能讓極幼果補足田間累積不足的乾物；1-MCP 阻斷感受可延緩部分產品老化，但過強處理可能影響正常後熟。脫綠、果肉軟化和增甜亦不是必然同步。<\/p>\n<p><strong>為何採後仍會變差<\/strong><\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p><strong>低溫有效，但有適用範圍<\/strong><\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<p><strong>把全程串起來<\/strong><\/p>\n<p>採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>使用已生理成熟、大小及果汁率達標的綠檸檬，剔病傷與過嫩果，清潔乾燥後在通風、適溫高濕且不凝水的環境，以低濃度乙烯進行經驗證的脫綠，定時換氣排 CO₂、監測轉色及腐敗，再冷卻、分級包裝出貨。乙烯促葉綠素分解，使原有黃類胡蘿蔔素顯露，不能把幼果變成熟或增加本來不足的汁量。<\/p>\n<p>乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。<\/p>\n<p>具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>香蕉在不當高溫下，果肉可軟化而果皮仍綠，顯示果肉成熟與葉綠素降解可不同步。不能僅看果皮未黃，就判斷乙烯完全沒有作用。<\/p>\n<p>驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：原料成熟、脫綠條件與機制、衛生換氣、終點與品質。<\/p>\n<ul>\n<li><strong>原料成熟<\/strong><\/li>\n<li><strong>脫綠條件與機制<\/strong><\/li>\n<li><strong>衛生換氣<\/strong><\/li>\n<li><strong>終點與品質<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>說非更年性果實完全不會回應乙烯。<\/li>\n<li>認為溫度越低、保存效果一定越好。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=13","md":"102年果樹學_逐題教學詳解.md","search":"綠檸檬轉黃流程 ## 第一題｜綠檸檬轉黃流程（20 分）\n\n### 題意與作答範圍\n\n本題重點：**綠檸檬轉黃流程**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=13)。\n\n### 先掌握答案\n\n使用已生理成熟、大小及果汁率達標的綠檸檬，剔病傷與過嫩果，清潔乾燥後在通風、適溫高濕且不凝水的環境，以低濃度乙烯進行經驗證的脫綠，定時換氣排 co₂、監測轉色及腐敗，再冷卻、分級包裝出貨。乙烯促葉綠素分解，使原有黃類胡蘿蔔素顯露，不能把幼果變成熟或增加本來不足的汁量。\n\n### 原理拆解：為什麼會這樣？\n\n**成熟反應與乙烯感受**\n\n乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。\n\n**更年性與非更年性要比較反應型態**\n\n具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。\n\n**催熟與延後成熟都不能忽略品質**\n\n乙烯可整齊催熟已達生理成熟的果，卻不能讓極幼果補足田間累積不足的乾物；1-mcp 阻斷感受可延緩部分產品老化，但過強處理可能影響正常後熟。脫綠、果肉軟化和增甜亦不是必然同步。\n\n**為何採後仍會變差**\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n**低溫有效，但有適用範圍**\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n**把全程串起來**\n\n採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。\n\n### 可直接練寫的完整答案\n\n使用已生理成熟、大小及果汁率達標的綠檸檬，剔病傷與過嫩果，清潔乾燥後在通風、適溫高濕且不凝水的環境，以低濃度乙烯進行經驗證的脫綠，定時換氣排 co₂、監測轉色及腐敗，再冷卻、分級包裝出貨。乙烯促葉綠素分解，使原有黃類胡蘿蔔素顯露，不能把幼果變成熟或增加本來不足的汁量。\n\n乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。\n\n具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。\n\n### 實例：把原理用在情境中\n\n香蕉在不當高溫下，果肉可軟化而果皮仍綠，顯示果肉成熟與葉綠素降解可不同步。不能僅看果皮未黃，就判斷乙烯完全沒有作用。\n\n驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：原料成熟、脫綠條件與機制、衛生換氣、終點與品質。\n\n- **原料成熟**\n- **脫綠條件與機制**\n- **衛生換氣**\n- **終點與品質**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 說非更年性果實完全不會回應乙烯。\n- 認為溫度越低、保存效果一定越好。\n 102 果樹學"},{"id":"果樹學-102-二","s":"果樹學","y":102,"n":"二","t":"新梢杯狀葉、葉緣壞死與果端軟化","body":"<h2>第二題｜新梢杯狀葉、葉緣壞死與果端軟化（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>新梢杯狀葉、葉緣壞死與果端軟化<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=13\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>綜合症狀可優先考慮鈣供應不足：新葉杯狀、邊緣壞死反映新組織細胞壁與膜不穩，果端軟化、耐貯差亦與局部鈣不足相符。需排除硼缺乏、鹽害與藥害，以土葉、果實分析及根域水分確認。改善穩定供水、排水、避免高銨與鉀鎂拮抗、抑徒長並適量補鈣。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>鈣的結構與訊號角色<\/strong><\/p>\n<p>鈣參與細胞壁果膠交聯、膜穩定與細胞訊號。缺鈣組織容易失去完整性，因此常見生長點、新葉或果實局部壞死；但症狀位置須配合實際器官與品種，不能只靠名稱就確診。<\/p>\n<p><strong>為何土壤有鈣，果實仍缺鈣<\/strong><\/p>\n<p>鈣主要隨木質部水流輸送，韌皮部再移動能力低。葉片蒸散強，果實蒸散弱，又可能隨發育降低木質部連結，因此果端等部位會先供應不足。高氮旺長、水分波動、根傷及高銨或其他陽離子競爭會加重分配失衡。<\/p>\n<p><strong>改善要處理運輸瓶頸<\/strong><\/p>\n<p>先確認土水與組織分析，再穩定灌排、維護根活力、平衡氮鉀鎂並調整負載。直接補鈣是否有效，還要看果皮吸收、時期與藥害風險；只在土中加很多鈣，不保證能送達已缺鈣的果實部位。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>綜合症狀可優先考慮鈣供應不足：新葉杯狀、邊緣壞死反映新組織細胞壁與膜不穩，果端軟化、耐貯差亦與局部鈣不足相符。需排除硼缺乏、鹽害與藥害，以土葉、果實分析及根域水分確認。改善穩定供水、排水、避免高銨與鉀鎂拮抗、抑徒長並適量補鈣。<\/p>\n<p>鈣參與細胞壁果膠交聯、膜穩定與細胞訊號。缺鈣組織容易失去完整性，因此常見生長點、新葉或果實局部壞死；但症狀位置須配合實際器官與品種，不能只靠名稱就確診。<\/p>\n<p>鈣主要隨木質部水流輸送，韌皮部再移動能力低。葉片蒸散強，果實蒸散弱，又可能隨發育降低木質部連結，因此果端等部位會先供應不足。高氮旺長、水分波動、根傷及高銨或其他陽離子競爭會加重分配失衡。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>蘋果苦痘與番茄尻腐都能用「局部供鈣不足」理解；兩者作物及器官不同，卻共同說明營養障礙不能只看土壤總含量。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：元素判斷、生理功能、運輸特性、鑑別及管理。<\/p>\n<ul>\n<li><strong>元素判斷<\/strong><\/li>\n<li><strong>生理功能<\/strong><\/li>\n<li><strong>運輸特性<\/strong><\/li>\n<li><strong>鑑別及管理<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>以為鈣能像氮一樣由老葉大量移到缺鈣果實。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=13","md":"102年果樹學_逐題教學詳解.md","search":"新梢杯狀葉、葉緣壞死與果端軟化 ## 第二題｜新梢杯狀葉、葉緣壞死與果端軟化（15 分）\n\n### 題意與作答範圍\n\n本題重點：**新梢杯狀葉、葉緣壞死與果端軟化**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=13)。\n\n### 先掌握答案\n\n綜合症狀可優先考慮鈣供應不足：新葉杯狀、邊緣壞死反映新組織細胞壁與膜不穩，果端軟化、耐貯差亦與局部鈣不足相符。需排除硼缺乏、鹽害與藥害，以土葉、果實分析及根域水分確認。改善穩定供水、排水、避免高銨與鉀鎂拮抗、抑徒長並適量補鈣。\n\n### 原理拆解：為什麼會這樣？\n\n**鈣的結構與訊號角色**\n\n鈣參與細胞壁果膠交聯、膜穩定與細胞訊號。缺鈣組織容易失去完整性，因此常見生長點、新葉或果實局部壞死；但症狀位置須配合實際器官與品種，不能只靠名稱就確診。\n\n**為何土壤有鈣，果實仍缺鈣**\n\n鈣主要隨木質部水流輸送，韌皮部再移動能力低。葉片蒸散強，果實蒸散弱，又可能隨發育降低木質部連結，因此果端等部位會先供應不足。高氮旺長、水分波動、根傷及高銨或其他陽離子競爭會加重分配失衡。\n\n**改善要處理運輸瓶頸**\n\n先確認土水與組織分析，再穩定灌排、維護根活力、平衡氮鉀鎂並調整負載。直接補鈣是否有效，還要看果皮吸收、時期與藥害風險；只在土中加很多鈣，不保證能送達已缺鈣的果實部位。\n\n### 可直接練寫的完整答案\n\n綜合症狀可優先考慮鈣供應不足：新葉杯狀、邊緣壞死反映新組織細胞壁與膜不穩，果端軟化、耐貯差亦與局部鈣不足相符。需排除硼缺乏、鹽害與藥害，以土葉、果實分析及根域水分確認。改善穩定供水、排水、避免高銨與鉀鎂拮抗、抑徒長並適量補鈣。\n\n鈣參與細胞壁果膠交聯、膜穩定與細胞訊號。缺鈣組織容易失去完整性，因此常見生長點、新葉或果實局部壞死；但症狀位置須配合實際器官與品種，不能只靠名稱就確診。\n\n鈣主要隨木質部水流輸送，韌皮部再移動能力低。葉片蒸散強，果實蒸散弱，又可能隨發育降低木質部連結，因此果端等部位會先供應不足。高氮旺長、水分波動、根傷及高銨或其他陽離子競爭會加重分配失衡。\n\n### 實例：把原理用在情境中\n\n蘋果苦痘與番茄尻腐都能用「局部供鈣不足」理解；兩者作物及器官不同，卻共同說明營養障礙不能只看土壤總含量。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：元素判斷、生理功能、運輸特性、鑑別及管理。\n\n- **元素判斷**\n- **生理功能**\n- **運輸特性**\n- **鑑別及管理**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 以為鈣能像氮一樣由老葉大量移到缺鈣果實。\n 102 果樹學"},{"id":"果樹學-102-三","s":"果樹學","y":102,"n":"三","t":"五元素有效吸收型態","body":"<h2>第三題｜五元素有效吸收型態（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五元素有效吸收型態<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=13\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>鐵主要以 Fe²⁺ 或鐵螯合物相關途徑吸收，雙子葉及非禾本科單子葉常先還原 Fe³⁺；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>第一步是分清吸收、運輸與需求<\/strong><\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p><strong>用新老葉位置推理<\/strong><\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<p><strong>最後必須用適當樣本驗證<\/strong><\/p>\n<p>依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>鐵主要以 Fe²⁺ 或鐵螯合物相關途徑吸收，雙子葉及非禾本科單子葉常先還原 Fe³⁺；<\/p>\n<p>氮以 NO₃⁻、NH₄⁺ 為主；<\/p>\n<p>鉀為 K⁺；<\/p>\n<p>錳主要 Mn²⁺；<\/p>\n<p>硼於常見根域 pH 主要為未解離硼酸 H₃BO₃，較高 pH 時硼酸根比例增加。有效態受 pH、氧化還原及螯合影響。<\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：每項 3 分，離子與化學式正確，鐵、硼附條件。<\/p>\n<ul>\n<li><strong>每項 3 分，離子與化學式正確，鐵<\/strong><\/li>\n<li><strong>硼附條件<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>只寫缺肥會黃葉，沒有指出葉齡與黃化分布。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=13","md":"102年果樹學_逐題教學詳解.md","search":"五元素有效吸收型態 ## 第三題｜五元素有效吸收型態（15 分）\n\n### 題意與作答範圍\n\n本題重點：**五元素有效吸收型態**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=13)。\n\n### 先掌握答案\n\n鐵主要以 fe²⁺ 或鐵螯合物相關途徑吸收，雙子葉及非禾本科單子葉常先還原 fe³⁺；\n\n### 原理拆解：為什麼會這樣？\n\n**第一步是分清吸收、運輸與需求**\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n**用新老葉位置推理**\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n**最後必須用適當樣本驗證**\n\n依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。\n\n### 可直接練寫的完整答案\n\n鐵主要以 fe²⁺ 或鐵螯合物相關途徑吸收，雙子葉及非禾本科單子葉常先還原 fe³⁺；\n\n氮以 no₃⁻、nh₄⁺ 為主；\n\n鉀為 k⁺；\n\n錳主要 mn²⁺；\n\n硼於常見根域 ph 主要為未解離硼酸 h₃bo₃，較高 ph 時硼酸根比例增加。有效態受 ph、氧化還原及螯合影響。\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n### 實例：把原理用在情境中\n\n老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：每項 3 分，離子與化學式正確，鐵、硼附條件。\n\n- **每項 3 分，離子與化學式正確，鐵**\n- **硼附條件**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 只寫缺肥會黃葉，沒有指出葉齡與黃化分布。\n 102 果樹學"},{"id":"果樹學-102-四","s":"果樹學","y":102,"n":"四","t":"高需冷梨模式與日本事件","body":"<h2>第四題｜高需冷梨模式與日本事件（12 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>高需冷梨模式與日本事件<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=13\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>臺灣可在適合海拔栽培高需冷梨，或把完成冷量的花芽穗高接於低需冷梨樹體，在平地開花結果。2011 東日本地震與核電事故可能影響接穗來源、檢驗、物流與消費信心，應拓展合格來源、建立國內接穗生產與冷藏體系、加強產地及批次檢測追溯；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>用限制來源分類<\/strong><\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p><strong>冬天的冷與春天的暖做不同工作<\/strong><\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<p><strong>技術必須對應真正瓶頸<\/strong><\/p>\n<p>摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>臺灣可在適合海拔栽培高需冷梨，或把完成冷量的花芽穗高接於低需冷梨樹體，在平地開花結果。2011 東日本地震與核電事故可能影響接穗來源、檢驗、物流與消費信心，應拓展合格來源、建立國內接穗生產與冷藏體系、加強產地及批次檢測追溯；<\/p>\n<p>此為供應鏈風險推論，不宣稱所有日本接穗均受污染。<\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>12 分：兩模式、冷量機制、事件的供應影響與分散風險。<\/p>\n<ul>\n<li><strong>兩模式<\/strong><\/li>\n<li><strong>冷量機制<\/strong><\/li>\n<li><strong>事件的供應影響與分散風險<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把需冷不足與萌芽後霜害混為同一問題。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=13","md":"102年果樹學_逐題教學詳解.md","search":"高需冷梨模式與日本事件 ## 第四題｜高需冷梨模式與日本事件（12 分）\n\n### 題意與作答範圍\n\n本題重點：**高需冷梨模式與日本事件**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=13)。\n\n### 先掌握答案\n\n臺灣可在適合海拔栽培高需冷梨，或把完成冷量的花芽穗高接於低需冷梨樹體，在平地開花結果。2011 東日本地震與核電事故可能影響接穗來源、檢驗、物流與消費信心，應拓展合格來源、建立國內接穗生產與冷藏體系、加強產地及批次檢測追溯；\n\n### 原理拆解：為什麼會這樣？\n\n**用限制來源分類**\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n**冬天的冷與春天的暖做不同工作**\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n**技術必須對應真正瓶頸**\n\n摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。\n\n### 可直接練寫的完整答案\n\n臺灣可在適合海拔栽培高需冷梨，或把完成冷量的花芽穗高接於低需冷梨樹體，在平地開花結果。2011 東日本地震與核電事故可能影響接穗來源、檢驗、物流與消費信心，應拓展合格來源、建立國內接穗生產與冷藏體系、加強產地及批次檢測追溯；\n\n此為供應鏈風險推論，不宣稱所有日本接穗均受污染。\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n### 實例：把原理用在情境中\n\n平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。\n\n### 配分重點：哪些內容不能漏？\n\n12 分：兩模式、冷量機制、事件的供應影響與分散風險。\n\n- **兩模式**\n- **冷量機制**\n- **事件的供應影響與分散風險**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把需冷不足與萌芽後霜害混為同一問題。\n 102 果樹學"},{"id":"果樹學-102-五","s":"果樹學","y":102,"n":"五","t":"愛文芒果發展、問題與生理研究","body":"<h2>第五題｜愛文芒果發展、問題與生理研究（13 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>愛文芒果發展、問題與生理研究<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=13\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>1950 年代引進後，臺灣藉適地栽培與改良管理建立鮮食產業，面臨開花不穩、著果、病蟲、乳汁傷、採後腐敗與外銷檢疫等問題。生理研究讓枝梢成熟及低溫花誘導、肥水負載管理更可控；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先辨識限制產期的生理關卡<\/strong><\/p>\n<p>產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。<\/p>\n<p><strong>處理須在可反應的階段<\/strong><\/p>\n<p>同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。<\/p>\n<p><strong>移動花期之後仍有生產風險<\/strong><\/p>\n<p>非自然盛產期可能遇不利授粉、低光、高溫或病蟲，果實品質與產量不保證同步提高。完整答案應包含後續授粉、負載與採收安排，以及是否能以售價補償成本。<\/p>\n<p><strong>為何採後仍會變差<\/strong><\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p><strong>低溫有效，但有適用範圍<\/strong><\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<p><strong>把全程串起來<\/strong><\/p>\n<p>採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>1950 年代引進後，臺灣藉適地栽培與改良管理建立鮮食產業，面臨開花不穩、著果、病蟲、乳汁傷、採後腐敗與外銷檢疫等問題。生理研究讓枝梢成熟及低溫花誘導、肥水負載管理更可控；<\/p>\n<p>套袋、適熟採收、去乳汁、防傷冷鏈與蒸熱檢疫提升商品率。輸日還須供果園與包裝設施管理、殘留合格及追溯，題內 98–100 年量值是歷史背景。<\/p>\n<p>產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。<\/p>\n<p>同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>紅龍果適當品種可利用夜間照光調節開花，但仍須評估夜溫、花粉與授粉作業；有花並不等於必能達到預期果重與採收量。<\/p>\n<p>驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>13 分：引進與發展、栽培及採後問題、技術解決、輸日條件。<\/p>\n<ul>\n<li><strong>引進與發展<\/strong><\/li>\n<li><strong>栽培及採後問題<\/strong><\/li>\n<li><strong>技術解決<\/strong><\/li>\n<li><strong>輸日條件<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將所有產調都解釋成解除休眠。<\/li>\n<li>認為溫度越低、保存效果一定越好。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=13","md":"102年果樹學_逐題教學詳解.md","search":"愛文芒果發展、問題與生理研究 ## 第五題｜愛文芒果發展、問題與生理研究（13 分）\n\n### 題意與作答範圍\n\n本題重點：**愛文芒果發展、問題與生理研究**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=13)。\n\n### 先掌握答案\n\n1950 年代引進後，臺灣藉適地栽培與改良管理建立鮮食產業，面臨開花不穩、著果、病蟲、乳汁傷、採後腐敗與外銷檢疫等問題。生理研究讓枝梢成熟及低溫花誘導、肥水負載管理更可控；\n\n### 原理拆解：為什麼會這樣？\n\n**先辨識限制產期的生理關卡**\n\n產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。\n\n**處理須在可反應的階段**\n\n同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。\n\n**移動花期之後仍有生產風險**\n\n非自然盛產期可能遇不利授粉、低光、高溫或病蟲，果實品質與產量不保證同步提高。完整答案應包含後續授粉、負載與採收安排，以及是否能以售價補償成本。\n\n**為何採後仍會變差**\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n**低溫有效，但有適用範圍**\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n**把全程串起來**\n\n採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。\n\n### 可直接練寫的完整答案\n\n1950 年代引進後，臺灣藉適地栽培與改良管理建立鮮食產業，面臨開花不穩、著果、病蟲、乳汁傷、採後腐敗與外銷檢疫等問題。生理研究讓枝梢成熟及低溫花誘導、肥水負載管理更可控；\n\n套袋、適熟採收、去乳汁、防傷冷鏈與蒸熱檢疫提升商品率。輸日還須供果園與包裝設施管理、殘留合格及追溯，題內 98–100 年量值是歷史背景。\n\n產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。\n\n同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。\n\n### 實例：把原理用在情境中\n\n紅龍果適當品種可利用夜間照光調節開花，但仍須評估夜溫、花粉與授粉作業；有花並不等於必能達到預期果重與採收量。\n\n驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。\n\n### 配分重點：哪些內容不能漏？\n\n13 分：引進與發展、栽培及採後問題、技術解決、輸日條件。\n\n- **引進與發展**\n- **栽培及採後問題**\n- **技術解決**\n- **輸日條件**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將所有產調都解釋成解除休眠。\n- 認為溫度越低、保存效果一定越好。\n 102 果樹學"},{"id":"果樹學-102-六","s":"果樹學","y":102,"n":"六","t":"五名詞","body":"<h2>第六題｜五名詞（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=13\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Apoplastic unloading 質外體卸載：糖跨膜離開韌皮部後再由果肉細胞吸收；<\/p>\n<p>apomixis 無融合生殖；<\/p>\n<p>aquaporin 水通道蛋白，順水勢梯度促水通過膜；<\/p>\n<p>florigen 成花素，以 FT 類可移動訊號促莖頂成花為代表；<\/p>\n<p>endodormancy 內生休眠，芽自身抑制萌發且需適當條件解除。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把源與庫接起來<\/strong><\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<p><strong>壓力流與跨膜運輸不是同一層次<\/strong><\/p>\n<p>源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；H⁺-ATPase 建立電化學梯度，可支援 H⁺／蔗糖共運輸。<\/p>\n<p><strong>庫強決定競爭，不只看果實大小<\/strong><\/p>\n<p>庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Apoplastic unloading 質外體卸載：糖跨膜離開韌皮部後再由果肉細胞吸收；<\/td>\n<td>質外體路徑遇到選擇性膜界面時仍須跨膜運輸，不能理解為糖可一路無限制穿過所有組織。<\/td>\n<\/tr>\n<tr>\n<td>aquaporin 水通道蛋白，順水勢梯度促水通過膜；<\/td>\n<td>它提供水的通道，但水仍依水勢梯度移動，並非蛋白主動搬運水分子。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Apoplastic unloading 質外體卸載：糖跨膜離開韌皮部後再由果肉細胞吸收；<\/p>\n<p>apomixis 無融合生殖；<\/p>\n<p>aquaporin 水通道蛋白，順水勢梯度促水通過膜；<\/p>\n<p>florigen 成花素，以 FT 類可移動訊號促莖頂成花為代表；<\/p>\n<p>endodormancy 內生休眠，芽自身抑制萌發且需適當條件解除。<\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：每項譯名、位置／機制、實例或差異。<\/p>\n<ul>\n<li><strong>每項譯名<\/strong><\/li>\n<li><strong>位置／機制<\/strong><\/li>\n<li><strong>實例或差異<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把長距離糖運輸寫成主要沿木質部。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=13","md":"102年果樹學_逐題教學詳解.md","search":"五名詞 ## 第六題｜五名詞（15 分）\n\n### 題意與作答範圍\n\n本題重點：**五名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=13)。\n\n### 先掌握答案\n\napoplastic unloading 質外體卸載：糖跨膜離開韌皮部後再由果肉細胞吸收；\n\napomixis 無融合生殖；\n\naquaporin 水通道蛋白，順水勢梯度促水通過膜；\n\nflorigen 成花素，以 ft 類可移動訊號促莖頂成花為代表；\n\nendodormancy 內生休眠，芽自身抑制萌發且需適當條件解除。\n\n### 原理拆解：為什麼會這樣？\n\n**先把源與庫接起來**\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n**壓力流與跨膜運輸不是同一層次**\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n**庫強決定競爭，不只看果實大小**\n\n庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| apoplastic unloading 質外體卸載：糖跨膜離開韌皮部後再由果肉細胞吸收； | 質外體路徑遇到選擇性膜界面時仍須跨膜運輸，不能理解為糖可一路無限制穿過所有組織。 |\n| aquaporin 水通道蛋白，順水勢梯度促水通過膜； | 它提供水的通道，但水仍依水勢梯度移動，並非蛋白主動搬運水分子。 |\n\n### 可直接練寫的完整答案\n\napoplastic unloading 質外體卸載：糖跨膜離開韌皮部後再由果肉細胞吸收；\n\napomixis 無融合生殖；\n\naquaporin 水通道蛋白，順水勢梯度促水通過膜；\n\nflorigen 成花素，以 ft 類可移動訊號促莖頂成花為代表；\n\nendodormancy 內生休眠，芽自身抑制萌發且需適當條件解除。\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n### 實例：把原理用在情境中\n\n同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：每項譯名、位置／機制、實例或差異。\n\n- **每項譯名**\n- **位置／機制**\n- **實例或差異**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把長距離糖運輸寫成主要沿木質部。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 102 果樹學"},{"id":"果樹學-102-七","s":"果樹學","y":102,"n":"七","t":"無子巨峰","body":"<h2>第七題｜無子巨峰（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>無子巨峰<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=13\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>依品種適期於花前／盛花處理 GA₃，干擾正常受精及種子形成，必要時配合經核准的其他處理提高無子率；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先問有沒有受精<\/strong><\/p>\n<p>單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。<\/p>\n<p><strong>為何沒有正常種子仍能結果<\/strong><\/p>\n<p>正常發育種子會提供或誘導支持子房生長的激素訊號。遺傳性單為結果或外施調節劑可在缺乏受精時提供相似支持；種子敗育型則可能在初期已建立足以使果實繼續生長的條件。<\/p>\n<p><strong>無子化與膨大必須分開思考<\/strong><\/p>\n<p>有子葡萄的無子化須依品種、花期以合適處理影響種子形成，花後可能另需促果粒膨大。時機錯誤會落果、穗軸或果粒異常；不能給一個濃度宣稱適用所有葡萄。無融合生殖是無正常有性受精而產胚，仍可有種子，並非同義詞。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>依品種適期於花前／盛花處理 GA₃，干擾正常受精及種子形成，必要時配合經核准的其他處理提高無子率；<\/p>\n<p>花後再處理促果粒膨大，並整穗疏粒、控制葉果比。花期時間、濃度與溫度強烈影響結果，不能只噴一次任意濃度便保證無子。<\/p>\n<p>單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。<\/p>\n<p>正常發育種子會提供或誘導支持子房生長的激素訊號。遺傳性單為結果或外施調節劑可在缺乏受精時提供相似支持；種子敗育型則可能在初期已建立足以使果實繼續生長的條件。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>栽培香蕉可用作單為結果例，許多無子葡萄作種子敗育例；柑橘珠心胚說明無融合生殖可產生帶胚種子，三者不能互換。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：誘無子、花後膨大、適期及品種依賴、品質管理。<\/p>\n<ul>\n<li><strong>誘無子<\/strong><\/li>\n<li><strong>花後膨大<\/strong><\/li>\n<li><strong>適期及品種依賴<\/strong><\/li>\n<li><strong>品質管理<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有無子葡萄都說成未曾受精。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=13","md":"102年果樹學_逐題教學詳解.md","search":"無子巨峰 ## 第七題｜無子巨峰（10 分）\n\n### 題意與作答範圍\n\n本題重點：**無子巨峰**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=13)。\n\n### 先掌握答案\n\n依品種適期於花前／盛花處理 ga₃，干擾正常受精及種子形成，必要時配合經核准的其他處理提高無子率；\n\n### 原理拆解：為什麼會這樣？\n\n**先問有沒有受精**\n\n單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。\n\n**為何沒有正常種子仍能結果**\n\n正常發育種子會提供或誘導支持子房生長的激素訊號。遺傳性單為結果或外施調節劑可在缺乏受精時提供相似支持；種子敗育型則可能在初期已建立足以使果實繼續生長的條件。\n\n**無子化與膨大必須分開思考**\n\n有子葡萄的無子化須依品種、花期以合適處理影響種子形成，花後可能另需促果粒膨大。時機錯誤會落果、穗軸或果粒異常；不能給一個濃度宣稱適用所有葡萄。無融合生殖是無正常有性受精而產胚，仍可有種子，並非同義詞。\n\n### 可直接練寫的完整答案\n\n依品種適期於花前／盛花處理 ga₃，干擾正常受精及種子形成，必要時配合經核准的其他處理提高無子率；\n\n花後再處理促果粒膨大，並整穗疏粒、控制葉果比。花期時間、濃度與溫度強烈影響結果，不能只噴一次任意濃度便保證無子。\n\n單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。\n\n正常發育種子會提供或誘導支持子房生長的激素訊號。遺傳性單為結果或外施調節劑可在缺乏受精時提供相似支持；種子敗育型則可能在初期已建立足以使果實繼續生長的條件。\n\n### 實例：把原理用在情境中\n\n栽培香蕉可用作單為結果例，許多無子葡萄作種子敗育例；柑橘珠心胚說明無融合生殖可產生帶胚種子，三者不能互換。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：誘無子、花後膨大、適期及品種依賴、品質管理。\n\n- **誘無子**\n- **花後膨大**\n- **適期及品種依賴**\n- **品質管理**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有無子葡萄都說成未曾受精。\n 102 果樹學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
