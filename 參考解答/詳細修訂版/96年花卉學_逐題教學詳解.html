ls{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 7 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"花卉學-96-一","s":"花卉學","y":96,"n":"一","t":"蘭花器、種子與有性繁殖","body":"<h2>第一題｜蘭花器、種子與有性繁殖（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>蘭花器、種子與有性繁殖<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=32\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>蘭花通常三萼、三瓣，其中一瓣特化唇瓣，雄雌器合生成蕊柱，花粉常成花粉塊；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>蘭種子小與菌根需求有關<\/strong><\/p>\n<p>蘭花種子極小且通常缺乏發達胚乳，野外萌發常依賴適合真菌提供資源；人工可在含糖與適當營養的無菌培養基萌發。花部可辨唇瓣、合蕊柱與花粉塊等特化構造。種子實生能產生遺傳變異，與以芽體或 PLB 量繁維持特定栽培品種的目的不同。<\/p>\n<p><strong>健康與整齊度要從母本或種子源開始<\/strong><\/p>\n<p>母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。<\/p>\n<p><strong>育苗目標是可定植且恢復快<\/strong><\/p>\n<p>適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。<\/p>\n<p><strong>無菌培養後仍有馴化關卡<\/strong><\/p>\n<p>瓶內高濕、低光與外加糖可使幼苗角質層、氣孔及根功能與田間不同。出瓶須逐步調整光濕條件並防感染。組培倍率、出瓶存活率與成品率應分開計算，不能只用增殖數宣稱生產效率。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>蘭花通常三萼、三瓣，其中一瓣特化唇瓣，雄雌器合生成蕊柱，花粉常成花粉塊；<\/p>\n<p>子房多下位。種子極小、胚未充分分化且胚乳少或缺乏，自然依菌根供養，商業以人工授粉育蒴果，消毒無菌播種供糖養分，經原球體、幼苗、生根與出瓶馴化，雜交後代可選拔新品種。<\/p>\n<p>蘭花種子極小且通常缺乏發達胚乳，野外萌發常依賴適合真菌提供資源；人工可在含糖與適當營養的無菌培養基萌發。花部可辨唇瓣、合蕊柱與花粉塊等特化構造。種子實生能產生遺傳變異，與以芽體或 PLB 量繁維持特定栽培品種的目的不同。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>蝴蝶蘭分生苗可用組織培養大量增殖，但需檢測母株病毒並控制培養代數；出瓶後先馴化，再依葉片與根系生長分級，不宜把瓶苗數直接當成上市盆花數。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：花器構造、微小種子、菌根／無菌播種與育種。<\/p>\n<ul>\n<li><strong>花器構造<\/strong><\/li>\n<li><strong>微小種子<\/strong><\/li>\n<li><strong>菌根／無菌播種與育種<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將組織培養視為自動消除所有病原。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=32","md":"96年花卉學_逐題教學詳解.md","search":"蘭花器、種子與有性繁殖 ## 第一題｜蘭花器、種子與有性繁殖（15 分）\n\n### 題意與作答範圍\n\n本題重點：**蘭花器、種子與有性繁殖**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=32)。\n\n### 先掌握答案\n\n蘭花通常三萼、三瓣，其中一瓣特化唇瓣，雄雌器合生成蕊柱，花粉常成花粉塊；\n\n### 原理拆解：為什麼會這樣？\n\n**蘭種子小與菌根需求有關**\n\n蘭花種子極小且通常缺乏發達胚乳，野外萌發常依賴適合真菌提供資源；人工可在含糖與適當營養的無菌培養基萌發。花部可辨唇瓣、合蕊柱與花粉塊等特化構造。種子實生能產生遺傳變異，與以芽體或 plb 量繁維持特定栽培品種的目的不同。\n\n**健康與整齊度要從母本或種子源開始**\n\n母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。\n\n**育苗目標是可定植且恢復快**\n\n適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。\n\n**無菌培養後仍有馴化關卡**\n\n瓶內高濕、低光與外加糖可使幼苗角質層、氣孔及根功能與田間不同。出瓶須逐步調整光濕條件並防感染。組培倍率、出瓶存活率與成品率應分開計算，不能只用增殖數宣稱生產效率。\n\n### 可直接練寫的完整答案\n\n蘭花通常三萼、三瓣，其中一瓣特化唇瓣，雄雌器合生成蕊柱，花粉常成花粉塊；\n\n子房多下位。種子極小、胚未充分分化且胚乳少或缺乏，自然依菌根供養，商業以人工授粉育蒴果，消毒無菌播種供糖養分，經原球體、幼苗、生根與出瓶馴化，雜交後代可選拔新品種。\n\n蘭花種子極小且通常缺乏發達胚乳，野外萌發常依賴適合真菌提供資源；人工可在含糖與適當營養的無菌培養基萌發。花部可辨唇瓣、合蕊柱與花粉塊等特化構造。種子實生能產生遺傳變異，與以芽體或 plb 量繁維持特定栽培品種的目的不同。\n\n### 實例：把原理用在情境中\n\n蝴蝶蘭分生苗可用組織培養大量增殖，但需檢測母株病毒並控制培養代數；出瓶後先馴化，再依葉片與根系生長分級，不宜把瓶苗數直接當成上市盆花數。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：花器構造、微小種子、菌根／無菌播種與育種。\n\n- **花器構造**\n- **微小種子**\n- **菌根／無菌播種與育種**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將組織培養視為自動消除所有病原。\n 96 花卉學"},{"id":"花卉學-96-二","s":"花卉學","y":96,"n":"二","t":"五種原生蘭與利用","body":"<h2>第二題｜五種原生蘭與利用（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五種原生蘭與利用<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=32\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>可舉臺灣白花蝴蝶蘭 Phalaenopsis aphrodite subsp. formosana 供大白花親本；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>可舉臺灣白花蝴蝶蘭 Phalaenopsis aphrodite subsp. formosana 供大白花親本；<\/p>\n<p>姬蝴蝶蘭 P. equestris 供多花小型育種；<\/p>\n<p>報歲蘭 Cymbidium sinense 供香花盆栽；<\/p>\n<p>四季蘭 C. ensifolium 供香花與多季開花；<\/p>\n<p>金稜邊 C. floribundum 供小型多花育種。商業材料應用合法種源及人工繁殖，不可取野生母株代替健康保育體系。<\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：五物種及各一產業用途。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=32","md":"96年花卉學_逐題教學詳解.md","search":"五種原生蘭與利用 ## 第二題｜五種原生蘭與利用（10 分）\n\n### 題意與作答範圍\n\n本題重點：**五種原生蘭與利用**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=32)。\n\n### 先掌握答案\n\n可舉臺灣白花蝴蝶蘭 phalaenopsis aphrodite subsp. formosana 供大白花親本；\n\n### 原理拆解：為什麼會這樣？\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n### 可直接練寫的完整答案\n\n可舉臺灣白花蝴蝶蘭 phalaenopsis aphrodite subsp. formosana 供大白花親本；\n\n姬蝴蝶蘭 p. equestris 供多花小型育種；\n\n報歲蘭 cymbidium sinense 供香花盆栽；\n\n四季蘭 c. ensifolium 供香花與多季開花；\n\n金稜邊 c. floribundum 供小型多花育種。商業材料應用合法種源及人工繁殖，不可取野生母株代替健康保育體系。\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n### 實例：把原理用在情境中\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：五物種及各一產業用途。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把轉入基因成功直接等同育成可商業化品種。\n 96 花卉學"},{"id":"花卉學-96-三","s":"花卉學","y":96,"n":"三","t":"火鶴、文心、唐菖蒲品質","body":"<h2>第三題｜火鶴、文心、唐菖蒲品質（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>火鶴、文心、唐菖蒲品質<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=32\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>火鶴易因失水、寒害、佛焰苞擦傷與病斑劣變，採適熟、防傷適溫；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>切離後的水分與碳收支轉為赤字<\/strong><\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p><strong>不同處理各有明確功能<\/strong><\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<p><strong>採收成熟度與溫度決定後續品質上限<\/strong><\/p>\n<p>過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>火鶴易因失水、寒害、佛焰苞擦傷與病斑劣變，採適熟、防傷適溫；<\/p>\n<p>文心蘭幼蕾多時開花差、花梗易折與失水，選成熟度、補碳保水固定；<\/p>\n<p>唐菖蒲花穗易向地性彎曲、低位花衰老與上蕾不開，直立貯運、適期採切並以合適糖液促開。各者冷藏容忍不同。<\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：三作物各機制與對策約 5 分。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短時高濃度預措液與全程瓶插液視為相同用法。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=32","md":"96年花卉學_逐題教學詳解.md","search":"火鶴、文心、唐菖蒲品質 ## 第三題｜火鶴、文心、唐菖蒲品質（15 分）\n\n### 題意與作答範圍\n\n本題重點：**火鶴、文心、唐菖蒲品質**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=32)。\n\n### 先掌握答案\n\n火鶴易因失水、寒害、佛焰苞擦傷與病斑劣變，採適熟、防傷適溫；\n\n### 原理拆解：為什麼會這樣？\n\n**切離後的水分與碳收支轉為赤字**\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n**不同處理各有明確功能**\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n**採收成熟度與溫度決定後續品質上限**\n\n過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。\n\n### 可直接練寫的完整答案\n\n火鶴易因失水、寒害、佛焰苞擦傷與病斑劣變，採適熟、防傷適溫；\n\n文心蘭幼蕾多時開花差、花梗易折與失水，選成熟度、補碳保水固定；\n\n唐菖蒲花穗易向地性彎曲、低位花衰老與上蕾不開，直立貯運、適期採切並以合適糖液促開。各者冷藏容忍不同。\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n### 實例：把原理用在情境中\n\n百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：三作物各機制與對策約 5 分。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短時高濃度預措液與全程瓶插液視為相同用法。\n 96 花卉學"},{"id":"花卉學-96-四","s":"花卉學","y":96,"n":"四","t":"優良培養土","body":"<h2>第四題｜優良培養土（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>優良培養土<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=32\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>應有穩定通氣、有效水、排水與適當重量，pH、EC 和養分緩衝適宜、無病原草籽與毒害，均一易濕且來源經濟。可藉泥炭／椰纖搭配珍珠石、樹皮調整，但須實測與配灌溉，不採萬用比例。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>根需要水，也需要氧<\/strong><\/p>\n<p>介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。<\/p>\n<p><strong>化學性質會改變肥培結果<\/strong><\/p>\n<p>pH 影響元素溶解與有效性，EC 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 EC 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；pH 與 EC 是不同指標，不能相互替代。<\/p>\n<p><strong>配方應可重複而且衛生<\/strong><\/p>\n<p>選擇穩定、無病原與雜草種子、粒徑一致的材料，混合後實測保水、通氣、pH 及 EC。泥炭、椰纖、樹皮等有機材料會分解或吸附養分；珍珠石等材料的作用也受比例與粒徑影響，配方必須搭配灌肥管理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>應有穩定通氣、有效水、排水與適當重量，pH、EC 和養分緩衝適宜、無病原草籽與毒害，均一易濕且來源經濟。可藉泥炭／椰纖搭配珍珠石、樹皮調整，但須實測與配灌溉，不採萬用比例。<\/p>\n<p>介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。<\/p>\n<p>pH 影響元素溶解與有效性，EC 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 EC 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；pH 與 EC 是不同指標，不能相互替代。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一泥炭與珍珠石配方用於矮盆時，底部飽和區占比可能較高；若又照高盆的頻率灌水，根部缺氧風險便增加。應從盆器與水分實測修正，而非只換肥料。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：物化生與可操作檢驗。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無土介質寫成完全不含有機物。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=32","md":"96年花卉學_逐題教學詳解.md","search":"優良培養土 ## 第四題｜優良培養土（10 分）\n\n### 題意與作答範圍\n\n本題重點：**優良培養土**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=32)。\n\n### 先掌握答案\n\n應有穩定通氣、有效水、排水與適當重量，ph、ec 和養分緩衝適宜、無病原草籽與毒害，均一易濕且來源經濟。可藉泥炭／椰纖搭配珍珠石、樹皮調整，但須實測與配灌溉，不採萬用比例。\n\n### 原理拆解：為什麼會這樣？\n\n**根需要水，也需要氧**\n\n介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。\n\n**化學性質會改變肥培結果**\n\nph 影響元素溶解與有效性，ec 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 ec 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；ph 與 ec 是不同指標，不能相互替代。\n\n**配方應可重複而且衛生**\n\n選擇穩定、無病原與雜草種子、粒徑一致的材料，混合後實測保水、通氣、ph 及 ec。泥炭、椰纖、樹皮等有機材料會分解或吸附養分；珍珠石等材料的作用也受比例與粒徑影響，配方必須搭配灌肥管理。\n\n### 可直接練寫的完整答案\n\n應有穩定通氣、有效水、排水與適當重量，ph、ec 和養分緩衝適宜、無病原草籽與毒害，均一易濕且來源經濟。可藉泥炭／椰纖搭配珍珠石、樹皮調整，但須實測與配灌溉，不採萬用比例。\n\n介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。\n\nph 影響元素溶解與有效性，ec 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 ec 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；ph 與 ec 是不同指標，不能相互替代。\n\n### 實例：把原理用在情境中\n\n同一泥炭與珍珠石配方用於矮盆時，底部飽和區占比可能較高；若又照高盆的頻率灌水，根部缺氧風險便增加。應從盆器與水分實測修正，而非只換肥料。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：物化生與可操作檢驗。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無土介質寫成完全不含有機物。\n 96 花卉學"},{"id":"花卉學-96-五","s":"花卉學","y":96,"n":"五","t":"熱帶高原與聖誕紅、鬱金香","body":"<h2>第五題｜熱帶高原與聖誕紅、鬱金香（25 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>熱帶高原與聖誕紅、鬱金香<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=32\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>熱帶高原常稱熱帶高地／高原氣候，年溫差小、日夜溫差較大、全年相對涼爽，原生花卉可舉大理花、聖誕紅、部分秋海棠、蝴蝶花、非洲菊等，需依物種原產地說明。聖誕紅原產墨西哥等熱帶高地，臺灣短日與適溫可促盆花；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>原產環境要拆成溫度與日長<\/strong><\/p>\n<p>熱帶高地可能全年日長變化較小但夜溫偏低；聖誕紅的短日反應與溫度對成花速度的影響需分述。鬱金香則涉及球根發育、低溫需求與後續伸長開花，不能因產地都涼就解釋成相同光週期機制。產地類比只能提供線索，仍須依物種生理作答。<\/p>\n<p><strong>用限制來源分類<\/strong><\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p><strong>冬天的冷與春天的暖做不同工作<\/strong><\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<p><strong>技術必須對應真正瓶頸<\/strong><\/p>\n<p>摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。<\/p>\n<p><strong>感應的是日夜節律，常以夜長最關鍵<\/strong><\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<p><strong>感光與光合作用不是同一需求<\/strong><\/p>\n<p>暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。<\/p>\n<p><strong>產期調節須兼顧可感應階段<\/strong><\/p>\n<p>植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>熱帶高原常稱熱帶高地／高原氣候，年溫差小、日夜溫差較大、全年相對涼爽，原生花卉可舉大理花、聖誕紅、部分秋海棠、蝴蝶花、非洲菊等，需依物種原產地說明。聖誕紅原產墨西哥等熱帶高地，臺灣短日與適溫可促盆花；<\/p>\n<p>鬱金香需特定球內花芽分化、冷量、發根與後續溫度程序，臺灣冬短夏熱、種球更新與成本不利，進口預冷球可一次性生產但難建立完整養球產業。<\/p>\n<p>熱帶高地可能全年日長變化較小但夜溫偏低；聖誕紅的短日反應與溫度對成花速度的影響需分述。鬱金香則涉及球根發育、低溫需求與後續伸長開花，不能因產地都涼就解釋成相同光週期機制。產地類比只能提供線索，仍須依物種生理作答。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。<\/p>\n<p>菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>25 分：氣候名稱與特徵、五例、兩作物生理及產業差異。<\/p>\n<ul>\n<li><strong>氣候名稱與特徵<\/strong><\/li>\n<li><strong>兩作物生理及產業差異<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把需冷不足與萌芽後霜害混為同一問題。<\/li>\n<li>把短日反應簡化為光越少花越多。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=32","md":"96年花卉學_逐題教學詳解.md","search":"熱帶高原與聖誕紅、鬱金香 ## 第五題｜熱帶高原與聖誕紅、鬱金香（25 分）\n\n### 題意與作答範圍\n\n本題重點：**熱帶高原與聖誕紅、鬱金香**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=32)。\n\n### 先掌握答案\n\n熱帶高原常稱熱帶高地／高原氣候，年溫差小、日夜溫差較大、全年相對涼爽，原生花卉可舉大理花、聖誕紅、部分秋海棠、蝴蝶花、非洲菊等，需依物種原產地說明。聖誕紅原產墨西哥等熱帶高地，臺灣短日與適溫可促盆花；\n\n### 原理拆解：為什麼會這樣？\n\n**原產環境要拆成溫度與日長**\n\n熱帶高地可能全年日長變化較小但夜溫偏低；聖誕紅的短日反應與溫度對成花速度的影響需分述。鬱金香則涉及球根發育、低溫需求與後續伸長開花，不能因產地都涼就解釋成相同光週期機制。產地類比只能提供線索，仍須依物種生理作答。\n\n**用限制來源分類**\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n**冬天的冷與春天的暖做不同工作**\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n**技術必須對應真正瓶頸**\n\n摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。\n\n**感應的是日夜節律，常以夜長最關鍵**\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n**感光與光合作用不是同一需求**\n\n暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。\n\n**產期調節須兼顧可感應階段**\n\n植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。\n\n### 可直接練寫的完整答案\n\n熱帶高原常稱熱帶高地／高原氣候，年溫差小、日夜溫差較大、全年相對涼爽，原生花卉可舉大理花、聖誕紅、部分秋海棠、蝴蝶花、非洲菊等，需依物種原產地說明。聖誕紅原產墨西哥等熱帶高地，臺灣短日與適溫可促盆花；\n\n鬱金香需特定球內花芽分化、冷量、發根與後續溫度程序，臺灣冬短夏熱、種球更新與成本不利，進口預冷球可一次性生產但難建立完整養球產業。\n\n熱帶高地可能全年日長變化較小但夜溫偏低；聖誕紅的短日反應與溫度對成花速度的影響需分述。鬱金香則涉及球根發育、低溫需求與後續伸長開花，不能因產地都涼就解釋成相同光週期機制。產地類比只能提供線索，仍須依物種生理作答。\n\n### 實例：把原理用在情境中\n\n平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。\n\n菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。\n\n### 配分重點：哪些內容不能漏？\n\n25 分：氣候名稱與特徵、五例、兩作物生理及產業差異。\n\n- **氣候名稱與特徵**\n- **兩作物生理及產業差異**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把需冷不足與萌芽後霜害混為同一問題。\n- 把短日反應簡化為光越少花越多。\n 96 花卉學"},{"id":"花卉學-96-六","s":"花卉學","y":96,"n":"六","t":"四花原產、繁殖與光週期","body":"<h2>第六題｜四花原產、繁殖與光週期（16 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>四花原產、繁殖與光週期<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=32\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>非洲菊 Gerbera：南非，組培，通常日中性／量性短日依品種；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>感應的是日夜節律，常以夜長最關鍵<\/strong><\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<p><strong>感光與光合作用不是同一需求<\/strong><\/p>\n<p>暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。<\/p>\n<p><strong>產期調節須兼顧可感應階段<\/strong><\/p>\n<p>植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。<\/p>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>非洲菊 Gerbera：南非，組培，通常日中性／量性短日依品種；<\/p>\n<p>香石竹 carnation：地中海，扦插，量性長日；<\/p>\n<p>晚香玉 tuberose：墨西哥，分球，通常日中性、溫度影響顯著；<\/p>\n<p>洋桔梗 Eustoma：北美中南部，播種，量性長日。每項要區分生理反應與臺灣適栽季節。<\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<p>暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。<\/p>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>16 分：四作物各 4 分，產地、主要繁殖法、成花反應。<\/p>\n<ul>\n<li><strong>四作物各 4 分，產地<\/strong><\/li>\n<li><strong>主要繁殖法<\/strong><\/li>\n<li><strong>成花反應<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短日反應簡化為光越少花越多。<\/li>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=32","md":"96年花卉學_逐題教學詳解.md","search":"四花原產、繁殖與光週期 ## 第六題｜四花原產、繁殖與光週期（16 分）\n\n### 題意與作答範圍\n\n本題重點：**四花原產、繁殖與光週期**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=32)。\n\n### 先掌握答案\n\n非洲菊 gerbera：南非，組培，通常日中性／量性短日依品種；\n\n### 原理拆解：為什麼會這樣？\n\n**感應的是日夜節律，常以夜長最關鍵**\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n**感光與光合作用不是同一需求**\n\n暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。\n\n**產期調節須兼顧可感應階段**\n\n植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n### 可直接練寫的完整答案\n\n非洲菊 gerbera：南非，組培，通常日中性／量性短日依品種；\n\n香石竹 carnation：地中海，扦插，量性長日；\n\n晚香玉 tuberose：墨西哥，分球，通常日中性、溫度影響顯著；\n\n洋桔梗 eustoma：北美中南部，播種，量性長日。每項要區分生理反應與臺灣適栽季節。\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。\n\n### 實例：把原理用在情境中\n\n菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n### 配分重點：哪些內容不能漏？\n\n16 分：四作物各 4 分，產地、主要繁殖法、成花反應。\n\n- **四作物各 4 分，產地**\n- **主要繁殖法**\n- **成花反應**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短日反應簡化為光越少花越多。\n- 把無性繁殖與無病毒畫上等號。\n 96 花卉學"},{"id":"花卉學-96-七","s":"花卉學","y":96,"n":"七","t":"裂萼、獅頭、柳芽","body":"<h2>第七題｜裂萼、獅頭、柳芽（9 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>裂萼、獅頭、柳芽<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=32\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>裂萼為花瓣膨大或數目超出萼筒包容、溫度波動與品種敏感，選品種、穩溫與均衡水肥。獅頭花屬香石竹異常花形俗稱，需依教材照片判別增瓣與花內芽等，不宜虛構唯一原因。柳芽常指菊花成花後因長日／高溫等誘發花芽發育不正常，近花序長狹葉或轉營養生長；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>感應的是日夜節律，常以夜長最關鍵<\/strong><\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<p><strong>感光與光合作用不是同一需求<\/strong><\/p>\n<p>暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。<\/p>\n<p><strong>產期調節須兼顧可感應階段<\/strong><\/p>\n<p>植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。<\/p>\n<p><strong>設施先改變能量與物質交換<\/strong><\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p><strong>各因子必須一起管理<\/strong><\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<p><strong>控制成效要用植株與環境資料驗證<\/strong><\/p>\n<p>以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>裂萼為花瓣膨大或數目超出萼筒包容、溫度波動與品種敏感，選品種、穩溫與均衡水肥。獅頭花屬香石竹異常花形俗稱，需依教材照片判別增瓣與花內芽等，不宜虛構唯一原因。柳芽常指菊花成花後因長日／高溫等誘發花芽發育不正常，近花序長狹葉或轉營養生長；<\/p>\n<p>調合適連續暗期與溫度、避免過早錯誤誘花。<\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<p>暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。<\/p>\n<p>臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>9 分：每項 3 分，形態、條件、對策；獅頭需標明俗名限制。<\/p>\n<ul>\n<li><strong>每項 3 分，形態<\/strong><\/li>\n<li><strong>獅頭需標明俗名限制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短日反應簡化為光越少花越多。<\/li>\n<li>將溫室直接等同低溫環境。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=32","md":"96年花卉學_逐題教學詳解.md","search":"裂萼、獅頭、柳芽 ## 第七題｜裂萼、獅頭、柳芽（9 分）\n\n### 題意與作答 ('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sec
