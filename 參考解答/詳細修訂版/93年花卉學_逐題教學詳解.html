ls{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 7 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"花卉學-93-一","s":"花卉學","y":93,"n":"一","t":"長、短命種子","body":"<h2>第一題｜長、短命種子（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>長、短命種子<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=41\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>長命花種可舉金盞菊 calendula，Purdue 推廣表列有利條件約 5 年（蓮亦為長壽硬實種子例）。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>種子壽命年數只在特定保存條件下成立<\/strong><\/p>\n<p>長命與短命是比較概念，受採種成熟度、含水率、溫度與包裝影響。可用長命的金盞花等與較短命的翠菊、三色堇、一串紅等比較，但不能把表列年數當作保證期限。實際播種前仍須做發芽與活力試驗，尤其是已開封或高溫高濕保存的種子。<\/p>\n<p><strong>發芽率、活力與壽命要分開<\/strong><\/p>\n<p>發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。<\/p>\n<p><strong>劣化涉及膜與修復能力<\/strong><\/p>\n<p>貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。<\/p>\n<p><strong>保存與檢測依種子特性選擇<\/strong><\/p>\n<p>耐乾燥的正貯型種子通常可適度乾燥、低溫與防潮保存；不耐乾燥的種子不能照抄同法。發芽試驗、加速老化、導電度或低溫試驗各反映不同面向，須選適合作物的條件與標準。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>長命花種可舉金盞菊 calendula，Purdue 推廣表列有利條件約 5 年（蓮亦為長壽硬實種子例）。<\/p>\n<p>短命九種可依同表選：翠菊 aster 1 年、天竺葵 geranium 1、三色堇 pansy 1、福祿考 phlox 1、一串紅 salvia 1、馬鞭草 verbena 1、長春花 vinca 1、彩葉草 coleus 2、大理花 dahlia 2。<\/p>\n<p>數值是指定保存背景的預期壽命，含水與溫度會顯著改變，不是到了年限全部死亡。來源：<a href=\"https://www.purdue.edu/hla/sites/yardandgarden/storing-leftover-garden-seed/\">Purdue 種子貯藏表<\/a>。<\/p>\n<p>長命與短命是比較概念，受採種成熟度、含水率、溫度與包裝影響。可用長命的金盞花等與較短命的翠菊、三色堇、一串紅等比較，但不能把表列年數當作保證期限。實際播種前仍須做發芽與活力試驗，尤其是已開封或高溫高濕保存的種子。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>蔥種子貯藏後即使標準發芽率尚可，活力降低也可能使育苗出苗不整；先做活力或小規模出苗比較，比直接增加播種密度更能掌握苗數。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：一種至少 5 年、九種 1–2 年，中文與英文對應，說明保存條件。<\/p>\n<ul>\n<li><strong>一種至少 5 年<\/strong><\/li>\n<li><strong>九種 1–2 年，中文與英文對應，說明保存條件<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有未發芽種子都判為死亡，漏掉休眠。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=41","md":"93年花卉學_逐題教學詳解.md","search":"長、短命種子 ## 第一題｜長、短命種子（10 分）\n\n### 題意與作答範圍\n\n本題重點：**長、短命種子**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=41)。\n\n### 先掌握答案\n\n長命花種可舉金盞菊 calendula，purdue 推廣表列有利條件約 5 年（蓮亦為長壽硬實種子例）。\n\n### 原理拆解：為什麼會這樣？\n\n**種子壽命年數只在特定保存條件下成立**\n\n長命與短命是比較概念，受採種成熟度、含水率、溫度與包裝影響。可用長命的金盞花等與較短命的翠菊、三色堇、一串紅等比較，但不能把表列年數當作保證期限。實際播種前仍須做發芽與活力試驗，尤其是已開封或高溫高濕保存的種子。\n\n**發芽率、活力與壽命要分開**\n\n發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。\n\n**劣化涉及膜與修復能力**\n\n貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。\n\n**保存與檢測依種子特性選擇**\n\n耐乾燥的正貯型種子通常可適度乾燥、低溫與防潮保存；不耐乾燥的種子不能照抄同法。發芽試驗、加速老化、導電度或低溫試驗各反映不同面向，須選適合作物的條件與標準。\n\n### 可直接練寫的完整答案\n\n長命花種可舉金盞菊 calendula，purdue 推廣表列有利條件約 5 年（蓮亦為長壽硬實種子例）。\n\n短命九種可依同表選：翠菊 aster 1 年、天竺葵 geranium 1、三色堇 pansy 1、福祿考 phlox 1、一串紅 salvia 1、馬鞭草 verbena 1、長春花 vinca 1、彩葉草 coleus 2、大理花 dahlia 2。\n\n數值是指定保存背景的預期壽命，含水與溫度會顯著改變，不是到了年限全部死亡。來源：[purdue 種子貯藏表](https://www.purdue.edu/hla/sites/yardandgarden/storing-leftover-garden-seed/)。\n\n長命與短命是比較概念，受採種成熟度、含水率、溫度與包裝影響。可用長命的金盞花等與較短命的翠菊、三色堇、一串紅等比較，但不能把表列年數當作保證期限。實際播種前仍須做發芽與活力試驗，尤其是已開封或高溫高濕保存的種子。\n\n### 實例：把原理用在情境中\n\n蔥種子貯藏後即使標準發芽率尚可，活力降低也可能使育苗出苗不整；先做活力或小規模出苗比較，比直接增加播種密度更能掌握苗數。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：一種至少 5 年、九種 1–2 年，中文與英文對應，說明保存條件。\n\n- **一種至少 5 年**\n- **九種 1–2 年，中文與英文對應，說明保存條件**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有未發芽種子都判為死亡，漏掉休眠。\n 93 花卉學"},{"id":"花卉學-93-二","s":"花卉學","y":93,"n":"二","t":"轉殖後仍需傳統交配","body":"<h2>第二題｜轉殖後仍需傳統交配（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>轉殖後仍需傳統交配<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=41\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>以玫瑰改花色為例，先將目標基因導入可再生材料，選穩定表現且遺傳正常的事件，再與具優良花莖、花形、抗性與瓶插壽命的商業親本交配／回交，選兼具目標基因和農藝性狀後代，經多季與多地驗證再無性保存。轉殖改善特定性狀，不能自動補足商業品種所有缺點。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>以玫瑰改花色為例，先將目標基因導入可再生材料，選穩定表現且遺傳正常的事件，再與具優良花莖、花形、抗性與瓶插壽命的商業親本交配／回交，選兼具目標基因和農藝性狀後代，經多季與多地驗證再無性保存。轉殖改善特定性狀，不能自動補足商業品種所有缺點。<\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：一作物、轉殖選殖、交配回交、選拔與驗證。<\/p>\n<ul>\n<li><strong>一作物<\/strong><\/li>\n<li><strong>轉殖選殖<\/strong><\/li>\n<li><strong>交配回交<\/strong><\/li>\n<li><strong>選拔與驗證<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=41","md":"93年花卉學_逐題教學詳解.md","search":"轉殖後仍需傳統交配 ## 第二題｜轉殖後仍需傳統交配（10 分）\n\n### 題意與作答範圍\n\n本題重點：**轉殖後仍需傳統交配**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=41)。\n\n### 先掌握答案\n\n以玫瑰改花色為例，先將目標基因導入可再生材料，選穩定表現且遺傳正常的事件，再與具優良花莖、花形、抗性與瓶插壽命的商業親本交配／回交，選兼具目標基因和農藝性狀後代，經多季與多地驗證再無性保存。轉殖改善特定性狀，不能自動補足商業品種所有缺點。\n\n### 原理拆解：為什麼會這樣？\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n### 可直接練寫的完整答案\n\n以玫瑰改花色為例，先將目標基因導入可再生材料，選穩定表現且遺傳正常的事件，再與具優良花莖、花形、抗性與瓶插壽命的商業親本交配／回交，選兼具目標基因和農藝性狀後代，經多季與多地驗證再無性保存。轉殖改善特定性狀，不能自動補足商業品種所有缺點。\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n### 實例：把原理用在情境中\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：一作物、轉殖選殖、交配回交、選拔與驗證。\n\n- **一作物**\n- **轉殖選殖**\n- **交配回交**\n- **選拔與驗證**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把轉入基因成功直接等同育成可商業化品種。\n 93 花卉學"},{"id":"花卉學-93-三","s":"花卉學","y":93,"n":"三","t":"溫室供水自動化例","body":"<h2>第三題｜溫室供水自動化例（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>溫室供水自動化例<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=41\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>以盆花潮汐床為例：水槽、泵浦、過濾與消毒、EC／pH、液位及時間或含水感測器連結控制器，定時淹盆底讓毛細吸水，達目標後回流；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>根需要水，也需要氧<\/strong><\/p>\n<p>介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。<\/p>\n<p><strong>化學性質會改變肥培結果<\/strong><\/p>\n<p>pH 影響元素溶解與有效性，EC 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 EC 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；pH 與 EC 是不同指標，不能相互替代。<\/p>\n<p><strong>配方應可重複而且衛生<\/strong><\/p>\n<p>選擇穩定、無病原與雜草種子、粒徑一致的材料，混合後實測保水、通氣、pH 及 EC。泥炭、椰纖、樹皮等有機材料會分解或吸附養分；珍珠石等材料的作用也受比例與粒徑影響，配方必須搭配灌肥管理。<\/p>\n<p><strong>設施先改變能量與物質交換<\/strong><\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p><strong>各因子必須一起管理<\/strong><\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<p><strong>控制成效要用植株與環境資料驗證<\/strong><\/p>\n<p>以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>以盆花潮汐床為例：水槽、泵浦、過濾與消毒、EC／pH、液位及時間或含水感測器連結控制器，定時淹盆底讓毛細吸水，達目標後回流；<\/p>\n<p>依季節與盆株大小調供液頻率。設警報及備援防停電、病原隨回流擴散，定期校正與檢查均勻度。<\/p>\n<p>介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。<\/p>\n<p>pH 影響元素溶解與有效性，EC 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 EC 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；pH 與 EC 是不同指標，不能相互替代。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一泥炭與珍珠石配方用於矮盆時，底部飽和區占比可能較高；若又照高盆的頻率灌水，根部缺氧風險便增加。應從盆器與水分實測修正，而非只換肥料。<\/p>\n<p>臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：設備流程、控制依據、節水均一與回流風險。<\/p>\n<ul>\n<li><strong>設備流程<\/strong><\/li>\n<li><strong>控制依據<\/strong><\/li>\n<li><strong>節水均一與回流風險<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無土介質寫成完全不含有機物。<\/li>\n<li>將溫室直接等同低溫環境。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=41","md":"93年花卉學_逐題教學詳解.md","search":"溫室供水自動化例 ## 第三題｜溫室供水自動化例（10 分）\n\n### 題意與作答範圍\n\n本題重點：**溫室供水自動化例**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=41)。\n\n### 先掌握答案\n\n以盆花潮汐床為例：水槽、泵浦、過濾與消毒、ec／ph、液位及時間或含水感測器連結控制器，定時淹盆底讓毛細吸水，達目標後回流；\n\n### 原理拆解：為什麼會這樣？\n\n**根需要水，也需要氧**\n\n介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。\n\n**化學性質會改變肥培結果**\n\nph 影響元素溶解與有效性，ec 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 ec 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；ph 與 ec 是不同指標，不能相互替代。\n\n**配方應可重複而且衛生**\n\n選擇穩定、無病原與雜草種子、粒徑一致的材料，混合後實測保水、通氣、ph 及 ec。泥炭、椰纖、樹皮等有機材料會分解或吸附養分；珍珠石等材料的作用也受比例與粒徑影響，配方必須搭配灌肥管理。\n\n**設施先改變能量與物質交換**\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n**各因子必須一起管理**\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n**控制成效要用植株與環境資料驗證**\n\n以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。\n\n### 可直接練寫的完整答案\n\n以盆花潮汐床為例：水槽、泵浦、過濾與消毒、ec／ph、液位及時間或含水感測器連結控制器，定時淹盆底讓毛細吸水，達目標後回流；\n\n依季節與盆株大小調供液頻率。設警報及備援防停電、病原隨回流擴散，定期校正與檢查均勻度。\n\n介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。\n\nph 影響元素溶解與有效性，ec 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 ec 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；ph 與 ec 是不同指標，不能相互替代。\n\n### 實例：把原理用在情境中\n\n同一泥炭與珍珠石配方用於矮盆時，底部飽和區占比可能較高；若又照高盆的頻率灌水，根部缺氧風險便增加。應從盆器與水分實測修正，而非只換肥料。\n\n臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：設備流程、控制依據、節水均一與回流風險。\n\n- **設備流程**\n- **控制依據**\n- **節水均一與回流風險**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無土介質寫成完全不含有機物。\n- 將溫室直接等同低溫環境。\n 93 花卉學"},{"id":"花卉學-93-四","s":"花卉學","y":93,"n":"四","t":"溫室夏季降溫","body":"<h2>第四題｜溫室夏季降溫（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>溫室夏季降溫<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=41\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>先降低熱輸入如適度外遮蔭與高反射覆材，再以側頂窗、抽風、循環風增換氣；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>設施先改變能量與物質交換<\/strong><\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施 果。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：減熱、通風、蒸發／機械降溫、濕度與光限制。\n\n- **蒸發／機械降溫**\n- **濕度與光限制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將溫室直接等同低溫環境。\n 93 花卉學"},{"id":"花卉學-93-五","s":"花卉學","y":93,"n":"五","t":"五名詞","body":"<h2>第五題｜五名詞（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=41\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Flower vase life 切花瓶插壽命，自插瓶至失去可接受觀賞品質的時間；<\/p>\n<p>preservatives of cut flowers 切花保鮮劑，維持水、糖與抑菌等；<\/p>\n<p>ethylene 乙烯，氣態激素；<\/p>\n<p>Oncidium 文心蘭屬，典型複莖假球莖蘭；<\/p>\n<p>Phalaenopsis 蝴蝶蘭屬，典型單莖附生蘭。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>切離後的水分與碳收支轉為赤字<\/strong><\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p><strong>不同處理各有明確功能<\/strong><\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<p><strong>採收成熟度與溫度決定後續品質上限<\/strong><\/p>\n<p>過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Oncidium 文心蘭屬，典型複莖假球莖蘭；<\/td>\n<td>主要是實心肥大莖，與以肉質鱗片葉儲藏的鱗莖不同，例如唐菖蒲、荸薺。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Flower vase life 切花瓶插壽命，自插瓶至失去可接受觀賞品質的時間；<\/p>\n<p>preservatives of cut flowers 切花保鮮劑，維持水、糖與抑菌等；<\/p>\n<p>ethylene 乙烯，氣態激素；<\/p>\n<p>Oncidium 文心蘭屬，典型複莖假球莖蘭；<\/p>\n<p>Phalaenopsis 蝴蝶蘭屬，典型單莖附生蘭。<\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：五項每 3 分，翻譯、機制／分類及例。<\/p>\n<ul>\n<li><strong>五項每 3 分，翻譯<\/strong><\/li>\n<li><strong>機制／分類及例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短時高濃度預措液與全程瓶插液視為相同用法。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=41","md":"93年花卉學_逐題教學詳解.md","search":"五名詞 ## 第五題｜五名詞（15 分）\n\n### 題意與作答範圍\n\n本題重點：**五名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=41)。\n\n### 先掌握答案\n\nflower vase life 切花瓶插壽命，自插瓶至失去可接受觀賞品質的時間；\n\npreservatives of cut flowers 切花保鮮劑，維持水、糖與抑菌等；\n\nethylene 乙烯，氣態激素；\n\noncidium 文心蘭屬，典型複莖假球莖蘭；\n\nphalaenopsis 蝴蝶蘭屬，典型單莖附生蘭。\n\n### 原理拆解：為什麼會這樣？\n\n**切離後的水分與碳收支轉為赤字**\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n**不同處理各有明確功能**\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n**採收成熟度與溫度決定後續品質上限**\n\n過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| oncidium 文心蘭屬，典型複莖假球莖蘭； | 主要是實心肥大莖，與以肉質鱗片葉儲藏的鱗莖不同，例如唐菖蒲、荸薺。 |\n\n### 可直接練寫的完整答案\n\nflower vase life 切花瓶插壽命，自插瓶至失去可接受觀賞品質的時間；\n\npreservatives of cut flowers 切花保鮮劑，維持水、糖與抑菌等；\n\nethylene 乙烯，氣態激素；\n\noncidium 文心蘭屬，典型複莖假球莖蘭；\n\nphalaenopsis 蝴蝶蘭屬，典型單莖附生蘭。\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n### 實例：把原理用在情境中\n\n百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：五項每 3 分，翻譯、機制／分類及例。\n\n- **五項每 3 分，翻譯**\n- **機制／分類及例**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短時高濃度預措液與全程瓶插液視為相同用法。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 93 花卉學"},{"id":"花卉學-93-六","s":"花卉學","y":93,"n":"六","t":"五花英名、產地、日長與繁殖","body":"<h2>第六題｜五花英名、產地、日長與繁殖（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五花英名、產地、日長與繁殖<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=41\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>香石竹 carnation，地中海，量性長日，扦插；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>感應的是日夜節律，常以夜長最關鍵<\/strong><\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<p><strong>感光與光合作用不是同一需求<\/strong><\/p>\n<p>暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。<\/p>\n<p><strong>產期調節須兼顧可感應階段<\/strong><\/p>\n<p>植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。<\/p>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>香石竹 carnation，地中海，量性長日，扦插；<\/p>\n<p>洋桔梗 lisianthus，北美中南部，量性長日，播種；<\/p>\n<p>聖誕紅 poinsettia，墨西哥及中美洲，短日，扦插；<\/p>\n<p>大理花 dahlia，墨西哥等，成花多量性短日且依品種，分根頸塊根（須帶芽）；<\/p>\n<p>晚香玉 tuberose，墨西哥，通常日中性，分球。依題意每種選一主要經濟繁殖法。<\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<p>暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。<\/p>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：每作物 4 分，四欄完整且勿把塊根本身無芽忽略。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短日反應簡化為光越少花越多。<\/li>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=41","md":"93年花卉學_逐題教學詳解.md","search":"五花英名、產地、日長與繁殖 ## 第六題｜五花英名、產地、日長與繁殖（20 分）\n\n### 題意與作答範圍\n\n本題重點：**五花英名、產地、日長與繁殖**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=41)。\n\n### 先掌握答案\n\n香石竹 carnation，地中海，量性長日，扦插；\n\n### 原理拆解：為什麼會這樣？\n\n**感應的是日夜節律，常以夜長最關鍵**\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n**感光與光合作用不是同一需求**\n\n暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。\n\n**產期調節須兼顧可感應階段**\n\n植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n### 可直接練寫的完整答案\n\n香石竹 carnation，地中海，量性長日，扦插；\n\n洋桔梗 lisianthus，北美中南部，量性長日，播種；\n\n聖誕紅 poinsettia，墨西哥及中美洲，短日，扦插；\n\n大理花 dahlia，墨西哥等，成花多量性短日且依品種，分根頸塊根（須帶芽）；\n\n晚香玉 tuberose，墨西哥，通常日中性，分球。依題意每種選一主要經濟繁殖法。\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。\n\n### 實例：把原理用在情境中\n\n菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：每作物 4 分，四欄完整且勿把塊根本身無芽忽略。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短日反應簡化為光越少花越多。\n- 把無性繁殖與無病毒畫上等號。\n 93 花卉學"},{"id":"花卉學-93-七","s":"花卉學","y":93,"n":"七","t":"四計算題","body":"<h2>第七題｜四計算題（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>四計算題<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=41\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>(1)十週反應長壽花 9/1 種植且電照八週，8×7＝56 日至約 10/27 停電照，再 10×7＝70 日，約翌年 1/5 開花，需假設種植即具感光成熟度、反應週數由有效短日起算。<\/p>\n<p>(2)DIF＝D−N＝−2，夜 21°C，故日 19°C。<\/p>\n<p>(3)L<em>=50、a<\/em>=0、b<em>=0，彩度 C<\/em>=√(a²+b²)=0，明度 50，為中性灰，色相角因彩度零而無定義。<\/p>\n<p>(4)20 kg×20%=4 kg N；<\/p>\n<p>P₂O₅＝4 kg，元素 P 用正確 P=31：4×62/142＝1.746 kg。原卷 P=21 為誤植；<\/p>\n<p>若機械按印值則 4×42/122＝1.377 kg，需標明而不當正確原子量。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先寫定義與單位再代數字<\/strong><\/p>\n<p>肥料百分率是重量基準，N 直接以元素量標示，磷與鉀通常以 P₂O₅、K₂O 表示；莫耳濃度則須分清一莫耳化合物含幾莫耳目標元素。題目單位不同，公式不可直接共用。<\/p>\n<p><strong>保留換算比例才能檢查<\/strong><\/p>\n<p>氧化物換元素用元素在該化學式的質量比例；母液稀釋先算目標莫耳數再除以母液濃度。DIF 用日溫減夜溫，均溫則按時數加權，pF 使用以公分水柱表示的壓力頭取常用對數。<\/p>\n<p><strong>答案需列假設與合理位數<\/strong><\/p>\n<p>先顯示式子，後列數值和單位。原題若原子量誤植或缺少盆徑與冠幅比例等條件，應說明正確知識及缺少的假設，不能以一個看似精確的數字掩蓋資訊不足。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>以下依各小題順序列公式、代入與結果：<\/p>\n<p>(1)十週反應長壽花 9/1 種植且電照八週，8×7＝56 日至約 10/27 停電照，再 10×7＝70 日，約翌年 1/5 開花，需假設種植即具感光成熟度、反應週數由有效短日起算。<\/p>\n<p>(2)DIF＝D−N＝−2，夜 21°C，故日 19°C。<\/p>\n<p>(3)L<em>=50、a<\/em>=0、b<em>=0，彩度 C<\/em>=√(a²+b²)=0，明度 50，為中性灰，色相角因彩度零而無定義。<\/p>\n<p>(4)20 kg×20%=4 kg N；<\/p>\n<p>P₂O₅＝4 kg，元素 P 用正確 P=31：4×62/142＝1.746 kg。原卷 P=21 為誤植；<\/p>\n<p>若機械按印值則 4×42/122＝1.377 kg，需標明而不當正確原子量。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>15% P₂O₅ 不等於 15% 元素磷：需乘 62/142；15% K₂O 轉元素鉀需乘 78/94。只有標示 N 可直接以其百分率計算元素氮。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：四題各 5 分，算式、日期假設、無彩色、元素與氧化物及原題誤植。<\/p>\n<ul>\n<li><strong>四題各 5 分，算式<\/strong><\/li>\n<li><strong>日期假設<\/strong><\/li>\n<li><strong>無彩色<\/strong><\/li>\n<li><strong>元素與氧化物及原題誤植<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把 P₂O₅ 的重量直接當成元素磷。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=41","md":"93年花卉學_逐題教學詳解.md","search":"四計算題 ## 第七題｜四計算題（20 分）\n\n### 題意與作答範圍\n\n本題重點：**四計算題**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=41)。\n\n### 先掌握答案\n\n(1)十週反應長壽花 9/1 種植且電照八週，8×7＝56 日至約 10/27 停電照，再 10×7＝70 日，約翌年 1/5 開花，需假設種植即具感光成熟度、反應週數由有效短日起算。\n\n(2)dif＝d−n＝−2，夜 21°c，故日 19°c。\n\n(3)l*=50、a*=0、b*=0，彩度 c*=√(a²+b²)=0，明度 50，為中性灰，色相角因彩度零而無定義。\n\n(4)20 kg×20%=4 kg n；\n\np₂o₅＝4 kg，元素 p 用正確 p=31：4×62/142＝1.746 kg。原卷 p=21 為誤植；\n\n若機械按印值則 4×42/122＝1.377 kg，需標明而不當正確原子量。\n\n### 原理拆解：為什麼會這樣？\n\n**先寫定義與單位再代數字**\n\n肥料百分率是重量基準，n 直接以元素量標示，磷與鉀通常以 p₂o₅、k₂o 表示；莫耳濃度則須分清一莫耳化合物含幾莫耳目標元素。題目單位不同，公式不可直接共用。\n\n**保留換算比例才能檢查**\n\n氧化物換元素用元素在該化學式的質量比例；母液稀釋先算目標莫耳數再除以母液濃度。dif 用日溫減夜溫，均溫則按時數加權，pf 使用以公分水柱表示的壓力頭取常用對數。\n\n**答案需列假設與合理位數**\n\n先顯示式子，後列數值和單位。原題若原子量誤植或缺少盆徑與冠幅比例等條件，應說明正確知識及缺少的假設，不能以一個看似精確的數字掩蓋資訊不足。\n\n### 可直接練寫的完整答案\n\n以下依各小題順序列公式、代入與結果：\n\n(1)十週反應長壽花 9/1 種植且電照八週，8×7＝56 日至約 10/27 停電照，再 10×7＝70 日，約翌年 1/5 開花，需假設種植即具感光成熟度、反應週數由有效短日起算。\n\n(2)dif＝d−n＝−2，夜 21°c，故日 19°c。\n\n(3)l*=50、a*=0、b*=0，彩度 c*=√(a²+b²)=0，明度 50，為中性灰，色相角因彩度零而無定義。\n\n(4)20 kg×20%=4 kg n；\n\np₂o₅＝4 kg，元素 p 用正確 p=31：4×62/142＝1.746 kg。原卷 p=21 為誤植；\n\n若機械按印值則 4×42/122＝1.377 kg，需標明而不當正確原子量。\n\n### 實例：把原理用在情境中\n\n15% p₂o₅ 不等於 15% 元素磷：需乘 62/142；15% k₂o 轉元素鉀需乘 78/94。只有標示 n 可直接以其百分率計算元素氮。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：四題各 5 分，算式、日期假設、無彩色、元素與氧化物及原題誤植。\n\n- **四題各 5 分，算式**\n- **日期假設**\n- **無彩色**\n- **元素與氧化物及原題誤植**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把 p₂o₅ 的重量直接當成元素磷。\n 93 花卉學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
