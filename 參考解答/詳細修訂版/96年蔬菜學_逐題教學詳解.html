ls{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 6 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"蔬菜學-96-一","s":"蔬菜學","y":96,"n":"一","t":"生產與產銷履歷","body":"<h2>第一題｜生產與產銷履歷（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>生產與產銷履歷<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=33\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>生產履歷記錄種苗、栽培、水肥用藥、採收等農場活動；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>履歷的價值在可追溯與可改善<\/strong><\/p>\n<p>記錄需能連結田區、種苗、資材使用、管理日期、採收與批次出貨，發現品質或殘留問題時才能追查。單純貼標而無可信紀錄並不能建立追溯。產銷履歷、農藥殘留合格與有機驗證是不同概念，答題應分清制度目的，不以其中一項代替其他要求。<\/p>\n<p><strong>採後仍活著，也仍在消耗<\/strong><\/p>\n<p>蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。<\/p>\n<p><strong>低溫與保濕要兼顧氣體交換<\/strong><\/p>\n<p>快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。<\/p>\n<p><strong>截切菜需把安全與外觀一起管理<\/strong><\/p>\n<p>流程包括原料驗收、去除不良部位、適當清洗、切割、清洗消毒、瀝乾、包裝與冷藏配送，細節依設備與產品調整。消毒水須管控有效濃度、接觸時間與有機物負荷，目標包含避免交叉污染，並不等於滅菌。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>生產履歷記錄種苗、栽培、水肥用藥、採收等農場活動；<\/p>\n<p>產銷履歷再連結集貨、加工、分級、物流與販售批次，使產品可前後追溯。好處為找出問題來源、改善管理、滿足安全與交易要求及提高信任；<\/p>\n<p>有紀錄不自動等於已通過第三方驗證，需依適用制度說明。<\/p>\n<p>記錄需能連結田區、種苗、資材使用、管理日期、採收與批次出貨，發現品質或殘留問題時才能追查。單純貼標而無可信紀錄並不能建立追溯。產銷履歷、農藥殘留合格與有機驗證是不同概念，答題應分清制度目的，不以其中一項代替其他要求。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>截切萵苣若只處理褐變而未瀝乾與維持冷鏈，仍可能滲液、腐敗或發生微生物風險；應用同批產品的外觀、失重與衛生檢測共同決定期限。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：範圍差別、追溯批次、管理與市場效益、驗證區別。<\/p>\n<ul>\n<li><strong>範圍差別<\/strong><\/li>\n<li><strong>追溯批次<\/strong><\/li>\n<li><strong>管理與市場效益<\/strong><\/li>\n<li><strong>驗證區別<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把清洗消毒寫成可以保證完全無菌。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=33","md":"96年蔬菜學_逐題教學詳解.md","search":"生產與產銷履歷 ## 第一題｜生產與產銷履歷（10 分）\n\n### 題意與作答範圍\n\n本題重點：**生產與產銷履歷**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=33)。\n\n### 先掌握答案\n\n生產履歷記錄種苗、栽培、水肥用藥、採收等農場活動；\n\n### 原理拆解：為什麼會這樣？\n\n**履歷的價值在可追溯與可改善**\n\n記錄需能連結田區、種苗、資材使用、管理日期、採收與批次出貨，發現品質或殘留問題時才能追查。單純貼標而無可信紀錄並不能建立追溯。產銷履歷、農藥殘留合格與有機驗證是不同概念，答題應分清制度目的，不以其中一項代替其他要求。\n\n**採後仍活著，也仍在消耗**\n\n蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。\n\n**低溫與保濕要兼顧氣體交換**\n\n快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。\n\n**截切菜需把安全與外觀一起管理**\n\n流程包括原料驗收、去除不良部位、適當清洗、切割、清洗消毒、瀝乾、包裝與冷藏配送，細節依設備與產品調整。消毒水須管控有效濃度、接觸時間與有機物負荷，目標包含避免交叉污染，並不等於滅菌。\n\n### 可直接練寫的完整答案\n\n生產履歷記錄種苗、栽培、水肥用藥、採收等農場活動；\n\n產銷履歷再連結集貨、加工、分級、物流與販售批次，使產品可前後追溯。好處為找出問題來源、改善管理、滿足安全與交易要求及提高信任；\n\n有紀錄不自動等於已通過第三方驗證，需依適用制度說明。\n\n記錄需能連結田區、種苗、資材使用、管理日期、採收與批次出貨，發現品質或殘留問題時才能追查。單純貼標而無可信紀錄並不能建立追溯。產銷履歷、農藥殘留合格與有機驗證是不同概念，答題應分清制度目的，不以其中一項代替其他要求。\n\n### 實例：把原理用在情境中\n\n截切萵苣若只處理褐變而未瀝乾與維持冷鏈，仍可能滲液、腐敗或發生微生物風險；應用同批產品的外觀、失重與衛生檢測共同決定期限。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：範圍差別、追溯批次、管理與市場效益、驗證區別。\n\n- **範圍差別**\n- **追溯批次**\n- **管理與市場效益**\n- **驗證區別**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把清洗消毒寫成可以保證完全無菌。\n 96 蔬菜學"},{"id":"蔬菜學-96-二","s":"蔬菜學","y":96,"n":"二","t":"品種改良重要與方法","body":"<h2>第二題｜品種改良重要與方法（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>品種改良重要與方法<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=33\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>以適地品質、抗病逆、產期、加工與採後壽命、株型及減勞力為目標，利用選拔、雜交、回交、F1、倍數體與誘變，並配組培、MAS 與合規基因工程。方法取決性狀遺傳與繁殖方式，需多年多地及消費／加工驗證，不把產量當唯一成功。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>F1 一致性來自親本與受控交配<\/strong><\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<p><strong>制種須阻止不需要的授粉<\/strong><\/p>\n<p>去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。<\/p>\n<p><strong>F2 分離是留種限制的主因<\/strong><\/p>\n<p>F1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。<\/p>\n<p><strong>標誌提供基因型線索<\/strong><\/p>\n<p>分子標誌是可檢測的 DNA 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 MAS 與基因轉殖的操作與法規概念不同。<\/p>\n<p><strong>連鎖不等於永遠不分離<\/strong><\/p>\n<p>若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。<\/p>\n<p><strong>回交可兼顧前景與背景選拔<\/strong><\/p>\n<p>前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。MAS 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>以適地品質、抗病逆、產期、加工與採後壽命、株型及減勞力為目標，利用選拔、雜交、回交、F1、倍數體與誘變，並配組培、MAS 與合規基因工程。方法取決性狀遺傳與繁殖方式，需多年多地及消費／加工驗證，不把產量當唯一成功。<\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<p>去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>西瓜 F1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 F1 果實留種所得下一代，不能保證維持原果形與整齊性。<\/p>\n<p>抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：需求、至少五方法、方法對性狀與驗證。<\/p>\n<ul>\n<li><strong>至少五方法<\/strong><\/li>\n<li><strong>方法對性狀與驗證<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>寫成 F1 種子完全不能發芽。<\/li>\n<li>把分子標誌說成施用後使植物產生抗性的藥劑。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=33","md":"96年蔬菜學_逐題教學詳解.md","search":"品種改良重要與方法 ## 第二題｜品種改良重要與方法（15 分）\n\n### 題意與作答範圍\n\n本題重點：**品種改良重要與方法**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=33)。\n\n### 先掌握答案\n\n以適地品質、抗病逆、產期、加工與採後壽命、株型及減勞力為目標，利用選拔、雜交、回交、f1、倍數體與誘變，並配組培、mas 與合規基因工程。方法取決性狀遺傳與繁殖方式，需多年多地及消費／加工驗證，不把產量當唯一成功。\n\n### 原理拆解：為什麼會這樣？\n\n**f1 一致性來自親本與受控交配**\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n**制種須阻止不需要的授粉**\n\n去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。\n\n**f2 分離是留種限制的主因**\n\nf1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。\n\n**標誌提供基因型線索**\n\n分子標誌是可檢測的 dna 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 mas 與基因轉殖的操作與法規概念不同。\n\n**連鎖不等於永遠不分離**\n\n若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。\n\n**回交可兼顧前景與背景選拔**\n\n前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。mas 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。\n\n### 可直接練寫的完整答案\n\n以適地品質、抗病逆、產期、加工與採後壽命、株型及減勞力為目標，利用選拔、雜交、回交、f1、倍數體與誘變，並配組培、mas 與合規基因工程。方法取決性狀遺傳與繁殖方式，需多年多地及消費／加工驗證，不把產量當唯一成功。\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。\n\n### 實例：把原理用在情境中\n\n西瓜 f1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 f1 果實留種所得下一代，不能保證維持原果形與整齊性。\n\n抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：需求、至少五方法、方法對性狀與驗證。\n\n- **至少五方法**\n- **方法對性狀與驗證**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 寫成 f1 種子完全不能發芽。\n- 把分子標誌說成施用後使植物產生抗性的藥劑。\n 96 蔬菜學"},{"id":"蔬菜學-96-三","s":"蔬菜學","y":96,"n":"三","t":"十名詞與應用","body":"<h2>第三題｜十名詞與應用（30 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>十名詞與應用<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=33\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Heterosis 雜種優勢；<\/p>\n<p>self-incompatibility 自交不親和，用 F1；<\/p>\n<p>super male plant 超雄株，如蘆筍 YY 與 XX 得全雄 XY；<\/p>\n<p>open pollination 開放授粉，無人工指定花粉；<\/p>\n<p>male sterility 雄不稔，功能花粉缺失；<\/p>\n<p>precooling 預冷；<\/p>\n<p>hot water seed treatment 溫湯種子處理，以窄溫時殺帶種病原但保胚；<\/p>\n<p>vernalization 春化；<\/p>\n<p>tomato determinate type 有限生長番茄，頂端終止於花序利集中收；<\/p>\n<p>parthenocarpy 單為結果。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>F1 一致性來自親本與受控交配<\/strong><\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<p><strong>制種須阻止不需要的授粉<\/strong><\/p>\n<p>去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。<\/p>\n<p><strong>F2 分離是留種限制的主因<\/strong><\/p>\n<p>F1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。<\/p>\n<p><strong>先分清預冷與冷藏<\/strong><\/p>\n<p>採收時產品常接近田間溫度；若只把大量溫熱貨物放進冷庫，外層先冷、箱內與果心仍熱，呼吸及失水會持續。預冷的目標是迅速降低產品溫度，冷藏則是把已降溫的產品維持在適溫，兩者目的與設備負荷不同。<\/p>\n<p><strong>冷得快，必須讓熱有出口<\/strong><\/p>\n<p>壓差預冷靠風扇建立壓差，迫使冷空氣穿過箱孔與產品間隙；箱孔不對齊或氣流短路時，庫溫低也不代表果心降得快。水冷以冷水接觸傳熱，但要控制水質與交叉污染。真空預冷則降低氣壓，使組織水分在低溫蒸發，帶走潛熱。<\/p>\n<p><strong>依器官結構選方法<\/strong><\/p>\n<p>葉菜表面積相對大，真空法常有效；大果實的果心熱須先傳到外層，表皮又限制蒸發，因此真空法可能慢且失重。方法選定後，還須量果心或代表部位溫度，訂冷卻終點，而不是只記處理分鐘。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Heterosis 雜種優勢；<\/td>\n<td>須指明相較雙親平均或較優親本的哪個性狀，不代表所有 F1 的所有性狀都較好。<\/td>\n<\/tr>\n<tr>\n<td>self-incompatibility 自交不親和，用 F1；<\/td>\n<td>花粉與胚珠可能都有功能，阻礙來自遺傳辨識而非單純沒有花粉。<\/td>\n<\/tr>\n<tr>\n<td>male sterility 雄不稔，功能花粉缺失；<\/td>\n<td>是雄性生殖功能異常，與具正常花粉卻被雌蕊辨識排斥的自交不親和不同。<\/td>\n<\/tr>\n<tr>\n<td>precooling 預冷；<\/td>\n<td>移除田間熱的初步快速降溫，與之後持續維持低溫的冷藏不同。 電導度反映可溶鹽類總量的相關指標，不能單獨判定是哪一元素缺乏或過量。<\/td>\n<\/tr>\n<tr>\n<td>vernalization 春化；<\/td>\n<td>使植物獲得或增強成花能力，與打破芽休眠和單純冷藏保鮮不同。<\/td>\n<\/tr>\n<tr>\n<td>parthenocarpy 單為結果。<\/td>\n<td>是未經受精仍形成果實，須與受精後種子敗育、以及三倍體不稔等機制分開。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Heterosis 雜種優勢；<\/p>\n<p>self-incompatibility 自交不親和，用 F1；<\/p>\n<p>super male plant 超雄株，如蘆筍 YY 與 XX 得全雄 XY；<\/p>\n<p>open pollination 開放授粉，無人工指定花粉；<\/p>\n<p>male sterility 雄不稔，功能花粉缺失；<\/p>\n<p>precooling 預冷；<\/p>\n<p>hot water seed treatment 溫湯種子處理，以窄溫時殺帶種病原但保胚；<\/p>\n<p>vernalization 春化；<\/p>\n<p>tomato determinate type 有限生長番茄，頂端終止於花序利集中收；<\/p>\n<p>parthenocarpy 單為結果。<\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>西瓜 F1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 F1 果實留種所得下一代，不能保證維持原果形與整齊性。<\/p>\n<p>包裝場可將同一箱產品放置多點溫度計，畫降溫曲線，比較箱心與外側。這能檢查通氣孔、堆裝與風量是否合適，也可同時量失重，避免用犧牲水分換取冷卻速度。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>30 分：各 3 分，定義及菜產業用途，超雄需基因型。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>寫成 F1 種子完全不能發芽。<\/li>\n<li>把預冷寫成單純放進冰箱，沒有交代移除田間熱。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=33","md":"96年蔬菜學_逐題教學詳解.md","search":"十名詞與應用 ## 第三題｜十名詞與應用（30 分）\n\n### 題意與作答範圍\n\n本題重點：**十名詞與應用**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=33)。\n\n### 先掌握答案\n\nheterosis 雜種優勢；\n\nself-incompatibility 自交不親和，用 f1；\n\nsuper male plant 超雄株，如蘆筍 yy 與 xx 得全雄 xy；\n\nopen pollination 開放授粉，無人工指定花粉；\n\nmale sterility 雄不稔，功能花粉缺失；\n\nprecooling 預冷；\n\nhot water seed treatment 溫湯種子處理，以窄溫時殺帶種病原但保胚；\n\nvernalization 春化；\n\ntomato determinate type 有限生長番茄，頂端終止於花序利集中收；\n\nparthenocarpy 單為結果。\n\n### 原理拆解：為什麼會這樣？\n\n**f1 一致性來自親本與受控交配**\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n**制種須阻止不需要的授粉**\n\n去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。\n\n**f2 分離是留種限制的主因**\n\nf1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。\n\n**先分清預冷與冷藏**\n\n採收時產品常接近田間溫度；若只把大量溫熱貨物放進冷庫，外層先冷、箱內與果心仍熱，呼吸及失水會持續。預冷的目標是迅速降低產品溫度，冷藏則是把已降溫的產品維持在適溫，兩者目的與設備負荷不同。\n\n**冷得快，必須讓熱有出口**\n\n壓差預冷靠風扇建立壓差，迫使冷空氣穿過箱孔與產品間隙；箱孔不對齊或氣流短路時，庫溫低也不代表果心降得快。水冷以冷水接觸傳熱，但要控制水質與交叉污染。真空預冷則降低氣壓，使組織水分在低溫蒸發，帶走潛熱。\n\n**依器官結構選方法**\n\n葉菜表面積相對大，真空法常有效；大果實的果心熱須先傳到外層，表皮又限制蒸發，因此真空法可能慢且失重。方法選定後，還須量果心或代表部位溫度，訂冷卻終點，而不是只記處理分鐘。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| heterosis 雜種優勢； | 須指明相較雙親平均或較優親本的哪個性狀，不代表所有 f1 的所有性狀都較好。 |\n| self-incompatibility 自交不親和，用 f1； | 花粉與胚珠可能都有功能，阻礙來自遺傳辨識而非單純沒有花粉。 |\n| male sterility 雄不稔，功能花粉缺失； | 是雄性生殖功能異常，與具正常花粉卻被雌蕊辨識排斥的自交不親和不同。 |\n| precooling 預冷； | 移除田間熱的初步快速降溫，與之後持續維持低溫的冷藏不同。 電導度反映可溶鹽類總量的相關指標，不能單獨判定是哪一元素缺乏或過量。 |\n| vernalization 春化； | 使植物獲得或增強成花能力，與打破芽休眠和單純冷藏保鮮不同。 |\n| parthenocarpy 單為結果。 | 是未經受精仍形成果實，須與受精後種子敗育、以及三倍體不稔等機制分開。 |\n\n### 可直接練寫的完整答案\n\nheterosis 雜種優勢；\n\nself-incompatibility 自交不親和，用 f1；\n\nsuper male plant 超雄株，如蘆筍 yy 與 xx 得全雄 xy；\n\nopen pollination 開放授粉，無人工指定花粉；\n\nmale sterility 雄不稔，功能花粉缺失；\n\nprecooling 預冷；\n\nhot water seed treatment 溫湯種子處理，以窄溫時殺帶種病原但保胚；\n\nvernalization 春化；\n\ntomato determinate type 有限生長番茄，頂端終止於花序利集中收；\n\nparthenocarpy 單為結果。\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n### 實例：把原理用在情境中\n\n西瓜 f1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 f1 果實留種所得下一代，不能保證維持原果形與整齊性。\n\n包裝場可將同一箱產品放置多點溫度計，畫降溫曲線，比較箱心與外側。這能檢查通氣孔、堆裝與風量是否合適，也可同時量失重，避免用犧牲水分換取冷卻速度。\n\n### 配分重點：哪些內容不能漏？\n\n30 分：各 3 分，定義及菜產業用途，超雄需基因型。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 寫成 f1 種子完全不能發芽。\n- 把預冷寫成單純放進冰箱，沒有交代移除田間熱。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 96 蔬菜學"},{"id":"蔬菜學-96-四","s":"蔬菜學","y":96,"n":"四","t":"有機菜與病蟲控制","body":"<h2>第四題｜有機菜與病蟲控制（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>有機菜與病蟲控制<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=33\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>有機蔬菜依適用有機生產標準管理土壤生態、使用允許資材並經必要驗證，不能簡化為不施肥或完全零檢出。控制病蟲用輪作、健康苗、抗性、種植期、密度通風、清園、網室、防蟲陷阱、天敵和允許生物／植物保護資材；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先建立可預防的栽培條件<\/strong><\/p>\n<p>健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。<\/p>\n<p><strong>監測後再選處理<\/strong><\/p>\n<p>定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。<\/p>\n<p><strong>整合與追蹤效果<\/strong><\/p>\n<p>不同手段應互相相容，保護天敵並避免抗藥性累積。處理後確認受害是否降低，保存用藥、環境與採收紀錄；有機生產也須依規範使用資材，並不代表可以省略病蟲管理。<\/p>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>有機蔬菜依適用有機生產標準管理土壤生態、使用允許資材並經必要驗證，不能簡化為不施肥或完全零檢出。控制病蟲用輪作、健康苗、抗性、種植期、密度通風、清園、網室、防蟲陷阱、天敵和允許生物／植物保護資材；<\/p>\n<p>須監測與避免鄰田污染。<\/p>\n<p>健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。<\/p>\n<p>定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>番茄管理可由健康苗、防蟲設施與田間監測降低媒介昆蟲傳播病毒的機會；已感染植株的處置與媒介控制須配合，不能只噴一次藥便認定病毒消失。<\/p>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：定義、預防生態、物理生物方法及制度。<\/p>\n<ul>\n<li><strong>預防生態<\/strong><\/li>\n<li><strong>物理生物方法及制度<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把有機栽培理解成完全不防治。<\/li>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=33","md":"96年蔬菜學_逐題教學詳解.md","search":"有機菜與病蟲控制 ## 第四題｜有機菜與病蟲控制（10 分）\n\n### 題意與作答範圍\n\n本題重點：**有機菜與病蟲控制**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=33)。\n\n### 先掌握答案\n\n有機蔬菜依適用有機生產標準管理土壤生態、使用允許資材並經必要驗證，不能簡化為不施肥或完全零檢出。控制病蟲用輪作、健康苗、抗性、種植期、密度通風、清園、網室、防蟲陷阱、天敵和允許生物／植物保護資材；\n\n### 原理拆解：為什麼會這樣？\n\n**先建立可預防的栽培條件**\n\n健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。\n\n**監測後再選處理**\n\n定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。\n\n**整合與追蹤效果**\n\n不同手段應互相相容，保護天敵並避免抗藥性累積。處理後確認受害是否降低，保存用藥、環境與採收紀錄；有機生產也須依規範使用資材，並不代表可以省略病蟲管理。\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n### 可直接練寫的完整答案\n\n有機蔬菜依適用有機生產標準管理土壤生態、使用允許資材並經必要驗證，不能簡化為不施肥或完全零檢出。控制病蟲用輪作、健康苗、抗性、種植期、密度通風、清園、網室、防蟲陷阱、天敵和允許生物／植物保護資材；\n\n須監測與避免鄰田污染。\n\n健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。\n\n定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。\n\n### 實例：把原理用在情境中\n\n番茄管理可由健康苗、防蟲設施與田間監測降低媒介昆蟲傳播病毒的機會；已感染植株的處置與媒介控制須配合，不能只噴一次藥便認定病毒消失。\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：定義、預防生態、物理生物方法及制度。\n\n- **預防生態**\n- **物理生物方法及制度**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把有機栽培理解成完全不防治。\n- 將連作障礙全部歸因於缺肥。\n 96 蔬菜學"},{"id":"蔬菜學-96-五","s":"蔬菜學","y":96,"n":"五","t":"番茄色澤大小與高乾物","body":"<h2>第五題｜番茄色澤大小與高乾物（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>番茄色澤大小與高乾物<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=33\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>果色由基因控制色素路徑，如茄紅素、β-胡蘿蔔素與葉綠素降解，並受成熟度和溫度；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把源與庫接起來<\/strong><\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<p><strong>壓力流與跨膜運輸不是同一層次<\/strong><\/p>\n<p>源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；H⁺-ATPase 建立電化學梯度，可支援 H⁺／蔗糖共運輸。<\/p>\n<p><strong>庫強決定競爭，不只看果實大小<\/strong><\/p>\n<p>庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。<\/p>\n<p><strong>先找色素，再找影響顯色的環境<\/strong><\/p>\n<p>花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。<\/p>\n<p><strong>同一色素也能呈不同顏色<\/strong><\/p>\n<p>液泡 pH、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 pH 不會不經生理過程就等於花瓣液泡 pH。<\/p>\n<p><strong>用可驗證的機制解釋栽培或育種操作<\/strong><\/p>\n<p>繡球花的藍色涉及鋁有效性與花器內的色素複合，需同時考慮品種與介質；藍玫瑰育種則涉及花青素生合成途徑、競爭酵素與細胞條件。不能只以「施酸肥」解釋所有藍花。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>果色由基因控制色素路徑，如茄紅素、β-胡蘿蔔素與葉綠素降解，並受成熟度和溫度；<\/p>\n<p>大小由心皮／子房室、細胞數及膨大基因與負載決定。提高乾物和風味可選高糖酸合適品種、保持受光葉、適當疏果與均衡水肥、適熟採收，受控輕度水／鹽可減稀釋但減產與障礙需評估。<\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<p>源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；H⁺-ATPase 建立電化學梯度，可支援 H⁺／蔗糖共運輸。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。<\/p>\n<p>同品種繡球在適合條件下，可因根域酸度影響鋁有效性而改變顯色；白花或缺乏相關色素能力的品種，不能保證以同一方法轉成藍花。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：遺傳色與大小、環境、至少四技術與品質產量取捨。<\/p>\n<ul>\n<li><strong>遺傳色與大小<\/strong><\/li>\n<li><strong>至少四技術與品質產量取捨<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把長距離糖運輸寫成主要沿木質部。<\/li>\n<li>把所有黃花都歸因於花青素。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=33","md":"96年蔬菜學_逐題教學詳解.md","search":"番茄色澤大小與高乾物 ## 第五題｜番茄色澤大小與高乾物（15 分）\n\n### 題意與作答範圍\n\n本題重點：**番茄色澤大小與高乾物**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=33)。\n\n### 先掌握答案\n\n果色由基因控制色素路徑，如茄紅素、β-胡蘿蔔素與葉綠素降解，並受成熟度和溫度；\n\n### 原理拆解：為什麼會這樣？\n\n**先把源與庫接起來**\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n**壓力流與跨膜運輸不是同一層次**\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n**庫強決定競爭，不只看果實大小**\n\n庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。\n\n**先找色素，再找影響顯色的環境**\n\n花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。\n\n**同一色素也能呈不同顏色**\n\n液泡 ph、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 ph 不會不經生理過程就等於花瓣液泡 ph。\n\n**用可驗證的機制解釋栽培或育種操作**\n\n繡球花的藍色涉及鋁有效性與花器內的色素複合，需同時考慮品種與介質；藍玫瑰育種則涉及花青素生合成途徑、競爭酵素與細胞條件。不能只以「施酸肥」解釋所有藍花。\n\n### 可直接練寫的完整答案\n\n果色由基因控制色素路徑，如茄紅素、β-胡蘿蔔素與葉綠素降解，並受成熟度和溫度；\n\n大小由心皮／子房室、細胞數及膨大基因與負載決定。提高乾物和風味可選高糖酸合適品種、保持受光葉、適當疏果與均衡水肥、適熟採收，受控輕度水／鹽可減稀釋但減產與障礙需評估。\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n### 實例：把原理用在情境中\n\n同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。\n\n同品種繡球在適合條件下，可因根域酸度影響鋁有效性而改變顯色；白花或缺乏相關色素能力的品種，不能保證以同一方法轉成藍花。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：遺傳色與大小、環境、至少四技術與品質產量取捨。\n\n- **遺傳色與大小**\n- **至少四技術與品質產量取捨**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把長距離糖運輸寫成主要沿木質部。\n- 把所有黃花都歸因於花青素。\n 96 蔬菜學"},{"id":"蔬菜學-96-六","s":"蔬菜學","y":96,"n":"六","t":"四段英文翻譯","body":"<h2>第六題｜四段英文翻譯（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>四段英文翻譯<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=33\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。<\/p>\n<h3>完整參考譯文<\/h3>\n<p>1.商業草莓品種常快速更替，原因包括栽培、加工與行銷方式改變，以及對更大、更高品質果實新品種的需求。2.甜瓜成為番茄之後，透過基因操作控制乙烯的另一果實；<\/p>\n<p>反義 ACC 氧化酶基因大幅抑乙烯，轉殖果乙烯不到未轉殖的 1%，使在株及離株後熟均受阻。3.大蒜可降低血漿總膽固醇、血壓及血小板凝集，多數文中所述藥效歸於含硫 allicin；<\/p>\n<p>環境與遺傳皆影響其含量。4.密閉人工光系統生產甘藷穴盤苗，可短期大量獲無病原優質苗，方法是把帶葉單節插穗插入穴盤的根系支撐材料。<\/p>\n<h3>讀懂這段研究在說什麼<\/h3>\n<p><strong>四個研究片段應分開翻譯<\/strong><\/p>\n<p>商業草莓品種更替是市場與生產背景，甜瓜反義 ACC 氧化酶是控制乙烯的技術例。不同段落的作物、處理與結果不可串成同一試驗。反義抑制通常是降低目標基因表現，不是把酵素噴到果實上；描述乙烯降低時要保留原來百分比或相對程度。<\/p>\n<h3>專業詞彙與翻譯辨析<\/h3>\n<table>\n<thead>\n<tr>\n<th>英文用語<\/th>\n<th>建議譯法<\/th>\n<th>讀法與限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>antisense<\/td>\n<td>反義<\/td>\n<td>抑制相應基因表現的策略<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>配分重點與檢查順序<\/h3>\n<p>20 分：每段 5 分，品種替換、反義與 1%、含硫蒜素、單節帶葉苗四主題；醫療語句依原文。<\/p>\n<p>先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。<\/p>\n<h3>常見失分<\/h3>\n<ul>\n<li>把專業名詞按一般字義翻譯，或把相關性改成因果。<\/li>\n<li>省略轉折、條件或限制，使研究結論比原文更強。<\/li>\n<li>以摘要取代全文翻譯。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=33","md":"96年蔬菜學_逐題教學詳解.md","search":"四段英文翻譯 ## 第六題｜四段英文翻譯（20 分）\n\n### 題意與作答範圍\n\n本題重點：**四段英文翻譯**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=33)。\n\n### 先掌握答案\n\n這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。\n\n### 完整參考譯文\n\n1.商業草莓品種常快速更替，原因包括栽培、加工與行銷方式改變，以及對更大、更高品質果實新品種的需求。2.甜瓜成為番茄之後，透過基因操作控制乙烯的另一果實；\n\n反義 acc 氧化酶基因大幅抑乙烯，轉殖果乙烯不到未轉殖的 1%，使在株及離株後熟均受阻。3.大蒜可降低血漿總膽固醇、血壓及血小板凝集，多數文中所述藥效歸於含硫 allicin；\n\n環境與遺傳皆影響其含量。4.密閉人工光系統生產甘藷穴盤苗，可短期大量獲無病原優質苗，方法是把帶葉單節插穗插入穴盤的根系支撐材料。\n\n### 讀懂這段研究在說什麼\n\n**四個研究片段應分開翻譯**\n\n商業草莓品種更替是市場與生產背景，甜瓜反義 acc 氧化酶是控制乙烯的技術例。不同段落的作物、處理與結果不可串成同一試驗。反義抑制通常是降低目標基因表現，不是把酵素噴到果實上；描述乙烯降低時要保留原來百分比或相對程度。\n\n### 專業詞彙與翻譯辨析\n\n| 英文用語 | 建議譯法 | 讀法與限制 |\n| --- | --- | --- |\n| antisense | 反義 | 抑制相應基因表現的策略 |\n\n### 配分重點與檢查順序\n\n20 分：每段 5 分，品種替換、反義與 1%、含硫蒜素、單節帶葉苗四主題；醫療語句依原文。\n\n先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。\n\n### 常見失分\n\n- 把專業名詞按一般字義翻譯，或把相關性改成因果。\n- 省略轉折、條件或限制，使研究結論比原文更強。\n- 以摘要取代全文翻譯。\n 96 蔬菜學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
