ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 7 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"花卉學-111-一","s":"花卉學","y":111,"n":"一","t":"15 種無土介質及目的","body":"<h2>第一題｜15 種無土介質及目的（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>15 種無土介質及目的<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B111.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>①泥炭 peat moss：保水、保肥。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>根需要水，也需要氧<\/strong><\/p>\n<p>介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。<\/p>\n<p><strong>化學性質會改變肥培結果<\/strong><\/p>\n<p>pH 影響元素溶解與有效性，EC 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 EC 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；pH 與 EC 是不同指標，不能相互替代。<\/p>\n<p><strong>配方應可重複而且衛生<\/strong><\/p>\n<p>選擇穩定、無病原與雜草種子、粒徑一致的材料，混合後實測保水、通氣、pH 及 EC。泥炭、椰纖、樹皮等有機材料會分解或吸附養分；珍珠石等材料的作用也受比例與粒徑影響，配方必須搭配灌肥管理。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>介質功能在「空氣、水、養分、支撐」間取得平衡，單一材料不一定能獨立作完整培養土。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>①泥炭 peat moss：保水、保肥。<\/p>\n<p>②椰纖 coir：保水、透氣。<\/p>\n<p>③水苔 sphagnum moss：保濕固定蘭根。<\/p>\n<p>④樹皮 bark：粗孔隙、排水。<\/p>\n<p>⑤珍珠石 perlite：輕質、通氣。<\/p>\n<p>⑥蛭石 vermiculite：保水、陽離子交換。<\/p>\n<p>⑦浮石 pumice：增加孔隙與穩定性。<\/p>\n<p>⑧岩棉 rockwool：均一根域、利水耕。<\/p>\n<p>⑨陶粒 expanded clay：支撐、排水、可再利用。<\/p>\n<p>⑩砂 sand：增加重量與排水，細砂過多反而降低通氣。⑪炭化稻殼 carbonized rice hull：透氣、輕質，注意 pH。⑫新鮮稻殼 rice hull：增加粗孔隙，注意分解與氮競爭。⑬木纖 wood fiber：透氣、可再生，注意氮固定。⑭堆肥 compost：供養分與緩衝，須成熟低鹽。⑮木炭 charcoal：孔隙、吸附，性質隨原料差異大。<\/p>\n<p>介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一泥炭與珍珠石配方用於矮盆時，底部飽和區占比可能較高；若又照高盆的頻率灌水，根部缺氧風險便增加。應從盆器與水分實測修正，而非只換肥料。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：15 種各中英文與用途，重複同類不可當不同材料。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無土介質寫成完全不含有機物。<\/li>\n<\/ul>","source":"../../B111.pdf#page=2","md":"111年花卉學_逐題教學詳解.md","search":"15 種無土介質及目的 ## 第一題｜15 種無土介質及目的（15 分）\n\n### 題意與作答範圍\n\n本題重點：**15 種無土介質及目的**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b111.pdf#page=2)。\n\n### 先掌握答案\n\n①泥炭 peat moss：保水、保肥。\n\n### 原理拆解：為什麼會這樣？\n\n**根需要水，也需要氧**\n\n介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。\n\n**化學性質會改變肥培結果**\n\nph 影響元素溶解與有效性，ec 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 ec 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；ph 與 ec 是不同指標，不能相互替代。\n\n**配方應可重複而且衛生**\n\n選擇穩定、無病原與雜草種子、粒徑一致的材料，混合後實測保水、通氣、ph 及 ec。泥炭、椰纖、樹皮等有機材料會分解或吸附養分；珍珠石等材料的作用也受比例與粒徑影響，配方必須搭配灌肥管理。\n\n### 這題要特別注意\n\n介質功能在「空氣、水、養分、支撐」間取得平衡，單一材料不一定能獨立作完整培養土。\n\n### 可直接練寫的完整答案\n\n①泥炭 peat moss：保水、保肥。\n\n②椰纖 coir：保水、透氣。\n\n③水苔 sphagnum moss：保濕固定蘭根。\n\n④樹皮 bark：粗孔隙、排水。\n\n⑤珍珠石 perlite：輕質、通氣。\n\n⑥蛭石 vermiculite：保水、陽離子交換。\n\n⑦浮石 pumice：增加孔隙與穩定性。\n\n⑧岩棉 rockwool：均一根域、利水耕。\n\n⑨陶粒 expanded clay：支撐、排水、可再利用。\n\n⑩砂 sand：增加重量與排水，細砂過多反而降低通氣。⑪炭化稻殼 carbonized rice hull：透氣、輕質，注意 ph。⑫新鮮稻殼 rice hull：增加粗孔隙，注意分解與氮競爭。⑬木纖 wood fiber：透氣、可再生，注意氮固定。⑭堆肥 compost：供養分與緩衝，須成熟低鹽。⑮木炭 charcoal：孔隙、吸附，性質隨原料差異大。\n\n介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。\n\n### 實例：把原理用在情境中\n\n同一泥炭與珍珠石配方用於矮盆時，底部飽和區占比可能較高；若又照高盆的頻率灌水，根部缺氧風險便增加。應從盆器與水分實測修正，而非只換肥料。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：15 種各中英文與用途，重複同類不可當不同材料。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無土介質寫成完全不含有機物。\n 111 花卉學"},{"id":"花卉學-111-二","s":"花卉學","y":111,"n":"二","t":"五項生長調節用途","body":"<h2>第二題｜五項生長調節用途（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五項生長調節用途<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B111.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>打破休眠：GA₃ 促進仙客來等萌芽／發育，依品種而定；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>激素作用依器官與時期改變<\/strong><\/p>\n<p>生長素、吉貝素、細胞分裂素、乙烯與 ABA 均有多重功能；相同物質在不同濃度、器官和時期可能呈不同結果。必須用「作物＋物質＋時期＋目的」完整描述，不能只列藥名。<\/p>\n<p><strong>外施處理是在改變既有訊號系統<\/strong><\/p>\n<p>生長素可用於促不定根，也可能依條件疏果或減落果；GA 可促伸長、果粒膨大或調整種子發育；乙烯可誘導鳳梨開花，亦可能加速敏感花卉衰老。作用不能跨作物無條件推論。<\/p>\n<p><strong>生產應以核准用途與小量驗證為準<\/strong><\/p>\n<p>濃度、吸收量、天氣與施用位置會影響效果及藥害。考題可以說明機制，但不應從教材例子直接推定所有地區皆核准使用；回答時仍應保留品種、適期與合法用途的條件。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>寫「藥劑＋作物＋目的」才是完整實例，不能只列五個藥名。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>打破休眠：GA₃ 促進仙客來等萌芽／發育，依品種而定；<\/p>\n<p>促根：IBA、NAA 處理菊花或聖誕紅插穗基部；<\/p>\n<p>促莖伸長：GA₃ 促花莖伸長；<\/p>\n<p>抑莖伸長：矮壯素、daminozide 或 paclobutrazol 抑制 GA 生合成；<\/p>\n<p>調節開花：乙烯利催促鳳梨科觀賞植物開花。<\/p>\n<p>生長素、吉貝素、細胞分裂素、乙烯與 ABA 均有多重功能；相同物質在不同濃度、器官和時期可能呈不同結果。必須用「作物＋物質＋時期＋目的」完整描述，不能只列藥名。<\/p>\n<p>生長素可用於促不定根，也可能依條件疏果或減落果；GA 可促伸長、果粒膨大或調整種子發育；乙烯可誘導鳳梨開花，亦可能加速敏感花卉衰老。作用不能跨作物無條件推論。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>IBA 用於扦插促根，而 GA₃ 可用於適當葡萄品種的無子化及膨大；兩者處理部位與時期不同，不能因同屬調節劑便互換。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：五用途各 2 分，藥劑、作物、機制配對。<\/p>\n<ul>\n<li><strong>五用途各 2 分，藥劑<\/strong><\/li>\n<li><strong>機制配對<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>只背某激素「促進生長」，不寫促進哪個器官或過程。<\/li>\n<\/ul>","source":"../../B111.pdf#page=2","md":"111年花卉學_逐題教學詳解.md","search":"五項生長調節用途 ## 第二題｜五項生長調節用途（10 分）\n\n### 題意與作答範圍\n\n本題重點：**五項生長調節用途**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b111.pdf#page=2)。\n\n### 先掌握答案\n\n打破休眠：ga₃ 促進仙客來等萌芽／發育，依品種而定；\n\n### 原理拆解：為什麼會這樣？\n\n**激素作用依器官與時期改變**\n\n生長素、吉貝素、細胞分裂素、乙烯與 aba 均有多重功能；相同物質在不同濃度、器官和時期可能呈不同結果。必須用「作物＋物質＋時期＋目的」完整描述，不能只列藥名。\n\n**外施處理是在改變既有訊號系統**\n\n生長素可用於促不定根，也可能依條件疏果或減落果；ga 可促伸長、果粒膨大或調整種子發育；乙烯可誘導鳳梨開花，亦可能加速敏感花卉衰老。作用不能跨作物無條件推論。\n\n**生產應以核准用途與小量驗證為準**\n\n濃度、吸收量、天氣與施用位置會影響效果及藥害。考題可以說明機制，但不應從教材例子直接推定所有地區皆核准使用；回答時仍應保留品種、適期與合法用途的條件。\n\n### 這題要特別注意\n\n寫「藥劑＋作物＋目的」才是完整實例，不能只列五個藥名。\n\n### 可直接練寫的完整答案\n\n打破休眠：ga₃ 促進仙客來等萌芽／發育，依品種而定；\n\n促根：iba、naa 處理菊花或聖誕紅插穗基部；\n\n促莖伸長：ga₃ 促花莖伸長；\n\n抑莖伸長：矮壯素、daminozide 或 paclobutrazol 抑制 ga 生合成；\n\n調節開花：乙烯利催促鳳梨科觀賞植物開花。\n\n生長素、吉貝素、細胞分裂素、乙烯與 aba 均有多重功能；相同物質在不同濃度、器官和時期可能呈不同結果。必須用「作物＋物質＋時期＋目的」完整描述，不能只列藥名。\n\n生長素可用於促不定根，也可能依條件疏果或減落果；ga 可促伸長、果粒膨大或調整種子發育；乙烯可誘導鳳梨開花，亦可能加速敏感花卉衰老。作用不能跨作物無條件推論。\n\n### 實例：把原理用在情境中\n\niba 用於扦插促根，而 ga₃ 可用於適當葡萄品種的無子化及膨大；兩者處理部位與時期不同，不能因同屬調節劑便互換。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：五用途各 2 分，藥劑、作物、機制配對。\n\n- **五用途各 2 分，藥劑**\n- **機制配對**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 只背某激素「促進生長」，不寫促進哪個器官或過程。\n 111 花卉學"},{"id":"花卉學-111-三","s":"花卉學","y":111,"n":"三","t":"切花前、後處理及三種藥劑","body":"<h2>第三題｜切花前、後處理及三種藥劑（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>切花前、後處理及三種藥劑<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B111.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>前處理多在產地短時間進行，目的為補水、補充碳源、抑制乙烯及改善耐運；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>切離後的水分與碳收支轉為赤字<\/strong><\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p><strong>不同處理各有明確功能<\/strong><\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<p><strong>採收成熟度與溫度決定後續品質上限<\/strong><\/p>\n<p>過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>藥劑須按乙烯敏感性選用；<\/p>\n<p>銀製劑廢液需回收，糖液未抑菌反會加劇堵管。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>前處理多在產地短時間進行，目的為補水、補充碳源、抑制乙烯及改善耐運；<\/p>\n<p>後處理／瓶插液則持續維持水分、營養與清潔。可舉：<\/p>\n<p>①硫代硫酸銀 STS，抑制乙烯作用；<\/p>\n<p>②1-MCP，與乙烯受體結合而阻斷反應；<\/p>\n<p>③8-HQC／8-HQS，抑制微生物、減少導管堵塞。蔗糖提供能量並促蕾開放，酸化劑改善吸水，亦是常用保鮮液成分。<\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：前後處理目的 4、三藥與機制 6；抗乙烯、抑菌與補糖分別。<\/p>\n<ul>\n<li><strong>前後處理目的 4<\/strong><\/li>\n<li><strong>三藥與機制 6<\/strong><\/li>\n<li><strong>抗乙烯<\/strong><\/li>\n<li><strong>抑菌與補糖分別<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短時高濃度預措液與全程瓶插液視為相同用法。<\/li>\n<\/ul>","source":"../../B111.pdf#page=2","md":"111年花卉學_逐題教學詳解.md","search":"切花前、後處理及三種藥劑 ## 第三題｜切花前、後處理及三種藥劑（10 分）\n\n### 題意與作答範圍\n\n本題重點：**切花前、後處理及三種藥劑**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b111.pdf#page=2)。\n\n### 先掌握答案\n\n前處理多在產地短時間進行，目的為補水、補充碳源、抑制乙烯及改善耐運；\n\n### 原理拆解：為什麼會這樣？\n\n**切離後的水分與碳收支轉為赤字**\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n**不同處理各有明確功能**\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n**採收成熟度與溫度決定後續品質上限**\n\n過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。\n\n### 這題要特別注意\n\n藥劑須按乙烯敏感性選用；\n\n銀製劑廢液需回收，糖液未抑菌反會加劇堵管。\n\n### 可直接練寫的完整答案\n\n前處理多在產地短時間進行，目的為補水、補充碳源、抑制乙烯及改善耐運；\n\n後處理／瓶插液則持續維持水分、營養與清潔。可舉：\n\n①硫代硫酸銀 sts，抑制乙烯作用；\n\n②1-mcp，與乙烯受體結合而阻斷反應；\n\n③8-hqc／8-hqs，抑制微生物、減少導管堵塞。蔗糖提供能量並促蕾開放，酸化劑改善吸水，亦是常用保鮮液成分。\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n### 實例：把原理用在情境中\n\n百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：前後處理目的 4、三藥與機制 6；抗乙烯、抑菌與補糖分別。\n\n- **前後處理目的 4**\n- **三藥與機制 6**\n- **抗乙烯**\n- **抑菌與補糖分別**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短時高濃度預措液與全程瓶插液視為相同用法。\n 111 花卉學"},{"id":"花卉學-111-四","s":"花卉學","y":111,"n":"四","t":"春化","body":"<h2>第四題｜春化（18 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>春化<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B111.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>英文 vernalization：植物接受一定時間低溫後，獲得或增強開花能力。種子型春化可於已吸水的種子或極幼苗感受低溫，如部分二年生草花；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>低溫建立的是成花能力<\/strong><\/p>\n<p>春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。<\/p>\n<p><strong>反應取決品種與發育年齡<\/strong><\/p>\n<p>種子或幼苗可感受低溫的類型，與須先達一定大小的綠體春化型不同。低溫的有效程度受溫度、持續時間、植株大小及後續條件影響；未達感應能力時，長時間低溫也不一定得到同樣效果。<\/p>\n<p><strong>感應完成仍須完成花芽發育<\/strong><\/p>\n<p>春化後的日長、溫度與營養決定抽薹和花器發育。部分植物在特定條件下有去春化反應，不能把處理完成看成保證當日開花。生產上須將育苗、低溫與後續栽培排成完整時程。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>類型依「能感受低溫的發育階段」區分；<\/p>\n<p>各園藝品種需冷性差異大，不能說同一物種所有品種都絕對需冷。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>英文 vernalization：植物接受一定時間低溫後，獲得或增強開花能力。種子型春化可於已吸水的種子或極幼苗感受低溫，如部分二年生草花；<\/p>\n<p>綠體型／綠植株型須先達一定苗齡或大小才感受低溫，如部分宿根福祿考。可用種子型三色堇（依品系）與綠體型鐘花／毛地黃的需冷品系作比較。<\/p>\n<p>春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。<\/p>\n<p>種子或幼苗可感受低溫的類型，與須先達一定大小的綠體春化型不同。低溫的有效程度受溫度、持續時間、植株大小及後續條件影響；未達感應能力時，長時間低溫也不一定得到同樣效果。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>部分甘藍類須先長到足夠大小再受低溫，才能順利抽薹開花供採種；食用生產則要避免幼苗過早達感應大小後遇冷，以減少未熟抽薹。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>18 分：英文 2、定義 4、兩型機制 10、兩例 2；品種條件保留。<\/p>\n<ul>\n<li><strong>英文 2<\/strong><\/li>\n<li><strong>定義 4<\/strong><\/li>\n<li><strong>兩型機制 10<\/strong><\/li>\n<li><strong>兩例 2<\/strong><\/li>\n<li><strong>品種條件保留<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把低溫解除休眠與低溫誘導成花當成同義。<\/li>\n<\/ul>","source":"../../B111.pdf#page=2","md":"111年花卉學_逐題教學詳解.md","search":"春化 ## 第四題｜春化（18 分）\n\n### 題意與作答範圍\n\n本題重點：**春化**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b111.pdf#page=2)。\n\n### 先掌握答案\n\n英文 vernalization：植物接受一定時間低溫後，獲得或增強開花能力。種子型春化可於已吸水的種子或極幼苗感受低溫，如部分二年生草花；\n\n### 原理拆解：為什麼會這樣？\n\n**低溫建立的是成花能力**\n\n春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。\n\n**反應取決品種與發育年齡**\n\n種子或幼苗可感受低溫的類型，與須先達一定大小的綠體春化型不同。低溫的有效程度受溫度、持續時間、植株大小及後續條件影響；未達感應能力時，長時間低溫也不一定得到同樣效果。\n\n**感應完成仍須完成花芽發育**\n\n春化後的日長、溫度與營養決定抽薹和花器發育。部分植物在特定條件下有去春化反應，不能把處理完成看成保證當日開花。生產上須將育苗、低溫與後續栽培排成完整時程。\n\n### 這題要特別注意\n\n類型依「能感受低溫的發育階段」區分；\n\n各園藝品種需冷性差異大，不能說同一物種所有品種都絕對需冷。\n\n### 可直接練寫的完整答案\n\n英文 vernalization：植物接受一定時間低溫後，獲得或增強開花能力。種子型春化可於已吸水的種子或極幼苗感受低溫，如部分二年生草花；\n\n綠體型／綠植株型須先達一定苗齡或大小才感受低溫，如部分宿根福祿考。可用種子型三色堇（依品系）與綠體型鐘花／毛地黃的需冷品系作比較。\n\n春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。\n\n種子或幼苗可感受低溫的類型，與須先達一定大小的綠體春化型不同。低溫的有效程度受溫度、持續時間、植株大小及後續條件影響；未達感應能力時，長時間低溫也不一定得到同樣效果。\n\n### 實例：把原理用在情境中\n\n部分甘藍類須先長到足夠大小再受低溫，才能順利抽薹開花供採種；食用生產則要避免幼苗過早達感應大小後遇冷，以減少未熟抽薹。\n\n### 配分重點：哪些內容不能漏？\n\n18 分：英文 2、定義 4、兩型機制 10、兩例 2；品種條件保留。\n\n- **英文 2**\n- **定義 4**\n- **兩型機制 10**\n- **兩例 2**\n- **品種條件保留**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把低溫解除休眠與低溫誘導成花當成同義。\n 111 花卉學"},{"id":"花卉學-111-五","s":"花卉學","y":111,"n":"五","t":"臺灣氣候與花卉產地","body":"<h2>第五題｜臺灣氣候與花卉產地（14 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>臺灣氣候與花卉產地<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B111.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>(1)相較許多同緯度地區，臺灣東亞季風顯著，北部冬季冷濕、陰雨較多，南部冬季相對乾暖。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>設施先改變能量與物質交換<\/strong><\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p><strong>各因子必須一起管理<\/strong><\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<p><strong>控制成效要用植株與環境資料驗證<\/strong><\/p>\n<p>以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>不能以「全臺都熱帶」解釋；<\/p>\n<p>海拔與季風使短距離內有多樣生產環境。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>(1)相較許多同緯度地區，臺灣東亞季風顯著，北部冬季冷濕、陰雨較多，南部冬季相對乾暖。<\/p>\n<p>(2)原因為海陸熱力差異、東北季風、黑潮與中央山脈造成迎背風差異。<\/p>\n<p>(3)陽明山冷濕、弱光適白花海芋；<\/p>\n<p>中南部冬季乾暖且日照較佳，適冬季洋桔梗切花；<\/p>\n<p>中部山區夏季較涼，適避暑栽培菊花、百合等。<\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>14 分：季風差異 4、大氣地形原因 4、三產區／特色配對 6。<\/p>\n<ul>\n<li><strong>季風差異 4<\/strong><\/li>\n<li><strong>大氣地形原因 4<\/strong><\/li>\n<li><strong>三產區／特色配對 6<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將溫室直接等同低溫環境。<\/li>\n<\/ul>","source":"../../B111.pdf#page=2","md":"111年花卉學_逐題教學詳解.md","search":"臺灣氣候與花卉產地 ## 第五題｜臺灣氣候與花卉產地（14 分）\n\n### 題意與作答範圍\n\n本題重點：**臺灣氣候與花卉產地**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b111.pdf#page=2)。\n\n### 先掌握答案\n\n(1)相較許多同緯度地區，臺灣東亞季風顯著，北部冬季冷濕、陰雨較多，南部冬季相對乾暖。\n\n### 原理拆解：為什麼會這樣？\n\n**設施先改變能量與物質交換**\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n**各因子必須一起管理**\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n**控制成效要用植株與環境資料驗證**\n\n以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。\n\n### 這題要特別注意\n\n不能以「全臺都熱帶」解釋；\n\n海拔與季風使短距離內有多樣生產環境。\n\n### 可直接練寫的完整答案\n\n(1)相較許多同緯度地區，臺灣東亞季風顯著，北部冬季冷濕、陰雨較多，南部冬季相對乾暖。\n\n(2)原因為海陸熱力差異、東北季風、黑潮與中央山脈造成迎背風差異。\n\n(3)陽明山冷濕、弱光適白花海芋；\n\n中南部冬季乾暖且日照較佳，適冬季洋桔梗切花；\n\n中部山區夏季較涼，適避暑栽培菊花、百合等。\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n### 實例：把原理用在情境中\n\n臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。\n\n### 配分重點：哪些內容不能漏？\n\n14 分：季風差異 4、大氣地形原因 4、三產區／特色配對 6。\n\n- **季風差異 4**\n- **大氣地形原因 4**\n- **三產區／特色配對 6**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將溫室直接等同低溫環境。\n 111 花卉學"},{"id":"花卉學-111-六","s":"花卉學","y":111,"n":"六","t":"一年生、二年生、宿根草花","body":"<h2>第六題｜一年生、二年生、宿根草花（12 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>一年生、二年生、宿根草花<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B111.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>一年生在一個生長季完成萌芽、開花結實與死亡，如百日草、波斯菊；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>器官來源比外觀名稱更可靠<\/strong><\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<p><strong>不同分類軸不能混用<\/strong><\/p>\n<p>花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。<\/p>\n<p><strong>名稱與例子要一對一<\/strong><\/p>\n<p>寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>栽培上一年生使用的多年生植物，不等於植物學上真正一年生；<\/p>\n<p>需說明是生活史還是使用方式。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>一年生在一個生長季完成萌芽、開花結實與死亡，如百日草、波斯菊；<\/p>\n<p>二年生第一季營養生長，越冬後第二季開花結實，如部分毛地黃、蜀葵品種；<\/p>\n<p>宿根草本可存活多年，靠地下或近地面器官越過不利季節，如非洲菊、萱草。<\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<p>花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>12 分：三類各定義與兩作物例，生活史與栽培用途區分。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>看到地下器官就全部寫成根。<\/li>\n<\/ul>","source":"../../B111.pdf#page=2","md":"111年花卉學_逐題教學詳解.md","search":"一年生、二年生、宿根草花 ## 第六題｜一年生、二年生、宿根草花（12 分）\n\n### 題意與作答範圍\n\n本題重點：**一年生、二年生、宿根草花**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b111.pdf#page=2)。\n\n### 先掌握答案\n\n一年生在一個生長季完成萌芽、開花結實與死亡，如百日草、波斯菊；\n\n### 原理拆解：為什麼會這樣？\n\n**器官來源比外觀名稱更可靠**\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n**不同分類軸不能混用**\n\n花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。\n\n**名稱與例子要一對一**\n\n寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。\n\n### 這題要特別注意\n\n栽培上一年生使用的多年生植物，不等於植物學上真正一年生；\n\n需說明是生活史還是使用方式。\n\n### 可直接練寫的完整答案\n\n一年生在一個生長季完成萌芽、開花結實與死亡，如百日草、波斯菊；\n\n二年生第一季營養生長，越冬後第二季開花結實，如部分毛地黃、蜀葵品種；\n\n宿根草本可存活多年，靠地下或近地面器官越過不利季節，如非洲菊、萱草。\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。\n\n### 實例：把原理用在情境中\n\n馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。\n\n### 配分重點：哪些內容不能漏？\n\n12 分：三類各定義與兩作物例，生活史與栽培用途區分。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 看到地下器官就全部寫成根。\n 111 花卉學"},{"id":"花卉學-111-七","s":"花卉學","y":111,"n":"七","t":"七個名詞","body":"<h2>第七題｜七個名詞（21 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>七個名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B111.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Hue 色相：紅黃綠藍等色的類別。Terrestrial orchid 地生蘭：根主要生長土壤／地面腐植層，如蕙蘭。Petaloidy 花瓣化：雄蕊等轉成花瓣狀構造。Cormel 子球莖：母球莖附近形成的小球莖，如唐菖蒲。Scooping 挖底法：挖除風信子鱗莖基盤中央、破除頂端優勢以誘發小鱗莖。<\/p>\n<p>Pad and fan type 水牆風扇式降溫：抽風使外氣經濕水牆，蒸發吸熱。Ebb and flow 潮汐灌溉：週期性淹灌苗床／盆底再排液，讓根域吸水並恢復通氣。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先看主軸頂端是否終止於花<\/strong><\/p>\n<p>無限花序主軸可持續延伸，常見基部或周緣先開、往頂端或中心續開；有限花序主軸以頂花終止，後由側軸接續，常見頂端或中央先開。需看發育次序，不只看成熟時外形。<\/p>\n<p><strong>再看花梗、軸長與分枝<\/strong><\/p>\n<p>總狀花序具明顯主軸與有梗小花；穗狀小花無梗或近無梗；繖形花梗集中於近同一點；頭狀花序小花密集於膨大花托；肉穗花序的花軸肉質，常伴佛焰苞。<\/p>\n<p><strong>複合結構與俗名要註清<\/strong><\/p>\n<p>圓錐花序常由分枝總狀系統構成，複聚繖則由有限分枝重複。某些花序外觀近似繖形但發育屬聚繖，教材口徑可能不同，答題可在主要分類後註明，不宜用外形直接否定發育分類。<\/p>\n<p><strong>根需要水，也需要氧<\/strong><\/p>\n<p>介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。<\/p>\n<p><strong>化學性質會改變肥培結果<\/strong><\/p>\n<p>pH 影響元素溶解與有效性，EC 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 EC 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；pH 與 EC 是不同指標，不能相互替代。<\/p>\n<p><strong>配方應可重複而且衛生<\/strong><\/p>\n<p>選擇穩定、無病原與雜草種子、粒徑一致的材料，混合後實測保水、通氣、pH 及 EC。泥炭、椰纖、樹皮等有機材料會分解或吸附養分；珍珠石等材料的作用也受比例與粒徑影響，配方必須搭配灌肥管理。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Hue 色相：紅黃綠藍等色的類別。Terrestrial orchid 地生蘭：根主要生長土壤／地面腐植層，如蕙蘭。Petaloidy 花瓣化：雄蕊等轉成花瓣狀構造。Cormel 子球莖：母球莖附近形成的小球莖，如唐菖蒲。Scooping 挖底法：挖除風信子鱗莖基盤中央、破除頂端優勢以誘發小鱗莖。<\/td>\n<td>主要貯藏組織是肉質葉或葉基，底部有短縮莖基盤，例如百合、洋蔥。 主要是實心肥大莖，與以肉質鱗片葉儲藏的鱗莖不同，例如唐菖蒲、荸薺。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>這題要特別注意<\/h3>\n<p>球莖是實心膨大莖，鱗莖主要是肉質鱗片葉，兩者不可互換。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Hue 色相：紅黃綠藍等色的類別。Terrestrial orchid 地生蘭：根主要生長土壤／地面腐植層，如蕙蘭。Petaloidy 花瓣化：雄蕊等轉成花瓣狀構造。Cormel 子球莖：母球莖附近形成的小球莖，如唐菖蒲。Scooping 挖底法：挖除風信子鱗莖基盤中央、破除頂端優勢以誘發小鱗莖。<\/p>\n<p>Pad and fan type 水牆風扇式降溫：抽風使外氣經濕水牆，蒸發吸熱。Ebb and flow 潮汐灌溉：週期性淹灌苗床／盆底再排液，讓根域吸水並恢復通氣。<\/p>\n<p>無限花序主軸可持續延伸，常見基部或周緣先開、往頂端或中心續開；有限花序主軸以頂花終止，後由側軸接續，常見頂端或中央先開。需看發育次序，不只看成熟時外形。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>向日葵看似一朵大花，實為多個舌狀與管狀小花構成頭狀花序；火鶴則以肉穗花序承載許多小花，外側顯著彩色部分是佛焰苞。<\/p>\n<p>同一泥炭與珍珠石配方用於矮盆時，底部飽和區占比可能較高；若又照高盆的頻率灌水，根部缺氧風險便增加。應從盆器與水分實測修正，而非只換肥料。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>21 分：七項各 3 分，中文、構造／作用、應用。<\/p>\n<ul>\n<li><strong>七項各 3 分，中文<\/strong><\/li>\n<li><strong>構造／作用<\/strong><\/li>\n<li><strong>應用<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把花序名稱與花冠形狀混寫。<\/li>\n<li>把無土介質寫成完全不含有機物。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../B111.pdf#page=2","md":"111年花卉學_逐題教學詳解.md","search":"七個名詞 ## 第七題｜七個名詞（21 分）\n\n### 題意與作答範圍\n\n本題重點：**七個名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b111.pdf#page=2)。\n\n### 先掌握答案\n\nhue 色相：紅黃綠藍等色的類別。terrestrial orchid 地生蘭：根主要生長土壤／地面腐植層，如蕙蘭。petaloidy 花瓣化：雄蕊等轉成花瓣狀構造。cormel 子球莖：母球莖附近形成的小球莖，如唐菖蒲。scooping 挖底法：挖除風信子鱗莖基盤中央、破除頂端優勢以誘發小鱗莖。\n\npad and fan type 水牆風扇式降溫：抽風使外氣經濕水牆，蒸發吸熱。ebb and flow 潮汐灌溉：週期性淹灌苗床／盆底 ach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
