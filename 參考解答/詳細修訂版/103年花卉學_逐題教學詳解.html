ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 6 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"花卉學-103-一","s":"花卉學","y":103,"n":"一","t":"六地市場、價格、規模","body":"<h2>第一題｜六地市場、價格、規模（24 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>六地市場、價格、規模<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=11\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>按題目年代典型：丹麥合作化盆花與協商／訂單，荷蘭大型產地拍賣並跨國集散，日本消費地拍賣與多產區規格切花，美國大型產銷／進口分銷及協商契約；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>為何採後仍會變差<\/strong><\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p><strong>低溫有效，但有適用範圍<\/strong><\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<p><strong>把全程串起來<\/strong><\/p>\n<p>採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>按題目年代典型：丹麥合作化盆花與協商／訂單，荷蘭大型產地拍賣並跨國集散，日本消費地拍賣與多產區規格切花，美國大型產銷／進口分銷及協商契約；<\/p>\n<p>彰化田尾小中型苗圃與議價、盆花苗木及景觀，臺北花市消費地批發、切花拍賣與議價。契約較能平滑短期價格，拍賣能快速發現價格但仍受供需波動；<\/p>\n<p>規模不是價格穩定的唯一原因。<\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>24 分：六地逐一比較交易、價格、規模、產品，並註歷史概括。<\/p>\n<ul>\n<li><strong>六地逐一比較交易<\/strong><\/li>\n<li><strong>產品，並註歷史概括<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>認為溫度越低、保存效果一定越好。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=11","md":"103年花卉學_逐題教學詳解.md","search":"六地市場、價格、規模 ## 第一題｜六地市場、價格、規模（24 分）\n\n### 題意與作答範圍\n\n本題重點：**六地市場、價格、規模**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=11)。\n\n### 先掌握答案\n\n按題目年代典型：丹麥合作化盆花與協商／訂單，荷蘭大型產地拍賣並跨國集散，日本消費地拍賣與多產區規格切花，美國大型產銷／進口分銷及協商契約；\n\n### 原理拆解：為什麼會這樣？\n\n**為何採後仍會變差**\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n**低溫有效，但有適用範圍**\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n**把全程串起來**\n\n採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。\n\n### 可直接練寫的完整答案\n\n按題目年代典型：丹麥合作化盆花與協商／訂單，荷蘭大型產地拍賣並跨國集散，日本消費地拍賣與多產區規格切花，美國大型產銷／進口分銷及協商契約；\n\n彰化田尾小中型苗圃與議價、盆花苗木及景觀，臺北花市消費地批發、切花拍賣與議價。契約較能平滑短期價格，拍賣能快速發現價格但仍受供需波動；\n\n規模不是價格穩定的唯一原因。\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n### 實例：把原理用在情境中\n\n驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。\n\n### 配分重點：哪些內容不能漏？\n\n24 分：六地逐一比較交易、價格、規模、產品，並註歷史概括。\n\n- **六地逐一比較交易**\n- **產品，並註歷史概括**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 認為溫度越低、保存效果一定越好。\n 103 花卉學"},{"id":"花卉學-103-二","s":"花卉學","y":103,"n":"二","t":"八名詞","body":"<h2>第二題｜八名詞（24 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>八名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=11\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Embryo culture 胚培養，如遠緣胚救援；<\/p>\n<p>air layering 空中壓條，如木本花卉環剝包介質；<\/p>\n<p>polyploidy 多倍體，完整染色體組增加；<\/p>\n<p>foliage plants 觀葉植物；<\/p>\n<p>corm 球莖，實心短縮膨大莖如唐菖蒲；<\/p>\n<p>hue 色相；<\/p>\n<p>betacyanin 甜菜紅素，甜菜色素中紅紫類；<\/p>\n<p>bulb 鱗莖，如百合肉質鱗片包短莖。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<p><strong>先找色素，再找影響顯色的環境<\/strong><\/p>\n<p>花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。<\/p>\n<p><strong>同一色素也能呈不同顏色<\/strong><\/p>\n<p>液泡 pH、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 pH 不會不經生理過程就等於花瓣液泡 pH。<\/p>\n<p><strong>用可驗證的機制解釋栽培或育種操作<\/strong><\/p>\n<p>繡球花的藍色涉及鋁有效性與花器內的色素複合，需同時考慮品種與介質；藍玫瑰育種則涉及花青素生合成途徑、競爭酵素與細胞條件。不能只以「施酸肥」解釋所有藍花。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>corm 球莖，實心短縮膨大莖如唐菖蒲；<\/td>\n<td>主要是實心肥大莖，與以肉質鱗片葉儲藏的鱗莖不同，例如唐菖蒲、荸薺。<\/td>\n<\/tr>\n<tr>\n<td>bulb 鱗莖，如百合肉質鱗片包短莖。<\/td>\n<td>主要貯藏組織是肉質葉或葉基，底部有短縮莖基盤，例如百合、洋蔥。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Embryo culture 胚培養，如遠緣胚救援；<\/p>\n<p>air layering 空中壓條，如木本花卉環剝包介質；<\/p>\n<p>polyploidy 多倍體，完整染色體組增加；<\/p>\n<p>foliage plants 觀葉植物；<\/p>\n<p>corm 球莖，實心短縮膨大莖如唐菖蒲；<\/p>\n<p>hue 色相；<\/p>\n<p>betacyanin 甜菜紅素，甜菜色素中紅紫類；<\/p>\n<p>bulb 鱗莖，如百合肉質鱗片包短莖。<\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<p>同品種繡球在適合條件下，可因根域酸度影響鋁有效性而改變顯色；白花或缺乏相關色素能力的品種，不能保證以同一方法轉成藍花。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>24 分：每項 3 分，中文、定義與例。<\/p>\n<ul>\n<li><strong>每項 3 分，中文<\/strong><\/li>\n<li><strong>定義與例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<li>把所有黃花都歸因於花青素。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=11","md":"103年花卉學_逐題教學詳解.md","search":"八名詞 ## 第二題｜八名詞（24 分）\n\n### 題意與作答範圍\n\n本題重點：**八名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=11)。\n\n### 先掌握答案\n\nembryo culture 胚培養，如遠緣胚救援；\n\nair layering 空中壓條，如木本花卉環剝包介質；\n\npolyploidy 多倍體，完整染色體組增加；\n\nfoliage plants 觀葉植物；\n\ncorm 球莖，實心短縮膨大莖如唐菖蒲；\n\nhue 色相；\n\nbetacyanin 甜菜紅素，甜菜色素中紅紫類；\n\nbulb 鱗莖，如百合肉質鱗片包短莖。\n\n### 原理拆解：為什麼會這樣？\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n**先找色素，再找影響顯色的環境**\n\n花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。\n\n**同一色素也能呈不同顏色**\n\n液泡 ph、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 ph 不會不經生理過程就等於花瓣液泡 ph。\n\n**用可驗證的機制解釋栽培或育種操作**\n\n繡球花的藍色涉及鋁有效性與花器內的色素複合，需同時考慮品種與介質；藍玫瑰育種則涉及花青素生合成途徑、競爭酵素與細胞條件。不能只以「施酸肥」解釋所有藍花。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| corm 球莖，實心短縮膨大莖如唐菖蒲； | 主要是實心肥大莖，與以肉質鱗片葉儲藏的鱗莖不同，例如唐菖蒲、荸薺。 |\n| bulb 鱗莖，如百合肉質鱗片包短莖。 | 主要貯藏組織是肉質葉或葉基，底部有短縮莖基盤，例如百合、洋蔥。 |\n\n### 可直接練寫的完整答案\n\nembryo culture 胚培養，如遠緣胚救援；\n\nair layering 空中壓條，如木本花卉環剝包介質；\n\npolyploidy 多倍體，完整染色體組增加；\n\nfoliage plants 觀葉植物；\n\ncorm 球莖，實心短縮膨大莖如唐菖蒲；\n\nhue 色相；\n\nbetacyanin 甜菜紅素，甜菜色素中紅紫類；\n\nbulb 鱗莖，如百合肉質鱗片包短莖。\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n### 實例：把原理用在情境中\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n同品種繡球在適合條件下，可因根域酸度影響鋁有效性而改變顯色；白花或缺乏相關色素能力的品種，不能保證以同一方法轉成藍花。\n\n### 配分重點：哪些內容不能漏？\n\n24 分：每項 3 分，中文、定義與例。\n\n- **每項 3 分，中文**\n- **定義與例**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無性繁殖與無病毒畫上等號。\n- 把所有黃花都歸因於花青素。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 103 花卉學"},{"id":"花卉學-103-三","s":"花卉學","y":103,"n":"三","t":"組培初代褐化","body":"<h2>第三題｜組培初代褐化（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>組培初代褐化<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=11\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>切割傷口使酚類與多酚氧化酶接觸、氧化成醌，造成培養基及組織褐化毒害；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>褐化與污染不能混為一談<\/strong><\/p>\n<p>外植體受傷後酚類釋出並被氧化，褐色產物可傷害培養組織；微生物污染則是另一問題。可用健康幼嫩材料、降低傷口、適當抗氧化或吸附材料、縮短初代轉接時間等方法；過強消毒雖減菌，卻可能加重組織傷害。處理須比較褐化率、存活率與增殖能力。<\/p>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>切割傷口使酚類與多酚氧化酶接觸、氧化成醌，造成培養基及組織褐化毒害；<\/p>\n<p>外植體成熟、酚含量高、消毒過強會加劇。選幼嫩材料、迅速處理、抗氧化劑／PVP 吸附、活性炭、縮短轉接與適當低光可減輕，但活性炭亦吸附調節劑，配方須重調。<\/p>\n<p>外植體受傷後酚類釋出並被氧化，褐色產物可傷害培養組織；微生物污染則是另一問題。可用健康幼嫩材料、降低傷口、適當抗氧化或吸附材料、縮短初代轉接時間等方法；過強消毒雖減菌，卻可能加重組織傷害。處理須比較褐化率、存活率與增殖能力。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：傷口酚氧化、材料因素、至少三對策及限制。<\/p>\n<ul>\n<li><strong>傷口酚氧化<\/strong><\/li>\n<li><strong>材料因素<\/strong><\/li>\n<li><strong>至少三對策及限制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=11","md":"103年花卉學_逐題教學詳解.md","search":"組培初代褐化 ## 第三題｜組培初代褐化（15 分）\n\n### 題意與作答範圍\n\n本題重點：**組培初代褐化**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=11)。\n\n### 先掌握答案\n\n切割傷口使酚類與多酚氧化酶接觸、氧化成醌，造成培養基及組織褐化毒害；\n\n### 原理拆解：為什麼會這樣？\n\n**褐化與污染不能混為一談**\n\n外植體受傷後酚類釋出並被氧化，褐色產物可傷害培養組織；微生物污染則是另一問題。可用健康幼嫩材料、降低傷口、適當抗氧化或吸附材料、縮短初代轉接時間等方法；過強消毒雖減菌，卻可能加重組織傷害。處理須比較褐化率、存活率與增殖能力。\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n### 可直接練寫的完整答案\n\n切割傷口使酚類與多酚氧化酶接觸、氧化成醌，造成培養基及組織褐化毒害；\n\n外植體成熟、酚含量高、消毒過強會加劇。選幼嫩材料、迅速處理、抗氧化劑／pvp 吸附、活性炭、縮短轉接與適當低光可減輕，但活性炭亦吸附調節劑，配方須重調。\n\n外植體受傷後酚類釋出並被氧化，褐色產物可傷害培養組織；微生物污染則是另一問題。可用健康幼嫩材料、降低傷口、適當抗氧化或吸附材料、縮短初代轉接時間等方法；過強消毒雖減菌，卻可能加重組織傷害。處理須比較褐化率、存活率與增殖能力。\n\n### 實例：把原理用在情境中\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：傷口酚氧化、材料因素、至少三對策及限制。\n\n- **傷口酚氧化**\n- **材料因素**\n- **至少三對策及限制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無性繁殖與無病毒畫上等號。\n 103 花卉學"},{"id":"花卉學-103-四","s":"花卉學","y":103,"n":"四","t":"蝴蝶蘭與春石斛催花","body":"<h2>第四題｜蝴蝶蘭與春石斛催花（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>蝴蝶蘭與春石斛催花<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=11\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>蝴蝶蘭先養到成熟葉數與大小，再給一段適當較低日溫／日夜溫處理抽梗，後續溫度控制發育；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>用限制來源分類<\/strong><\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p><strong>冬天的冷與春天的暖做不同工作<\/strong><\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<p><strong>技術必須對應真正瓶頸<\/strong><\/p>\n<p>摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。<\/p>\n<p><strong>設施先改變能量與物質交換<\/strong><\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p><strong>各因子必須一起管理<\/strong><\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<p><strong>控制成效要用植株與環境資料驗證<\/strong><\/p>\n<p>以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>蝴蝶蘭先養到成熟葉數與大小，再給一段適當較低日溫／日夜溫處理抽梗，後續溫度控制發育；<\/p>\n<p>高溫可抑抽梗。春石斛先使新莖成熟，依品種給秋冬低溫、較乾管理以誘花，若氮水過多與溫度偏高易長高芽而非花。二者都需成熟度，不能以枯旱傷株代替誘導。<\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。<\/p>\n<p>臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：兩者成熟材料、溫度與水肥條件、避免錯誤。<\/p>\n<ul>\n<li><strong>兩者成熟材料<\/strong><\/li>\n<li><strong>溫度與水肥條件<\/strong><\/li>\n<li><strong>避免錯誤<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把需冷不足與萌芽後霜害混為同一問題。<\/li>\n<li>將溫室直接等同低溫環境。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=11","md":"103年花卉學_逐題教學詳解.md","search":"蝴蝶蘭與春石斛催花 ## 第四題｜蝴蝶蘭與春石斛催花（10 分）\n\n### 題意與作答範圍\n\n本題重點：**蝴蝶蘭與春石斛催花**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=11)。\n\n### 先掌握答案\n\n蝴蝶蘭先養到成熟葉數與大小，再給一段適當較低日溫／日夜溫處理抽梗，後續溫度控制發育；\n\n### 原理拆解：為什麼會這樣？\n\n**用限制來源分類**\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n**冬天的冷與春天的暖做不同工作**\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n**技術必須對應真正瓶頸**\n\n摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。\n\n**設施先改變能量與物質交換**\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n**各因子必須一起管理**\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n**控制成效要用植株與環境資料驗證**\n\n以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。\n\n### 可直接練寫的完整答案\n\n蝴蝶蘭先養到成熟葉數與大小，再給一段適當較低日溫／日夜溫處理抽梗，後續溫度控制發育；\n\n高溫可抑抽梗。春石斛先使新莖成熟，依品種給秋冬低溫、較乾管理以誘花，若氮水過多與溫度偏高易長高芽而非花。二者都需成熟度，不能以枯旱傷株代替誘導。\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n### 實例：把原理用在情境中\n\n平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。\n\n臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：兩者成熟材料、溫度與水肥條件、避免錯誤。\n\n- **兩者成熟材料**\n- **溫度與水肥條件**\n- **避免錯誤**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把需冷不足與萌芽後霜害混為同一問題。\n- 將溫室直接等同低溫環境。\n 103 花卉學"},{"id":"花卉學-103-五","s":"花卉學","y":103,"n":"五","t":"洋桔梗簇生化與恢復","body":"<h2>第五題｜洋桔梗簇生化與恢復（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>洋桔梗簇生化與恢復<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=11\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>高溫敏感品種在種子／幼苗階段受熱，後續節間不能正常伸長而葉片蓮座叢生，延遲抽薹與開花。選耐熱品種、適期播種、控制發芽及育苗溫度，避免根域過熱。已簇生苗可依品種施一定期間低溫促恢復，再逐步恢復適溫與長日；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>微小種子使早期整齊度特別重要<\/strong><\/p>\n<p>種子小、儲藏資源有限，播種深度、光、水分及介質均一度影響出苗。表面不厚 難集中；應從種苗批次溫度與品系查起，不能只全面追加肥料。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：原因、形態、苗期與定植預防、恢復及限制。\n\n- **苗期與定植預防**\n- **恢復及限制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把簇生化說成分枝很多且越多越好。\n 103 花卉學"},{"id":"花卉學-103-六","s":"花卉學","y":103,"n":"六","t":"物種、品種、變種、栽培品種","body":"<h2>第六題｜物種、品種、變種、栽培品種（12 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>物種、品種、變種、栽培品種<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=11\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Species 為可辨識的自然分類基本單位，如 Rosa chinensis；<\/p>\n<p>variety 在植物分類指種下變種，寫 var. 加拉丁名；<\/p>\n<p>cultivar 為人為選育、具可辨識且可維持性狀的栽培品種，名稱以單引號如 Rosa ‘Peace’；<\/p>\n<p>clonal cultivar 為以無性繁殖保持同一基因型的栽培品種。中文「品種」常同時指 variety／cultivar，作答須交代語境。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>學名階層與栽培品種是兩個命名系統<\/strong><\/p>\n<p>物種是生物分類的基本單位；變種屬種內正式分類階層，常標 var.；栽培品種 cultivar 是經人選育並能維持可辨識特徵的栽培群。栽培品種名稱通常用正體、單引號標示，不能把所有 cultivar 都寫成植物分類學上的 var.。園藝口語「品種」須依題目脈絡說明是 cultivar 或一般種類。<\/p>\n<p><strong>器官來源比外觀名稱更可靠<\/strong><\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<p><strong>不同分類軸不能混用<\/strong><\/p>\n<p>花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。<\/p>\n<p><strong>名稱與例子要一對一<\/strong><\/p>\n<p>寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Species 為可辨識的自然分類基本單位，如 Rosa chinensis；<\/td>\n<td>電導度反映可溶鹽類總量的相關指標，不能單獨判定是哪一元素缺乏或過量。<\/td>\n<\/tr>\n<tr>\n<td>variety 在植物分類指種下變種，寫 var. 加拉丁名；<\/td>\n<td>英文在日常園藝可泛指品種，但分類學 variety 指種內變種，須依上下文判讀。<\/td>\n<\/tr>\n<tr>\n<td>cultivar 為人為選育、具可辨識且可維持性狀的栽培品種，名稱以單引號如 Rosa ‘Peace’；<\/td>\n<td>栽培品種通常以單引號標名稱，與植物分類學的變種 var. 不可混用。<\/td>\n<\/tr>\n<tr>\n<td>clonal cultivar 為以無性繁殖保持同一基因型的栽培品種。中文「品種」常同時指 variety／cultivar，作答須交代語境。<\/td>\n<td>栽培品種通常以單引號標名稱，與植物分類學的變種 var. 不可混用。 英文在日常園藝可泛指品種，但分類學 variety 指種內變種，須依上下文判讀。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Species 為可辨識的自然分類基本單位，如 Rosa chinensis；<\/p>\n<p>variety 在植物分類指種下變種，寫 var. 加拉丁名；<\/p>\n<p>cultivar 為人為選育、具可辨識且可維持性狀的栽培品種，名稱以單引號如 Rosa ‘Peace’；<\/p>\n<p>clonal cultivar 為以無性繁殖保持同一基因型的栽培品種。中文「品種」常同時指 variety／cultivar，作答須交代語境。<\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>12 分：四概念層級、命名格式與至少一個具體花卉例。<\/p>\n<ul>\n<li><strong>四概念層級<\/strong><\/li>\n<li><strong>命名格式與至少一個具體花卉例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>看到地下器官就全部寫成根。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=11","md":"103年花卉學_逐題教學詳解.md","search":"物種、品種、變種、栽培品種 ## 第六題｜物種、品種、變種、栽培品種（12 分）\n\n### 題意與作答範圍\n\n本題重點：**物種、品種、變種、栽培品種**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=11)。\n\n### 先掌握答案\n\nspecies 為可辨識的自然分類基本單位，如 rosa chinensis；\n\nvariety 在植物分類指種下變種，寫 var. 加拉丁名；\n\ncultivar 為人為選育、具可辨識且可維持性狀的栽培品種，名稱以單引號如 rosa ‘peace’；\n\nclonal cultivar 為以無性繁殖保持同一基因型的栽培品種。中文「品種」常同時指 variety／cultivar，作答須交代語境。\n\n### 原理拆解：為什麼會這樣？\n\n**學名階層與栽培品種是兩個命名系統**\n\n物種是生物分類的基本單位；變種屬種內正式分類階層，常標 var.；栽培品種 cultivar 是經人選育並能維持可辨識特徵的栽培群。栽培品種名稱通常用正體、單引號標示，不能把所有 cultivar 都寫成植物分類學上的 var.。園藝口語「品種」須依題目脈絡說明是 cultivar 或一般種類。\n\n**器官來源比外觀名稱更可靠**\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n**不同分類軸不能混用**\n\n花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。\n\n**名稱與例子要一對一**\n\n寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| species 為可辨識的自然分類基本單位，如 rosa chinensis； | 電導度反映可溶鹽類總量的相關指標，不能單獨判定是哪一元素缺乏或過量。 |\n| variety 在植物分類指種下變種，寫 var. 加拉丁名； | 英文在日常園藝可泛指品種，但分類學 variety 指種內變種，須依上下文判讀。 |\n| cultivar 為人為選育、具可辨識且可維持性狀的栽培品種，名稱以單引號如 rosa ‘peace’； | 栽培品種通常以單引號標名稱，與植物分類學的變種 var. 不可混用。 |\n| clonal cultivar 為以無性繁殖保持同一基因型的栽培品種。中文「品種」常同時指 variety／cultivar，作答須交代語境。 | 栽培品種通常以單引號標名稱，與植物分類學的變種 var. 不可混用。 英文在日常園藝可泛指品種，但分類學 variety 指種內變種，須依上下文判讀。 |\n\n### 可直接練寫的完整答案\n\nspecies 為可辨識的自然分類基本單位，如 rosa chinensis；\n\nvariety 在植物分類指種下變種，寫 var. 加拉丁名；\n\ncultivar 為人為選育、具可辨識且可維持性狀的栽培品種，名稱以單引號如 rosa ‘peace’；\n\nclonal cultivar 為以無性繁殖保持同一基因型的栽培品種。中文「品種」常同時指 variety／cultivar，作答須交代語境。\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n### 實例：把原理用在情境中\n\n馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。\n\n### 配分重點：哪些內容不能漏？\n\n12 分：四概念層級、命名格式與至少一個具體花卉例。\n\n- **四概念層級**\n- **命名格式與至少一個具體花卉例**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 看到地下器官就全部寫成根。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 103 花卉學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
