ong>土壤溫度對生產<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C111.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>土溫影響種子吸水、酵素反應與出苗速度，過低延遲發芽、過高可能抑制或熱休眠；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<p><strong>先區分傷害種類與發生條件<\/strong><\/p>\n<p>乾旱、淹水、高溫、寒害、凍害與鹽害的起始機制不同。寒害可在冰點以上發生於敏感作物，凍害則涉及結冰；淹水即使土壤水多，也可能因缺氧而使根無法正常供水。<\/p>\n<p><strong>從細胞功能連到可見症狀<\/strong><\/p>\n<p>膜性質改變、活性氧增加、酵素與能量代謝受阻，最後表現萎凋、褐化、落花或生長停滯。短期氣孔關閉可節水，長期卻限制 CO₂ 吸收；適應反應與傷害結果應分別說明。<\/p>\n<p><strong>預防與恢復管理各有時機<\/strong><\/p>\n<p>品種與產季選擇、灌排、覆蓋、通風遮陰及適度馴化可降低風險。受害後先評估根與生長點是否存活，再調整水肥；重施肥不能代替環境修復，受傷根系也可能無法利用增加的養分。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>土溫與氣溫相關但不相同，土壤含水、覆蓋、深度與日夜變化共同決定根域溫度。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>土溫影響種子吸水、酵素反應與出苗速度，過低延遲發芽、過高可能抑制或熱休眠；<\/p>\n<p>影響根生長、膜運輸、水肥吸收、根呼吸及微生物礦化。過冷會引起磷吸收不良、葉紫與生長慢；<\/p>\n<p>過熱使根呼吸與耗氧增加、根系活力下降。地下貯藏器官形成與膨大亦有適溫，如馬鈴薯高土溫不利結薯。管理可用播期、覆蓋顏色、高畦、灌溉、遮蔭、穴盤加溫或根域降溫調整。<\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<p>熱帶果菜低溫貯藏後可能出現凹陷、褐化與腐敗，而未曾結冰；應檢查該作物安全溫度與累積暴露時間，不能只把冷庫調得更冷。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：萌芽、根水肥、代謝微生物、貯藏器官及調溫技術。<\/p>\n<ul>\n<li><strong>根水肥<\/strong><\/li>\n<li><strong>代謝微生物<\/strong><\/li>\n<li><strong>貯藏器官及調溫技術<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<li>把寒害與凍害當成同義詞。<\/li>\n<\/ul>","source":"../../C111.pdf#page=2","md":"111年蔬菜學_逐題教學詳解.md","search":"土壤溫度對生產 ## 第一題｜土壤溫度對生產（20 分）\n\n### 題意與作答範圍\n\n本題重點：**土壤溫度對生產**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c111.pdf#page=2)。\n\n### 先掌握答案\n\n土溫影響種子吸水、酵素反應與出苗速度，過低延遲發芽、過高可能抑制或熱休眠；\n\n### 原理拆解：為什麼會這樣？\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n**先區分傷害種類與發生條件**\n\n乾旱、淹水、高溫、寒害、凍害與鹽害的起始機制不同。寒害可在冰點以上發生於敏感作物，凍害則涉及結冰；淹水即使土壤水多，也可能因缺氧而使根無法正常供水。\n\n**從細胞功能連到可見症狀**\n\n膜性質改變、活性氧增加、酵素與能量代謝受阻，最後表現萎凋、褐化、落花或生長停滯。短期氣孔關閉可節水，長期卻限制 co₂ 吸收；適應反應與傷害結果應分別說明。\n\n**預防與恢復管理各有時機**\n\n品種與產季選擇、灌排、覆蓋、通風遮陰及適度馴化可降低風險。受害後先評估根與生長點是否存活，再調整水肥；重施肥不能代替環境修復，受傷根系也可能無法利用增加的養分。\n\n### 這題要特別注意\n\n土溫與氣溫相關但不相同，土壤含水、覆蓋、深度與日夜變化共同決定根域溫度。\n\n### 可直接練寫的完整答案\n\n土溫影響種子吸水、酵素反應與出苗速度，過低延遲發芽、過高可能抑制或熱休眠；\n\n影響根生長、膜運輸、水肥吸收、根呼吸及微生物礦化。過冷會引起磷吸收不良、葉紫與生長慢；\n\n過熱使根呼吸與耗氧增加、根系活力下降。地下貯藏器官形成與膨大亦有適溫，如馬鈴薯高土溫不利結薯。管理可用播期、覆蓋顏色、高畦、灌溉、遮蔭、穴盤加溫或根域降溫調整。\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n### 實例：把原理用在情境中\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n熱帶果菜低溫貯藏後可能出現凹陷、褐化與腐敗，而未曾結冰；應檢查該作物安全溫度與累積暴露時間，不能只把冷庫調得更冷。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：萌芽、根水肥、代謝微生物、貯藏器官及調溫技術。\n\n- **根水肥**\n- **代謝微生物**\n- **貯藏器官及調溫技術**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將連作障礙全部歸因於缺肥。\n- 把寒害與凍害當成同義詞。\n 111 蔬菜學"},{"id":"蔬菜學-111-二","s":"蔬菜學","y":111,"n":"二","t":"五種蔬菜分類","body":"<h2>第二題｜五種蔬菜分類（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五種蔬菜分類<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C111.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Cucumis sativus：胡瓜／小黃瓜 cucumber，葫蘆科 Cucurbitaceae，雙子葉。Solanum melongena：茄子 eggplant，茄科 Solanaceae，雙子葉。Brassica juncea：芥菜 mustard greens，十字花科 Brassicaceae，雙子葉。<\/p>\n<p>Phaseolus vulgaris：菜豆 common bean，豆科 Fabaceae，雙子葉。Allium cepa：洋蔥 onion，石蒜科 Amaryllidaceae（舊分蔥科／百合科），單子葉。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>器官來源比外觀名稱更可靠<\/strong><\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<p><strong>不同分類軸不能混用<\/strong><\/p>\n<p>花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。<\/p>\n<p><strong>名稱與例子要一對一<\/strong><\/p>\n<p>寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Phaseolus vulgaris：菜豆 common bean，豆科 Fabaceae，雙子葉。Allium cepa：洋蔥 onion，石蒜科 Amaryllidaceae（舊分蔥科／百合科），單子葉。<\/td>\n<td>離層酸名稱容易誤導，主要作答可由乾旱訊號、氣孔關閉、種子或芽休眠等功能說明。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>這題要特別注意<\/h3>\n<p>現代 Allium 歸石蒜科，考卷若依舊教材可註明分類系統。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Cucumis sativus：胡瓜／小黃瓜 cucumber，葫蘆科 Cucurbitaceae，雙子葉。Solanum melongena：茄子 eggplant，茄科 Solanaceae，雙子葉。Brassica juncea：芥菜 mustard greens，十字花科 Brassicaceae，雙子葉。<\/p>\n<p>Phaseolus vulgaris：菜豆 common bean，豆科 Fabaceae，雙子葉。Allium cepa：洋蔥 onion，石蒜科 Amaryllidaceae（舊分蔥科／百合科），單子葉。<\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：五種科、中文、英文、單雙子葉四欄。<\/p>\n<ul>\n<li><strong>五種科<\/strong><\/li>\n<li><strong>單雙子葉四欄<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>看到地下器官就全部寫成根。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../C111.pdf#page=2","md":"111年蔬菜學_逐題教學詳解.md","search":"五種蔬菜分類 ## 第二題｜五種蔬菜分類（20 分）\n\n### 題意與作答範圍\n\n本題重點：**五種蔬菜分類**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c111.pdf#page=2)。\n\n### 先掌握答案\n\ncucumis sativus：胡瓜／小黃瓜 cucumber，葫蘆科 cucurbitaceae，雙子葉。solanum melongena：茄子 eggplant，茄科 solanaceae，雙子葉。brassica juncea：芥菜 mustard greens，十字花科 brassicaceae，雙子葉。\n\nphaseolus vulgaris：菜豆 common bean，豆科 fabaceae，雙子葉。allium cepa：洋蔥 onion，石蒜科 amaryllidaceae（舊分蔥科／百合科），單子葉。\n\n### 原理拆解：為什麼會這樣？\n\n**器官來源比外觀名稱更可靠**\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n**不同分類軸不能混用**\n\n花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。\n\n**名稱與例子要一對一**\n\n寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| phaseolus vulgaris：菜豆 common bean，豆科 fabaceae，雙子葉。allium cepa：洋蔥 onion，石蒜科 amaryllidaceae（舊分蔥科／百合科），單子葉。 | 離層酸名稱容易誤導，主要作答可由乾旱訊號、氣孔關閉、種子或芽休眠等功能說明。 |\n\n### 這題要特別注意\n\n現代 allium 歸石蒜科，考卷若依舊教材可註明分類系統。\n\n### 可直接練寫的完整答案\n\ncucumis sativus：胡瓜／小黃瓜 cucumber，葫蘆科 cucurbitaceae，雙子葉。solanum melongena：茄子 eggplant，茄科 solanaceae，雙子葉。brassica juncea：芥菜 mustard greens，十字花科 brassicaceae，雙子葉。\n\nphaseolus vulgaris：菜豆 common bean，豆科 fabaceae，雙子葉。allium cepa：洋蔥 onion，石蒜科 amaryllidaceae（舊分蔥科／百合科），單子葉。\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n### 實例：把原理用在情境中\n\n馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：五種科、中文、英文、單雙子葉四欄。\n\n- **五種科**\n- **單雙子葉四欄**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 看到地下器官就全部寫成根。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 111 蔬菜學"},{"id":"蔬菜學-111-三","s":"蔬菜學","y":111,"n":"三","t":"夏季番茄問題與因應","body":"<h2>第三題｜夏季番茄問題與因應（18 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>夏季番茄問題與因應<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C111.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>高溫使花粉活力、花藥開裂與授粉下降，花柱突出、落花、著果少；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>授粉、種子與果實膨大互相連結<\/strong><\/p>\n<p>適當花粉發育、花藥開裂與授粉受精提供正常種子及激素訊號，支援胎座與果肉發育。高低溫或其他逆境可在不同階段造成落花、畸形或空洞；果實看似膨大也不保證內部組織正常。<\/p>\n<p><strong>營養生長不能無限制與果實競爭<\/strong><\/p>\n<p>整枝、摘心與適當去葉可調整株型、通風及後期無效果實，但葉是同化供源。過氮促旺梢，過度去葉則減供碳並暴露果面；需以花序位置、葉果比和目標採收期安排。<\/p>\n<p><strong>水熱與根域決定品質風險<\/strong><\/p>\n<p>均勻供水、適量鈣與良好根系有助減少局部缺鈣風險；突然大量供水可能增加裂果。高溫影響花粉與色素形成，適度通風遮陰須兼顧每日光積量，不能只靠催熟或催果處理解決所有問題。<\/p>\n<p><strong>先區分傷害種類與發生條件<\/strong><\/p>\n<p>乾旱、淹水、高溫、寒害、凍害與鹽害的起始機制不同。寒害可在冰點以上發生於敏感作物，凍害則涉及結冰；淹水即使土壤水多，也可能因缺氧而使根無法正常供水。<\/p>\n<p><strong>從細胞功能連到可見症狀<\/strong><\/p>\n<p>膜性質改變、活性氧增加、酵素與能量代謝受阻，最後表現萎凋、褐化、落花或生長停滯。短期氣孔關閉可節水，長期卻限制 CO₂ 吸收；適應反應與傷害結果應分別說明。<\/p>\n<p><strong>預防與恢復管理各有時機<\/strong><\/p>\n<p>品種與產季選擇、灌排、覆蓋、通風遮陰及適度馴化可降低風險。受害後先評估根與生長點是否存活，再調整水肥；重施肥不能代替環境修復，受傷根系也可能無法利用增加的養分。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>尻腐常是果端局部鈣供應不足與水分運輸問題，不可只看土壤總鈣。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>高溫使花粉活力、花藥開裂與授粉下降，花柱突出、落花、著果少；<\/p>\n<p>果色不均、茄紅素累積受抑，日燒、裂果、尻腐與病害增加。選耐熱品種與抗病砧木、調整播期及設施通風遮蔭降溫，保持均勻水分與適量鈣，避免過氮；<\/p>\n<p>花期以適宜振動／授粉措施、必要時合規生長調節，搭配疏果、保葉和整合病蟲管理。<\/p>\n<p>適當花粉發育、花藥開裂與授粉受精提供正常種子及激素訊號，支援胎座與果肉發育。高低溫或其他逆境可在不同階段造成落花、畸形或空洞；果實看似膨大也不保證內部組織正常。<\/p>\n<p>整枝、摘心與適當去葉可調整株型、通風及後期無效果實，但葉是同化供源。過氮促旺梢，過度去葉則減供碳並暴露果面；需以花序位置、葉果比和目標採收期安排。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>夏季番茄若落花且果面日燒，管理須同時改善花期高溫、保留健康遮蔭葉與均勻供水；只施生長素促果，未必改善授粉、內部品質或日燒。<\/p>\n<p>熱帶果菜低溫貯藏後可能出現凹陷、褐化與腐敗，而未曾結冰；應檢查該作物安全溫度與累積暴露時間，不能只把冷庫調得更冷。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>18 分：高溫花粉與花柱、著果與品質障礙、逐一因應。<\/p>\n<ul>\n<li><strong>高溫花粉與花柱<\/strong><\/li>\n<li><strong>著果與品質障礙<\/strong><\/li>\n<li><strong>逐一因應<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將所有果實異常都判為同一種缺素。<\/li>\n<li>把寒害與凍害當成同義詞。<\/li>\n<\/ul>","source":"../../C111.pdf#page=2","md":"111年蔬菜學_逐題教學詳解.md","search":"夏季番茄問題與因應 ## 第三題｜夏季番茄問題與因應（18 分）\n\n### 題意與作答範圍\n\n本題重點：**夏季番茄問題與因應**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c111.pdf#page=2)。\n\n### 先掌握答案\n\n高溫使花粉活力、花藥開裂與授粉下降，花柱突出、落花、著果少；\n\n### 原理拆解：為什麼會這樣？\n\n**授粉、種子與果實膨大互相連結**\n\n適當花粉發育、花藥開裂與授粉受精提供正常種子及激素訊號，支援胎座與果肉發育。高低溫或其他逆境可在不同階段造成落花、畸形或空洞；果實看似膨大也不保證內部組織正常。\n\n**營養生長不能無限制與果實競爭**\n\n整枝、摘心與適當去葉可調整株型、通風及後期無效果實，但葉是同化供源。過氮促旺梢，過度去葉則減供碳並暴露果面；需以花序位置、葉果比和目標採收期安排。\n\n**水熱與根域決定品質風險**\n\n均勻供水、適量鈣與良好根系有助減少局部缺鈣風險；突然大量供水可能增加裂果。高溫影響花粉與色素形成，適度通風遮陰須兼顧每日光積量，不能只靠催熟或催果處理解決所有問題。\n\n**先區分傷害種類與發生條件**\n\n乾旱、淹水、高溫、寒害、凍害與鹽害的起始機制不同。寒害可在冰點以上發生於敏感作物，凍害則涉及結冰；淹水即使土壤水多，也可能因缺氧而使根無法正常供水。\n\n**從細胞功能連到可見症狀**\n\n膜性質改變、活性氧增加、酵素與能量代謝受阻，最後表現萎凋、褐化、落花或生長停滯。短期氣孔關閉可節水，長期卻限制 co₂ 吸收；適應反應與傷害結果應分別說明。\n\n**預防與恢復管理各有時機**\n\n品種與產季選擇、灌排、覆蓋、通風遮陰及適度馴化可降低風險。受害後先評估根與生長點是否存活，再調整水肥；重施肥不能代替環境修復，受傷根系也可能無法利用增加的養分。\n\n### 這題要特別注意\n\n尻腐常是果端局部鈣供應不足與水分運輸問題，不可只看土壤總鈣。\n\n### 可直接練寫的完整答案\n\n高溫使花粉活力、花藥開裂與授粉下降，花柱突出、落花、著果少；\n\n果色不均、茄紅素累積受抑，日燒、裂果、尻腐與病害增加。選耐熱品種與抗病砧木、調整播期及設施通風遮蔭降溫，保持均勻水分與適量鈣，避免過氮；\n\n花期以適宜振動／授粉措施、必要時合規生長調節，搭配疏果、保葉和整合病蟲管理。\n\n適當花粉發育、花藥開裂與授粉受精提供正常種子及激素訊號，支援胎座與果肉發育。高低溫或其他逆境可在不同階段造成落花、畸形或空洞；果實看似膨大也不保證內部組織正常。\n\n整枝、摘心與適當去葉可調整株型、通風及後期無效果實，但葉是同化供源。過氮促旺梢，過度去葉則減供碳並暴露果面；需以花序位置、葉果比和目標採收期安排。\n\n### 實例：把原理用在情境中\n\n夏季番茄若落花且果面日燒，管理須同時改善花期高溫、保留健康遮蔭葉與均勻供水；只施生長素促果，未必改善授粉、內部品質或日燒。\n\n熱帶果菜低溫貯藏後可能出現凹陷、褐化與腐敗，而未曾結冰；應檢查該作物安全溫度與累積暴露時間，不能只把冷庫調得更冷。\n\n### 配分重點：哪些內容不能漏？\n\n18 分：高溫花粉與花柱、著果與品質障礙、逐一因應。\n\n- **高溫花粉與花柱**\n- **著果與品質障礙**\n- **逐一因應**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將所有果實異常都判為同一種缺素。\n- 把寒害與凍害當成同義詞。\n 111 蔬菜學"},{"id":"蔬菜學-111-四","s":"蔬菜學","y":111,"n":"四","t":"三組比較","body":"<h2>第四題｜三組比較（12 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>三組比較<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C111.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>(1)青花菜花球由分枝花梗及未開放花蕾組成；<\/p>\n<p>花椰菜白花球主要為高度增生、尚未充分分化的花序分生組織及肉質花梗。<\/p>\n<p>(2)蘿蔔食用部由下胚軸與主根不同程度肥大，品種比例不同；<\/p>\n<p>胡蘿蔔為肥大主根，貯藏薄壁組織中次生韌皮部發達，內有木質部心柱。<\/p>\n<p>(3)牛番茄一般果大、多心室、供鮮食切片；<\/p>\n<p>黑柿番茄為臺灣常見鮮食類群，成熟果肩易留綠黑色、具特定風味，並非所有果肉皆黑或單一國際品種。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>器官來源比外觀名稱更可靠<\/strong><\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<p><strong>不同分類軸不能混用<\/strong><\/p>\n<p>花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。<\/p>\n<p><strong>名稱與例子要一對一<\/strong><\/p>\n<p>寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>花球不是單一大花；<\/p>\n<p>根菜也可能含下胚軸成分。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>(1)青花菜花球由分枝花梗及未開放花蕾組成；<\/p>\n<p>花椰菜白花球主要為高度增生、尚未充分分化的花序分生組織及肉質花梗。<\/p>\n<p>(2)蘿蔔食用部由下胚軸與主根不同程度肥大，品種比例不同；<\/p>\n<p>胡蘿蔔為肥大主根，貯藏薄壁組織中次生韌皮部發達，內有木質部心柱。<\/p>\n<p>(3)牛番茄一般果大、多心室、供鮮食切片；<\/p>\n<p>黑柿番茄為臺灣常見鮮食類群，成熟果肩易留綠黑色、具特定風味，並非所有果肉皆 <h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>雜交與分子標誌輔助育種<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C111.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>傳統雜交：訂目標、選親本、雜交、培育分離世代、自交／回交與田間選拔，最後多地試驗及品種化。MAS：先確認與目標基因緊密連鎖或功能性標誌，再於後代取樣 DNA、分型選出帶目標等位基因者，配合背景選拔、基因聚合及田間驗證。傳統方法成本較低、能整體評估農藝性狀，但慢、受環境與表現時期限制；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>標誌提供基因型線索<\/strong><\/p>\n<p>分子標誌是可檢測的 DNA 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 MAS 與基因轉殖的操作與法規概念不同。<\/p>\n<p><strong>連鎖不等於永遠不分離<\/strong><\/p>\n<p>若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。<\/p>\n<p><strong>回交可兼顧前景與背景選拔<\/strong><\/p>\n<p>前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。MAS 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。<\/p>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>MAS 通常是協助雜交選拔的工具，並非與雜交互斥，也不等於基因轉殖。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>傳統雜交：訂目標、選親本、雜交、培育分離世代、自交／回交與田間選拔，最後多地試驗及品種化。MAS：先確認與目標基因緊密連鎖或功能性標誌，再於後代取樣 DNA、分型選出帶目標等位基因者，配合背景選拔、基因聚合及田間驗證。傳統方法成本較低、能整體評估農藝性狀，但慢、受環境與表現時期限制；<\/p>\n<p>MAS 可幼苗早選、不受性狀表現環境直接限制，利隱性基因與多基因聚合，但需有效標誌、設備成本，重組與族群差異可能降低準確性，複雜性狀仍需田間試驗。<\/p>\n<p>分子標誌是可檢測的 DNA 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 MAS 與基因轉殖的操作與法規概念不同。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。<\/p>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：兩流程、優缺、MAS 為輔助非取代雜交、田間驗證。<\/p>\n<ul>\n<li><strong>兩流程<\/strong><\/li>\n<li><strong>MAS 為輔助非取代雜交<\/strong><\/li>\n<li><strong>田間驗證<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把分子標誌說成施用後使植物產生抗性的藥劑。<\/li>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<\/ul>","source":"../../C111.pdf#page=2","md":"111年蔬菜學_逐題教學詳解.md","search":"雜交與分子標誌輔助育種 ## 第五題｜雜交與分子標誌輔助育種（20 分）\n\n### 題意與作答範圍\n\n本題重點：**雜交與分子標誌輔助育種**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c111.pdf#page=2)。\n\n### 先掌握答案\n\n傳統雜交：訂目標、選親本、雜交、培育分離世代、自交／回交與田間選拔，最後多地試驗及品種化。mas：先確認與目標基因緊密連鎖或功能性標誌，再於後代取樣 dna、分型選出帶目標等位基因者，配合背景選拔、基因聚合及田間驗證。傳統方法成本較低、能整體評估農藝性狀，但慢、受環境與表現時期限制；\n\n### 原理拆解：為什麼會這樣？\n\n**標誌提供基因型線索**\n\n分子標誌是可檢測的 dna 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 mas 與基因轉殖的操作與法規概念不同。\n\n**連鎖不等於永遠不分離**\n\n若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。\n\n**回交可兼顧前景與背景選拔**\n\n前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。mas 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n### 這題要特別注意\n\nmas 通常是協助雜交選拔的工具，並非與雜交互斥，也不等於基因轉殖。\n\n### 可直接練寫的完整答案\n\n傳統雜交：訂目標、選親本、雜交、培育分離世代、自交／回交與田間選拔，最後多地試驗及品種化。mas：先確認與目標基因緊密連鎖或功能性標誌，再於後代取樣 dna、分型選出帶目標等位基因者，配合背景選拔、基因聚合及田間驗證。傳統方法成本較低、能整體評估農藝性狀，但慢、受環境與表現時期限制；\n\nmas 可幼苗早選、不受性狀表現環境直接限制，利隱性基因與多基因聚合，但需有效標誌、設備成本，重組與族群差異可能降低準確性，複雜性狀仍需田間試驗。\n\n分子標誌是可檢測的 dna 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 mas 與基因轉殖的操作與法規概念不同。\n\n### 實例：把原理用在情境中\n\n抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：兩流程、優缺、mas 為輔助非取代雜交、田間驗證。\n\n- **兩流程**\n- **mas 為輔助非取代雜交**\n- **田間驗證**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把分子標誌說成施用後使植物產生抗性的藥劑。\n- 把轉入基因成功直接等同育成可商業化品種。\n 111 蔬菜學"},{"id":"蔬菜學-111-六","s":"蔬菜學","y":111,"n":"六","t":"英文翻譯","body":"<h2>第六題｜英文翻譯（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>英文翻譯<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C111.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。<\/p>\n<h3>完整參考譯文<\/h3>\n<p>在可控制環境中進行農業生產愈來愈可行，也可能在向不斷成長的都市中心提供營養及多樣選擇方面扮演重要角色。室內農業通常仍依賴既有品種，也就是為露地條件選拔及培育的植物。在露地，表型穩定性極為重要，因為生產必須在不可預測且持續變動的環境中維持一致。<\/p>\n<p>然而，可控制環境使育種能著重於不同的優先目標，因為環境變動、害蟲、病原與採後品質已較不構成難以克服的生產障礙。相對地，針對可控制環境育種，會把重點轉向另一組植物性狀，例如快速生長、弱光環境下的表現，以及主動調控株型。在這種情況下，可讓植物品種以最適大小生長，使研究得以關注風味或有益健康成分累積等消費者性狀。<\/p>\n<p>基因編輯可能成為為可控制環境打造設計型植物的核心技術。<\/p>\n<h3>讀懂這段研究在說什麼<\/h3>\n<p><strong>室內環境改變育種選拔的目標<\/strong><\/p>\n<p>露地需面對多變天候，既有品種因此強調廣泛穩定；室內可控制環境，使某些原本不適合露地的性狀組合更有利用空間。文意不是所有舊品種都不能室內栽培，而是應重新考慮株型、生長速率、光反應與品質等目標。legacy 不能譯成遺傳工程品種。<\/p>\n<h3>專業詞彙與翻譯辨析<\/h3>\n<table>\n<thead>\n<tr>\n<th>英文用語<\/th>\n<th>建議譯法<\/th>\n<th>讀法與限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>legacy varieties<\/td>\n<td>既有品種<\/td>\n<td>原為既有栽培系統選育的品種<\/td>\n<\/tr>\n<tr>\n<td>plant stature<\/td>\n<td>株型<\/td>\n<td>植株高度或形態，非產量<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>容易譯錯的地方<\/h3>\n<p>legacy varieties 指沿用的既有品種；plant stature 為株型／植株高度，不是產量。<\/p>\n<h3>配分重點與檢查順序<\/h3>\n<p>10 分：完整翻譯，legacy、phenotypic stability、stature、gene editing 準確。<\/p>\n<p>先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。<\/p>\n<h3>常見失分<\/h3>\n<ul>\n<li>把專業名詞按一般字義翻譯，或把相關性改成因果。<\/li>\n<li>省略轉折、條件或限制，使研究結論比原文更強。<\/li>\n<li>以摘要取代全文翻譯。<\/li>\n<\/ul>","source":"../../C111.pdf#page=2","md":"111年蔬菜學_逐題教學詳解.md","search":"英文翻譯 ## 第六題｜英文翻譯（10 分）\n\n### 題意與作答範圍\n\n本題重點：**英文翻譯**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c111.pdf#page=2)。\n\n### 先掌握答案\n\n這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。\n\n### 完整參考譯文\n\n在可控制環境中進行農業生產愈來愈可行，也可能在向不斷成長的都市中心提供營養及多樣選擇方面扮演重要角色。室內農業通常仍依賴既有品種，也就是為露地條件選拔及培育的植物。在露地，表型穩定性極為重要，因為生產必須在不可預測且持續變動的環境中維持一致。\n\n然而，可控制環境使育種能著重於不同的優先目標，因為環境變動、害蟲、病原與採後品質已較不構成難以克服的生產障礙。相對地，針對可控制環境育種，會把重點轉向另一組植物性狀，例如快速生長、弱光環境下的表現，以及主動調控株型。在這種情況下，可讓植物品種以最適大小生長，使研究得以關注風味或有益健康成分累積等消費者性狀。\n\n基因編輯可能成為為可控制環境打造設計型植物的核心技術。\n\n### 讀懂這段研究在說什麼\n\n**室內環境改變育種選拔的目標**\n\n露地需面對多變天候，既有品種因此強調廣泛穩定；室內可控制環境，使某些原本不適合露地的性狀組合更有利用空間。文意不是所有舊品種都不能室內栽培，而是應重新考慮株型、生長速率、光反應與品質等目標。legacy 不能譯成遺傳工程品種。\n\n### 專業詞彙與翻譯辨析\n\n| 英文用語 | 建議譯法 | 讀法與限制 |\n| --- | --- | --- |\n| legacy varieties | 既有品種 | 原為既有栽培系統選育的品種 |\n| plant stature | 株型 | 植株高度或形態，非產量 |\n\n### 容易譯錯的地方\n\nlegacy varieties 指沿用的既有品種；plant stature 為株型／植株高度，不是產量。\n\n### 配分重點與檢查順序\n\n10 分：完整翻譯，legacy、phenotypic stability、stature、gene editing 準確。\n\n先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。\n\n### 常見失分\n\n- 把專業名詞按一般字義翻譯，或把相關性改成因果。\n- 省略轉折、條件或限制，使研究結論比原文更強。\n- 以摘要取代全文翻譯。\n 111 蔬菜學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
