ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 8 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"果樹學-104-一","s":"果樹學","y":104,"n":"一","t":"五名詞","body":"<h2>第一題｜五名詞（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=7\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Pomology 果樹學；<\/p>\n<p>compound fruits 複合果，廣義指多個子房形成的果實單位，應再分單花多子房的聚合果與多花果；<\/p>\n<p>adventitious embryony 不定胚生殖，如珠心／珠被體細胞形成胚；<\/p>\n<p>bud sports 芽變，如果色突變枝；<\/p>\n<p>cleistogamy 閉花授粉，花不開放即自花授粉。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>器官來源比外觀名稱更可靠<\/strong><\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<p><strong>不同分類軸不能混用<\/strong><\/p>\n<p>花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。<\/p>\n<p><strong>名稱與例子要一對一<\/strong><\/p>\n<p>寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。<\/p>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>compound fruits 複合果，廣義指多個子房形成的果實單位，應再分單花多子房的聚合果與多花果；<\/td>\n<td>分類時先看一花或多花，再看子房個數及附屬組織，避免把聚合果、多花果與假果混為一類。 通常發育成果實的核心組織；附屬花部也可參與形成可食部。<\/td>\n<\/tr>\n<tr>\n<td>adventitious embryony 不定胚生殖，如珠心／珠被體細胞形成胚；<\/td>\n<td>胚來自胚囊以外的體細胞組織，與正常受精產生的合子胚不同。<\/td>\n<\/tr>\n<tr>\n<td>bud sports 芽變，如果色突變枝；<\/td>\n<td>突變起於芽或枝條的體細胞，若表現優良可無性繁殖保留，但須留意嵌合與穩定性。<\/td>\n<\/tr>\n<tr>\n<td>cleistogamy 閉花授粉，花不開放即自花授粉。<\/td>\n<td>是花朵未開時即完成授粉；是否自交及其遺傳結果仍須依該植物生殖機制說明。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Pomology 果樹學；<\/p>\n<p>compound fruits 複合果，廣義指多個子房形成的果實單位，應再分單花多子房的聚合果與多花果；<\/p>\n<p>adventitious embryony 不定胚生殖，如珠心／珠被體細胞形成胚；<\/p>\n<p>bud sports 芽變，如果色突變枝；<\/p>\n<p>cleistogamy 閉花授粉，花不開放即自花授粉。<\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。<\/p>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：每名詞約 3 分，定義與例子，不把聚合果、多花果混用。<\/p>\n<ul>\n<li><strong>每名詞約 3 分，定義與例子，不把聚合果<\/strong><\/li>\n<li><strong>多花果混用<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>看到地下器官就全部寫成根。<\/li>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=7","md":"104年果樹學_逐題教學詳解.md","search":"五名詞 ## 第一題｜五名詞（15 分）\n\n### 題意與作答範圍\n\n本題重點：**五名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=7)。\n\n### 先掌握答案\n\npomology 果樹學；\n\ncompound fruits 複合果，廣義指多個子房形成的果實單位，應再分單花多子房的聚合果與多花果；\n\nadventitious embryony 不定胚生殖，如珠心／珠被體細胞形成胚；\n\nbud sports 芽變，如果色突變枝；\n\ncleistogamy 閉花授粉，花不開放即自花授粉。\n\n### 原理拆解：為什麼會這樣？\n\n**器官來源比外觀名稱更可靠**\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n**不同分類軸不能混用**\n\n花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。\n\n**名稱與例子要一對一**\n\n寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| compound fruits 複合果，廣義指多個子房形成的果實單位，應再分單花多子房的聚合果與多花果； | 分類時先看一花或多花，再看子房個數及附屬組織，避免把聚合果、多花果與假果混為一類。 通常發育成果實的核心組織；附屬花部也可參與形成可食部。 |\n| adventitious embryony 不定胚生殖，如珠心／珠被體細胞形成胚； | 胚來自胚囊以外的體細胞組織，與正常受精產生的合子胚不同。 |\n| bud sports 芽變，如果色突變枝； | 突變起於芽或枝條的體細胞，若表現優良可無性繁殖保留，但須留意嵌合與穩定性。 |\n| cleistogamy 閉花授粉，花不開放即自花授粉。 | 是花朵未開時即完成授粉；是否自交及其遺傳結果仍須依該植物生殖機制說明。 |\n\n### 可直接練寫的完整答案\n\npomology 果樹學；\n\ncompound fruits 複合果，廣義指多個子房形成的果實單位，應再分單花多子房的聚合果與多花果；\n\nadventitious embryony 不定胚生殖，如珠心／珠被體細胞形成胚；\n\nbud sports 芽變，如果色突變枝；\n\ncleistogamy 閉花授粉，花不開放即自花授粉。\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n### 實例：把原理用在情境中\n\n馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：每名詞約 3 分，定義與例子，不把聚合果、多花果混用。\n\n- **每名詞約 3 分，定義與例子，不把聚合果**\n- **多花果混用**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 看到地下器官就全部寫成根。\n- 把無性繁殖與無病毒畫上等號。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 104 果樹學"},{"id":"果樹學-104-二","s":"果樹學","y":104,"n":"二","t":"巨峰一年二收","body":"<h2>第二題｜巨峰一年二收（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>巨峰一年二收<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=7\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>第一期冬剪後新梢萌芽開花，夏季採收；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先辨識限制產期的生理關卡<\/strong><\/p>\n<p>產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。<\/p>\n<p><strong>處理須在可反應的階段<\/strong><\/p>\n<p>同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。<\/p>\n<p><strong>移動花期之後仍有生產風險<\/strong><\/p>\n<p>非自然盛產期可能遇不利授粉、低光、高溫或病蟲，果實品質與產量不保證同步提高。完整答案應包含後續授粉、負載與採收安排，以及是否能以售價補償成本。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>第一期冬剪後新梢萌芽開花，夏季採收；<\/p>\n<p>採後維持健康葉片與肥水，培養第二期結果母枝，再於適期夏剪與整齊萌芽，形成冬季第二期果。每期均需疏梢、穗形整理與負載調節，第二期避免枝條未熟及秋冬熱量不足。<\/p>\n<p>產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。<\/p>\n<p>同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>紅龍果適當品種可利用夜間照光調節開花，但仍須評估夜溫、花粉與授粉作業；有花並不等於必能達到預期果重與採收量。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：兩次修剪與兩次收穫順序、花芽基礎、採後養樹及負載。<\/p>\n<ul>\n<li><strong>兩次修剪與兩次收穫順序<\/strong><\/li>\n<li><strong>花芽基礎<\/strong><\/li>\n<li><strong>採後養樹及負載<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將所有產調都解釋成解除休眠。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=7","md":"104年果樹學_逐題教學詳解.md","search":"巨峰一年二收 ## 第二題｜巨峰一年二收（10 分）\n\n### 題意與作答範圍\n\n本題重點：**巨峰一年二收**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=7)。\n\n### 先掌握答案\n\n第一期冬剪後新梢萌芽開花，夏季採收；\n\n### 原理拆解：為什麼會這樣？\n\n**先辨識限制產期的生理關卡**\n\n產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。\n\n**處理須在可反應的階段**\n\n同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。\n\n**移動花期之後仍有生產風險**\n\n非自然盛產期可能遇不利授粉、低光、高溫或病蟲，果實品質與產量不保證同步提高。完整答案應包含後續授粉、負載與採收安排，以及是否能以售價補償成本。\n\n### 可直接練寫的完整答案\n\n第一期冬剪後新梢萌芽開花，夏季採收；\n\n採後維持健康葉片與肥水，培養第二期結果母枝，再於適期夏剪與整齊萌芽，形成冬季第二期果。每期均需疏梢、穗形整理與負載調節，第二期避免枝條未熟及秋冬熱量不足。\n\n產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。\n\n同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。\n\n### 實例：把原理用在情境中\n\n紅龍果適當品種可利用夜間照光調節開花，但仍須評估夜溫、花粉與授粉作業；有花並不等於必能達到預期果重與採收量。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：兩次修剪與兩次收穫順序、花芽基礎、採後養樹及負載。\n\n- **兩次修剪與兩次收穫順序**\n- **花芽基礎**\n- **採後養樹及負載**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將所有產調都解釋成解除休眠。\n 104 果樹學"},{"id":"果樹學-104-三","s":"果樹學","y":104,"n":"三","t":"RDI 應用","body":"<h2>第三題｜RDI 應用（13 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>RDI 應用<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=7\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>依果樹生育期與缺水敏感度，選對產量影響較小或可改善品質階段限灌，用於節水、控梢或提高糖度，之後恢復適量供水。須明確設定限灌程度及補水門檻，不能把終年乾旱稱 RDI。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>RDI 的核心是選期與可控制<\/strong><\/p>\n<p>調節性限制灌溉不是隨意少澆水，而是依發育階段對缺水敏感度不同，刻意在較可容忍階段降低供水，並設定監測及補水門檻。成功指標應同時看節水、產量、果徑、品質和下一期樹勢。<\/p>\n<p><strong>為何輕度缺水可能有利<\/strong><\/p>\n<p>細胞擴張對膨壓降低較敏感，常早於嚴重光合下降而受抑。輕度限灌因此可能減少徒長和果實水分稀釋，配合滲透調節改變溶質濃度。但糖度是濃度，糖度上升不一定代表每果糖總量增加。<\/p>\n<p><strong>文旦如何選階段<\/strong><\/p>\n<p>花期、幼果與快速膨大期缺水容易影響著果、細胞生長及果重；膨大已趨緩的採前成熟階段，才較適合評估限灌。須合併雨量、土壤、根深、負載與水勢監測，若葉片持續失水、落葉或光合受重損，就已超出改善品質的合理範圍。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>依果樹生育期與缺水敏感度，選對產量影響較小或可改善品質階段限灌，用於節水、控梢或提高糖度，之後恢復適量供水。須明確設定限灌程度及補水門檻，不能把終年乾旱稱 RDI。<\/p>\n<p>調節性限制灌溉不是隨意少澆水，而是依發育階段對缺水敏感度不同，刻意在較可容忍階段降低供水，並設定監測及補水門檻。成功指標應同時看節水、產量、果徑、品質和下一期樹勢。<\/p>\n<p>細胞擴張對膨壓降低較敏感，常早於嚴重光合下降而受抑。輕度限灌因此可能減少徒長和果實水分稀釋，配合滲透調節改變溶質濃度。但糖度是濃度，糖度上升不一定代表每果糖總量增加。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>可比較充分灌溉與採前適度限灌的果實糖度、果重、汁率及單果糖量。若只有糖度較高而果重、汁率明顯下降，便不能直接宣稱總品質與收益皆改善。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>13 分：定義、選期、機制、監測及避免過度缺水。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>不管生育期一律斷水。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=7","md":"104年果樹學_逐題教學詳解.md","search":"rdi 應用 ## 第三題｜rdi 應用（13 分）\n\n### 題意與作答範圍\n\n本題重點：**rdi 應用**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=7)。\n\n### 先掌握答案\n\n依果樹生育期與缺水敏感度，選對產量影響較小或可改善品質階段限灌，用於節水、控梢或提高糖度，之後恢復適量供水。須明確設定限灌程度及補水門檻，不能把終年乾旱稱 rdi。\n\n### 原理拆解：為什麼會這樣？\n\n**rdi 的核心是選期與可控制**\n\n調節性限制灌溉不是隨意少澆水，而是依發育階段對缺水敏感度不同，刻意在較可容忍階段降低供水，並設定監測及補水門檻。成功指標應同時看節水、產量、果徑、品質和下一期樹勢。\n\n**為何輕度缺水可能有利**\n\n細胞擴張對膨壓降低較敏感，常早於嚴重光合下降而受抑。輕度限灌因此可能減少徒長和果實水分稀釋，配合滲透調節改變溶質濃度。但糖度是濃度，糖度上升不一定代表每果糖總量增加。\n\n**文旦如何選階段**\n\n花期、幼果與快速膨大期缺水容易影響著果、細胞生長及果重；膨大已趨緩的採前成熟階段，才較適合評估限灌。須合併雨量、土壤、根深、負載與水勢監測，若葉片持續失水、落葉或光合受重損，就已超出改善品質的合理範圍。\n\n### 可直接練寫的完整答案\n\n依果樹生育期與缺水敏感度，選對產量影響較小或可改善品質階段限灌，用於節水、控梢或提高糖度，之後恢復適量供水。須明確設定限灌程度及補水門檻，不能把終年乾旱稱 rdi。\n\n調節性限制灌溉不是隨意少澆水，而是依發育階段對缺水敏感度不同，刻意在較可容忍階段降低供水，並設定監測及補水門檻。成功指標應同時看節水、產量、果徑、品質和下一期樹勢。\n\n細胞擴張對膨壓降低較敏感，常早於嚴重光合下降而受抑。輕度限灌因此可能減少徒長和果實水分稀釋，配合滲透調節改變溶質濃度。但糖度是濃度，糖度上升不一定代表每果糖總量增加。\n\n### 實例：把原理用在情境中\n\n可比較充分灌溉與採前適度限灌的果實糖度、果重、汁率及單果糖量。若只有糖度較高而果重、汁率明顯下降，便不能直接宣稱總品質與收益皆改善。\n\n### 配分重點：哪些內容不能漏？\n\n13 分：定義、選期、機制、監測及避免過度缺水。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 不管生育期一律斷水。\n 104 果樹學"},{"id":"果樹學-104-四","s":"果樹學","y":104,"n":"四","t":"四果樹低地產調","body":"<h2>第四題｜四果樹低地產調（12 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>四果樹低地產調<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=7\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>鳳梨釋迦藉修剪、摘葉使腋芽萌發開花，調整夏冬果並人工授粉；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先辨識限制產期的生理關卡<\/strong><\/p>\n<p>產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。<\/p>\n<p><strong>處理須在可反應的階段<\/strong><\/p>\n<p>同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。<\/p>\n<p><strong>移動花期之後仍有生產風險<\/strong><\/p>\n<p>非自然盛產期可能遇不利授粉、低光、高溫或病蟲，果實品質與產量不保證同步提高。完整答案應包含後續授粉、負載與採收安排，以及是否能以售價補償成本。<\/p>\n<p><strong>用限制來源分類<\/strong><\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p><strong>冬天的冷與春天的暖做不同工作<\/strong><\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<p><strong>技術必須對應真正瓶頸<\/strong><\/p>\n<p>摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>鳳梨釋迦藉修剪、摘葉使腋芽萌發開花，調整夏冬果並人工授粉；<\/p>\n<p>桑椹以修剪及必要休眠管理促整齊萌芽結果；<\/p>\n<p>紅龍果長日反應品種以夜間燈照促非盛產季開花；<\/p>\n<p>高需冷梨在低需冷砧／樹體上高接已完成冷量的花芽穗，利用花芽帶入產區突破低地需冷不足。<\/p>\n<p>產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。<\/p>\n<p>同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>紅龍果適當品種可利用夜間照光調節開花，但仍須評估夜溫、花粉與授粉作業；有花並不等於必能達到預期果重與採收量。<\/p>\n<p>平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>12 分：各 3 分，作物、操作與生理標的。<\/p>\n<ul>\n<li><strong>各 3 分，作物<\/strong><\/li>\n<li><strong>操作與生理標的<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將所有產調都解釋成解除休眠。<\/li>\n<li>把需冷不足與萌芽後霜害混為同一問題。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=7","md":"104年果樹學_逐題教學詳解.md","search":"四果樹低地產調 ## 第四題｜四果樹低地產調（12 分）\n\n### 題意與作答範圍\n\n本題重點：**四果樹低地產調**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=7)。\n\n### 先掌握答案\n\n鳳梨釋迦藉修剪、摘葉使腋芽萌發開花，調整夏冬果並人工授粉；\n\n### 原理拆解：為什麼會這樣？\n\n**先辨識限制產期的生理關卡**\n\n產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。\n\n**處理須在可反應的階段**\n\n同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。\n\n**移動花期之後仍有生產風險**\n\n非自然盛產期可能遇不利授粉、低光、高溫或病蟲，果實品質與產量不保證同步提高。完整答案應包含後續授粉、負載與採收安排，以及是否能以售價補償成本。\n\n**用限制來源分類**\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n**冬天的冷與春天的暖做不同工作**\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n**技術必須對應真正瓶頸**\n\n摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。\n\n### 可直接練寫的完整答案\n\n鳳梨釋迦藉修剪、摘葉使腋芽萌發開花，調整夏冬果並人工授粉；\n\n桑椹以修剪及必要休眠管理促整齊萌芽結果；\n\n紅龍果長日反應品種以夜間燈照促非盛產季開花；\n\n高需冷梨在低需冷砧／樹體上高接已完成冷量的花芽穗，利用花芽帶入產區突破低地需冷不足。\n\n產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。\n\n同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。\n\n### 實例：把原理用在情境中\n\n紅龍果適當品種可利用夜間照光調節開花，但仍須評估夜溫、花粉與授粉作業；有花並不等於必能達到預期果重與採收量。\n\n平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。\n\n### 配分重點：哪些內容不能漏？\n\n12 分：各 3 分，作物、操作與生理標的。\n\n- **各 3 分，作物**\n- **操作與生理標的**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將所有產調都解釋成解除休眠。\n- 把需冷不足與萌芽後霜害混為同一問題。\n 104 果樹學"},{"id":"果樹學-104-五","s":"果樹學","y":104,"n":"五","t":"葉施與根施的運輸","body":"<h2>第五題｜葉施與根施的運輸（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>葉施與根施的運輸<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=7\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>葉面肥經角質層水性微通道、表面裂隙及氣孔相關途徑進入葉內，穿過質外體並跨膜，再依元素可移動性輸往其他器官。根肥先溶於土壤水，經擴散、質流到根表，跨膜進入共質體；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>第一步是分清吸收、運輸與需求<\/strong><\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p><strong>用新老葉位置推理<\/strong><\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<p><strong>最後必須用適當樣本驗證<\/strong><\/p>\n<p>依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>葉面肥經角質層水性微通道、表面裂隙及氣孔相關途徑進入葉內，穿過質外體並跨膜，再依元素可移動性輸往其他器官。根肥先溶於土壤水，經擴散、質流到根表，跨膜進入共質體；<\/p>\n<p>到內皮層凱氏帶須經選擇性膜運輸，最後進木質部隨蒸散向上。葉施適補微量元素與暫時缺乏，不能完全取代大量根肥。<\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：進入障壁、根徑向路徑、木質部與韌皮部、元素移動性及兩法限制。<\/p>\n<ul>\n<li><strong>進入障壁<\/strong><\/li>\n<li><strong>根徑向路徑<\/strong><\/li>\n<li><strong>木質部與韌皮部<\/strong><\/li>\n<li><strong>元素移動性及兩法限制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>只寫缺肥會黃葉，沒有指出葉齡與黃化分布。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=7","md":"104年果樹學_逐題教學詳解.md","search":"葉施與根施的運輸 ## 第五題｜葉施與根施的運輸（15 分）\n\n### 題意與作答範圍\n\n本題重點：**葉施與根施的運輸**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=7)。\n\n### 先掌握答案\n\n葉面肥經角質層水性微通道、表面裂隙及氣孔相關途徑進入葉內，穿過質外體並跨膜，再依元素可移動性輸往其他器官。根肥先溶於土壤水，經擴散、質流到根表，跨膜進入共質體；\n\n### 原理拆解：為什麼會這樣？\n\n**第一步是分清吸收、運輸與需求**\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n**用新老葉位置推理**\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n**最後必須用適當樣本驗證**\n\n依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。\n\n### 可直接練寫的完整答案\n\n葉面肥經角質層水性微通道、表面裂隙及氣孔相關途徑進入葉內，穿過質外體並跨膜，再依元素可移動性輸往其他器官。根肥先溶於土壤水，經擴散、質流到根表，跨膜進入共質體；\n\n到內皮層凱氏帶須經選擇性膜運輸，最後進木質部隨蒸散向上。葉施適補微量元素與暫時缺乏，不能完全取代大量根肥。\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n### 實例：把原理用在情境中\n\n老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：進入障壁、根徑向路徑、木質部與韌皮部、元素移動性及兩法限制。\n\n- **進入障壁**\n- **根徑向路徑**\n- **木質部與韌皮部**\n- **元素移動性及兩法限制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 只寫缺肥會黃葉，沒有指出葉齡與黃化分布。\n 104 果樹學"},{"id":"果樹學-104-六","s":"果樹學","y":104,"n":"六","t":"夏季番石榴低品質","body":"<h2>第六題｜夏季番石榴低品質（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>夏季番石榴低品質<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=7\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>高溫加速生長和呼吸、縮短累糖期，多雨稀釋與根域缺氧，弱光及氮旺長分散同化物，病蟲與軟化也使貯運性下降。應改善排水、調整負載肥水、保葉與病蟲管理，並以產調錯開最不利季節。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先理解水勢與膨壓<\/strong><\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p><strong>由缺水到減產的連鎖<\/strong><\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<p><strong>管理不是只問澆多少<\/strong><\/p>\n<p>應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。<\/p>\n<p><strong>先把源與庫接起來<\/strong><\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<p><strong>壓力流與跨膜運輸不是同一層次<\/strong><\/p>\n<p>源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；H⁺-ATPase 建立電化學梯度，可支援 H⁺／蔗糖共運輸。<\/p>\n<p><strong>庫強決定競爭，不只看果實大小<\/strong><\/p>\n<p>庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>高溫加速生長和呼吸、縮短累糖期，多雨稀釋與根域缺氧，弱光及氮旺長分散同化物，病蟲與軟化也使貯運性下降。應改善排水、調整負載肥水、保葉與病蟲管理，並以產調錯開最不利季節。<\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。<\/p>\n<p>同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：高溫、多雨、光與管理對應。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把有水等同根一定能吸到水。<\/li>\n<li>把長距離糖運輸寫成主要沿木質部。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=7","md":"104年果樹學_逐題教學詳解.md","search":"夏季番石榴低品質 ## 第六題｜夏季番石榴低品質（10 分）\n\n### 題意與作答範圍\n\n本題重點：**夏季番石榴低品質**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=7)。\n\n### 先掌握答案\n\n高溫加速生長和呼吸、縮短累糖期，多雨稀釋與根域缺氧，弱光及氮旺長分散同化物，病蟲與軟化也使貯運性下降。應改善排水、調整負載肥水、保葉與病蟲管理，並以產調錯開最不利季節。\n\n### 原理拆解：為什麼會這樣？\n\n**先理解水勢與膨壓**\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n**由缺水到減產的連鎖**\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n**管理不是只問澆多少**\n\n應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。\n\n**先把源與庫接起來**\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n**壓力流與跨膜運輸不是同一層次**\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n**庫強決定競爭，不只看果實大小**\n\n庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。\n\n### 可直接練寫的完整答案\n\n高溫加速生長和呼吸、縮短累糖期，多雨稀釋與根域缺氧，弱光及氮旺長分散同化物，病蟲與軟化也使貯運性下降。應改善排水、調整負載肥水、保葉與病蟲管理，並以產調錯開最不利季節。\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n### 實例：把原理用在情境中\n\n旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。\n\n同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：高溫、多雨、光與管理對應。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把有水等同根一定能吸到水。\n- 把長距離糖運輸寫成主要沿木質部。\n 104 果樹學"},{"id":"果樹學-104-七","s":"果樹學","y":104,"n":"七","t":"多作物農場預冷設備","body":"<h2>第七題｜多作物農場預冷設備（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>多作物農場預冷設備<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=7\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>葡萄、桃、柑橘、梨、李等多種果實共同包裝場，宜優先評估壓差預冷，通用性高、能處理已包裝產品且少浸水風險。各批按適溫、大小與包裝透氣率分組冷卻，不能用同一終點溫度；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先分清預冷與冷藏<\/strong><\/p>\n<p>採收時產品常接近田間溫度；若只把大量溫熱貨物放進冷庫，外層先冷、箱內與果心仍熱，呼吸及失水會持續。預冷的目標是迅速降低產品溫度，冷藏則是把已降溫的產品維持在適溫，兩者目的與設備負荷不同。<\/p>\n<p><strong>冷得快，必須讓熱有出口<\/strong><\/p>\n<p>壓差預冷靠風扇建立壓差，迫使冷空氣穿過箱孔與產品間隙；箱孔不對齊或氣流短路時，庫溫低也不代表果心降得快。水冷以冷水接觸傳熱，但要控制水質與交叉污染。真空預冷則降低氣壓，使組織水分在低溫蒸發，帶走潛熱。<\/p>\n<p><strong>依器官結構選方法<\/strong><\/p>\n<p>葉菜表面積相對大，真空法常有效；大果實的果心熱須先傳到外層，表皮又限制蒸發，因此真空法可能慢且失重。方法選定後，還須量果心或代表部位溫度，訂冷卻終點，而不是只記處理分鐘。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>葡萄、桃、柑橘、梨、李等多種果實共同包裝場，宜優先評估壓差預冷，通用性高、能處理已包裝產品且少浸水風險。各批按適溫、大小與包裝透氣率分組冷卻，不能用同一終點溫度；<\/p>\n<p>水冷雖快但增加用水衛生和作物相容性要求，真空法對多數大果不夠合適。<\/p>\n<p>採收時產品常接近田間溫度；若只把大量溫熱貨物放進冷庫，外層先冷、箱內與果心仍熱，呼吸及失水會持續。預冷的目標是迅速降低產品溫度，冷藏則是把已降溫的產品維持在適溫，兩者目的與設備負荷不同。<\/p>\n<p>壓差預冷靠風扇建立壓差，迫使冷空氣穿過箱孔與產品間隙；箱孔不對齊或氣流短路時，庫溫低也不代表果心降得快。水冷以冷水接觸傳熱，但要控制水質與交叉污染。真空預冷則降低氣壓，使組織水分在低溫蒸發，帶走潛熱。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>包裝場可將同一箱產品放置多點溫度計，畫降溫曲線，比較箱心與外側。這能檢查通氣孔、堆裝與風量是否合適，也可同時量失重，避免用犧牲水分換取冷卻速度。<\/p>\n<table>\n<thead>\n<tr>\n<th>方法<\/th>\n<th>主要傳熱機制<\/th>\n<th>判斷重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>房冷<\/td>\n<td>自然或一般循環冷空氣<\/td>\n<td>便宜但箱心降溫較慢<\/td>\n<\/tr>\n<tr>\n<td>壓差<\/td>\n<td>強制冷氣穿箱<\/td>\n<td>箱孔與氣流路徑<\/td>\n<\/tr>\n<tr>\n<td>水冷<\/td>\n<td>冷水接觸傳熱<\/td>\n<td>耐水性與水衛生<\/td>\n<\/tr>\n<tr>\n<td>真空<\/td>\n<td>減壓蒸發吸熱<\/td>\n<td>表面積、失水與器官構造<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：選法、作物共通性、比較其他方法、分批溫度與設備效能。<\/p>\n<ul>\n<li><strong>作物共通性<\/strong><\/li>\n<li><strong>比較其他方法<\/strong><\/li>\n<li><strong>分批溫度與設備效能<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把預冷寫成單純放進冰箱，沒有交代移除田間熱。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=7","md":"104年果樹學_逐題教學詳解.md","search":"多作物農場預冷設備 ## 第七題｜多作物農場預冷設備（15 分）\n\n### 題意與作答範圍\n\n本題重點：**多作物農場預冷設備**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=7)。\n\n### 先掌握答案\n\n葡萄、桃、柑橘、梨、李等多種果實共同包裝場，宜優先評估壓差預冷，通用性高、能處理已包裝產品且少浸水風險。各批按適溫、大小與包裝透氣率分組冷卻，不能用同一終點溫度；\n\n### 原理拆解：為什麼會這樣？\n\n**先分清預冷與冷藏**\n\n採收時產品常接近田間溫度；若只把大量溫熱貨物放進冷庫，外層先冷、箱內與果心仍熱，呼吸及失水會持續。預冷的目標是迅速降低產品溫度，冷藏則是把已降溫的產品維持在適溫，兩者目的與設備負荷不同。\n\n**冷得快，必須讓熱有出口**\n\n壓差預冷靠風扇建立壓差，迫使冷空氣穿過箱孔與產品間隙；箱孔不對齊或氣流短路時，庫溫低也不代表果心降得快。水冷以冷水接觸傳熱，但要控制水質與交叉污染。真空預冷則降低氣壓，使組織水分在低溫蒸發，帶走潛熱。\n\n**依器官結構選方法**\n\n葉菜表面積相對大，真空法常有效；大果實的果心熱須先傳到外層，表皮又限制蒸發，因此真空法可能慢且失重。方法選定後，還須量果心或代表部位溫度，訂冷卻終點，而不是只記處理分鐘。\n\n### 可直接練寫的完整答案\n\n葡萄、桃、柑橘、梨、李等多種果實共同包裝場，宜優先評估壓差預冷，通用性高、能處理已包裝產品且少浸水風險。各批按適溫、大小與包裝透氣率分組冷卻，不能用同一終點溫度；\n\n水冷雖快但增加用水衛生和作物相容性要求，真空法對多數大果不夠合適。\n\n採收時產品常接近田間溫度；若只把大量溫熱貨物放進冷庫，外層先冷、箱內與果心仍熱，呼吸及失水會持續。預冷的目標是迅速降低產品溫度，冷藏則是把已降溫的產品維持在適溫，兩者目的與設備負荷不同。\n\n壓差預冷靠風扇建立壓差，迫使冷空氣穿過箱孔與產品間隙；箱孔不對齊或氣流短路時，庫溫低也不代表果心降得快。水冷以冷水接觸傳熱，但要控制水質與交叉污染。真空預冷則降低氣壓，使組織水分在低溫蒸發，帶走潛熱。\n\n### 實例：把原理用在情境中\n\n包裝場可將同一箱產品放置多點溫度計，畫降溫曲線，比較箱心與外側。這能檢查通氣孔、堆裝與風量是否合適，也可同時量失重，避免用犧牲水分換取冷卻速度。\n\n| 方法 | 主要傳熱機制 | 判斷重點 |\n| --- | --- | --- |\n| 房冷 | 自然或一般循環冷空氣 | 便宜但箱心降溫較慢 |\n| 壓差 | 強制冷氣穿箱 | 箱孔與氣流路徑 |\n| 水冷 | 冷水接觸傳熱 | 耐水性與水衛生 |\n| 真空 | 減壓蒸發吸熱 | 表面積、失水與器官構造 |\n\n### 配分重點：哪些內容不能漏？\n\n15 分：選法、作物共通性、比較其他方法、分批溫度與設備效能。\n\n- **作物共通性**\n- **比較其他方法**\n- **分批溫度與設備效能**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把預冷寫成單純放進冰箱，沒有交代移除田間熱。\n 104 果樹學"},{"id":"果樹學-104-八","s":"果樹學","y":104,"n":"八","t":"木瓜海運 24 天","body":"<h2>第八題｜木瓜海運 24 天（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>木瓜海運 24 天<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=7\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>須用生理成熟且有足夠後熟能力的耐運果，採前降低潛伏病害、輕採去乳汁，分級清潔、使用目的國接受的檢疫與病害處理，再預冷與緩衝包裝。依品種及成熟度設定不致寒害的低溫、濕度與氣調，監測通風和乙烯；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>為何採後仍會變差<\/strong><\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p><strong>低溫有效，但有適用範圍<\/strong><\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<p><strong>把全程串起來<\/strong><\/p>\n<p>採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。<\/p>\n<p><strong>成熟反應與乙烯感受<\/strong><\/p>\n<p>乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。<\/p>\n<p><strong>更年性與非更年性要比較反應型態<\/strong><\/p>\n<p>具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。<\/p>\n<p><strong>催熟與延後成熟都不能忽略品質<\/strong><\/p>\n<p>乙烯可整齊催熟已達生理成熟的果，卻不能讓極幼果補足田間累積不足的乾物；1-MCP 阻斷感受可延緩部分產品老化，但過強處理可能影響正常後熟。脫綠、果肉軟化和增甜亦不是必然同步。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>須用生理成熟且有足夠後熟能力的耐運果，採前降低潛伏病害、輕採去乳汁，分級清潔、使用目的國接受的檢疫與病害處理，再預冷與緩衝包裝。依品種及成熟度設定不致寒害的低溫、濕度與氣調，監測通風和乙烯；<\/p>\n<p>24 天還須加上通關與貨架時間，以小批運輸試驗證明到貨能正常後熟。<\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。<\/p>\n<p>香蕉在不當高溫下，果肉可軟化而果皮仍綠，顯示果肉成熟與葉綠素降解可不同步。不能僅看果皮未黃，就判斷乙烯完全沒有作用。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：成熟度、病害與防傷、適溫冷鏈、24 天可行性驗證。<\/p>\n<ul>\n<li><strong>成熟度<\/strong><\/li>\n<li><strong>病害與防傷<\/strong><\/li>\n<li><strong>適溫冷鏈<\/strong><\/li>\n<li><strong>24 天可行性驗證<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>認為溫度越低、保存效果一定越好。<\/li>\n<li>說非更年性果實完全不會回應乙烯。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=7","md":"104年果樹學_逐題教學詳解.md","search":"木瓜海運 24 天 ## 第八題｜木瓜海運 24 天（10 分）\n\n### 題意與作答範圍\n\n本題重點：**木瓜海運 24 天**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=7)。\n\n### 先掌握答案\n\n須用生理成熟且有足夠後熟能力的耐運果，採前降低潛伏病害、輕採去乳汁，分級清潔、使用目的國接受的檢疫與病害處理，再預冷與緩衝包裝。依品種及成熟度設定不致寒害的低溫、濕度與氣調，監測通風和乙烯；\n\n### 原理拆解：為什麼會這樣？\n\n**為何採後仍會變差**\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n**低溫有效，但有適用範圍**\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n**把全程串起來**\n\n採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。\n\n**成熟反應與乙烯感受**\n\n乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。\n\n**更年性與非更年性要比較反應型態**\n\n具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。\n\n**催熟與延後成熟都不能忽略品質**\n\n乙烯可整齊催熟已達生理成熟的果，卻不能讓極幼果補足田間累積不足的乾物；1-mcp 阻斷感受可延緩部分產品老化，但過強處理可能影響正常後熟。脫綠、果肉軟化和增甜亦不是必然同步。\n\n### 可直接練寫的完整答案\n\n須用生理成熟且有足夠後熟能力的耐運果，採前降低潛伏病害、輕採去乳汁，分級清潔、使用目的國接受的檢疫與病害處理，再預冷與緩衝包裝。依品種及成熟度設定不致寒害的低溫、濕度與氣調，監測通風和乙烯；\n\n24 天還須加上通關與貨架時間，以小批運輸試驗證明到貨能正常後熟。\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n### 實例：把原理用在情境中\n\n驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。\n\n香蕉在不當高溫下，果肉可軟化而果皮仍綠，顯示果肉成熟與葉綠素降解可不同步。不能僅看果皮未黃，就判斷乙烯完全沒有作用。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：成熟度、病害與防傷、適溫冷鏈、24 天可行性驗證。\n\n- **成熟度**\n- **病害與防傷**\n- **適溫冷鏈**\n- **24 天可行性驗證**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 認為溫度越低、保存效果一定越好。\n- 說非更年性果實完全不會回應乙烯。\n 104 果樹學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
