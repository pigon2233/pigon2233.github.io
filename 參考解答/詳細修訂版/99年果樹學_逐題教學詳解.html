trong>目視診斷與葉片採樣<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=22\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>先記錄全園分布與發生時間，分新老葉、脈間／葉緣、對稱性、生長點與果實，排除病蟲、藥害及根傷。葉樣應依作物標準固定葉齡、枝位、季節及結果狀態，多株多方位混合成代表樣，症狀與健康對照分開、避受噴肥污染，正確清洗乾燥標示送驗，再配土壤與灌溉水分析。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>第一步是分清吸收、運輸與需求<\/strong><\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p><strong>用新老葉位置推理<\/strong><\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<p><strong>最後必須用適當樣本驗證<\/strong><\/p>\n<p>依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>先記錄全園分布與發生時間，分新老葉、脈間／葉緣、對稱性、生長點與果實，排除病蟲、藥害及根傷。葉樣應依作物標準固定葉齡、枝位、季節及結果狀態，多株多方位混合成代表樣，症狀與健康對照分開、避受噴肥污染，正確清洗乾燥標示送驗，再配土壤與灌溉水分析。<\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：診斷流程、代表性採樣、標準葉位、防污染及佐證。<\/p>\n<ul>\n<li><strong>診斷流程<\/strong><\/li>\n<li><strong>代表性採樣<\/strong><\/li>\n<li><strong>標準葉位<\/strong><\/li>\n<li><strong>防污染及佐證<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>只寫缺肥會黃葉，沒有指出葉齡與黃化分布。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=22","md":"99年果樹學_逐題教學詳解.md","search":"目視診斷與葉片採樣 ## 第一題｜目視診斷與葉片採樣（10 分）\n\n### 題意與作答範圍\n\n本題重點：**目視診斷與葉片採樣**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=22)。\n\n### 先掌握答案\n\n先記錄全園分布與發生時間，分新老葉、脈間／葉緣、對稱性、生長點與果實，排除病蟲、藥害及根傷。葉樣應依作物標準固定葉齡、枝位、季節及結果狀態，多株多方位混合成代表樣，症狀與健康對照分開、避受噴肥污染，正確清洗乾燥標示送驗，再配土壤與灌溉水分析。\n\n### 原理拆解：為什麼會這樣？\n\n**第一步是分清吸收、運輸與需求**\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n**用新老葉位置推理**\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n**最後必須用適當樣本驗證**\n\n依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。\n\n### 可直接練寫的完整答案\n\n先記錄全園分布與發生時間，分新老葉、脈間／葉緣、對稱性、生長點與果實，排除病蟲、藥害及根傷。葉樣應依作物標準固定葉齡、枝位、季節及結果狀態，多株多方位混合成代表樣，症狀與健康對照分開、避受噴肥污染，正確清洗乾燥標示送驗，再配土壤與灌溉水分析。\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n### 實例：把原理用在情境中\n\n老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：診斷流程、代表性採樣、標準葉位、防污染及佐證。\n\n- **診斷流程**\n- **代表性採樣**\n- **標準葉位**\n- **防污染及佐證**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 只寫缺肥會黃葉，沒有指出葉齡與黃化分布。\n 99 果樹學"},{"id":"果樹學-99-二","s":"果樹學","y":99,"n":"二","t":"暖化與溫帶果樹","body":"<h2>第二題｜暖化與溫帶果樹（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>暖化與溫帶果樹<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=22\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>暖冬需冷不足造成萌芽不齊、花質差、花期長與著果不穩；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>用限制來源分類<\/strong><\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p><strong>冬天的冷與春天的暖做不同工作<\/strong><\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<p><strong>技術必須對應真正瓶頸<\/strong><\/p>\n<p>摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。<\/p>\n<p><strong>先區分傷害種類與發生條件<\/strong><\/p>\n<p>乾旱、淹水、高溫、寒害、凍害與鹽害的起始機制不同。寒害可在冰點以上發生於敏感作物，凍害則涉及結冰；淹水即使土壤水多，也可能因缺氧而使根無法正常供水。<\/p>\n<p><strong>從細胞功能連到可見症狀<\/strong><\/p>\n<p>膜性質改變、活性氧增加、酵素與能量代謝受阻，最後表現萎凋、褐化、落花或生長停滯。短期氣孔關閉可節水，長期卻限制 CO₂ 吸收；適應反應與傷害結果應分別說明。<\/p>\n<p><strong>預防與恢復管理各有時機<\/strong><\/p>\n<p>品種與產季選擇、灌排、覆蓋、通風遮陰及適度馴化可降低風險。受害後先評估根與生長點是否存活，再調整水肥；重施肥不能代替環境修復，受傷根系也可能無法利用增加的養分。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>暖冬需冷不足造成萌芽不齊、花質差、花期長與著果不穩；<\/p>\n<p>提早回暖使去耐寒與晚霜風險增加。生長季高溫增加呼吸、日燒，降低部分品種著色與酸度，乾旱與病蟲分布亦變。應選適地低需冷品種、調整產區海拔、肥水保葉及防霜，避免只以「暖化生長更快」解釋。<\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。<\/p>\n<p>熱帶果菜低溫貯藏後可能出現凹陷、褐化與腐敗，而未曾結冰；應檢查該作物安全溫度與累積暴露時間，不能只把冷庫調得更冷。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：生長、成花、授粉著果、品質及適應例。<\/p>\n<ul>\n<li><strong>授粉著果<\/strong><\/li>\n<li><strong>品質及適應例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把需冷不足與萌芽後霜害混為同一問題。<\/li>\n<li>把寒害與凍害當成同義詞。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=22","md":"99年果樹學_逐題教學詳解.md","search":"暖化與溫帶果樹 ## 第二題｜暖化與溫帶果樹（10 分）\n\n### 題意與作答範圍\n\n本題重點：**暖化與溫帶果樹**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=22)。\n\n### 先掌握答案\n\n暖冬需冷不足造成萌芽不齊、花質差、花期長與著果不穩；\n\n### 原理拆解：為什麼會這樣？\n\n**用限制來源分類**\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n**冬天的冷與春天的暖做不同工作**\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n**技術必須對應真正瓶頸**\n\n摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。\n\n**先區分傷害種類與發生條件**\n\n乾旱、淹水、高溫、寒害、凍害與鹽害的起始機制不同。寒害可在冰點以上發生於敏感作物，凍害則涉及結冰；淹水即使土壤水多，也可能因缺氧而使根無法正常供水。\n\n**從細胞功能連到可見症狀**\n\n膜性質改變、活性氧增加、酵素與能量代謝受阻，最後表現萎凋、褐化、落花或生長停滯。短期氣孔關閉可節水，長期卻限制 co₂ 吸收；適應反應與傷害結果應分別說明。\n\n**預防與恢復管理各有時機**\n\n品種與產季選擇、灌排、覆蓋、通風遮陰及適度馴化可降低風險。受害後先評估根與生長點是否存活，再調整水肥；重施肥不能代替環境修復，受傷根系也可能無法利用增加的養分。\n\n### 可直接練寫的完整答案\n\n暖冬需冷不足造成萌芽不齊、花質差、花期長與著果不穩；\n\n提早回暖使去耐寒與晚霜風險增加。生長季高溫增加呼吸、日燒，降低部分品種著色與酸度，乾旱與病蟲分布亦變。應選適地低需冷品種、調整產區海拔、肥水保葉及防霜，避免只以「暖化生長更快」解釋。\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n### 實例：把原理用在情境中\n\n平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。\n\n熱帶果菜低溫貯藏後可能出現凹陷、褐化與腐敗，而未曾結冰；應檢查該作物安全溫度與累積暴露時間，不能只把冷庫調得更冷。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：生長、成花、授粉著果、品質及適應例。\n\n- **授粉著果**\n- **品質及適應例**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把需冷不足與萌芽後霜害混為同一問題。\n- 把寒害與凍害當成同義詞。\n 99 果樹學"},{"id":"果樹學-99-三","s":"果樹學","y":99,"n":"三","t":"五組名詞","body":"<h2>第三題｜五組名詞（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五組名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=22\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Sink／source 庫／源，消耗貯存與淨輸出同化物的器官；<\/p>\n<p>scion／stock 接穗／砧木；<\/p>\n<p>graft incompatibility 嫁接不親和，接合後無法長期正常維管運輸協調生長；<\/p>\n<p>foliar fertilization 葉面施肥；<\/p>\n<p>off-season 非自然盛產季／離季生產，如冬季葡萄。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把源與庫接起來<\/strong><\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<p><strong>壓力流與跨膜運輸不是同一層次<\/strong><\/p>\n<p>源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；H⁺-ATPase 建立電化學梯度，可支援 H⁺／蔗糖共運輸。<\/p>\n<p><strong>庫強決定競爭，不只看果實大小<\/strong><\/p>\n<p>庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。<\/p>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Sink／source 庫／源，消耗貯存與淨輸出同化物的器官；<\/p>\n<p>scion／stock 接穗／砧木；<\/p>\n<p>graft incompatibility 嫁接不親和，接合後無法長期正常維管運輸協調生長；<\/p>\n<p>foliar fertilization 葉面施肥；<\/p>\n<p>off-season 非自然盛產季／離季生產，如冬季葡萄。<\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。<\/p>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：各組雙詞差異與實例。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把長距離糖運輸寫成主要沿木質部。<\/li>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=22","md":"99年果樹學_逐題教學詳解.md","search":"五組名詞 ## 第三題｜五組名詞（10 分）\n\n### 題意與作答範圍\n\n本題重點：**五組名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=22)。\n\n### 先掌握答案\n\nsink／source 庫／源，消耗貯存與淨輸出同化物的器官；\n\nscion／stock 接穗／砧木；\n\ngraft incompatibility 嫁接不親和，接合後無法長期正常維管運輸協調生長；\n\nfoliar fertilization 葉面施肥；\n\noff-season 非自然盛產季／離季生產，如冬季葡萄。\n\n### 原理拆解：為什麼會這樣？\n\n**先把源與庫接起來**\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n**壓力流與跨膜運輸不是同一層次**\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n**庫強決定競爭，不只看果實大小**\n\n庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n### 可直接練寫的完整答案\n\nsink／source 庫／源，消耗貯存與淨輸出同化物的器官；\n\nscion／stock 接穗／砧木；\n\ngraft incompatibility 嫁接不親和，接合後無法長期正常維管運輸協調生長；\n\nfoliar fertilization 葉面施肥；\n\noff-season 非自然盛產季／離季生產，如冬季葡萄。\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n### 實例：把原理用在情境中\n\n同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：各組雙詞差異與實例。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把長距離糖運輸寫成主要沿木質部。\n- 把無性繁殖與無病毒畫上等號。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 99 果樹學"},{"id":"果樹學-99-四","s":"果樹學","y":99,"n":"四","t":"柑橘五障礙","body":"<h2>第四題｜柑橘五障礙（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>柑橘五障礙<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=22\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Puffiness 浮皮，果皮與果肉鬆離；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>為何採後仍會變差<\/strong><\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p><strong>低溫有效，但有適用範圍<\/strong><\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<p><strong>把全程串起來<\/strong><\/p>\n<p>採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Puffiness 浮皮，果皮與果肉鬆離；<\/p>\n<p>deformation 畸形果，發育不均，需查花器、授粉、蟲害或逆境；<\/p>\n<p>granulation 粒化，汁囊變硬、失汁及木質化樣變化；<\/p>\n<p>senescent disorder 老化障礙，如過熟、果皮衰敗及品質下降；<\/p>\n<p>regreening 回綠，已轉黃橙果皮重新形成葉綠素，常與高溫及氮有關。<\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：每項 2 分，症狀準確與可能條件。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>認為溫度越低、保存效果一定越好。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=22","md":"99年果樹學_逐題教學詳解.md","search":"柑橘五障礙 ## 第四題｜柑橘五障礙（10 分）\n\n### 題意與作答範圍\n\n本題重點：**柑橘五障礙**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=22)。\n\n### 先掌握答案\n\npuffiness 浮皮，果皮與果肉鬆離；\n\n### 原理拆解：為什麼會這樣？\n\n**為何採後仍會變差**\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n**低溫有效，但有適用範圍**\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n**把全程串起來**\n\n採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。\n\n### 可直接練寫的完整答案\n\npuffiness 浮皮，果皮與果肉鬆離；\n\ndeformation 畸形果，發育不均，需查花器、授粉、蟲害或逆境；\n\ngranulation 粒化，汁囊變硬、失汁及木質化樣變化；\n\nsenescent disorder 老化障礙，如過熟、果皮衰敗及品質下降；\n\nregreening 回綠，已轉黃橙果皮重新形成葉綠素，常與高溫及氮有關。\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n### 實例：把原理用在情境中\n\n驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：每項 2 分，症狀準確與可能條件。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 認為溫度越低、保存效果一定越好。\n 99 果樹學"},{"id":"果樹學-99-五","s":"果樹學","y":99,"n":"五","t":"香蕉 green life","body":"<h2>第五題｜香蕉 green life（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>香蕉 green life<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=22\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>綠熟壽命受採收成熟度、品種、田間溫度、果實病傷、貯運溫度、乙烯暴露及氣體環境影響。成熟度可用果指飽滿、稜角消退、果徑、開花後天數／積溫綜合判斷；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>成熟反應與乙烯感受<\/strong><\/p>\n<p>乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。<\/p>\n<p><strong>更年性與非更年性要比較反應型態<\/strong><\/p>\n<p>具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。<\/p>\n<p><strong>催熟與延後成熟都不能忽略品質<\/strong><\/p>\n<p>乙烯可整齊催熟已達生理成熟的果，卻不能讓極幼果補足田間累積不足的乾物；1-MCP 阻斷感受可延緩部分產品老化，但過強處理可能影響正常後熟。脫綠、果肉軟化和增甜亦不是必然同步。<\/p>\n<p><strong>為何採後仍會變差<\/strong><\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p><strong>低溫有效，但有適用範圍<\/strong><\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<p><strong>把全程串起來<\/strong><\/p>\n<p>採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>綠熟壽命受採收成熟度、品種、田間溫度、果實病傷、貯運溫度、乙烯暴露及氣體環境影響。成熟度可用果指飽滿、稜角消退、果徑、開花後天數／積溫綜合判斷；<\/p>\n<p>愈成熟通常綠熟期愈短，過嫩則後熟差。<\/p>\n<p>乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。<\/p>\n<p>具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>香蕉在不當高溫下，果肉可軟化而果皮仍綠，顯示果肉成熟與葉綠素降解可不同步。不能僅看果皮未黃，就判斷乙烯完全沒有作用。<\/p>\n<p>驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：影響因子、具體成熟指標、長途運輸取捨。<\/p>\n<ul>\n<li><strong>影響因子<\/strong><\/li>\n<li><strong>具體成熟指標<\/strong><\/li>\n<li><strong>長途運輸取捨<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>說非更年性果實完全不會回應乙烯。<\/li>\n<li>認為溫度越低、保存效果一定越好。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=22","md":"99年果樹學_逐題教學詳解.md","search":"香蕉 green life ## 第五題｜香蕉 green life（10 分）\n\n### 題意與作答範圍\n\n本題重點：**香蕉 green life**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=22)。\n\n### 先掌握答案\n\n綠熟壽命受採收成熟度、品種、田間溫度、果實病傷、貯運溫度、乙烯暴露及氣體環境影響。成熟度可用果指飽滿、稜角消退、果徑、開花後天數／積溫綜合判斷；\n\n### 原理拆解：為什麼會這樣？\n\n**成熟反應與乙烯感受**\n\n乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。\n\n**更年性與非更年性要比較反應型態**\n\n具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。\n\n**催熟與延後成熟都不能忽略品質**\n\n乙烯可整齊催熟已達生理成熟的果，卻不能讓極幼果補足田間累積不足的乾物；1-mcp 阻斷感受可延緩部分產品老化，但過強處理可能影響正常後熟。脫綠、果肉軟化和增甜亦不是必然同步。\n\n**為何採後仍會變差**\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n**低溫有效，但有適用範圍**\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n**把全程串起來**\n\n採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。\n\n### 可直接練寫的完整答案\n\n綠熟壽命受採收成熟度、品種、田間溫度、果實病傷、貯運溫度、乙烯暴露及氣體環境影響。成熟度可用果指飽滿、稜角消退、果徑、開花後天數／積溫綜合判斷；\n\n愈成熟通常綠熟期愈短，過嫩則後熟差。\n\n乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。\n\n具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。\n\n### 實例：把原理用在情境中\n\n香蕉在不當高溫下，果肉可軟化而果皮仍綠，顯示果肉成熟與葉綠素降解可不同步。不能僅看果皮未黃，就判斷乙烯完全沒有作用。\n\n驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：影響因子、具體成熟指標、長途運輸取捨。\n\n- **影響因子**\n- **具體成熟指標**\n- **長途運輸取捨**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 說非更年性果實完全不會回應乙烯。\n- 認為溫度越低、保存效果一定越好。\n 99 果樹學"},{"id":"果樹學-99-六","s":"果樹學","y":99,"n":"六","t":"VPD 與失水","body":"<h2>第六題｜VPD 與失水（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>VPD 與失水<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=22\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>蒸氣壓差是產品表面近飽和水氣壓與周遭空氣實際水氣壓之差，常在同溫下以飽和水氣壓減實際水氣壓表示。VPD 越大，水分逸散驅動力越大；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先理解水勢與膨壓<\/strong><\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p><strong>由缺水到減產的連鎖<\/strong><\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<p><strong>管理不是只問澆多少<\/strong><\/p>\n<p>應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>蒸氣壓差是產品表面近飽和水氣壓與周遭空氣實際水氣壓之差，常在同溫下以飽和水氣壓減實際水氣壓表示。VPD 越大，水分逸散驅動力越大；<\/p>\n<p>高溫、低相對濕度及強氣流常促失水。降果溫、提高合理濕度及包裝可減失水，但應避凝水與腐敗。<\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：定義、梯度、溫濕度與包裝例。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把有水等同根一定能吸到水。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=22","md":"99年果樹學_逐題教學詳解.md","search":"vpd 與失水 ## 第六題｜vpd 與失水（10 分）\n\n### 題意與作答範圍\n\n本題重點：**vpd 與失水**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=22)。\n\n### 先掌握答案\n\n蒸氣壓差是產品表面近飽和水氣壓與周遭空氣實際水氣壓之差，常在同溫下以飽和水氣壓減實際水氣壓表示。vpd 越大，水分逸散驅動力越大；\n\n### 原理拆解：為什麼會這樣？\n\n**先理解水勢與膨壓**\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n**由缺水到減產的連鎖**\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n**管理不是只問澆多少**\n\n應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。\n\n### 可直接練寫的完整答案\n\n蒸氣壓差是產品表面近飽和水氣壓與周遭空氣實際水氣壓之差，常在同溫下以飽和水氣壓減實際水氣壓表示。vpd 越大，水分逸散驅動力越大；\n\n高溫、低相對濕度及強氣流常促失水。降果溫、提高合理濕度及包裝可減失水，但應避凝水與腐敗。\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n### 實例：把原理用在情境中\n\n旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：定義、梯度、溫濕度與包裝例。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把有水等同根一定能吸到水。\n 99 果樹學"},{"id":"果樹學-99-七","s":"果樹學","y":99,"n":"七","t":"傳統育種與生技","body":"<h2>第七題｜傳統育種與生技（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>傳統育種與生技<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=22\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>傳統果樹育種受長世代、雜合、不親和及土地成本限制；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<p><strong>標誌提供基因型線索<\/strong><\/p>\n<p>分子標誌是可檢測的 DNA 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 MAS 與基因轉殖的操作與法規概念不同。<\/p>\n<p><strong>連鎖不等於永遠不分離<\/strong><\/p>\n<p>若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。<\/p>\n<p><strong>回交可兼顧前景與背景選拔<\/strong><\/p>\n<p>前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。MAS 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>傳統果樹育種受長世代、雜合、不親和及土地成本限制；<\/p>\n<p>可利用組培健康量繁、胚救援克服遠緣或無子材料障礙、倍數性育種與 DNA 標誌早選，基因轉殖／編輯可改特定性狀但仍須再生系統、法規及消費接受。所有新材料都應驗證穩定性、產量與品質。<\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<p>抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：困難、生技逐項對應與限制。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<li>把分子標誌說成施用後使植物產生抗性的藥劑。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=22","md":"99年果樹學_逐題教學詳解.md","search":"傳統育種與生技 ## 第七題｜傳統育種與生技（10 分）\n\n### 題意與作答範圍\n\n本題重點：**傳統育種與生技**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=22)。\n\n### 先掌握答案\n\n傳統果樹育種受長世代、雜合、不親和及土地成本限制；\n\n### 原理拆解：為什麼會這樣？\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n**標誌提供基因型線索**\n\n分子標誌是可檢測的 dna 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 mas 與基因轉殖的操作與法規概念不同。\n\n**連鎖不等於永遠不分離**\n\n若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。\n\n**回交可兼顧前景與背景選拔**\n\n前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。mas 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。\n\n### 可直接練寫的完整答案\n\n傳統果樹育種受長世代、雜合、不親和及土地成本限制；\n\n可利用組培健康量繁、胚救援克服遠緣或無子材料障礙、倍數性育種與 dna 標誌早選，基因轉殖／編輯可改特定性狀但仍須再生系統、法規及消費接受。所有新材料都應驗證穩定性、產量與品質。\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n### 實例：把原理用在情境中\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：困難、生技逐項對應與限制。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把轉入基因成功直接等同育成可商業化品種。\n- 把分子標誌說成施用後使植物產生抗性的藥劑。\n 99 果樹學"},{"id":"果樹學-99-八","s":"果樹學","y":99,"n":"八","t":"整合性果實生產 IFP","body":"<h2>第八題｜整合性果實生產 IFP（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>整合性果實生產 IFP<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=22\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>IFP 以整個果園生態與經濟系統為單位，結合適地品種、土壤水肥、樹冠負載、病蟲整合、採後與追溯，生產安全高品質果實並保護環境。化學資材依監測必要、合理使用，不等於完全禁用；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先建立可預防的栽培條件<\/strong><\/p>\n<p>健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。<\/p>\n<p><strong>監測後再選處理<\/strong><\/p>\n<p>定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。<\/p>\n<p><strong>整合與追蹤效果<\/strong><\/p>\n<p>不同手段應互相相容，保護天敵並避免抗藥性累積。處理後確認受害是否降低，保存用藥、環境與採收紀錄；有機生產也須依規範使用資材，並不代表可以省略病蟲管理。<\/p>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>IFP 以整個果園生態與經濟系統為單位，結合適地品種、土壤水肥、樹冠負載、病蟲整合、採後與追溯，生產安全高品質果實並保護環境。化學資材依監測必要、合理使用，不等於完全禁用；<\/p>\n<p>重點為預防、紀錄、驗證和持續改善。<\/p>\n<p>健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。<\/p>\n<p>定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>番茄管理可由健康苗、防蟲設施與田間監測降低媒介昆蟲傳播病毒的機會；已感染植株的處置與媒介控制須配合，不能只噴一次藥便認定病毒消失。<\/p>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：系統定義、土水肥、病蟲、品質追溯與永續。<\/p>\n<ul>\n<li><strong>系統定義<\/strong><\/li>\n<li><strong>土水肥<\/strong><\/li>\n<li><strong>品質追溯與永續<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把有機栽培理解成完全不防治。<\/li>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=22","md":"99年果樹學_逐題教學詳解.md","search":"整合性果實生產 ifp ## 第八題｜整合性果實生產 ifp（10 分）\n\n### 題意與作答範圍\n\n本題重點：**整合性果實生產 ifp**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=22)。\n\n### 先掌握答案\n\nifp 以整個果園生態與經濟系統為單位，結合適地品種、土壤水肥、樹冠負載、病蟲整合、採後與追溯，生產安全高品質果實並保護環境。化學資材依監測必要、合理使用，不等於完全禁用；\n\n### 原理拆解：為什麼會這樣？\n\n**先建立可預防的栽培條件**\n\n健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。\n\n**監測後再選處理**\n\n定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。\n\n**整合與追蹤效果**\n\n不同手段應互相相容，保護天敵並避免抗藥性累積。處理後確認受害是否降低，保存用藥、環境與採收紀錄；有機生產也須依規範使用資材，並不代表可以省略病蟲管理。\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n### 可直接練寫的完整答案\n\nifp 以整個果園生態與經濟系統為單位，結合適地品種、土壤水肥、樹冠負載、病蟲整合、採後與追溯，生產安全高品質果實並保護環境。化學資材依監測必要、合理使用，不等於完全禁用；\n\n重點為預防、紀錄、驗證和持續改善。\n\n健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。\n\n定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。\n\n### 實例：把原理用在情境中\n\n番茄管理可由健康苗、防蟲設施與田間監測降低媒介昆蟲傳播病毒的機會；已感染植株的處置與媒介控制須配合，不能只噴一次藥便認定病毒消失。\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：系統定義、土水肥、病蟲、品質追溯與永續。\n\n- **系統定義**\n- **土水肥**\n- **品質追溯與永續**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把有機栽培理解成完全不防治。\n- 將連作障礙全部歸因於缺肥。\n 99 果樹學"},{"id":"果樹學-99-九","s":"果樹學","y":99,"n":"九","t":"三糖、三酵素與兩酸","body":"<h2>第九題｜三糖、三酵素與兩酸（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>三糖、三酵素與兩酸<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=22\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>主要可溶性糖為蔗糖、葡萄糖、果糖；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>三種酵素要看反應而非只背名稱<\/strong><\/p>\n<p>轉化酶水解蔗糖，生成葡萄糖與果糖；蔗糖合成酶可逆地轉換蔗糖與 UDP-葡萄糖、果糖，在許多庫組織常參與裂解；蔗糖磷酸合成酶則參與蔗糖合成。不能因名稱含「合成」就斷定反應在所有組織一定只向合成方向。<\/p>\n<p><strong>酵素改變糖種類，也影響庫的吸引力<\/strong><\/p>\n<p>庫端把蔗糖裂解可維持輸入梯度、供呼吸和細胞壁合成，己糖也具滲透與訊號作用。若成熟期蔗糖合成加強、分解下降並有足夠運入，就可能較多累積蔗糖；但結果仍受細胞區室及液泡運輸限制。<\/p>\n<p><strong>不可用一次活性推全部品質<\/strong><\/p>\n<p>應比較發育時序、酵素位置、糖總量與含水。糖度較高可能因水少，不必然是酵素使糖總量提高；有機酸也受合成、呼吸利用與液泡貯藏影響，需與糖酸比、風味一起判讀。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>主要可溶性糖為蔗糖、葡萄糖、果糖；<\/p>\n<p>相關酵素為轉化酶、蔗糖合成酶、蔗糖磷酸合成酶。主要有機酸可舉蘋果酸與檸檬酸，分別可用蘋果酸去氫酶與檸檬酸合成酶說明代謝；<\/p>\n<p>酸累積還受液泡運輸、呼吸利用及發育稀釋影響。<\/p>\n<p>轉化酶水解蔗糖，生成葡萄糖與果糖；蔗糖合成酶可逆地轉換蔗糖與 UDP-葡萄糖、果糖，在許多庫組織常參與裂解；蔗糖磷酸合成酶則參與蔗糖合成。不能因名稱含「合成」就斷定反應在所有組織一定只向合成方向。<\/p>\n<p>庫端把蔗糖裂解可維持輸入梯度、供呼吸和細胞壁合成，己糖也具滲透與訊號作用。若成熟期蔗糖合成加強、分解下降並有足夠運入，就可能較多累積蔗糖；但結果仍受細胞區室及液泡運輸限制。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>研究上可同測蔗糖、葡萄糖、果糖的含量與相關酵素，若只有轉化酶較高而糖輸入不足，仍不能推定成熟果一定更甜。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：3 糖、3 酵素、2 酸與各 1 酵素成對正確。<\/p>\n<ul>\n<li><strong>3 糖<\/strong><\/li>\n<li><strong>3 酵素<\/strong><\/li>\n<li><strong>2 酸與各 1 酵素成對正確<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把蔗糖合成酶等同只能合成蔗糖。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=22","md":"99年果樹學_逐題教學詳解.md","search":"三糖、三酵素與兩酸 ## 第九題｜三糖、三酵素與兩酸（10 分）\n\n### 題意與作答範圍\n\n本題重點：**三糖、三酵素與兩酸**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=22)。\n\n### 先掌握答案\n\n主要可溶性糖為蔗糖、葡萄糖、果糖；\n\n### 原理拆解：為什麼會這樣？\n\n**三種酵素要看反應而非只背名稱**\n\n轉化酶水解蔗糖，生成葡萄糖與果糖；蔗糖合成酶可逆地轉換蔗糖與 udp-葡萄糖、果糖，在許多庫組織常參與裂解；蔗糖磷酸合成酶則參與蔗糖合成。不能因名稱含「合成」就斷定反應在所有組織一定只向合成方向。\n\n**酵素改變糖種類，也影響庫的吸引力**\n\n庫端把蔗糖裂解可維持輸入梯度、供呼吸和細胞壁合成，己糖也具滲透與訊號作用。若成熟期蔗糖合成加強、分解下降並有足夠運入，就可能較多累積蔗糖；但結果仍受細胞區室及液泡運輸限制。\n\n**不可用一次活性推全部品質**\n\n應比較發育時序、酵素位置、糖總量與含水。糖度較高可能因水少，不必然是酵素使糖總量提高；有機酸也受合成、呼吸利用與液泡貯藏影響，需與糖酸比、風味一起判讀。\n\n### 可直接練寫的完整答案\n\n主要可溶性糖為蔗糖、葡萄糖、果糖；\n\n相關酵素為轉化酶、蔗糖合成酶、蔗糖磷酸合成酶。主要有機酸可舉蘋果酸與檸檬酸，分別可用蘋果酸去氫酶與檸檬酸合成酶說明代謝；\n\n酸累積還受液泡運輸、呼吸利用及發育稀釋影響。\n\n轉化酶水解蔗糖，生成葡萄糖與果糖；蔗糖合成酶可逆地轉換蔗糖與 udp-葡萄糖、果糖，在許多庫組織常參與裂解；蔗糖磷酸合成酶則參與蔗糖合成。不能因名稱含「合成」就斷定反應在所有組織一定只向合成方向。\n\n庫端把蔗糖裂解可維持輸入梯度、供呼吸和細胞壁合成，己糖也具滲透與訊號作用。若成熟期蔗糖合成加強、分解下降並有足夠運入，就可能較多累積蔗糖；但結果仍受細胞區室及液泡運輸限制。\n\n### 實例：把原理用在情境中\n\n研究上可同測蔗糖、葡萄糖、果糖的含量與相關酵素，若只有轉化酶較高而糖輸入不足，仍不能推定成熟果一定更甜。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：3 糖、3 酵素、2 酸與各 1 酵素成對正確。\n\n- **3 糖**\n- **3 酵素**\n- **2 酸與各 1 酵素成對正確**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把蔗糖合成酶等同只能合成蔗糖。\n 99 果樹學"},{"id":"果樹學-99-十","s":"果樹學","y":99,"n":"十","t":"葉糖至果肉路徑","body":"<h2>第十題｜葉糖至果肉路徑（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>葉糖至果肉路徑<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=22\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>糖由葉肉細胞經葉脈裝入篩管，沿葉柄、枝幹、果梗到果實維管束卸載，再入果肉細胞與液泡。共質體經胞間連絲，質外體須跨膜轉運；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把源與庫接起來<\/strong><\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<p><strong>壓力流與跨膜運輸不是同一層次<\/strong><\/p>\n<p>源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；H⁺-ATPase 建立電化學梯度，可支援 H⁺／蔗糖共運輸。<\/p>\n<p><strong>庫強決定競爭，不只看果實大小<\/strong><\/p>\n<p>庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>糖由葉肉細胞經葉脈裝入篩管，沿葉柄、枝幹、果梗到果實維管束卸載，再入果肉細胞與液泡。共質體經胞間連絲，質外體須跨膜轉運；<\/p>\n<p>源端裝載、壓力梯度、庫端糖裂解及液泡貯藏共同控制輸送。<\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<p>源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；H⁺-ATPase 建立電化學梯度，可支援 H⁺／蔗糖共運輸。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：組織順序、兩路徑、壓力流與關鍵調控。<\/p>\n<ul>\n<li><strong>組織順序<\/strong><\/li>\n<li><strong>兩路徑<\/strong><\/li>\n<li><strong>壓力流與關鍵調控<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把長距離糖運輸寫成主要沿木質部。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=22","md":"99年果樹學_逐題教學詳解.md","search":"葉糖至果肉路徑 ## 第十題｜葉糖至果肉路徑（10 分）\n\n### 題意與作答範圍\n\n本題重點：**葉糖至果肉路徑**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=22)。\n\n### 先掌握答案\n\n糖由葉肉細胞經葉脈裝入篩管，沿葉柄、枝幹、果梗到果實維管束卸載，再入果肉細胞與液泡。共質體經胞間連絲，質外體須跨膜轉運；\n\n### 原理拆解：為什麼會這樣？\n\n**先把源與庫接起來**\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n**壓力流與跨膜運輸不是同一層次**\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n**庫強決定競爭，不只看果實大小**\n\n庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。\n\n### 可直接練寫的完整答案\n\n糖由葉肉細胞經葉脈裝入篩管，沿葉柄、枝幹、果梗到果實維管束卸載，再入果肉細胞與液泡。共質體經胞間連絲，質外體須跨膜轉運；\n\n源端裝載、壓力梯度、庫端糖裂解及液泡貯藏共同控制輸送。\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n### 實例：把原理用在情境中\n\n同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：組織順序、兩路徑、壓力流與關鍵調控。\n\n- **組織順序**\n- **兩路徑**\n- **壓力流與關鍵調控**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把長距離糖運輸寫成主要沿木質部。\n 99 果樹學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.lengt led=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
