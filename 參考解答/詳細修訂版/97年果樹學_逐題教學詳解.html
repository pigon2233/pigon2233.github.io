ls{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 8 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"果樹學-97-一","s":"果樹學","y":97,"n":"一","t":"五名詞","body":"<h2>第一題｜五名詞（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=28\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Scion 接穗；<\/p>\n<p>somaclonal variation 體細胞無性系變異，組培再生個體的遺傳／表觀遺傳差異；<\/p>\n<p>multiple fruit 多花果，由整個花序的多花子房與附屬組織形成，如鳳梨；<\/p>\n<p>bagging 套袋，保護外觀並減少病蟲、殘留與日燒，材料須配作物；<\/p>\n<p>climacteric fruit 更年性果實，如香蕉，成熟伴呼吸與乙烯躍升。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>成熟反應與乙烯感受<\/strong><\/p>\n<p>乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。<\/p>\n<p><strong>更年性與非更年性要比較反應型態<\/strong><\/p>\n<p>具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。<\/p>\n<p><strong>催熟與延後成熟都不能忽略品質<\/strong><\/p>\n<p>乙烯可整齊催熟已達生理成熟的果，卻不能讓極幼果補足田間累積不足的乾物；1-MCP 阻斷感受可延緩部分產品老化，但過強處理可能影響正常後熟。脫綠、果肉軟化和增甜亦不是必然同步。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>somaclonal variation 體細胞無性系變異，組培再生個體的遺傳／表觀遺傳差異；<\/td>\n<td>後代通常保留母株基因型，但仍可能累積突變、嵌合或系統性病原。<\/td>\n<\/tr>\n<tr>\n<td>multiple fruit 多花果，由整個花序的多花子房與附屬組織形成，如鳳梨；<\/td>\n<td>通常發育成果實的核心組織；附屬花部也可參與形成可食部。<\/td>\n<\/tr>\n<tr>\n<td>climacteric fruit 更年性果實，如香蕉，成熟伴呼吸與乙烯躍升。<\/td>\n<td>分類時先看一花或多花，再看子房個數及附屬組織，避免把聚合果、多花果與假果混為一類。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Scion 接穗；<\/p>\n<p>somaclonal variation 體細胞無性系變異，組培再生個體的遺傳／表觀遺傳差異；<\/p>\n<p>multiple fruit 多花果，由整個花序的多花子房與附屬組織形成，如鳳梨；<\/p>\n<p>bagging 套袋，保護外觀並減少病蟲、殘留與日燒，材料須配作物；<\/p>\n<p>climacteric fruit 更年性果實，如香蕉，成熟伴呼吸與乙烯躍升。<\/p>\n<p>乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>香蕉在不當高溫下，果肉可軟化而果皮仍綠，顯示果肉成熟與葉綠素降解可不同步。不能僅看果皮未黃，就判斷乙烯完全沒有作用。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：各名詞 3 分，定義與例。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>說非更年性果實完全不會回應乙烯。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=28","md":"97年果樹學_逐題教學詳解.md","search":"五名詞 ## 第一題｜五名詞（15 分）\n\n### 題意與作答範圍\n\n本題重點：**五名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=28)。\n\n### 先掌握答案\n\nscion 接穗；\n\nsomaclonal variation 體細胞無性系變異，組培再生個體的遺傳／表觀遺傳差異；\n\nmultiple fruit 多花果，由整個花序的多花子房與附屬組織形成，如鳳梨；\n\nbagging 套袋，保護外觀並減少病蟲、殘留與日燒，材料須配作物；\n\nclimacteric fruit 更年性果實，如香蕉，成熟伴呼吸與乙烯躍升。\n\n### 原理拆解：為什麼會這樣？\n\n**成熟反應與乙烯感受**\n\n乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。\n\n**更年性與非更年性要比較反應型態**\n\n具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。\n\n**催熟與延後成熟都不能忽略品質**\n\n乙烯可整齊催熟已達生理成熟的果，卻不能讓極幼果補足田間累積不足的乾物；1-mcp 阻斷感受可延緩部分產品老化，但過強處理可能影響正常後熟。脫綠、果肉軟化和增甜亦不是必然同步。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| somaclonal variation 體細胞無性系變異，組培再生個體的遺傳／表觀遺傳差異； | 後代通常保留母株基因型，但仍可能累積突變、嵌合或系統性病原。 |\n| multiple fruit 多花果，由整個花序的多花子房與附屬組織形成，如鳳梨； | 通常發育成果實的核心組織；附屬花部也可參與形成可食部。 |\n| climacteric fruit 更年性果實，如香蕉，成熟伴呼吸與乙烯躍升。 | 分類時先看一花或多花，再看子房個數及附屬組織，避免把聚合果、多花果與假果混為一類。 |\n\n### 可直接練寫的完整答案\n\nscion 接穗；\n\nsomaclonal variation 體細胞無性系變異，組培再生個體的遺傳／表觀遺傳差異；\n\nmultiple fruit 多花果，由整個花序的多花子房與附屬組織形成，如鳳梨；\n\nbagging 套袋，保護外觀並減少病蟲、殘留與日燒，材料須配作物；\n\nclimacteric fruit 更年性果實，如香蕉，成熟伴呼吸與乙烯躍升。\n\n乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。\n\n### 實例：把原理用在情境中\n\n香蕉在不當高溫下，果肉可軟化而果皮仍綠，顯示果肉成熟與葉綠素降解可不同步。不能僅看果皮未黃，就判斷乙烯完全沒有作用。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：各名詞 3 分，定義與例。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 說非更年性果實完全不會回應乙烯。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 97 果樹學"},{"id":"果樹學-97-二","s":"果樹學","y":97,"n":"二","t":"生物性肥料","body":"<h2>第二題｜生物性肥料（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>生物性肥料<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=28\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>生物性肥料含活的有益微生物，以固氮、溶磷、促進根系或菌根吸收等改善養分利用。可舉根瘤菌、Azotobacter／Azospirillum 固氮菌、溶磷 Bacillus 等及叢枝菌根真菌。效能受宿主、土壤、菌株存活及養分背景影響，並非有機質肥或所有微生物製劑都能代替完整施肥。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>生物性肥料含活的有益微生物，以固氮、溶磷、促進根系或菌根吸收等改善養分利用。可舉根瘤菌、Azotobacter／Azospirillum 固氮菌、溶磷 Bacillus 等及叢枝菌根真菌。效能受宿主、土壤、菌株存活及養分背景影響，並非有機質肥或所有微生物製劑都能代替完整施肥。<\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：定義、微生物及機制配對、田間條件限制。<\/p>\n<ul>\n<li><strong>微生物及機制配對<\/strong><\/li>\n<li><strong>田間條件限制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=28","md":"97年果樹學_逐題教學詳解.md","search":"生物性肥料 ## 第二題｜生物性肥料（10 分）\n\n### 題意與作答範圍\n\n本題重點：**生物性肥料**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=28)。\n\n### 先掌握答案\n\n生物性肥料含活的有益微生物，以固氮、溶磷、促進根系或菌根吸收等改善養分利用。可舉根瘤菌、azotobacter／azospirillum 固氮菌、溶磷 bacillus 等及叢枝菌根真菌。效能受宿主、土壤、菌株存活及養分背景影響，並非有機質肥或所有微生物製劑都能代替完整施肥。\n\n### 原理拆解：為什麼會這樣？\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n### 可直接練寫的完整答案\n\n生物性肥料含活的有益微生物，以固氮、溶磷、促進根系或菌根吸收等改善養分利用。可舉根瘤菌、azotobacter／azospirillum 固氮菌、溶磷 bacillus 等及叢枝菌根真菌。效能受宿主、土壤、菌株存活及養分背景影響，並非有機質肥或所有微生物製劑都能代替完整施肥。\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n### 實例：把原理用在情境中\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：定義、微生物及機制配對、田間條件限制。\n\n- **微生物及機制配對**\n- **田間條件限制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將連作障礙全部歸因於缺肥。\n 97 果樹學"},{"id":"果樹學-97-三","s":"果樹學","y":97,"n":"三","t":"柑橘五障礙原因","body":"<h2>第三題｜柑橘五障礙原因（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>柑橘五障礙原因<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=28\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>成熟葉倒 V／A 型脈間黃化為缺鎂；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>第一步是分清吸收、運輸與需求<\/strong><\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p><strong>用新老葉位置推理<\/strong><\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<p><strong>最後必須用適當樣本驗證<\/strong><\/p>\n<p>依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。<\/p>\n<p><strong>為何採後仍會變差<\/strong><\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p><strong>低溫有效，但有適用範圍<\/strong><\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<p><strong>把全程串起來<\/strong><\/p>\n<p>採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>成熟葉倒 V／A 型脈間黃化為缺鎂；<\/p>\n<p>新梢叢生小葉、節間短為缺鋅；<\/p>\n<p>硬且畸形果優先缺硼；<\/p>\n<p>貯藏 superficial scald 為果皮表層褐斑、需查品種及貯藏條件引起的生理性果皮傷害，不能直接等同病原或套用蘋果機制；<\/p>\n<p>浮皮為皮肉分離，與過熟、暖濕、旺長等相關。<\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。<\/p>\n<p>驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：每小題 3 分，徵狀與原因，表層褐變須承認鑑別。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>只寫缺肥會黃葉，沒有指出葉齡與黃化分布。<\/li>\n<li>認為溫度越低、保存效果一定越好。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=28","md":"97年果樹學_逐題教學詳解.md","search":"柑橘五障礙原因 ## 第三題｜柑橘五障礙原因（15 分）\n\n### 題意與作答範圍\n\n本題重點：**柑橘五障礙原因**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=28)。\n\n### 先掌握答案\n\n成熟葉倒 v／a 型脈間黃化為缺鎂；\n\n### 原理拆解：為什麼會這樣？\n\n**第一步是分清吸收、運輸與需求**\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n**用新老葉位置推理**\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n**最後必須用適當樣本驗證**\n\n依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。\n\n**為何採後仍會變差**\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n**低溫有效，但有適用範圍**\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n**把全程串起來**\n\n採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。\n\n### 可直接練寫的完整答案\n\n成熟葉倒 v／a 型脈間黃化為缺鎂；\n\n新梢叢生小葉、節間短為缺鋅；\n\n硬且畸形果優先缺硼；\n\n貯藏 superficial scald 為果皮表層褐斑、需查品種及貯藏條件引起的生理性果皮傷害，不能直接等同病原或套用蘋果機制；\n\n浮皮為皮肉分離，與過熟、暖濕、旺長等相關。\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n### 實例：把原理用在情境中\n\n老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。\n\n驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：每小題 3 分，徵狀與原因，表層褐變須承認鑑別。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 只寫缺肥會黃葉，沒有指出葉齡與黃化分布。\n- 認為溫度越低、保存效果一定越好。\n 97 果樹學"},{"id":"果樹學-97-四","s":"果樹學","y":97,"n":"四","t":"蒸熱高濕較易熱害","body":"<h2>第四題｜蒸熱高濕較易熱害（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>蒸熱高濕較易熱害<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=28\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>高相對濕度使果實蒸發散熱減少，果面低於露點時水汽凝結並釋放潛熱，升溫更快；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>高濕蒸熱為何更容易累積熱？<\/strong><\/p>\n<p>熱處理時高濕降低果面與空氣之間的水汽壓差，使蒸發散熱受限；若有水汽凝結，還會釋放潛熱，增加表面熱負荷。處理強度須看果心升溫、持溫時間與品種耐受性，不能只看處理室空氣溫度。檢疫效果與果實品質須一起驗證，事後降溫也不一定可逆轉已發生的細胞傷害。<\/p>\n<p><strong>先理解水勢與膨壓<\/strong><\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p><strong>由缺水到減產的連鎖<\/strong><\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<p><strong>管理不是只問澆多少<\/strong><\/p>\n<p>應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>高相對濕度使果實蒸發散熱減少，果面低於露點時水汽凝結並釋放潛熱，升溫更快；<\/p>\n<p>相同空氣溫度不代表相同果面與果心熱負荷。低濕空氣可有較多蒸發冷卻，因此熱害風險較低，但也可能失水。檢疫程序須同時控制濕度、升溫速率、果心溫與持續時間。<\/p>\n<p>熱處理時高濕降低果面與空氣之間的水汽壓差，使蒸發散熱受限；若有水汽凝結，還會釋放潛熱，增加表面熱負荷。處理強度須看果心升溫、持溫時間與品種耐受性，不能只看處理室空氣溫度。檢疫效果與果實品質須一起驗證，事後降溫也不一定可逆轉已發生的細胞傷害。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：蒸發冷卻、凝結潛熱、熱劑量與程序控制。<\/p>\n<ul>\n<li><strong>蒸發冷卻<\/strong><\/li>\n<li><strong>凝結潛熱<\/strong><\/li>\n<li><strong>熱劑量與程序控制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把有水等同根一定能吸到水。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=28","md":"97年果樹學_逐題教學詳解.md","search":"蒸熱高濕較易熱害 ## 第四題｜蒸熱高濕較易熱害（10 分）\n\n### 題意與作答範圍\n\n本題重點：**蒸熱高濕較易熱害**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=28)。\n\n### 先掌握答案\n\n高相對濕度使果實蒸發散熱減少，果面低於露點時水汽凝結並釋放潛熱，升溫更快；\n\n### 原理拆解：為什麼會這樣？\n\n**高濕蒸熱為何更容易累積熱？**\n\n熱處理時高濕降低果面與空氣之間的水汽壓差，使蒸發散熱受限；若有水汽凝結，還會釋放潛熱，增加表面熱負荷。處理強度須看果心升溫、持溫時間與品種耐受性，不能只看處理室空氣溫度。檢疫效果與果實品質須一起驗證，事後降溫也不一定可逆轉已發生的細胞傷害。\n\n**先理解水勢與膨壓**\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n**由缺水到減產的連鎖**\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n**管理不是只問澆多少**\n\n應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。\n\n### 可直接練寫的完整答案\n\n高相對濕度使果實蒸發散熱減少，果面低於露點時水汽凝結並釋放潛熱，升溫更快；\n\n相同空氣溫度不代表相同果面與果心熱負荷。低濕空氣可有較多蒸發冷卻，因此熱害風險較低，但也可能失水。檢疫程序須同時控制濕度、升溫速率、果心溫與持續時間。\n\n熱處理時高濕降低果面與空氣之間的水汽壓差，使蒸發散熱受限；若有水汽凝結，還會釋放潛熱，增加表面熱負荷。處理強度須看果心升溫、持溫時間與品種耐受性，不能只看處理室空氣溫度。檢疫效果與果實品質須一起驗證，事後降溫也不一定可逆轉已發生的細胞傷害。\n\n### 實例：把原理用在情境中\n\n旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：蒸發冷卻、凝結潛熱、熱劑量與程序控制。\n\n- **蒸發冷卻**\n- **凝結潛熱**\n- **熱劑量與程序控制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把有水等同根一定能吸到水。\n 97 果樹學"},{"id":"果樹學-97-五","s":"果樹學","y":97,"n":"五","t":"木瓜炭疽與蒂腐","body":"<h2>第五題｜木瓜炭疽與蒂腐（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>木瓜炭疽與蒂腐<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=28\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>炭疽常在田間潛伏感染、成熟時發病，須採前清園、減濕、依規防治及健康果採收；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>為何採後仍會變差<\/strong><\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p><strong>低溫有效，但有適用範圍<\/strong><\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<p><strong>把全程串起來<\/strong><\/p>\n<p>採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。<\/p>\n<p><strong>先建立可預防的栽培條件<\/strong><\/p>\n<p>健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。<\/p>\n<p><strong>監測後再選處理<\/strong><\/p>\n<p>定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。<\/p>\n<p><strong>整合與追蹤效果<\/strong><\/p>\n<p>不同手段應互相相容，保護天敵並避免抗藥性累積。處理後確認受害是否降低，保存用藥、環境與採收紀錄；有機生產也須依規範使用資材，並不代表可以省略病蟲管理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>炭疽常在田間潛伏感染、成熟時發病，須採前清園、減濕、依規防治及健康果採收；<\/p>\n<p>蒂腐多由剪口等採後傷口侵入，須潔淨工具、妥善留梗／整修、去乳汁、減傷與包裝場衛生。兩者都需適溫冷鏈、剔病果與經驗證且合法的熱水或防病處理，不能只採後噴藥。<\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。<\/p>\n<p>番茄管理可由健康苗、防蟲設施與田間監測降低媒介昆蟲傳播病毒的機會；已感染植株的處置與媒介控制須配合，不能只噴一次藥便認定病毒消失。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：感染時點差別、各自預防、採後共同措施。<\/p>\n<ul>\n<li><strong>感染時點差別<\/strong><\/li>\n<li><strong>各自預防<\/strong><\/li>\n<li><strong>採後共同措施<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>認為溫度越低、保存效果一定越好。<\/li>\n<li>把有機栽培理解成完全不防治。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=28","md":"97年果樹學_逐題教學詳解.md","search":"木瓜炭疽與蒂腐 ## 第五題｜木瓜炭疽與蒂腐（15 分）\n\n### 題意與作答範圍\n\n本題重點：**木瓜炭疽與蒂腐**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=28)。\n\n### 先掌握答案\n\n炭疽常在田間潛伏感染、成熟時發病，須採前清園、減濕、依規防治及健康果採收；\n\n### 原理拆解：為什麼會這樣？\n\n**為何採後仍會變差**\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n**低溫有效，但有適用範圍**\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n**把全程串起來**\n\n採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。\n\n**先建立可預防的栽培條件**\n\n健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。\n\n**監測後再選處理**\n\n定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。\n\n**整合與追蹤效果**\n\n不同手段應互相相容，保護天敵並避免抗藥性累積。處理後確認受害是否降低，保存用藥、環境與採收紀錄；有機生產也須依規範使用資材，並不代表可以省略病蟲管理。\n\n### 可直接練寫的完整答案\n\n炭疽常在田間潛伏感染、成熟時發病，須採前清園、減濕、依規防治及健康果採收；\n\n蒂腐多由剪口等採後傷口侵入，須潔淨工具、妥善留梗／整修、去乳汁、減傷與包裝場衛生。兩者都需適溫冷鏈、剔病果與經驗證且合法的熱水或防病處理，不能只採後噴藥。\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n### 實例：把原理用在情境中\n\n驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。\n\n番茄管理可由健康苗、防蟲設施與田間監測降低媒介昆蟲傳播病毒的機會；已感染植株的處置與媒介控制須配合，不能只噴一次藥便認定病毒消失。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：感染時點差別、各自預防、採後共同措施。\n\n- **感染時點差別**\n- **各自預防**\n- **採後共同措施**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 認為溫度越低、保存效果一定越好。\n- 把有機栽培理解成完全不防治。\n 97 果樹學"},{"id":"果樹學-97-六","s":"果樹學","y":97,"n":"六","t":"噴殺蟲劑後蟎害（100 字內）","body":"<h2>第六題｜噴殺蟲劑後蟎害（100 字內）（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>噴殺蟲劑後蟎害（100 字內）<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=28\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>殺蟲劑殺死捕食蟎等天敵，破壞生態平衡；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>害蟲再猖獗的生態機制<\/strong><\/p>\n<p>廣效殺蟲劑可能比目標蟎更有效地殺死捕食蟎與其他天敵，短期少蟲後出現天敵不足，倖存蟎迅速恢復。也須查抗藥性、未受藥卵及乾熱環境；單看時間先後不能斷言一定是藥劑直接刺激繁殖。原題限字的申論稿宜壓縮成「天敵破壞—族群恢復—整合管理」三段因果。<\/p>\n<p><strong>先建立可預防的栽培條件<\/strong><\/p>\n<p>健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。<\/p>\n<p><strong>監測後再選處理<\/strong><\/p>\n<p>定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。<\/p>\n<p><strong>整合與追蹤效果<\/strong><\/p>\n<p>不同手段應互相相容，保護天敵並避免抗藥性累積。處理後確認受害是否降低，保存用藥、環境與採收紀錄；有機生產也須依規範使用資材，並不代表可以省略病蟲管理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>原題有限字要求；下列保留精簡作答，詳細原理請讀上方。<\/p>\n<p>殺蟲劑殺死捕食蟎等天敵，破壞生態平衡；蟎卵未死、抗藥或藥劑刺激繁殖，加上高溫乾燥，使倖存族群迅速增殖。應監測、保護天敵並輪替適用殺蟎機制。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>番茄管理可由健康苗、防蟲設施與田間監測降低媒介昆蟲傳播病毒的機會；已感染植株的處置與媒介控制須配合，不能只噴一次藥便認定病毒消失。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：次要害蟲猖獗、天敵、抗性與環境；答案遵守原字數上限。<\/p>\n<ul>\n<li><strong>次要害蟲猖獗<\/strong><\/li>\n<li><strong>抗性與環境<\/strong><\/li>\n<li><strong>答案遵守原字數上限<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把有機栽培理解成完全不防治。<\/li>\n<li>把教學詳解全部抄進考卷，超過原題字數限制。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=28","md":"97年果樹學_逐題教學詳解.md","search":"噴殺蟲劑後蟎害（100 字內） ## 第六題｜噴殺蟲劑後蟎害（100 字內）（10 分）\n\n### 題意與作答範圍\n\n本題重點：**噴殺蟲劑後蟎害（100 字內）**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=28)。\n\n### 先掌握答案\n\n殺蟲劑殺死捕食蟎等天敵，破壞生態平衡；\n\n### 原理拆解：為什麼會這樣？\n\n**害蟲再猖獗的生態機制**\n\n廣效殺蟲劑可能比目標蟎更有效地殺死捕食蟎與其他天敵，短期少蟲後出現天敵不足，倖存蟎迅速恢復。也須查抗藥性、未受藥卵及乾熱環境；單看時間先後不能斷言一定是藥劑直接刺激繁殖。原題限字的申論稿宜壓縮成「天敵破壞—族群恢復—整合管理」三段因果。\n\n**先建立可預防的栽培條件**\n\n健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。\n\n**監測後再選處理**\n\n定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。\n\n**整合與追蹤效果**\n\n不同手段應互相相容，保護天敵並避免抗藥性累積。處理後確認受害是否降低，保存用藥、環境與採收紀錄；有機生產也須依規範使用資材，並不代表可以省略病蟲管理。\n\n### 可直接練寫的完整答案\n\n原題有限字要求；下列保留精簡作答，詳細原理請讀上方。\n\n殺蟲劑殺死捕食蟎等天敵，破壞生態平衡；蟎卵未死、抗藥或藥劑刺激繁殖，加上高溫乾燥，使倖存族群迅速增殖。應監測、保護天敵並輪替適用殺蟎機制。\n\n### 實例：把原理用在情境中\n\n番茄管理可由健康苗、防蟲設施與田間監測降低媒介昆蟲傳播病毒的機會；已感染植株的處置與媒介控制須配合，不能只噴一次藥便認定病毒消失。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：次要害蟲猖獗、天敵、抗性與環境；答案遵守原字數上限。\n\n- **次要害蟲猖獗**\n- **抗性與環境**\n- **答案遵守原字數上限**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把有機栽培理解成完全不防治。\n- 把教學詳解全部抄進考卷，超過原題字數限制。\n 97 果樹學"},{"id":"果樹學-97-七","s":"果樹學","y":97,"n":"七","t":"網室中央結果差（100 字內）","body":"<h2>第七題｜網室中央結果差（100 字內）（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>網室中央結果差（100 字內）<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=28\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>中央通風弱、溫濕度高，易使花粉活力下降並造成花器畸形，弱光又降低供碳；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>空間差異提供線索，還不是確診<\/strong><\/p>\n<p>中心結果較差、邊緣正常，應優先測溫濕度、光量、風速與授粉昆蟲活動，再檢查灌溉及根域病害。可做中央與邊緣的花粉活力、畸形花率與果數比較，或小區改善通風確認反應。答案用「可能」和可驗證對策，較直接宣稱某單一缺素更合乎題意。<\/p>\n<p><strong>設施先改變能量與物質交換<\/strong><\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p><strong>各因子必須一起管理<\/strong><\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<p><strong>控制成效要用植株與環境資料驗證<\/strong><\/p>\n<p>以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>原題有限字要求；下列保留精簡作答，詳細原理請讀上方。<\/p>\n<p>中央通風弱、溫濕度高，易使花粉活力下降並造成花器畸形，弱光又降低供碳；邊角較通風，因而果較正常。宜量測內外環境，並查根域排水與病害，避免僅憑位置直接定因。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：位置梯度、熱濕／光、花器著果、可驗證原因；保留字數限制。<\/p>\n<ul>\n<li><strong>位置梯度<\/strong><\/li>\n<li><strong>熱濕／光<\/strong><\/li>\n<li><strong>花器著果<\/strong><\/li>\n<li><strong>可驗證原因<\/strong><\/li>\n<li><strong>保留字數限制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將溫室直接等同低溫環境。<\/li>\n<li>把教學詳解全部抄進考卷，超過原題字數限制。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=28","md":"97年果樹學_逐題教學詳解.md","search":"網室中央結果差（100 字內） ## 第七題｜網室中央結果差（100 字內）（15 分）\n\n### 題意與作答範圍\n\n本題重點：**網室中央結果差（100 字內）**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=28)。\n\n### 先掌握答案\n\n中央通風弱、溫濕度高，易使花粉活力下降並造成花器畸形，弱光又降低供碳；\n\n### 原理拆解：為什麼會這樣？\n\n**空間差異提供線索，還不是確診**\n\n中心結果較差、邊緣正常，應優先測溫濕度、光量、風速與授粉昆蟲活動，再檢查灌溉及根域病害。可做中央與邊緣的花粉活力、畸形花率與果數比較，或小區改善通風確認反應。答案用「可能」和可驗證對策，較直接宣稱某單一缺素更合乎題意。\n\n**設施先改變能量與物質交換**\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n**各因子必須一起管理**\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n**控制成效要用植株與環境資料驗證**\n\n以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。\n\n### 可直接練寫的完整答案\n\n原題有限字要求；下列保留精簡作答，詳細原理請讀上方。\n\n中央通風弱、溫濕度高，易使花粉活力下降並造成花器畸形，弱光又降低供碳；邊角較通風，因而果較正常。宜量測內外環境，並查根域排水與病害，避免僅憑位置直接定因。\n\n### 實例：把原理用在情境中\n\n臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：位置梯度、熱濕／光、花器著果、可驗證原因；保留字數限制。\n\n- **位置梯度**\n- **熱濕／光**\n- **花器著果**\n- **可驗證原因**\n- **保留字數限制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將溫室直接等同低溫環境。\n- 把教學詳解全部抄進考卷，超過原題字數限制。\n 97 果樹學"},{"id":"果樹學-97-八","s":"果樹學","y":97,"n":"八","t":"IFP 基本原則","body":"<h2>第八題｜IFP 基本原則（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>IFP 基本原則<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=28\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>以果園整體生態、品質、安全與經濟為核心，合理使用土地、品種、水肥和農藥，保護土壤、生物多樣性與天敵，配合監測、採後品質、記錄追溯和持續驗證。可在必要時合理使用化學資材，與有機驗證並非同義。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先建立可預防的栽培條件<\/strong><\/p>\n<p>健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。<\/p>\n<p><strong>監測後再選處理<\/strong><\/p>\n<p>定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。<\/p>\n<p><strong>整合與追蹤效果<\/strong><\/p>\n<p>不同手段應互相相容，保護天敵並避免抗藥性累積。處理後確認受害是否降低，保存用藥、環境與採收紀錄；有機生產也須依規範使用資材，並不代表可以省略病蟲管理。<\/p>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>以果園整體生態、品質、安全與經濟為核心，合理使用土地、品種、水肥和農藥，保護土壤、生物多樣性與天敵，配合監測、採後品質、記錄追溯和持續驗證。可在必要時合理使用化學資材，與有機驗證並非同義。<\/p>\n<p>健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。<\/p>\n<p>定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>番茄管理可由健康苗、防蟲設施與田間監測降低媒介昆蟲傳播病毒的機會；已感染植株的處置與媒介控制須配合，不能只噴一次藥便認定病毒消失。<\/p>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：系統觀、資源與病蟲整合、品質紀錄及與有機區別。<\/p>\n<ul>\n<li><strong>系統觀<\/strong><\/li>\n<li><strong>資源與病蟲整合<\/strong><\/li>\n<li><strong>品質紀錄及與有機區別<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把有機栽培理解成完全不防治。<\/li>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=28","md":"97年果樹學_逐題教學詳解.md","search":"ifp 基本原則 ## 第八題｜ifp 基本原則（10 分）\n\n### 題意與作答範圍\n\n本題重點：**ifp 基本原則**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=28)。\n\n### 先掌握答案\n\n以果園整體生態、品質、安全與經濟為核心，合理使用土地、品種、水肥和農藥，保護土壤、生物多樣性與天敵，配合監測、採後品質、記錄追溯和持續驗證。可在必要時合理使用化學資材，與有機驗證並非同義。\n\n### 原理拆解：為什麼會這樣？\n\n**先建立可預防的栽培條件**\n\n健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。\n\n**監測後再選處理**\n\n定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。\n\n**整合與追蹤效果**\n\n不同手段應互相相容，保護天敵並避免抗藥性累積。處理後確認受害是否降低，保存用藥、環境與採收紀錄；有機生產也須依規範使用資材，並不代表可以省略病蟲管理。\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡 l;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
