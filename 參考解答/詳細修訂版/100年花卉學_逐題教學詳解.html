ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 7 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"花卉學-100-一","s":"花卉學","y":100,"n":"一","t":"花色與色素","body":"<h2>第一題｜花色與色素（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>花色與色素<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=20\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>花青素提供紅紫藍，類胡蘿蔔素提供黃橙紅，甜菜色素在特定類群提供紅紫或黃，葉綠素提供綠；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先找色素，再找影響顯色的環境<\/strong><\/p>\n<p>花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。<\/p>\n<p><strong>同一色素也能呈不同顏色<\/strong><\/p>\n<p>液泡 pH、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 pH 不會不經生理過程就等於花瓣液泡 pH。<\/p>\n<p><strong>用可驗證的機制解釋栽培或育種操作<\/strong><\/p>\n<p>繡球花的藍色涉及鋁有效性與花器內的色素複合，需同時考慮品種與介質；藍玫瑰育種則涉及花青素生合成途徑、競爭酵素與細胞條件。不能只以「施酸肥」解釋所有藍花。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>花青素提供紅紫藍，類胡蘿蔔素提供黃橙紅，甜菜色素在特定類群提供紅紫或黃，葉綠素提供綠；<\/p>\n<p>基因、色素量、液泡 pH、金屬／共色、細胞形狀與分布，再加光溫和花齡形成不同花色。白色多缺色素且由散射呈現。<\/p>\n<p>花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。<\/p>\n<p>液泡 pH、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 pH 不會不經生理過程就等於花瓣液泡 pH。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同品種繡球在適合條件下，可因根域酸度影響鋁有效性而改變顯色；白花或缺乏相關色素能力的品種，不能保證以同一方法轉成藍花。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：色素與顏色、內外因、具體例。<\/p>\n<ul>\n<li><strong>色素與顏色<\/strong><\/li>\n<li><strong>內外因<\/strong><\/li>\n<li><strong>具體例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有黃花都歸因於花青素。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=20","md":"100年花卉學_逐題教學詳解.md","search":"花色與色素 ## 第一題｜花色與色素（15 分）\n\n### 題意與作答範圍\n\n本題重點：**花色與色素**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=20)。\n\n### 先掌握答案\n\n花青素提供紅紫藍，類胡蘿蔔素提供黃橙紅，甜菜色素在特定類群提供紅紫或黃，葉綠素提供綠；\n\n### 原理拆解：為什麼會這樣？\n\n**先找色素，再找影響顯色的環境**\n\n花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。\n\n**同一色素也能呈不同顏色**\n\n液泡 ph、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 ph 不會不經生理過程就等於花瓣液泡 ph。\n\n**用可驗證的機制解釋栽培或育種操作**\n\n繡球花的藍色涉及鋁有效性與花器內的色素複合，需同時考慮品種與介質；藍玫瑰育種則涉及花青素生合成途徑、競爭酵素與細胞條件。不能只以「施酸肥」解釋所有藍花。\n\n### 可直接練寫的完整答案\n\n花青素提供紅紫藍，類胡蘿蔔素提供黃橙紅，甜菜色素在特定類群提供紅紫或黃，葉綠素提供綠；\n\n基因、色素量、液泡 ph、金屬／共色、細胞形狀與分布，再加光溫和花齡形成不同花色。白色多缺色素且由散射呈現。\n\n花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。\n\n液泡 ph、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 ph 不會不經生理過程就等於花瓣液泡 ph。\n\n### 實例：把原理用在情境中\n\n同品種繡球在適合條件下，可因根域酸度影響鋁有效性而改變顯色；白花或缺乏相關色素能力的品種，不能保證以同一方法轉成藍花。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：色素與顏色、內外因、具體例。\n\n- **色素與顏色**\n- **內外因**\n- **具體例**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有黃花都歸因於花青素。\n 100 花卉學"},{"id":"花卉學-100-二","s":"花卉學","y":100,"n":"二","t":"多倍體育種與鑑定","body":"<h2>第二題｜多倍體育種與鑑定（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>多倍體育種與鑑定<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=20\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>以秋水仙素或 oryzalin 等抑制分裂紡錘體，使染色體複製後不能正常分離，可誘導倍加；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>以秋水仙素或 oryzalin 等抑制分裂紡錘體，使染色體複製後不能正常分離，可誘導倍加；<\/p>\n<p>處理萌芽點、種子或組培體後選存活者。用流式細胞儀測核 DNA、染色體計數確認，氣孔變大與密度降低僅作篩選。常見器官較大、厚葉、花大、節間短或生長慢，奇數倍體可不稔，但不是所有倍體都一定花更大。<\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：方法、機制、鑑別與園藝性狀限制。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=20","md":"100年花卉學_逐題教學詳解.md","search":"多倍體育種與鑑定 ## 第二題｜多倍體育種與鑑定（10 分）\n\n### 題意與作答範圍\n\n本題重點：**多倍體育種與鑑定**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=20)。\n\n### 先掌握答案\n\n以秋水仙素或 oryzalin 等抑制分裂紡錘體，使染色體複製後不能正常分離，可誘導倍加；\n\n### 原理拆解：為什麼會這樣？\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n### 可直接練寫的完整答案\n\n以秋水仙素或 oryzalin 等抑制分裂紡錘體，使染色體複製後不能正常分離，可誘導倍加；\n\n處理萌芽點、種子或組培體後選存活者。用流式細胞儀測核 dna、染色體計數確認，氣孔變大與密度降低僅作篩選。常見器官較大、厚葉、花大、節間短或生長慢，奇數倍體可不稔，但不是所有倍體都一定花更大。\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n### 實例：把原理用在情境中\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：方法、機制、鑑別與園藝性狀限制。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把轉入基因成功直接等同育成可商業化品種。\n 100 花卉學"},{"id":"花卉學-100-三","s":"花卉學","y":100,"n":"三","t":"三蘭開花習性與調控","body":"<h2>第三題｜三蘭開花習性與調控（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>三蘭開花習性與調控<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=20\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>蝴蝶蘭單莖生長，成熟葉腋生花梗，以適度降溫促抽梗；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>用限制來源分類<\/strong><\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p><strong>冬天的冷與春天的暖做不同工作<\/strong><\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<p><strong>技術必須對應真正瓶頸<\/strong><\/p>\n<p>摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。<\/p>\n<p><strong>設施先改變能量與物質交換<\/strong><\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p><strong>各因子必須一起管理<\/strong><\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<p><strong>控制成效要用植株與環境資料驗證<\/strong><\/p>\n<p>以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>蝴蝶蘭單莖生長，成熟葉腋生花梗，以適度降溫促抽梗；<\/p>\n<p>文心蘭複莖，成熟新生假球莖與側花梗節律相關，分批新芽、環境及品種可調花；<\/p>\n<p>春石斛在成熟莖節位開花，秋冬低溫及適度乾管理有助誘花，過氮高溫易高芽。都需足夠成熟度與碳源。<\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。<\/p>\n<p>臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：每種生長單位、開花位置、調控各約 5 分。<\/p>\n<ul>\n<li><strong>每種生長單位<\/strong><\/li>\n<li><strong>開花位置<\/strong><\/li>\n<li><strong>調控各約 5 分<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把需冷不足與萌芽後霜害混為同一問題。<\/li>\n<li>將溫室直接等同低溫環境。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=20","md":"100年花卉學_逐題教學詳解.md","search":"三蘭開花習性與調控 ## 第三題｜三蘭開花習性與調控（15 分）\n\n### 題意與作答範圍\n\n本題重點：**三蘭開花習性與調控**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=20)。\n\n### 先掌握答案\n\n蝴蝶蘭單莖生長，成熟葉腋生花梗，以適度降溫促抽梗；\n\n### 原理拆解：為什麼會這樣？\n\n**用限制來源分類**\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n**冬天的冷與春天的暖做不同工作**\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n**技術必須對應真正瓶頸**\n\n摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。\n\n**設施先改變能量與物質交換**\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n**各因子必須一起管理**\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n**控制成效要用植株與環境資料驗證**\n\n以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。\n\n### 可直接練寫的完整答案\n\n蝴蝶蘭單莖生長，成熟葉腋生花梗，以適度降溫促抽梗；\n\n文心蘭複莖，成熟新生假球莖與側花梗節律相關，分批新芽、環境及品種可調花；\n\n春石斛在成熟莖節位開花，秋冬低溫及適度乾管理有助誘花，過氮高溫易高芽。都需足夠成熟度與碳源。\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n### 實例：把原理用在情境中\n\n平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。\n\n臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：每種生長單位、開花位置、調控各約 5 分。\n\n- **每種生長單位**\n- **開花位置**\n- **調控各約 5 分**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把需冷不足與萌芽後霜害混為同一問題。\n- 將溫室直接等同低溫環境。\n 100 花卉學"},{"id":"花卉學-100-四","s":"花卉學","y":100,"n":"四","t":"切花保鮮液成分","body":"<h2>第四題｜切花保鮮液成分（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>切花保鮮液成分<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=20\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>蔗糖供呼吸與花蕾開放；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>切離後的水分與碳收支轉為赤字<\/strong><\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p><strong>不同處理各有明確功能<\/strong><\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<p><strong>採收成熟度與溫度決定後續品質上限<\/strong><\/p>\n<p>過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>蔗糖供呼吸與花蕾開放；<\/p>\n<p>抑菌劑降低微生物堵管；<\/p>\n<p>酸化劑改善吸水與抑菌；<\/p>\n<p>乙烯敏感花可加適用抗乙烯處理；<\/p>\n<p>依品種另用調節劑、濕潤成分等。應區分短時高濃度前處理與長期保持液，糖過高或缺抑菌會傷害並滋菌。<\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：至少四類與作用、前後處理差異。<\/p>\n<ul>\n<li><strong>至少四類與作用<\/strong><\/li>\n<li><strong>前後處理差異<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短時高濃度預措液與全程瓶插液視為相同用法。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=20","md":"100年花卉學_逐題教學詳解.md","search":"切花保鮮液成分 ## 第四題｜切花保鮮液成分（10 分）\n\n### 題意與作答範圍\n\n本題重點：**切花保鮮液成分**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=20)。\n\n### 先掌握答案\n\n蔗糖供呼吸與花蕾開放；\n\n### 原理拆解：為什麼會這樣？\n\n**切離後的水分與碳收支轉為赤字**\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n**不同處理各有明確功能**\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n**採收成熟度與溫度決定後續品質上限**\n\n過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。\n\n### 可直接練寫的完整答案\n\n蔗糖供呼吸與花蕾開放；\n\n抑菌劑降低微生物堵管；\n\n酸化劑改善吸水與抑菌；\n\n乙烯敏感花可加適用抗乙烯處理；\n\n依品種另用調節劑、濕潤成分等。應區分短時高濃度前處理與長期保持液，糖過高或缺抑菌會傷害並滋菌。\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n### 實例：把原理用在情境中\n\n百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：至少四類與作用、前後處理差異。\n\n- **至少四類與作用**\n- **前後處理差異**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短時高濃度預措液與全程瓶插液視為相同用法。\n 100 花卉學"},{"id":"花卉學-100-五","s":"花卉學","y":100,"n":"五","t":"花肥第四元素","body":"<h2>第五題｜花肥第四元素（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>花肥第四元素<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=20\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>許多花卉複合肥以 N-P₂O₅-K₂O-MgO 標示，第四項通常為鎂的氧化物當量。鎂為葉綠素中心元素、活化酵素並參與光合與糖運輸；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>第一步是分清吸收、運輸與需求<\/strong><\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p><strong>用新老葉位置推理<\/strong><\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<p><strong>最後必須用適當樣本驗證<\/strong><\/p>\n<p>依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>許多花卉複合肥以 N-P₂O₅-K₂O-MgO 標示，第四項通常為鎂的氧化物當量。鎂為葉綠素中心元素、活化酵素並參與光合與糖運輸；<\/p>\n<p>花卉高品質生產需健康葉片持續供碳。數字須依實際標籤確認，不能說所有第四數均固定相同。<\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：第四項與標示、鎂功能、花卉品質及過量拮抗。<\/p>\n<ul>\n<li><strong>第四項與標示<\/strong><\/li>\n<li><strong>鎂功能<\/strong><\/li>\n<li><strong>花卉品質及過量拮抗<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>只寫缺肥會黃葉，沒有指出葉齡與黃化分布。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=20","md":"100年花卉學_逐題教學詳解.md","search":"花肥第四元素 ## 第五題｜花肥第四元素（15 分）\n\n### 題意與作答範圍\n\n本題重點：**花肥第四元素**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=20)。\n\n### 先掌握答案\n\n許多花卉複合肥以 n-p₂o₅-k₂o-mgo 標示，第四項通常為鎂的氧化物當量。鎂為葉綠素中心元素、活化酵素並參與光合與糖運輸；\n\n### 原理拆解：為什麼會這樣？\n\n**第一步是分清吸收、運輸與需求**\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n**用新老葉位置推理**\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n**最後必須用適當樣本驗證**\n\n依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。\n\n### 可直接練寫的完整答案\n\n許多花卉複合肥以 n-p₂o₅-k₂o-mgo 標示，第四項通常為鎂的氧化物當量。鎂為葉綠素中心元素、活化酵素並參與光合與糖運輸；\n\n花卉高品質生產需健康葉片持續供碳。數字須依實際標籤確認，不能說所有第四數均固定相同。\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n### 實例：把原理用在情境中\n\n老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：第四項與標示、鎂功能、花卉品質及過量拮抗。\n\n- **第四項與標示**\n- **鎂功能**\n- **花卉品質及過量拮抗**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 只寫缺肥會黃葉，沒有指出葉齡與黃化分布。\n 100 花卉學"},{"id":"花卉學-100-六","s":"花卉學","y":100,"n":"六","t":"三種輸日切花與臺灣優勢","body":"<h2>第六題｜三種輸日切花與臺灣優勢（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>三種輸日切花與臺灣優勢<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=20\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>可舉文心蘭、火鶴花、洋桔梗。熱帶蘭與火鶴在臺灣具較暖氣候生產優勢，洋桔梗中南部冬季乾暖日照較佳，可在日本冬季加溫成本較高時供貨；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>設施先改變能量與物質交換<\/strong><\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p><strong>各因子必須一起管理<\/strong><\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<p><strong>控制成效要用植株與環境資料驗證<\/strong><\/p>\n<p>以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。<\/p>\n<p><strong>切離後的水分與碳收支轉為赤字<\/strong><\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p><strong>不同處理各有明確功能<\/strong><\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<p><strong>採收成熟度與溫度決定後續品質上限<\/strong><\/p>\n<p>過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>可舉文心蘭、火鶴花、洋桔梗。熱帶蘭與火鶴在臺灣具較暖氣候生產優勢，洋桔梗中南部冬季乾暖日照較佳，可在日本冬季加溫成本較高時供貨；<\/p>\n<p>鄰近市場、育苗與精細管理支援品質。仍須穩定規格、病蟲檢疫與保鮮，氣候優勢不代表自然能保證出口。<\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。<\/p>\n<p>百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：三作物、氣候季節與成本、品質物流。<\/p>\n<ul>\n<li><strong>三作物<\/strong><\/li>\n<li><strong>氣候季節與成本<\/strong><\/li>\n<li><strong>品質物流<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將溫室直接等同低溫環境。<\/li>\n<li>把短時高濃度預措液與全程瓶插液視為相同用法。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=20","md":"100年花卉學_逐題教學詳解.md","search":"三種輸日切花與臺灣優勢 ## 第六題｜三種輸日切花與臺灣優勢（10 分）\n\n### 題意與作答範圍\n\n本題重點：**三種輸日切花與臺灣優勢**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=20)。\n\n### 先掌握答案\n\n可舉文心蘭、火鶴花、洋桔梗。熱帶蘭與火鶴在臺灣具較暖氣候生產優勢，洋桔梗中南部冬季乾暖日照較佳，可在日本冬季加溫成本較高時供貨；\n\n### 原理拆解：為什麼會這樣？\n\n**設施先改變能量與物質交換**\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n**各因子必須一起管理**\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n**控制成效要用植株與環境資料驗證**\n\n以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。\n\n**切離後的水分與碳收支轉為赤字**\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n**不同處理各有明確功能**\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n**採收成熟度與溫度決定後續品質上限**\n\n過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。\n\n### 可直接練寫的完整答案\n\n可舉文心蘭、火鶴花、洋桔梗。熱帶蘭與火鶴在臺灣具較暖氣候生產優勢，洋桔梗中南部冬季乾暖日照較佳，可在日本冬季加溫成本較高時供貨；\n\n鄰近市場、育苗與精細管理支援品質。仍須穩定規格、病蟲檢疫與保鮮，氣候優勢不代表自然能保證出口。\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n### 實例：把原理用在情境中\n\n臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。\n\n百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：三作物、氣候季節與成本、品質物流。\n\n- **三作物**\n- **氣候季節與成本**\n- **品質物流**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將溫室直接等同低溫環境。\n- 把短時高濃度預措液與全程瓶插液視為相同用法。\n 100 花卉學"},{"id":"花卉學-100-七","s":"花卉學","y":100,"n":"七","t":"五組比較","body":"<h2>第七題｜五組比較（25 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五組比較<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=20\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>暗期中斷是在夜間用低光打斷長夜，循環電照是以間歇開關燈達光週期效應並節電；<\/p>\n<p>種子型春化可早期感冷，綠體型需一定苗齡；<\/p>\n<p>品種權保護合格新品種，衍生品種權涉及與原品種本質性衍生的權利關係，須依適用法制；<\/p>\n<p>換盆常去除部分舊介質並整根，升盆多連根團換大盆；<\/p>\n<p>繖房花序各小花梗由不同節位長短調整成平頂，繖形則從近同一點放射。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>低溫建立的是成花能力<\/strong><\/p>\n<p>春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。<\/p>\n<p><strong>反應取決品種與發育年齡<\/strong><\/p>\n<p>種子或幼苗可感受低溫的類型，與須先達一定大小的綠體春化型不同。低溫的有效程度受溫度、持續時間、植株大小及後續條件影響；未達感應能力時，長時間低溫也不一定得到同樣效果。<\/p>\n<p><strong>感應完成仍須完成花芽發育<\/strong><\/p>\n<p>春化後的日長、溫度與營養決定抽薹和花器發育。部分植物在特定條件下有去春化反應，不能把處理完成看成保證當日開花。生產上須將育苗、低溫與後續栽培排成完整時程。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>種子型春化可早期感冷，綠體型需一定苗齡；<\/td>\n<td>使植物獲得或增強成花能力，與打破芽休眠和單純冷藏保鮮不同。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>暗期中斷是在夜間用低光打斷長夜，循環電照是以間歇開關燈達光週期效應並節電；<\/p>\n<p>種子型春化可早期感冷，綠體型需一定苗齡；<\/p>\n<p>品種權保護合格新品種，衍生品種權涉及與原品種本質性衍生的權利關係，須依適用法制；<\/p>\n<p>換盆常去除部分舊介質並整根，升盆多連根團換大盆；<\/p>\n<p>繖房花序各小花梗由不同節位長短調整成平頂，繖形則從近同一點放射。<\/p>\n<p>春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>部分甘藍類須先長到足夠大小再受低溫，才能順利抽薹開花供採種；食用生產則要避免幼苗過早達感應大小後遇冷，以減少未熟抽薹。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>25 分：五組各 5 分，定義、差異及花卉例，權利題依當年法規。<\/p>\n<ul>\n<li><strong>五組各 5 分，定義<\/strong><\/li>\n<li><strong>差異及花卉例，權利題依當年法規<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把低溫解除休眠與低溫誘導成花當成同義。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=20","md":"100年花卉學_逐題教學詳解.md","search":"五組比較 ## 第七題｜五組比較（25 分）\n\n### 題意與作答範圍\n\n本題重點：**五組比較**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=20)。\n\n### 先掌握答案\n\n暗期中斷是在夜間用低光打斷長夜，循環電照是以間歇開關燈達光週期效應並節電；\n\n種子型春化可早期感冷，綠體型需一定苗齡；\n\n品種權保護合格新品種，衍生品種權涉及與原品種本質性衍生的權利關係，須依適用法制；\n\n換盆常去除部分舊介質並整根，升盆多連根團換大盆；\n\n繖房花序各小花梗由不同節位長短調整成平頂，繖形則從近同一點放射。\n\n### 原理拆解：為什麼會這樣？\n\n**低溫建立的是成花能力**\n\n春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。\n\n**反應取決品種與發育年齡**\n\n種子或幼苗可感受低溫的類型，與須先達一定大小的綠體春化型不同。低溫的有效程度受溫度、持續時間、植株大小及後續條件影響；未達感應能力時，長時間低溫也不一定得到同樣效果。\n\n**感應完成仍須完成花芽發育**\n\n春化後的日長、溫度與營養決定抽薹和花器發育。部分植物在特定條件下有去春化反應，不能把處理完成看成保證當日開花。生產上須將育苗、低溫與後續栽培排成完整時程。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| 種子型春化可早期感冷，綠體型需一定苗齡； | 使植物獲得或增強成花能力，與打破芽休眠和單純冷藏保鮮不同。 |\n\n### 可直接練寫的完整答案\n\n暗期中斷是在夜間用低光打斷長夜，循環電照是以間歇開關燈達光週期效應並節電；\n\n種子型春化可早期感冷，綠體型需一定苗齡；\n\n品種權保護合格新品種，衍生品種權涉及與原品種本質性衍生的權利關係，須依適用法制；\n\n換盆常去除部分舊介質並整根，升盆多連根團換大盆；\n\n繖房花序各小花梗由不同節位長短調整成平頂，繖形則從近同一點放射。\n\n春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。\n\n### 實例：把原理用在情境中\n\n部分甘藍類須先長到足夠大小再受低溫，才能順利抽薹開花供採種；食用生產則要避免幼苗過早達感應大小後遇冷，以減少未熟抽薹。\n\n### 配分重點：哪些內容不能漏？\n\n25 分：五組各 5 分，定義、差異及花卉例，權利題依當年法規。\n\n- **五組各 5 分，定義**\n- **差異及花卉例，權利題依當年法規**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把低溫解除休眠與低溫誘導成花當成同義。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 100 花卉學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
