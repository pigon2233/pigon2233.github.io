ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 10 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"果樹學-100-一","s":"果樹學","y":100,"n":"一","t":"五名詞","body":"<h2>第一題｜五名詞（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=19\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Biochemical diagnosis 生化診斷，以特定酵素、代謝物等判斷營養或生理狀態；<\/p>\n<p>H⁺ pump 質子幫浦，利用能量建立電化學梯度；<\/p>\n<p>D-leaf 鳳梨 D 葉為最年輕的充分成熟葉群中代表性的長葉，常用營養診斷；<\/p>\n<p>symplast transport 共質體運輸經胞質胞間連絲；<\/p>\n<p>transfer cell 轉運細胞具壁內突增膜面積，利物質交換。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把源與庫接起來<\/strong><\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<p><strong>壓力流與跨膜運輸不是同一層次<\/strong><\/p>\n<p>源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；H⁺-ATPase 建立電化學梯度，可支援 H⁺／蔗糖共運輸。<\/p>\n<p><strong>庫強決定競爭，不只看果實大小<\/strong><\/p>\n<p>庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>symplast transport 共質體運輸經胞質胞間連絲；<\/td>\n<td>胞間連絲連通活細胞細胞質，與細胞壁及細胞間隙的質外體路徑不同。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Biochemical diagnosis 生化診斷，以特定酵素、代謝物等判斷營養或生理狀態；<\/p>\n<p>H⁺ pump 質子幫浦，利用能量建立電化學梯度；<\/p>\n<p>D-leaf 鳳梨 D 葉為最年輕的充分成熟葉群中代表性的長葉，常用營養診斷；<\/p>\n<p>symplast transport 共質體運輸經胞質胞間連絲；<\/p>\n<p>transfer cell 轉運細胞具壁內突增膜面積，利物質交換。<\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：五項各 2 分，D 葉須說用途，幫浦與轉運細胞須說功能。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把長距離糖運輸寫成主要沿木質部。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=19","md":"100年果樹學_逐題教學詳解.md","search":"五名詞 ## 第一題｜五名詞（10 分）\n\n### 題意與作答範圍\n\n本題重點：**五名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=19)。\n\n### 先掌握答案\n\nbiochemical diagnosis 生化診斷，以特定酵素、代謝物等判斷營養或生理狀態；\n\nh⁺ pump 質子幫浦，利用能量建立電化學梯度；\n\nd-leaf 鳳梨 d 葉為最年輕的充分成熟葉群中代表性的長葉，常用營養診斷；\n\nsymplast transport 共質體運輸經胞質胞間連絲；\n\ntransfer cell 轉運細胞具壁內突增膜面積，利物質交換。\n\n### 原理拆解：為什麼會這樣？\n\n**先把源與庫接起來**\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n**壓力流與跨膜運輸不是同一層次**\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n**庫強決定競爭，不只看果實大小**\n\n庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| symplast transport 共質體運輸經胞質胞間連絲； | 胞間連絲連通活細胞細胞質，與細胞壁及細胞間隙的質外體路徑不同。 |\n\n### 可直接練寫的完整答案\n\nbiochemical diagnosis 生化診斷，以特定酵素、代謝物等判斷營養或生理狀態；\n\nh⁺ pump 質子幫浦，利用能量建立電化學梯度；\n\nd-leaf 鳳梨 d 葉為最年輕的充分成熟葉群中代表性的長葉，常用營養診斷；\n\nsymplast transport 共質體運輸經胞質胞間連絲；\n\ntransfer cell 轉運細胞具壁內突增膜面積，利物質交換。\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n### 實例：把原理用在情境中\n\n同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：五項各 2 分，d 葉須說用途，幫浦與轉運細胞須說功能。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把長距離糖運輸寫成主要沿木質部。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 100 果樹學"},{"id":"果樹學-100-二","s":"果樹學","y":100,"n":"二","t":"缺硼與授粉受精","body":"<h2>第二題｜缺硼與授粉受精（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>缺硼與授粉受精<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=19\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>可舉番木瓜葉柄裂、瘤果與柑橘硬果、膠化；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>缺硼先傷哪些功能<\/strong><\/p>\n<p>硼參與細胞壁穩定及分生組織發育，亦影響花粉萌發、花粉管伸長與受精。缺乏時幼嫩組織生長不正常，可見脆裂、頂芽受損或果實凹凸，生殖器官也可能先失去功能而減少著果。<\/p>\n<p><strong>為何水分與土壤也重要<\/strong><\/p>\n<p>硼供應受土壤有效性、根域 pH、含水及根系活力影響。乾旱可使根吸收與輸送不足，土中有硼不代表發育部位已收到。硼在體內的再移動依物種而異，具多元醇運輸的部分果樹不能套用完全不移動的規則。<\/p>\n<p><strong>診斷與補充的界線<\/strong><\/p>\n<p>以作物、葉齡、裂柄流膠及果實畸形的組合建立判斷，配土葉分析排除病毒、藥害與鈣問題。硼的缺乏與毒害範圍較窄，補充應少量、均勻、依建議執行；過量也會造成葉片壞死，不能把所有裂果一律用硼處理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>可舉番木瓜葉柄裂、瘤果與柑橘硬果、膠化；<\/p>\n<p>硼不足使花粉生活力、萌芽及花粉管伸長受抑，降低受精與種子形成，繼而影響著果。應改善根域並按分析補硼，授粉樹配置與昆蟲活動亦須同時確認。<\/p>\n<p>硼參與細胞壁穩定及分生組織發育，亦影響花粉萌發、花粉管伸長與受精。缺乏時幼嫩組織生長不正常，可見脆裂、頂芽受損或果實凹凸，生殖器官也可能先失去功能而減少著果。<\/p>\n<p>硼供應受土壤有效性、根域 pH、含水及根系活力影響。乾旱可使根吸收與輸送不足，土中有硼不代表發育部位已收到。硼在體內的再移動依物種而異，具多元醇運輸的部分果樹不能套用完全不移動的規則。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>番木瓜若同時有新葉脆、葉柄龜裂流膠與瘤果，比只有一個果實畸形更支持缺硼；若全園只有單株葉斑，則須更重視局部根病或感染性問題。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：兩種果樹徵狀、花粉與花粉管、受精著果。<\/p>\n<ul>\n<li><strong>兩種果樹徵狀<\/strong><\/li>\n<li><strong>花粉與花粉管<\/strong><\/li>\n<li><strong>受精著果<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有硬果、空心或裂果都直接診斷成缺硼。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=19","md":"100年果樹學_逐題教學詳解.md","search":"缺硼與授粉受精 ## 第二題｜缺硼與授粉受精（10 分）\n\n### 題意與作答範圍\n\n本題重點：**缺硼與授粉受精**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=19)。\n\n### 先掌握答案\n\n可舉番木瓜葉柄裂、瘤果與柑橘硬果、膠化；\n\n### 原理拆解：為什麼會這樣？\n\n**缺硼先傷哪些功能**\n\n硼參與細胞壁穩定及分生組織發育，亦影響花粉萌發、花粉管伸長與受精。缺乏時幼嫩組織生長不正常，可見脆裂、頂芽受損或果實凹凸，生殖器官也可能先失去功能而減少著果。\n\n**為何水分與土壤也重要**\n\n硼供應受土壤有效性、根域 ph、含水及根系活力影響。乾旱可使根吸收與輸送不足，土中有硼不代表發育部位已收到。硼在體內的再移動依物種而異，具多元醇運輸的部分果樹不能套用完全不移動的規則。\n\n**診斷與補充的界線**\n\n以作物、葉齡、裂柄流膠及果實畸形的組合建立判斷，配土葉分析排除病毒、藥害與鈣問題。硼的缺乏與毒害範圍較窄，補充應少量、均勻、依建議執行；過量也會造成葉片壞死，不能把所有裂果一律用硼處理。\n\n### 可直接練寫的完整答案\n\n可舉番木瓜葉柄裂、瘤果與柑橘硬果、膠化；\n\n硼不足使花粉生活力、萌芽及花粉管伸長受抑，降低受精與種子形成，繼而影響著果。應改善根域並按分析補硼，授粉樹配置與昆蟲活動亦須同時確認。\n\n硼參與細胞壁穩定及分生組織發育，亦影響花粉萌發、花粉管伸長與受精。缺乏時幼嫩組織生長不正常，可見脆裂、頂芽受損或果實凹凸，生殖器官也可能先失去功能而減少著果。\n\n硼供應受土壤有效性、根域 ph、含水及根系活力影響。乾旱可使根吸收與輸送不足，土中有硼不代表發育部位已收到。硼在體內的再移動依物種而異，具多元醇運輸的部分果樹不能套用完全不移動的規則。\n\n### 實例：把原理用在情境中\n\n番木瓜若同時有新葉脆、葉柄龜裂流膠與瘤果，比只有一個果實畸形更支持缺硼；若全園只有單株葉斑，則須更重視局部根病或感染性問題。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：兩種果樹徵狀、花粉與花粉管、受精著果。\n\n- **兩種果樹徵狀**\n- **花粉與花粉管**\n- **受精著果**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有硬果、空心或裂果都直接診斷成缺硼。\n 100 果樹學"},{"id":"果樹學-100-三","s":"果樹學","y":100,"n":"三","t":"養液銨硝比與 ppm 計算","body":"<h2>第三題｜養液銨硝比與 ppm 計算（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>養液銨硝比與 ppm 計算<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=19\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>最終總氮 15000 μM＝15 mmol/L。NH₄-N 20%＝3 mmol/L；<\/p>\n<p>(NH₄)₂SO₄ 每 mol 有 2 mol N，所以需 1 M 母液 1.5 mL/L。NO₃-N 80%＝12 mmol/L；<\/p>\n<p>1 M KNO₃ 需 12 mL/L。先加部分水、量取兩母液，再定容至 1 L，並非加入 1 L 水後不管體積。總 N＝0.015 mol/L×14 g/mol＝0.210 g/L＝210 mg/L≈210 ppm。原題 K 原子量印 49 不影響這種以莫耳濃度進行的計算。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先寫定義與單位再代數字<\/strong><\/p>\n<p>肥料百分率是重量基準，N 直接以元素量標示，磷與鉀通常以 P₂O₅、K₂O 表示；莫耳濃度則須分清一莫耳化合物含幾莫耳目標元素。題目單位不同，公式不可直接共用。<\/p>\n<p><strong>保留換算比例才能檢查<\/strong><\/p>\n<p>氧化物換元素用元素在該化學式的質量比例；母液稀釋先算目標莫耳數再除以母液濃度。DIF 用日溫減夜溫，均溫則按時數加權，pF 使用以公分水柱表示的壓力頭取常用對數。<\/p>\n<p><strong>答案需列假設與合理位數<\/strong><\/p>\n<p>先顯示式子，後列數值和單位。原題若原子量誤植或缺少盆徑與冠幅比例等條件，應說明正確知識及缺少的假設，不能以一個看似精確的數字掩蓋資訊不足。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>以下依各小題順序列公式、代入與結果：<\/p>\n<p>最終總氮 15000 μM＝15 mmol/L。NH₄-N 20%＝3 mmol/L；<\/p>\n<p>(NH₄)₂SO₄ 每 mol 有 2 mol N，所以需 1 M 母液 1.5 mL/L。NO₃-N 80%＝12 mmol/L；<\/p>\n<p>1 M KNO₃ 需 12 mL/L。先加部分水、量取兩母液，再定容至 1 L，並非加入 1 L 水後不管體積。總 N＝0.015 mol/L×14 g/mol＝0.210 g/L＝210 mg/L≈210 ppm。原題 K 原子量印 49 不影響這種以莫耳濃度進行的計算。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>15% P₂O₅ 不等於 15% 元素磷：需乘 62/142；15% K₂O 轉元素鉀需乘 78/94。只有標示 N 可直接以其百分率計算元素氮。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：氮莫耳、兩母液體積、定容與 210 ppm，注意硫酸銨的兩個 N。<\/p>\n<ul>\n<li><strong>氮莫耳<\/strong><\/li>\n<li><strong>兩母液體積<\/strong><\/li>\n<li><strong>定容與 210 ppm，注意硫酸銨的兩個 N<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把 P₂O₅ 的重量直接當成元素磷。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=19","md":"100年果樹學_逐題教學詳解.md","search":"養液銨硝比與 ppm 計算 ## 第三題｜養液銨硝比與 ppm 計算（10 分）\n\n### 題意與作答範圍\n\n本題重點：**養液銨硝比與 ppm 計算**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=19)。\n\n### 先掌握答案\n\n最終總氮 15000 μm＝15 mmol/l。nh₄-n 20%＝3 mmol/l；\n\n(nh₄)₂so₄ 每 mol 有 2 mol n，所以需 1 m 母液 1.5 ml/l。no₃-n 80%＝12 mmol/l；\n\n1 m kno₃ 需 12 ml/l。先加部分水、量取兩母液，再定容至 1 l，並非加入 1 l 水後不管體積。總 n＝0.015 mol/l×14 g/mol＝0.210 g/l＝210 mg/l≈210 ppm。原題 k 原子量印 49 不影響這種以莫耳濃度進行的計算。\n\n### 原理拆解：為什麼會這樣？\n\n**先寫定義與單位再代數字**\n\n肥料百分率是重量基準，n 直接以元素量標示，磷與鉀通常以 p₂o₅、k₂o 表示；莫耳濃度則須分清一莫耳化合物含幾莫耳目標元素。題目單位不同，公式不可直接共用。\n\n**保留換算比例才能檢查**\n\n氧化物換元素用元素在該化學式的質量比例；母液稀釋先算目標莫耳數再除以母液濃度。dif 用日溫減夜溫，均溫則按時數加權，pf 使用以公分水柱表示的壓力頭取常用對數。\n\n**答案需列假設與合理位數**\n\n先顯示式子，後列數值和單位。原題若原子量誤植或缺少盆徑與冠幅比例等條件，應說明正確知識及缺少的假設，不能以一個看似精確的數字掩蓋資訊不足。\n\n### 可直接練寫的完整答案\n\n以下依各小題順序列公式、代入與結果：\n\n最終總氮 15000 μm＝15 mmol/l。nh₄-n 20%＝3 mmol/l；\n\n(nh₄)₂so₄ 每 mol 有 2 mol n，所以需 1 m 母液 1.5 ml/l。no₃-n 80%＝12 mmol/l；\n\n1 m kno₃ 需 12 ml/l。先加部分水、量取兩母液，再定容至 1 l，並非加入 1 l 水後不管體積。總 n＝0.015 mol/l×14 g/mol＝0.210 g/l＝210 mg/l≈210 ppm。原題 k 原子量印 49 不影響這種以莫耳濃度進行的計算。\n\n### 實例：把原理用在情境中\n\n15% p₂o₅ 不等於 15% 元素磷：需乘 62/142；15% k₂o 轉元素鉀需乘 78/94。只有標示 n 可直接以其百分率計算元素氮。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：氮莫耳、兩母液體積、定容與 210 ppm，注意硫酸銨的兩個 n。\n\n- **氮莫耳**\n- **兩母液體積**\n- **定容與 210 ppm，注意硫酸銨的兩個 n**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把 p₂o₅ 的重量直接當成元素磷。\n 100 果樹學"},{"id":"果樹學-100-四","s":"果樹學","y":100,"n":"四","t":"香蕉綠熟期採收","body":"<h2>第四題｜香蕉綠熟期採收（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>香蕉綠熟期採收<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=19\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>綠熟香蕉已達能正常後熟的生理成熟，但尚未進入快速軟化轉色，可保留足夠綠熟壽命供包裝海運並在目的地整齊催熟。太早採會不正常後熟、風味與果重不足；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>成熟反應與乙烯感受<\/strong><\/p>\n<p>乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。<\/p>\n<p><strong>更年性與非更年性要比較反應型態<\/strong><\/p>\n<p>具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。<\/p>\n<p><strong>催熟與延後成熟都不能忽略品質<\/strong><\/p>\n<p>乙烯可整齊催熟已達生理成熟的果，卻不能讓極幼果補足田間累積不足的乾物；1-MCP 阻斷感受可延緩部分產品老化，但過強處理可能影響正常後熟。脫綠、果肉軟化和增甜亦不是必然同步。<\/p>\n<p><strong>為何採後仍會變差<\/strong><\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p><strong>低溫有效，但有適用範圍<\/strong><\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<p><strong>把全程串起來<\/strong><\/p>\n<p>採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>綠熟香蕉已達能正常後熟的生理成熟，但尚未進入快速軟化轉色，可保留足夠綠熟壽命供包裝海運並在目的地整齊催熟。太早採會不正常後熟、風味與果重不足；<\/p>\n<p>過晚採易在途催熟、擦傷腐爛。七分半是商業俗稱，需配果指飽滿度、稜角、果徑及開花後日數。<\/p>\n<p>乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。<\/p>\n<p>具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>香蕉在不當高溫下，果肉可軟化而果皮仍綠，顯示果肉成熟與葉綠素降解可不同步。不能僅看果皮未黃，就判斷乙烯完全沒有作用。<\/p>\n<p>驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：成熟能力、green life、過早過晚後果、具體指標。<\/p>\n<ul>\n<li><strong>成熟能力<\/strong><\/li>\n<li><strong>green life<\/strong><\/li>\n<li><strong>過早過晚後果<\/strong><\/li>\n<li><strong>具體指標<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>說非更年性果實完全不會回應乙烯。<\/li>\n<li>認為溫度越低、保存效果一定越好。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=19","md":"100年果樹學_逐題教學詳解.md","search":"香蕉綠熟期採收 ## 第四題｜香蕉綠熟期採收（10 分）\n\n### 題意與作答範圍\n\n本題重點：**香蕉綠熟期採收**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=19)。\n\n### 先掌握答案\n\n綠熟香蕉已達能正常後熟的生理成熟，但尚未進入快速軟化轉色，可保留足夠綠熟壽命供包裝海運並在目的地整齊催熟。太早採會不正常後熟、風味與果重不足；\n\n### 原理拆解：為什麼會這樣？\n\n**成熟反應與乙烯感受**\n\n乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。\n\n**更年性與非更年性要比較反應型態**\n\n具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。\n\n**催熟與延後成熟都不能忽略品質**\n\n乙烯可整齊催熟已達生理成熟的果，卻不能讓極幼果補足田間累積不足的乾物；1-mcp 阻斷感受可延緩部分產品老化，但過強處理可能影響正常後熟。脫綠、果肉軟化和增甜亦不是必然同步。\n\n**為何採後仍會變差**\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n**低溫有效，但有適用範圍**\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n**把全程串起來**\n\n採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。\n\n### 可直接練寫的完整答案\n\n綠熟香蕉已達能正常後熟的生理成熟，但尚未進入快速軟化轉色，可保留足夠綠熟壽命供包裝海運並在目的地整齊催熟。太早採會不正常後熟、風味與果重不足；\n\n過晚採易在途催熟、擦傷腐爛。七分半是商業俗稱，需配果指飽滿度、稜角、果徑及開花後日數。\n\n乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。\n\n具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。\n\n### 實例：把原理用在情境中\n\n香蕉在不當高溫下，果肉可軟化而果皮仍綠，顯示果肉成熟與葉綠素降解可不同步。不能僅看果皮未黃，就判斷乙烯完全沒有作用。\n\n驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：成熟能力、green life、過早過晚後果、具體指標。\n\n- **成熟能力**\n- **green life**\n- **過早過晚後果**\n- **具體指標**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 說非更年性果實完全不會回應乙烯。\n- 認為溫度越低、保存效果一定越好。\n 100 果樹學"},{"id":"果樹學-100-五","s":"果樹學","y":100,"n":"五","t":"香蕉外銷運輸","body":"<h2>第五題｜香蕉外銷運輸（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>香蕉外銷運輸<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=19\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>適熟採收並避免拉扯、擦傷；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>為何採後仍會變差<\/strong><\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p><strong>低溫有效，但有適用範圍<\/strong><\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<p><strong>把全程串起來<\/strong><\/p>\n<p>採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>適熟採收並避免拉扯、擦傷；<\/p>\n<p>除軸、清洗去乳汁、分級與核准防病處理，使用緩衝袋箱及適量透氣。迅速降至不致寒害且抑後熟的溫度（常約 13–14°C，依品種批次），維持高濕、通風與冷鏈，防乙烯污染與溫度波動；<\/p>\n<p>抵港再受控催熟。<\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：防傷防病、包裝、適溫、乙烯與抵港。<\/p>\n<ul>\n<li><strong>防傷防病<\/strong><\/li>\n<li><s <\/p>\n<p>乙烯可整齊催熟已達生理成熟的果，卻不能讓極幼果補足田間累積不足的乾物；1-MCP 阻斷感受可延緩部分產品老化，但過強處理可能影響正常後熟。脫綠、果肉軟化和增甜亦不是必然同步。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>典型可因催熟溫度偏高，使果肉軟化、澱粉分解照常進行，但果皮葉綠素降解受抑，出現綠熟；<\/p>\n<p>也需查過低溫寒害、果齡或催熟條件失衡。應檢視果心溫、通風、乙烯與 CO₂，採適宜催熟溫度，不以延長高溫處理補救。<\/p>\n<p>乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。<\/p>\n<p>具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>香蕉在不當高溫下，果肉可軟化而果皮仍綠，顯示果肉成熟與葉綠素降解可不同步。不能僅看果皮未黃，就判斷乙烯完全沒有作用。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：軟化與脫綠分離、高溫主因、鑑別及改善。<\/p>\n<ul>\n<li><strong>軟化與脫綠分離<\/strong><\/li>\n<li><strong>高溫主因<\/strong><\/li>\n<li><strong>鑑別及改善<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>說非更年性果實完全不會回應乙烯。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=19","md":"100年果樹學_逐題教學詳解.md","search":"香蕉軟熟仍綠 ## 第六題｜香蕉軟熟仍綠（10 分）\n\n### 題意與作答範圍\n\n本題重點：**香蕉軟熟仍綠**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=19)。\n\n### 先掌握答案\n\n典型可因催熟溫度偏高，使果肉軟化、澱粉分解照常進行，但果皮葉綠素降解受抑，出現綠熟；\n\n### 原理拆解：為什麼會這樣？\n\n**成熟反應與乙烯感受**\n\n乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。\n\n**更年性與非更年性要比較反應型態**\n\n具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。\n\n**催熟與延後成熟都不能忽略品質**\n\n乙烯可整齊催熟已達生理成熟的果，卻不能讓極幼果補足田間累積不足的乾物；1-mcp 阻斷感受可延緩部分產品老化，但過強處理可能影響正常後熟。脫綠、果肉軟化和增甜亦不是必然同步。\n\n### 可直接練寫的完整答案\n\n典型可因催熟溫度偏高，使果肉軟化、澱粉分解照常進行，但果皮葉綠素降解受抑，出現綠熟；\n\n也需查過低溫寒害、果齡或催熟條件失衡。應檢視果心溫、通風、乙烯與 co₂，採適宜催熟溫度，不以延長高溫處理補救。\n\n乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。\n\n具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。\n\n### 實例：把原理用在情境中\n\n香蕉在不當高溫下，果肉可軟化而果皮仍綠，顯示果肉成熟與葉綠素降解可不同步。不能僅看果皮未黃，就判斷乙烯完全沒有作用。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：軟化與脫綠分離、高溫主因、鑑別及改善。\n\n- **軟化與脫綠分離**\n- **高溫主因**\n- **鑑別及改善**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 說非更年性果實完全不會回應乙烯。\n 100 果樹學"},{"id":"果樹學-100-七","s":"果樹學","y":100,"n":"七","t":"IPM","body":"<h2>第七題｜IPM（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>IPM<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=19\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>先監測病蟲與天敵、正確鑑定及判斷經濟危害，再以健康苗、清園、抗性、物理阻隔與生物防治優先，必要時選擇性藥劑適期處理、輪替機制並記錄效果。須兼顧農民收益、殘留、環境和抗藥性。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先建立可預防的栽培條件<\/strong><\/p>\n<p>健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。<\/p>\n<p><strong>監測後再選處理<\/strong><\/p>\n<p>定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。<\/p>\n<p><strong>整合與追蹤效果<\/strong><\/p>\n<p>不同手段應互相相容，保護天敵並避免抗藥性累積。處理後確認受害是否降低，保存用藥、環境與採收紀錄；有機生產也須依規範使用資材，並不代表可以省略病蟲管理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>先監測病蟲與天敵、正確鑑定及判斷經濟危害，再以健康苗、清園、抗性、物理阻隔與生物防治優先，必要時選擇性藥劑適期處理、輪替機制並記錄效果。須兼顧農民收益、殘留、環境和抗藥性。<\/p>\n<p>健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。<\/p>\n<p>定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>番茄管理可由健康苗、防蟲設施與田間監測降低媒介昆蟲傳播病毒的機會；已感染植株的處置與媒介控制須配合，不能只噴一次藥便認定病毒消失。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：監測門檻、整合方法、用藥原則與評估。<\/p>\n<ul>\n<li><strong>監測門檻<\/strong><\/li>\n<li><strong>整合方法<\/strong><\/li>\n<li><strong>用藥原則與評估<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把有機栽培理解成完全不防治。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=19","md":"100年果樹學_逐題教學詳解.md","search":"ipm ## 第七題｜ipm（10 分）\n\n### 題意與作答範圍\n\n本題重點：**ipm**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=19)。\n\n### 先掌握答案\n\n先監測病蟲與天敵、正確鑑定及判斷經濟危害，再以健康苗、清園、抗性、物理阻隔與生物防治優先，必要時選擇性藥劑適期處理、輪替機制並記錄效果。須兼顧農民收益、殘留、環境和抗藥性。\n\n### 原理拆解：為什麼會這樣？\n\n**先建立可預防的栽培條件**\n\n健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。\n\n**監測後再選處理**\n\n定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。\n\n**整合與追蹤效果**\n\n不同手段應互相相容，保護天敵並避免抗藥性累積。處理後確認受害是否降低，保存用藥、環境與採收紀錄；有機生產也須依規範使用資材，並不代表可以省略病蟲管理。\n\n### 可直接練寫的完整答案\n\n先監測病蟲與天敵、正確鑑定及判斷經濟危害，再以健康苗、清園、抗性、物理阻隔與生物防治優先，必要時選擇性藥劑適期處理、輪替機制並記錄效果。須兼顧農民收益、殘留、環境和抗藥性。\n\n健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。\n\n定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。\n\n### 實例：把原理用在情境中\n\n番茄管理可由健康苗、防蟲設施與田間監測降低媒介昆蟲傳播病毒的機會；已感染植株的處置與媒介控制須配合，不能只噴一次藥便認定病毒消失。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：監測門檻、整合方法、用藥原則與評估。\n\n- **監測門檻**\n- **整合方法**\n- **用藥原則與評估**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把有機栽培理解成完全不防治。\n 100 果樹學"},{"id":"果樹學-100-八","s":"果樹學","y":100,"n":"八","t":"無子機制與葡萄處理","body":"<h2>第八題｜無子機制與葡萄處理（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>無子機制與葡萄處理<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=19\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>單為結果沒有受精；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先問有沒有受精<\/strong><\/p>\n<p>單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。<\/p>\n<p><strong>為何沒有正常種子仍能結果<\/strong><\/p>\n<p>正常發育種子會提供或誘導支持子房生長的激素訊號。遺傳性單為結果或外施調節劑可在缺乏受精時提供相似支持；種子敗育型則可能在初期已建立足以使果實繼續生長的條件。<\/p>\n<p><strong>無子化與膨大必須分開思考<\/strong><\/p>\n<p>有子葡萄的無子化須依品種、花期以合適處理影響種子形成，花後可能另需促果粒膨大。時機錯誤會落果、穗軸或果粒異常；不能給一個濃度宣稱適用所有葡萄。無融合生殖是無正常有性受精而產胚，仍可有種子，並非同義詞。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>單為結果沒有受精；<\/p>\n<p>種子敗育型是受精後種胚敗育。有子葡萄依品種在適當花期用 GA₃ 誘無子化，花後另用適當處理促果粒膨大，再整穗、疏粒及調葉果比。不能把無子化和膨大混成同一天的通用配方。<\/p>\n<p>單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。<\/p>\n<p>正常發育種子會提供或誘導支持子房生長的激素訊號。遺傳性單為結果或外施調節劑可在缺乏受精時提供相似支持；種子敗育型則可能在初期已建立足以使果實繼續生長的條件。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>栽培香蕉可用作單為結果例，許多無子葡萄作種子敗育例；柑橘珠心胚說明無融合生殖可產生帶胚種子，三者不能互換。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：兩機制、具名品種用途、花期與花後處理差異。<\/p>\n<ul>\n<li><strong>兩機制<\/strong><\/li>\n<li><strong>具名品種用途<\/strong><\/li>\n<li><strong>花期與花後處理差異<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有無子葡萄都說成未曾受精。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=19","md":"100年果樹學_逐題教學詳解.md","search":"無子機制與葡萄處理 ## 第八題｜無子機制與葡萄處理（10 分）\n\n### 題意與作答範圍\n\n本題重點：**無子機制與葡萄處理**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=19)。\n\n### 先掌握答案\n\n單為結果沒有受精；\n\n### 原理拆解：為什麼會這樣？\n\n**先問有沒有受精**\n\n單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。\n\n**為何沒有正常種子仍能結果**\n\n正常發育種子會提供或誘導支持子房生長的激素訊號。遺傳性單為結果或外施調節劑可在缺乏受精時提供相似支持；種子敗育型則可能在初期已建立足以使果實繼續生長的條件。\n\n**無子化與膨大必須分開思考**\n\n有子葡萄的無子化須依品種、花期以合適處理影響種子形成，花後可能另需促果粒膨大。時機錯誤會落果、穗軸或果粒異常；不能給一個濃度宣稱適用所有葡萄。無融合生殖是無正常有性受精而產胚，仍可有種子，並非同義詞。\n\n### 可直接練寫的完整答案\n\n單為結果沒有受精；\n\n種子敗育型是受精後種胚敗育。有子葡萄依品種在適當花期用 ga₃ 誘無子化，花後另用適當處理促果粒膨大，再整穗、疏粒及調葉果比。不能把無子化和膨大混成同一天的通用配方。\n\n單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。\n\n正常發育種子會提供或誘導支持子房生長的激素訊號。遺傳性單為結果或外施調節劑可在缺乏受精時提供相似支持；種子敗育型則可能在初期已建立足以使果實繼續生長的條件。\n\n### 實例：把原理用在情境中\n\n栽培香蕉可用作單為結果例，許多無子葡萄作種子敗育例；柑橘珠心胚說明無融合生殖可產生帶胚種子，三者不能互換。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：兩機制、具名品種用途、花期與花後處理差異。\n\n- **兩機制**\n- **具名品種用途**\n- **花期與花後處理差異**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有無子葡萄都說成未曾受精。\n 100 果樹學"},{"id":"果樹學-100-九","s":"果樹學","y":100,"n":"九","t":"果樹育種困難與標誌","body":"<h2>第九題｜果樹育種困難與標誌（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>果樹育種困難與標誌<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=19\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>多年生世代長、幼年期長、株體大、雜合及不親和，需龐大土地且果實品質必須等結果後判斷。標誌可做親本鑑定、幼苗早選、抗性基因聚合與回交背景選拔，減少無效個體；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<p><strong>標誌提供基因型線索<\/strong><\/p>\n<p>分子標誌是可檢測的 DNA 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 MAS 與基因轉殖的操作與法規概念不同。<\/p>\n<p><strong>連鎖不等於永遠不分離<\/strong><\/p>\n<p>若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。<\/p>\n<p><strong>回交可兼顧前景與背景選拔<\/strong><\/p>\n<p>前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。MAS 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>多年生世代長、幼年期長、株體大、雜合及不親和，需龐大土地且果實品質必須等結果後判斷。標誌可做親本鑑定、幼苗早選、抗性基因聚合與回交背景選拔，減少無效個體；<\/p>\n<p>多基因風味、產量仍須多年田間與採後試驗。<\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<p>抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：至少三困難、對應標誌用途與限制。<\/p>\n<ul>\n<li><strong>至少三困難<\/strong><\/li>\n<li><strong>對應標誌用途與限制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<li>把分子標誌說成施用後使植物產生抗性的藥劑。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=19","md":"100年果樹學_逐題教學詳解.md","search":"果樹育種困難與標誌 ## 第九題｜果樹育種困難與標誌（10 分）\n\n### 題意與作答範圍\n\n本題重點：**果樹育種困難與標誌**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=19)。\n\n### 先掌握答案\n\n多年生世代長、幼年期長、株體大、雜合及不親和，需龐大土地且果實品質必須等結果後判斷。標誌可做親本鑑定、幼苗早選、抗性基因聚合與回交背景選拔，減少無效個體；\n\n### 原理拆解：為什麼會這樣？\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n**標誌提供基因型線索**\n\n分子標誌是可檢測的 dna 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 mas 與基因轉殖的操作與法規概念不同。\n\n**連鎖不等於永遠不分離**\n\n若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。\n\n**回交可兼顧前景與背景選拔**\n\n前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。mas 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。\n\n### 可直接練寫的完整答案\n\n多年生世代長、幼年期長、株體大、雜合及不親和，需龐大土地且果實品質必須等結果後判斷。標誌可做親本鑑定、幼苗早選、抗性基因聚合與回交背景選拔，減少無效個體；\n\n多基因風味、產量仍須多年田間與採後試驗。\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n### 實例：把原理用在情境中\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：至少三困難、對應標誌用途與限制。\n\n- **至少三困難**\n- **對應標誌用途與限制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把轉入基因成功直接等同育成可商業化品種。\n- 把分子標誌說成施用後使植物產生抗性的藥劑。\n 100 果樹學"},{"id":"果樹學-100-十","s":"果樹學","y":100,"n":"十","t":"需冷與休眠解除","body":"<h2>第十題｜需冷與休眠解除（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>需冷與休眠解除<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=19\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>需冷量為解除芽內生休眠所需有效低溫，三型為相關、內生及環境休眠。分別可用摘心／除頂芽、足量低溫或依合法方式破眠、回暖與改善水分解除；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>用限制來源分類<\/strong><\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p><strong>冬天的冷與春天的暖做不同工作<\/strong><\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<p><strong>技術必須對應真正瓶頸<\/strong><\/p>\n<p>摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>需冷量為解除芽內生休眠所需有效低溫，三型為相關、內生及環境休眠。分別可用摘心／除頂芽、足量低溫或依合法方式破眠、回暖與改善水分解除；<\/p>\n<p>低需冷品種可降低暖地不足風險，但需冷滿足後仍須熱量。<\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：需冷、三型與各一種解除例。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把需冷不足與萌芽後霜害混為同一問題。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=19","md":"100年果樹學_逐題教學詳解.md","search":"需冷與休眠解除 ## 第十題｜需冷與休眠解除（10 分）\n\n### 題意與作答範圍\n\n本題重點：**需冷與休眠解除**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=19)。\n\n### 先掌握答案\n\n需冷量為解除芽內生休眠所需有效低溫，三型為相關、內生及環境休眠。分別可用摘心／除頂芽、足量低溫或依合法方式破眠、回暖與改善水分解除；\n\n### 原理拆解：為什麼會這樣？\n\n**用限制來源分類**\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n**冬天的冷與春天的暖做不同工作**\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n**技術必須對應真正瓶頸**\n\n摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。\n\n### 可直接練寫的完整答案\n\n需冷量為解除芽內生休眠所需有效低溫，三型為相關、內生及環境休眠。分別可用摘心／除頂芽、足量低溫或依合法方式破眠、回暖與改善水分解除；\n\n低需冷品種可降低暖地不足風險，但需冷滿足後仍須熱量。\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n### 實例：把原理用在情境中\n\n平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：需冷、三型與各一種解除例。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把需冷不足與萌芽後霜害混為同一問題。\n 100 果樹學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=
