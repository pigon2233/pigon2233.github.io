ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 7 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"果樹學-111-一","s":"果樹學","y":111,"n":"一","t":"芽體三類休眠","body":"<h2>第 1 題｜芽體三類休眠（9 分）<\/h2>\n<h3>原題在問什麼<\/h3>\n<p>果樹芽體休眠可分哪三類？各在什麼季節或生育情況出現？由什麼因素控制？<\/p>\n<h3>先掌握核心：芽為什麼不長？<\/h3>\n<p>「芽沒有萌發」只是外觀，背後可能有三種原因：其他器官壓制它、芽自身還沒準備好，或外界環境不允許。<strong>分類依據是抑制因素的位置，不是樹有沒有落葉。<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>類型<\/th>\n<th>抑制因素在哪裡<\/th>\n<th>常見情境<\/th>\n<th>怎樣解除<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>相關休眠／副休眠 paradormancy<\/td>\n<td>芽以外的器官<\/td>\n<td>生長季，頂芽壓制下方腋芽<\/td>\n<td>摘心、修剪或去除抑制來源<\/td>\n<\/tr>\n<tr>\n<td>內生休眠 endodormancy<\/td>\n<td>芽自身的生理狀態<\/td>\n<td>溫帶落葉果樹秋冬的休眠芽<\/td>\n<td>滿足有效低溫等解除條件<\/td>\n<\/tr>\n<tr>\n<td>環境休眠 ecodormancy<\/td>\n<td>外界溫度、水分等<\/td>\n<td>冬末已解除內生休眠，仍因天冷不萌芽<\/td>\n<td>回暖並具合適水分等環境<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>原理逐步拆解<\/h3>\n<p><strong>1. 相關休眠：芽能長，但受到別的器官抑制。<\/strong><\/p>\n<p>生長中的頂芽與幼葉可藉激素訊號、養分分配及芽間競爭，抑制下方腋芽。頂端優勢不是「頂芽把所有肥料吸走」這麼單純，而是生長素、細胞分裂素、獨腳金內酯及糖訊號共同參與的枝條分枝調控。<\/p>\n<p>因此，若腋芽主要受頂端抑制，摘心後有機會萌發。但摘心只能去掉其中一種限制；若芽同時處於內生休眠，摘心仍不能保證立即萌芽。<\/p>\n<p><strong>2. 內生休眠：即使外面暖，芽也暫時不能正常生長。<\/strong><\/p>\n<p>秋冬芽的代謝、激素及細胞間訊號狀態改變，使芽維持休眠。此時剪枝插入溫暖、供水充足的環境，芽仍可能不萌或萌得很慢。經一定有效低溫累積後，內部限制逐漸解除，稱為滿足需冷量。<\/p>\n<p>需冷量依品種而異，也不只是「最低溫愈低愈好」。不同溫度的有效性不同，短暫寒流不必然補足整個冬季的冷量。<\/p>\n<p><strong>3. 環境休眠：芽已準備好，卻仍在等環境。<\/strong><\/p>\n<p>完成需冷後，芽具有生長能力，但若氣溫仍低、熱量不足，便繼續不萌。這是環境限制；回暖並累積所需熱量後才整齊萌發。<\/p>\n<h3>一個連續的果樹例子<\/h3>\n<p>以落葉梨樹為例：夏季部分腋芽受旺盛頂芽抑制；秋冬芽進入內生休眠；冬季滿足需冷後，早春仍可能因低溫而處於環境休眠。同一株樹不同芽的狀態可以不同，三類亦可能有重疊，不能把月份當絕對判準。<\/p>\n<h3>可直接練寫的申論答案<\/h3>\n<p>果樹芽體休眠依抑制因素的位置，可分為相關休眠、內生休眠及環境休眠。相關休眠由芽以外的器官所引起，例如生長季頂芽優勢抑制腋芽，去除頂芽或修剪可減少抑制。內生休眠則來自芽自身的生理限制，常見於溫帶落葉果樹秋冬，即使移入適宜環境仍不能正常萌芽，通常需累積足夠有效低溫才逐漸解除。環境休眠是芽已具萌發能力，卻仍受低溫、乾旱等外界不適條件限制；待環境改善並滿足所需熱量後即可萌發。因此，三類休眠的差別在限制來源，不能只依落葉與否或固定季節判斷。<\/p>\n<h3>配分與常見錯誤<\/h3>\n<p>9 分可按三類各約三分之一組織；每類都寫「名稱＋限制來源＋季節／實例」。只列三個英文名，沒有交代差異，答案不足。<\/p>\n<ul>\n<li>不把內生休眠寫成單純「天氣太冷」。<\/li>\n<li>不把需冷量和解除休眠後的熱量需求當同一件事。<\/li>\n<li>不主張摘心可以解除所有休眠。<\/li>\n<\/ul>","source":"../../A111.pdf#page=2","md":"111年果樹學_逐題教學詳解.md","search":"芽體三類休眠 ## 第 1 題｜芽體三類休眠（9 分）\n\n### 原題在問什麼\n\n果樹芽體休眠可分哪三類？各在什麼季節或生育情況出現？由什麼因素控制？\n\n### 先掌握核心：芽為什麼不長？\n\n「芽沒有萌發」只是外觀，背後可能有三種原因：其他器官壓制它、芽自身還沒準備好，或外界環境不允許。**分類依據是抑制因素的位置，不是樹有沒有落葉。**\n\n| 類型 | 抑制因素在哪裡 | 常見情境 | 怎樣解除 |\n|---|---|---|---|\n| 相關休眠／副休眠 paradormancy | 芽以外的器官 | 生長季，頂芽壓制下方腋芽 | 摘心、修剪或去除抑制來源 |\n| 內生休眠 endodormancy | 芽自身的生理狀態 | 溫帶落葉果樹秋冬的休眠芽 | 滿足有效低溫等解除條件 |\n| 環境休眠 ecodormancy | 外界溫度、水分等 | 冬末已解除內生休眠，仍因天冷不萌芽 | 回暖並具合適水分等環境 |\n\n### 原理逐步拆解\n\n**1. 相關休眠：芽能長，但受到別的器官抑制。**\n\n生長中的頂芽與幼葉可藉激素訊號、養分分配及芽間競爭，抑制下方腋芽。頂端優勢不是「頂芽把所有肥料吸走」這麼單純，而是生長素、細胞分裂素、獨腳金內酯及糖訊號共同參與的枝條分枝調控。\n\n因此，若腋芽主要受頂端抑制，摘心後有機會萌發。但摘心只能去掉其中一種限制；若芽同時處於內生休眠，摘心仍不能保證立即萌芽。\n\n**2. 內生休眠：即使外面暖，芽也暫時不能正常生長。**\n\n秋冬芽的代謝、激素及細胞間訊號狀態改變，使芽維持休眠。此時剪枝插入溫暖、供水充足的環境，芽仍可能不萌或萌得很慢。經一定有效低溫累積後，內部限制逐漸解除，稱為滿足需冷量。\n\n需冷量依品種而異，也不只是「最低溫愈低愈好」。不同溫度的有效性不同，短暫寒流不必然補足整個冬季的冷量。\n\n**3. 環境休眠：芽已準備好，卻仍在等環境。**\n\n完成需冷後，芽具有生長能力，但若氣溫仍低、熱量不足，便繼續不萌。這是環境限制；回暖並累積所需熱量後才整齊萌發。\n\n### 一個連續的果樹例子\n\n以落葉梨樹為例：夏季部分腋芽受旺盛頂芽抑制；秋冬芽進入內生休眠；冬季滿足需冷後，早春仍可能因低溫而處於環境休眠。同一株樹不同芽的狀態可以不同，三類亦可能有重疊，不能把月份當絕對判準。\n\n### 可直接練寫的申論答案\n\n果樹芽體休眠依抑制因素的位置，可分為相關休眠、內生休眠及環境休眠。相關休眠由芽以外的器官所引起，例如生長季頂芽優勢抑制腋芽，去除頂芽或修剪可減少抑制。內生休眠則來自芽自身的生理限制，常見於溫帶落葉果樹秋冬，即使移入適宜環境仍不能正常萌芽，通常需累積足夠有效低溫才逐漸解除。環境休眠是芽已具萌發能力，卻仍受低溫、乾旱等外界不適條件限制；待環境改善並滿足所需熱量後即可萌發。因此，三類休眠的差別在限制來源，不能只依落葉與否或固定季節判斷。\n\n### 配分與常見錯誤\n\n9 分可按三類各約三分之一組織；每類都寫「名稱＋限制來源＋季節／實例」。只列三個英文名，沒有交代差異，答案不足。\n\n- 不把內生休眠寫成單純「天氣太冷」。\n- 不把需冷量和解除休眠後的熱量需求當同一件事。\n- 不主張摘心可以解除所有休眠。 111 果樹學"},{"id":"果樹學-111-二","s":"果樹學","y":111,"n":"二","t":"無子果兩類及機制","body":"<h2>第 2 題｜兩類無子果與機制（8 分）<\/h2>\n<h3>直接答案<\/h3>\n<p>兩大類為<strong>單為結果<\/strong>與<strong>種子敗育型無子果<\/strong>。最關鍵的區別是：前者沒有受精，後者曾受精，但種子後續發育失敗。<\/p>\n<table>\n<thead>\n<tr>\n<th>比較項目<\/th>\n<th>單為結果 parthenocarpy<\/th>\n<th>種子敗育型 stenospermocarpy<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>是否完成受精<\/td>\n<td>不需要受精<\/td>\n<td>通常曾完成受精<\/td>\n<\/tr>\n<tr>\n<td>果實如何繼續長大<\/td>\n<td>遺傳或激素訊號可支持子房生長<\/td>\n<td>受精啟動發育，之後胚／胚乳敗育<\/td>\n<\/tr>\n<tr>\n<td>種子外觀<\/td>\n<td>通常無正常成熟種子<\/td>\n<td>常有小種痕或軟種子殘體<\/td>\n<\/tr>\n<tr>\n<td>例子<\/td>\n<td>栽培香蕉<\/td>\n<td>許多無子葡萄<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>為何沒有種子，果實還能長？<\/h3>\n<p>正常有性結果時，授粉、受精及發育中的種子會提供或誘導生長素、激勃素等訊號，促使子房細胞分裂、膨大。若某品種自身已具有足夠生長訊號，或經合適的外源調節劑誘導，即使沒有受精也能結果，即為單為結果。<\/p>\n<p>部分單為結果不需要授粉刺激；另一些需要授粉相關刺激，但仍不需要完成受精。因此，<strong>「需要授粉」不等於「一定有受精」<\/strong>。<\/p>\n<p>種子敗育型則是正常授粉受精後，胚、胚乳或相關組織在某階段不能繼續發育。果實仍保有足以繼續生長的條件，成熟時便形成無正常種子的果實。敗育時間愈晚，殘留種痕可能愈明顯，但種痕大小並非唯一分類依據。<\/p>\n<h3>實例與容易混淆的第三個概念<\/h3>\n<p>香蕉可在沒有正常受精種子的情況下長成果實，是單為結果的典型例。許多無子葡萄則曾受精，之後種子敗育，食用時有時仍感覺到柔軟小種痕。<\/p>\n<p>另有「無融合生殖」apomixis，重點是<strong>不經正常有性受精而形成胚<\/strong>，例如柑橘珠心胚。它仍可能產生含胚的種子，不能直接視為第三類無子果。<\/p>\n<h3>可直接練寫的申論答案<\/h3>\n<p>無子果一般可分為單為結果與種子敗育型。單為結果是不經受精即形成果實，可能由品種本身的遺傳性或生長調節訊號支持子房生長，也可由適當外源激素誘導，栽培香蕉為典型例。種子敗育型則曾完成授粉受精，但胚或胚乳在後續發育中敗育，果實仍繼續膨大，因此常留下小種痕，許多無子葡萄屬此類。兩者應以受精與種子發育過程區分，不能僅依成熟果實中是否看得到種子判斷。<\/p>\n<h3>配分與常見錯誤<\/h3>\n<p>8 分可將兩類各用一段，分別交代受精狀態、發生機制與實例。不要把「無子葡萄」一概都寫成完全未受精，也不要把無融合生殖當成無種子。<\/p>","source":"../../A111.pdf#page=2","md":"111年果樹學_逐題教學詳解.md","search":"無子果兩類及機制 ## 第 2 題｜兩類無子果與機制（8 分）\n\n### 直接答案\n\n兩大類為**單為結果**與**種子敗育型無子果**。最關鍵的區別是：前者沒有受精，後者曾受精，但種子後續發育失敗。\n\n| 比較項目 | 單為結果 parthenocarpy | 種子敗育型 stenospermocarpy |\n|---|---|---|\n| 是否完成受精 | 不需要受精 | 通常曾完成受精 |\n| 果實如何繼續長大 | 遺傳或激素訊號可支持子房生長 | 受精啟動發育，之後胚／胚乳敗育 |\n| 種子外觀 | 通常無正常成熟種子 | 常有小種痕或軟種子殘體 |\n| 例子 | 栽培香蕉 | 許多無子葡萄 |\n\n### 為何沒有種子，果實還能長？\n\n正常有性結果時，授粉、受精及發育中的種子會提供或誘導生長素、激勃素等訊號，促使子房細胞分裂、膨大。若某品種自身已具有足夠生長訊號，或經合適的外源調節劑誘導，即使沒有受精也能結果，即為單為結果。\n\n部分單為結果不需要授粉刺激；另一些需要授粉相關刺激，但仍不需要完成受精。因此，**「需要授粉」不等於「一定有受精」**。\n\n種子敗育型則是正常授粉受精後，胚、胚乳或相關組織在某階段不能繼續發育。果實仍保有足以繼續生長的條件，成熟時便形成無正常種子的果實。敗育時間愈晚，殘留種痕可能愈明顯，但種痕大小並非唯一分類依據。\n\n### 實例與容易混淆的第三個概念\n\n香蕉可在沒有正常受精種子的情況下長成果實，是單為結果的典型例。許多無子葡萄則曾受精，之後種子敗育，食用時有時仍感覺到柔軟小種痕。\n\n另有「無融合生殖」apomixis，重點是**不經正常有性受精而形成胚**，例如柑橘珠心胚。它仍可能產生含胚的種子，不能直接視為第三類無子果。\n\n### 可直接練寫的申論答案\n\n無子果一般可分為單為結果與種子敗育型。單為結果是不經受精即形成果實，可能由品種本身的遺傳性或生長調節訊號支持子房生長，也可由適當外源激素誘導，栽培香蕉為典型例。種子敗育型則曾完成授粉受精，但胚或胚乳在後續發育中敗育，果實仍繼續膨大，因此常留下小種痕，許多無子葡萄屬此類。兩者應以受精與種子發育過程區分，不能僅依成熟果實中是否看得到種子判斷。\n\n### 配分與常見錯誤\n\n8 分可將兩類各用一段，分別交代受精狀態、發生機制與實例。不要把「無子葡萄」一概都寫成完全未受精，也不要把無融合生殖當成無種子。 111 果樹學"},{"id":"果樹學-111-三","s":"果樹學","y":111,"n":"三","t":"葡萄一年二收","body":"<h2>第 3 題｜葡萄一年二收（10 分）<\/h2>\n<h3>先理解葡萄在哪裡開花<\/h3>\n<p>葡萄的花序出現在當期新梢上，但這些新梢來自結果母枝的芽；芽內的花序原基常已於前一段枝梢生長期間形成。因此，一年二收的基礎不是「採完果立刻再施肥就結果」，而是讓具結果能力的芽在一年中分兩次萌發。<\/p>\n<h3>依生理目的理解操作順序<\/h3>\n<table>\n<thead>\n<tr>\n<th>階段<\/th>\n<th>操作<\/th>\n<th>生理目的<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第一期開始<\/td>\n<td>冬季修剪、管理芽體使萌發整齊<\/td>\n<td>讓成熟芽抽出帶花序的新梢<\/td>\n<\/tr>\n<tr>\n<td>第一期生長<\/td>\n<td>疏梢、整穗、疏果、供水肥與保葉<\/td>\n<td>維持葉果比，生產合格夏果<\/td>\n<\/tr>\n<tr>\n<td>第一期採後<\/td>\n<td>保留健康葉、恢復樹勢、培養成熟枝<\/td>\n<td>重新累積碳水化合物，建立下一期結果母枝<\/td>\n<\/tr>\n<tr>\n<td>第二期開始<\/td>\n<td>依預定冬果採期進行夏季修剪與萌芽管理<\/td>\n<td>讓合適芽再抽帶花序新梢<\/td>\n<\/tr>\n<tr>\n<td>第二期生長<\/td>\n<td>控負載、保光合葉，注意秋冬溫度與病害<\/td>\n<td>在較有限光熱下完成果實發育<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>為何採後養樹不能省？<\/h3>\n<p>第一期果實是強庫，會大量消耗同化物。如果採果後葉片已嚴重病落、枝條未成熟，卻馬上強迫第二期萌芽，植株可能雖長出新梢，但花序品質、著果與果粒膨大不佳。<\/p>\n<p>健康葉片能補回根、主幹與枝條貯藏，下一期初萌芽時也有資源可用。因此第二期成功與否，往往在第一次採收前後就已決定，而不是只看夏剪當天的操作。<\/p>\n<h3>可直接練寫的申論答案<\/h3>\n<p>臺灣葡萄一年二收主要利用成熟結果母枝的芽內已有花序原基，配合一年兩次修剪與整齊萌芽管理，使新梢分兩次生長、開花及結果。第一期於冬季修剪後萌芽，配合疏梢、整穗與肥水管理取得夏果。採後應保留健康葉片，補充適量肥水、恢復貯藏並培養成熟結果母枝，再依冬果預定採收期進行夏季修剪，使合適芽再次萌發結果。兩期均須控制負載及葉果比，避免過度採果耗弱樹勢；第二期還須考慮秋冬光熱不足，使果實能正常成熟。實際修剪日期應依品種、產區與設施條件調整。<\/p>\n<h3>配分與常見錯誤<\/h3>\n<p>本題應同時寫出花芽基礎、兩期流程與採後恢復。只寫「冬剪一次、夏剪一次」不足以說明成功原理。也不要將葡萄兩收歸因於一天中日照長短改變，或認為所有品種、產區都適合相同日期。<\/p>","source":"../../A111.pdf#page=2","md":"111年果樹學_逐題教學詳解.md","search":"葡萄一年二收 ## 第 3 題｜葡萄一年二收（10 分）\n\n### 先理解葡萄在哪裡開花\n\n葡萄的花序出現在當期新梢上，但這些新梢來自結果母枝的芽；芽內的花序原基常已於前一段枝梢生長期間形成。因此，一年二收的基礎不是「採完果立刻再施肥就結果」，而是讓具結果能力的芽在一年中分兩次萌發。\n\n### 依生理目的理解操作順序\n\n| 階段 | 操作 | 生理目的 |\n|---|---|---|\n| 第一期開始 | 冬季修剪、管理芽體使萌發整齊 | 讓成熟芽抽出帶花序的新梢 |\n| 第一期生長 | 疏梢、整穗、疏果、供水肥與保葉 | 維持葉果比，生產合格夏果 |\n| 第一期採後 | 保留健康葉、恢復樹勢、培養成熟枝 | 重新累積碳水化合物，建立下一期結果母枝 |\n| 第二期開始 | 依預定冬果採期進行夏季修剪與萌芽管理 | 讓合適芽再抽帶花序新梢 |\n| 第二期生長 | 控負載、保光合葉，注意秋冬溫度與病害 | 在較有限光熱下完成果實發育 |\n\n### 為何採後養樹不能省？\n\n第一期果實是強庫，會大量消耗同化物。如果採果後葉片已嚴重病落、枝條未成熟，卻馬上強迫第二期萌芽，植株可能雖長出新梢，但花序品質、著果與果粒膨大不佳。\n\n健康葉片能補回根、主幹與枝條貯藏，下一期初萌芽時也有資源可用。因此第二期成功與否，往往在第一次採收前後就已決定，而不是只看夏剪當天的操作。\n\n### 可直接練寫的申論答案\n\n臺灣葡萄一年二收主要利用成熟結果母枝的芽內已有花序原基，配合一年兩次修剪與整齊萌芽管理，使新梢分兩次生長、開花及結果。第一期於冬季修剪後萌芽，配合疏梢、整穗與肥水管理取得夏果。採後應保留健康葉片，補充適量肥水、恢復貯藏並培養成熟結果母枝，再依冬果預定採收期進行夏季修剪，使合適芽再次萌發結果。兩期均須控制負載及葉果比，避免過度採果耗弱樹勢；第二期還須考慮秋冬光熱不足，使果實能正常成熟。實際修剪日期應依品種、產區與設施條件調整。\n\n### 配分與常見錯誤\n\n本題應同時寫出花芽基礎、兩期流程與採後恢復。只寫「冬剪一次、夏剪一次」不足以說明成功原理。也不要將葡萄兩收歸因於一天中日照長短改變，或認為所有品種、產區都適合相同日期。 111 果樹學"},{"id":"果樹學-111-四","s":"果樹學","y":111,"n":"四","t":"覆黑網的目的","body":"<h2>第 4 題｜四種果樹覆黑網的目的（8 分）<\/h2>\n<h3>直接對照<\/h3>\n<table>\n<thead>\n<tr>\n<th>原題作物與階段<\/th>\n<th>主要目的<\/th>\n<th>關鍵因果<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>枇杷開花期<\/td>\n<td>改善花期高溫條件、提高著果，利較早期果供應<\/td>\n<td>遮蔭減少輻射熱負荷，降低高溫對花器與著果的不利影響<\/td>\n<\/tr>\n<tr>\n<td>蓮霧營養生長期<\/td>\n<td>配合催花，提高產期調節穩定性<\/td>\n<td>抑制持續抽梢、協調枝梢成熟及後續成花反應<\/td>\n<\/tr>\n<tr>\n<td>鳳梨果實發育期<\/td>\n<td>預防果實日燒<\/td>\n<td>減少果面直接受光及過熱傷害<\/td>\n<\/tr>\n<tr>\n<td>紅龍果夏季生長期<\/td>\n<td>防止莖、果受強光高溫傷害<\/td>\n<td>適量遮蔭降低熱負荷，保護光合莖與果實<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>為什麼同一張網有不同答案？<\/h3>\n<p>黑網不是只有「讓環境變暗」一種作用。它同時改變到達植物的輻射、器官溫度及冠層微環境，而作物在不同時期的限制因子不同。<\/p>\n<p>枇杷這一小題的重點在花期環境與著果，不是阻隔昆蟲進行疏果。臺東場試驗曾以不同時期、遮光程度研究降低花期氣溫與早果著果的關係，作答應抓住「高溫限制—遮蔭緩和—著果改善」。<\/p>\n<p>蓮霧則是產調處理，不能只回答防曬。遮光可減少新梢持續萌發，使後續催花較整齊；碳分配、枝齡與環境訊號共同參與。不能據此認為遮得愈黑、愈久必定愈好：過度遮光會消耗貯藏、落葉與樹勢衰弱。<\/p>\n<p>鳳梨與紅龍果夏季遮蔭主要處理日燒、熱傷。遮蔭過重也會減少光合供碳，降低產量品質，因此目標是降低過量光熱，而不是讓植物長期缺光。<\/p>\n<h3>可直接練寫的申論答案<\/h3>\n<p>枇杷於開花期覆黑網，可改善高溫微環境，降低過強輻射對花器與著果的不利影響，促進著果並有利較早期果生產。蓮霧於營養生長期遮光，是配合產期調節，藉抑制持續抽梢及協調枝梢成熟，提高後續催花整齊度。鳳梨於果實發育期覆網，主要避免果面直接受強光造成日燒。紅龍果夏季覆網則降低莖、果的光熱負荷，減少日燒及高溫傷害。各處理均須掌握適當遮光程度與期間，避免因光合不足反而降低品質。<\/p>\n<h3>配分與校正<\/h3>\n<p>四小題各 2 分，應把作物與用途精確配對。<strong>原題是「枇杷」，舊版誤讀成「桃」並答成阻隔授粉，這個答案已撤回。<\/strong><\/p>","source":"../../A111.pdf#page=2","md":"111年果樹學_逐題教學詳解.md","search":"覆黑網的目的 ## 第 4 題｜四種果樹覆黑網的目的（8 分）\n\n### 直接對照\n\n| 原題作物與階段 | 主要目的 | 關鍵因果 |\n|---|---|---|\n| 枇杷開花期 | 改善花期高溫條件、提高著果，利較早期果供應 | 遮蔭減少輻射熱負荷，降低高溫對花器與著果的不利影響 |\n| 蓮霧營養生長期 | 配合催花，提高產期調節穩定性 | 抑制持續抽梢、協調枝梢成熟及後續成花反應 |\n| 鳳梨果實發育期 | 預防果實日燒 | 減少果面直接受光及過熱傷害 |\n| 紅龍果夏季生長期 | 防止莖、果受強光高溫傷害 | 適量遮蔭降低熱負荷，保護光合莖與果實 |\n\n### 為什麼同一張網有不同答案？\n\n黑網不是只有「讓環境變暗」一種作用。它同時改變到達植物的輻射、器官溫度及冠層微環境，而作物在不同時期的限制因子不同。\n\n枇杷這一小題的重點在花期環境與著果，不是阻隔昆蟲進行疏果。臺東場試驗曾以不同時期、遮光程度研究降低花期氣溫與早果著果的關係，作答應抓住「高溫限制—遮蔭緩和—著果改善」。\n\n蓮霧則是產調處理，不能只回答防曬。遮光可減少新梢持續萌發，使後續催花較整齊；碳分配、枝齡與環境訊號共同參與。不能據此認為遮得愈黑、愈久必定愈好：過度遮光會消耗貯藏、落葉與樹勢衰弱。\n\n鳳梨與紅龍果夏季遮蔭主要處理日燒、熱傷。遮蔭過重也會減少光合供碳，降低產量品質，因此目標是降低過量光熱，而不是讓植物長期缺光。\n\n### 可直接練寫的申論答案\n\n枇杷於開花期覆黑網，可改善高溫微環境，降低過強輻射對花器與著果的不利影響，促進著果並有利較早期果生產。蓮霧於營養生長期遮光，是配合產期調節，藉抑制持續抽梢及協調枝梢成熟，提高後續催花整齊度。鳳梨於果實發育期覆網，主要避免果面直接受強光造成日燒。紅龍果夏季覆網則降低莖、果的光熱負荷，減少日燒及高溫傷害。各處理均須掌握適當遮光程度與期間，避免因光合不足反而降低品質。\n\n### 配分與校正\n\n四小題各 2 分，應把作物與用途精確配對。**原題是「枇杷」，舊版誤讀成「桃」並答成阻隔授粉，這個答案已撤回。** 111 果樹學"},{"id":"果樹學-111-五","s":"果樹學","y":111,"n":"五","t":"果實期提高鉀肥；缺鉀；抗逆","body":"<h2>第 5 題｜鉀與果實發育、缺鉀及抗逆（15 分）<\/h2>\n<h3>小題一：為何果實發育期常提高鉀的供應？（3 分）<\/h3>\n<p>果實膨大需要細胞吸水維持膨壓，也需要大量糖作為呼吸、合成與貯藏材料。鉀主要以 K⁺ 存在，不像氮形成蛋白質骨架，而是作為滲透調節離子、酵素活化因子及運輸調節者。因此果實生長旺盛時，適量鉀有助維持細胞膨壓、葉片光合作用及源至果實的同化物運輸。<\/p>\n<p><strong>注意：鉀不是糖分子的一部分，也不會直接把肥料變成糖。<\/strong>果實有多少糖，仍受健康葉面積、光照、負載及呼吸消耗限制。<\/p>\n<h3>小題二：缺鉀時葉片有什麼症狀？（3 分）<\/h3>\n<p>鉀可在體內再移動，缺乏時植株會優先把老葉鉀移向新生器官，故常從老葉開始。典型是葉緣黃化，接著焦枯壞死，可伴捲葉；嚴重時光合葉面積下降、枝條與果實生長變差。<\/p>\n<p>葉緣焦枯也可能是鹽害、乾旱或根傷。考題問典型徵狀可直接寫缺鉀模式，但真實田間應配合葉片及土壤分析確認。<\/p>\n<h3>小題三：鉀如何增加抗逆能力？（9 分）<\/h3>\n<p><strong>第一，調節氣孔，使碳固定與失水較能協調。<\/strong>保衛細胞吸收、釋放鉀及其他溶質，改變水勢與膨壓，參與氣孔開閉。鉀供應適當可支持正常氣孔反應，使植物面對乾旱時較能調水分損失。<\/p>\n<p><strong>第二，參與滲透調節，幫助維持細胞膨壓。<\/strong>外界缺水或鹽分使吸水較困難，細胞可調整溶質含量降低自身水勢。鉀是重要無機滲透調節成分，有助維持適當含水與膨壓，但不能克服無限強度的乾旱。<\/p>\n<p><strong>第三，維持代謝、膜及抗氧化系統的正常運作。<\/strong>鉀參與多種酵素活化、糖運輸及離子平衡。足量鉀可降低缺鉀時累積的代謝失衡與逆境傷害，間接有助耐熱、耐冷及部分病害抵抗；效果取決作物、病原與營養背景，並非普遍免疫。<\/p>\n<h3>果園實例與管理取捨<\/h3>\n<p>例如結果葡萄若長期缺鉀，老葉葉緣焦枯，能供果實的健康葉量下降，果粒充實及糖累積受影響。補鉀的前提是土葉分析及根域正常；若土壤已高鉀，繼續增加可能拮抗鎂、鈣吸收，又造成其他缺素及鹽分問題。<\/p>\n<h3>可直接練寫的申論答案<\/h3>\n<p>果實發育期需要大量同化物及膨壓以支持細胞膨大，鉀可活化酵素、調節滲透勢與氣孔，並參與韌皮部糖運輸，故應維持充分而平衡的鉀供應。缺鉀因鉀可再移動，通常先見老葉葉緣黃化，繼而焦枯壞死，亦可伴捲葉及生長衰退。鉀增加抗逆能力的機制，包括支持保衛細胞正常氣孔調節、改善水分利用；作為重要溶質參與滲透調節、維持膨壓；以及維持酵素、膜與離子平衡，減少逆境下的代謝傷害。然而補鉀並非愈多愈好，過量可拮抗鈣鎂並增加鹽害，應依分析及生育需求管理。<\/p>\n<h3>配分重點<\/h3>\n<p>原卷明訂 3＋3＋9 分，篇幅應以抗逆機制最多。至少把三種機制各寫成因果句；只寫「增加抗旱、抗寒、抗病」沒有解釋，難充分回應 9 分。<\/p>","source":"../../A111.pdf#page=2","md":"111年果樹學_逐題教學詳解.md","search":"果實期提高鉀肥；缺鉀；抗逆 ## 第 5 題｜鉀與果實發育、缺鉀及抗逆（15 分）\n\n### 小題一：為何果實發育期常提高鉀的供應？（3 分）\n\n果實膨大需要細胞吸水維持膨壓，也需要大量糖作為呼吸、合成與貯藏材料。鉀主要以 k⁺ 存在，不像氮形成蛋白質骨架，而是作為滲透調節離子、酵素活化因子及運輸調節者。因此果實生長旺盛時，適量鉀有助維持細胞膨壓、葉片光合作用及源至果實的同化物運輸。\n\n**注意：鉀不是糖分子的一部分，也不會直接把肥料變成糖。**果實有多少糖，仍受健康葉面積、光照、負載及呼吸消耗限制。\n\n### 小題二：缺鉀時葉片有什麼症狀？（3 分）\n\n鉀可在體內再移動，缺乏時植株會優先把老葉鉀移向新生器官，故常從老葉開始。典型是葉緣黃化，接著焦枯壞死，可伴捲葉；嚴重時光合葉面積下降、枝條與果實生長變差。\n\n葉緣焦枯也可能是鹽害、乾旱或根傷。考題問典型徵狀可直接寫缺鉀模式，但真實田間應配合葉片及土壤分析確認。\n\n### 小題三：鉀如何增加抗逆能力？（9 分）\n\n**第一，調節氣孔，使碳固定與失水較能協調。**保衛細胞吸收、釋放鉀及其他溶質，改變水勢與膨壓，參與氣孔開閉。鉀供應適當可支持正常氣孔反應，使植物面對乾旱時較能調水分損失。\n\n**第二，參與滲透調節，幫助維持細胞膨壓。**外界缺水或鹽分使吸水較困難，細胞可調整溶質含量降低自身水勢。鉀是重要無機滲透調節成分，有助維持適當含水與膨壓，但不能克服無限強度的乾旱。\n\n**第三，維持代謝、膜及抗氧化系統的正常運作。**鉀參與多種酵素活化、糖運輸及離子平衡。足量鉀可降低缺鉀時累積的代謝失衡與逆境傷害，間接有助耐熱、耐冷及部分病害抵抗；效果取決作物、病原與營養背景，並非普遍免疫。\n\n### 果園實例與管理取捨\n\n例如結果葡萄若長期缺鉀，老葉葉緣焦枯，能供果實的健康葉量下降，果粒充實及糖累積受影響。補鉀的前提是土葉分析及根域正常；若土壤已高鉀，繼續增加可能拮抗鎂、鈣吸收，又造成其他缺素及鹽分問題。\n\n### 可直接練寫的申論答案\n\n果實發育期需要大量同化物及膨壓以支持細胞膨大，鉀可活化酵素、調節滲透勢與氣孔，並參與韌皮部糖運輸，故應維持充分而平衡的鉀供應。缺鉀因鉀可再移動，通常先見老葉葉緣黃化，繼而焦枯壞死，亦可伴捲葉及生長衰退。鉀增加抗逆能力的機制，包括支持保衛細胞正常氣孔調節、改善水分利用；作為重要溶質參與滲透調節、維持膨壓；以及維持酵素、膜與離子平衡，減少逆境下的代謝傷害。然而補鉀並非愈多愈好，過量可拮抗鈣鎂並增加鹽害，應依分析及生育需求管理。\n\n### 配分重點\n\n原卷明訂 3＋3＋9 分，篇幅應以抗逆機制最多。至少把三種機制各寫成因果句；只寫「增加抗旱、抗寒、抗病」沒有解釋，難充分回應 9 分。 111 果樹學"},{"id":"果樹學-111-六","s":"果樹學","y":111,"n":"六","t":"愛文芒果輸日管理與流程","body":"<h2>第 6 題｜愛文芒果輸日的田間與採後（20 分）<\/h2>\n<h3>題目分成兩道關卡<\/h3>\n<p>田間管理占 8 分，採後流程占 12 分。出口不只是把果實保鮮到日本，還須同時滿足<strong>病蟲檢疫、食品安全、商業品質與追溯<\/strong>。不同問題不能用同一處理解決。<\/p>\n<h3>田間管理：把風險降在採收以前<\/h3>\n<table>\n<thead>\n<tr>\n<th>管理項目<\/th>\n<th>具體工作<\/th>\n<th>為什麼重要<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>供果資格與追溯<\/td>\n<td>依輸銷計畫登錄、保留地塊與批次紀錄<\/td>\n<td>出問題能追到來源，接受查核<\/td>\n<\/tr>\n<tr>\n<td>果實蠅等害蟲<\/td>\n<td>清園、監測、合規防治與適時套袋<\/td>\n<td>避免帶蟲果實進入採後批次<\/td>\n<\/tr>\n<tr>\n<td>炭疽等病害<\/td>\n<td>改善通風、清除病源、適期防治<\/td>\n<td>部分感染田間潛伏，採後才腐爛<\/td>\n<\/tr>\n<tr>\n<td>用藥安全<\/td>\n<td>比對目的國殘留要求、守安全期、記錄用藥<\/td>\n<td>國內可用不代表出口殘留必合格<\/td>\n<\/tr>\n<tr>\n<td>果實品質<\/td>\n<td>疏果、負載、水肥與適熟採收<\/td>\n<td>確保規格、風味、硬度與耐運<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>採後流程：每一步都對應一個風險<\/h3>\n<ol>\n<li><strong>適熟輕採、去乳汁：<\/strong>過嫩無法正常發展風味，過熟難耐運；流出的乳汁可傷果皮，須依妥善程序去除。<\/li>\n<li><strong>驗收與剔除病傷、帶蟲及不合格果：<\/strong>不能指望後段蒸熱使已腐爛或嚴重受傷的果恢復品質。<\/li>\n<li><strong>清潔、分級及進入合格處理設施：<\/strong>保持批次身分，避免工具、水、輸送設備造成交叉污染與撞傷。<\/li>\n<li><strong>依核准程序完成蒸熱檢疫：<\/strong>官方流程所列芒果條件為果心達 46.5°C 並持續 30 分鐘；實際出貨須核對有效版本與目的國要求。<\/li>\n<li><strong>冷卻、乾燥、防再污染包裝：<\/strong>處理後須避免再次暴露於害蟲，包裝兼顧固定、緩衝與透氣，避免結露加劇腐敗。<\/li>\n<li><strong>檢疫查驗、文件與適溫運輸：<\/strong>維持批次、證明及冷鏈，依品種成熟度採不致寒害的溫度，抵港再檢查品質。<\/li>\n<\/ol>\n<h3>三件不能混淆的事<\/h3>\n<ul>\n<li>蒸熱的主要目的在殺除檢疫害蟲，不能視為完全殺菌。<\/li>\n<li>蒸熱不能拿來補救田間農藥殘留超標。<\/li>\n<li>冷藏延緩代謝，也不能讓過嫩、病傷果回復商品品質。<\/li>\n<\/ul>\n<h3>可直接練寫的申論答案<\/h3>\n<p>愛文芒果輸日應由田間建立合格供果及追溯管理，進行整枝、疏果、適量肥水、病蟲監測、清園及套袋，並依日本殘留要求安排合法用藥與安全採收期，保留批次紀錄。採後於適當成熟度輕採，妥善去乳汁、清潔，剔除病傷、帶蟲與規格不符果，分級後送合格設施，依核准條件完成蒸熱檢疫，再冷卻乾燥、防再污染包裝，經查驗及文件程序後，以適溫冷鏈運輸。各步驟分別控制機械傷、潛伏病害、害蟲與衰老；蒸熱不能取代採前病蟲管理，也無法去除超標殘留。因此須以整條產銷流程確保安全與到貨品質。<\/p>\n<h3>配分重點<\/h3>\n<p>田間 8 分須有供果追溯、病蟲、用藥與品質；採後 12 分須寫完整次序及目的，不能只答「蒸熱後冷藏」。數值是流程查核項，不是本文建議自行操作的通用熱處理配方。<\/p>","source":"../../A111.pdf#page=2","md":"111年果樹學_逐題教學詳解.md","search":"愛文芒果輸日管理與流程 ## 第 6 題｜愛文芒果輸日的田間與採後（20 分）\n\n### 題目分成兩道關卡\n\n田間管理占 8 分，採後流程占 12 分。出口不只是把果實保鮮到日本，還須同時滿足**病蟲檢疫、食品安全、商業品質與追溯**。不同問題不能用同一處理解決。\n\n### 田間管理：把風險降在採收以前\n\n| 管理項目 | 具體工作 | 為什麼重要 |\n|---|---|---|\n| 供果資格與追溯 | 依輸銷計畫登錄、保留地塊與批次紀錄 | 出問題能追到來源，接受查核 |\n| 果實蠅等害蟲 | 清園、監測、合規防治與適時套袋 | 避免帶蟲果實進入採後批次 |\n| 炭疽等病害 | 改善通風、清除病源、適期防治 | 部分感染田間潛伏，採後才腐爛 |\n| 用藥安全 | 比對目的國殘留要求、守安全期、記錄用藥 | 國內可用不代表出口殘留必合格 |\n| 果實品質 | 疏果、負載、水肥與適熟採收 | 確保規格、風味、硬度與耐運 |\n\n### 採後流程：每一步都對應一個風險\n\n1. **適熟輕採、去乳汁：**過嫩無法正常發展風味，過熟難耐運；流出的乳汁可傷果皮，須依妥善程序去除。\n2. **驗收與剔除病傷、帶蟲及不合格果：**不能指望後段蒸熱使已腐爛或嚴重受傷的果恢復品質。\n3. **清潔、分級及進入合格處理設施：**保持批次身分，避免工具、水、輸送設備造成交叉污染與撞傷。\n4. **依核准程序完成蒸熱檢疫：**官方流程所列芒果條件為果心達 46.5°c 並持續 30 分鐘；實際出貨須核對有效版本與目的國要求。\n5. **冷卻、乾燥、防再污染包裝：**處理後須避免再次暴露於害蟲，包裝兼顧固定、緩衝與透氣，避免結露加劇腐敗。\n6. **檢疫查驗、文件與適溫運輸：**維持批次、證明及冷鏈，依品種成熟度採不致寒害的溫度，抵港再檢查品質。\n\n### 三件不能混淆的事\n\n- 蒸熱的主要目的在殺除檢疫害蟲，不能視為完全殺菌。\n- 蒸熱不能拿來補救田間農藥殘留超標。\n- 冷藏延緩代謝，也不能讓過嫩、病傷果回復商品品質。\n\n### 可直接練寫的申論答案\n\n愛文芒果輸日應由田間建立合格供果及追溯管理，進行整枝、疏果、適量肥水、病蟲監測、清園及套袋，並依日本殘留要求安排合法用藥與安全採收期，保留批次紀錄。採後於適當成熟度輕採，妥善去乳汁、清潔，剔除病傷、帶蟲與規格不符果，分級後送合格設施，依核准條件完成蒸熱檢疫，再冷卻乾燥、防再污染包裝，經查驗及文件程序後，以適溫冷鏈運輸。各步驟分別控制機械傷、潛伏病害、害蟲與衰老；蒸熱不能取代採前病蟲管理，也無法去除超標殘留。因此須以整條產銷流程確保安全與到貨品質。\n\n### 配分重點\n\n田間 8 分須有供果追溯、病蟲、用藥與品質；採後 12 分須寫完整次序及目的，不能只答「蒸熱後冷藏」。數值是流程查核項，不是本文建議自行操作的通用熱處理配方。 111 果樹學"},{"id":"果樹學-111-七","s":"果樹學","y":111,"n":"七","t":"荔枝氣候、品種與產地","body":"<h2>第 7 題｜荔枝暖冬、品種配置與因應（30 分）<\/h2>\n<h3>小題一：暖秋冬為什麼衝擊荔枝生產？（6 分）<\/h3>\n<p>荔枝須先形成成熟枝梢，再在適當較低溫條件下完成成花誘導。秋冬太暖、雨水與氮供應又促生長時，末次秋梢可能過晚，甚至抽冬梢，使頂芽仍偏營養生長。結果是花量少、花期延後、不整齊，或形成帶葉花穗，降低正常結果潛力。<\/p>\n<p>即使有花，花期持續陰雨也會影響花粉、訪花昆蟲及授粉，後續低著果不能全部歸因於花芽誘導不足。作答要分「成花以前」與「開花以後」。<\/p>\n<h3>小題二：用早、中、晚生品種說明適地與產期（18 分）<\/h3>\n<table>\n<thead>\n<tr>\n<th>成熟類型<\/th>\n<th>適合作答的品種例<\/th>\n<th>產區配置思考<\/th>\n<th>產銷目的<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>早生<\/td>\n<td>玉荷包<\/td>\n<td>南部較早熟產區可發揮早上市優勢，仍須合適成花條件<\/td>\n<td>避開中期大量供應、提高早果價值<\/td>\n<\/tr>\n<tr>\n<td>中生<\/td>\n<td>黑葉<\/td>\n<td>依南至中北部物候接續，適應性與量產基礎較強<\/td>\n<td>維持主要供應，改善品質分級<\/td>\n<\/tr>\n<tr>\n<td>晚生<\/td>\n<td>糯米糍<\/td>\n<td>選適合其成花、著果與成熟的較晚產區<\/td>\n<td>延伸銷售期、發揮小核風味特色<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>品種成熟早晚與產地早晚是兩種因素。<\/strong>同一品種在暖地、不同海拔與管理下，採期可以不同；不同品種則有其遺傳性的發育及成花特徵。成熟期分類也受比較地點影響，日期不宜背成全臺固定值。<\/p>\n<p>過去臺灣荔枝以黑葉等為主要生產基礎，集中上市時容易供過於求。後來南部增加玉荷包等高經濟價值早生品種，中部保留黑葉並發展糯米糍等較晚、品質具特色的材料，藉品種與地區組合分散供應。此為產業方向，不代表每一地區都已完成一致轉換。<\/p>\n<p>要達到「適地適種」，不能只看早生價格高就全臺改種玉荷包；仍須比較當地冬季低溫、秋梢成熟、花期降雨、裂果與落果風險、採收勞力及通路。某品種在暖冬開花不穩時，高單價可能被低商品產量抵銷。<\/p>\n<h3>小題三：未來如何調整？（6 分）<\/h3>\n<p>第一，選成花條件較適應產地氣候的品種，而不是把「早熟」直接當成「低溫需求低」。第二，讓末次秋梢適時成熟，調整採後修剪、氮肥與水分，避免冬季持續旺長，但花期與幼果期不能過度缺水。第三，以多品種、多產區分散暖冬與花期豪雨風險，搭配物候紀錄與溫雨監測調整管理及採收安排。<\/p>\n<h3>可直接練寫的申論答案<\/h3>\n<p>荔枝成花需成熟枝梢與適合較低溫誘導。暖秋冬使秋梢延遲成熟或萌生冬梢，頂芽維持營養生長，因而花量少、花期延後或產生帶葉花穗，降低結果；花期陰雨又可能進一步限制授粉。產區配置可用早生玉荷包、中生黑葉與晚生糯米糍為例，利用不同品種成熟期及南北、海拔的物候差異接續上市。臺灣產業由以黑葉量產為重要基礎，逐漸增加早生高價及晚生特色品種，以分散集中供應。但適地性仍須同時評估成花低溫、枝梢成熟、授粉、裂落果與通路，而非只追求早採。未來可選適合較暖冬季的材料、調整採後枝梢及氮水管理、分散品種產區並監測氣候，使成花與供應更穩定。<\/p>\n<h3>配分與舊稿校正<\/h3>\n<p>依 6＋18＋6 分安排，中間「品種與產地配置」應寫最多，至少完成三個具名品種的配置理由及產業變化。<strong>玉荷包是早生例，舊版把它列成中生不妥；本稿已改用玉荷包—黑葉—糯米糍。<\/strong><\/p>","source":"../../A111.pdf#page=2","md":"111年果樹學_逐題教學詳解.md","search":"荔枝氣候、品種與產地 ## 第 7 題｜荔枝暖冬、品種配置與因應（30 分）\n\n### 小題一：暖秋冬為什麼衝擊荔枝生產？（6 分）\n\n荔枝須先形成成熟枝梢，再在適當較低溫條件下完成成花誘導。秋冬太暖、雨水與氮供應又促生長時，末次秋梢可能過晚，甚至抽冬梢，使頂芽仍偏營養生長。結果是花量少、花期延後、不整齊，或形成帶葉花穗，降低正常結果潛力。\n\n即使有花，花期持續陰雨也會影響花粉、訪花昆蟲及授粉，後續低著果不能全部歸因於花芽誘導不足。作答要分「成花以前」與「開花以後」。\n\n### 小題二：用早、中、晚生品種說明適地與產期（18 分）\n\n| 成熟類型 | 適合作答的品種例 | 產區配置思考 | 產銷目的 |\n|---|---|---|---|\n| 早生 | 玉荷包 | 南部較早熟產區可發揮早上市優勢，仍須合適成花條件 | 避開中期大量供應、提高早果價值 |\n| 中生 | 黑葉 | 依南至中北部物候接續，適應性與量產基礎較強 | 維持主要供應，改善品質分級 |\n| 晚生 | 糯米糍 | 選適合其成花、著果與成熟的較晚產區 | 延伸銷售期、發揮小核風味特色 |\n\n**品種成熟早晚與產地早晚是兩種因素。**同一品種在暖地、不同海拔與管理下，採期可以不同；不同品種則有其遺傳性的發育及成花特徵。成熟期分類也受比較地點影響，日期不宜背成全臺固定值。\n\n過去臺灣荔枝以黑葉等為主要生產基礎，集中上市時容易供過於求。後來南部增加玉荷包等高經濟價值早生品種，中部保留黑葉並發展糯米糍等較晚、品質具特色的材料，藉品種與地區組合分散供應。此為產業方向，不代表每一地區都已完成一致轉換。\n\n要達到「適地適種」，不能只看早生價格高就全臺改種玉荷包；仍須比較當地冬季低溫、秋梢成熟、花期降雨、裂果與落果風險、採收勞力及通路。某品種在暖冬開花不穩時，高單價可能被低商品產量抵銷。\n\n### 小題三：未來如何調整？（6 分）\n\n第一，選成花條件較適應產地氣候的品種，而不是把「早熟」直接當成「低溫需求低」。第二，讓末次秋梢適時成熟，調整採後修剪、氮肥與水分，避免冬季持續旺長，但花期與幼果期不能過度缺水。第三，以多品種、多產區分散暖冬與花期豪雨風險，搭配物候紀錄與溫雨監測調整管理及採收安排。\n\n### 可直接練寫的申論答案\n\n荔枝成花需成熟枝梢與適合較低溫誘導。暖秋冬使秋梢延遲成熟或萌生冬梢，頂芽維持營養生長，因而花量少、花期延後或產生帶葉花穗，降低結果；花期陰雨又可能進一步限制授粉。產區配置可用早生玉荷包、中生黑葉與晚生糯米糍為例，利用不同品種成熟期及南北、海拔的物候差異接續上市。臺灣產業由以黑葉量產為重要基礎，逐漸增加早生高價及晚生特色品種，以分散集中供應。但適地性仍須同時評估成花低溫、枝梢成熟、授粉、裂落果與通路，而非只追求早採。未來可選適合較暖冬季的材料、調整採後枝梢及氮水管理、分散品種產區並監測氣候，使成花與供應更穩定。\n\n### 配分與舊稿校正\n\n依 6＋18＋6 分安排，中間「品種與產地配置」應寫最多，至少完成三個具名品種的配置理由及產業變化。**玉荷包是早生例，舊版把它列成中生不妥；本稿已改用玉荷包—黑葉—糯米糍。** 111 果樹學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
