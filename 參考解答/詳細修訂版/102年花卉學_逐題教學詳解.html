ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 8 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"花卉學-102-一","s":"花卉學","y":102,"n":"一","t":"文心蘭高品質與劣變","body":"<h2>第一題｜文心蘭高品質與劣變（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>文心蘭高品質與劣變<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=14\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>生產需健康一致種苗、適熟假球莖、充足但不灼傷的光、水肥與通風，保護花梗並防花斑病蟲；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>切離後的水分與碳收支轉為赤字<\/strong><\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p><strong>不同處理各有明確功能<\/strong><\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<p><strong>採收成熟度與溫度決定後續品質上限<\/strong><\/p>\n<p>過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>生產需健康一致種苗、適熟假球莖、充足但不灼傷的光、水肥與通風，保護花梗並防花斑病蟲；<\/p>\n<p>採收以適當開花比例，避免過幼開花不足。採後失水、糖耗、乙烯、微生物堵管、擦傷與不適低溫皆會使落花、萎凋和變色，須即時補水與適溫冷鏈、潔淨保鮮及緩衝包裝。<\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：田間品質、成熟度、劣變因子與逐項管理。<\/p>\n<ul>\n<li><strong>田間品質<\/strong><\/li>\n<li><strong>成熟度<\/strong><\/li>\n<li><strong>劣變因子與逐項管理<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短時高濃度預措液與全程瓶插液視為相同用法。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=14","md":"102年花卉學_逐題教學詳解.md","search":"文心蘭高品質與劣變 ## 第一題｜文心蘭高品質與劣變（15 分）\n\n### 題意與作答範圍\n\n本題重點：**文心蘭高品質與劣變**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=14)。\n\n### 先掌握答案\n\n生產需健康一致種苗、適熟假球莖、充足但不灼傷的光、水肥與通風，保護花梗並防花斑病蟲；\n\n### 原理拆解：為什麼會這樣？\n\n**切離後的水分與碳收支轉為赤字**\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n**不同處理各有明確功能**\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n**採收成熟度與溫度決定後續品質上限**\n\n過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。\n\n### 可直接練寫的完整答案\n\n生產需健康一致種苗、適熟假球莖、充足但不灼傷的光、水肥與通風，保護花梗並防花斑病蟲；\n\n採收以適當開花比例，避免過幼開花不足。採後失水、糖耗、乙烯、微生物堵管、擦傷與不適低溫皆會使落花、萎凋和變色，須即時補水與適溫冷鏈、潔淨保鮮及緩衝包裝。\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n### 實例：把原理用在情境中\n\n百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：田間品質、成熟度、劣變因子與逐項管理。\n\n- **田間品質**\n- **成熟度**\n- **劣變因子與逐項管理**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短時高濃度預措液與全程瓶插液視為相同用法。\n 102 花卉學"},{"id":"花卉學-102-二","s":"花卉學","y":102,"n":"二","t":"乙烯與火鶴","body":"<h2>第二題｜乙烯與火鶴（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>乙烯與火鶴<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=14\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>乙烯可促敏感切花衰老、花瓣內捲、萎凋或脫落，作用強度因種類、品種、花齡與環境而異。火鶴受傷、受粉、逆境或不當處理後可能增加乙烯，出現佛焰苞失光、變色、肉穗及花梗品質下降；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>切離後的水分與碳收支轉為赤字<\/strong><\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p><strong>不同處理各有明確功能<\/strong><\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<p><strong>採收成熟度與溫度決定後續品質上限<\/strong><\/p>\n<p>過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。<\/p>\n<p><strong>成熟反應與乙烯感受<\/strong><\/p>\n<p>乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。<\/p>\n<p><strong>更年性與非更年性要比較反應型態<\/strong><\/p>\n<p>具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。<\/p>\n<p><strong>催熟與延後成熟都不能忽略品質<\/strong><\/p>\n<p>乙烯可整齊催熟已達生理成熟的果，卻不能讓極幼果補足田間累積不足的乾物；1-MCP 阻斷感受可延緩部分產品老化，但過強處理可能影響正常後熟。脫綠、果肉軟化和增甜亦不是必然同步。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>乙烯可促敏感切花衰老、花瓣內捲、萎凋或脫落，作用強度因種類、品種、花齡與環境而異。火鶴受傷、受粉、逆境或不當處理後可能增加乙烯，出現佛焰苞失光、變色、肉穗及花梗品質下降；<\/p>\n<p>仍須鑑別失水與寒害，不能把所有火鶴劣變都歸乙烯。<\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。<\/p>\n<p>香蕉在不當高溫下，果肉可軟化而果皮仍綠，顯示果肉成熟與葉綠素降解可不同步。不能僅看果皮未黃，就判斷乙烯完全沒有作用。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：一般生理、火鶴具體構造症狀、來源與防治。<\/p>\n<ul>\n<li><strong>一般生理<\/strong><\/li>\n<li><strong>火鶴具體構造症狀<\/strong><\/li>\n<li><strong>來源與防治<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短時高濃度預措液與全程瓶插液視為相同用法。<\/li>\n<li>說非更年性果實完全不會回應乙烯。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=14","md":"102年花卉學_逐題教學詳解.md","search":"乙烯與火鶴 ## 第二題｜乙烯與火鶴（10 分）\n\n### 題意與作答範圍\n\n本題重點：**乙烯與火鶴**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=14)。\n\n### 先掌握答案\n\n乙烯可促敏感切花衰老、花瓣內捲、萎凋或脫落，作用強度因種類、品種、花齡與環境而異。火鶴受傷、受粉、逆境或不當處理後可能增加乙烯，出現佛焰苞失光、變色、肉穗及花梗品質下降；\n\n### 原理拆解：為什麼會這樣？\n\n**切離後的水分與碳收支轉為赤字**\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n**不同處理各有明確功能**\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n**採收成熟度與溫度決定後續品質上限**\n\n過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。\n\n**成熟反應與乙烯感受**\n\n乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。\n\n**更年性與非更年性要比較反應型態**\n\n具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。\n\n**催熟與延後成熟都不能忽略品質**\n\n乙烯可整齊催熟已達生理成熟的果，卻不能讓極幼果補足田間累積不足的乾物；1-mcp 阻斷感受可延緩部分產品老化，但過強處理可能影響正常後熟。脫綠、果肉軟化和增甜亦不是必然同步。\n\n### 可直接練寫的完整答案\n\n乙烯可促敏感切花衰老、花瓣內捲、萎凋或脫落，作用強度因種類、品種、花齡與環境而異。火鶴受傷、受粉、逆境或不當處理後可能增加乙烯，出現佛焰苞失光、變色、肉穗及花梗品質下降；\n\n仍須鑑別失水與寒害，不能把所有火鶴劣變都歸乙烯。\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n### 實例：把原理用在情境中\n\n百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。\n\n香蕉在不當高溫下，果肉可軟化而果皮仍綠，顯示果肉成熟與葉綠素降解可不同步。不能僅看果皮未黃，就判斷乙烯完全沒有作用。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：一般生理、火鶴具體構造症狀、來源與防治。\n\n- **一般生理**\n- **火鶴具體構造症狀**\n- **來源與防治**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短時高濃度預措液與全程瓶插液視為相同用法。\n- 說非更年性果實完全不會回應乙烯。\n 102 花卉學"},{"id":"花卉學-102-三","s":"花卉學","y":102,"n":"三","t":"必要元素與花色","body":"<h2>第三題｜必要元素與花色（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>必要元素與花色<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=14\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>植物必要元素須符合缺乏即無法正常完成生活史、功能不能由其他元素完全替代，以及直接參與結構或代謝等判準。大量元素為 C、H、O、N、P、K、Ca、Mg、S，微量元素為 Fe、Mn、Zn、Cu、B、Mo、Cl、Ni。若問與顯色相關的元素，需先交代花種與色素：Mg 是葉綠素中心元素，Fe 參與葉綠素形成及多項酵素功能；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>花色問題不能只背一個肥料元素<\/strong><\/p>\n<p>必要元素的判準包括缺乏即無法完成生活史、功能不能由其他元素完全替代，以及直接參與結構或代謝。鎂是葉綠素中心元素，能解釋綠色與光合，不能因此保證解釋所有花瓣顏色；繡球藍色涉及鋁與花青素，但鋁不是一般高等植物公認的必要元素。若題意未指明花種與色素，應列機制與條件，避免硬選單一元素。<\/p>\n<p><strong>先找色素，再找影響顯色的環境<\/strong><\/p>\n<p>花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。<\/p>\n<p><strong>同一色素也能呈不同顏色<\/strong><\/p>\n<p>液泡 pH、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 pH 不會不經生理過程就等於花瓣液泡 pH。<\/p>\n<p><strong>用可驗證的機制解釋栽培或育種操作<\/strong><\/p>\n<p>繡球花的藍色涉及鋁有效性與花器內的色素複合，需同時考慮品種與介質；藍玫瑰育種則涉及花青素生合成途徑、競爭酵素與細胞條件。不能只以「施酸肥」解釋所有藍花。<\/p>\n<p><strong>第一步是分清吸收、運輸與需求<\/strong><\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p><strong>用新老葉位置推理<\/strong><\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<p><strong>最後必須用適當樣本驗證<\/strong><\/p>\n<p>依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>植物必要元素須符合缺乏即無法正常完成生活史、功能不能由其他元素完全替代，以及直接參與結構或代謝等判準。大量元素為 C、H、O、N、P、K、Ca、Mg、S，微量元素為 Fe、Mn、Zn、Cu、B、Mo、Cl、Ni。若問與顯色相關的元素，需先交代花種與色素：Mg 是葉綠素中心元素，Fe 參與葉綠素形成及多項酵素功能；<\/p>\n<p>繡球藍色與鋁—花青素複合相關，但 Al 通常不列一般高等植物必要元素。P、K 等可藉營養與代謝間接影響花色，不能把所有花色問題硬歸單一必要元素。<\/p>\n<p>必要元素的判準包括缺乏即無法完成生活史、功能不能由其他元素完全替代，以及直接參與結構或代謝。鎂是葉綠素中心元素，能解釋綠色與光合，不能因此保證解釋所有花瓣顏色；繡球藍色涉及鋁與花青素，但鋁不是一般高等植物公認的必要元素。若題意未指明花種與色素，應列機制與條件，避免硬選單一元素。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同品種繡球在適合條件下，可因根域酸度影響鋁有效性而改變顯色；白花或缺乏相關色素能力的品種，不能保證以同一方法轉成藍花。<\/p>\n<p>老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：指出題意語境、必要性與作用、避免把鋁當普遍必需。<\/p>\n<ul>\n<li><strong>指出題意語境<\/strong><\/li>\n<li><strong>必要性與作用<\/strong><\/li>\n<li><strong>避免把鋁當普遍必需<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有黃花都歸因於花青素。<\/li>\n<li>只寫缺肥會黃葉，沒有指出葉齡與黃化分布。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=14","md":"102年花卉學_逐題教學詳解.md","search":"必要元素與花色 ## 第三題｜必要元素與花色（10 分）\n\n### 題意與作答範圍\n\n本題重點：**必要元素與花色**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=14)。\n\n### 先掌握答案\n\n植物必要元素須符合缺乏即無法正常完成生活史、功能不能由其他元素完全替代，以及直接參與結構或代謝等判準。大量元素為 c、h、o、n、p、k、ca、mg、s，微量元素為 fe、mn、zn、cu、b、mo、cl、ni。若問與顯色相關的元素，需先交代花種與色素：mg 是葉綠素中心元素，fe 參與葉綠素形成及多項酵素功能；\n\n### 原理拆解：為什麼會這樣？\n\n**花色問題不能只背一個肥料元素**\n\n必要元素的判準包括缺乏即無法完成生活史、功能不能由其他元素完全替代，以及直接參與結構或代謝。鎂是葉綠素中心元素，能解釋綠色與光合，不能因此保證解釋所有花瓣顏色；繡球藍色涉及鋁與花青素，但鋁不是一般高等植物公認的必要元素。若題意未指明花種與色素，應列機制與條件，避免硬選單一元素。\n\n**先找色素，再找影響顯色的環境**\n\n花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。\n\n**同一色素也能呈不同顏色**\n\n液泡 ph、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 ph 不會不經生理過程就等於花瓣液泡 ph。\n\n**用可驗證的機制解釋栽培或育種操作**\n\n繡球花的藍色涉及鋁有效性與花器內的色素複合，需同時考慮品種與介質；藍玫瑰育種則涉及花青素生合成途徑、競爭酵素與細胞條件。不能只以「施酸肥」解釋所有藍花。\n\n**第一步是分清吸收、運輸與需求**\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n**用新老葉位置推理**\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n**最後必須用適當樣本驗證**\n\n依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。\n\n### 可直接練寫的完整答案\n\n植物必要元素須符合缺乏即無法正常完成生活史、功能不能由其他元素完全替代，以及直接參與結構或代謝等判準。大量元素為 c、h、o、n、p、k、ca、mg、s，微量元素為 fe、mn、zn、cu、b、mo、cl、ni。若問與顯色相關的元素，需先交代花種與色素：mg 是葉綠素中心元素，fe 參與葉綠素形成及多項酵素功能；\n\n繡球藍色與鋁—花青素複合相關，但 al 通常不列一般高等植物必要元素。p、k 等可藉營養與代謝間接影響花色，不能把所有花色問題硬歸單一必要元素。\n\n必要元素的判準包括缺乏即無法完成生活史、功能不能由其他元素完全替代，以及直接參與結構或代謝。鎂是葉綠素中心元素，能解釋綠色與光合，不能因此保證解釋所有花瓣顏色；繡球藍色涉及鋁與花青素，但鋁不是一般高等植物公認的必要元素。若題意未指明花種與色素，應列機制與條件，避免硬選單一元素。\n\n### 實例：把原理用在情境中\n\n同品種繡球在適合條件下，可因根域酸度影響鋁有效性而改變顯色；白花或缺乏相關色素能力的品種，不能保證以同一方法轉成藍花。\n\n老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：指出題意語境、必要性與作用、避免把鋁當普遍必需。\n\n- **指出題意語境**\n- **必要性與作用**\n- **避免把鋁當普遍必需**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有黃花都歸因於花青素。\n- 只寫缺肥會黃葉，沒有指出葉齡與黃化分布。\n 102 花卉學"},{"id":"花卉學-102-四","s":"花卉學","y":102,"n":"四","t":"生物性肥料","body":"<h2>第四題｜生物性肥料（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>生物性肥料<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=14\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>含有能存活、有益於養分取得的微生物，如固氮菌供氮、溶磷菌提高磷有效性、菌根擴大根外吸收範圍。花卉接種需健康根與適合介質、避免不相容藥劑、高磷抑菌根及失效存放；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>含有能存活、有益於養分取得的微生物，如固氮菌供氮、溶磷菌提高磷有效性、菌根擴大根外吸收範圍。花卉接種需健康根與適合介質、避免不相容藥劑、高磷抑菌根及失效存放；<\/p>\n<p>不是一般含有機質的肥料同義詞，亦不能無條件替代全部水肥。<\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：定義、三例及機制、使用條件。<\/p>\n<ul>\n<li><strong>三例及機制<\/strong><\/li>\n<li><strong>使用條件<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=14","md":"102年花卉學_逐題教學詳解.md","search":"生物性肥料 ## 第四題｜生物性肥料（15 分）\n\n### 題意與作答範圍\n\n本題重點：**生物性肥料**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=14)。\n\n### 先掌握答案\n\n含有能存活、有益於養分取得的微生物，如固氮菌供氮、溶磷菌提高磷有效性、菌根擴大根外吸收範圍。花卉接種需健康根與適合介質、避免不相容藥劑、高磷抑菌根及失效存放；\n\n### 原理拆解：為什麼會這樣？\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n### 可直接練寫的完整答案\n\n含有能存活、有益於養分取得的微生物，如固氮菌供氮、溶磷菌提高磷有效性、菌根擴大根外吸收範圍。花卉接種需健康根與適合介質、避免不相容藥劑、高磷抑菌根及失效存放；\n\n不是一般含有機質的肥料同義詞，亦不能無條件替代全部水肥。\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n### 實例：把原理用在情境中\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：定義、三例及機制、使用條件。\n\n- **三例及機制**\n- **使用條件**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將連作障礙全部歸因於缺肥。\n 102 花卉學"},{"id":"花卉學-102-五","s":"花卉學","y":102,"n":"五","t":"五小題計算","body":"<h2>第五題｜五小題計算（25 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五小題計算<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=14\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>(1)九週反應型聖誕紅 10 月 10 日停止暗期中斷、開始有效長夜，9×7＝63 日，約 12 月 12 日開花，受環境誤差影響。<\/p>\n<p>(2)DIF＝日溫−夜溫＝−2，若日夜各 12 小時且均溫 21，D+N＝42、D−N＝−2，得日 20°C、夜 22°C；<\/p>\n<p>若日長不同須按時數加權。<\/p>\n<p>(3)9 cm 盆若採冠幅約盆徑 1.5–2 倍的市場規格，約 13.5–18 cm，但題目未給指定倍數，無唯一數值。<\/p>\n<p>(4)葉序 2/5，夾角＝360×2/5＝144°。<\/p>\n<p>(5)−0.1 bar 壓力頭約 102 cm 水柱，pF＝log10(102)≈2.01。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先寫定義與單位再代數字<\/strong><\/p>\n<p>肥料百分率是重量基準，N 直接以元素量標示，磷與鉀通常以 P₂O₅、K₂O 表示；莫耳濃度則須分清一莫耳化合物含幾莫耳目標元素。題目單位不同，公式不可直接共用。<\/p>\n<p><strong>保留換算比例才能檢查<\/strong><\/p>\n<p>氧化物換元素用元素在該化學式的質量比例；母液稀釋先算目標莫耳數再除以母液濃度。DIF 用日溫減夜溫，均溫則按時數加權，pF 使用以公分水柱表示的壓力頭取常用對數。<\/p>\n<p><strong>答案需列假設與合理位數<\/strong><\/p>\n<p>先顯示式子，後列數值和單位。原題若原子量誤植或缺少盆徑與冠幅比例等條件，應說明正確知識及缺少的假設，不能以一個看似精確的數字掩蓋資訊不足。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>以下依各小題順序列公式、代入與結果：<\/p>\n<p>(1)九週反應型聖誕紅 10 月 每題 5 分，方程與假設必列；冠幅題資訊不足不可捏造唯一標準。\n\n- **每題 5 分，方程與假設必列**\n- **冠幅題資訊不足不可捏造唯一標準**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把 p₂o₅ 的重量直接當成元素磷。\n 102 花卉學"},{"id":"花卉學-102-六","s":"花卉學","y":102,"n":"六","t":"扦插內外因素","body":"<h2>第六題｜扦插內外因素（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>扦插內外因素<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=14\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>內因為基因型、母株健康、枝齡、碳氮、內生生長素、葉芽及抑制物；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>內因為基因型、母株健康、枝齡、碳氮、內生生長素、葉芽及抑制物；<\/p>\n<p>外因為光溫濕、水氣比、介質、病原與處理。以嫩枝保葉供碳、間歇噴霧降低蒸散、適量 IBA 促根，但過量或長期飽水傷害基部。<\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：內外各列多項並連結發根原理。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=14","md":"102年花卉學_逐題教學詳解.md","search":"扦插內外因素 ## 第六題｜扦插內外因素（10 分）\n\n### 題意與作答範圍\n\n本題重點：**扦插內外因素**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=14)。\n\n### 先掌握答案\n\n內因為基因型、母株健康、枝齡、碳氮、內生生長素、葉芽及抑制物；\n\n### 原理拆解：為什麼會這樣？\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n### 可直接練寫的完整答案\n\n內因為基因型、母株健康、枝齡、碳氮、內生生長素、葉芽及抑制物；\n\n外因為光溫濕、水氣比、介質、病原與處理。以嫩枝保葉供碳、間歇噴霧降低蒸散、適量 iba 促根，但過量或長期飽水傷害基部。\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n### 實例：把原理用在情境中\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：內外各列多項並連結發根原理。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無性繁殖與無病毒畫上等號。\n 102 花卉學"},{"id":"花卉學-102-七","s":"花卉學","y":102,"n":"七","t":"轉殖育種利用與前景","body":"<h2>第七題｜轉殖育種利用與前景（5 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>轉殖育種利用與前景<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=14\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>可導入抗病蟲、延緩衰老、改色、香氣與株型等性狀，流程為目標基因、載體、轉入、選殖、再生、分子確認與穩定性／安全評估。優勢為突破部分性狀來源限制，瓶頸為品種再生能力、插入效應、授權與法規及市場接受，仍需傳統育種整合農藝品質。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>可導入抗病蟲、延緩衰老、改色、香氣與株型等性狀，流程為目標基因、載體、轉入、選殖、再生、分子確認與穩定性／安全評估。優勢為突破部分性狀來源限制，瓶頸為品種再生能力、插入效應、授權與法規及市場接受，仍需傳統育種整合農藝品質。<\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>5 分：用途、核心流程、優勢與限制。<\/p>\n<ul>\n<li><strong>核心流程<\/strong><\/li>\n<li><strong>優勢與限制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=14","md":"102年花卉學_逐題教學詳解.md","search":"轉殖育種利用與前景 ## 第七題｜轉殖育種利用與前景（5 分）\n\n### 題意與作答範圍\n\n本題重點：**轉殖育種利用與前景**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=14)。\n\n### 先掌握答案\n\n可導入抗病蟲、延緩衰老、改色、香氣與株型等性狀，流程為目標基因、載體、轉入、選殖、再生、分子確認與穩定性／安全評估。優勢為突破部分性狀來源限制，瓶頸為品種再生能力、插入效應、授權與法規及市場接受，仍需傳統育種整合農藝品質。\n\n### 原理拆解：為什麼會這樣？\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n### 可直接練寫的完整答案\n\n可導入抗病蟲、延緩衰老、改色、香氣與株型等性狀，流程為目標基因、載體、轉入、選殖、再生、分子確認與穩定性／安全評估。優勢為突破部分性狀來源限制，瓶頸為品種再生能力、插入效應、授權與法規及市場接受，仍需傳統育種整合農藝品質。\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n### 實例：把原理用在情境中\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n### 配分重點：哪些內容不能漏？\n\n5 分：用途、核心流程、優勢與限制。\n\n- **核心流程**\n- **優勢與限制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把轉入基因成功直接等同育成可商業化品種。\n 102 花卉學"},{"id":"花卉學-102-八","s":"花卉學","y":102,"n":"八","t":"藍玫瑰原理","body":"<h2>第八題｜藍玫瑰原理（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>藍玫瑰原理<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=14\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>玫瑰通常缺乏有效合成飛燕草素所需的 F3′5′H 路徑；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先找色素，再找影響顯色的環境<\/strong><\/p>\n<p>花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。<\/p>\n<p><strong>同一色素也能呈不同顏色<\/strong><\/p>\n<p>液泡 pH、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 pH 不會不經生理過程就等於花瓣液泡 pH。<\/p>\n<p><strong>用可驗證的機制解釋栽培或育種操作<\/strong><\/p>\n<p>繡球花的藍色涉及鋁有效性與花器內的色素複合，需同時考慮品種與介質；藍玫瑰育種則涉及花青素生合成途徑、競爭酵素與細胞條件。不能只以「施酸肥」解釋所有藍花。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>玫瑰通常缺乏有效合成飛燕草素所需的 F3′5′H 路徑；<\/p>\n<p>導入相關基因並調整競爭分支，可累積偏藍的飛燕草素花青素。真正色調還受液泡 pH、共色素、金屬與表皮影響，故商品常呈藍紫或淡紫，不能說只放入一個「藍色基因」即可得到純藍。<\/p>\n<p>花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。<\/p>\n<p>液泡 pH、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 pH 不會不經生理過程就等於花瓣液泡 pH。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同品種繡球在適合條件下，可因根域酸度影響鋁有效性而改變顯色；白花或缺乏相關色素能力的品種，不能保證以同一方法轉成藍花。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：F3′5′H、飛燕草素、競爭路徑與細胞環境。<\/p>\n<ul>\n<li><strong>F3′5′H<\/strong><\/li>\n<li><strong>飛燕草素<\/strong><\/li>\n<li><strong>競爭路徑與細胞環境<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有黃花都歸因於花青素。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=14","md":"102年花卉學_逐題教學詳解.md","search":"藍玫瑰原理 ## 第八題｜藍玫瑰原理（10 分）\n\n### 題意與作答範圍\n\n本題重點：**藍玫瑰原理**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=14)。\n\n### 先掌握答案\n\n玫瑰通常缺乏有效合成飛燕草素所需的 f3′5′h 路徑；\n\n### 原理拆解：為什麼會這樣？\n\n**先找色素，再找影響顯色的環境**\n\n花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。\n\n**同一色素也能呈不同顏色**\n\n液泡 ph、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 ph 不會不經生理過程就等於花瓣液泡 ph。\n\n**用可驗證的機制解釋栽培或育種操作**\n\n繡球花的藍色涉及鋁有效性與花器內的色素複合，需同時考慮品種與介質；藍玫瑰育種則涉及花青素生合成途徑、競爭酵素與細胞條件。不能只以「施酸肥」解釋所有藍花。\n\n### 可直接練寫的完整答案\n\n玫瑰通常缺乏有效合成飛燕草素所需的 f3′5′h 路徑；\n\n導入相關基因並調整競爭分支，可累積偏藍的飛燕草素花青素。真正色調還受液泡 ph、共色素、金屬與表皮影響，故商品常呈藍紫或淡紫，不能說只放入一個「藍色基因」即可得到純藍。\n\n花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。\n\n液泡 ph、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 ph 不會不經生理過程就等於花瓣液泡 ph。\n\n### 實例：把原理用在情境中\n\n同品種繡球在適合條件下，可因根域酸度影響鋁有效性而改變顯色；白花或缺乏相關色素能力的品種，不能保證以同一方法轉成藍花。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：f3′5′h、飛燕草素、競爭路徑與細胞環境。\n\n- **f3′5′h**\n- **飛燕草素**\n- **競爭路徑與細胞環境**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有黃花都歸因於花青素。\n 102 花卉學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementByI '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
