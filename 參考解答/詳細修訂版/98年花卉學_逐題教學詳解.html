：<strong>規格機械自動化與國際化<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=26\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>國際供應需可比較的等級、包裝與檢驗規格，才能訂單交易、提高物流效率與信任。機械化降低採後分級、搬運與灌溉勞力，自動化環控和記錄提高均一性及可追溯，但應先統一盆器、苗齡與作業流程，再選設備，並比較投資、維修和產品價值。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>設施先改變能量與物質交換<\/strong><\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p><strong>各因子必須一起管理<\/strong><\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<p><strong>控制成效要用植株與環境資料驗證<\/strong><\/p>\n<p>以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>國際供應需可比較的等級、包裝與檢驗規格，才能訂單交易、提高物流效率與信任。機械化降低採後分級、搬運與灌溉勞力，自動化環控和記錄提高均一性及可追溯，但應先統一盆器、苗齡與作業流程，再選設備，並比較投資、維修和產品價值。<\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：規格→機械→穩供因果、品質成本、實例與限制。<\/p>\n<ul>\n<li><strong>規格→機械→穩供因果<\/strong><\/li>\n<li><strong>品質成本<\/strong><\/li>\n<li><strong>實例與限制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將溫室直接等同低溫環境。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=26","md":"98年花卉學_逐題教學詳解.md","search":"規格機械自動化與國際化 ## 第一題｜規格機械自動化與國際化（20 分）\n\n### 題意與作答範圍\n\n本題重點：**規格機械自動化與國際化**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=26)。\n\n### 先掌握答案\n\n國際供應需可比較的等級、包裝與檢驗規格，才能訂單交易、提高物流效率與信任。機械化降低採後分級、搬運與灌溉勞力，自動化環控和記錄提高均一性及可追溯，但應先統一盆器、苗齡與作業流程，再選設備，並比較投資、維修和產品價值。\n\n### 原理拆解：為什麼會這樣？\n\n**設施先改變能量與物質交換**\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n**各因子必須一起管理**\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n**控制成效要用植株與環境資料驗證**\n\n以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。\n\n### 可直接練寫的完整答案\n\n國際供應需可比較的等級、包裝與檢驗規格，才能訂單交易、提高物流效率與信任。機械化降低採後分級、搬運與灌溉勞力，自動化環控和記錄提高均一性及可追溯，但應先統一盆器、苗齡與作業流程，再選設備，並比較投資、維修和產品價值。\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n### 實例：把原理用在情境中\n\n臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：規格→機械→穩供因果、品質成本、實例與限制。\n\n- **規格→機械→穩供因果**\n- **品質成本**\n- **實例與限制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將溫室直接等同低溫環境。\n 98 花卉學"},{"id":"花卉學-98-二","s":"花卉學","y":98,"n":"二","t":"蝴蝶蘭春化三特性與花期","body":"<h2>第二題｜蝴蝶蘭春化三特性與花期（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>蝴蝶蘭春化三特性與花期<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=26\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>蝴蝶蘭常以成熟植株低溫誘導概括稱春化，但嚴格應區分一般溫度促花與典型需冷春化。三重點為須達成熟大小、較低日溫／一段適溫處理可促抽梗、高溫可抑制；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>設施先改變能量與物質交換<\/strong><\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p><strong>各因子必須一起管理<\/strong><\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<p><strong>控制成效要用植株與環境資料驗證<\/strong><\/p>\n<p>以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。<\/p>\n<p><strong>低溫建立的是成花能力<\/strong><\/p>\n<p>春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。<\/p>\n<p><strong>反應取決品種與發育年齡<\/strong><\/p>\n<p>種子或幼苗可感受低溫的類型，與須先達一定大小的綠體春化型不同。低溫的有效程度受溫度、持續時間、植株大小及後續條件影響；未達感應能力時，長時間低溫也不一定得到同樣效果。<\/p>\n<p><strong>感應完成仍須完成花芽發育<\/strong><\/p>\n<p>春化後的日長、溫度與營養決定抽薹和花器發育。部分植物在特定條件下有去春化反應，不能把處理完成看成保證當日開花。生產上須將育苗、低溫與後續栽培排成完整時程。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>蝴蝶蘭常以成熟植株低溫誘導概括稱春化，但嚴格應區分一般溫度促花與典型需冷春化。三重點為須達成熟大小、較低日溫／一段適溫處理可促抽梗、高溫可抑制；<\/p>\n<p>並非只靠大日夜溫差。先高溫養大與延花，再按品種降溫促梗，抽梗後調溫控花梗與上市日。<\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。<\/p>\n<p>部分甘藍類須先長到足夠大小再受低溫，才能順利抽薹開花供採種；食用生產則要避免幼苗過早達感應大小後遇冷，以減少未熟抽薹。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：三條件、先養大再催花、術語限制。<\/p>\n<ul>\n<li><strong>三條件<\/strong><\/li>\n<li><strong>先養大再催花<\/strong><\/li>\n<li><strong>術語限制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將溫室直接等同低溫環境。<\/li>\n<li>把低溫解除休眠與低溫誘導成花當成同義。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=26","md":"98年花卉學_逐題教學詳解.md","search":"蝴蝶蘭春化三特性與花期 ## 第二題｜蝴蝶蘭春化三特性與花期（10 分）\n\n### 題意與作答範圍\n\n本題重點：**蝴蝶蘭春化三特性與花期**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=26)。\n\n### 先掌握答案\n\n蝴蝶蘭常以成熟植株低溫誘導概括稱春化，但嚴格應區分一般溫度促花與典型需冷春化。三重點為須達成熟大小、較低日溫／一段適溫處理可促抽梗、高溫可抑制；\n\n### 原理拆解：為什麼會這樣？\n\n**設施先改變能量與物質交換**\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n**各因子必須一起管理**\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n**控制成效要用植株與環境資料驗證**\n\n以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。\n\n**低溫建立的是成花能力**\n\n春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。\n\n**反應取決品種與發育年齡**\n\n種子或幼苗可感受低溫的類型，與須先達一定大小的綠體春化型不同。低溫的有效程度受溫度、持續時間、植株大小及後續條件影響；未達感應能力時，長時間低溫也不一定得到同樣效果。\n\n**感應完成仍須完成花芽發育**\n\n春化後的日長、溫度與營養決定抽薹和花器發育。部分植物在特定條件下有去春化反應，不能把處理完成看成保證當日開花。生產上須將育苗、低溫與後續栽培排成完整時程。\n\n### 可直接練寫的完整答案\n\n蝴蝶蘭常以成熟植株低溫誘導概括稱春化，但嚴格應區分一般溫度促花與典型需冷春化。三重點為須達成熟大小、較低日溫／一段適溫處理可促抽梗、高溫可抑制；\n\n並非只靠大日夜溫差。先高溫養大與延花，再按品種降溫促梗，抽梗後調溫控花梗與上市日。\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n### 實例：把原理用在情境中\n\n臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。\n\n部分甘藍類須先長到足夠大小再受低溫，才能順利抽薹開花供採種；食用生產則要避免幼苗過早達感應大小後遇冷，以減少未熟抽薹。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：三條件、先養大再催花、術語限制。\n\n- **三條件**\n- **先養大再催花**\n- **術語限制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將溫室直接等同低溫環境。\n- 把低溫解除休眠與低溫誘導成花當成同義。\n 98 花卉學"},{"id":"花卉學-98-三","s":"花卉學","y":98,"n":"三","t":"玫瑰開花與偃枝","body":"<h2>第三題｜玫瑰開花與偃枝（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>玫瑰開花與偃枝<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=26\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>多數商業重複開花玫瑰於新梢頂端形成花，採花後側芽再抽。偃枝保留部分葉枝作光合源，水平／下垂減少頂端抑制，有利基部強枝萌發；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先由當期新梢理解開花<\/strong><\/p>\n<p>多數切花玫瑰的花在當期伸長枝頂端形成，採切或修剪後由腋芽再萌生花枝。剪口位置、保留葉量與芽的成熟狀態會影響新枝粗度、長度與採收時間，不能只用長日或短日分類解釋。<\/p>\n<p><strong>偃枝保留供源，直立花枝作為主要庫<\/strong><\/p>\n<p>將部分營養枝彎折，使其減弱頂端優勢與直立競爭，保留葉面積供應同化物；基部或保留芽形成直立採花枝。彎而不折斷維管束、維持葉片受光和健康，是效益成立的條件。<\/p>\n<p><strong>修剪要同時更新與避免過度減葉<\/strong><\/p>\n<p>去病弱、老化與交叉枝可改善通風並促更新；若重剪時去除大量有效葉，短期供碳反而不足。應按品種、市場枝長、採花節奏與季節光量調整，並防彎枝層過密。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>多數商業重複開花玫瑰於新梢頂端形成花，採花後側芽再抽。偃枝保留部分葉枝作光合源，水平／下垂減少頂端抑制，有利基部強枝萌發；<\/p>\n<p>直立新枝作高品質採花枝。兼顧葉幕採光、水肥與採收位置，不能把全部枝葉剪光後期待高產。<\/p>\n<p>多數切花玫瑰的花在當期伸長枝頂端形成，採切或修剪後由腋芽再萌生花枝。剪口位置、保留葉量與芽的成熟狀態會影響新枝粗度、長度與採收時間，不能只用長日或短日分類解釋。<\/p>\n<p>將部分營養枝彎折，使其減弱頂端優勢與直立競爭，保留葉面積供應同化物；基部或保留芽形成直立採花枝。彎而不折斷維管束、維持葉片受光和健康，是效益成立的條件。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>冬季低光期若仍大幅去除偃枝葉片，後續採花枝可能細弱；維持健康供源層並合理調整採枝數，比只追求萌芽數更能維持合格花枝。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：開花位置、枝條更新、偃枝源庫與頂端優勢。<\/p>\n<ul>\n<li><strong>開花位置<\/strong><\/li>\n<li><strong>枝條更新<\/strong><\/li>\n<li><strong>偃枝源庫與頂端優勢<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把偃枝當作把供源葉全部剪除。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=26","md":"98年花卉學_逐題教學詳解.md","search":"玫瑰開花與偃枝 ## 第三題｜玫瑰開花與偃枝（10 分）\n\n### 題意與作答範圍\n\n本題重點：**玫瑰開花與偃枝**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=26)。\n\n### 先掌握答案\n\n多數商業重複開花玫瑰於新梢頂端形成花，採花後側芽再抽。偃枝保留部分葉枝作光合源，水平／下垂減少頂端抑制，有利基部強枝萌發；\n\n### 原理拆解：為什麼會這樣？\n\n**先由當期新梢理解開花**\n\n多數切花玫瑰的花在當期伸長枝頂端形成，採切或修剪後由腋芽再萌生花枝。剪口位置、保留葉量與芽的成熟狀態會影響新枝粗度、長度與採收時間，不能只用長日或短日分類解釋。\n\n**偃枝保留供源，直立花枝作為主要庫**\n\n將部分營養枝彎折，使其減弱頂端優勢與直立競爭，保留葉面積供應同化物；基部或保留芽形成直立採花枝。彎而不折斷維管束、維持葉片受光和健康，是效益成立的條件。\n\n**修剪要同時更新與避免過度減葉**\n\n去病弱、老化與交叉枝可改善通風並促更新；若重剪時去除大量有效葉，短期供碳反而不足。應按品種、市場枝長、採花節奏與季節光量調整，並防彎枝層過密。\n\n### 可直接練寫的完整答案\n\n多數商業重複開花玫瑰於新梢頂端形成花，採花後側芽再抽。偃枝保留部分葉枝作光合源，水平／下垂減少頂端抑制，有利基部強枝萌發；\n\n直立新枝作高品質採花枝。兼顧葉幕採光、水肥與採收位置，不能把全部枝葉剪光後期待高產。\n\n多數切花玫瑰的花在當期伸長枝頂端形成，採切或修剪後由腋芽再萌生花枝。剪口位置、保留葉量與芽的成熟狀態會影響新枝粗度、長度與採收時間，不能只用長日或短日分類解釋。\n\n將部分營養枝彎折，使其減弱頂端優勢與直立競爭，保留葉面積供應同化物；基部或保留芽形成直立採花枝。彎而不折斷維管束、維持葉片受光和健康，是效益成立的條件。\n\n### 實例：把原理用在情境中\n\n冬季低光期若仍大幅去除偃枝葉片，後續採花枝可能細弱；維持健康供源層並合理調整採枝數，比只追求萌芽數更能維持合格花枝。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：開花位置、枝條更新、偃枝源庫與頂端優勢。\n\n- **開花位置**\n- **枝條更新**\n- **偃枝源庫與頂端優勢**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把偃枝當作把供源葉全部剪除。\n 98 花卉學"},{"id":"花卉學-98-四","s":"花卉學","y":98,"n":"四","t":"菊花密植減除腋芽","body":"<h2>第四題｜菊花密植減除腋芽（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>菊花密植減除腋芽<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=26\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>較密群體及光質改變可抑側芽伸長，讓單莖花栽培減少逐芽摘除工作，配合支架維持直立；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>密植可以減腋芽，卻有品質代價<\/strong><\/p>\n<p>密植造成側向遮蔭與資源競爭，可抑制部分腋芽生長而減少人工除芽，但同時可能使花莖細弱、通風差及病害增加。需用單位面積合格花枝數與等級衡量，而不是只計算除芽工時。若採單枝菊切花系統，密度、光量與供肥須一併調整。<\/p>\n<p><strong>產量要以單位土地和有效葉面積看<\/strong><\/p>\n<p>大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。<\/p>\n<p><strong>整枝、修剪和負載互相制約<\/strong><\/p>\n<p>整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。<\/p>\n<p><strong>矮化與密植的效益有條件<\/strong><\/p>\n<p>矮砧、低幹與細長冠可早形成土地有效葉面積、方便作業，且減大型骨架消耗；但過密仍會陰蔽、著色差與病害。支架、灌溉、疏果及持續更新是技術成本，不應只列早產優點。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>較密群體及光質改變可抑側芽伸長，讓單莖花栽培減少逐芽摘除工作，配合支架維持直立；<\/p>\n<p>但過密會降低光合、花徑與莖粗並增病害。必須在合格花朵與花莖規格下尋適密度，且品種有差異，不能保證密植完全不用除芽。<\/p>\n<p>密植造成側向遮蔭與資源競爭，可抑制部分腋芽生長而減少人工除芽，但同時可能使花莖細弱、通風差及病害增加。需用單位面積合格花枝數與等級衡量，而不是只計算除芽工時。若採單枝菊切花系統，密度、光量與供肥須一併調整。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>矮砧蘋果密植常可提高早期每公頃產量，即使單株產量較低；若後期冠層封閉卻不調枝，早期優勢會被陰蔽與品質下降抵銷。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：側芽光環境、勞力、支架與品質取捨。<\/p>\n<ul>\n<li><strong>側芽光環境<\/strong><\/li>\n<li><strong>支架與品質取捨<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把修剪一律理解為越重越好。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=26","md":"98年花卉學_逐題教學詳解.md","search":"菊花密植減除腋芽 ## 第四題｜菊花密植減除腋芽（10 分）\n\n### 題意與作答範圍\n\n本題重點：**菊花密植減除腋芽**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=26)。\n\n### 先掌握答案\n\n較密群體及光質改變可抑側芽伸長，讓單莖花栽培減少逐芽摘除工作，配合支架維持直立；\n\n### 原理拆解：為什麼會這樣？\n\n**密植可以減腋芽，卻有品質代價**\n\n密植造成側向遮蔭與資源競爭，可抑制部分腋芽生長而減少人工除芽，但同時可能使花莖細弱、通風差及病害增加。需用單位面積合格花枝數與等級衡量，而不是只計算除芽工時。若採單枝菊切花系統，密度、光量與供肥須一併調整。\n\n**產量要以單位土地和有效葉面積看**\n\n大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。\n\n**整枝、修剪和負載互相制約**\n\n整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。\n\n**矮化與密植的效益有條件**\n\n矮砧、低幹與細長冠可早形成土地有效葉面積、方便作業，且減大型骨架消耗；但過密仍會陰蔽、著色差與病害。支架、灌溉、疏果及持續更新是技術成本，不應只列早產優點。\n\n### 可直接練寫的完整答案\n\n較密群體及光質改變可抑側芽伸長，讓單莖花栽培減少逐芽摘除工作，配合支架維持直立；\n\n但過密會降低光合、花徑與莖粗並增病害。必須在合格花朵與花莖規格下尋適密度，且品種有差異，不能保證密植完全不用除芽。\n\n密植造成側向遮蔭與資源競爭，可抑制部分腋芽生長而減少人工除芽，但同時可能使花莖細弱、通風差及病害增加。需用單位面積合格花枝數與等級衡量，而不是只計算除芽工時。若採單枝菊切花系統，密度、光量與供肥須一併調整。\n\n### 實例：把原理用在情境中\n\n矮砧蘋果密植常可提高早期每公頃產量，即使單株產量較低；若後期冠層封閉卻不調枝，早期優勢會被陰蔽與品質下降抵銷。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：側芽光環境、勞力、支架與品質取捨。\n\n- **側芽光環境**\n- **支架與品質取捨**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把修剪一律理解為越重越好。\n 98 花卉學"},{"id":"花卉學-98-五","s":"花卉學","y":98,"n":"五","t":"15-15-15-4 標示","body":"<h2>第五題｜15-15-15-4 標示（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>15-15-15-4 標示<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=26\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>四數常指 N、P₂O₅、K₂O、MgO 的質量百分比。鎂供葉綠素與酵素活化、維持光合葉供碳，對連續開花與高品質不可缺；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>第一步是分清吸收、運輸與需求<\/strong><\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p><strong>用新老葉位置推理<\/strong><\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<p><strong>最後必須用適當樣本驗證<\/strong><\/p>\n<p>依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>四數常指 N、P₂O₅、K₂O、MgO 的質量百分比。鎂供葉綠素與酵素活化、維持光合葉供碳，對連續開花與高品質不可缺；<\/p>\n<p>標示為氧化物當量不等於元素量，需要時乘分子量比換算，第四項仍應依包裝確認。<\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：四成分、百分比基準、鎂功能與元素換算差別。<\/p>\n<ul>\n<li><strong>四成分<\/strong><\/li>\n<li><strong>百分比基準<\/strong><\/li>\n<li><strong>鎂功能與元素換算差別<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>只寫缺肥會黃葉，沒有指出葉齡與黃化分布。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=26","md":"98年花卉學_逐題教學詳解.md","search":"15-15-15-4 標示 ## 第五題｜15-15-15-4 標示（10 分）\n\n### 題意與作答範圍\n\n本題重點：**15-15-15-4 標示**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=26)。\n\n### 先掌握答案\n\n四數常指 n、p₂o₅、k₂o、mgo 的質量百分比。鎂供葉綠素與酵素活化、維持光合葉供碳，對連續開花與高品質不可缺；\n\n### 原理拆解：為什麼會這樣？\n\n**第一步是分清吸收、運輸與需求**\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n**用新老葉位置推理**\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n**最後必須用適當樣本驗證**\n\n依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。\n\n### 可直接練寫的完整答案\n\n四數常指 n、p₂o₅、k₂o、mgo 的質量百分比。鎂供葉綠素與酵素活化、維持光合葉供碳，對連續開花與高品質不可缺；\n\n標示為氧化物當量不等於元素量，需要時乘分子量比換算，第四項仍應依包裝確認。\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n### 實例：把原理用在情境中\n\n老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：四成分、百分比基準、鎂功能與元素換算差別。\n\n- **四成分**\n- **百分比基準**\n- **鎂功能與元素換算差別**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 只寫缺肥會黃葉，沒有指出葉齡與黃化分布。\n 98 花卉學"},{"id":"花卉學-98-六","s":"花卉學","y":98,"n":"六","t":"花卉產業趨勢","body":"<h2>第六題｜花卉產業趨勢（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>花卉產業趨勢<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=26\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>依歷史與持續趨勢可論專業分工、種苗跨國流動、品種權與研發、規格化與自動化、契作與訂單、冷鏈及電商，並增加節能、低碳、病原安全和多樣化消費。臺灣宜以育種、健康苗與高品質穩供競爭，不能只比較低工資或總產量。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<p><strong>設施先改變能量與物質交換<\/strong><\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p><strong>各因子必須一起管理<\/strong><\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<p><strong>控制成效要用植株與環境資料驗證<\/strong><\/p>\n<p>以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>依歷史與持續趨勢可論專業分工、種苗跨國流動、品種權與研發、規格化與自動化、契作與訂單、冷鏈及電商，並增加節能、低碳、病原安全和多樣化消費。臺灣宜以育種、健康苗與高品質穩供競爭，不能只比較低工資或總產量。<\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<p>臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：至少五趨勢、臺灣定位與例，勿以未查證最新數字作答。<\/p>\n<ul>\n<li><strong>至少五趨勢<\/strong><\/li>\n<li><strong>臺灣定位與例，勿以未查證最新數字作答<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<li>將溫室直接等同低溫環境。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=26","md":"98年花卉學_逐題教學詳解.md","search":"花卉產業趨勢 ## 第六題｜花卉產業趨勢（10 分）\n\n### 題意與作答範圍\n\n本題重點：**花卉產業趨勢**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=26)。\n\n### 先掌握答案\n\n依歷史與持續趨勢可論專業分工、種苗跨國流動、品種權與研發、規格化與自動化、契作與訂單、冷鏈及電商，並增加節能、低碳、病原安全和多樣化消費。臺灣宜以育種、健康苗與高品質穩供競爭，不能只比較低工資或總產量。\n\n### 原理拆解：為什麼會這樣？\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n**設施先改變能量與物質交換**\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n**各因子必須一起管理**\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n**控制成效要用植株與環境資料驗證**\n\n以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。\n\n### 可直接練寫的完整答案\n\n依歷史與持續趨勢可論專業分工、種苗跨國流動、品種權與研發、規格化與自動化、契作與訂單、冷鏈及電商，並增加節能、低碳、病原安全和多樣化消費。臺灣宜以育種、健康苗與高品質穩供競爭，不能只比較低工資或總產量。\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n### 實例：把原理用在情境中\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：至少五趨勢、臺灣定位與例，勿以未查證最新數字作答。\n\n- **至少五趨勢**\n- **臺灣定位與例，勿以未查證最新數字作答**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把轉入基因成功直接等同育成可商業化品種。\n- 將溫室直接等同低溫環境。\n 98 花卉學"},{"id":"花卉學-98-七","s":"花卉學","y":98,"n":"七","t":"產業鏈角色","body":"<h2>第七題｜產業鏈角色（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>產業鏈角色<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=26\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>生產者供健康、適熟、規格花並做紀錄；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>切離後的水分與碳收支轉為赤字<\/strong><\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p><strong>不同處理各有明確功能<\/strong><\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<p><strong>採收成熟度與溫度決定後續品質上限<\/strong><\/p>\n<p>過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>生產者供健康、適熟、規格花並做紀錄；<\/p>\n<p>批發商負責集貨、分級、保鮮冷鏈與資訊；<\/p>\n<p>零售商清潔修剪、適當保持液與庫存輪替；<\/p>\n<p>消費者重新剪口、潔淨花器、去水下葉、補換水並避熱和乙烯。每環節均須避免損傷與延誤，品質不可在末端憑空恢復。<\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：四角色的具體責任、資訊與連續冷鏈。<\/p>\n<ul>\n<li><strong>四角色的具體責任<\/strong><\/li>\n<li><strong>資訊與連續冷鏈<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短時高濃度預措液與全程瓶插液視為相同用法。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=26","md":"98年花卉學_逐題教學詳解.md","search":"產業鏈角色 ## 第七題｜產業鏈角色（10 分）\n\n### 題意與作答範圍\n\n本題重點：**產業鏈角色**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=26)。\n\n### 先掌握答案\n\n生產者供健康、適熟、規格花並做紀錄；\n\n### 原理拆解：為什麼會這樣？\n\n**切離後的水分與碳收支轉為赤字**\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n**不同處理各有明確功能**\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n**採收成熟度與溫度決定後續品質上限**\n\n過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。\n\n### 可直接練寫的完整答案\n\n生產者供健康、適熟、規格花並做紀錄；\n\n批發商負責集貨、分級、保鮮冷鏈與資訊；\n\n零售商清潔修剪、適當保持液與庫存輪替；\n\n消費者重新剪口、潔淨花器、去水下葉、補換水並避熱和乙烯。每環節均須避免損傷與延誤，品質不可在末端憑空恢復。\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n### 實例：把原理用在情境中\n\n百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：四角色的具體責任、資訊與連續冷鏈。\n\n- **四角色的具體責任**\n- **資訊與連續冷鏈**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短時高濃度預措液與全程瓶插液視為相同用法。\n 98 花卉學"},{"id":"花卉學-98-八","s":"花卉學","y":98,"n":"八","t":"十名詞","body":"<h2>第八題｜十名詞（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>十名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=26\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Long-short day plants 長短日植物，先長日後短日成花；<\/p>\n<p>scape 花葶，由基部抽出、通常無正常葉的花梗；<\/p>\n<p>ligulate flowers 舌狀小花；<\/p>\n<p>spike 穗狀花序；<\/p>\n<p>indefinite inflorescence 無限花序；<\/p>\n<p>corm 球莖；<\/p>\n<p>monopodial orchid 單莖性蘭；<\/p>\n<p>epicotyl dormancy 上胚軸休眠，根先長而上胚軸需再解除休眠；<\/p>\n<p>rosette 蓮座／簇生短節間；<\/p>\n<p>tuber 塊莖，有節芽的膨大莖。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>感應的是日夜節律，常以夜長最關鍵<\/strong><\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<p><strong>感光與光合作用不是同一需求<\/strong><\/p>\n<p>暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。<\/p>\n<p><strong>產期調節須兼顧可感應階段<\/strong><\/p>\n<p>植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。<\/p>\n<p><strong>用限制來源分類<\/strong><\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p><strong>冬天的冷與春天的暖做不同工作<\/strong><\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<p><strong>技術必須對應真正瓶頸<\/strong><\/p>\n<p>摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>corm 球莖；<\/td>\n<td>主要是實心肥大莖，與以肉質鱗片葉儲藏的鱗莖不同，例如唐菖蒲、荸薺。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Long-short day plants 長短日植物，先長日後短日成花；<\/p>\n<p>scape 花葶，由基部抽出、通常無正常葉的花梗；<\/p>\n<p>ligulate flowers 舌狀小花；<\/p>\n<p>spike 穗狀花序；<\/p>\n<p>indefinite inflorescence 無限花序；<\/p>\n<p>corm 球莖；<\/p>\n<p>monopodial orchid 單莖性蘭；<\/p>\n<p>epicotyl dormancy 上胚軸休眠，根先長而上胚軸需再解除休眠；<\/p>\n<p>rosette 蓮座／簇生短節間；<\/p>\n<p>tuber 塊莖，有節芽的膨大莖。<\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。<\/p>\n<p>平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：每項 2 分，定義與例，先後光期不可顛倒。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短日反應簡化為光越少花越多。<\/li>\n<li>把需冷不足與萌芽後霜害混為同一問題。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=26","md":"98年花卉學_逐題教學詳解.md","search":"十名詞 ## 第八題｜十名詞（20 分）\n\n### 題意與作答範圍\n\n本題重點：**十名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=26)。\n\n### 先掌握答案\n\nlong-short day plants 長短日植物，先長日後短日成花；\n\nscape 花葶，由基部抽出、通常無正常葉的花梗；\n\nligulate flowers 舌狀小花；\n\nspike 穗狀花序；\n\nindefinite inflorescence 無限花序；\n\ncorm 球莖；\n\nmonopodial orchid 單莖性蘭；\n\nepicotyl dormancy 上胚軸休眠，根先長而上胚軸需再解除休眠；\n\nrosette 蓮座／簇生短節間；\n\ntuber 塊莖，有節芽的膨大莖。\n\n### 原理拆解：為什麼會這樣？\n\n**感應的是日夜節律，常以夜長最關鍵**\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n**感光與光合作用不是同一需求**\n\n暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。\n\n**產期調節須兼顧可感應階段**\n\n植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。\n\n**用限制來源分類**\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n**冬天的冷與春天的暖做不同工作**\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n**技術必須對應真正瓶頸**\n\n摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| corm 球莖； | 主要是實心肥大莖，與以肉質鱗片葉儲藏的鱗莖不同，例如唐菖蒲、荸薺。 |\n\n### 可直接練寫的完整答案\n\nlong-short day plants 長短日植物，先長日後短日成花；\n\nscape 花葶，由基部抽出、通常無正常葉的花梗；\n\nligulate flowers 舌狀小花；\n\nspike 穗狀花序；\n\nindefinite inflorescence 無限花序；\n\ncorm 球莖；\n\nmonopodial orchid 單莖性蘭；\n\nepicotyl dormancy 上胚軸休眠，根先長而上胚軸需再解除休眠；\n\nrosette 蓮座／簇生短節間；\n\ntuber 塊莖，有節芽的膨大莖。\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n### 實例：把原理用在情境中\n\n菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。\n\n平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：每項 2 分，定義與例，先後光期不可顛倒。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短日反應簡化為光越少花越多。\n- 把需冷不足與萌芽後霜害混為同一問題。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 98 花卉學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
