ls{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 6 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"蔬菜學-98-一","s":"蔬菜學","y":98,"n":"一","t":"活力與三試驗","body":"<h2>第一題｜活力與三試驗（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>活力與三試驗<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=27\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>種子活力是種批在不同尤其不利環境下快速、整齊形成正常苗的綜合能力，不等於只有適溫發芽率。TTC 由活組織脫氫酶還原成紅色 formazan，檢生活力與損傷分布；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>發芽率、活力與壽命要分開<\/strong><\/p>\n<p>發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。<\/p>\n<p><strong>劣化涉及膜與修復能力<\/strong><\/p>\n<p>貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。<\/p>\n<p><strong>保存與檢測依種子特性選擇<\/strong><\/p>\n<p>耐乾燥的正貯型種子通常可適度乾燥、低溫與防潮保存；不耐乾燥的種子不能照抄同法。發芽試驗、加速老化、導電度或低溫試驗各反映不同面向，須選適合作物的條件與標準。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>種子活力是種批在不同尤其不利環境下快速、整齊形成正常苗的綜合能力，不等於只有適溫發芽率。TTC 由活組織脫氫酶還原成紅色 formazan，檢生活力與損傷分布；<\/p>\n<p>電導度量浸出電解質反映膜完整；<\/p>\n<p>加速老化以高溫高濕後發芽比較耐劣化性。種批含水、大小與種類會影響判讀，須標準化。<\/p>\n<p>發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。<\/p>\n<p>貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>蔥種子貯藏後即使標準發芽率尚可，活力降低也可能使育苗出苗不整；先做活力或小規模出苗比較，比直接增加播種密度更能掌握苗數。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：定義、三原理及與生活力差別。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有未發芽種子都判為死亡，漏掉休眠。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=27","md":"98年蔬菜學_逐題教學詳解.md","search":"活力與三試驗 ## 第一題｜活力與三試驗（20 分）\n\n### 題意與作答範圍\n\n本題重點：**活力與三試驗**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=27)。\n\n### 先掌握答案\n\n種子活力是種批在不同尤其不利環境下快速、整齊形成正常苗的綜合能力，不等於只有適溫發芽率。ttc 由活組織脫氫酶還原成紅色 formazan，檢生活力與損傷分布；\n\n### 原理拆解：為什麼會這樣？\n\n**發芽率、活力與壽命要分開**\n\n發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。\n\n**劣化涉及膜與修復能力**\n\n貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。\n\n**保存與檢測依種子特性選擇**\n\n耐乾燥的正貯型種子通常可適度乾燥、低溫與防潮保存；不耐乾燥的種子不能照抄同法。發芽試驗、加速老化、導電度或低溫試驗各反映不同面向，須選適合作物的條件與標準。\n\n### 可直接練寫的完整答案\n\n種子活力是種批在不同尤其不利環境下快速、整齊形成正常苗的綜合能力，不等於只有適溫發芽率。ttc 由活組織脫氫酶還原成紅色 formazan，檢生活力與損傷分布；\n\n電導度量浸出電解質反映膜完整；\n\n加速老化以高溫高濕後發芽比較耐劣化性。種批含水、大小與種類會影響判讀，須標準化。\n\n發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。\n\n貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。\n\n### 實例：把原理用在情境中\n\n蔥種子貯藏後即使標準發芽率尚可，活力降低也可能使育苗出苗不整；先做活力或小規模出苗比較，比直接增加播種密度更能掌握苗數。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：定義、三原理及與生活力差別。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有未發芽種子都判為死亡，漏掉休眠。\n 98 蔬菜學"},{"id":"蔬菜學-98-二","s":"蔬菜學","y":98,"n":"二","t":"五育種目標方法","body":"<h2>第二題｜五育種目標方法（25 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五育種目標方法<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=27\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>菜豆抗鏽病：抗源與優良品種雜交、回交及接種／標誌選拔；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>F1 一致性來自親本與受控交配<\/strong><\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<p><strong>制種須阻止不需要的授粉<\/strong><\/p>\n<p>去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。<\/p>\n<p><strong>F2 分離是留種限制的主因<\/strong><\/p>\n<p>F1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。<\/p>\n<p><strong>標誌提供基因型線索<\/strong><\/p>\n<p>分子標誌是可檢測的 DNA 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 MAS 與基因轉殖的操作與法規概念不同。<\/p>\n<p><strong>連鎖不等於永遠不分離<\/strong><\/p>\n<p>若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。<\/p>\n<p><strong>回交可兼顧前景與背景選拔<\/strong><\/p>\n<p>前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。MAS 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>菜豆抗鏽病：抗源與優良品種雜交、回交及接種／標誌選拔；<\/p>\n<p>無子西瓜：誘導四倍體母本與二倍體父本交得三倍體，栽培仍配二倍體授粉株；<\/p>\n<p>青花菜 F1：建親本並利用自交不親和或雄不稔製種；<\/p>\n<p>番茄耐熱：多親本或回交與高溫花粉著果表型、多地選拔；<\/p>\n<p>短日洋蔥：選短日球化材料及適地播期，多代選拔達當地臨界日長與品質。<\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<p>去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>西瓜 F1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 F1 果實留種所得下一代，不能保證維持原果形與整齊性。<\/p>\n<p>抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>25 分：五項各 5 分，方法、世代／生理與驗證。<\/p>\n<ul>\n<li><strong>五項各 5 分，方法<\/strong><\/li>\n<li><strong>世代／生理與驗證<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>寫成 F1 種子完全不能發芽。<\/li>\n<li>把分子標誌說成施用後使植物產生抗性的藥劑。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=27","md":"98年蔬菜學_逐題教學詳解.md","search":"五育種目標方法 ## 第二題｜五育種目標方法（25 分）\n\n### 題意與作答範圍\n\n本題重點：**五育種目標方法**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=27)。\n\n### 先掌握答案\n\n菜豆抗鏽病：抗源與優良品種雜交、回交及接種／標誌選拔；\n\n### 原理拆解：為什麼會這樣？\n\n**f1 一致性來自親本與受控交配**\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n**制種須阻止不需要的授粉**\n\n去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。\n\n**f2 分離是留種限制的主因**\n\nf1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。\n\n**標誌提供基因型線索**\n\n分子標誌是可檢測的 dna 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 mas 與基因轉殖的操作與法規概念不同。\n\n**連鎖不等於永遠不分離**\n\n若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。\n\n**回交可兼顧前景與背景選拔**\n\n前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。mas 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。\n\n### 可直接練寫的完整答案\n\n菜豆抗鏽病：抗源與優良品種雜交、回交及接種／標誌選拔；\n\n無子西瓜：誘導四倍體母本與二倍體父本交得三倍體，栽培仍配二倍體授粉株；\n\n青花菜 f1：建親本並利用自交不親和或雄不稔製種；\n\n番茄耐熱：多親本或回交與高溫花粉著果表型、多地選拔；\n\n短日洋蔥：選短日球化材料及適地播期，多代選拔達當地臨界日長與品質。\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。\n\n### 實例：把原理用在情境中\n\n西瓜 f1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 f1 果實留種所得下一代，不能保證維持原果形與整齊性。\n\n抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。\n\n### 配分重點：哪些內容不能漏？\n\n25 分：五項各 5 分，方法、世代／生理與驗證。\n\n- **五項各 5 分，方法**\n- **世代／生理與驗證**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 寫成 f1 種子完全不能發芽。\n- 把分子標誌說成施用後使植物產生抗性的藥劑。\n 98 蔬菜學"},{"id":"蔬菜學-98-三","s":"蔬菜學","y":98,"n":"三","t":"溫度日照對三作物","body":"<h2>第三題｜溫度日照對三作物（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>溫度日照對三作物<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=27\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>大蒜常需一定低溫預備，之後長日及較暖促鱗莖，品種需量不同；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>感應的是日夜節律，常以夜長最關鍵<\/strong><\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<p><strong>感光與光合作用不是同一需求<\/strong><\/p>\n<p>暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。<\/p>\n<p><strong>產期調節須兼顧可感應階段<\/strong><\/p>\n<p>植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。<\/p>\n<p><strong>低溫建立的是成花能力<\/strong><\/p>\n<p>春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。<\/p>\n<p><strong>反應取決品種與發育年齡<\/strong><\/p>\n<p>種子或幼苗可感受低溫的類型，與須先達一定大小的綠體春化型不同。低溫的有效程度受溫度、持續時間、植株大小及後續條件影響；未達感應能力時，長時間低溫也不一定得到同樣效果。<\/p>\n<p><strong>感應完成仍須完成花芽發育<\/strong><\/p>\n<p>春化後的日長、溫度與營養決定抽薹和花器發育。部分植物在特定條件下有去春化反應，不能把處理完成看成保證當日開花。生產上須將育苗、低溫與後續栽培排成完整時程。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>大蒜常需一定低溫預備，之後長日及較暖促鱗莖，品種需量不同；<\/p>\n<p>馬鈴薯一般冷涼夜、較短日有利結薯，高溫尤其高夜溫抑制，現代品種日長敏感有差；<\/p>\n<p>季節性草莓多短日加冷涼促成花，高溫長日促走蔓，但四季／日中性品種另有溫度反應，不能全等同短日。<\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<p>暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。<\/p>\n<p>部分甘藍類須先長到足夠大小再受低溫，才能順利抽薹開花供採種；食用生產則要避免幼苗過早達感應大小後遇冷，以減少未熟抽薹。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：每作物的低溫、日長、生長器官與品種條件。<\/p>\n<ul>\n<li><strong>每作物的低溫<\/strong><\/li>\n<li><strong>生長器官與品種條件<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短日反應簡化為光越少花越多。<\/li>\n<li>把低溫解除休眠與低溫誘導成花當成同義。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=27","md":"98年蔬菜學_逐題教學詳解.md","search":"溫度日照對三作物 ## 第三題｜溫度日照對三作物（15 分）\n\n### 題意與作答範圍\n\n本題重點：**溫度日照對三作物**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=27)。\n\n### 先掌握答案\n\n大蒜常需一定低溫預備，之後長日及較暖促鱗莖，品種需量不同；\n\n### 原理拆解：為什麼會這樣？\n\n**感應的是日夜節律，常以夜長最關鍵**\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n**感光與光合作用不是同一需求**\n\n暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。\n\n**產期調節須兼顧可感應階段**\n\n植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。\n\n**低溫建立的是成花能力**\n\n春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。\n\n**反應取決品種與發育年齡**\n\n種子或幼苗可感受低溫的類型，與須先達一定大小的綠體春化型不同。低溫的有效程度受溫度、持續時間、植株大小及後續條件影響；未達感應能力時，長時間低溫也不一定得到同樣效果。\n\n**感應完成仍須完成花芽發育**\n\n春化後的日長、溫度與營養決定抽薹和花器發育。部分植物在特定條件下有去春化反應，不能把處理完成看成保證當日開花。生產上須將育苗、低溫與後續栽培排成完整時程。\n\n### 可直接練寫的完整答案\n\n大蒜常需一定低溫預備，之後長日及較暖促鱗莖，品種需量不同；\n\n馬鈴薯一般冷涼夜、較短日有利結薯，高溫尤其高夜溫抑制，現代品種日長敏感有差；\n\n季節性草莓多短日加冷涼促成花，高溫長日促走蔓，但四季／日中性品種另有溫度反應，不能全等同短日。\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。\n\n### 實例：把原理用在情境中\n\n菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。\n\n部分甘藍類須先長到足夠大小再受低溫，才能順利抽薹開花供採種；食用生產則要避免幼苗過早達感應大小後遇冷，以減少未熟抽薹。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：每作物的低溫、日長、生長器官與品種條件。\n\n- **每作物的低溫**\n- **生長器官與品種條件**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短日反應簡化為光越少花越多。\n- 把低溫解除休眠與低溫誘導成花當成同義。\n 98 蔬菜學"},{"id":"蔬菜學-98-四","s":"蔬菜學","y":98,"n":"四","t":"採後五生理因素","body":"<h2>第四題｜採後五生理因素（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>採後五生理因素<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=27\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>可由呼吸耗糖、蒸散失水、乙烯成熟衰老、生理傷害（寒害／機械傷／傷口代謝）及病原侵染五面向論。低溫抑代謝但須避寒害，高濕包裝減蒸散但避凝水，避乙烯保葉綠，輕採減傷與氧化，採前及場內衛生減病。若教材以溫度、濕度、氣體、病原與機械傷分五，也應把環境連到上述生理。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>採後仍活著，也仍在消耗<\/strong><\/p>\n<p>蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。<\/p>\n<p><strong>低溫與保濕要兼顧氣體交換<\/strong><\/p>\n<p>快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。<\/p>\n<p><strong>截切菜需把安全與外觀一起管理<\/strong><\/p>\n<p>流程包括原料驗收、去除不良部位、適當清洗、切割、清洗消毒、瀝乾、包裝與冷藏配送，細節依設備與產品調整。消毒水須管控有效濃度、接觸時間與有機物負荷，目標包含避免交叉污染，並不等於滅菌。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>可由呼吸耗糖、蒸散失水、乙烯成熟衰老、生理傷害（寒害／機械傷／傷口代謝）及病原侵染五面向論。低溫抑代謝但須避寒害，高濕包裝減蒸散但避凝水，避乙烯保葉綠，輕採減傷與氧化，採前及場內衛生減病。若教材以溫度、濕度、氣體、病原與機械傷分五，也應把環境連到上述生理。<\/p>\n<p>蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。<\/p>\n<p>快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>截切萵苣若只處理褐變而未瀝乾與維持冷鏈，仍可能滲液、腐敗或發生微生物風險；應用同批產品的外觀、失重與衛生檢測共同決定期限。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：五類各機制、品質損耗及對策。<\/p>\n<ul>\n<li><strong>五類各機制<\/strong><\/li>\n<li><strong>品質損耗及對策<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把清洗消毒寫成可以保證完全無菌。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=27","md":"98年蔬菜學_逐題教學詳解.md","search":"採後五生理因素 ## 第四題｜採後五生理因素（15 分）\n\n### 題意與作答範圍\n\n本題重點：**採後五生理因素**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=27)。\n\n### 先掌握答案\n\n可由呼吸耗糖、蒸散失水、乙烯成熟衰老、生理傷害（寒害／機械傷／傷口代謝）及病原侵染五面向論。低溫抑代謝但須避寒害，高濕包裝減蒸散但避凝水，避乙烯保葉綠，輕採減傷與氧化，採前及場內衛生減病。若教材以溫度、濕度、氣體、病原與機械傷分五，也應把環境連到上述生理。\n\n### 原理拆解：為什麼會這樣？\n\n**採後仍活著，也仍在消耗**\n\n蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。\n\n**低溫與保濕要兼顧氣體交換**\n\n快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。\n\n**截切菜需把安全與外觀一起管理**\n\n流程包括原料驗收、去除不良部位、適當清洗、切割、清洗消毒、瀝乾、包裝與冷藏配送，細節依設備與產品調整。消毒水須管控有效濃度、接觸時間與有機物負荷，目標包含避免交叉污染，並不等於滅菌。\n\n### 可直接練寫的完整答案\n\n可由呼吸耗糖、蒸散失水、乙烯成熟衰老、生理傷害（寒害／機械傷／傷口代謝）及病原侵染五面向論。低溫抑代謝但須避寒害，高濕包裝減蒸散但避凝水，避乙烯保葉綠，輕採減傷與氧化，採前及場內衛生減病。若教材以溫度、濕度、氣體、病原與機械傷分五，也應把環境連到上述生理。\n\n蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。\n\n快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。\n\n### 實例：把原理用在情境中\n\n截切萵苣若只處理褐變而未瀝乾與維持冷鏈，仍可能滲液、腐敗或發生微生物風險；應用同批產品的外觀、失重與衛生檢測共同決定期限。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：五類各機制、品質損耗及對策。\n\n- **五類各機制**\n- **品質損耗及對策**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把清洗消毒寫成可以保證完全無菌。\n 98 蔬菜學"},{"id":"蔬菜學-98-五","s":"蔬菜學","y":98,"n":"五","t":"馬鈴薯、大蒜健康種苗","body":"<h2>第五題｜馬鈴薯、大蒜健康種苗（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>馬鈴薯、大蒜健康種苗<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=27\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>先選健康優良母本，以莖頂培養及必要熱療等除病毒，再用血清／分子檢測確認。馬鈴薯無病瓶苗→網室／隔離微型薯→分級擴繁種薯；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>健康種薯與種蒜都須有再污染管理<\/strong><\/p>\n<p>莖頂培養配合必要處理與病原檢測，可建立較健康起始材料；馬鈴薯再經微型薯或原原種等分級擴繁，大蒜則養成可供田間繁殖的健康球。起始無病不代表田間永遠無病，仍須隔離媒介、去除病株、工具衛生與定期更新種源，並保留批次紀錄。<\/p>\n<p><strong>健康與整齊度要從母本或種子源開始<\/strong><\/p>\n<p>母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。<\/p>\n<p><strong>育苗目標是可定植且恢復快<\/strong><\/p>\n<p>適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。<\/p>\n<p><strong>無菌培養後仍有馴化關卡<\/strong><\/p>\n<p>瓶內高濕、低光與外加糖可使幼苗角質層、氣孔及根功能與田間不同。出瓶須逐步調整光濕條件並防感染。組培倍率、出瓶存活率與成品率應分開計算，不能只用增殖數宣稱生產效率。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>先選健康優良母本，以莖頂培養及必要熱療等除病毒，再用血清／分子檢測確認。馬鈴薯無病瓶苗→網室／隔離微型薯→分級擴繁種薯；<\/p>\n<p>大蒜無病苗→小鱗莖／種球→隔離擴繁。全程控制媒介昆蟲、工具污染、病株去除與世代批次追溯，定期複檢，不能只做一次組培。<\/p>\n<p>莖頂培養配合必要處理與病原檢測，可建立較健康起始材料；馬鈴薯再經微型薯或原原種等分級擴繁，大蒜則養成可供田間繁殖的健康球。起始無病不代表田間永遠無病，仍須隔離媒介、去除病株、工具衛生與定期更新種源，並保留批次紀錄。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>蝴蝶蘭分生苗可用組織培養大量增殖，但需檢測母株病毒並控制培養代數；出瓶後先馴化，再依葉片與根系生長分級，不宜把瓶苗數直接當成上市盆花數。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：共通除病毒、兩體系差別、檢驗與隔離擴繁。<\/p>\n<ul>\n<li><strong>共通除病毒<\/strong><\/li>\n<li><strong>兩體系差別<\/strong><\/li>\n<li><strong>檢驗與隔離擴繁<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將組織培養視為自動消除所有病原。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=27","md":"98年蔬菜學_逐題教學詳解.md","search":"馬鈴薯、大蒜健康種苗 ## 第五題｜馬鈴薯、大蒜健康種苗（15 分）\n\n### 題意與作答範圍\n\n本題重點：**馬鈴薯、大蒜健康種苗**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=27)。\n\n### 先掌握答案\n\n先選健康優良母本，以莖頂培養及必要熱療等除 >10 分：風熱冷、兩途徑、抗蒸散與保水材料、甜瓜早期試驗。<\/p>\n<p>先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。<\/p>\n<h3>常見失分<\/h3>\n<ul>\n<li>把專業名詞按一般字義翻譯，或把相關性改成因果。<\/li>\n<li>省略轉折、條件或限制，使研究結論比原文更強。<\/li>\n<li>以摘要取代全文翻譯。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=27","md":"98年蔬菜學_逐題教學詳解.md","search":"移植缺水英文翻譯 ## 第六題｜移植缺水英文翻譯（10 分）\n\n### 題意與作答範圍\n\n本題重點：**移植缺水英文翻譯**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=27)。\n\n### 先掌握答案\n\n這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。\n\n### 完整參考譯文\n\n移植後植株可能很快因風、熱、冷或其組合而遭水分逆境。這些情況可見於各產區，但強風與大幅溫度波動尤其是沿海特徵。早期水分逆境影響定植成活並可能減產，避免缺水可降低作物損失。減少移植作物水分逆境主要有兩法：降低蒸散以減少葉片失水，或維持根域足夠水分。\n\n本研究比較以蠟為基礎的抗蒸散葉噴 fol icote（原文 folicote）與移植時施於根團的聚丙烯醯胺凝膠 supersorb，對田間甜瓜移植苗早期生長的影響。\n\n### 讀懂這段研究在說什麼\n\n**移植後的核心問題是水分供需失衡**\n\n根受損或未恢復吸水時，風和高低溫可放大失水壓力。原文的管理邏輯通常分成增加供水能力與減少地上部失水，不是所有措施都只算灌溉。沿海是較易發生特定環境組合的例子，不可翻成移植休克只發生於海岸。\n\n### 專業詞彙與翻譯辨析\n\n| 英文用語 | 建議譯法 | 讀法與限制 |\n| --- | --- | --- |\n| stress | 逆境 | 不利生長條件，依文意分生物或非生物 |\n\n### 配分重點與檢查順序\n\n10 分：風熱冷、兩途徑、抗蒸散與保水材料、甜瓜早期試驗。\n\n先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。\n\n### 常見失分\n\n- 把專業名詞按一般字義翻譯，或把相關性改成因果。\n- 省略轉折、條件或限制，使研究結論比原文更強。\n- 以摘要取代全文翻譯。\n 98 蔬菜學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
