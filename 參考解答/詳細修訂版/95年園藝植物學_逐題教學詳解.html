strong>十作物英名與科<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=38\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>菊花 chrysanthemum：菊科；<\/p>\n<p>聖誕紅 poinsettia：大戟科；<\/p>\n<p>文心蘭 oncidium：蘭科；<\/p>\n<p>茄子 eggplant：茄科；<\/p>\n<p>竹筍 bamboo shoot：禾本科；<\/p>\n<p>綠豆 mung bean：豆科；<\/p>\n<p>青花菜 broccoli：十字花科；<\/p>\n<p>枇杷 loquat：薔薇科；<\/p>\n<p>柿 persimmon：柿樹科；<\/p>\n<p>木瓜 papaya：番木瓜科。英文為通名，不必把竹筍誤寫一個涵蓋所有竹的物種名。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>器官來源比外觀名稱更可靠<\/strong><\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<p><strong>不同分類軸不能混用<\/strong><\/p>\n<p>花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。<\/p>\n<p><strong>名稱與例子要一對一<\/strong><\/p>\n<p>寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>菊花 chrysanthemum：菊科；<\/p>\n<p>聖誕紅 poinsettia：大戟科；<\/p>\n<p>文心蘭 oncidium：蘭科；<\/p>\n<p>茄子 eggplant：茄科；<\/p>\n<p>竹筍 bamboo shoot：禾本科；<\/p>\n<p>綠豆 mung bean：豆科；<\/p>\n<p>青花菜 broccoli：十字花科；<\/p>\n<p>枇杷 loquat：薔薇科；<\/p>\n<p>柿 persimmon：柿樹科；<\/p>\n<p>木瓜 papaya：番木瓜科。英文為通名，不必把竹筍誤寫一個涵蓋所有竹的物種名。<\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>30 分：每題 3 分，英文及中文科名。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>看到地下器官就全部寫成根。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=38","md":"95年園藝植物學_逐題教學詳解.md","search":"十作物英名與科 ## 第一題｜十作物英名與科（30 分）\n\n### 題意與作答範圍\n\n本題重點：**十作物英名與科**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=38)。\n\n### 先掌握答案\n\n菊花 chrysanthemum：菊科；\n\n聖誕紅 poinsettia：大戟科；\n\n文心蘭 oncidium：蘭科；\n\n茄子 eggplant：茄科；\n\n竹筍 bamboo shoot：禾本科；\n\n綠豆 mung bean：豆科；\n\n青花菜 broccoli：十字花科；\n\n枇杷 loquat：薔薇科；\n\n柿 persimmon：柿樹科；\n\n木瓜 papaya：番木瓜科。英文為通名，不必把竹筍誤寫一個涵蓋所有竹的物種名。\n\n### 原理拆解：為什麼會這樣？\n\n**器官來源比外觀名稱更可靠**\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n**不同分類軸不能混用**\n\n花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。\n\n**名稱與例子要一對一**\n\n寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。\n\n### 可直接練寫的完整答案\n\n菊花 chrysanthemum：菊科；\n\n聖誕紅 poinsettia：大戟科；\n\n文心蘭 oncidium：蘭科；\n\n茄子 eggplant：茄科；\n\n竹筍 bamboo shoot：禾本科；\n\n綠豆 mung bean：豆科；\n\n青花菜 broccoli：十字花科；\n\n枇杷 loquat：薔薇科；\n\n柿 persimmon：柿樹科；\n\n木瓜 papaya：番木瓜科。英文為通名，不必把竹筍誤寫一個涵蓋所有竹的物種名。\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n### 實例：把原理用在情境中\n\n馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。\n\n### 配分重點：哪些內容不能漏？\n\n30 分：每題 3 分，英文及中文科名。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 看到地下器官就全部寫成根。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 95 園藝植物學"},{"id":"園藝植物學-95-二","s":"園藝植物學","y":95,"n":"二","t":"按子房數分類果實","body":"<h2>第二題｜按子房數分類果實（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>按子房數分類果實<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=38\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>單果：單朵一個單雌蕊或合生雌蕊的子房形成，如桃、番茄，內部再分肉果與乾果；<\/p>\n<p>聚合果：同一花多個離生子房各成小果，合為一個單位，如番荔枝、覆盆子，草莓還有膨大花托；<\/p>\n<p>多花果：整個花序多朵花子房及附屬組織形成，如鳳梨、桑椹、無花果。真果／假果依是否附屬組織參與，是另一分類軸。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>器官來源比外觀名稱更可靠<\/strong><\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<p><strong>不同分類軸不能混用<\/strong><\/p>\n<p>花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。<\/p>\n<p><strong>名稱與例子要一對一<\/strong><\/p>\n<p>寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>單果：單朵一個單雌蕊或合生雌蕊的子房形成，如桃、番茄，內部再分肉果與乾果；<\/td>\n<td>通常發育成果實的核心組織；附屬花部也可參與形成可食部。<\/td>\n<\/tr>\n<tr>\n<td>聚合果：同一花多個離生子房各成小果，合為一個單位，如番荔枝、覆盆子，草莓還有膨大花托；<\/td>\n<td>通常發育成果實的核心組織；附屬花部也可參與形成可食部。<\/td>\n<\/tr>\n<tr>\n<td>多花果：整個花序多朵花子房及附屬組織形成，如鳳梨、桑椹、無花果。 根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n### 實例：把原理用在情境中\n\n馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：三類定義、各兩例、合生心皮不等於多花、與假果區別。\n\n- **三類定義**\n- **各兩例**\n- **合生心皮不等於多花**\n- **與假果區別**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 看到地下器官就全部寫成根。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 95 園藝植物學"},{"id":"園藝植物學-95-三","s":"園藝植物學","y":95,"n":"三","t":"十名詞","body":"<h2>第三題｜十名詞（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>十名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=38\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Vernalization 春化；<\/p>\n<p>floriculture 花卉園藝；<\/p>\n<p>embryo rescue 胚救援，胚將敗育前離體培養；<\/p>\n<p>microclimate 微氣候，近植株或局部尺度的溫光濕風；<\/p>\n<p>compound fruit 複合果，需再辨聚合／多花；<\/p>\n<p>Hortus 拉丁文花園，為 horticulture 語源之一；<\/p>\n<p>parthenocarpy 單為結果；<\/p>\n<p>ISSR 簡單重複序列間區標誌，利用微衛星間片段多型；<\/p>\n<p>florigen 成花素；<\/p>\n<p>heterosis 雜種優勢。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>低溫建立的是成花能力<\/strong><\/p>\n<p>春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。<\/p>\n<p><strong>反應取決品種與發育年齡<\/strong><\/p>\n<p>種子或幼苗可感受低溫的類型，與須先達一定大小的綠體春化型不同。低溫的有效程度受溫度、持續時間、植株大小及後續條件影響；未達感應能力時，長時間低溫也不一定得到同樣效果。<\/p>\n<p><strong>感應完成仍須完成花芽發育<\/strong><\/p>\n<p>春化後的日長、溫度與營養決定抽薹和花器發育。部分植物在特定條件下有去春化反應，不能把處理完成看成保證當日開花。生產上須將育苗、低溫與後續栽培排成完整時程。<\/p>\n<p><strong>標誌提供基因型線索<\/strong><\/p>\n<p>分子標誌是可檢測的 DNA 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 MAS 與基因轉殖的操作與法規概念不同。<\/p>\n<p><strong>連鎖不等於永遠不分離<\/strong><\/p>\n<p>若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。<\/p>\n<p><strong>回交可兼顧前景與背景選拔<\/strong><\/p>\n<p>前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。MAS 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Vernalization 春化；<\/td>\n<td>使植物獲得或增強成花能力，與打破芽休眠和單純冷藏保鮮不同。<\/td>\n<\/tr>\n<tr>\n<td>parthenocarpy 單為結果；<\/td>\n<td>是未經受精仍形成果實，須與受精後種子敗育、以及三倍體不稔等機制分開。<\/td>\n<\/tr>\n<tr>\n<td>heterosis 雜種優勢。<\/td>\n<td>須指明相較雙親平均或較優親本的哪個性狀，不代表所有 F1 的所有性狀都較好。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Vernalization 春化；<\/p>\n<p>floriculture 花卉園藝；<\/p>\n<p>embryo rescue 胚救援，胚將敗育前離體培養；<\/p>\n<p>microclimate 微氣候，近植株或局部尺度的溫光濕風；<\/p>\n<p>compound fruit 複合果，需再辨聚合／多花；<\/p>\n<p>Hortus 拉丁文花園，為 horticulture 語源之一；<\/p>\n<p>parthenocarpy 單為結果；<\/p>\n<p>ISSR 簡單重複序列間區標誌，利用微衛星間片段多型；<\/p>\n<p>florigen 成花素；<\/p>\n<p>heterosis 雜種優勢。<\/p>\n<p>春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>部分甘藍類須先長到足夠大小再受低溫，才能順利抽薹開花供採種；食用生產則要避免幼苗過早達感應大小後遇冷，以減少未熟抽薹。<\/p>\n<p>抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：十項各 2 分，縮寫與中文正確，Hortus 不當成特定植物。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把低溫解除休眠與低溫誘導成花當成同義。<\/li>\n<li>把分子標誌說成施用後使植物產生抗性的藥劑。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=38","md":"95年園藝植物學_逐題教學詳解.md","search":"十名詞 ## 第三題｜十名詞（20 分）\n\n### 題意與作答範圍\n\n本題重點：**十名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=38)。\n\n### 先掌握答案\n\nvernalization 春化；\n\nfloriculture 花卉園藝；\n\nembryo rescue 胚救援，胚將敗育前離體培養；\n\nmicroclimate 微氣候，近植株或局部尺度的溫光濕風；\n\ncompound fruit 複合果，需再辨聚合／多花；\n\nhortus 拉丁文花園，為 horticulture 語源之一；\n\nparthenocarpy 單為結果；\n\nissr 簡單重複序列間區標誌，利用微衛星間片段多型；\n\nflorigen 成花素；\n\nheterosis 雜種優勢。\n\n### 原理拆解：為什麼會這樣？\n\n**低溫建立的是成花能力**\n\n春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。\n\n**反應取決品種與發育年齡**\n\n種子或幼苗可感受低溫的類型，與須先達一定大小的綠體春化型不同。低溫的有效程度受溫度、持續時間、植株大小及後續條件影響；未達感應能力時，長時間低溫也不一定得到同樣效果。\n\n**感應完成仍須完成花芽發育**\n\n春化後的日長、溫度與營養決定抽薹和花器發育。部分植物在特定條件下有去春化反應，不能把處理完成看成保證當日開花。生產上須將育苗、低溫與後續栽培排成完整時程。\n\n**標誌提供基因型線索**\n\n分子標誌是可檢測的 dna 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 mas 與基因轉殖的操作與法規概念不同。\n\n**連鎖不等於永遠不分離**\n\n若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。\n\n**回交可兼顧前景與背景選拔**\n\n前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。mas 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| vernalization 春化； | 使植物獲得或增強成花能力，與打破芽休眠和單純冷藏保鮮不同。 |\n| parthenocarpy 單為結果； | 是未經受精仍形成果實，須與受精後種子敗育、以及三倍體不稔等機制分開。 |\n| heterosis 雜種優勢。 | 須指明相較雙親平均或較優親本的哪個性狀，不代表所有 f1 的所有性狀都較好。 |\n\n### 可直接練寫的完整答案\n\nvernalization 春化；\n\nfloriculture 花卉園藝；\n\nembryo rescue 胚救援，胚將敗育前離體培養；\n\nmicroclimate 微氣候，近植株或局部尺度的溫光濕風；\n\ncompound fruit 複合果，需再辨聚合／多花；\n\nhortus 拉丁文花園，為 horticulture 語源之一；\n\nparthenocarpy 單為結果；\n\nissr 簡單重複序列間區標誌，利用微衛星間片段多型；\n\nflorigen 成花素；\n\nheterosis 雜種優勢。\n\n春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。\n\n### 實例：把原理用在情境中\n\n部分甘藍類須先長到足夠大小再受低溫，才能順利抽薹開花供採種；食用生產則要避免幼苗過早達感應大小後遇冷，以減少未熟抽薹。\n\n抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：十項各 2 分，縮寫與中文正確，hortus 不當成特定植物。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把低溫解除休眠與低溫誘導成花當成同義。\n- 把分子標誌說成施用後使植物產生抗性的藥劑。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 95 園藝植物學"},{"id":"園藝植物學-95-四","s":"園藝植物學","y":95,"n":"四","t":"永續與有機園藝","body":"<h2>第四題｜永續與有機園藝（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>永續與有機園藝<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=38\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>永續園藝是長期兼顧經濟可行、環境資源與社會公平的目標，可運用精準施肥、節水、保土、IPM、節能與循環資材，必要時合理用合成資材。有機園藝是依特定生產及驗證規範的方式，重生態、禁限特定資材、輪作與有機肥源；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先建立可預防的栽培條件<\/strong><\/p>\n<p>健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。<\/p>\n<p><strong>監測後再選處理<\/strong><\/p>\n<p>定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。<\/p>\n<p><strong>整合與追蹤效果<\/strong><\/p>\n<p>不同手段應互相相容，保護天敵並避免抗藥性累積。處理後確認受害是否降低，保存用藥、環境與採收紀錄；有機生產也須依規範使用資材，並不代表可以省略病蟲管理。<\/p>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>永續園藝是長期兼顧經濟可行、環境資源與社會公平的目標，可運用精準施肥、節水、保土、IPM、節能與循環資材，必要時合理用合成資材。有機園藝是依特定生產及驗證規範的方式，重生態、禁限特定資材、輪作與有機肥源；<\/p>\n<p>可促永續但兩者不完全等同，仍須評估產量、能源、土地及勞力。果園草生滴灌可為永續例，有機蔬菜輪作生物防治為有機例。<\/p>\n<p>健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。<\/p>\n<p>定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>番茄管理可由健康苗、防蟲設施與田間監測降低媒介昆蟲傳播病毒的機會；已感染植株的處置與媒介控制須配合，不能只噴一次藥便認定病毒消失。<\/p>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：目標對制度、共同與差異、各措施與成本取捨。<\/p>\n<ul>\n<li><strong>目標對制度<\/strong><\/li>\n<li><strong>共同與差異<\/strong><\/li>\n<li><strong>各措施與成本取捨<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把有機栽培理解成完全不防治。<\/li>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=38","md":"95年園藝植物學_逐題教學詳解.md","search":"永續與有機園藝 ## 第四題｜永續與有機園藝（20 分）\n\n### 題意與作答範圍\n\n本題重點：**永續與有機園藝**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=38)。\n\n### 先掌握答案\n\n永續園藝是長期兼顧經濟可行、環境資源與社會公平的目標，可運用精準施肥、節水、保土、ipm、節能與循環資材，必要時合理用合成資材。有機園藝是依特定生產及驗證規範的方式，重生態、禁限特定資材、輪作與有機肥源；\n\n### 原理拆解：為什麼會這樣？\n\n**先建立可預防的栽培條件**\n\n健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。\n\n**監測後再選處理**\n\n定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。\n\n**整合與追蹤效果**\n\n不同手段應互相相容，保護天敵並避免抗藥性累積。處理後確認受害是否降低，保存用藥、環境與採收紀錄；有機生產也須依規範使用資材，並不代表可以省略病蟲管理。\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n### 可直接練寫的完整答案\n\n永續園藝是長期兼顧經濟可行、環境資源與社會公平的目標，可運用精準施肥、節水、保土、ipm、節能與循環資材，必要時合理用合成資材。有機園藝是依特定生產及驗證規範的方式，重生態、禁限特定資材、輪作與有機肥源；\n\n可促永續但兩者不完全等同，仍須評估產量、能源、土地及勞力。果園草生滴灌可為永續例，有機蔬菜輪作生物防治為有機例。\n\n健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。\n\n定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。\n\n### 實例：把原理用在情境中\n\n番茄管理可由健康苗、防蟲設施與田間監測降低媒介昆蟲傳播病毒的機會；已感染植株的處置與媒介控制須配合，不能只噴一次藥便認定病毒消失。\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：目標對制度、共同與差異、各措施與成本取捨。\n\n- **目標對制度**\n- **共同與差異**\n- **各措施與成本取捨**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把有機栽培理解成完全不防治。\n- 將連作障礙全部歸因於缺肥。\n 95 園藝植物學"},{"id":"園藝植物學-95-五","s":"園藝植物學","y":95,"n":"五","t":"SCI 與三園藝期刊","body":"<h2>第五題｜SCI 與三園藝期刊（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>SCI 與三園藝期刊<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=38\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>SCI 為 Science Citation Index，文獻引文索引系統；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>索引與期刊需分開寫<\/strong><\/p>\n<p>SCI 是文獻引文索引，而 HortScience 等才是刊登論文的期刊。題目可要求列出園藝期刊，但若另問當前收錄與分區，須依指定年度資料庫查核，不能用多年不變的假設代答。期刊被收錄也不表示每篇研究都免於設計或推論上的限制。<\/p>\n<p><strong>辨識學術資訊類型<\/strong><\/p>\n<p>論文、期刊、引文索引及資料庫不是同一層次。論文呈現一項研究，期刊提供出版與審查，索引則整理可檢索的文獻與引用資訊。<\/p>\n<p><strong>評估內容仍須看證據<\/strong><\/p>\n<p>研究可靠性須看問題、方法、樣本、統計與推論是否一致；期刊指標僅能提供部分背景。不能因收錄索引就斷言每篇論文無誤，也不能以單篇研究概括所有作物。<\/p>\n<p><strong>年份與來源須可追查<\/strong><\/p>\n<p>期刊名稱、收錄狀態及評估指標可能隨年度改變。若題目只要求全名與例子，應精確回答所問；若問現況，則需依指定資料庫與年度查證。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>SCI 為 Science Citation Index，文獻引文索引系統；<\/p>\n<p>今日常見擴充版 SCIE，是否收錄需依年份與資料庫查核。園藝相關期刊可舉 HortScience、Journal of the American Society for Horticultural Science、Scientia Horticulturae，寫完整刊名並區分期刊本身與引文索引。SCI 不是單一期刊，收錄也不保證每篇結論無誤。<\/p>\n<p>SCI 是文獻引文索引，而 HortScience 等才是刊登論文的期刊。題目可要求列出園藝期刊，但若另問當前收錄與分區，須依指定年度資料庫查核，不能用多年不變的假設代答。期刊被收錄也不表示每篇研究都免於設計或推論上的限制。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>SCI 是索引名稱，HortScience 是期刊名稱；答題把兩者角色說清楚，再列三個完整刊名，比只背縮寫更完整。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：全名與用途、三完整刊名，收錄狀態依題目年代。<\/p>\n<ul>\n<li><strong>全名與用途<\/strong><\/li>\n<li><strong>三完整刊名，收錄狀態依題目年代<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把 SCI 當作期刊。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=38","md":"95年園藝植物學_逐題教學詳解.md","search":"sci 與三園藝期刊 ## 第五題｜sci 與三園藝期刊（10 分）\n\n### 題意與作答範圍\n\n本題重點：**sci 與三園藝期刊**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=38)。\n\n### 先掌握答案\n\nsci 為 science citation index，文獻引文索引系統；\n\n### 原理拆解：為什麼會這樣？\n\n**索引與期刊需分開寫**\n\nsci 是文獻引文索引，而 hortscience 等才是刊登論文的期刊。題目可要求列出園藝期刊，但若另問當前收錄與分區，須依指定年度資料庫查核，不能用多年不變的假設代答。期刊被收錄也不表示每篇研究都免於設計或推論上的限制。\n\n**辨識學術資訊類型**\n\n論文、期刊、引文索引及資料庫不是同一層次。論文呈現一項研究，期刊提供出版與審查，索引則整理可檢索的文獻與引用資訊。\n\n**評估內容仍須看證據**\n\n研究可靠性須看問題、方法、樣本、統計與推論是否一致；期刊指標僅能提供部分背景。不能因收錄索引就斷言每篇論文無誤，也不能以單篇研究概括所有作物。\n\n**年份與來源須可追查**\n\n期刊名稱、收錄狀態及評估指標可能隨年度改變。若題目只要求全名與例子，應精確回答所問；若問現況，則需依指定資料庫與年度查證。\n\n### 可直接練寫的完整答案\n\nsci 為 science citation index，文獻引文索引系統；\n\n今日常見擴充版 scie，是否收錄需依年份與資料庫查核。園藝相關期刊可舉 hortscience、journal of the american society for horticultural science、scientia horticulturae，寫完整刊名並區分期刊本身與引文索引。sci 不是單一期刊，收錄也不保證每篇結論無誤。\n\nsci 是文獻引文索引，而 hortscience 等才是刊登論文的期刊。題目可要求列出園藝期刊，但若另問當前收錄與分區，須依指定年度資料庫查核，不能用多年不變的假設代答。期刊被收錄也不表示每篇研究都免於設計或推論上的限制。\n\n### 實例：把原理用在情境中\n\nsci 是索引名稱，hortscience 是期刊名稱；答題把兩者角色說清楚，再列三個完整刊名，比只背縮寫更完整。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：全名與用途、三完整刊名，收錄狀態依題目年代。\n\n- **全名與用途**\n- **三完整刊名，收錄狀態依題目年代**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把 sci 當作期刊。\n 95 園藝植物學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(n encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
