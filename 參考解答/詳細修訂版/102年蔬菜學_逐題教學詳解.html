ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 6 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"蔬菜學-102-一","s":"蔬菜學","y":102,"n":"一","t":"十字花科不親和親本自交維持","body":"<h2>第一題｜十字花科不親和親本自交維持（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>十字花科不親和親本自交維持<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=15\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>可在不親和反應尚弱的花蕾期進行蕾授粉，讓自花花粉在開花前被接受；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>親本維持與商品製種的目的相反<\/strong><\/p>\n<p>維持自交不親和親本時，需要暫時克服自花辨識才能自交繁殖；正式 F1 製種時，則要保留不親和系統以減少母本自交，讓相容父本花粉受精。蕾授粉利用不親和反應尚未完全表現的階段，並不是永久消除 S 基因。親本仍需隔離與純度檢查。<\/p>\n<p><strong>F1 一致性來自親本與受控交配<\/strong><\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<p><strong>制種須阻止不需要的授粉<\/strong><\/p>\n<p>去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。<\/p>\n<p><strong>F2 分離是留種限制的主因<\/strong><\/p>\n<p>F1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>可在不親和反應尚弱的花蕾期進行蕾授粉，讓自花花粉在開花前被接受；<\/p>\n<p>或採授課所述 CO₂、高鹽等暫時克服不親和方法，先以材料驗證。自交後分代選拔、維持 S 基因型與農藝純度；<\/p>\n<p>正式 F1 製種用不同且相容的親本，隔離並查外來花粉。<\/p>\n<p>維持自交不親和親本時，需要暫時克服自花辨識才能自交繁殖；正式 F1 製種時，則要保留不親和系統以減少母本自交，讓相容父本花粉受精。蕾授粉利用不親和反應尚未完全表現的階段，並不是永久消除 S 基因。親本仍需隔離與純度檢查。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>西瓜 F1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 F1 果實留種所得下一代，不能保證維持原果形與整齊性。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：孢子體型自交不親和、蕾授粉時點、親本純度與 F1 連結。<\/p>\n<ul>\n<li><strong>孢子體型自交不親和<\/strong><\/li>\n<li><strong>蕾授粉時點<\/strong><\/li>\n<li><strong>親本純度與 F1 連結<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>寫成 F1 種子完全不能發芽。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=15","md":"102年蔬菜學_逐題教學詳解.md","search":"十字花科不親和親本自交維持 ## 第一題｜十字花科不親和親本自交維持（15 分）\n\n### 題意與作答範圍\n\n本題重點：**十字花科不親和親本自交維持**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=15)。\n\n### 先掌握答案\n\n可在不親和反應尚弱的花蕾期進行蕾授粉，讓自花花粉在開花前被接受；\n\n### 原理拆解：為什麼會這樣？\n\n**親本維持與商品製種的目的相反**\n\n維持自交不親和親本時，需要暫時克服自花辨識才能自交繁殖；正式 f1 製種時，則要保留不親和系統以減少母本自交，讓相容父本花粉受精。蕾授粉利用不親和反應尚未完全表現的階段，並不是永久消除 s 基因。親本仍需隔離與純度檢查。\n\n**f1 一致性來自親本與受控交配**\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n**制種須阻止不需要的授粉**\n\n去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。\n\n**f2 分離是留種限制的主因**\n\nf1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。\n\n### 可直接練寫的完整答案\n\n可在不親和反應尚弱的花蕾期進行蕾授粉，讓自花花粉在開花前被接受；\n\n或採授課所述 co₂、高鹽等暫時克服不親和方法，先以材料驗證。自交後分代選拔、維持 s 基因型與農藝純度；\n\n正式 f1 製種用不同且相容的親本，隔離並查外來花粉。\n\n維持自交不親和親本時，需要暫時克服自花辨識才能自交繁殖；正式 f1 製種時，則要保留不親和系統以減少母本自交，讓相容父本花粉受精。蕾授粉利用不親和反應尚未完全表現的階段，並不是永久消除 s 基因。親本仍需隔離與純度檢查。\n\n### 實例：把原理用在情境中\n\n西瓜 f1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 f1 果實留種所得下一代，不能保證維持原果形與整齊性。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：孢子體型自交不親和、蕾授粉時點、親本純度與 f1 連結。\n\n- **孢子體型自交不親和**\n- **蕾授粉時點**\n- **親本純度與 f1 連結**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 寫成 f1 種子完全不能發芽。\n 102 蔬菜學"},{"id":"蔬菜學-102-二","s":"蔬菜學","y":102,"n":"二","t":"植物工廠關鍵","body":"<h2>第二題｜植物工廠關鍵（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>植物工廠關鍵<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=15\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>光源與光譜／PPFD、日積光量及光週期，溫濕與 VPD、CO₂、風速，水耕養液 pH／EC／溶氧及水溫，健康種苗與衛生、生育感測、供電與環控備援、層架物流及採後包裝均重要。用生長快、緊湊、低光效率及高商品率品種，評估每 kg 能源與成本，不只追求每平方米產量。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>設施先改變能量與物質交換<\/strong><\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p><strong>各因子必須一起管理<\/strong><\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<p><strong>控制成效要用植株與環境資料驗證<\/strong><\/p>\n<p>以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。<\/p>\n<p><strong>根需要水，也需要氧<\/strong><\/p>\n<p>介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。<\/p>\n<p><strong>化學性質會改變肥培結果<\/strong><\/p>\n<p>pH 影響元素溶解與有效性，EC 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 EC 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；pH 與 EC 是不同指標，不能相互替代。<\/p>\n<p><strong>配方應可重複而且衛生<\/strong><\/p>\n<p>選擇穩定、無病原與雜草種子、粒徑一致的材料，混合後實測保水、通氣、pH 及 EC。泥炭、椰纖、樹皮等有機材料會分解或吸附養分；珍珠石等材料的作用也受比例與粒徑影響，配方必須搭配灌肥管理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>光源與光譜／PPFD、日積光量及光週期，溫濕與 VPD、CO₂、風速，水耕養液 pH／EC／溶氧及水溫，健康種苗與衛生、生育感測、供電與環控備援、層架物流及採後包裝均重要。用生長快、緊湊、低光效率及高商品率品種，評估每 kg 能源與成本，不只追求每平方米產量。<\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。<\/p>\n<p>同一泥炭與珍珠石配方用於矮盆時，底部飽和區占比可能較高；若又照高盆的頻率灌水，根部缺氧風險便增加。應從盆器與水分實測修正，而非只換肥料。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：光、氣候、根域、衛生自動化、品種與經濟。<\/p>\n<ul>\n<li><strong>衛生自動化<\/strong><\/li>\n<li><strong>品種與經濟<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將溫室直接等同低溫環境。<\/li>\n<li>把無土介質寫成完全不含有機物。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=15","md":"102年蔬菜學_逐題教學詳解.md","search":"植物工廠關鍵 ## 第二題｜植物工廠關鍵（15 分）\n\n### 題意與作答範圍\n\n本題重點：**植物工廠關鍵**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=15)。\n\n### 先掌握答案\n\n光源與光譜／ppfd、日積光量及光週期，溫濕與 vpd、co₂、風速，水耕養液 ph／ec／溶氧及水溫，健康種苗與衛生、生育感測、供電與環控備援、層架物流及採後包裝均重要。用生長快、緊湊、低光效率及高商品率品種，評估每 kg 能源與成本，不只追求每平方米產量。\n\n### 原理拆解：為什麼會這樣？\n\n**設施先改變能量與物質交換**\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n**各因子必須一起管理**\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n**控制成效要用植株與環境資料驗證**\n\n以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。\n\n**根需要水，也需要氧**\n\n介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。\n\n**化學性質會改變肥培結果**\n\nph 影響元素溶解與有效性，ec 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 ec 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；ph 與 ec 是不同指標，不能相互替代。\n\n**配方應可重複而且衛生**\n\n選擇穩定、無病原與雜草種子、粒徑一致的材料，混合後實測保水、通氣、ph 及 ec。泥炭、椰纖、樹皮等有機材料會分解或吸附養分；珍珠石等材料的作用也受比例與粒徑影響，配方必須搭配灌肥管理。\n\n### 可直接練寫的完整答案\n\n光源與光譜／ppfd、日積光量及光週期，溫濕與 vpd、co₂、風速，水耕養液 ph／ec／溶氧及水溫，健康種苗與衛生、生育感測、供電與環控備援、層架物流及採後包裝均重要。用生長快、緊湊、低光效率及高商品率品種，評估每 kg 能源與成本，不只追求每平方米產量。\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n### 實例：把原理用在情境中\n\n臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。\n\n同一泥炭與珍珠石配方用於矮盆時，底部飽和區占比可能較高；若又照高盆的頻率灌水，根部缺氧風險便增加。應從盆器與水分實測修正，而非只換肥料。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：光、氣候、根域、衛生自動化、品種與經濟。\n\n- **衛生自動化**\n- **品種與經濟**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將溫室直接等同低溫環境。\n- 把無土介質寫成完全不含有機物。\n 102 蔬菜學"},{"id":"蔬菜學-102-三","s":"蔬菜學","y":102,"n":"三","t":"番茄五管理目的","body":"<h2>第三題｜番茄五管理目的（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>番茄五管理目的<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=15\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>銀黑塑膠覆蓋：黑面抑草減蒸發、銀面反光與干擾部分媒介蟲，亦調土溫；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>授粉、種子與果實膨大互相連結<\/strong><\/p>\n<p>適當花粉發育、花藥開裂與授粉受精提供正常種子及激素訊號，支援胎座與果肉發育。高低溫或其他逆境可在不同階段造成落花、畸形或空洞；果實看似膨大也不保證內部組織正常。<\/p>\n<p><strong>營養生長不能無限制與果實競爭<\/strong><\/p>\n<p>整枝、摘心與適當去葉可調整株型、通風及後期無效果實，但葉是同化供源。過氮促旺梢，過度去葉則減供碳並暴露果面；需以花序位置、葉果比和目標採收期安排。<\/p>\n<p><strong>水熱與根域決定品質風險<\/strong><\/p>\n<p>均勻供水、適量鈣與良好根系有助減少局部缺鈣風險；突然大量供水可能增加裂果。高溫影響花粉與色素形成，適度通風遮陰須兼顧每日光積量，不能只靠催熟或催果處理解決所有問題。<\/p>\n<p><strong>激素作用依器官與時期改變<\/strong><\/p>\n<p>生長素、吉貝素、細胞分裂素、乙烯與 ABA 均有多重功能；相同物質在不同濃度、器官和時期可能呈不同結果。必須用「作物＋物質＋時期＋目的」完整描述，不能只列藥名。<\/p>\n<p><strong>外施處理是在改變既有訊號系統<\/strong><\/p>\n<p>生長素可用於促不定根，也可能依條件疏果或減落果；GA 可促伸長、果粒膨大或調整種子發育；乙烯可誘導鳳梨開花，亦可能加速敏感花卉衰老。作用不能跨作物無條件推論。<\/p>\n<p><strong>生產應以核准用途與小量驗證為準<\/strong><\/p>\n<p>濃度、吸收量、天氣與施用位置會影響效果及藥害。考題可以說明機制，但不應從教材例子直接推定所有地區皆核准使用；回答時仍應保留品種、適期與合法用途的條件。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>銀黑塑膠覆蓋：黑面抑草減蒸發、銀面反光與干擾部分媒介蟲，亦調土溫；<\/p>\n<p>摘心：限制無效後期生長並集中成熟；<\/p>\n<p>去葉：去病老葉、改善通風採光但留足同化葉；<\/p>\n<p>花序調節劑：在授粉不良條件促坐果，依品種時期防畸；<\/p>\n<p>乙烯處理果實：在已成熟綠果整齊催熟，不會使未成熟果產生足量糖。<\/p>\n<p>適當花粉發育、花藥開裂與授粉受精提供正常種子及激素訊號，支援胎座與果肉發育。高低溫或其他逆境可在不同階段造成落花、畸形或空洞；果實看似膨大也不保證內部組織正常。<\/p>\n<p>整枝、摘心與適當去葉可調整株型、通風及後期無效果實，但葉是同化供源。過氮促旺梢，過度去葉則減供碳並暴露果面；需以花序位置、葉果比和目標採收期安排。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>夏 一種缺素。\n- 只背某激素「促進生長」，不寫促進哪個器官或過程。\n 102 蔬菜學"},{"id":"蔬菜學-102-四","s":"蔬菜學","y":102,"n":"四","t":"設施蔬菜問題","body":"<h2>第四題｜設施蔬菜問題（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>設施蔬菜問題<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=15\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>通風不足積熱、高濕與結露導病、冬季弱光、鹽分累積、特定蟎蟲與連作障礙、授粉不足、結構能源成本。對應通風遮蔭降溫、濕度與灌溉時段、清潔覆材補光、測土灌洗輪作、健康苗及防蟲監測、授粉管理和耐風設計。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>設施先改變能量與物質交換<\/strong><\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p><strong>各因子必須一起管理<\/strong><\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<p><strong>控制成效要用植株與環境資料驗證<\/strong><\/p>\n<p>以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。<\/p>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>通風不足積熱、高濕與結露導病、冬季弱光、鹽分累積、特定蟎蟲與連作障礙、授粉不足、結構能源成本。對應通風遮蔭降溫、濕度與灌溉時段、清潔覆材補光、測土灌洗輪作、健康苗及防蟲監測、授粉管理和耐風設計。<\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。<\/p>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：至少五問題與逐項解決，而非只列設施優點。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將溫室直接等同低溫環境。<\/li>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=15","md":"102年蔬菜學_逐題教學詳解.md","search":"設施蔬菜問題 ## 第四題｜設施蔬菜問題（15 分）\n\n### 題意與作答範圍\n\n本題 氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。<\/p>\n<p><strong>保存與檢測依種子特性選擇<\/strong><\/p>\n<p>耐乾燥的正貯型種子通常可適度乾燥、低溫與防潮保存；不耐乾燥的種子不能照抄同法。發芽試驗、加速老化、導電度或低溫試驗各反映不同面向，須選適合作物的條件與標準。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>受種子成熟健康、基因型、機械傷、初始活力、含水、溫度、氧氣與病蟲影響。採充分成熟種子，清潔分級、適度乾燥後防潮密封低溫，避免頻繁溫差結露，定期發芽及活力檢測。不同種如蔥、甘藍耐存不同，包裝開封時應先回溫避免吸濕。<\/p>\n<p>發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。<\/p>\n<p>貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>蔥種子貯藏後即使標準發芽率尚可，活力降低也可能使育苗出苗不整；先做活力或小規模出苗比較，比直接增加播種密度更能掌握苗數。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：採前品質、保存條件、操作及檢測。<\/p>\n<ul>\n<li><strong>採前品質<\/strong><\/li>\n<li><strong>保存條件<\/strong><\/li>\n<li><strong>操作及檢測<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有未發芽種子都判為死亡，漏掉休眠。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=15","md":"102年蔬菜學_逐題教學詳解.md","search":"種子壽命與保存 ## 第五題｜種子壽命與保存（15 分）\n\n### 題意與作答範圍\n\n本題重點：**種子壽命與保存**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=15)。\n\n### 先掌握答案\n\n受種子成熟健康、基因型、機械傷、初始活力、含水、溫度、氧氣與病蟲影響。採充分成熟種子，清潔分級、適度乾燥後防潮密封低溫，避免頻繁溫差結露，定期發芽及活力檢測。不同種如蔥、甘藍耐存不同，包裝開封時應先回溫避免吸濕。\n\n### 原理拆解：為什麼會這樣？\n\n**發芽率、活力與壽命要分開**\n\n發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。\n\n**劣化涉及膜與修復能力**\n\n貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。\n\n**保存與檢測依種子特性選擇**\n\n耐乾燥的正貯型種子通常可適度乾燥、低溫與防潮保存；不耐乾燥的種子不能照抄同法。發芽試驗、加速老化、導電度或低溫試驗各反映不同面向，須選適合作物的條件與標準。\n\n### 可直接練寫的完整答案\n\n受種子成熟健康、基因型、機械傷、初始活力、含水、溫度、氧氣與病蟲影響。採充分成熟種子，清潔分級、適度乾燥後防潮密封低溫，避免頻繁溫差結露，定期發芽及活力檢測。不同種如蔥、甘藍耐存不同，包裝開封時應先回溫避免吸濕。\n\n發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。\n\n貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。\n\n### 實例：把原理用在情境中\n\n蔥種子貯藏後即使標準發芽率尚可，活力降低也可能使育苗出苗不整；先做活力或小規模出苗比較，比直接增加播種密度更能掌握苗數。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：採前品質、保存條件、操作及檢測。\n\n- **採前品質**\n- **保存條件**\n- **操作及檢測**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有未發芽種子都判為死亡，漏掉休眠。\n 102 蔬菜學"},{"id":"蔬菜學-102-六","s":"蔬菜學","y":102,"n":"六","t":"臭氧與番茄英文翻譯","body":"<h2>第六題｜臭氧與番茄英文翻譯（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>臭氧與番茄英文翻譯<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=15\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。<\/p>\n<h3>完整參考譯文<\/h3>\n<p>在園藝作物中，番茄就生產量而言是僅次於馬鈴薯的第二重要蔬菜。文獻顯示番茄對臭氧很敏感，臭氧逆境會改變多種生理作用。葉片可能因臭氧直接氧化分解受傷，或臭氧轉成活性氧並與質膜反應造成細胞損傷，導致 Rubisco 活性及電子傳遞速率降低；<\/p>\n<p>氣孔導度也改變，使光合作用下降。臭氧還會改變源庫平衡，初期降低分配至地下部的碳。根的碳水來自光合產物，因此臭氧等造成碳受限的逆境，會迅速且顯著影響根生長發育；<\/p>\n<p>根系改變可視為葉傷與功能改變的結果。<\/p>\n<h3>讀懂這段研究在說什麼<\/h3>\n<p><strong>臭氧由污染物到細胞傷害的路徑<\/strong><\/p>\n<p>臭氧可直接氧化，也可形成活性氧，進而傷害膜與相關代謝。Rubisco、光合與其他生理反應是後續效應，翻譯應保留過程層次。原文關於番茄產量地位屬該文背景，不能任意替換成今日排名；氧化傷害也不是一般缺氧。<\/p>\n<h3>專業詞彙與翻譯辨析<\/h3>\n<table>\n<thead>\n<tr>\n<th>英文用語<\/th>\n<th>建議譯法<\/th>\n<th>讀法與限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>stress<\/td>\n<td>逆境<\/td>\n<td>不利生長條件，依文意分生物或非生物<\/td>\n<\/tr>\n<tr>\n<td>reactive oxygen species, ROS<\/td>\n<td>活性氧<\/td>\n<td>可造成氧化傷害的一群分子<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>配分重點與檢查順序<\/h3>\n<p>20 分：排名按原文、ROS／膜、Rubisco 與氣孔、源庫及根碳限制。<\/p>\n<p>先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。<\/p>\n<h3>常見失分<\/h3>\n<ul>\n<li>把專業名詞按一般字義翻譯，或把相關性改成因果。<\/li>\n<li>省略轉折、條件或限制，使研究結論比原文更強。<\/li>\n<li>以摘要取代全文翻譯。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=15","md":"102年蔬菜學_逐題教學詳解.md","search":"臭氧與番茄英文翻譯 ## 第六題｜臭氧與番茄英文翻譯（20 分）\n\n### 題意與作答範圍\n\n本題重點：**臭氧與番茄英文翻譯**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=15)。\n\n### 先掌握答案\n\n這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。\n\n### 完整參考譯文\n\n在園藝作物中，番茄就生產量而言是僅次於馬鈴薯的第二重要蔬菜。文獻顯示番茄對臭氧很敏感，臭氧逆境會改變多種生理作用。葉片可能因臭氧直接氧化分解受傷，或臭氧轉成活性氧並與質膜反應造成細胞損傷，導致 rubisco 活性及電子傳遞速率降低；\n\n氣孔導度也改變，使光合作用下降。臭氧還會改變源庫平衡，初期降低分配至地下部的碳。根的碳水來自光合產物，因此臭氧等造成碳受限的逆境，會迅速且顯著影響根生長發育；\n\n根系改變可視為葉傷與功能改變的結果。\n\n### 讀懂這段研究在說什麼\n\n**臭氧由污染物到細胞傷害的路徑**\n\n臭氧可直接氧化，也可形成活性氧，進而傷害膜與相關代謝。rubisco、光合與其他生理反應是後續效應，翻譯應保留過程層次。原文關於番茄產量地位屬該文背景，不能任意替換成今日排名；氧化傷害也不是一般缺氧。\n\n### 專業詞彙與翻譯辨析\n\n| 英文用語 | 建議譯法 | 讀法與限制 |\n| --- | --- | --- |\n| stress | 逆境 | 不利生長條件，依文意分生物或非生物 |\n| reactive oxygen species, ros | 活性氧 | 可造成氧化傷害的一群分子 |\n\n### 配分重點與檢查順序\n\n20 分：排名按原文、ros／膜、rubisco 與氣孔、源庫及根碳限制。\n\n先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。\n\n### 常見失分\n\n- 把專業名詞按一般字義翻譯，或把相關性改成因果。\n- 省略轉折、條件或限制，使研究結論比原文更強。\n- 以摘要取代全文翻譯。\n 102 蔬菜學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":
