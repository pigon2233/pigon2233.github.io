ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 6 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"蔬菜學-101-一","s":"蔬菜學","y":101,"n":"一","t":"青蔥品種、繁殖與環境","body":"<h2>第一題｜青蔥品種、繁殖與環境（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>青蔥品種、繁殖與環境<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=18\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>臺灣青蔥可按長蔥白、少分蘗的大蔥類，與分蘗強、可多年分株的四季蔥／北蔥類比較，品種名稱依地區不同。前者常播種育苗定植、培土增白，後者可播種或分株；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>健康與整齊度要從母本或種子源開始<\/strong><\/p>\n<p>母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。<\/p>\n<p><strong>育苗目標是可定植且恢復快<\/strong><\/p>\n<p>適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。<\/p>\n<p><strong>無菌培養後仍有馴化關卡<\/strong><\/p>\n<p>瓶內高濕、低光與外加糖可使幼苗角質層、氣孔及根功能與田間不同。出瓶須逐步調整光濕條件並防感染。組培倍率、出瓶存活率與成品率應分開計算，不能只用增殖數宣稱生產效率。<\/p>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>臺灣青蔥可按長蔥白、少分蘗的大蔥類，與分蘗強、可多年分株的四季蔥／北蔥類比較，品種名稱依地區不同。前者常播種育苗定植、培土增白，後者可播種或分株；<\/p>\n<p>均需肥沃排水根域、均勻供水，冷涼期品質較佳，暖濕易病害。選種須依蔥白長度、葉型與採收市場，不能把所有 A. fistulosum 稱同一品種。<\/p>\n<p>母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。<\/p>\n<p>適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>蝴蝶蘭分生苗可用組織培養大量增殖，但需檢測母株病毒並控制培養代數；出瓶後先馴化，再依葉片與根系生長分級，不宜把瓶苗數直接當成上市盆花數。<\/p>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：主要類型形態、繁殖、適溫水土及用途。<\/p>\n<ul>\n<li><strong>主要類型形態<\/strong><\/li>\n<li><strong>適溫水土及用途<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將組織培養視為自動消除所有病原。<\/li>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=18","md":"101年蔬菜學_逐題教學詳解.md","search":"青蔥品種、繁殖與環境 ## 第一題｜青蔥品種、繁殖與環境（15 分）\n\n### 題意與作答範圍\n\n本題重點：**青蔥品種、繁殖與環境**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=18)。\n\n### 先掌握答案\n\n臺灣青蔥可按長蔥白、少分蘗的大蔥類，與分蘗強、可多年分株的四季蔥／北蔥類比較，品種名稱依地區不同。前者常播種育苗定植、培土增白，後者可播種或分株；\n\n### 原理拆解：為什麼會這樣？\n\n**健康與整齊度要從母本或種子源開始**\n\n母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。\n\n**育苗目標是可定植且恢復快**\n\n適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。\n\n**無菌培養後仍有馴化關卡**\n\n瓶內高濕、低光與外加糖可使幼苗角質層、氣孔及根功能與田間不同。出瓶須逐步調整光濕條件並防感染。組培倍率、出瓶存活率與成品率應分開計算，不能只用增殖數宣稱生產效率。\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n### 可直接練寫的完整答案\n\n臺灣青蔥可按長蔥白、少分蘗的大蔥類，與分蘗強、可多年分株的四季蔥／北蔥類比較，品種名稱依地區不同。前者常播種育苗定植、培土增白，後者可播種或分株；\n\n均需肥沃排水根域、均勻供水，冷涼期品質較佳，暖濕易病害。選種須依蔥白長度、葉型與採收市場，不能把所有 a. fistulosum 稱同一品種。\n\n母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。\n\n適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。\n\n### 實例：把原理用在情境中\n\n蝴蝶蘭分生苗可用組織培養大量增殖，但需檢測母株病毒並控制培養代數；出瓶後先馴化，再依葉片與根系生長分級，不宜把瓶苗數直接當成上市盆花數。\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：主要類型形態、繁殖、適溫水土及用途。\n\n- **主要類型形態**\n- **適溫水土及用途**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將組織培養視為自動消除所有病原。\n- 將連作障礙全部歸因於缺肥。\n 101 蔬菜學"},{"id":"蔬菜學-101-二","s":"蔬菜學","y":101,"n":"二","t":"甜瓜、西瓜、苦瓜","body":"<h2>第二題｜甜瓜、西瓜、苦瓜（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>甜瓜、西瓜、苦瓜<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=18\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>甜瓜 Cucumis melo：有單性或雄花與兩性花同株等型，依品種在子孫蔓選節位留果；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>結果節位先由作物與品種決定<\/strong><\/p>\n<p>不同瓜類雌花或兩性花出現於主蔓、子蔓、孫蔓的習性不同，整枝應據此保留有效結果枝。不能把甜瓜、胡瓜、苦瓜與西瓜全部套用相同摘心節位。<\/p>\n<p><strong>整枝是調整葉果關係與通風<\/strong><\/p>\n<p>去除不需要的側枝可降低競爭、方便授粉採收並改善通風；同時保留果實所需的供源葉。疏果決定庫數目，摘心決定後續生長，兩者須一起考慮目標果重與品質。<\/p>\n<p><strong>操作規格隨栽培系統調整<\/strong><\/p>\n<p>露地與立體栽培、單蔓與多蔓、早熟與連續採收的需求不同。應先交代系統，再寫保留枝蔓、結果節位與留果量；過早重摘葉可能減少供碳並增加日燒。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>甜瓜 Cucumis melo：有單性或雄花與兩性花同株等型，依品種在子孫蔓選節位留果；<\/p>\n<p>西瓜 Citrullus lanatus：多雌雄同株異花，主子蔓均可著雌花，常留主蔓及強子蔓；<\/p>\n<p>苦瓜 Momordica charantia：雌雄同株異花，多搭棚並整理側蔓。三者多需昆蟲或人工授粉，不能因同株就當自花自然可充分受精。<\/p>\n<p>不同瓜類雌花或兩性花出現於主蔓、子蔓、孫蔓的習性不同，整枝應據此保留有效結果枝。不能把甜瓜、胡瓜、苦瓜與西瓜全部套用相同摘心節位。<\/p>\n<p>去除不需要的側枝可降低競爭、方便授粉採收並改善通風；同時保留果實所需的供源葉。疏果決定庫數目，摘心決定後續生長，兩者須一起考慮目標果重與品質。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>網室直立甜瓜可依品種在合適子蔓上留果，控制留果數並保留上方健康葉；露地西瓜多蔓留果的操作不能直接照搬同一節位表。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：三學名、花性與整枝各成組。<\/p>\n<ul>\n<li><strong>三學名<\/strong><\/li>\n<li><strong>花性與整枝各成組<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>只寫摘心，未說要促生或保留哪一級枝蔓。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=18","md":"101年蔬菜學_逐題教學詳解.md","search":"甜瓜、西瓜、苦瓜 ## 第二題｜甜瓜、西瓜、苦瓜（15 分）\n\n### 題意與作答範圍\n\n本題重點：**甜瓜、西瓜、苦瓜**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=18)。\n\n### 先掌握答案\n\n甜瓜 cucumis melo：有單性或雄花與兩性花同株等型，依品種在子孫蔓選節位留果；\n\n### 原理拆解：為什麼會這樣？\n\n**結果節位先由作物與品種決定**\n\n不同瓜類雌花或兩性花出現於主蔓、子蔓、孫蔓的習性不同，整枝應據此保留有效結果枝。不能把甜瓜、胡瓜、苦瓜與西瓜全部套用相同摘心節位。\n\n**整枝是調整葉果關係與通風**\n\n去除不需要的側枝可降低競爭、方便授粉採收並改善通風；同時保留果實所需的供源葉。疏果決定庫數目，摘心決定後續生長，兩者須一起考慮目標果重與品質。\n\n**操作規格隨栽培系統調整**\n\n露地與立體栽培、單蔓與多蔓、早熟與連續採收的需求不同。應先交代系統，再寫保留枝蔓、結果節位與留果量；過早重摘葉可能減少供碳並增加日燒。\n\n### 可直接練寫的完整答案\n\n甜瓜 cucumis melo：有單性或雄花與兩性花同株等型，依品種在子孫蔓選節位留果；\n\n西瓜 citrullus lanatus：多雌雄同株異花，主子蔓均可著雌花，常留主蔓及強子蔓；\n\n苦瓜 momordica charantia：雌雄同株異花，多搭棚並整理側蔓。三者多需昆蟲或人工授粉，不能因同株就當自花自然可充分受精。\n\n不同瓜類雌花或兩性花出現於主蔓、子蔓、孫蔓的習性不同，整枝應據此保留有效結果枝。不能把甜瓜、胡瓜、苦瓜與西瓜全部套用相同摘心節位。\n\n去除不需要的側枝可降低競爭、方便授粉採收並改善通風；同時保留果實所需的供源葉。疏果決定庫數目，摘心決定後續生長，兩者須一起考慮目標果重與品質。\n\n### 實例：把原理用在情境中\n\n網室直立甜瓜可依品種在合適子蔓上留果，控制留果數並保留上方健康葉；露地西瓜多蔓留果的操作不能直接照搬同一節位表。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：三學名、花性與整枝各成組。\n\n- **三學名**\n- **花性與整枝各成組**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 只寫摘心，未說要促生或保留哪一級枝蔓。\n 101 蔬菜學"},{"id":"蔬菜學-101-三","s":"蔬菜學","y":101,"n":"三","t":"五栽培方式目的","body":"<h2>第三題｜五栽培方式目的（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五栽培方式目的<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=18\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>甜瓜隧道棚增溫防寒與避雨提早；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>設施先改變能量與物質交換<\/strong><\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p><strong>各因子必須一起管理<\/strong><\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<p><strong>控制成效要用植株與環境資料驗證<\/strong><\/p>\n<p>以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。<\/p>\n<p><strong>先理解水勢與膨壓<\/strong><\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p><strong>由缺水到減產的連鎖<\/strong><\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<p><strong>管理不是只問澆多少<\/strong><\/p>\n<p>應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>甜瓜隧道棚增溫防寒與避雨提早；<\/p>\n<p>番茄鹽分地／受控輕度鹽處理可藉減稀釋提高可溶固形物，但抑產與離子害風險需控；<\/p>\n<p>葉萵苣水耕利根域與衛生、整齊管理；<\/p>\n<p>茭白筍電照依光週期與溫度調整孕筍，需分品種；<\/p>\n<p>金針暗中軟化減葉綠素與纖維、提高嫩白，但減光合須靠原貯藏。<\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。<\/p>\n<p>旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：各 3 分，環境改變、器官與目的、鹽／電照條件。<\/p>\n<ul>\n<li><strong>各 3 分，環境改變<\/strong><\/li>\n<li><strong>器官與目的<\/strong><\/li>\n<li><strong>鹽／電照條件<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將溫室直接等同低溫環境。<\/li>\n<li>把有水等同根一定能吸到水。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=18","md":"101年蔬菜學_逐題教學詳解.md","search":"五栽培方式目的 ## 第三題｜五栽培方式目的（15 分）\n\n### 題意與作答範圍\n\n本題重點：**五栽培方式目的**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=18)。\n\n### 先掌握答案\n\n甜瓜隧道棚增溫防寒與避雨提早；\n\n### 原理拆解：為什麼會這樣？\n\n**設施先改變能量與物質交換**\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n**各因子必須一起管理**\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n**控制成效要用植株與環境資料驗證**\n\n以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。\n\n**先理解水勢與膨壓**\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n**由缺水到減產的連鎖**\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n**管理不是只問澆多少**\n\n應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。\n\n### 可直接練寫的完整答案\n\n甜瓜隧道棚增溫防寒與避雨提早；\n\n番茄鹽分地／受控輕度鹽處理可藉減稀釋提高可溶固形物，但抑產與離子害風險需控；\n\n葉萵苣水耕利根域與衛生、整齊管理；\n\n茭白筍電照依光週期與溫度調整孕筍，需分品種；\n\n金針暗中軟化減葉綠素與纖維、提高嫩白，但減光合須靠原貯藏。\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n### 實例：把原理用在情境中\n\n臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。\n\n旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：各 3 分，環境改變、器官與目的、鹽／電照條件。\n\n- **各 3 分，環境改變**\n- **器官與目的**\n- **鹽／電照條件**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將溫室直接等同低溫環境。\n- 把有水等同根一定能吸到水。\n 101 蔬菜學"},{"id":"蔬菜學-101-四","s":"蔬菜學","y":101,"n":"四","t":"分子改良性狀與基因工程","body":"<h2>第四題｜分子改良性狀與基因工程（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>分子改良性狀與基因工程<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=18\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>可改抗病蟲、耐逆、品質營養、延緩採後劣變、株型與雄不稔等。轉殖育種先定目標基因、載體與轉入方法，選殖再生、確認插入與表現、穩定遺傳、農藝及安全試驗；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>標誌提供基因型線索<\/strong><\/p>\n<p>分子標誌是可檢測的 DNA 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 MAS 與基因轉殖的操作與法規概念不同。<\/p>\n<p><strong>連鎖不等於永遠不分離<\/strong><\/p>\n<p>若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。<\/p>\n<p><strong>回交可兼顧前景與背景選拔<\/strong><\/p>\n<p>前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。MAS 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。<\/p>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>可改抗病蟲、耐逆、品質營養、延緩採後劣變、株型與雄不稔等。轉殖育種先定目標基因、載體與轉入方法，選殖再生、確認插入與表現、穩定遺傳、農藝及安全試驗；<\/p>\n<p>與 MAS 只選既有基因不同。瓶頸含再生、基因多效性、環境流動、法規及消費接受。<\/p>\n<p>分子標誌是可檢測的 DNA 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 MAS 與基因轉殖的操作與法規概念不同。<\/p>\n<p>若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。<\/p>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：性狀例、轉殖全流程、與標誌區別及限制。<\/p>\n<ul>\n<li><strong>性狀例<\/strong><\/li>\n<li><strong>轉殖全流程<\/strong><\/li>\n<li><strong>與標誌區別及限制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把分子標誌說成施用後使植物產生抗性的藥劑。<\/li>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=18","md":"101年蔬菜學_逐題教學詳解.md","search":"分子改良性狀與基因工程 ## 第四題｜分子改良性狀與基因工程（15 分）\n\n### 題意與作答範圍\n\n本題重點：**分子改良性狀與基因工程**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=18)。\n\n### 先掌握答案\n\n可改抗病蟲、耐逆、品質營養、延緩採後劣變、株型與雄不稔等。轉殖育種先定目標基因、載體與轉入方法，選殖再生、確認插入與表現、穩定遺傳、農藝及安全試驗；\n\n### 原理拆解：為什麼會這樣？\n\n**標誌提供基因型線索**\n\n分子標誌是可檢測的 dna 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 mas 與基因轉殖的操作與法規概念不同。\n\n**連鎖不等於永遠不分離**\n\n若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。\n\n**回交可兼顧前景與背景選拔**\n\n前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。mas 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n### 可直接練寫的完整答案\n\n可改抗病蟲、耐逆、品質營養、延緩採後劣變、株型與雄不稔等。轉殖育種先定目標基因、載體與轉入方法，選殖再生、確認插入與表現、穩定遺傳、農藝及安全試驗；\n\n與 mas 只選既有基因不同。瓶頸含再生、基因多效性、環境流動、法規及消費接受。\n\n分子標誌是可檢測的 dna 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 mas 與基因轉殖的操作與法規概念不同。\n\n若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。\n\n### 實例：把原理用在情境中\n\n抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：性狀例、轉殖全流程、與標誌區別及限制。\n\n- **性狀例**\n- **轉殖全流程**\n- **與標誌區別及限制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把分子標誌說成施用後使植物產生抗性的藥劑。\n- 把轉入基因成功直接等同育成可商業化品種。\n 101 蔬菜學"},{"id":"蔬菜學-101-五","s":"蔬菜學","y":101,"n":"五","t":"四異常","body":"<h2>第五題｜四異常（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>四異常<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=18\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>大蒜萌芽：休眠解除後適溫濕、受損或貯藏不當，需充分乾燥與適溫管理；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先理解水勢與膨壓<\/strong><\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p><strong>由缺水到減產的連鎖<\/strong><\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<p><strong>管理不是只問澆多少<\/strong><\/p>\n<p>應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。<\/p>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>大蒜萌芽：休眠解除後適溫濕、受損或貯藏不當，需充分乾燥與適溫管理；<\/p>\n<p>蘿蔔畸形：土壤硬塊、石塊、鮮肥或根尖傷，需深鬆細土與熟肥；<\/p>\n<p>番茄日燒：果實失遮蔭後強光高溫，適當保葉與遮光；<\/p>\n<p>甘藍裂球：成熟後內葉快速膨大與水肥波動，均勻供水、適熟採。<\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。<\/p>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：各 5 分，原因、器官機制及預防。<\/p>\n<ul>\n<li><strong>各 5 分，原因<\/strong><\/li>\n<li><strong>器官機制及預防<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把有水等同根一定能吸到水。<\/li>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=18","md":"101年蔬菜學_逐題教學詳解.md","search":"四異常 ## 第五題｜四異常（20 分）\n\n### 題意與作答範圍\n\n本題重點：**四異常**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=18)。\n\n### 先掌握答案\n\n大蒜萌芽：休眠解除後適溫濕、受損或貯藏不當，需充分乾燥與適溫管理；\n\n### 原理拆解：為什麼會這樣？\n\n**先理解水勢與膨壓**\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n**由缺水到減產的連鎖**\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n**管理不是只問澆多少**\n\n應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n### 可直接練寫的完整答案\n\n大蒜萌芽：休眠解除後適溫濕、受損或貯藏不當，需充分乾燥與適溫管理；\n\n蘿蔔畸形：土壤硬塊、石塊、鮮肥或根尖傷，需深鬆細土與熟肥；\n\n番茄日燒：果實失遮蔭後強光高溫，適當保葉與遮光；\n\n甘藍裂球：成熟後內葉快速膨大與水肥波動，均勻供水、適熟採。\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n### 實例：把原理用在情境中\n\n旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：各 5 分，原因、器官機制及預防。\n\n- **各 5 分，原因**\n- **器官機制及預防**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把有水等同根一定能吸到水。\n- 將連作障礙全部歸因於缺肥。\n 101 蔬菜學"},{"id":"蔬菜學-101-六","s":"蔬菜學","y":101,"n":"六","t":"分子標誌英文翻譯","body":"<h2>第六題｜分子標誌英文翻譯（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>分子標誌英文翻譯<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=18\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。<\/p>\n<h3>完整參考譯文<\/h3>\n<p>分子標誌是用來辨識特定基因並確定其染色體位置的「標籤」。不同標誌可確認基因存在或其相對位置，遺傳學家可用來建立基因排列的遺傳圖譜，並辨認具有有利基因組合的植株。DNA 標誌使研究者可不依賴性狀表現而推知基因及排列。蔬菜育種例為將根瘤線蟲抗性 Mi 導入商業番茄：該基因發現於野生近緣種，與酸性磷酸酶的特定同工酶緊密連鎖。<\/p>\n<p>發現此關聯後，育種者只需檢測酸性磷酸酶的形式，便可判斷植株是否繼承 Mi，使抗線蟲後代的育種選拔方便得多。<\/p>\n<h3>讀懂這段研究在說什麼<\/h3>\n<p><strong>標誌是判讀工具，不是改造工具<\/strong><\/p>\n<p>這段從標籤比喻連到基因位置、遺傳圖譜與選拔。DNA 標誌可在性狀尚未表現時提供資訊，但與基因的連鎖須成立；原文「不依賴表現」並非植物性狀不受環境影響，也不代表標誌直接改變基因。應保留位置、存在與選拔三層用途。<\/p>\n<h3>專業詞彙與翻譯辨析<\/h3>\n<table>\n<thead>\n<tr>\n<th>英文用語<\/th>\n<th>建議譯法<\/th>\n<th>讀法與限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>molecular markers<\/td>\n<td>分子標誌<\/td>\n<td>用於辨識基因型或連鎖區段<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>配分重點與檢查順序<\/h3>\n<p>20 分：標誌圖譜、無需表型、Mi 與同工酶連鎖；原文「看見基因」按推知理解。<\/p>\n<p>先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。<\/p>\n<h3>常見失分<\/h3>\n<ul>\n<li>把專業名詞按一般字義翻譯，或把相關性改成因果。<\/li>\n<li>省略轉折、條件或限制，使研究結論比原文更強。<\/li>\n<li>以摘要取代全文翻譯。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=18","md":"101年蔬菜學_逐題教學詳解.md","search":"分子標誌英文翻譯 ## 第六題｜分子標誌英文翻譯（20 分）\n\n### 題意與作答範圍\n\n本題重點：**分子標誌英文翻譯**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=18)。\n\n### 先掌握答案\n\n這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。\n\n### 完整參考譯文\n\n分子標誌是用來辨識特定基因並確定其染色體位置的「標籤」。不同標誌可確認基因存在或其相對位置，遺傳學家可用來建立基因排列的遺傳圖譜，並辨認具有有利基因組合的植株。dna 標誌使研究者可不依賴性狀表現而推知基因及排列。蔬菜育種例為將根瘤線蟲抗性 mi 導入商業番茄：該基因發現於野生近緣種，與酸性磷酸酶的特定同工酶緊密連鎖。\n\n發現此關聯後，育種者只需檢測酸性磷酸酶的形式，便可判斷植株是否繼承 mi，使抗線蟲後代的育種選拔方便得多。\n\n### 讀懂這段研究在說什麼\n\n**標誌是判讀工具，不是改造工具**\n\n這段從標籤比喻連到基因位置、遺傳圖譜與選拔。dna 標誌可在性狀尚未表現時提供資訊，但與基因的連鎖須成立；原文「不依賴表現」並非植物性狀不受環境影響，也不代表標誌直接改變基因。應保留位置、存在與選拔三層用途。\n\n### 專業詞彙與翻譯辨析\n\n| 英文用語 | 建議譯法 | 讀法與限制 |\n| --- | --- | --- |\n| molecular markers | 分子標誌 | 用於辨識基因型或連鎖區段 |\n\n### 配分重點與檢查順序\n\n20 分：標誌圖譜、無需表型、mi 與同工酶連鎖；原文「看見基因」按推知理解。\n\n先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。\n\n### 常見失分\n\n- 把專業名詞按一般字義翻譯，或把相關性改成因果。\n- 省略轉折、條件或限制，使研究結論比原文更強。\n- 以摘要取代全文翻譯。\n 101 蔬菜學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
