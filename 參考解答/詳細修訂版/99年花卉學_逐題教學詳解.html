ls{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 7 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"花卉學-99-一","s":"花卉學","y":99,"n":"一","t":"人工照光目的與光源","body":"<h2>第一題｜人工照光目的與光源（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>人工照光目的與光源<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=23\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>人工光可延長日長／暗期中斷調成花、補足光合光量、提供全人工光育苗或控制光質株型。傳統白熾燈可用於低強度光週期，螢光與放電燈曾用補光，現可用 LED 提供效率與光譜控制；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>感應的是日夜節律，常以夜長最關鍵<\/strong><\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<p><strong>感光與光合作用不是同一需求<\/strong><\/p>\n<p>暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。<\/p>\n<p><strong>產期調節須兼顧可感應階段<\/strong><\/p>\n<p>植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>人工光可延長日長／暗期中斷調成花、補足光合光量、提供全人工光育苗或控制光質株型。傳統白熾燈可用於低強度光週期，螢光與放電燈曾用補光，現可用 LED 提供效率與光譜控制；<\/p>\n<p>選光源要分生理需求、PPFD、日積光量、覆蓋均勻、熱與成本，低光暗期燈不能直接取代光合補光。<\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<p>暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：三目的、光源類型、效能與光量分別。<\/p>\n<ul>\n<li><strong>三目的<\/strong><\/li>\n<li><strong>光源類型<\/strong><\/li>\n<li><strong>效能與光量分別<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短日反應簡化為光越少花越多。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=23","md":"99年花卉學_逐題教學詳解.md","search":"人工照光目的與光源 ## 第一題｜人工照光目的與光源（10 分）\n\n### 題意與作答範圍\n\n本題重點：**人工照光目的與光源**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=23)。\n\n### 先掌握答案\n\n人工光可延長日長／暗期中斷調成花、補足光合光量、提供全人工光育苗或控制光質株型。傳統白熾燈可用於低強度光週期，螢光與放電燈曾用補光，現可用 led 提供效率與光譜控制；\n\n### 原理拆解：為什麼會這樣？\n\n**感應的是日夜節律，常以夜長最關鍵**\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n**感光與光合作用不是同一需求**\n\n暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。\n\n**產期調節須兼顧可感應階段**\n\n植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。\n\n### 可直接練寫的完整答案\n\n人工光可延長日長／暗期中斷調成花、補足光合光量、提供全人工光育苗或控制光質株型。傳統白熾燈可用於低強度光週期，螢光與放電燈曾用補光，現可用 led 提供效率與光譜控制；\n\n選光源要分生理需求、ppfd、日積光量、覆蓋均勻、熱與成本，低光暗期燈不能直接取代光合補光。\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。\n\n### 實例：把原理用在情境中\n\n菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：三目的、光源類型、效能與光量分別。\n\n- **三目的**\n- **光源類型**\n- **效能與光量分別**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短日反應簡化為光越少花越多。\n 99 花卉學"},{"id":"花卉學-99-二","s":"花卉學","y":99,"n":"二","t":"保品質、防蕾落、延花","body":"<h2>第二題｜保品質、防蕾落、延花（25 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>保品質、防蕾落、延花<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=23\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>採前養成足碳健康花，適熟採切及減傷；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>切離後的水分與碳收支轉為赤字<\/strong><\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p><strong>不同處理各有明確功能<\/strong><\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<p><strong>採收成熟度與溫度決定後續品質上限<\/strong><\/p>\n<p>過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>採前養成足碳健康花，適熟採切及減傷；<\/p>\n<p>採後立刻補水預冷、清潔剪口與容器、適量糖和抑菌酸化保持液，避乙烯與不適溫。花蕾脫落可能因糖不足、失水、乙烯或逆境，需分別補碳、改善水分與抗乙烯；<\/p>\n<p>降溫抑呼吸、延緩衰老，不能以過低溫造成寒害。<\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>25 分：水分、碳、乙烯、溫度病原各機制及對策。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短時高濃度預措液與全程瓶插液視為相同用法。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=23","md":"99年花卉學_逐題教學詳解.md","search":"保品質、防蕾落、延花 ## 第二題｜保品質、防蕾落、延花（25 分）\n\n### 題意與作答範圍\n\n本題重點：**保品質、防蕾落、延花**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=23)。\n\n### 先掌握答案\n\n採前養成足碳健康花，適熟採切及減傷；\n\n### 原理拆解：為什麼會這樣？\n\n**切離後的水分與碳收支轉為赤字**\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n**不同處理各有明確功能**\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n**採收成熟度與溫度決定後續品質上限**\n\n過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。\n\n### 可直接練寫的完整答案\n\n採前養成足碳健康花，適熟採切及減傷；\n\n採後立刻補水預冷、清潔剪口與容器、適量糖和抑菌酸化保持液，避乙烯與不適溫。花蕾脫落可能因糖不足、失水、乙烯或逆境，需分別補碳、改善水分與抗乙烯；\n\n降溫抑呼吸、延緩衰老，不能以過低溫造成寒害。\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n### 實例：把原理用在情境中\n\n百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。\n\n### 配分重點：哪些內容不能漏？\n\n25 分：水分、碳、乙烯、溫度病原各機制及對策。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短時高濃度預措液與全程瓶插液視為相同用法。\n 99 花卉學"},{"id":"花卉學-99-三","s":"花卉學","y":99,"n":"三","t":"球根組培流程與變異","body":"<h2>第三題｜球根組培流程與變異（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>球根組培流程與變異<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=23\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>以百合為例選無病母球、鱗片或芽體消毒，誘導不定芽／小鱗莖，增殖、膨大、生根，再出瓶馴化與養球至商業規格。變異可用形態、倍數性、DNA 標誌與開花檢查；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<p><strong>健康與整齊度要從母本或種子源開始<\/strong><\/p>\n<p>母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。<\/p>\n<p><strong>育苗目標是可定植且恢復快<\/strong><\/p>\n<p>適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。<\/p>\n<p><strong>無菌培養後仍有馴化關卡<\/strong><\/p>\n<p>瓶內高濕、低光與外加糖可使幼苗角質層、氣孔及根功能與田間不同。出瓶須逐步調整光濕條件並防感染。組培倍率、出瓶存活率與成品率應分開計算，不能只用增殖數宣稱生產效率。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>以百合為例選無病母球、鱗片或芽體消毒，誘導不定芽／小鱗莖，增殖、膨大、生根，再出瓶馴化與養球至商業規格。變異可用形態、倍數性、DNA 標誌與開花檢查；<\/p>\n<p>優先直接芽途徑、減少癒傷期及過多繼代，建立母本與批次追溯。<\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<p>蝴蝶蘭分生苗可用組織培養大量增殖，但需檢測母株病毒並控制培養代數；出瓶後先馴化，再依葉片與根系生長分級，不宜把瓶苗數直接當成上市盆花數。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：流程、健康、養球、監測及防變異。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<li>將組織培養視為自動消除所有病原。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=23","md":"99年花卉學_逐題教學詳解.md","search":"球根組培流程與變異 ## 第三題｜球根組培流程與變異（15 分）\n\n### 題意與作答範圍\n\n本題重點：**球根組培流程與變異**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=23)。\n\n### 先掌握答案\n\n以百合為例選無病母球、鱗片或芽體消毒，誘導不定芽／小鱗莖，增殖、膨大、生根，再出瓶馴化與養球至商業規格。變異可用形態、倍數性、dna 標誌與開花檢查；\n\n### 原理拆解：為什麼會這樣？\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n**健康與整齊度要從母本或種子源開始**\n\n母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。\n\n**育苗目標是可定植且恢復快**\n\n適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。\n\n**無菌培養後仍有馴化關卡**\n\n瓶內高濕、低光與外加糖可使幼苗角質層、氣孔及根功能與田間不同。出瓶須逐步調整光濕條件並防感染。組培倍率、出瓶存活率與成品率應分開計算，不能只用增殖數宣稱生產效率。\n\n### 可直接練寫的完整答案\n\n以百合為例選無病母球、鱗片或芽體消毒，誘導不定芽／小鱗莖，增殖、膨大、生根，再出瓶馴化與養球至商業規格。變異可用形態、倍數性、dna 標誌與開花檢查；\n\n優先直接芽途徑、減少癒傷期及過多繼代，建立母本與批次追溯。\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n### 實例：把原理用在情境中\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n蝴蝶蘭分生苗可用組織培養大量增殖，但需檢測母株病毒並控制培養代數；出瓶後先馴化，再依葉片與根系生長分級，不宜把瓶苗數直接當成上市盆花數。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：流程、健康、養球、監測及防變異。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無性繁殖與無病毒畫上等號。\n- 將組織培養視為自動消除所有病原。\n 99 花卉學"},{"id":"花卉學-99-四","s":"花卉學","y":99,"n":"四","t":"洋桔梗簇生原因與避免","body":"<h2>第四題｜洋桔梗簇生原因與避免（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>洋桔梗簇生原因與避免<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=23\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>苗期高溫可誘發敏感品種簇生，節間短、葉密叢、不抽薹，延開花且花梗規格下降。選耐簇生品種、低溫或適溫育苗、避免播期過熱、保持根域通風，定植不讓根團嚴重盤根與乾濕失衡；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>簇生不是單純肥料不足<\/strong><\/p>\n<p>洋桔梗敏感品系在幼苗階段遇高溫，可能節間極短並形成簇生，後續即使葉片持續增加也不順利抽薹。預防重點是適當品種、播期及苗期溫度；發生後可依品系用有效低溫處理恢復抽薹能力。GA 可能促伸長，但不能直接當成所有高溫簇生的等效解方。<\/p>\n<p><strong>微小種子使早期整齊度特別重要<\/strong><\/p>\n<p>種子小、儲藏資源有限，播種深度、光、水分及介質均一度影響出苗。表面不厚覆土並保持適當濕度，不等同讓種子長期浸水；根域仍須供氧與衛生。<\/p>\n<p><strong>高溫敏感苗期可能形成簇生<\/strong><\/p>\n<p>部分品系幼苗遇高溫後節間短、葉呈蓮座而不抽薹，稱簇生或蓮座化。這是發育反應，並非單純缺氮；品系、感受時期與溫度歷程共同決定程度，須以適合播期和育苗環控預防。<\/p>\n<p><strong>恢復抽薹與成品開花是接續階段<\/strong><\/p>\n<p>有效低溫可改善某些簇生材料，長日與適溫也影響後續抽薹開花；但不能用一組條件保證所有品種。專業育苗若先提供整齊健康苗，成品端仍需合理密度、支網、肥水與採收管理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>苗期高溫可誘發敏感品種簇生，節間短、葉密叢、不抽薹，延開花且花梗規格下降。選耐簇生品種、低溫或適溫育苗、避免播期過熱、保持根域通風，定植不讓根團嚴重盤根與乾濕失衡；<\/p>\n<p>已發生可用適期低溫恢復，依材料試驗。<\/p>\n<p>洋桔梗敏感品系在幼苗階段遇高溫，可能節間極短並形成簇生，後續即使葉片持續增加也不順利抽薹。預防重點是適當品種、播期及苗期溫度；發生後可依品系用有效低溫處理恢復抽薹能力。GA 可能促伸長，但不能直接當成所有高溫簇生的等效解方。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>冬季切花若苗期一部分受高溫簇生，定植後即可能同田有正常抽薹株與蓮座株，採收難集中；應從種苗批次溫度與品系查起，不能只全面追加肥料。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：誘發期、形態與品質、預防與恢復。<\/p>\n<ul>\n<li><strong>誘發期<\/strong><\/li>\n<li><strong>形態與品質<\/strong><\/li>\n<li><strong>預防與恢復<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把簇生化說成分枝很多且越多越好。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=23","md":"99年花卉學_逐題教學詳解.md","search":"洋桔梗簇生原因與避免 ## 第四題｜洋桔梗簇生原因與避免（10 分）\n\n### 題意與作答範圍\n\n本題重點：**洋桔梗簇生原因與避免**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=23)。\n\n### 先掌握答案\n\n苗期高溫可誘發敏感品種簇生，節間短、葉密叢、不抽薹，延開花且花梗規格下降。選耐簇生品種、低溫或適溫育苗、避免播期過熱、保持根域通風，定植不讓根團嚴重盤根與乾濕失衡；\n\n### 原理拆解：為什麼會這樣？\n\n**簇生不是單純肥料不足**\n\n洋桔梗敏感品系在幼苗階段遇高溫，可能節間極短並形成簇生，後續即使葉片持續增加也不順利抽薹。預防重點是適當品種、播期及苗期溫度；發生後可依品系用有效低溫處理恢復抽薹能力。ga 可能促伸長，但不能直接當成所有高溫簇生的等效解方。\n\n**微小種子使早期整齊度特別重要**\n\n種子小、儲藏資源有限，播種深度、光、水分及介質均一度影響出苗。表面不厚覆土並保持適當濕度，不等同讓種子長期浸水；根域仍須供氧與衛生。\n\n**高溫敏感苗期可能形成簇生**\n\n部分品系幼苗遇高溫後節間短、葉呈蓮座而不抽薹，稱簇生或蓮座化。這是發育反應，並非單純缺氮；品系、感受時期與溫度歷程共同決定程度，須以適合播期和育苗環控預防。\n\n**恢復抽薹與成品開花是接續階段**\n\n有效低溫可改善某些簇生材料，長日與適溫也影響後續抽薹開花；但不能用一組條件保證所有品種。專業育苗若先提供整齊健康苗，成品端仍需合理密度、支網、肥水與採收管理。\n\n### 可直接練寫的完整答案\n\n苗期高溫可誘發敏感品種簇生，節間短、葉密叢、不抽薹，延開花且花梗規格下降。選耐簇生品種、低溫或適溫育苗、避免播期過熱、保持根域通風，定植不讓根團嚴重盤根與乾濕失衡；\n\n已發生可用適期低溫恢復，依材料試驗。\n\n洋桔梗敏感品系在幼苗階段遇高溫，可能節間極短並形成簇生，後續即使葉片持續增加也不順利抽薹。預防重點是適當品種、播期及苗期溫度；發生後可依品系用有效低溫處理恢復抽薹能力。ga 可能促伸長，但不能直接當成所有高溫簇生的等效解方。\n\n### 實例：把原理用在情境中\n\n冬季切花若苗期一部分受高溫簇生，定植後即可能同田有正常抽薹株與蓮座株，採收難集中；應從種苗批次溫度與品系查起，不能只全面追加肥料。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：誘發期、形態與品質、預防與恢復。\n\n- **誘發期**\n- **形態與品質**\n- **預防與恢復**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把簇生化說成分枝很多且越多越好。\n 99 花卉學"},{"id":"花卉學-99-五","s":"花卉學","y":99,"n":"五","t":"水耕硝態與田間銨態","body":"<h2>第五題｜水耕硝態與田間銨態（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>水耕硝態與田間銨態<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=23\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>水耕根域容量小、緩衝有限，硝態氮較易精準供應，過量銨會酸化、毒害並拮抗 Ca、K、Mg；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>氮為何促進營養生長<\/strong><\/p>\n<p>氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。<\/p>\n<p><strong>吸收氮不等於已同化<\/strong><\/p>\n<p>根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 GS/GOGAT 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。<\/p>\n<p><strong>形式、總量與時期一起決定結果<\/strong><\/p>\n<p>銨態並非不好，但根域容量小、緩衝弱時，過量銨容易酸化、毒害及拮抗鈣鉀鎂。果實期又須避免過氮徒長、陰蔽與品質下降。因此應依土水、光量、生育需求分次施肥，而不是只選一個氮形式就認為問題解決。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>水耕根域容量小、緩衝有限，硝態氮較易精準供應，過量銨會酸化、毒害並拮抗 Ca、K、Mg；<\/p>\n<p>通常採硝態為主加少量銨調 pH。田間銨態與尿素成本及土壤吸附有利，銨也可經硝化轉硝態，且根域緩衝較大；<\/p>\n<p>但土壤缺氧、低溫、作物偏好及淋洗仍需考慮，並非田間全部只用銨。<\/p>\n<p>氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。<\/p>\n<p>根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 GS/GOGAT 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>番茄結果後期若高氨加上灌溉不穩，果端鈣供應更易失衡；改硝態為主仍須同時控制總氮、供水與根活力，才能有效降低風險。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：根域緩衝、硝化、毒害拮抗、成本與非絕對化。<\/p>\n<ul>\n<li><strong>根域緩衝<\/strong><\/li>\n<li><strong>毒害拮抗<\/strong><\/li>\n<li><strong>成本與非絕對化<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把硝酸鹽累積說成所有氮都完全不能被利用。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=23","md":"99年花卉學_逐題教學詳解.md","search":"水耕硝態與田間銨態 ## 第五題｜水耕硝態與田間銨態（15 分）\n\n### 題意與作答範圍\n\n本題重點：**水耕硝態與田間銨態**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=23)。\n\n### 先掌握答案\n\n水耕根域容量小、緩衝有限，硝態氮較易精準供應，過量銨會酸化、毒害並拮抗 ca、k、mg；\n\n### 原理拆解：為什麼會這樣？\n\n**氮為何促進營養生長**\n\n氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。\n\n**吸收氮不等於已同化**\n\n根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 gs/gogat 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。\n\n**形式、總量與時期一起決定結果**\n\n銨態並非不好，但根域容量小、緩衝弱時，過量銨容易酸化、毒害及拮抗鈣鉀鎂。果實期又須避免過氮徒長、陰蔽與品質下降。因此應依土水、光量、生育需求分次施肥，而不是只選一個氮形式就認為問題解決。\n\n### 可直接練寫的完整答案\n\n水耕根域容量小、緩衝有限，硝態氮較易精準供應，過量銨會酸化、毒害並拮抗 ca、k、mg；\n\n通常採硝態為主加少量銨調 ph。田間銨態與尿素成本及土壤吸附有利，銨也可經硝化轉硝態，且根域緩衝較大；\n\n但土壤缺氧、低溫、作物偏好及淋洗仍需考慮，並非田間全部只用銨。\n\n氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。\n\n根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 gs/gogat 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。\n\n### 實例：把原理用在情境中\n\n番茄結果後期若高氨加上灌溉不穩，果端鈣供應更易失衡；改硝態為主仍須同時控制總氮、供水與根活力，才能有效降低風險。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：根域緩衝、硝化、毒害拮抗、成本與非絕對化。\n\n- **根域緩衝**\n- **毒害拮抗**\n- **成本與非絕對化**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把硝酸鹽累積說成所有氮都完全不能被利用。\n 99 花卉學"},{"id":"花卉學-99-六","s":"花卉學","y":99,"n":"六","t":"蝴蝶蘭長芽與 PLB 增殖","body":"<h2>第六題｜蝴蝶蘭長芽與 PLB 增殖（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>蝴蝶蘭長芽與 PLB 增殖<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=23\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>長芽增殖由既有芽分枝延伸，通常遺傳穩定較好、流程較直觀，但倍率與可取芽數較有限；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>長芽增殖由既有芽分枝延伸，通常遺傳穩定較好、流程較直觀，但倍率與可取芽數較有限；<\/p>\n<p>PLB 可由外植體誘導並大量切分增殖、倍率高且利再生，但反覆誘導繼代與間接途徑增加體細胞變異風險。兩者都須控制污染、倍數性和花期性狀，不能只比較瓶中芽數。<\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：兩流程、倍率、穩定性與量產取捨。<\/p>\n<ul>\n<li><strong>兩流程<\/strong><\/li>\n<li><strong>穩定性與量產取捨<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=23","md":"99年花卉學_逐題教學詳解.md","search":"蝴蝶蘭長芽與 plb 增殖 ## 第六題｜蝴蝶蘭長芽與 plb 增殖（10 分）\n\n### 題意與作答範圍\n\n本題重點：**蝴蝶蘭長芽與 plb 增殖**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=23)。\n\n### 先掌握答案\n\n長芽增殖由既有芽分枝延伸，通常遺傳穩定較好、流程較直觀，但倍率與可取芽數較有限；\n\n### 原理拆解：為什麼會這樣？\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n### 可直接練寫的完整答案\n\n長芽增殖由既有芽分枝延伸，通常遺傳穩定較好、流程較直觀，但倍率與可取芽數較有限；\n\nplb 可由外植體誘導並大量切分增殖、倍率高且利再生，但反覆誘導繼代與間接途徑增加體細胞變異風險。兩者都須控制污染、倍數性和花期性狀，不能只比較瓶中芽數。\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n### 實例：把原理用在情境中\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：兩流程、倍率、穩定性與量產取捨。\n\n- **兩流程**\n- **穩定性與量產取捨**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無性繁殖與無病毒畫上等號。\n 99 花卉學"},{"id":"花卉學-99-七","s":"花卉學","y":99,"n":"七","t":"球根形態形成","body":"<h2>第七題｜球根形態形成（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>球根形態形成<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=23\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>鱗莖：短縮莖外有肉質鱗片葉，如百合；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>用限制來源分類<\/strong><\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p><strong>冬天的冷與春天的暖做不同工作<\/strong><\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<p><strong>技術必須對應真正瓶頸<\/strong><\/p>\n<p>摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>鱗莖：短縮莖外有肉質鱗片葉，如百合；<\/p>\n<p>球莖：莖基部實心膨大，如唐菖蒲；<\/p>\n<p>塊莖：地下莖局部膨大有節芽，如仙客來（具下胚軸等來源，須按種說明）；<\/p>\n<p>根莖：橫走地下莖具節芽，如美人蕉；<\/p>\n<p>塊根：根膨大無莖節芽，如大理花，繁殖須帶可萌芽根頸。貯藏物可供越冬及翌期抽芽。<\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：至少五型、器官來源、節芽判準與例。<\/p>\n<ul>\n<li><strong>至少五型<\/strong><\/li>\n<li><strong>器官來源<\/strong><\/li>\n<li><strong>節芽判準與例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把需冷不足與萌芽後霜害混為同一問題。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=23","md":"99年花卉學_逐題教學詳解.md","search":"球根形態形成 ## 第七題｜球根形態形成（15 分）\n\n### 題意與作答範圍\n\n本題重點：**球根形態形成**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=23)。\n\n### 先掌握答案\n\n鱗莖：短縮莖外有肉質鱗片葉，如百合；\n\n### 原理拆解：為什麼會這樣？\n\n**用限制來源分類**\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n**冬天的冷與春天的暖做不同工作**\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n**技術必須對應真正瓶頸**\n\n摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。\n\n### 可直接練寫的完整答案\n\n鱗莖：短縮莖外有肉質鱗片葉，如百合；\n\n球莖：莖基部實心膨大，如唐菖蒲；\n\n塊莖：地下莖局部膨大有節芽，如仙客來（具下胚軸等來源，須按種說明）；\n\n根莖：橫走地下莖具節芽，如美人蕉；\n\n塊根：根膨大無莖節芽，如大理花，繁殖須帶可萌芽根頸。貯藏物可供越冬及翌期抽芽。\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n### 實例：把原理用在情境中\n\n平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：至少五型、器官來源、節芽判準與例。\n\n- **至少五型**\n- **器官來源**\n- **節芽判準與例**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把需冷不足與萌芽後霜害混為同一問題。\n 99 花卉學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
