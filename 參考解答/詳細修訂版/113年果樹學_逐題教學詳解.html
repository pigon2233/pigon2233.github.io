ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 8 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"果樹學-113-一","s":"果樹學","y":113,"n":"一","t":"名詞","body":"<h2>第一題｜名詞（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A113.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>(1)Aquaporin：水通道蛋白，位於細胞膜或液泡膜，促進選擇性水分通過。<\/p>\n<p>(2)Anti-florigen：抑花訊號，常指與 FT 促花系統拮抗的蛋白／訊號，抑制莖頂轉為生殖生長。<\/p>\n<p>(3)Floral evocation：花誘發，莖頂受成花訊號後產生生化、生理變化，繼而轉入花芽形成。<\/p>\n<p>(4)June drop：六月落果，指春季坐果後因同化物競爭、種子或激素訊號等形成的生理落果，名稱源自北半球物候。<\/p>\n<p>(5)Apoplastic phloem loading：質外體韌皮部裝載，糖先由葉肉等細胞輸出至質外體，再以 H⁺／蔗糖共運輸進入伴細胞／篩管。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把源與庫接起來<\/strong><\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<p><strong>壓力流與跨膜運輸不是同一層次<\/strong><\/p>\n<p>源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；H⁺-ATPase 建立電化學梯度，可支援 H⁺／蔗糖共運輸。<\/p>\n<p><strong>庫強決定競爭，不只看果實大小<\/strong><\/p>\n<p>庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。<\/p>\n<p><strong>先理解水勢與膨壓<\/strong><\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p><strong>由缺水到減產的連鎖<\/strong><\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<p><strong>管理不是只問澆多少<\/strong><\/p>\n<p>應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>(1)Aquaporin：水通道蛋白，位於細胞膜或液泡膜，促進選擇性水分通過。<\/td>\n<td>它提供水的通道，但水仍依水勢梯度移動，並非蛋白主動搬運水分子。<\/td>\n<\/tr>\n<tr>\n<td>(2)Anti-florigen：抑花訊號，常指與 FT 促花系統拮抗的蛋白／訊號，抑制莖頂轉為生殖生長。<\/td>\n<td>應寫抑制成花訊號或莖頂生殖轉變，不等同已開花後花瓣提早凋謝。<\/td>\n<\/tr>\n<tr>\n<td>(4)June drop：六月落果，指春季坐果後因同化物競爭、種子或激素訊號等形成的生理落果，名稱源自北半球物候。<\/td>\n<td>名稱是物候慣稱，臺灣或不同緯度不必恰在國曆六月，且須與病蟲或機械落果區分。<\/td>\n<\/tr>\n<tr>\n<td>(5)Apoplastic phloem loading：質外體韌皮部裝載，糖先由葉肉等細胞輸出至質外體，再以 H⁺／蔗糖共運輸進入伴細胞／篩管。<\/td>\n<td>質外體路徑遇到選擇性膜界面時仍須跨膜運輸，不能理解為糖可一路無限制穿過所有組織。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>這題要特別注意<\/h3>\n<p>花誘發不是開花；<\/p>\n<p>水通道不消耗 ATP 主動抽水，水流方向仍取決於水勢梯度。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>(1)Aquaporin：水通道蛋白，位於細胞膜或液泡膜，促進選擇性水分通過。<\/p>\n<p>(2)Anti-florigen：抑花訊號，常指與 FT 促花系統拮抗的蛋白／訊號，抑制莖頂轉為生殖生長。<\/p>\n<p>(3)Floral evocation：花誘發，莖頂受成花訊號後產生生化、生理變化，繼而轉入花芽形成。<\/p>\n<p>(4)June drop：六月落果，指春季坐果後因同化物競爭、種子或激素訊號等形成的生理落果，名稱源自北半球物候。<\/p>\n<p>(5)Apoplastic phloem loading：質外體韌皮部裝載，糖先由葉肉等細胞輸出至質外體，再以 H⁺／蔗糖共運輸進入伴細胞／篩管。<\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。<\/p>\n<p>旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：五名詞各 3 分，位置／作用與一個區別。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把長距離糖運輸寫成主要沿木質部。<\/li>\n<li>把有水等同根一定能吸到水。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../A113.pdf#page=2","md":"113年果樹學_逐題教學詳解.md","search":"名詞 ## 第一題｜名詞（15 分）\n\n### 題意與作答範圍\n\n本題重點：**名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a113.pdf#page=2)。\n\n### 先掌握答案\n\n(1)aquaporin：水通道蛋白，位於細胞膜或液泡膜，促進選擇性水分通過。\n\n(2)anti-florigen：抑花訊號，常指與 ft 促花系統拮抗的蛋白／訊號，抑制莖頂轉為生殖生長。\n\n(3)floral evocation：花誘發，莖頂受成花訊號後產生生化、生理變化，繼而轉入花芽形成。\n\n(4)june drop：六月落果，指春季坐果後因同化物競爭、種子或激素訊號等形成的生理落果，名稱源自北半球物候。\n\n(5)apoplastic phloem loading：質外體韌皮部裝載，糖先由葉肉等細胞輸出至質外體，再以 h⁺／蔗糖共運輸進入伴細胞／篩管。\n\n### 原理拆解：為什麼會這樣？\n\n**先把源與庫接起來**\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n**壓力流與跨膜運輸不是同一層次**\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n**庫強決定競爭，不只看果實大小**\n\n庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。\n\n**先理解水勢與膨壓**\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n**由缺水到減產的連鎖**\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n**管理不是只問澆多少**\n\n應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| (1)aquaporin：水通道蛋白，位於細胞膜或液泡膜，促進選擇性水分通過。 | 它提供水的通道，但水仍依水勢梯度移動，並非蛋白主動搬運水分子。 |\n| (2)anti-florigen：抑花訊號，常指與 ft 促花系統拮抗的蛋白／訊號，抑制莖頂轉為生殖生長。 | 應寫抑制成花訊號或莖頂生殖轉變，不等同已開花後花瓣提早凋謝。 |\n| (4)june drop：六月落果，指春季坐果後因同化物競爭、種子或激素訊號等形成的生理落果，名稱源自北半球物候。 | 名稱是物候慣稱，臺灣或不同緯度不必恰在國曆六月，且須與病蟲或機械落果區分。 |\n| (5)apoplastic phloem loading：質外體韌皮部裝載，糖先由葉肉等細胞輸出至質外體，再以 h⁺／蔗糖共運輸進入伴細胞／篩管。 | 質外體路徑遇到選擇性膜界面時仍須跨膜運輸，不能理解為糖可一路無限制穿過所有組織。 |\n\n### 這題要特別注意\n\n花誘發不是開花；\n\n水通道不消耗 atp 主動抽水，水流方向仍取決於水勢梯度。\n\n### 可直接練寫的完整答案\n\n(1)aquaporin：水通道蛋白，位於細胞膜或液泡膜，促進選擇性水分通過。\n\n(2)anti-florigen：抑花訊號，常指與 ft 促花系統拮抗的蛋白／訊號，抑制莖頂轉為生殖生長。\n\n(3)floral evocation：花誘發，莖頂受成花訊號後產生生化、生理變化，繼而轉入花芽形成。\n\n(4)june drop：六月落果，指春季坐果後因同化物競爭、種子或激素訊號等形成的生理落果，名稱源自北半球物候。\n\n(5)apoplastic phloem loading：質外體韌皮部裝載，糖先由葉肉等細胞輸出至質外體，再以 h⁺／蔗糖共運輸進入伴細胞／篩管。\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n### 實例：把原理用在情境中\n\n同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。\n\n旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：五名詞各 3 分，位置／作用與一個區別。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把長距離糖運輸寫成主要沿木質部。\n- 把有水等同根一定能吸到水。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 113 果樹學"},{"id":"果樹學-113-二","s":"果樹學","y":113,"n":"二","t":"更年性與非更年性果實的乙烯反應","body":"<h2>第二題｜更年性與非更年性果實的乙烯反應（6 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>更年性與非更年性果實的乙烯反應<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A113.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>更年性果實在達生理成熟、能回應乙烯的階段，外源乙烯可提早引發自催化乙烯與呼吸高峰；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>成熟反應與乙烯感受<\/strong><\/p>\n<p>乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。<\/p>\n<p><strong>更年性與非更年性要比較反應型態<\/strong><\/p>\n<p>具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。<\/p>\n<p><strong>催熟與延後成熟都不能忽略品質<\/strong><\/p>\n<p>乙烯可整齊催熟已達生理成熟的果，卻不能讓極幼果補足田間累積不足的乾物；1-MCP 阻斷感受可延緩部分產品老化，但過強處理可能影響正常後熟。脫綠、果肉軟化和增甜亦不是必然同步。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>兩類都可能回應乙烯；<\/p>\n<p>不能寫成非更年性完全不受影響。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>更年性果實在達生理成熟、能回應乙烯的階段，外源乙烯可提早引發自催化乙烯與呼吸高峰；<\/p>\n<p>濃度達有效門檻後，增加濃度主要改變誘導時間，不能無限提高峰值。非更年性果實可在施用乙烯期間暫時提高呼吸，反應常隨濃度而增，移除後下降，通常不誘發典型自催化成熟高峰。<\/p>\n<p>乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。<\/p>\n<p>具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>香蕉在不當高溫下，果肉可軟化而果皮仍綠，顯示果肉成熟與葉綠素降解可不同步。不能僅看果皮未黃，就判斷乙烯完全沒有作用。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>6 分：濃度、峰值／時序、移除後差異，不把非更年性說成零反應。<\/p>\n<ul>\n<li><strong>峰值／時序<\/strong><\/li>\n<li><strong>移除後差異，不把非更年性說成零反應<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>說非更年性果實完全不會回應乙烯。<\/li>\n<\/ul>","source":"../../A113.pdf#page=2","md":"113年果樹學_逐題教學詳解.md","search":"更年性與非更年性果實的乙烯反應 ## 第二題｜更年性與非更年性果實的乙烯反應（6 分）\n\n### 題意與作答範圍\n\n本題重點：**更年性與非更年性果實的乙烯反應**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a113.pdf#page=2)。\n\n### 先掌握答案\n\n更年性果實在達生理成熟、能回應乙烯的階段，外源乙烯可提早引發自催化乙烯與呼吸高峰；\n\n### 原理拆解：為什麼會這樣？\n\n**成熟反應與乙烯感受**\n\n乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。\n\n**更年性與非更年性要比較反應型態**\n\n具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。\n\n**催熟與延後成熟都不能忽略品質**\n\n乙烯可整齊催熟已達生理成熟的果，卻不能讓極幼果補足田間累積不足的乾物；1-mcp 阻斷感受可延緩部分產品老化，但過強處理可能影響正常後熟。脫綠、果肉軟化和增甜亦不是必然同步。\n\n### 這題要特別注意\n\n兩類都可能回應乙烯；\n\n不能寫成非更年性完全不受影響。\n\n### 可直接練寫的完整答案\n\n更年性果實在達生理成熟、能回應乙烯的階段，外源乙烯可提早引發自催化乙烯與呼吸高峰；\n\n濃度達有效門檻後，增加濃度主要改變誘導時間，不能無限提高峰值。非更年性果實可在施用乙烯期間暫時提高呼吸，反應常隨濃度而增，移除後下降，通常不誘發典型自催化成熟高峰。\n\n乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。\n\n具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。\n\n### 實例：把原理用在情境中\n\n香蕉在不當高溫下，果肉可軟化而果皮仍綠，顯示果肉成熟與葉綠素降解可不同步。不能僅看果皮未黃，就判斷乙烯完全沒有作用。\n\n### 配分重點：哪些內容不能漏？\n\n6 分：濃度、峰值／時序、移除後差異，不把非更年性說成零反應。\n\n- **峰值／時序**\n- **移除後差異，不把非更年性說成零反應**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 說非更年性果實完全不會回應乙烯。\n 113 果樹學"},{"id":"果樹學-113-三","s":"果樹學","y":113,"n":"三","t":"有子葡萄無子化","body":"<h2>第三題｜有子葡萄無子化（9 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>有子葡萄無子化<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A113.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>依品種在開花前或盛花附近以 GA₃ 處理花穗，干擾受精／種子發育，形成無子果；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先問有沒有受精<\/strong><\/p>\n<p>單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。<\/p>\n<p><strong>為何沒有正常種子仍能結果<\/strong><\/p>\n<p>正常發育種子會提供或誘導支持子房生長的激素訊號。遺傳性單為結果或外施調節劑可在缺乏受精時提供相似支持；種子敗育型則可能在初期已建立足以使果實繼續生長的條件。<\/p>\n<p><strong>無子化與膨大必須分開思考<\/strong><\/p>\n<p>有子葡萄的無子化須依品種、花期以合適處理影響種子形成，花後可能另需促果粒膨大。時機錯誤會落果、穗軸或果粒異常；不能給一個濃度宣稱適用所有葡萄。無融合生殖是無正常有性受精而產胚，仍可有種子，並非同義詞。<\/p>\n<p><strong>花序在新梢，結果能力卻與芽的過去有關<\/strong><\/p>\n<p>葡萄新梢由結果母枝上的芽萌發，芽內花序原基常已在之前的枝梢生長期間形成。修剪改變芽的萌發機會，因此產期安排要先確認枝條與芽成熟度，不能把修剪當成憑空製造花芽。<\/p>\n<p><strong>一年二收需要兩次完整資源循環<\/strong><\/p>\n<p>冬剪後萌芽開花取得第一期果；採後保健康葉、適量補水肥，恢復貯藏並培養下一期成熟枝，再夏剪萌芽取得第二期。若第一期負載過大或葉片早落，第二期即使萌芽也可能花弱、著果差或糖低。<\/p>\n<p><strong>促成與二收各有環境限制<\/strong><\/p>\n<p>春果促成靠保溫設施與提早萌芽，使低溫季仍能發育；冬果則要防秋冬光熱不足。兩者均需疏梢、整穗及葉果比管理，日期依品種、產區與設施倒推，不宜用一個月份表套全臺。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>無子化與膨大是不同處理階段，時期錯誤可造成落果、穗軸硬化或品質下降；<\/p>\n<p>藥劑組合不是所有品種通用。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>依品種在開花前或盛花附近以 GA₃ 處理花穗，干擾受精／種子發育，形成無子果；<\/p>\n<p>部分品種配合適期鏈黴素處理提高無子率，花後再以 GA₃ 等促進果粒膨大，並調整穗形、疏粒與負載。<\/p>\n<p>單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。<\/p>\n<p>正常發育種子會提供或誘導支持子房生長的激素訊號。遺傳性單為結果或外施調節劑可在缺乏受精時提供相似支持；種子敗育型則可能在初期已建立足以使果實繼續生長的條件。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>栽培香蕉可用作單為結果例，許多無子葡萄作種子敗育例；柑橘珠心胚說明無融合生殖可產生帶胚種子，三者不能互換。<\/p>\n<p>同一園連續兩期採滿量而不保留健康葉，短期總採收似多，卻可能使翌期枝條與花芽變差；合理負載應看跨季樹勢與商品果率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>9 分：花期無子化與花後膨大、品種時機、葉果比與風險。<\/p>\n<ul>\n<li><strong>花期無子化與花後膨大<\/strong><\/li>\n<li><strong>品種時機<\/strong><\/li>\n<li><strong>葉果比與風險<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有無子葡萄都說成未曾受精。<\/li>\n<li>以為剪枝本身就使任何芽都能帶花。<\/li>\n<\/ul>","source":"../../A113.pdf#page=2","md":"113年果樹學_逐題教學詳解.md","search":"有子葡萄無子化 ## 第三題｜有子葡萄無子化（9 分）\n\n### 題意與作答範圍\n\n本題重點：**有子葡萄無子化**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a113.pdf#page=2)。\n\n### 先掌握答案\n\n依品種在開花前或盛花附近以 ga₃ 處理花穗，干擾受精／種子發育，形成無子果；\n\n### 原理拆解：為什麼會這樣？\n\n**先問有沒有受精**\n\n單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。\n\n**為何沒有正常種子仍能結果**\n\n正常發育種子會提供或誘導支持子房生長的激素訊號。遺傳性單為結果或外施調節劑可在缺乏受精時提供相似支持；種子敗育型則可能在初期已建立足以使果實繼續生長的條件。\n\n**無子化與膨大必須分開思考**\n\n有子葡萄的無子化須依品種、花期以合適處理影響種子形成，花後可能另需促果粒膨大。時機錯誤會落果、穗軸或果粒異常；不能給一個濃度宣稱適用所有葡萄。無融合生殖是無正常有性受精而產胚，仍可有種子，並非同義詞。\n\n**花序在新梢，結果能力卻與芽的過去有關**\n\n葡萄新梢由結果母枝上的芽萌發，芽內花序原基常已在之前的枝梢生長期間形成。修剪改變芽的萌發機會，因此產期安排要先確認枝條與芽成熟度，不能把修剪當成憑空製造花芽。\n\n**一年二收需要兩次完整資源循環**\n\n冬剪後萌芽開花取得第一期果；採後保健康葉、適量補水肥，恢復貯藏並培養下一期成熟枝，再夏剪萌芽取得第二期。若第一期負載過大或葉片早落，第二期即使萌芽也可能花弱、著果差或糖低。\n\n**促成與二收各有環境限制**\n\n春果促成靠保溫設施與提早萌芽，使低溫季仍能發育；冬果則要防秋冬光熱不足。兩者均需疏梢、整穗及葉果比管理，日期依品種、產區與設施倒推，不宜用一個月份表套全臺。\n\n### 這題要特別注意\n\n無子化與膨大是不同處理階段，時期錯誤可造成落果、穗軸硬化或品質下降；\n\n藥劑組合不是所有品種通用。\n\n### 可直接練寫的完整答案\n\n依品種在開花前或盛花附近以 ga₃ 處理花穗，干擾受精／種子發育，形成無子果；\n\n部分品種配合適期鏈黴素處理提高無子率，花後再以 ga₃ 等促進果粒膨大，並調整穗形、疏粒與負載。\n\n單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。\n\n正常發育種子會提供或誘導支持子房生長的激素訊號。遺傳性單為結果或外施調節劑可在缺乏受精時提供相似支持；種子敗育型則可能在初期已建立足以使果實繼續生長的條件。\n\n### 實例：把原理用在情境中\n\n栽培香蕉可用作單為結果例，許多無子葡萄作種子敗育例；柑橘珠心胚說明無融合生殖可產生帶胚種子，三者不能互換。\n\n同一園連續兩期採滿量而不保留健康葉，短期總採收似多，卻可能使翌期枝條與花芽變差；合理負載應看跨季樹勢與商品果率。\n\n### 配分重點：哪些內容不能漏？\n\n9 分：花期無子化與花後膨大、品種時機、葉果比與風險。\n\n- **花期無子化與花後膨大**\n- **品種時機**\n- **葉果比與風險**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有無子葡萄都說成未曾受精。\n- 以為剪枝本身就使任何芽都能帶花。\n 113 果樹學"},{"id":"果樹學-113-四","s":"果樹學","y":113,"n":"四","t":"矮性砧木蘋果密植增產","body":"<h2>第四題｜矮性砧木蘋果密植增產（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>矮性砧木蘋果密植增產<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A113.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>矮砧限制樹體營養生長，縮短幼年、促進早結果；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>產量要以單位土地和有效葉面積看<\/strong><\/p>\n<p>大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。<\/p>\n<p><strong>整枝、修剪和負載互相制約<\/strong><\/p>\n<p>整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。<\/p>\n<p><strong>矮化與密植的效益有條件<\/strong><\/p>\n<p>矮砧、低幹與細長冠可早形成土地有效葉面積、方便作業，且減大型骨架消耗；但過密仍會陰蔽、著色差與病害。支架、灌溉、疏果及持續更新是技術成本，不應只列早產優點。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>密植並非愈密愈好；<\/p>\n<p>冠層過度封閉會降低花芽形成、著色和果實品質。應區分單株產量與每公頃產量。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>矮砧限制樹體營養生長，縮短幼年、促進早結果；<\/p>\n<p>細長樹冠可提高單位土地早期葉面積與光截取，更多葉片維持在有效受光範圍，減少冠內陰葉。較少同化物用於大型骨幹和徒長枝，增加分配至果實的比例，提升收穫指數與單位土地產量；<\/p>\n<p>配合支架、灌溉與疏果維持樹勢。<\/p>\n<p>大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。<\/p>\n<p>整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>矮砧蘋果密植常可提高早期每公頃產量，即使單株產量較低；若後期冠層封閉卻不調枝，早期優勢會被陰蔽與品質下降抵銷。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：樹冠組成、光截取、同化物分配三面，說明每公頃與每株不同。<\/p>\n<ul>\n<li><strong>樹冠組成<\/strong><\/li>\n<li><strong>光截取<\/strong><\/li>\n<li><strong>同化物分配三面，說明每公頃與每株不同<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把修剪一律理解為越重越好。<\/li>\n<\/ul>","source":"../../A113.pdf#page=2","md":"113年果樹學_逐題教學詳解.md","search":"矮性砧木蘋果密植增產 ## 第四題｜矮性砧木蘋果密植增產（20 分）\n\n### 題意與作答範圍\n\n本題重點：**矮性砧木蘋果密植增產**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a113.pdf#page=2)。\n\n### 先掌握答案\n\n矮砧限制樹體營養生長，縮短幼年、促進早結果；\n\n### 原理拆解：為什麼會這樣？\n\n**產量要以單位土地和有效葉面積看**\n\n大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。\n\n**整枝、修剪和負載互相制約**\n\n整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。\n\n**矮化與密植的效益有條件**\n\n矮砧、低幹與細長冠可早形成土地有效葉面積、方便作業，且減大型骨架消耗；但過密仍會陰蔽、著色差與病害。支架、灌溉、疏果及持續更新是技術成本，不應只列早產優點。\n\n### 這題要特別注意\n\n密植並非愈密愈好；\n\n冠層過度封閉會降低花芽形成、著色和果實品質。應區分單株產量與每公頃產量。\n\n### 可直接練寫的完整答案\n\n矮砧限制樹體營養生長，縮短幼年、促進早結果；\n\n細長樹冠可提高單位土地早期葉面積與光截取，更多葉片維持在有效受光範圍，減少冠內陰葉。較少同化物用於大型骨幹和徒長枝，增加分配至果實的比例，提升收穫指數與單位土地產量；\n\n配合支架、灌溉與疏果維持樹勢。\n\n大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。\n\n整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。\n\n### 實例：把原理用在情境中\n\n矮砧蘋果密植常可提高早期每公頃產量，即使單株產量較低；若後期冠層封閉卻不調枝，早期優勢會被陰蔽與品質下降抵銷。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：樹冠組成、光截取、同化物分配三面，說明每公頃與每株不同。\n\n- **樹冠組成**\n- **光截取**\n- **同化物分配三面，說明每公頃與每株不同**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把修剪一律理解為越重越好。\n 113 果樹學"},{"id":"果樹學-113-五","s":"果樹學","y":113,"n":"五","t":"光反應曲線及超過飽和點的改善","body":"<h2>第五題｜光反應曲線及超過飽和點的改善（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>光反應曲線及超過飽和點的改善<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A113.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>以橫軸光量、縱軸淨光合速率：零光時為負值，其絕對值為暗呼吸；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>淨光合是固定與消耗的差額<\/strong><\/p>\n<p>在零光時仍有呼吸，淨 CO₂ 交換可為負；補償點是淨交換為零，不表示光合作用或呼吸停止。光量再增加時光合上升，至其他因素限制而接近飽和。<\/p>\n<p><strong>超過飽和不等於一定立刻受傷<\/strong><\/p>\n<p>飽和代表增加光量的邊際收益小；光抑制則是強光造成光合效率下降，兩者不同。葉溫、CO₂、氣孔、水分與光系統狀態會改變曲線，陰葉與陽葉也不能共用固定數值。<\/p>\n<p><strong>管理要讓真正的限制因子改善<\/strong><\/p>\n<p>改善冠層光分布可讓陰葉利用光，提高適宜 CO₂ 或降低熱與水分壓力可能改善效率。若已有高溫失水，單純加光常無效；遮陰也須避免過度降低每日有效同化量。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>示意：<code>淨光合：負值 → 0 → 上升 → 平臺 → 強光下降<\/code>。飽和只是當下某限制因子開始主導，不代表增加光可繼續增加同一葉片的光合量。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>以橫軸光量、縱軸淨光合速率：零光時為負值，其絕對值為暗呼吸；<\/p>\n<p>曲線穿越零點為光補償點；<\/p>\n<p>光增加後達平臺的起始區為光飽和點；<\/p>\n<p>強光導致光合速率下降時為光抑制。超過飽和點可提高適當 CO₂ 供應、使葉溫與氣孔狀態適宜、補足水分與養分；<\/p>\n<p>整枝改善光分布，使原本陰葉利用多餘光量，熱害時適度遮蔭。<\/p>\n<p>在零光時仍有呼吸，淨 CO₂ 交換可為負；補償點是淨交換為零，不表示光合作用或呼吸停止。光量再增加時光合上升，至其他因素限制而接近飽和。<\/p>\n<p>飽和代表增加光量的邊際收益小；光抑制則是強光造成光合效率下降，兩者不同。葉溫、CO₂、氣孔、水分與光系統狀態會改變曲線，陰葉與陽葉也不能共用固定數值。<\/p>\n<h3>圖解輔助<\/h3>\n<p><img alt=\"光反應曲線及超過飽和點的改善示意圖\" src=\"../圖解/01_光反應曲線.svg\" /><\/p>\n<p>示意圖用來理解結構與方向；考場仍須依原題標示軸名、箭頭或構造。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>密植果園外層葉受光已接近飽和，內層葉卻低於補償點；合理疏枝可提高內層受光，而非只是讓外層葉接受更多光。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：圖標軸及四點、超飽和後限制因子、CO₂／葉溫／冠層實例。<\/p>\n<ul>\n<li><strong>圖標軸及四點<\/strong><\/li>\n<li><strong>超飽和後限制因子<\/strong><\/li>\n<li><strong>CO₂／葉溫／冠層實例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將光補償點寫成沒有呼吸。<\/li>\n<\/ul>","source":"../../A113.pdf#page=2","md":"113年果樹學_逐題教學詳解.md","search":"光反應曲線及超過飽和點的改善 ## 第五題｜光反應曲線及超過飽和點的改善（15 分）\n\n### 題意與作答範圍\n\n本題重點：**光反應曲線及超過飽和點的改善**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a113.pdf#page=2)。\n\n### 先掌握答案\n\n以橫軸光量、縱軸淨光合速率：零光時為負值，其絕對值為暗呼吸；\n\n### 原理拆解：為什麼會這樣？\n\n**淨光合是固定與消耗的差額**\n\n在零光時仍有呼吸，淨 co₂ 交換可為負；補償點是淨交換為零，不表示光合作用或呼吸停止。光量再增加時光合上升，至其他因素限制而接近飽和。\n\n**超過飽和不等於一定立刻受傷**\n\n飽和代表增加光量的邊際收益小；光抑制則是強光造成光合效率下降，兩者不同。葉溫、co₂、氣孔、水分與光系統狀態會改變曲線，陰葉與陽葉也不能共用固定數值。\n\n**管理要讓真正的限制因子改善**\n\n改善冠層光分布可讓陰葉利用光，提高適宜 co₂ 或降低熱與水分壓力可能改善效率。若已有高溫失水，單純加光常無效；遮陰也須避免過度降低每日有效同化量。\n\n### 這題要特別注意\n\n示意：`淨光合：負值 → 0 → 上升 → 平臺 → 強光下降`。飽和只是當下某限制因子開始主導，不代表增加光可繼續增加同一葉片的光合量。\n\n### 可直接練寫的完整答案\n\n以橫軸光量、縱軸淨光合速率：零光時為負值，其絕對值為暗呼吸；\n\n曲線穿越零點為光補償點；\n\n光增加後達平臺的起始區為光飽和點；\n\n強光導致光合速率下降時為光抑制。超過飽和點可提高適當 co₂ 供應、使葉溫與氣孔狀態適宜、補足水分與養分；\n\n整枝改善光分布，使原本陰葉利用多餘光量，熱害時適度遮蔭。\n\n在零光時仍有呼吸，淨 co₂ 交換可為負；補償點是淨交換為零，不表示光合作用或呼吸停止。光量再增加時光合上升，至其他因素限制而接近飽和。\n\n飽和代表增加光量的邊際收益小；光抑制則是強光造成光合效率下降，兩者不同。葉溫、co₂、氣孔、水分與光系統狀態會改變曲線，陰葉與陽葉也不能共用固定數值。\n\n### 圖解輔助\n\n![光反應曲線及超過飽和點的改善示意圖](../圖解/01_光反應曲線.svg)\n\n示意圖用來理解結構與方向；考場仍須依原題標示軸名、箭頭或構造。\n\n### 實例：把原理用在情境中\n\n密植果園外層葉受光已接近飽和，內層葉卻低於補償點；合理疏枝可提高內層受光，而非只是讓外層葉接受更多光。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：圖標軸及四點、超飽和後限制因子、co₂／葉溫／冠層實例。\n\n- **圖標軸及四點**\n- **超飽和後限制因子**\n- **co₂／葉溫／冠層實例**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將光補償點寫成沒有呼吸。\n 113 果樹學"},{"id":"果樹學-113-六","s":"果樹學","y":113,"n":"六","t":"整枝目的與形式","body":"<h2>第六題｜整枝目的與形式（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>整枝目的與形式<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A113.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>目的為建立穩固骨架、改善通風採光、調整樹勢與結果部位、降低病害並便於採收。開心形：桃等幼樹去中央主幹、選 3–4 主枝向外開展。中央領導幹／細長紡錘形：蘋果等保留主軸、側枝分層且上小下大，利用拉枝與疏枝維持光分布。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>產量要以單位土地和有效葉面積看<\/strong><\/p>\n<p>大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。<\/p>\n<p><strong>整枝、修剪和負載互相制約<\/strong><\/p>\n<p>整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。<\/p>\n<p><strong>矮化與密植的效益有條件<\/strong><\/p>\n<p>矮砧、低幹與細長冠可早形成土地有效葉面積、方便作業，且減大型骨架消耗；但過密仍會陰蔽、著色差與病害。支架、灌溉、疏果及持續更新是技術成本，不應只列早產優點。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>整枝是樹形的建立，修剪是實現與維持樹形的手段之一。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>目的為建立穩固骨架、改善通風採光、調整樹勢與結果部位、降低病害並便於採收。開心形：桃等幼樹去中央主幹、選 3–4 主枝向外開展。中央領導幹／細長紡錘形：蘋果等保留主軸、側枝分層且上小下大，利用拉枝與疏枝維持光分布。<\/p>\n<p>大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。<\/p>\n<p>整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>矮砧蘋果密植常可提高早期每公頃產量，即使單株產量較低；若後期冠層封閉卻不調枝，早期優勢會被陰蔽與品質下降抵銷。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：整枝目的、兩樹形、實施與作物例。<\/p>\n<ul>\n<li><strong>整枝目的<\/strong><\/li>\n<li><strong>兩樹形<\/strong><\/li>\n<li><strong>實施與作物例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把修剪一律理解為越重越好。<\/li>\n<\/ul>","source":"../../A113.pdf#page=2","md":"113年果樹學_逐題教學詳解.md","search":"整枝目的與形式 ## 第六題｜整枝目的與形式（10 分）\n\n### 題意與作答範圍\n\n本題重點：**整枝目的與形式**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a113.pdf#page=2)。\n\n### 先掌握答案\n\n目的為建立穩固骨架、改善通風採光、調整樹勢與結果部位、降低病害並便於採收。開心形：桃等幼樹去中央主幹、選 3–4 主枝向外開展。中央領導幹／細長紡錘形：蘋果等保留主軸、側枝分層且上小下大，利用拉枝與疏枝維持光分布。\n\n### 原理拆解：為什麼會這樣？\n\n**產量要以單位土地和有效葉面積看**\n\n大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。\n\n**整枝、修剪和負載互相制約**\n\n整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。\n\n**矮化與密植的效益有條件**\n\n矮砧、低幹與細長冠可早形成土地有效葉面積、方便作業，且減大型骨架消耗；但過密仍會陰蔽、著色差與病害。支架、灌溉、疏果及持續更新是技術成本，不應只列早產優點。\n\n### 這題要特別注意\n\n整枝是樹形的建立，修剪是實現與維持樹形的手段之一。\n\n### 可直接練寫的完整答案\n\n目的為建立穩固骨架、改善通風採光、調整樹勢與結果部位、降低病害並便於採收。開心形：桃等幼樹去中央主幹、選 3–4 主枝向外開展。中央領導幹／細長紡錘形：蘋果等保留主軸、側枝分層且上小下大，利用拉枝與疏枝維持光分布。\n\n大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。\n\n整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。\n\n### 實例：把原理用在情境中\n\n矮砧蘋果密植常可提高早期每公頃產量，即使單株產量較低；若後期冠層封閉卻不調枝，早期優勢會被陰蔽與品質下降抵銷。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：整枝目的、兩樹形、實施與作物例。\n\n- **整枝目的**\n- **兩樹形**\n- **實施與作物例**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把修剪一律理解為越重越好。\n 113 果樹學"},{"id":"果樹學-113-七","s":"果樹學","y":113,"n":"七","t":"15-15-15-4 肥料元素計算","body":"<h2>第七題｜15-15-15-4 肥料元素計算（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>15-15-15-4 肥料元素計算<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A113.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>肥料標示前三項為 N、P₂O₅、K₂O 百分率。10 kg 中：N＝10×0.15＝<strong>1.50 kg<\/strong>；<\/p>\n<p>P＝10×0.15×(2×31)/(2×31+5×16)＝1.5×62/142＝<strong>0.655 kg<\/strong>；<\/p>\n<p>K＝10×0.15×(2×39)/(2×39+16)＝1.5×78/94＝<strong>1.245 kg<\/strong>。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先寫定義與單位再代數字<\/strong><\/p>\n<p>肥料百分率是重量基準，N 直接以元素量標示，磷與鉀通常以 P₂O₅、K₂O 表示；莫耳濃度則須分清一莫耳化合物含幾莫耳目標元素。題目單位不同，公式不可直接共用。<\/p>\n<p><strong>保留換算比例才能檢查<\/strong><\/p>\n<p>氧化物換元素用元素在該化學式的質量比例；母液稀釋先算目標莫耳數再除以母液濃度。DIF 用日溫減夜溫，均溫則按時數加權，pF 使用以公分水柱表示的壓力頭取常用對數。<\/p>\n<p><strong>答案需列假設與合理位數<\/strong><\/p>\n<p>先顯示式子，後列數值和單位。原題若原子量誤植或缺少盆徑與冠幅比例等條件，應說明正確知識及缺少的假設，不能以一個看似精確的數字掩蓋資訊不足。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>第四個數字常為 MgO，需依標籤確認，但不影響本題。不能把 1.5 kg 的 P₂O₅ 當成 1.5 kg 元素磷。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>以下依各小題順序列公式、代入與結果：<\/p>\n<p>肥料標示前三項為 N、P₂O₅、K₂O 百分率。10 kg 中：N＝10×0.15＝<strong>1.50 kg<\/strong>；<\/p>\n<p>P＝10×0.15×(2×31)/(2×31+5×16)＝1.5×62/142＝<strong>0.655 kg<\/strong>；<\/p>\n<p>K＝10×0.15×(2×39)/(2×39+16)＝1.5×78/94＝<strong>1.245 kg<\/strong>。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>15% P₂O₅ 不等於 15% 元素磷：需乘 62/142；15% K₂O 轉元素鉀需乘 78/94。只有標示 N 可直接以其百分率計算元素氮。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：N、P、K 分別列式及單位，P₂O₅、K₂O 轉元素，不計未問第四項。<\/p>\n<ul>\n<li><strong>K 分別列式及單位，P₂O₅<\/strong><\/li>\n<li><strong>K₂O 轉元素，不計未問第四項<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把 P₂O₅ 的重量直接當成元素磷。<\/li>\n<\/ul>","source":"../../A113.pdf#page=2","md":"113年果樹學_逐題教學詳解.md","search":"15-15-15-4 肥料元素計算 ## 第七題｜15-15-15-4 肥料元素計算（10 分）\n\n### 題意與作答範圍\n\n本題重點：**15-15-15-4 肥料元素計算**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a113.pdf#page=2)。\n\n### 先掌握答案\n\n肥料標示前三項為 n、p₂o₅、k₂o 百分率。10 kg 中：n＝10×0.15＝**1.50 kg**；\n\np＝10×0.15×(2×31)/(2×31+5×16)＝1.5×62/142＝**0.655 kg**；\n\nk＝10×0.15×(2×39)/(2×39+16)＝1.5×78/94＝**1.245 kg**。\n\n### 原理拆解：為什麼會這樣？\n\n**先寫定義與單位再代數字**\n\n肥料百分率是重量基準，n 直接以元素量標示，磷與鉀通常以 p₂o₅、k₂o 表示；莫耳濃度則須分清一莫耳化合物含幾莫耳目標元素。題目單位不同，公式不可直接共用。\n\n**保留換算比例才能檢查**\n\n氧化物換元素用元素在該化學式的質量比例；母液稀釋先算目標莫耳數再除以母液濃度。dif 用日溫減夜溫，均溫則按時數加權，pf 使用以公分水柱表示的壓力頭取常用對數。\n\n**答案需列假設與合理位數**\n\n先顯示式子，後列數值和單位。原題若原子量誤植或缺少盆徑與冠幅比例等條件，應說明正確知識及缺少的假設，不能以一個看似精確的數字掩蓋資訊不足。\n\n### 這題要特別注意\n\n第四個數字常為 mgo，需依標籤確認，但不影響本題。不能把 1.5 kg 的 p₂o₅ 當成 1.5 kg 元素磷。\n\n### 可直接練寫的完整答案\n\n以下依各小題順序列公式、代入與結果：\n\n肥料標示前三項為 n、p₂o₅、k₂o 百分率。10 kg 中：n＝10×0.15＝**1.50 kg**；\n\np＝10×0.15×(2×31)/(2×31+5×16)＝1.5×62/142＝**0.655 kg**；\n\nk＝10×0.15×(2×39)/(2×39+16)＝1.5×78/94＝**1.245 kg**。\n\n### 實例：把原理用在情境中\n\n15% p₂o₅ 不等於 15% 元素磷：需乘 62/142；15% k₂o 轉元素鉀需乘 78/94。只有標示 n 可直接以其百分率計算元素氮。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：n、p、k 分別列式及單位，p₂o₅、k₂o 轉元素，不計未問第四項。\n\n- **k 分別列式及單位，p₂o₅**\n- **k₂o 轉元素，不計未問第四項**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把 p₂o₅ 的重量直接當成元素磷。\n 113 果樹學"},{"id":"果樹學-113-八","s":"果樹學","y":113,"n":"八","t":"表 2 實驗設計與結果判讀","body":"<h2>第八題｜表 2 實驗設計與結果判讀（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>表 2 實驗設計與結果判讀<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A113.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>從表可辨識果園種類 O（蘋果、桃）、地表處理 T（除草劑、整合刈草）及年份 Y（2018、2019）等因子，評估覆蓋率、雜草種數與乾生物量；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先交代因子、層級與反應變數<\/strong><\/p>\n<p>閱讀變方分析表時先列處理因子及其水準，再列測量指標和單位。資料表能顯示比較內容，但未必足以重建隨機化、區集、樣本數與重複量測結構；設計資訊不足應明確說明。<\/p>\n<p><strong>先判交互作用，再解釋主效應<\/strong><\/p>\n<p>交互作用表示一因子的效果隨另一因子水準而變。若交互作用顯著，整體平均主效應不一定代表每一組合，宜比較簡單效應或相應組合；不顯著也不是證明兩者完全相等。<\/p>\n<p><strong>顯著性與效應大小都要寫<\/strong><\/p>\n<p>依事先設定的 α 判定 p 值，再用平均值、差額與單位描述方向。p 小不代表差異一定有生產價值，p 大也不代表效果為零；表中沒有的因果與實驗細節不應補造。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>「不顯著」不代表完全相同；<\/p>\n<p>表沒有產量或土壤氮數據，不能由它證明刈草增產、氮增加或除草劑殘留造成傷害。題幹說明的背景也不能取代表內證據。<a href=\"https://www.mdpi.com/2311-7524/6/4/96\">研究原文<\/a><\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>從表可辨識果園種類 O（蘋果、桃）、地表處理 T（除草劑、整合刈草）及年份 Y（2018、2019）等因子，評估覆蓋率、雜草種數與乾生物量；<\/p>\n<p>有 O×T、O×Y、T×Y、O×T×Y 交互作用。表本身無法確認區集、重複數、隨機化或是否重複量測，不應捏造。以 α＝0.05：果園主效應三項均不顯著（0.063、0.138、0.060）；<\/p>\n<p>整合刈草三項均顯著高於除草劑，分別為 92.3% 對 32.9%、7.0 對 2.2 種、137 對 55.5 g/m²。年份覆蓋率不顯著，2018 種數與乾重高於 2019。O×Y 三項顯著，故年份或果園效果宜進一步做簡單效應；<\/p>\n<p>其他列出的交互作用不顯著。<\/p>\n<p>閱讀變方分析表時先列處理因子及其水準，再列測量指標和單位。資料表能顯示比較內容，但未必足以重建隨機化、區集、樣本數與重複量測結構；設計資訊不足應明確說明。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>若刈草處理使覆蓋率顯著高於除草劑，應同時寫出兩者平均值與單位；若果園×年份顯著，則不可只用兩年合併平均宣布某種果園永遠較高。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：可推因子與未知設計、三主效應、交互作用、顯著性與不能推出的結論。<\/p>\n<ul>\n<li><strong>可推因子與未知設計<\/strong><\/li>\n<li><strong>三主效應<\/strong><\/li>\n<li><strong>交互作用<\/strong><\/li>\n<li><strong>顯著性與不能推出的結論<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>看到 p&gt;0.05 就寫成完全沒有差別。<\/li>\n<\/ul>","source":"../../A113.pdf#page=2","md":"113年果樹學_逐題教學詳解.md","search":"表 2 實驗設計與結果判讀 ## 第八題｜表 2 實驗設計與結果判讀（15 分）\n\n### 題意與作答範圍\n\n本題重點：**表 2 實驗設計與結果判讀**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a113.pdf#page=2)。\n\n### 先掌握答案\n\n從表可辨識果園種類 o（蘋果、桃）、地表處理 t（除草劑、整合刈草）及年份 y（2018、2019）等因子，評估覆蓋率、雜草種數與乾生物量；\n\n### 原理拆解：為什麼會這樣？\n\n**先交代因子、層級與反應變數**\n\n閱讀變方分析表時先列處理因子及其水準，再列測量指標和單位。資料表能顯示比較內容，但未必足以重建隨機化、區集、樣本數與重複量測結構；設計資訊不足應明確說明。\n\n**先判交互作用，再解釋主效應**\n\n交互作用表示一因子的效果隨另一因子水準而變。若交互作用顯著，整體平均主效應不一定代表每一組合，宜比較簡單效應或相應組合；不顯著也不是證明兩者完全相等。\n\n**顯著性與效應大小都要寫**\n\n依事先設定的 α 判定 p 值，再用平均值、差額與單位描述方向。p 小不代表差異一定有生產價值，p 大也不代表效果為零；表中沒有的因果與實驗細節不應補造。\n\n### 這題要特別注意\n\n「不顯著」不代表完全相同；\n\n表沒有產量或土壤氮數據，不能由它證明刈草增產、氮增加或除草劑殘留造成傷害。題幹說明的背景也不能取代表內證據。[研究原文](https://www.mdpi.com/2311-7524/6/4/96)\n\n### 可直接練寫的完整答案\n\n從表可辨識果園種類 o（蘋果、桃）、地表處理 t（除草劑、整合刈草）及年份 y（2018、2019）等因子，評估覆蓋率、雜草種數與乾生物量；\n\n有 o×t、o×y、t×y、o×t×y 交互作用。表本身無法確認區集、重複數、隨機化或是否重複量測，不應捏造。以 α＝0.05：果園主效應三項均不顯著（0.063、0.138、0.060）；\n\n整合刈草三項均顯著高於除草劑，分別為 92.3% 對 32.9%、7.0 對 2.2 種、137 對 55.5 g/m²。年份覆蓋率不顯著，2018 種數與乾重高於 2019。o×y 三項顯著，故年份或果園效果宜進一步做簡單效應；\n\n其他列出的交互作用不顯著。\n\n閱讀變方分析表時先列處理因子及其水準，再列測量指標和單位。資料表能顯示比較內容，但未必足以重建隨機化、區集、樣本數與重複量測結構；設計資訊不足應明確說明。\n\n### 實例：把原理用在情境中\n\n若刈草處理使覆蓋率顯著高於除草劑，應同時寫出兩者平均值與單位；若果園×年份顯著，則不可只用兩年合併平均宣布某種果園永遠較高。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：可推因子與未知設計、三主效應、交互作用、顯著性與不能推出的結論。\n\n- **可推因子與未知設計**\n- **三主效應**\n- **交互作用**\n- **顯著性與不能推出的結論**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 看到 p>0.05 就寫成完全沒有差別。\n 113 果樹學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
