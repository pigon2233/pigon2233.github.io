rols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 5 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"園藝植物學-93-一","s":"園藝植物學","y":93,"n":"一","t":"細胞膜與壁圖、構造功能","body":"<h2>第一題｜細胞膜與壁圖、構造功能（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>細胞膜與壁圖、構造功能<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=42\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>由外至內畫「相鄰細胞—中膠層—初生壁—必要時次生壁—質膜—細胞質」，標胞間連絲穿壁連兩胞。壁以纖維素微纖絲為骨架，半纖維素、果膠與蛋白形成網，賦形支撐、抗膨壓與成長延展，中膠層果膠黏合。膜畫磷脂雙層、親水頭向水相、疏水尾內向，含蛋白、固醇及糖鏈，負責選擇運輸、訊號與電化學梯度。膜流動性與壁可塑性共同使細胞生長且不破裂。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>構造位置與功能要對得上<\/strong><\/p>\n<p>植物細胞外側有細胞壁，內側為選擇性通透的質膜；細胞質內的細胞器各有分工。成熟液泡細胞常具大型中央液泡，並非所有植物細胞都同樣有大量葉綠體。<\/p>\n<p><strong>膜維持隔室與可控制的運輸<\/strong><\/p>\n<p>脂雙層與膜蛋白形成選擇性屏障，通道、載體與幫浦控制物質移動；細胞壁則以纖維素等形成機械支撐，並參與生長、黏合與防禦。水分可影響膨壓，但細胞壁不是主要選擇性膜。<\/p>\n<p><strong>圖示必須呈現關係<\/strong><\/p>\n<p>畫細胞壁、質膜、中央液泡與細胞核，再標葉綠體、粒線體、內質網、高基氏體及核糖體等，標線避免交錯。葉綠體光合與粒線體呼吸可同存於綠色細胞，不可把兩者畫成互斥。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>由外至內畫「相鄰細胞—中膠層—初生壁—必要時次生壁—質膜—細胞質」，標胞間連絲穿壁連兩胞。壁以纖維素微纖絲為骨架，半纖維素、果膠與蛋白形成網，賦形支撐、抗膨壓與成長延展，中膠層果膠黏合。膜畫磷脂雙層、親水頭向水相、疏水尾內向，含蛋白、固醇及糖鏈，負責選擇運輸、訊號與電化學梯度。膜流動性與壁可塑性共同使細胞生長且不破裂。<\/p>\n<p>植物細胞外側有細胞壁，內側為選擇性通透的質膜；細胞質內的細胞器各有分工。成熟液泡細胞常具大型中央液泡，並非所有植物細胞都同樣有大量葉綠體。<\/p>\n<p>脂雙層與膜蛋白形成選擇性屏障，通道、載體與幫浦控制物質移動；細胞壁則以纖維素等形成機械支撐，並參與生長、黏合與防禦。水分可影響膨壓，但細胞壁不是主要選擇性膜。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>根部多數細胞不直接行光合作用，仍有粒線體供能；葉肉細胞可同時具有葉綠體與粒線體，白天也需要呼吸與其他代謝。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：壁層與微纖絲、流動鑲嵌膜、通道／幫浦、結構功能、示意圖。<\/p>\n<ul>\n<li><strong>壁層與微纖絲<\/strong><\/li>\n<li><strong>流動鑲嵌膜<\/strong><\/li>\n<li><strong>通道／幫浦<\/strong><\/li>\n<li><strong>結構功能<\/strong><\/li>\n<li><strong>示意圖<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把細胞壁當成選擇性控制離子的主要界面。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=42","md":"93年園藝植物學_逐題教學詳解.md","search":"細胞膜與壁圖、構造功能 ## 第一題｜細胞膜與壁圖、構造功能（20 分）\n\n### 題意與作答範圍\n\n本題重點：**細胞膜與壁圖、構造功能**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=42)。\n\n### 先掌握答案\n\n由外至內畫「相鄰細胞—中膠層—初生壁—必要時次生壁—質膜—細胞質」，標胞間連絲穿壁連兩胞。壁以纖維素微纖絲為骨架，半纖維素、果膠與蛋白形成網，賦形支撐、抗膨壓與成長延展，中膠層果膠黏合。膜畫磷脂雙層、親水頭向水相、疏水尾內向，含蛋白、固醇及糖鏈，負責選擇運輸、訊號與電化學梯度。膜流動性與壁可塑性共同使細胞生長且不破裂。\n\n### 原理拆解：為什麼會這樣？\n\n**構造位置與功能要對得上**\n\n植物細胞外側有細胞壁，內側為選擇性通透的質膜；細胞質內的細胞器各有分工。成熟液泡細胞常具大型中央液泡，並非所有植物細胞都同樣有大量葉綠體。\n\n**膜維持隔室與可控制的運輸**\n\n脂雙層與膜蛋白形成選擇性屏障，通道、載體與幫浦控制物質移動；細胞壁則以纖維素等形成機械支撐，並參與生長、黏合與防禦。水分可影響膨壓，但細胞壁不是主要選擇性膜。\n\n**圖示必須呈現關係**\n\n畫細胞壁、質膜、中央液泡與細胞核，再標葉綠體、粒線體、內質網、高基氏體及核糖體等，標線避免交錯。葉綠體光合與粒線體呼吸可同存於綠色細胞，不可把兩者畫成互斥。\n\n### 可直接練寫的完整答案\n\n由外至內畫「相鄰細胞—中膠層—初生壁—必要時次生壁—質膜—細胞質」，標胞間連絲穿壁連兩胞。壁以纖維素微纖絲為骨架，半纖維素、果膠與蛋白形成網，賦形支撐、抗膨壓與成長延展，中膠層果膠黏合。膜畫磷脂雙層、親水頭向水相、疏水尾內向，含蛋白、固醇及糖鏈，負責選擇運輸、訊號與電化學梯度。膜流動性與壁可塑性共同使細胞生長且不破裂。\n\n植物細胞外側有細胞壁，內側為選擇性通透的質膜；細胞質內的細胞器各有分工。成熟液泡細胞常具大型中央液泡，並非所有植物細胞都同樣有大量葉綠體。\n\n脂雙層與膜蛋白形成選擇性屏障，通道、載體與幫浦控制物質移動；細胞壁則以纖維素等形成機械支撐，並參與生長、黏合與防禦。水分可影響膨壓，但細胞壁不是主要選擇性膜。\n\n### 實例：把原理用在情境中\n\n根部多數細胞不直接行光合作用，仍有粒線體供能；葉肉細胞可同時具有葉綠體與粒線體，白天也需要呼吸與其他代謝。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：壁層與微纖絲、流動鑲嵌膜、通道／幫浦、結構功能、示意圖。\n\n- **壁層與微纖絲**\n- **流動鑲嵌膜**\n- **通道／幫浦**\n- **結構功能**\n- **示意圖**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把細胞壁當成選擇性控制離子的主要界面。\n 93 園藝植物學"},{"id":"園藝植物學-93-二","s":"園藝植物學","y":93,"n":"二","t":"氣孔開閉機制與環境","body":"<h2>第二題｜氣孔開閉機制與環境（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>氣孔開閉機制與環境<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=42\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>光尤其藍光啟動保衛細胞 H⁺-ATPase，膜超極化促 K⁺ 及相應陰離子／有機酸累積，水勢下降、吸水膨壓上升；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>保衛細胞膨壓改變孔隙<\/strong><\/p>\n<p>光與訊號可調控質膜 H⁺ 幫浦及離子通道，促進 K⁺、陰離子或其他滲透物累積，水隨水勢梯度進入使保衛細胞膨壓上升；細胞壁幾何使氣孔開啟。關閉則伴隨離子與水外流。<\/p>\n<p><strong>光、CO₂ 與水分訊號共同作用<\/strong><\/p>\n<p>藍光可促開孔，葉內 CO₂ 與光合需求參與調控；乾旱時 ABA 訊號及水力狀態促關孔，以降低失水。反應受物種、時段與環境影響，不宜簡化為所有植物白天都開、晚上都關。<\/p>\n<p><strong>節水與碳吸收之間存在取捨<\/strong><\/p>\n<p>氣孔關閉降低蒸散，也限制 CO₂ 進入並可能提高葉溫。作物長期水分利用效率須合併產量評估；單看蒸散降低不能判定整體生長一定受益。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>光尤其藍光啟動保衛細胞 H⁺-ATPase，膜超極化促 K⁺ 及相應陰離子／有機酸累積，水勢下降、吸水膨壓上升；<\/p>\n<p>特殊細胞壁形狀使孔開。黑暗、乾旱 ABA 與高 CO₂ 等訊號引陰離子及 K⁺ 外流、水退出、膨壓降而閉。光、CO₂、葉水勢、VPD、溫度與生理時鐘共同調控；<\/p>\n<p>氣孔開有助碳固定卻增加失水，CAM 常夜開以節水。<\/p>\n<p>光與訊號可調控質膜 H⁺ 幫浦及離子通道，促進 K⁺、陰離子或其他滲透物累積，水隨水勢梯度進入使保衛細胞膨壓上升；細胞壁幾何使氣孔開啟。關閉則伴隨離子與水外流。<\/p>\n<p>藍光可促開孔，葉內 CO₂ 與光合需求參與調控；乾旱時 ABA 訊號及水力狀態促關孔，以降低失水。反應受物種、時段與環境影響，不宜簡化為所有植物白天都開、晚上都關。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>乾旱使一般 C₃ 蔬菜氣孔關閉，短期保水，卻可能降低光合與膨大；CAM 植物的典型夜間開孔則須另依其日韻律解釋。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：幫浦→離子→水勢→膨壓鏈、閉孔訊號、環境與權衡。<\/p>\n<ul>\n<li><strong>幫浦→離子→水勢→膨壓鏈<\/strong><\/li>\n<li><strong>閉孔訊號<\/strong><\/li>\n<li><strong>環境與權衡<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把水分進出說成主動耗 ATP 搬運水分子。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=42","md":"93年園藝植物學_逐題教學詳解.md","search":"氣孔開閉機制與環境 ## 第二題｜氣孔開閉機制與環境（20 分）\n\n### 題意與作答範圍\n\n本題重點：**氣孔開閉機制與環境**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=42)。\n\n### 先掌握答案\n\n光尤其藍光啟動保衛細胞 h⁺-atpase，膜超極化促 k⁺ 及相應陰離子／有機酸累積，水勢下降、吸水膨壓上升；\n\n### 原理拆解：為什麼會這樣？\n\n**保衛細胞膨壓改變孔隙**\n\n光與訊號可調控質膜 h⁺ 幫浦及離子通道，促進 k⁺、陰離子或其他滲透物累積，水隨水勢梯度進入使保衛細胞膨壓上升；細胞壁幾何使氣孔開啟。關閉則伴隨離子與水外流。\n\n**光、co₂ 與水分訊號共同作用**\n\n藍光可促開孔，葉內 co₂ 與光合需求參與調控；乾旱時 aba 訊號及水力狀態促關孔，以降低失水。反應受物種、時段與環境影響，不宜簡化為所有植物白天都開、晚上都關。\n\n**節水與碳吸收之間存在取捨**\n\n氣孔關閉降低蒸散，也限制 co₂ 進入並可能提高葉溫。作物長期水分利用效率須合併產量評估；單看蒸散降低不能判定整體生長一定受益。\n\n### 可直接練寫的完整答案\n\n光尤其藍光啟動保衛細胞 h⁺-atpase，膜超極化促 k⁺ 及相應陰離子／有機酸累積，水勢下降、吸水膨壓上升；\n\n特殊細胞壁形狀使孔開。黑暗、乾旱 aba 與高 co₂ 等訊號引陰離子及 k⁺ 外流、水退出、膨壓降而閉。光、co₂、葉水勢、vpd、溫度與生理時鐘共同調控；\n\n氣孔開有助碳固定卻增加失水，cam 常夜開以節水。\n\n光與訊號可調控質膜 h⁺ 幫浦及離子通道，促進 k⁺、陰離子或其他滲透物累積，水隨水勢梯度進入使保衛細胞膨壓上升；細胞壁幾何使氣孔開啟。關閉則伴隨離子與水外流。\n\n藍光可促開孔，葉內 co₂ 與光合需求參與調控；乾旱時 aba 訊號及水力狀態促關孔，以降低失水。反應受物種、時段與環境影響，不宜簡化為所有植物白天都開、晚上都關。\n\n### 實例：把原理用在情境中\n\n乾旱使一般 c₃ 蔬菜氣孔關閉，短期保水，卻可能降低光合與膨大；cam 植物的典型夜間開孔則須另依其日韻律解釋。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：幫浦→離子→水勢→膨壓鏈、閉孔訊號、環境與權衡。\n\n- **幫浦→離子→水勢→膨壓鏈**\n- **閉孔訊號**\n- **環境與權衡**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把水分進出說成主動耗 atp 搬運水分子。\n 93 園藝植物學"},{"id":"園藝植物學-93-三","s":"園藝植物學","y":93,"n":"三","t":"光合物從葉到果","body":"<h2>第三題｜光合物從葉到果（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>光合物從葉到果<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=42\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>葉肉葉綠體固定碳，糖在細胞質形成蔗糖，經葉肉—小葉脈伴細胞—篩管裝載，沿葉柄、枝幹、果梗韌皮部入果實，卸載至果肉再利用或液泡貯藏。源端裝載降低水勢、木質部水進篩管升壓，庫端卸載降壓，形成壓力流；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把源與庫接起來<\/strong><\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<p><strong>壓力流與跨膜運輸不是同一層次<\/strong><\/p>\n<p>源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；H⁺-ATPase 建立電化學梯度，可支援 H⁺／蔗糖共運輸。<\/p>\n<p><strong>庫強決定競爭，不只看果實大小<\/strong><\/p>\n<p>庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>葉肉葉綠體固定碳，糖在細胞質形成蔗糖，經葉肉—小葉脈伴細胞—篩管裝載，沿葉柄、枝幹、果梗韌皮部入果實，卸載至果肉再利用或液泡貯藏。源端裝載降低水勢、木質部水進篩管升壓，庫端卸載降壓，形成壓力流；<\/p>\n<p>共質體與質外體路徑依物種與時期不同。<\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<p>源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；H⁺-ATPase 建立電化學梯度，可支援 H⁺／蔗糖共運輸。<\/p>\n<h3>圖解輔助<\/h3>\n<p><img alt=\"光合物從葉到果示意圖\" src=\"../圖解/02_源庫運輸.svg\" /><\/p>\n<p>示意圖用來理解結構與方向；考場仍須依原題標示軸名、箭頭或構造。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：完整組織、裝卸載、能量與壓力流、貯藏位置。<\/p>\n<ul>\n<li><strong>完整組織<\/strong><\/li>\n<li><strong>裝卸載<\/strong><\/li>\n<li><strong>能量與壓力流<\/strong><\/li>\n<li><strong>貯藏位置<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把長距離糖運輸寫成主要沿木質部。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=42","md":"93年園藝植物學_逐題教學詳解.md","search":"光合物從葉到果 ## 第三題｜光合物從葉到果（20 分）\n\n### 題意與作答範圍\n\n本題重點：**光合物從葉到果**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=42)。\n\n### 先掌握答案\n\n葉肉葉綠體固定碳，糖在細胞質形成蔗糖，經葉肉—小葉脈伴細胞—篩管裝載，沿葉柄、枝幹、果梗韌皮部入果實，卸載至果肉再利用或液泡貯藏。源端裝載降低水勢、木質部水進篩管升壓，庫端卸載降壓，形成壓力流；\n\n### 原理拆解：為什麼會這樣？\n\n**先把源與庫接起來**\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n**壓力流與跨膜運輸不是同一層次**\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n**庫強決定競爭，不只看果實大小**\n\n庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。\n\n### 可直接練寫的完整答案\n\n葉肉葉綠體固定碳，糖在細胞質形成蔗糖，經葉肉—小葉脈伴細胞—篩管裝載，沿葉柄、枝幹、果梗韌皮部入果實，卸載至果肉再利用或液泡貯藏。源端裝載降低水勢、木質部水進篩管升壓，庫端卸載降壓，形成壓力流；\n\n共質體與質外體路徑依物種與時期不同。\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n### 圖解輔助\n\n![光合物從葉到果示意圖](../圖解/02_源庫運輸.svg)\n\n示意圖用來理解結構與方向；考場仍須依原題標示軸名、箭頭或構造。\n\n### 實例：把原理用在情境中\n\n同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：完整組織、裝卸載、能量與壓力流、貯藏位置。\n\n- **完整組織**\n- **裝卸載**\n- **能量與壓力流**\n- **貯藏位置**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把長距離糖運輸寫成主要沿木質部。\n 93 園藝植物學"},{"id":"園藝植物學-93-四","s":"園藝植物學","y":93,"n":"四","t":"有絲與減數分裂","body":"<h2>第四題｜有絲與減數分裂（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>有絲與減數分裂<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=42\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>有絲分裂一次核分裂，通常形成兩個與母細胞同倍數、遺傳近同的子細胞，支持根莖葉生長、癒傷及扦插組培保持品種。減數分裂於有性生殖前經一次 DNA 複製、兩次分裂，同源配對與交換，形成染色體數減半、遺傳重組的孢子，再形成配子體及配子。其分離重組是雜交育種變異來源；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>減數分裂減半的是同源染色體組數<\/strong><\/p>\n<p>DNA 先複製一次，再連續分裂兩次；第一次主要分開同源染色體，第二次分開姊妹染色分體。有絲分裂則通常保留原倍數。植物減數分裂先形成孢子，孢子再發育為配子體並產生配子，不能完全套用動物直接產配子的敘述。<\/p>\n<p><strong>先區分基因型與表型<\/strong><\/p>\n<p>基因型決定遺傳組合，表型則是基因型、環境及兩者交互作用的結果。相似表型不一定有相同基因型，環境造成的差異也不必然能遺傳給下一代。<\/p>\n<p><strong>孟德爾比例有適用前提<\/strong><\/p>\n<p>等位基因在減數分裂分離；不連鎖或相距夠遠的基因可近似獨立分配。3:1 或 9:3:3:1 的表型比還依完全顯性、相應交配方式及無其他干擾等條件，不是所有雜交都必須得到同一比例。<\/p>\n<p><strong>例外要說明改變哪個前提<\/strong><\/p>\n<p>緊密連鎖使親本型較多，上位作用改變基因間的表型組合，不完全顯性使雜合型可區辨，細胞質遺傳則可能有母系效應。多倍體、致死與選汰也會改變預期比例，不能只背例外名稱。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>有絲分裂一次核分裂，通常形成兩個與母細胞同倍數、遺傳近同的子細胞，支持根莖葉生長、癒傷及扦插組培保持品種。減數分裂於有性生殖前經一次 DNA 複製、兩次分裂，同源配對與交換，形成染色體數減半、遺傳重組的孢子，再形成配子體及配子。其分離重組是雜交育種變異來源；<\/p>\n<p>無性繁殖仍有突變可能，不是絕對零變異。<\/p>\n<p>DNA 先複製一次，再連續分裂兩次；第一次主要分開同源染色體，第二次分開姊妹染色分體。有絲分裂則通常保留原倍數。植物減數分裂先形成孢子，孢子再發育為配子體並產生配子，不能完全套用動物直接產配子的敘述。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>兩個緊密連鎖的番茄基因在測交後可能以親本組合為多，重組型較少；這是獨立分配前提不成立，不代表等位基因不再分離。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：次數、倍數、產物與交換、植物孢子／配子區別、兩種園藝用途。<\/p>\n<ul>\n<li><strong>產物與交換<\/strong><\/li>\n<li><strong>植物孢子／配子區別<\/strong><\/li>\n<li><strong>兩種園藝用途<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>認為表型比不符 9:3:3:1 就推翻全部遺傳定律。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=42","md":"93年園藝植物學_逐題教學詳解.md","search":"有絲與減數分裂 ## 第四題｜有絲與減數分裂（20 分）\n\n### 題意與作答範圍\n\n本題重點：**有絲與減數分裂**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=42)。\n\n### 先掌握答案\n\n有絲分裂一次核分裂，通常形成兩個與母細胞同倍數、遺傳近同的子細胞，支持根莖葉生長、癒傷及扦插組培保持品種。減數分裂於有性生殖前經一次 dna 複製、兩次分裂，同源配對與交換，形成染色體數減半、遺傳重組的孢子，再形成配子體及配子。其分離重組是雜交育種變異來源；\n\n### 原理拆解：為什麼會這樣？\n\n**減數分裂減半的是同源染色體組數**\n\ndna 先複製一次，再連續分裂兩次；第一次主要分開同源染色體，第二次分開姊妹染色分體。有絲分裂則通常保留原倍數。植物減數分裂先形成孢子，孢子再發育為配子體並產生配子，不能完全套用動物直接產配子的敘述。\n\n**先區分基因型與表型**\n\n基因型決定遺傳組合，表型則是基因型、環境及兩者交互作用的結果。相似表型不一定有相同基因型，環境造成的差異也不必然能遺傳給下一代。\n\n**孟德爾比例有適用前提**\n\n等位基因在減數分裂分離；不連鎖或相距夠遠的基因可近似獨立分配。3:1 或 9:3:3:1 的表型比還依完全顯性、相應交配方式及無其他干擾等條件，不是所有雜交都必須得到同一比例。\n\n**例外要說明改變哪個前提**\n\n緊密連鎖使親本型較多，上位作用改變基因間的表型組合，不完全顯性使雜合型可區辨，細胞質遺傳則可能有母系效應。多倍體、致死與選汰也會改變預期比例，不能只背例外名稱。\n\n### 可直接練寫的完整答案\n\n有絲分裂一次核分裂，通常形成兩個與母細胞同倍數、遺傳近同的子細胞，支持根莖葉生長、癒傷及扦插組培保持品種。減數分裂於有性生殖前經一次 dna 複製、兩次分裂，同源配對與交換，形成染色體數減半、遺傳重組的孢子，再形成配子體及配子。其分離重組是雜交育種變異來源；\n\n無性繁殖仍有突變可能，不是絕對零變異。\n\ndna 先複製一次，再連續分裂兩次；第一次主要分開同源染色體，第二次分開姊妹染色分體。有絲分裂則通常保留原倍數。植物減數分裂先形成孢子，孢子再發育為配子體並產生配子，不能完全套用動物直接產配子的敘述。\n\n### 實例：把原理用在情境中\n\n兩個緊密連鎖的番茄基因在測交後可能以親本組合為多，重組型較少；這是獨立分配前提不成立，不代表等位基因不再分離。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：次數、倍數、產物與交換、植物孢子／配子區別、兩種園藝用途。\n\n- **產物與交換**\n- **植物孢子／配子區別**\n- **兩種園藝用途**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 認為表型比不符 9:3:3:1 就推翻全部遺傳定律。\n 93 園藝植物學"},{"id":"園藝植物學-93-五","s":"園藝植物學","y":93,"n":"五","t":"光呼吸與降低方法","body":"<h2>第五題｜光呼吸與降低方法（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>光呼吸與降低方法<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=42\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Rubisco 的加氧反應把 RuBP 轉成 3-PGA 與 2-磷酸乙醇酸，後者需經葉綠體、過氧化體、粒線體回收，耗能並釋 CO₂，降低淨碳固定，常在高溫、低 CO₂／高 O₂ 及氣孔關閉時增加。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>起點是 Rubisco 的加氧反應<\/strong><\/p>\n<p>Rubisco 除羧化外也可催化 RuBP 加氧，產生須回收的含碳產物。光呼吸涉及葉綠體、過氧化體與粒線體，消耗能量並釋放部分 CO₂，通常降低 C₃ 植物的淨碳收益。<\/p>\n<p><strong>高溫與低葉內 CO₂ 常加劇問題<\/strong><\/p>\n<p>高溫改變氣體溶解與酵素選擇性，乾旱關孔降低葉內 CO₂，使加氧相對增加。光呼吸並非黑暗呼吸，也不能把所有光下 CO₂ 釋放都只歸因於同一途徑。<\/p>\n<p><strong>降低損失須考慮生產條件<\/strong><\/p>\n<p>適度降葉溫、維持供水與合宜 CO₂ 可改善羧化競爭；C₄ 與 CAM 利用濃縮 CO₂ 機制降低部分限制，但不能用它們的耐逆性推論所有環境都高產。光呼吸也有代謝與光保護角色，不宜描述成完全無功能。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Rubisco 的加氧反應把 RuBP 轉成 3-PGA 與 2-磷酸乙醇酸，後者需經葉綠體、過氧化體、粒線體回收，耗能並釋 CO₂，降低淨碳固定，常在高溫、低 CO₂／高 O₂ 及氣孔關閉時增加。<\/p>\n<p>C4 以空間分離的 PEPC 固碳及維管束鞘濃縮 CO₂，CAM 以夜固碳晝脫羧時間分離，降低 Rubisco 周圍的氧化競爭。C3 管理可適當補 CO₂、維持葉溫與水分，但不能完全消除；<\/p>\n<p>光呼吸亦有代謝及光保護功能。<\/p>\n<p>Rubisco 除羧化外也可催化 RuBP 加氧，產生須回收的含碳產物。光呼吸涉及葉綠體、過氧化體與粒線體，消耗能量並釋放部分 CO₂，通常降低 C₃ 植物的淨碳收益。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>夏季 C₃ 葉菜若高溫加缺水，關孔後光呼吸相對增加；適當遮陰降溫與均勻灌溉可比單純增加光強更有效改善碳收支。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：Rubisco 氧化、回收三胞器與代價、C4／CAM、栽培方法及非全然無用。<\/p>\n<ul>\n<li><strong>Rubisco 氧化<\/strong><\/li>\n<li><strong>回收三胞器與代價<\/strong><\/li>\n<li><strong>C4／CAM<\/strong><\/li>\n<li><strong>栽培方法及非全然無用<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將光呼吸和粒線體一般呼吸寫成同義。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=42","md":"93年園藝植物學_逐題教學詳解.md","search":"光呼吸與降低方法 ## 第五題｜光呼吸與降低方法（20 分）\n\n### 題意與作答範圍\n\n本題重點：**光呼吸與降低方法**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=42)。\n\n### 先掌握答案\n\nrubisco 的加氧反應把 rubp 轉成 3-pga 與 2-磷酸乙醇酸，後者需經葉綠體、過氧化體、粒線體回收，耗能並釋 co₂，降低淨碳固定，常在高溫、低 co₂／高 o₂ 及氣孔關閉時增加。\n\n### 原理拆解：為什麼會這樣？\n\n**起點是 rubisco 的加氧反應**\n\nrubisco 除羧化外也可催化 rubp 加氧，產生須回收的含碳產物。光呼吸涉及葉綠體、過氧化體與粒線體，消耗能量並釋放部分 co₂，通常降低 c₃ 植物的淨碳收益。\n\n**高溫與低葉內 co₂ 常加劇問題**\n\n高溫改變氣體溶解與酵素選擇性，乾旱關孔降低葉內 co₂，使加氧相對增加。光呼吸並非黑暗呼吸，也不能把所有光下 co₂ 釋放都只歸因於同一途徑。\n\n**降低損失須考慮生產條件**\n\n適度降葉溫、維持供水與合宜 co₂ 可改善羧化競爭；c₄ 與 cam 利用濃縮 co₂ 機制降低部分限制，但不能用它們的耐逆性推論所有環境都高產。光呼吸也有代謝與光保護角色，不宜描述成完全無功能。\n\n### 可直接練寫的完整答案\n\nrubisco 的加氧反應把 rubp 轉成 3-pga 與 2-磷酸乙醇酸，後者需經葉綠體、過氧化體、粒線體回收，耗能並釋 co₂，降低淨碳固定，常在高溫、低 co₂／高 o₂ 及氣孔關閉時增加。\n\nc4 以空間分離的 pepc 固碳及維管束鞘濃縮 co₂，cam 以夜固碳晝脫羧時間分離，降低 rubisco 周圍的氧化競爭。c3 管理可適當補 co₂、維持葉溫與水分，但不能完全消除；\n\n光呼吸亦有代謝及光保護功能。\n\nrubisco 除羧化外也可催化 rubp 加氧，產生須回收的含碳產物。光呼吸涉及葉綠體、過氧化體與粒線體，消耗能量並釋放部分 co₂，通常降低 c₃ 植物的淨碳收益。\n\n### 實例：把原理用在情境中\n\n夏季 c₃ 葉菜若高溫加缺水，關孔後光呼吸相對增加；適當遮陰降溫與均勻灌溉可比單純增加光強更有效改善碳收支。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：rubisco 氧化、回收三胞器與代價、c4／cam、栽培方法及非全然無用。\n\n- **rubisco 氧化**\n- **回收三胞器與代價**\n- **c4／cam**\n- **栽培方法及非全然無用**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將光呼吸和粒線體一般呼吸寫成同義。\n 93 園藝植物學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
