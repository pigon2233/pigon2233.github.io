ls{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 7 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"蔬菜學-95-一","s":"蔬菜學","y":95,"n":"一","t":"variety、cultivar 與種原","body":"<h2>第一題｜variety、cultivar 與種原（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>variety、cultivar 與種原<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=37\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>植物分類 variety 是種下自然變種；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>植物分類 variety 是種下自然變種；<\/p>\n<p>cultivar 為選育且可用適當繁殖維持特徵的栽培品種，中文常混用故須說語境。全球蒐種可取得地方適應、抗性與品質基因；<\/p>\n<p>如乾旱地材料常有節水、早熟特性，高緯冷涼材料具成花或耐寒反應，長期人擇又使食器肥大、休眠減少。種原與環境共同塑造演化，不能只以產地直接推定全部抗性。<\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：兩術語、種原必要、至少兩環境演化例。<\/p>\n<ul>\n<li><strong>兩術語<\/strong><\/li>\n<li><strong>種原必要<\/strong><\/li>\n<li><strong>至少兩環境演化例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=37","md":"95年蔬菜學_逐題教學詳解.md","search":"variety、cultivar 與種原 ## 第一題｜variety、cultivar 與種原（15 分）\n\n### 題意與作答範圍\n\n本題重點：**variety、cultivar 與種原**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=37)。\n\n### 先掌握答案\n\n植物分類 variety 是種下自然變種；\n\n### 原理拆解：為什麼會這樣？\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n### 可直接練寫的完整答案\n\n植物分類 variety 是種下自然變種；\n\ncultivar 為選育且可用適當繁殖維持特徵的栽培品種，中文常混用故須說語境。全球蒐種可取得地方適應、抗性與品質基因；\n\n如乾旱地材料常有節水、早熟特性，高緯冷涼材料具成花或耐寒反應，長期人擇又使食器肥大、休眠減少。種原與環境共同塑造演化，不能只以產地直接推定全部抗性。\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n### 實例：把原理用在情境中\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：兩術語、種原必要、至少兩環境演化例。\n\n- **兩術語**\n- **種原必要**\n- **至少兩環境演化例**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把轉入基因成功直接等同育成可商業化品種。\n 95 蔬菜學"},{"id":"蔬菜學-95-二","s":"蔬菜學","y":95,"n":"二","t":"蔬菜色素與四例","body":"<h2>第二題｜蔬菜色素與四例（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>蔬菜色素與四例<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=37\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>葉綠素呈綠、類胡蘿蔔素黃橙紅、花青素紅紫藍、甜菜色素紅紫黃。例：番茄高溫抑茄紅素使著色差；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先找色素，再找影響顯色的環境<\/strong><\/p>\n<p>花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。<\/p>\n<p><strong>同一色素也能呈不同顏色<\/strong><\/p>\n<p>液泡 pH、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 pH 不會不經生理過程就等於花瓣液泡 pH。<\/p>\n<p><strong>用可驗證的機制解釋栽培或育種操作<\/strong><\/p>\n<p>繡球花的藍色涉及鋁有效性與花器內的色素複合，需同時考慮品種與介質；藍玫瑰育種則涉及花青素生合成途徑、競爭酵素與細胞條件。不能只以「施酸肥」解釋所有藍花。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>葉綠素呈綠、類胡蘿蔔素黃橙紅、花青素紅紫藍、甜菜色素紅紫黃。例：番茄高溫抑茄紅素使著色差；<\/p>\n<p>胡蘿蔔品種及光溫影響胡蘿蔔素；<\/p>\n<p>紫甘藍／茄子花青素受基因光溫；<\/p>\n<p>白蘆筍遮光抑葉綠素、露光變綠。採後酸熱也可使葉綠素失鎂變褐綠。<\/p>\n<p>花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。<\/p>\n<p>液泡 pH、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 pH 不會不經生理過程就等於花瓣液泡 pH。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同品種繡球在適合條件下，可因根域酸度影響鋁有效性而改變顯色；白花或缺乏相關色素能力的品種，不能保證以同一方法轉成藍花。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：主要色素、四個基因／環境栽培例與機制。<\/p>\n<ul>\n<li><strong>主要色素<\/strong><\/li>\n<li><strong>四個基因／環境栽培例與機制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有黃花都歸因於花青素。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=37","md":"95年蔬菜學_逐題教學詳解.md","search":"蔬菜色素與四例 ## 第二題｜蔬菜色素與四例（15 分）\n\n### 題意與作答範圍\n\n本題重點：**蔬菜色素與四例**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=37)。\n\n### 先掌握答案\n\n葉綠素呈綠、類胡蘿蔔素黃橙紅、花青素紅紫藍、甜菜色素紅紫黃。例：番茄高溫抑茄紅素使著色差；\n\n### 原理拆解：為什麼會這樣？\n\n**先找色素，再找影響顯色的環境**\n\n花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。\n\n**同一色素也能呈不同顏色**\n\n液泡 ph、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 ph 不會不經生理過程就等於花瓣液泡 ph。\n\n**用可驗證的機制解釋栽培或育種操作**\n\n繡球花的藍色涉及鋁有效性與花器內的色素複合，需同時考慮品種與介質；藍玫瑰育種則涉及花青素生合成途徑、競爭酵素與細胞條件。不能只以「施酸肥」解釋所有藍花。\n\n### 可直接練寫的完整答案\n\n葉綠素呈綠、類胡蘿蔔素黃橙紅、花青素紅紫藍、甜菜色素紅紫黃。例：番茄高溫抑茄紅素使著色差；\n\n胡蘿蔔品種及光溫影響胡蘿蔔素；\n\n紫甘藍／茄子花青素受基因光溫；\n\n白蘆筍遮光抑葉綠素、露光變綠。採後酸熱也可使葉綠素失鎂變褐綠。\n\n花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。\n\n液泡 ph、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 ph 不會不經生理過程就等於花瓣液泡 ph。\n\n### 實例：把原理用在情境中\n\n同品種繡球在適合條件下，可因根域酸度影響鋁有效性而改變顯色；白花或缺乏相關色素能力的品種，不能保證以同一方法轉成藍花。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：主要色素、四個基因／環境栽培例與機制。\n\n- **主要色素**\n- **四個基因／環境栽培例與機制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有黃花都歸因於花青素。\n 95 蔬菜學"},{"id":"蔬菜學-95-三","s":"蔬菜學","y":95,"n":"三","t":"外銷潛力與流程","body":"<h2>第三題｜外銷潛力與流程（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>外銷潛力與流程<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=37\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>可依市場舉結球萵苣、毛豆、青花菜、甘藍、胡蘿蔔等。以結球萵苣為例：契作適規格、採前殘留與衛生→適熟輕採→去外葉分級→迅速真空預冷→透氣保濕箱→近 0°C 不凍結冷鏈→檢疫與文件→運輸監測→抵港驗貨與冷藏。須用航程加貨架期確認耐運，並確認目的國最新准入。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>採後仍活著，也仍在消耗<\/strong><\/p>\n<p>蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。<\/p>\n<p><strong>低溫與保濕要兼顧氣體交換<\/strong><\/p>\n<p>快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。<\/p>\n<p><strong>截切菜需把安全與外觀一起管理<\/strong><\/p>\n<p>流程包括原料驗收、去除不良部位、適當清洗、切割、清洗消毒、瀝乾、包裝與冷藏配送，細節依設備與產品調整。消毒水須管控有效濃度、接觸時間與有機物負荷，目標包含避免交叉污染，並不等於滅菌。<\/p>\n<p><strong>先分清預冷與冷藏<\/strong><\/p>\n<p>採收時產品常接近田間溫度；若只把大量溫熱貨物放進冷庫，外層先冷、箱內與果心仍熱，呼吸及失水會持續。預冷的目標是迅速降低產品溫度，冷藏則是把已降溫的產品維持在適溫，兩者目的與設備負荷不同。<\/p>\n<p><strong>冷得快，必須讓熱有出口<\/strong><\/p>\n<p>壓差預冷靠風扇建立壓差，迫使冷空氣穿過箱孔與產品間隙；箱孔不對齊或氣流短路時，庫溫低也不代表果心降得快。水冷以冷水接觸傳熱，但要控制水質與交叉污染。真空預冷則降低氣壓，使組織水分在低溫蒸發，帶走潛熱。<\/p>\n<p><strong>依器官結構選方法<\/strong><\/p>\n<p>葉菜表面積相對大，真空法常有效；大果實的果心熱須先傳到外層，表皮又限制蒸發，因此真空法可能慢且失重。方法選定後，還須量果心或代表部位溫度，訂冷卻終點，而不是只記處理分鐘。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>可依市場舉結球萵苣、毛豆、青花菜、甘藍、胡蘿蔔等。以結球萵苣為例：契作適規格、採前殘留與衛生→適熟輕採→去外葉分級→迅速真空預冷→透氣保濕箱→近 0°C 不凍結冷鏈→檢疫與文件→運輸監測→抵港驗貨與冷藏。須用航程加貨架期確認耐運，並確認目的國最新准入。<\/p>\n<p>蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。<\/p>\n<p>快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>截切萵苣若只處理褐變而未瀝乾與維持冷鏈，仍可能滲液、腐敗或發生微生物風險；應用同批產品的外觀、失重與衛生檢測共同決定期限。<\/p>\n<p>包裝場可將同一箱產品放置多點溫度計，畫降溫曲線，比較箱心與外側。這能檢查通氣孔、堆裝與風量是否合適，也可同時量失重，避免用犧牲水分換取冷卻速度。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：候選菜、單一作物全流程、條件與品質驗證。<\/p>\n<ul>\n<li><strong>候選菜<\/strong><\/li>\n<li><strong>單一作物全流程<\/strong><\/li>\n<li><strong>條件與品質驗證<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把清洗消毒寫成可以保證完全無菌。<\/li>\n<li>把預冷寫成單純放進冰箱，沒有交代移除田間熱。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=37","md":"95年蔬菜學_逐題教學詳解.md","search":"外銷潛力與流程 ## 第三題｜外銷潛力與流程（15 分）\n\n### 題意與作答範圍\n\n本題重點：**外銷潛力與流程**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=37)。\n\n### 先掌握答案\n\n可依市場舉結球萵苣、毛豆、青花菜、甘藍、胡蘿蔔等。以結球萵苣為例：契作適規格、採前殘留與衛生→適熟輕採→去外葉分級→迅速真空預冷→透氣保濕箱→近 0°c 不凍結冷鏈→檢疫與文件→運輸監測→抵港驗貨與冷藏。須用航程加貨架期確認耐運，並確認目的國最新准入。\n\n### 原理拆解：為什麼會這樣？\n\n**採後仍活著，也仍在消耗**\n\n蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。\n\n**低溫與保濕要兼顧氣體交換**\n\n快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。\n\n**截切菜需把安全與外觀一起管理**\n\n流程包括原料驗收、去除不良部位、適當清洗、切割、清洗消毒、瀝乾、包裝與冷藏配送，細節依設備與產品調整。消毒水須管控有效濃度、接觸時間與有機物負荷，目標包含避免交叉污染，並不等於滅菌。\n\n**先分清預冷與冷藏**\n\n採收時產品常接近田間溫度；若只把大量溫熱貨物放進冷庫，外層先冷、箱內與果心仍熱，呼吸及失水會持續。預冷的目標是迅速降低產品溫度，冷藏則是把已降溫的產品維持在適溫，兩者目的與設備負荷不同。\n\n**冷得快，必須讓熱有出口**\n\n壓差預冷靠風扇建立壓差，迫使冷空氣穿過箱孔與產品間隙；箱孔不對齊或氣流短路時，庫溫低也不代表果心降得快。水冷以冷水接觸傳熱，但要控制水質與交叉污染。真空預冷則降低氣壓，使組織水分在低溫蒸發，帶走潛熱。\n\n**依器官結構選方法**\n\n葉菜表面積相對大，真空法常有效；大果實的果心熱須先傳到外層，表皮又限制蒸發，因此真空法可能慢且失重。方法選定後，還須量果心或代表部位溫度，訂冷卻終點，而不是只記處理分鐘。\n\n### 可直接練寫的完整答案\n\n可依市場舉結球萵苣、毛豆、青花菜、甘藍、胡蘿蔔等。以結球萵苣為例：契作適規格、採前殘留與衛生→適熟輕採→去外葉分級→迅速真空預冷→透氣保濕箱→近 0°c 不凍結冷鏈→檢疫與文件→運輸監測→抵港驗貨與冷藏。須用航程加貨架期確認耐運，並確認目的國最新准入。\n\n蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。\n\n快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。\n\n### 實例：把原理用在情境中\n\n截切萵苣若只處理褐變而未瀝乾與維持冷鏈，仍可能滲液、腐敗或發生微生物風險；應用同批產品的外觀、失重與衛生檢測共同決定期限。\n\n包裝場可將同一箱產品放置多點溫度計，畫降溫曲線，比較箱心與外側。這能檢查通氣孔、堆裝與風量是否合適，也可同時量失重，避免用犧牲水分換取冷卻速度。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：候選菜、單一作物全流程、條件與品質驗證。\n\n- **候選菜**\n- **單一作物全流程**\n- **條件與品質驗證**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把清洗消毒寫成可以保證完全無菌。\n- 把預冷寫成單純放進冰箱，沒有交代移除田間熱。\n 95 蔬菜學"},{"id":"蔬菜學-95-四","s":"蔬菜學","y":95,"n":"四","t":"自交不親和機制與應用","body":"<h2>第四題｜自交不親和機制與應用（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>自交不親和機制與應用<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=37\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>花粉與雌蕊都具功能，但 S 位點等遺傳辨識阻止相同不親和型受精；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>F1 一致性來自親本與受控交配<\/strong><\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<p><strong>制種須阻止不需要的授粉<\/strong><\/p>\n<p>去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。<\/p>\n<p><strong>F2 分離是留種限制的主因<\/strong><\/p>\n<p>F1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>花粉與雌蕊都具功能，但 S 位點等遺傳辨識阻止相同不親和型受精；<\/p>\n<p>配子體型多由花粉本身單倍體型決定、常在花柱抑花粉管，孢子體型由父本二倍體型決定、常在柱頭辨識。十字花科可用相容親本互交產 F1，母本不易自交，提高製種效率；<\/p>\n<p>親本維持需蕾授粉等克服。<\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<p>去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>西瓜 F1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 F1 果實留種所得下一代，不能保證維持原果形與整齊性。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：定義、兩機制、S 型與製種維持。<\/p>\n<ul>\n<li><strong>兩機制<\/strong><\/li>\n<li><strong>S 型與製種維持<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>寫成 F1 種子完全不能發芽。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=37","md":"95年蔬菜學_逐題教學詳解.md","search":"自交不親和機制與應用 ## 第四題｜自交不親和機制與應用（15 分）\n\n### 題意與作答範圍\n\n本題重點：**自交不親和機制與應用**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=37)。\n\n### 先掌握答案\n\n花粉與雌蕊都具功能，但 s 位點等遺傳辨識阻止相同不親和型受精；\n\n### 原理拆解：為什麼會這樣？\n\n**f1 一致性來自親本與受控交配**\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n**制種須阻止不需要的授粉**\n\n去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。\n\n**f2 分離是留種限制的主因**\n\nf1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。\n\n### 可直接練寫的完整答案\n\n花粉與雌蕊都具功能，但 s 位點等遺傳辨識阻止相同不親和型受精；\n\n配子體型多由花粉本身單倍體型決定、常在花柱抑花粉管，孢子體型由父本二倍體型決定、常在柱頭辨識。十字花科可用相容親本互交產 f1，母本不易自交，提高製種效率；\n\n親本維持需蕾授粉等克服。\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。\n\n### 實例：把原理用在情境中\n\n西瓜 f1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 f1 果實留種所得下一代，不能保證維持原果形與整齊性。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：定義、兩機制、s 型與製種維持。\n\n- **兩機制**\n- **s 型與製種維持**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 寫成 f1 種子完全不能發芽。\n 95 蔬菜學"},{"id":"蔬菜學-95-五","s":"蔬菜學","y":95,"n":"五","t":"五名詞","body":"<h2>第五題｜五名詞（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=37\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Blanching culture 軟白栽培，如白蘆筍培土遮光；<\/p>\n<p>monoecious 雌雄同株異花，如多數西瓜；<\/p>\n<p>seed priming 種子引發，控吸水啟代謝不出根；<\/p>\n<p>fertigation 灌溉施肥；<\/p>\n<p>inbred line 自交系，多代自交選拔相對純合，供 F1 親本但仍需保持純度。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>發芽率、活力與壽命要分開<\/strong><\/p>\n<p>發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。<\/p>\n<p><strong>劣化涉及膜與修復能力<\/strong><\/p>\n<p>貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。<\/p>\n<p><strong>保存與檢測依種子特性選擇<\/strong><\/p>\n<p>耐乾燥的正貯型種子通常可適度乾燥、低溫與防潮保存；不耐乾燥的種子不能照抄同法。發芽試驗、加速老化、導電度或低溫試驗各反映不同面向，須選適合作物的條件與標準。<\/p>\n<p><strong>F1 一致性來自親本與受控交配<\/strong><\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<p><strong>制種須阻止不需要的授粉<\/strong><\/p>\n<p>去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。<\/p>\n<p><strong>F2 分離是留種限制的主因<\/strong><\/p>\n<p>F1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>monoecious 雌雄同株異花，如多數西瓜；<\/td>\n<td>電導度反映可溶鹽類總量的相關指標，不能單獨判定是哪一元素缺乏或過量。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Blanching culture 軟白栽培，如白蘆筍培土遮光；<\/p>\n<p>monoecious 雌雄同株異花，如多數西瓜；<\/p>\n<p>seed priming 種子引發，控吸水啟代謝不出根；<\/p>\n<p>fertigation 灌溉施肥；<\/p>\n<p>inbred line 自交系，多代自交選拔相對純合，供 F1 親本但仍需保持純度。<\/p>\n<p>發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>蔥種子貯藏後即使標準發芽率尚可，活力降低也可能使育苗出苗不整；先做活力或小規模出苗比較，比直接增加播種密度更能掌握苗數。<\/p>\n<p>西瓜 F1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 F1 果實留種所得下一代，不能保證維持原果形與整齊性。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：各 3 分，定義、區別與例。<\/p>\n<ul>\n<li><strong>各 3 分，定義<\/strong><\/li>\n<li><strong>區別與例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有未發芽種子都判為死亡，漏掉休眠。<\/li>\n<li>寫成 F1 種子完全不能發芽。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=37","md":"95年蔬菜學_逐題教學詳解.md","search":"五名詞 ## 第五題｜五名詞（15 分）\n\n### 題意與作答範圍\n\n本題重點：**五名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=37)。\n\n### 先掌握答案\n\nblanching culture 軟白栽培，如白蘆筍培土遮光；\n\nmonoecious 雌雄同株異花，如多數西瓜；\n\nseed priming 種子引發，控吸水啟代謝不出根；\n\nfertigation 灌溉施肥；\n\ninbred line 自交系，多代自交選拔相對純合，供 f1 親本但仍需保持純度。\n\n### 原理拆解：為什麼會這樣？\n\n**發芽率、活力與壽命要分開**\n\n發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。\n\n**劣化涉及膜與修復能力**\n\n貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。\n\n**保存與檢測依種子特性選擇**\n\n耐乾燥的正貯型種子通常可適度乾燥、低溫與防潮保存；不耐乾燥的種子不能照抄同法。發芽試驗、加速老化、導電度或低溫試驗各反映不同面向，須選適合作物的條件與標準。\n\n**f1 一致性來自親本與受控交配**\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n**制種須阻止不需要的授粉**\n\n去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。\n\n**f2 分離是留種限制的主因**\n\nf1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| monoecious 雌雄同株異花，如多數西瓜； | 電導度反映可溶鹽類總量的相關指標，不能單獨判定是哪一元素缺乏或過量。 |\n\n### 可直接練寫的完整答案\n\nblanching culture 軟白栽培，如白蘆筍培土遮光；\n\nmonoecious 雌雄同株異花，如多數西瓜；\n\nseed priming 種子引發，控吸水啟代謝不出根；\n\nfertigation 灌溉施肥；\n\ninbred line 自交系，多代自交選拔相對純合，供 f1 親本但仍需保持純度。\n\n發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。\n\n### 實例：把原理用在情境中\n\n蔥種子貯藏後即使標準發芽率尚可，活力降低也可能使育苗出苗不整；先做活力或小規模出苗比較，比直接增加播種密度更能掌握苗數。\n\n西瓜 f1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 f1 果實留種所得下一代，不能保證維持原果形與整齊性。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：各 3 分，定義、區別與例。\n\n- **各 3 分，定義**\n- **區別與例**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有未發芽種子都判為死亡，漏掉休眠。\n- 寫成 f1 種子完全不能發芽。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 95 蔬菜學"},{"id":"蔬菜學-95-六","s":"蔬菜學","y":95,"n":"六","t":"健康苗與蒜薯體系","body":"<h2>第六題｜健康苗與蒜薯體系（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>健康苗與蒜薯體系<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=37\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>健康苗是符合指定病原健康與品質標準的材料，不能單由外觀判。大蒜與馬鈴薯易無性累積病毒，應選優母本、莖頂培養／療法、病毒檢測，隔離生產小球或微型薯，再分代擴繁並去病、控媒介及定期複檢，保留來源與批次。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>健康與整齊度要從母本或種子源開始<\/strong><\/p>\n<p>母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。<\/p>\n<p><strong>育苗目標是可定植且恢復快<\/strong><\/p>\n<p>適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。<\/p>\n<p><strong>無菌培養後仍有馴化關卡<\/strong><\/p>\n<p>瓶內高濕、低光與外加糖可使幼苗角質層、氣孔及根功能與田間不同。出瓶須逐步調整光濕條件並防感染。組培倍率、出瓶存活率與成品率應分開計算，不能只用增殖數宣稱生產效率。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>健康苗是符合指定病原健康與品質標準的材料，不能單由外觀判。大蒜與馬鈴薯易無性累積病毒，應選優母本、莖頂培養／療法、病毒檢測，隔離生產小球或微型薯，再分代擴繁並去病、控媒介及定期複檢，保留來源與批次。<\/p>\n<p>母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。<\/p>\n<p>適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>蝴蝶蘭分生苗可用組織培養大量增殖，但需檢測母株病毒並控制培養代數；出瓶後先馴化，再依葉片與根系生長分級，不宜把瓶苗數直接當成上市盆花數。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：定義、兩作物脫毒—小球／薯—擴繁、檢測隔離。<\/p>\n<ul>\n<li><strong>兩作物脫毒—小球／薯—擴繁<\/strong><\/li>\n<li><strong>檢測隔離<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將組織培養視為自動消除所有病原。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=37","md":"95年蔬菜學_逐題教學詳解.md","search":"健康苗與蒜薯體系 ## 第六題｜健康苗與蒜薯體系（15 分）\n\n### 題意與作答範圍\n\n本題重點：**健康苗與蒜薯體系**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=37)。\n\n### 先掌握答案\n\n健康苗是符合指定病原健康與品質標準的材料，不能單由外觀判。大蒜與馬鈴薯易無性累積病毒，應選優母本、莖頂培養／療法、病毒檢測，隔離生產小球或微型薯，再分代擴繁並去病、控媒介及定期複檢，保留來源與批次。\n\n### 原理拆解：為什麼會這樣？\n\n**健康與整齊度要從母本或種子源開始**\n\n母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。\n\n**育苗目標是可定植且恢復快**\n\n適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。\n\n**無菌培養後仍有馴化關卡**\n\n瓶內高濕、低光與外加糖可使幼苗角質層、氣孔及根功能與田間不同。出瓶須逐步調整光濕條件並防感染。組培倍率、出瓶存活率與成品率應分開計算，不能只用增殖數宣稱生產效率。\n\n### 可直接練寫的完整答案\n\n健康苗是符合指定病原健康與品質標準的材料，不能單由外觀判。大蒜與馬鈴薯易無性累積病毒，應選優母本、莖頂培養／療法、病毒檢測，隔離生產小球或微型薯，再分代擴繁並去病、控媒介及定期複檢，保留來源與批次。\n\n母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。\n\n適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。\n\n### 實例：把原理用在情境中\n\n蝴蝶蘭分生苗可用組織培養大量增殖，但需檢測母株病毒並控制培養代數；出瓶後先馴化，再依葉片與根系生長分級，不宜把瓶苗數直接當成上市盆花數。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：定義、兩作物脫毒—小球／薯—擴繁、檢測隔離。\n\n- **兩作物脫毒—小球／薯—擴繁**\n- **檢測隔離**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將組織培養視為自動消除所有病原。\n 95 蔬菜學"},{"id":"蔬菜學-95-七","s":"蔬菜學","y":95,"n":"七","t":"生物技術蔬菜英文翻譯","body":"<h2>第七題｜生物技術蔬菜英文翻譯（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>生物技術蔬菜英文翻譯<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=37\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。<\/p>\n<h3>完整參考譯文<\/h3>\n<p>多種生物與非生物逆境嚴重影響蔬菜產量和品質，進而使許多國家農村經濟不穩；<\/p>\n<p>缺適當採後貯藏與加工設施亦導致質量損失。過去四十年傳統育種已大幅改善產量、品質、採後壽命與耐逆，但仍有許多限制需現代生物學突破。過去十年，抗生物逆境、品質及貯藏壽命等性狀已成功導入蔬菜，有些並已商品化。雖轉殖菜商品化相對緩慢，供營養保健與製藥用途的轉殖蔬菜，將在未來對附加價值農業做重要貢獻。<\/p>\n<h3>讀懂這段研究在說什麼<\/h3>\n<p><strong>傳統育種成就與新技術需求相互承接<\/strong><\/p>\n<p>前段說明逆境與採後設施不足造成損失，後段先承認傳統育種進步，再提出尚待突破的限制。應保留「仍有」等轉折，不能譯成傳統方法完全無效。品質損失與數量損失亦不同，農村經濟影響是結果層次，不能反過來當成生理成因。<\/p>\n<h3>專業詞彙與翻譯辨析<\/h3>\n<table>\n<thead>\n<tr>\n<th>英文用語<\/th>\n<th>建議譯法<\/th>\n<th>讀法與限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>stress<\/td>\n<td>逆境<\/td>\n<td>不利生長條件，依文意分生物或非生物<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>配分重點與檢查順序<\/h3>\n<p>10 分：逆境與採後、傳統貢獻限制、導入性狀、商品化及原文前景。<\/p>\n<p>先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。<\/p>\n<h3>常見失分<\/h3>\n<ul>\n<li>把專業名詞按一般字義翻譯，或把相關性改成因果。<\/li>\n<li>省略轉折、條件或限制，使研究結論比原文更強。<\/li>\n<li>以摘要取代全文翻譯。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=37","md":"95年蔬菜學_逐題教學詳解.md","search":"生物技術蔬菜英文翻譯 ## 第七題｜生物技術蔬菜英文翻譯（10 分）\n\n### 題意與作答範圍\n\n本題重點：**生物技術蔬菜英文翻譯**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=37)。\n\n### 先掌握答案\n\n這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。\n\n### 完整參考譯文\n\n多種生物與非生物逆境嚴重影響蔬菜產量和品質，進而使許多國家農村經濟不穩；\n\n缺適當採後貯藏與加工設施亦導致質量損失。過去四十年傳統育種已大幅改善產量、品質、採後壽命與耐逆，但仍有許多限制需現代生物學突破。過去十年，抗生物逆境、品質及貯藏壽命等性狀已成功導入蔬菜，有些並已商品化。雖轉殖菜商品化相對緩慢，供營養保健與製藥用途的轉殖蔬菜，將在未來對附加價值農業做重要貢獻。\n\n### 讀懂這段研究在說什麼\n\n**傳統育種成就與新技術需求相互承接**\n\n前段說明逆境與採後設施不足造成損失，後段先承認傳統育種進步，再提出尚待突破的限制。應保留「仍有」等轉折，不能譯成傳統方法完全無效。品質損失與數量損失亦不同，農村經濟影響是結果層次，不能反過來當成生理成因。\n\n### 專業詞彙與翻譯辨析\n\n| 英文用語 | 建議譯法 | 讀法與限制 |\n| --- | --- | --- |\n| stress | 逆境 | 不利生長條件，依文意分生物或非生物 |\n\n### 配分重點與檢查順序\n\n10 分：逆境與採後、傳統貢獻限制、導入性狀、商品化及原文前景。\n\n先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。\n\n### 常見失分\n\n- 把專業名詞按一般字義翻譯，或把相關性改成因果。\n- 省略轉折、條件或限制，使研究結論比原文更強。\n- 以摘要取代全文翻譯。\n 95 蔬菜學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
