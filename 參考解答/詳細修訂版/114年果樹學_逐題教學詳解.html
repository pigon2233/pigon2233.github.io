ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 9 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"果樹學-114-一","s":"果樹學","y":114,"n":"一","t":"文旦 RDI","body":"<h2>第一題｜文旦 RDI（25 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>文旦 RDI<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>調節性限制灌溉是依生育期與水分敏感度，將供水在特定階段控制於充分灌溉以下，避免不可逆傷害並達節水、控梢或改善品質。麻豆文旦以果實膨大已趨緩、採前約一個月適度減水較合理；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>RDI 的核心是選期與可控制<\/strong><\/p>\n<p>調節性限制灌溉不是隨意少澆水，而是依發育階段對缺水敏感度不同，刻意在較可容忍階段降低供水，並設定監測及補水門檻。成功指標應同時看節水、產量、果徑、品質和下一期樹勢。<\/p>\n<p><strong>為何輕度缺水可能有利<\/strong><\/p>\n<p>細胞擴張對膨壓降低較敏感，常早於嚴重光合下降而受抑。輕度限灌因此可能減少徒長和果實水分稀釋，配合滲透調節改變溶質濃度。但糖度是濃度，糖度上升不一定代表每果糖總量增加。<\/p>\n<p><strong>文旦如何選階段<\/strong><\/p>\n<p>花期、幼果與快速膨大期缺水容易影響著果、細胞生長及果重；膨大已趨緩的採前成熟階段，才較適合評估限灌。須合併雨量、土壤、根深、負載與水勢監測，若葉片持續失水、落葉或光合受重損，就已超出改善品質的合理範圍。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>輕度水分虧缺抑制細胞膨大及徒長、降低稀釋並促進滲透調節與糖的累積；<\/p>\n<p>過度乾旱反使氣孔關閉、光合下降、果小落果。不能把「糖度上升」全部等同糖總量增加。<a href=\"https://kmweb.moa.gov.tw/subject/subject.php?id=6264\">文旦水分管理<\/a><\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>調節性限制灌溉是依生育期與水分敏感度，將供水在特定階段控制於充分灌溉以下，避免不可逆傷害並達節水、控梢或改善品質。麻豆文旦以果實膨大已趨緩、採前約一個月適度減水較合理；<\/p>\n<p>花期、幼果及 6–7 月快速膨大期應維持供水。利用滴灌減量、避雨或地表覆蓋限制雨水入土，搭配土壤含水量、葉／莖水勢、果徑與樹勢監測；<\/p>\n<p>達過度萎凋門檻即補灌。<\/p>\n<p>調節性限制灌溉不是隨意少澆水，而是依發育階段對缺水敏感度不同，刻意在較可容忍階段降低供水，並設定監測及補水門檻。成功指標應同時看節水、產量、果徑、品質和下一期樹勢。<\/p>\n<p>細胞擴張對膨壓降低較敏感，常早於嚴重光合下降而受抑。輕度限灌因此可能減少徒長和果實水分稀釋，配合滲透調節改變溶質濃度。但糖度是濃度，糖度上升不一定代表每果糖總量增加。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>可比較充分灌溉與採前適度限灌的果實糖度、果重、汁率及單果糖量。若只有糖度較高而果重、汁率明顯下降，便不能直接宣稱總品質與收益皆改善。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>25 分：定義、採前選期、糖度機制、限灌操作、監測及補灌門檻。<\/p>\n<ul>\n<li><strong>採前選期<\/strong><\/li>\n<li><strong>糖度機制<\/strong><\/li>\n<li><strong>限灌操作<\/strong><\/li>\n<li><strong>監測及補灌門檻<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>不管生育期一律斷水。<\/li>\n<\/ul>","source":"../../A114.pdf#page=2","md":"114年果樹學_逐題教學詳解.md","search":"文旦 rdi ## 第一題｜文旦 rdi（25 分）\n\n### 題意與作答範圍\n\n本題重點：**文旦 rdi**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a114.pdf#page=2)。\n\n### 先掌握答案\n\n調節性限制灌溉是依生育期與水分敏感度，將供水在特定階段控制於充分灌溉以下，避免不可逆傷害並達節水、控梢或改善品質。麻豆文旦以果實膨大已趨緩、採前約一個月適度減水較合理；\n\n### 原理拆解：為什麼會這樣？\n\n**rdi 的核心是選期與可控制**\n\n調節性限制灌溉不是隨意少澆水，而是依發育階段對缺水敏感度不同，刻意在較可容忍階段降低供水，並設定監測及補水門檻。成功指標應同時看節水、產量、果徑、品質和下一期樹勢。\n\n**為何輕度缺水可能有利**\n\n細胞擴張對膨壓降低較敏感，常早於嚴重光合下降而受抑。輕度限灌因此可能減少徒長和果實水分稀釋，配合滲透調節改變溶質濃度。但糖度是濃度，糖度上升不一定代表每果糖總量增加。\n\n**文旦如何選階段**\n\n花期、幼果與快速膨大期缺水容易影響著果、細胞生長及果重；膨大已趨緩的採前成熟階段，才較適合評估限灌。須合併雨量、土壤、根深、負載與水勢監測，若葉片持續失水、落葉或光合受重損，就已超出改善品質的合理範圍。\n\n### 這題要特別注意\n\n輕度水分虧缺抑制細胞膨大及徒長、降低稀釋並促進滲透調節與糖的累積；\n\n過度乾旱反使氣孔關閉、光合下降、果小落果。不能把「糖度上升」全部等同糖總量增加。[文旦水分管理](https://kmweb.moa.gov.tw/subject/subject.php?id=6264)\n\n### 可直接練寫的完整答案\n\n調節性限制灌溉是依生育期與水分敏感度，將供水在特定階段控制於充分灌溉以下，避免不可逆傷害並達節水、控梢或改善品質。麻豆文旦以果實膨大已趨緩、採前約一個月適度減水較合理；\n\n花期、幼果及 6–7 月快速膨大期應維持供水。利用滴灌減量、避雨或地表覆蓋限制雨水入土，搭配土壤含水量、葉／莖水勢、果徑與樹勢監測；\n\n達過度萎凋門檻即補灌。\n\n調節性限制灌溉不是隨意少澆水，而是依發育階段對缺水敏感度不同，刻意在較可容忍階段降低供水，並設定監測及補水門檻。成功指標應同時看節水、產量、果徑、品質和下一期樹勢。\n\n細胞擴張對膨壓降低較敏感，常早於嚴重光合下降而受抑。輕度限灌因此可能減少徒長和果實水分稀釋，配合滲透調節改變溶質濃度。但糖度是濃度，糖度上升不一定代表每果糖總量增加。\n\n### 實例：把原理用在情境中\n\n可比較充分灌溉與採前適度限灌的果實糖度、果重、汁率及單果糖量。若只有糖度較高而果重、汁率明顯下降，便不能直接宣稱總品質與收益皆改善。\n\n### 配分重點：哪些內容不能漏？\n\n25 分：定義、採前選期、糖度機制、限灌操作、監測及補灌門檻。\n\n- **採前選期**\n- **糖度機制**\n- **限灌操作**\n- **監測及補灌門檻**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 不管生育期一律斷水。\n 114 果樹學"},{"id":"果樹學-114-二","s":"果樹學","y":114,"n":"二","t":"蘋果、鳳梨採收成熟度各三指標","body":"<h2>第二題｜蘋果、鳳梨採收成熟度各三指標（6 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>蘋果、鳳梨採收成熟度各三指標<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>蘋果：澱粉碘染指數、果肉硬度、底色（可另配可溶性固形物與酸度）。鳳梨：果皮／果目轉色、果肉可溶性固形物、糖酸比／可滴定酸度（亦配開花後日數）。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>生理成熟與食用成熟不同<\/strong><\/p>\n<p>生理成熟表示已達一定發育能力，食用成熟則符合風味、質地與用途；商業成熟還須考量運輸與客戶規格。更年性果實可能在適當生理成熟階段採後後熟，非更年性果實通常更依賴樹上累積品質。<\/p>\n<p><strong>用多指標降低誤判<\/strong><\/p>\n<p>外觀轉色受光與溫度影響，硬度受品種與水分影響，糖度也不是全部風味。澱粉指數、乾物率、可溶性固形物、酸度、底色及開花後日數等須依作物選用並互相校核。<\/p>\n<p><strong>採得早不必然更耐運且更好<\/strong><\/p>\n<p>過早採可能糖不足、無法正常軟化或風味差；過晚則易軟傷與腐敗。應依預計貯運時間設成熟範圍，配合溫度與包裝，不能用冷藏補回採收前未形成的糖與風味。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>成熟度需多指標合判，外觀或固定天數易受品種、溫度與栽培影響。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>蘋果：澱粉碘染指數、果肉硬度、底色（可另配可溶性固形物與酸度）。鳳梨：果皮／果目轉色、果肉可溶性固形物、糖酸比／可滴定酸度（亦配開花後日數）。<\/p>\n<p>生理成熟表示已達一定發育能力，食用成熟則符合風味、質地與用途；商業成熟還須考量運輸與客戶規格。更年性果實可能在適當生理成熟階段採後後熟，非更年性果實通常更依賴樹上累積品質。<\/p>\n<p>外觀轉色受光與溫度影響，硬度受品種與水分影響，糖度也不是全部風味。澱粉指數、乾物率、可溶性固形物、酸度、底色及開花後日數等須依作物選用並互相校核。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>蘋果可用澱粉碘染、硬度與底色交叉判斷；鳳梨則需配合果肉糖酸與轉色，不能因外皮黃便推定所有果目和果肉成熟度相同。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>6 分：兩果各三指標，指標須可測且不可只列固定日期。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將採後可以軟化解釋成採得再早也能形成好風味。<\/li>\n<\/ul>","source":"../../A114.pdf#page=2","md":"114年果樹學_逐題教學詳解.md","search":"蘋果、鳳梨採收成熟度各三指標 ## 第二題｜蘋果、鳳梨採收成熟度各三指標（6 分）\n\n### 題意與作答範圍\n\n本題重點：**蘋果、鳳梨採收成熟度各三指標**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a114.pdf#page=2)。\n\n### 先掌握答案\n\n蘋果：澱粉碘染指數、果肉硬度、底色（可另配可溶性固形物與酸度）。鳳梨：果皮／果目轉色、果肉可溶性固形物、糖酸比／可滴定酸度（亦配開花後日數）。\n\n### 原理拆解：為什麼會這樣？\n\n**生理成熟與食用成熟不同**\n\n生理成熟表示已達一定發育能力，食用成熟則符合風味、質地與用途；商業成熟還須考量運輸與客戶規格。更年性果實可能在適當生理成熟階段採後後熟，非更年性果實通常更依賴樹上累積品質。\n\n**用多指標降低誤判**\n\n外觀轉色受光與溫度影響，硬度受品種與水分影響，糖度也不是全部風味。澱粉指數、乾物率、可溶性固形物、酸度、底色及開花後日數等須依作物選用並互相校核。\n\n**採得早不必然更耐運且更好**\n\n過早採可能糖不足、無法正常軟化或風味差；過晚則易軟傷與腐敗。應依預計貯運時間設成熟範圍，配合溫度與包裝，不能用冷藏補回採收前未形成的糖與風味。\n\n### 這題要特別注意\n\n成熟度需多指標合判，外觀或固定天數易受品種、溫度與栽培影響。\n\n### 可直接練寫的完整答案\n\n蘋果：澱粉碘染指數、果肉硬度、底色（可另配可溶性固形物與酸度）。鳳梨：果皮／果目轉色、果肉可溶性固形物、糖酸比／可滴定酸度（亦配開花後日數）。\n\n生理成熟表示已達一定發育能力，食用成熟則符合風味、質地與用途；商業成熟還須考量運輸與客戶規格。更年性果實可能在適當生理成熟階段採後後熟，非更年性果實通常更依賴樹上累積品質。\n\n外觀轉色受光與溫度影響，硬度受品種與水分影響，糖度也不是全部風味。澱粉指數、乾物率、可溶性固形物、酸度、底色及開花後日數等須依作物選用並互相校核。\n\n### 實例：把原理用在情境中\n\n蘋果可用澱粉碘染、硬度與底色交叉判斷；鳳梨則需配合果肉糖酸與轉色，不能因外皮黃便推定所有果目和果肉成熟度相同。\n\n### 配分重點：哪些內容不能漏？\n\n6 分：兩果各三指標，指標須可測且不可只列固定日期。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將採後可以軟化解釋成採得再早也能形成好風味。\n 114 果樹學"},{"id":"果樹學-114-三","s":"果樹學","y":114,"n":"三","t":"不能在樹上正常後熟的果實","body":"<h2>第三題｜不能在樹上正常後熟的果實（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>不能在樹上正常後熟的果實<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>酪梨為典型例，另有部分梨需採後條件才適合後熟。酪梨留樹時可持續發育達生理成熟，採離後才啟動正常軟化；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>成熟反應與乙烯感受<\/strong><\/p>\n<p>乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。<\/p>\n<p><strong>更年性與非更年性要比較反應型態<\/strong><\/p>\n<p>具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。<\/p>\n<p><strong>催熟與延後成熟都不能忽略品質<\/strong><\/p>\n<p>乙烯可整齊催熟已達生理成熟的果，卻不能讓極幼果補足田間累積不足的乾物；1-MCP 阻斷感受可延緩部分產品老化，但過強處理可能影響正常後熟。脫綠、果肉軟化和增甜亦不是必然同步。<\/p>\n<p><strong>生理成熟與食用成熟不同<\/strong><\/p>\n<p>生理成熟表示已達一定發育能力，食用成熟則符合風味、質地與用途；商業成熟還須考量運輸與客戶規格。更年性果實可能在適當生理成熟階段採後後熟，非更年性果實通常更依賴樹上累積品質。<\/p>\n<p><strong>用多指標降低誤判<\/strong><\/p>\n<p>外觀轉色受光與溫度影響，硬度受品種與水分影響，糖度也不是全部風味。澱粉指數、乾物率、可溶性固形物、酸度、底色及開花後日數等須依作物選用並互相校核。<\/p>\n<p><strong>採得早不必然更耐運且更好<\/strong><\/p>\n<p>過早採可能糖不足、無法正常軟化或風味差；過晚則易軟傷與腐敗。應依預計貯運時間設成熟範圍，配合溫度與包裝，不能用冷藏補回採收前未形成的糖與風味。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>題目要求荷爾蒙觀點，宜寫「可能機制」，不把尚未完全釐清的抑制訊號武斷指定為單一 IAA 或 ABA。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>酪梨為典型例，另有部分梨需採後條件才適合後熟。酪梨留樹時可持續發育達生理成熟，採離後才啟動正常軟化；<\/p>\n<p>可能與母樹輸入的抑熟訊號及乙烯生合成／反應受抑有關，採離解除抑制後，自催化乙烯及細胞壁分解系統啟動。<\/p>\n<p>乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。<\/p>\n<p>具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>香蕉在不當高溫下，果肉可軟化而果皮仍綠，顯示果肉成熟與葉綠素降解可不同步。不能僅看果皮未黃，就判斷乙烯完全沒有作用。<\/p>\n<p>蘋果可用澱粉碘染、硬度與底色交叉判斷；鳳梨則需配合果肉糖酸與轉色，不能因外皮黃便推定所有果目和果肉成熟度相同。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：具名果實 2、可能激素機制 8，成熟與後熟區分、未定論不武斷。<\/p>\n<ul>\n<li><strong>具名果實 2<\/strong><\/li>\n<li><strong>可能激素機制 8，成熟與後熟區分<\/strong><\/li>\n<li><strong>未定論不武斷<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>說非更年性果實完全不會回應乙烯。<\/li>\n<li>將採後可以軟化解釋成採得再早也能形成好風味。<\/li>\n<\/ul>","source":"../../A114.pdf#page=2","md":"114年果樹學_逐題教學詳解.md","search":"不能在樹上正常後熟的果實 ## 第三題｜不能在樹上正常後熟的果實（10 分）\n\n### 題意與作答範圍\n\n本題重點：**不能在樹上正常後熟的果實**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a114.pdf#page=2)。\n\n### 先掌握答案\n\n酪梨為典型例，另有部分梨需採後條件才適合後熟。酪梨留樹時可持續發育達生理成熟，採離後才啟動正常軟化；\n\n### 原理拆解：為什麼會這樣？\n\n**成熟反應與乙烯感受**\n\n乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。\n\n**更年性與非更年性要比較反應型態**\n\n具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。\n\n**催熟與延後成熟都不能忽略品質**\n\n乙烯可整齊催熟已達生理成熟的果，卻不能讓極幼果補足田間累積不足的乾物；1-mcp 阻斷感受可延緩部分產品老化，但過強處理可能影響正常後熟。脫綠、果肉軟化和增甜亦不是必然同步。\n\n**生理成熟與食用成熟不同**\n\n生理成熟表示已達一定發育能力，食用成熟則符合風味、質地與用途；商業成熟還須考量運輸與客戶規格。更年性果實可能在適當生理成熟階段採後後熟，非更年性果實通常更依賴樹上累積品質。\n\n**用多指標降低誤判**\n\n外觀轉色受光與溫度影響，硬度受品種與水分影響，糖度也不是全部風味。澱粉指數、乾物率、可溶性固形物、酸度、底色及開花後日數等須依作物選用並互相校核。\n\n**採得早不必然更耐運且更好**\n\n過早採可能糖不足、無法正常軟化或風味差；過晚則易軟傷與腐敗。應依預計貯運時間設成熟範圍，配合溫度與包裝，不能用冷藏補回採收前未形成的糖與風味。\n\n### 這題要特別注意\n\n題目要求荷爾蒙觀點，宜寫「可能機制」，不把尚未完全釐清的抑制訊號武斷指定為單一 iaa 或 aba。\n\n### 可直接練寫的完整答案\n\n酪梨為典型例，另有部分梨需採後條件才適合後熟。酪梨留樹時可持續發育達生理成熟，採離後才啟動正常軟化；\n\n可能與母樹輸入的抑熟訊號及乙烯生合成／反應受抑有關，採離解除抑制後，自催化乙烯及細胞壁分解系統啟動。\n\n乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。\n\n具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。\n\n### 實例：把原理用在情境中\n\n香蕉在不當高溫下，果肉可軟化而果皮仍綠，顯示果肉成熟與葉綠素降解可不同步。不能僅看果皮未黃，就判斷乙烯完全沒有作用。\n\n蘋果可用澱粉碘染、硬度與底色交叉判斷；鳳梨則需配合果肉糖酸與轉色，不能因外皮黃便推定所有果目和果肉成熟度相同。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：具名果實 2、可能激素機制 8，成熟與後熟區分、未定論不武斷。\n\n- **具名果實 2**\n- **可能激素機制 8，成熟與後熟區分**\n- **未定論不武斷**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 說非更年性果實完全不會回應乙烯。\n- 將採後可以軟化解釋成採得再早也能形成好風味。\n 114 果樹學"},{"id":"果樹學-114-四","s":"果樹學","y":114,"n":"四","t":"採收機械傷防治：人、事、物","body":"<h2>第四題｜採收機械傷防治：人、事、物（9 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>採收機械傷防治：人、事、物<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>人：訓練適熟判斷、輕拿輕放、不拋擲、剪短指甲。事：避高溫與雨後採收，縮短搬運路線、限制堆疊與落差，及時遮蔭預冷。物：使用平滑、清潔、有緩衝的採收袋與箱，剪具鋒利，輸送設備降低撞擊，包裝固定果實並維持通風。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>為何採後仍會變差<\/strong><\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p><strong>低溫有效，但有適用範圍<\/strong><\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<p><strong>把全程串起來<\/strong><\/p>\n<p>採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>傷害可在採後因細胞破裂、氧化與病原侵入才顯現，不能只以採收當下有無破皮判斷。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>人：訓練適熟判斷、輕拿輕放、不拋擲、剪短指甲。事：避高溫與雨後採收，縮短搬運路線、限制堆疊與落差，及時遮蔭預冷。物：使用平滑、清潔、有緩衝的採收袋與箱，剪具鋒利，輸送設備降低撞擊，包裝固定果實並維持通風。<\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>9 分：人、事、物三面各有具體操作與機械傷機制。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>認為溫度越低、保存效果一定越好。<\/li>\n<\/ul>","source":"../../A114.pdf#page=2","md":"114年果樹學_逐題教學詳解.md","search":"採收機械傷防治：人、事、物 ## 第四題｜採收機械傷防治：人、事、物（9 分）\n\n### 題意與作答範圍\n\n本題重點：**採收機械傷防治：人、事、物**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a114.pdf#page=2)。\n\n### 先掌握答案\n\n人：訓練適熟判斷、輕拿輕放、不拋擲、剪短指甲。事：避高溫與雨後採收，縮短搬運路線、限制堆疊與落差，及時遮蔭預冷。物：使用平滑、清潔、有緩衝的採收袋與箱，剪具鋒利，輸送設備降低撞擊，包裝固定果實並維持通風。\n\n### 原理拆解：為什麼會這樣？\n\n**為何採後仍會變差**\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n**低溫有效，但有適用範圍**\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n**把全程串起來**\n\n採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。\n\n### 這題要特別注意\n\n傷害可在採後因細胞破裂、氧化與病原侵入才顯現，不能只以採收當下有無破皮判斷。\n\n### 可直接練寫的完整答案\n\n人：訓練適熟判斷、輕拿輕放、不拋擲、剪短指甲。事：避高溫與雨後採收，縮短搬運路線、限制堆疊與落差，及時遮蔭預冷。物：使用平滑、清潔、有緩衝的採收袋與箱，剪具鋒利，輸送設備降低撞擊，包裝固定果實並維持通風。\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n### 實例：把原理用在情境中\n\n驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。\n\n### 配分重點：哪些內容不能漏？\n\n9 分：人、事、物三面各有具體操作與機械傷機制。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 認為溫度越低、保存效果一定越好。\n 114 果樹學"},{"id":"果樹學-114-五","s":"果樹學","y":114,"n":"五","t":"子房下位","body":"<h2>第五題｜子房下位（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>子房下位<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>題列中為：<strong>番石榴、香蕉、枇杷、蓮霧<\/strong>。桃、酪梨、芒果、楊桃、荔枝為上位；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>子房位置要與花托、花筒關係一起看<\/strong><\/p>\n<p>子房下位指其他主要花器看似著生於子房上方，通常與花托或花筒包圍、癒合的構造相關。它是花部形態分類，不能由果實甜酸、果皮厚薄或單果多果判定。枇杷的食用肉主要有附屬花部組織參與，與桃的中果皮作對照，較容易連結形態與食用部位。<\/p>\n<p><strong>器官來源比外觀名稱更可靠<\/strong><\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<p><strong>不同分類軸不能混用<\/strong><\/p>\n<p>花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。<\/p>\n<p><strong>名稱與例子要一對一<\/strong><\/p>\n<p>寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>判準是萼、瓣、雄蕊相對於子房的著生位置；<\/p>\n<p>桃雖有杯狀花托，也不等於子房下位。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>題列中為：<strong>番石榴、香蕉、枇杷、蓮霧<\/strong>。桃、酪梨、芒果、楊桃、荔枝為上位；<\/p>\n<p>番木瓜亦為上位。<\/p>\n<p>子房下位指其他主要花器看似著生於子房上方，通常與花托或花筒包圍、癒合的構造相關。它是花部形態分類，不能由果實甜酸、果皮厚薄或單果多果判定。枇杷的食用肉主要有附屬花部組織參與，與桃的中果皮作對照，較容易連結形態與食用部位。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：逐項判子房位置，正確四種下位；花托杯不可混當下位。<\/p>\n<ul>\n<li><strong>逐項判子房位置，正確四種下位<\/strong><\/li>\n<li><strong>花托杯不可混當下位<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>看到地下器官就全部寫成根。<\/li>\n<\/ul>","source":"../../A114.pdf#page=2","md":"114年果樹學_逐題教學詳解.md","search":"子房下位 ## 第五題｜子房下位（10 分）\n\n### 題意與作答範圍\n\n本題重點：**子房下位**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a114.pdf#page=2)。\n\n### 先掌握答案\n\n題列中為：**番石榴、香蕉、枇杷、蓮霧**。桃、酪梨、芒果、楊桃、荔枝為上位；\n\n### 原理拆解：為什麼會這樣？\n\n**子房位置要與花托、花筒關係一起看**\n\n子房下位指其他主要花器看似著生於子房上方，通常與花托或花筒包圍、癒合的構造相關。它是花部形態分類，不能由果實甜酸、果皮厚薄或單果多果判定。枇杷的食用肉主要有附屬花部組織參與，與桃的中果皮作對照，較容易連結形態與食用部位。\n\n**器官來源比外觀名稱更可靠**\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n**不同分類軸不能混用**\n\n花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。\n\n**名稱與例子要一對一**\n\n寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。\n\n### 這題要特別注意\n\n判準是萼、瓣、雄蕊相對於子房的著生位置；\n\n桃雖有杯狀花托，也不等於子房下位。\n\n### 可直接練寫的完整答案\n\n題列中為：**番石榴、香蕉、枇杷、蓮霧**。桃、酪梨、芒果、楊桃、荔枝為上位；\n\n番木瓜亦為上位。\n\n子房下位指其他主要花器看似著生於子房上方，通常與花托或花筒包圍、癒合的構造相關。它是花部形態分類，不能由果實甜酸、果皮厚薄或單果多果判定。枇杷的食用肉主要有附屬花部組織參與，與桃的中果皮作對照，較容易連結形態與食用部位。\n\n### 實例：把原理用在情境中\n\n馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：逐項判子房位置，正確四種下位；花托杯不可混當下位。\n\n- **逐項判子房位置，正確四種下位**\n- **花托杯不可混當下位**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 看到地下器官就全部寫成根。\n 114 果樹學"},{"id":"果樹學-114-六","s":"果樹學","y":114,"n":"六","t":"雙 S 型生長曲線","body":"<h2>第六題｜雙 S 型生長曲線（8 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>雙 S 型生長曲線<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>題列典型為 <strong>桃、葡萄、咖啡<\/strong>。第一快速生長期、中央緩慢期、第二快速生長期構成雙 S；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>橫軸與縱軸先交代清楚<\/strong><\/p>\n<p>生長曲線常以開花或坐果後日數為橫軸，果徑、體積或鮮重為縱軸；不同指標可能出現不同轉折，不能用種子重量的變化直接代替果肉曲線。<\/p>\n<p><strong>雙 S 型有兩個快速期<\/strong><\/p>\n<p>第一期果皮、果肉細胞分裂及膨大較快；中期外觀膨大減緩，核果常伴果核硬化和種子發育；第三期果肉再快速膨大並走向成熟。葡萄的中期特徵不宜直接稱為木質果核硬化。<\/p>\n<p><strong>生育分期是管理依據<\/strong><\/p>\n<p>肥水、疏果及品質管理須看果實與種子處於哪個階段；中央慢生期不等於果實完全停止代謝。若比較不同作物，應以同一量測基準說明 S 型與雙 S 型。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>應看果實大小／鮮重對時間的曲線，不能把呼吸高峰當作生長曲線。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>題列典型為 <strong>桃、葡萄、咖啡<\/strong>。第一快速生長期、中央緩慢期、第二快速生長期構成雙 S；<\/p>\n<p>核果中間常對應硬核，葡萄對應轉色前的緩慢期，咖啡則與果實及種子發育階段有關。酪梨、蘋果、番木瓜、芒果、香蕉一般不列為本題典型雙 S。<\/p>\n<p>生長曲線常以開花或坐果後日數為橫軸，果徑、體積或鮮重為縱軸；不同指標可能出現不同轉折，不能用種子重量的變化直接代替果肉曲線。<\/p>\n<p>第一期果皮、果肉細胞分裂及膨大較快；中期外觀膨大減緩，核果常伴果核硬化和種子發育；第三期果肉再快速膨大並走向成熟。葡萄的中期特徵不宜直接稱為木質果核硬化。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>桃可用兩段快速膨大及其間硬核期說明雙 S 型；葡萄也常呈雙 S 型，但其生理轉折須以果粒與種子發育解釋，不能把桃的所有機制原封套用。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>8 分：典型桃、葡萄、咖啡與兩快速期／中央慢期，排除呼吸曲線混淆。<\/p>\n<ul>\n<li><strong>典型桃<\/strong><\/li>\n<li><strong>咖啡與兩快速期／中央慢期，排除呼吸曲線混淆<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把雙 S 畫成兩次果實重量下降。<\/li>\n<\/ul>","source":"../../A114.pdf#page=2","md":"114年果樹學_逐題教學詳解.md","search":"雙 s 型生長曲線 ## 第六題｜雙 s 型生長曲線（8 分）\n\n### 題意與作答範圍\n\n本題重點：**雙 s 型生長曲線**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a114.pdf#page=2)。\n\n### 先掌握答案\n\n題列典型為 **桃、葡萄、咖啡**。第一快速生長期、中央緩慢期、第二快速生長期構成雙 s；\n\n### 原理拆解：為什麼會這樣？\n\n**橫軸與縱軸先交代清楚**\n\n生長曲線常以開花或坐果後日數為橫軸，果徑、體積或鮮重為縱軸；不同指標可能出現不同轉折，不能用種子重量的變化直接代替果肉曲線。\n\n**雙 s 型有兩個快速期**\n\n第一期果皮、果肉細胞分裂及膨大較快；中期外觀膨大減緩，核果常伴果核硬化和種子發育；第三期果肉再快速膨大並走向成熟。葡萄的中期特徵不宜直接稱為木質果核硬化。\n\n**生育分期是管理依據**\n\n肥水、疏果及品質管理須看果實與種子處於哪個階段；中央慢生期不等於果實完全停止代謝。若比較不同作物，應以同一量測基準說明 s 型與雙 s 型。\n\n### 這題要特別注意\n\n應看果實大小／鮮重對時間的曲線，不能把呼吸高峰當作生長曲線。\n\n### 可直接練寫的完整答案\n\n題列典型為 **桃、葡萄、咖啡**。第一快速生長期、中央緩慢期、第二快速生長期構成雙 s；\n\n核果中間常對應硬核，葡萄對應轉色前的緩慢期，咖啡則與果實及種子發育階段有關。酪梨、蘋果、番木瓜、芒果、香蕉一般不列為本題典型雙 s。\n\n生長曲線常以開花或坐果後日數為橫軸，果徑、體積或鮮重為縱軸；不同指標可能出現不同轉折，不能用種子重量的變化直接代替果肉曲線。\n\n第一期果皮、果肉細胞分裂及膨大較快；中期外觀膨大減緩，核果常伴果核硬化和種子發育；第三期果肉再快速膨大並走向成熟。葡萄的中期特徵不宜直接稱為木質果核硬化。\n\n### 實例：把原理用在情境中\n\n桃可用兩段快速膨大及其間硬核期說明雙 s 型；葡萄也常呈雙 s 型，但其生理轉折須以果粒與種子發育解釋，不能把桃的所有機制原封套用。\n\n### 配分重點：哪些內容不能漏？\n\n8 分：典型桃、葡萄、咖啡與兩快速期／中央慢期，排除呼吸曲線混淆。\n\n- **典型桃**\n- **咖啡與兩快速期／中央慢期，排除呼吸曲線混淆**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把雙 s 畫成兩次果實重量下降。\n 114 果樹學"},{"id":"果樹學-114-七","s":"果樹學","y":114,"n":"七","t":"春季 3–5 月葡萄","body":"<h2>第七題｜春季 3–5 月葡萄（7 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>春季 3–5 月葡萄<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>利用溫室／塑膠布保溫、提早冬季修剪與萌芽，必要時依核准方法促進芽整齊萌發，使新梢與花序在冬季較暖微環境中生長；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>花序在新梢，結果能力卻與芽的過去有關<\/strong><\/p>\n<p>葡萄新梢由結果母枝上的芽萌發，芽內花序原基常已在之前的枝梢生長期間形成。修剪改變芽的萌發機會，因此產期安排要先確認枝條與芽成熟度，不能把修剪當成憑空製造花芽。<\/p>\n<p><strong>一年二收需要兩次完整資源循環<\/strong><\/p>\n<p>冬剪後萌芽開花取得第一期果；採後保健康葉、適量補水肥，恢復貯藏並培養下一期成熟枝，再夏剪萌芽取得第二期。若第一期負載過大或葉片早落，第二期即使萌芽也可能花弱、著果差或糖低。<\/p>\n<p><strong>促成與二收各有環境限制<\/strong><\/p>\n<p>春果促成靠保溫設施與提早萌芽，使低溫季仍能發育；冬果則要防秋冬光熱不足。兩者均需疏梢、整穗及葉果比管理，日期依品種、產區與設施倒推，不宜用一個月份表套全臺。<\/p>\n<p><strong>設施先改變能量與物質交換<\/strong><\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p><strong>各因子必須一起管理<\/strong><\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<p><strong>控制成效要用植株與環境資料驗證<\/strong><\/p>\n<p>以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>重點是促成栽培的溫度與萌芽時間，不是把一般夏果採早。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>利用溫室／塑膠布保溫、提早冬季修剪與萌芽，必要時依核准方法促進芽整齊萌發，使新梢與花序在冬季較暖微環境中生長；<\/p>\n<p>配合通風、夜間低溫防護、花果管理，提早到春季採收。<\/p>\n<p>葡萄新梢由結果母枝上的芽萌發，芽內花序原基常已在之前的枝梢生長期間形成。修剪改變芽的萌發機會，因此產期安排要先確認枝條與芽成熟度，不能把修剪當成憑空製造花芽。<\/p>\n<p>冬剪後萌芽開花取得第一期果；採後保健康葉、適量補水肥，恢復貯藏並培養下一期成熟枝，再夏剪萌芽取得第二期。若第一期負載過大或葉片早落，第二期即使萌芽也可能花弱、著果差或糖低。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一園連續兩期採滿量而不保留健康葉，短期總採收似多，卻可能使翌期枝條與花芽變差；合理負載應看跨季樹勢與商品果率。<\/p>\n<p>臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>7 分：保溫促成、提早修剪萌芽、適期花果與低溫管理。<\/p>\n<ul>\n<li><strong>保溫促成<\/strong><\/li>\n<li><strong>提早修剪萌芽<\/strong><\/li>\n<li><strong>適期花果與低溫管理<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>以為剪枝本身就使任何芽都能帶花。<\/li>\n<li>將溫室直接等同低溫環境。<\/li>\n<\/ul>","source":"../../A114.pdf#page=2","md":"114年果樹學_逐題教學詳解.md","search":"春季 3–5 月葡萄 ## 第七題｜春季 3–5 月葡萄（7 分）\n\n### 題意與作答範圍\n\n本題重點：**春季 3–5 月葡萄**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a114.pdf#page=2)。\n\n### 先掌握答案\n\n利用溫室／塑膠布保溫、提早冬季修剪與萌芽，必要時依核准方法促進芽整齊萌發，使新梢與花序在冬季較暖微環境中生長；\n\n### 原理拆解：為什麼會這樣？\n\n**花序在新梢，結果能力卻與芽的過去有關**\n\n葡萄新梢由結果母枝上的芽萌發，芽內花序原基常已在之前的枝梢生長期間形成。修剪改變芽的萌發機會，因此產期安排要先確認枝條與芽成熟度，不能把修剪當成憑空製造花芽。\n\n**一年二收需要兩次完整資源循環**\n\n冬剪後萌芽開花取得第一期果；採後保健康葉、適量補水肥，恢復貯藏並培養下一期成熟枝，再夏剪萌芽取得第二期。若第一期負載過大或葉片早落，第二期即使萌芽也可能花弱、著果差或糖低。\n\n**促成與二收各有環境限制**\n\n春果促成靠保溫設施與提早萌芽，使低溫季仍能發育；冬果則要防秋冬光熱不足。兩者均需疏梢、整穗及葉果比管理，日期依品種、產區與設施倒推，不宜用一個月份表套全臺。\n\n**設施先改變能量與物質交換**\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n**各因子必須一起管理**\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n**控制成效要用植株與環境資料驗證**\n\n以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。\n\n### 這題要特別注意\n\n重點是促成栽培的溫度與萌芽時間，不是把一般夏果採早。\n\n### 可直接練寫的完整答案\n\n利用溫室／塑膠布保溫、提早冬季修剪與萌芽，必要時依核准方法促進芽整齊萌發，使新梢與花序在冬季較暖微環境中生長；\n\n配合通風、夜間低溫防護、花果管理，提早到春季採收。\n\n葡萄新梢由結果母枝上的芽萌發，芽內花序原基常已在之前的枝梢生長期間形成。修剪改變芽的萌發機會，因此產期安排要先確認枝條與芽成熟度，不能把修剪當成憑空製造花芽。\n\n冬剪後萌芽開花取得第一期果；採後保健康葉、適量補水肥，恢復貯藏並培養下一期成熟枝，再夏剪萌芽取得第二期。若第一期負載過大或葉片早落，第二期即使萌芽也可能花弱、著果差或糖低。\n\n### 實例：把原理用在情境中\n\n同一園連續兩期採滿量而不保留健康葉，短期總採收似多，卻可能使翌期枝條與花芽變差；合理負載應看跨季樹勢與商品果率。\n\n臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。\n\n### 配分重點：哪些內容不能漏？\n\n7 分：保溫促成、提早修剪萌芽、適期花果與低溫管理。\n\n- **保溫促成**\n- **提早修剪萌芽**\n- **適期花果與低溫管理**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 以為剪枝本身就使任何芽都能帶花。\n- 將溫室直接等同低溫環境。\n 114 果樹學"},{"id":"果樹學-114-八","s":"果樹學","y":114,"n":"八","t":"積水判斷、危害、改善","body":"<h2>第八題｜積水判斷、危害、改善（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>積水判斷、危害、改善<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>觀察地勢低窪、雨後水退時間、地下水位、土壤剖面灰化與鏽斑、黏重或硬盤層，並做滲透／入滲測試。淹水使根缺氧，氧化磷酸化受抑、ATP 不足，離子吸收及根膜功能下降，誘發厭氧代謝、根腐與毒性物質，形成黃葉、萎凋、落葉及減產。改善地表排水坡度、周邊截水溝、明暗管排水、高畦、適度深鬆破硬盤與有機質管理；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>土壤有水不代表根能吸水，根缺氧也會形成「生理性乾旱」。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>觀察地勢低窪、雨後水退時間、地下水位、土壤剖面灰化與鏽斑、黏重或硬盤層，並做滲透／入滲測試。淹水使根缺氧，氧化磷酸化受抑、ATP 不足，離子吸收及根膜功能下降，誘發厭氧代謝、根腐與毒性物質，形成黃葉、萎凋、落葉及減產。改善地表排水坡度、周邊截水溝、明暗管排水、高畦、適度深鬆破硬盤與有機質管理；<\/p>\n<p>低地必要時抽排並選耐濕砧木。<\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：選地判斷、缺氧危害、地表及地下排水、保土與砧木。<\/p>\n<ul>\n<li><strong>選地判斷<\/strong><\/li>\n<li><strong>缺氧危害<\/strong><\/li>\n<li><strong>地表及地下排水<\/strong><\/li>\n<li><strong>保土與砧木<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<\/ul>","source":"../../A114.pdf#page=2","md":"114年果樹學_逐題教學詳解.md","search":"積水判斷、危害、改善 ## 第八題｜積水判斷、危害、改善（15 分）\n\n### 題意與作答範圍\n\n本題重點：**積水判斷、危害、改善**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a114.pdf#page=2)。\n\n### 先掌握答案\n\n觀察地勢低窪、雨後水退時間、地下水位、土壤剖面灰化與鏽斑、黏重或硬盤層，並做滲透／入滲測試。淹水使根缺氧，氧化磷酸化受抑、atp 不足，離子吸收及根膜功能下降，誘發厭氧代謝、根腐與毒性物質，形成黃葉、萎凋、落葉及減產。改善地表排水坡度、周邊截水溝、明暗管排水、高畦、適度深鬆破硬盤與有機質管理；\n\n### 原理拆解：為什麼會這樣？\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n### 這題要特別注意\n\n土壤有水不代表根能吸水，根缺氧也會形成「生理性乾旱」。\n\n### 可直接練寫的完整答案\n\n觀察地勢低窪、雨後水退時間、地下水位、土壤剖面灰化與鏽斑、黏重或硬盤層，並做滲透／入滲測試。淹水使根缺氧，氧化磷酸化受抑、atp 不足，離子吸收及根膜功能下降，誘發厭氧代謝、根腐與毒性物質，形成黃葉、萎凋、落葉及減產。改善地表排水坡度、周邊截水溝、明暗管排水、高畦、適度深鬆破硬盤與有機質管理；\n\n低地必要時抽排並選耐濕砧木。\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n### 實例：把原理用在情境中\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：選地判斷、缺氧危害、地表及地下排水、保土與砧木。\n\n- **選地判斷**\n- **缺氧危害**\n- **地表及地下排水**\n- **保土與砧木**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將連作障礙全部歸因於缺肥。\n 114 果樹學"},{"id":"果樹學-114-九","s":"果樹學","y":114,"n":"九","t":"英文翻譯","body":"<h2>第九題｜英文翻譯（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>英文翻譯<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。<\/p>\n<h3>完整參考譯文<\/h3>\n<p>在芽休眠期間，儘管其構造表面上呈現靜止狀態，冬季的「生理狀態具有物候上的變化」。休眠狀態在整個冬季持續改變；<\/p>\n<p>雖然長期以來常將休眠視為二元狀態，新的解釋則反映了休眠表型在冬季發生的量化變化。同樣地，耐寒性取決於不斷改變的環境條件，即使它往往被簡化為能否存活過冬的二元結果。芽休眠與耐寒性會回應環境訊號，並彼此交互作用，以決定多年生木本植物對當前及持續演變的冬季條件之適應與適存能力。<\/p>\n<h3>讀懂這段研究在說什麼<\/h3>\n<p><strong>從二元分類轉向連續的季節變化<\/strong><\/p>\n<p>文章並非否定休眠或耐寒，而是說生理狀態在冬季持續改變，不能只用休眠／不休眠、活／死兩格描述。phenological 強調隨季節物候變動，quantitative 是量化程度；fitness 是生態適存能力。翻譯須保留作者對舊觀點與新解釋的對照。<\/p>\n<h3>專業詞彙與翻譯辨析<\/h3>\n<table>\n<thead>\n<tr>\n<th>英文用語<\/th>\n<th>建議譯法<\/th>\n<th>讀法與限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>binary<\/td>\n<td>二元<\/td>\n<td>只有兩種離散狀態的描述<\/td>\n<\/tr>\n<tr>\n<td>phenological<\/td>\n<td>物候<\/td>\n<td>與季節發育節律相關<\/td>\n<\/tr>\n<tr>\n<td>fitness<\/td>\n<td>適存<\/td>\n<td>此處指生物適存能力，非運動體能<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>容易譯錯的地方<\/h3>\n<p>binary 譯「二元」，意即休眠／不休眠、存活／死亡；phenological 指隨季節物候改變，fitness 在此為適存能力。<\/p>\n<h3>配分重點與檢查順序<\/h3>\n<p>10 分：全文翻譯完整，binary、phenological、cold hardiness、fitness 等準確。<\/p>\n<p>先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。<\/p>\n<h3>常見失分<\/h3>\n<ul>\n<li>把專業名詞按一般字義翻譯，或把相關性改成因果。<\/li>\n<li>省略轉折、條件或限制，使研究結論比原文更強。<\/li>\n<li>以摘要取代全文翻譯。<\/li>\n<\/ul>","source":"../../A114.pdf#page=2","md":"114年果樹學_逐題教學詳解.md","search":"英文翻譯 ## 第九題｜英文翻譯（10 分）\n\n### 題意與作答範圍\n\n本題重點：**英文翻譯**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a114.pdf#page=2)。\n\n### 先掌握答案\n\n這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。\n\n### 完整參考譯文\n\n在芽休眠期間，儘管其構造表面上呈現靜止狀態，冬季的「生理狀態具有物候上的變化」。休眠狀態在整個冬季持續改變；\n\n雖然長期以來常將休眠視為二元狀態，新的解釋則反映了休眠表型在冬季發生的量化變化。同樣地，耐寒性取決於不斷改變的環境條件，即使它往往被簡化為能否存活過冬的二元結果。芽休眠與耐寒性會回應環境訊號，並彼此交互作用，以決定多年生木本植物對當前及持續演變的冬季條件之適應與適存能力。\n\n### 讀懂這段研究在說什麼\n\n**從二元分類轉向連續的季節變化**\n\n文章並非否定休眠或耐寒，而是說生理狀態在冬季持續改變，不能只用休眠／不休眠、活／死兩格描述。phenological 強調隨季節物候變動，quantitative 是量化程度；fitness 是生態適存能力。翻譯須保留作者對舊觀點與新解釋的對照。\n\n### 專業詞彙與翻譯辨析\n\n| 英文用語 | 建議譯法 | 讀法與限制 |\n| --- | --- | --- |\n| binary | 二元 | 只有兩種離散狀態的描述 |\n| phenological | 物候 | 與季節發育節律相關 |\n| fitness | 適存 | 此處指生物適存能力，非運動體能 |\n\n### 容易譯錯的地方\n\nbinary 譯「二元」，意即休眠／不休眠、存活／死亡；phenological 指隨季節物候改變，fitness 在此為適存能力。\n\n### 配分重點與檢查順序\n\n10 分：全文翻譯完整，binary、phenological、cold hardiness、fitness 等準確。\n\n先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。\n\n### 常見失分\n\n- 把專業名詞按一般字義翻譯，或把相關性改成因果。\n- 省略轉折、條件或限制，使研究結論比原文更強。\n- 以摘要取代全文翻譯。\n 114 果樹學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
