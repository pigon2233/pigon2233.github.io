點：<strong>生長調節物質五項應用<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>可舉 IBA 促菊花插穗不定根、BA 促蘭花組培芽增殖、GA₃ 促部分切花花莖伸長、paclobutrazol 等抑 GA 合成以矮化盆花、乙烯利誘導觀賞鳳梨開花。每例應交代作物、施用部位與生育期，生長素促根不等於高濃度愈有效，抗 GA 藥亦可能殘效過久而影響開花。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<p><strong>感應的是日夜節律，常以夜長最關鍵<\/strong><\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<p><strong>感光與光合作用不是同一需求<\/strong><\/p>\n<p>暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。<\/p>\n<p><strong>產期調節須兼顧可感應階段<\/strong><\/p>\n<p>植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>可舉 IBA 促菊花插穗不定根、BA 促蘭花組培芽增殖、GA₃ 促部分切花花莖伸長、paclobutrazol 等抑 GA 合成以矮化盆花、乙烯利誘導觀賞鳳梨開花。每例應交代作物、施用部位與生育期，生長素促根不等於高濃度愈有效，抗 GA 藥亦可能殘效過久而影響開花。<\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<p>菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：五項各約 4 分，藥名、作物、目的與原理。<\/p>\n<ul>\n<li><strong>五項各約 4 分，藥名<\/strong><\/li>\n<li><strong>目的與原理<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<li>把短日反應簡化為光越少花越多。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=2","md":"106年花卉學_逐題教學詳解.md","search":"生長調節物質五項應用 ## 第一題｜生長調節物質五項應用（20 分）\n\n### 題意與作答範圍\n\n本題重點：**生長調節物質五項應用**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=2)。\n\n### 先掌握答案\n\n可舉 iba 促菊花插穗不定根、ba 促蘭花組培芽增殖、ga₃ 促部分切花花莖伸長、paclobutrazol 等抑 ga 合成以矮化盆花、乙烯利誘導觀賞鳳梨開花。每例應交代作物、施用部位與生育期，生長素促根不等於高濃度愈有效，抗 ga 藥亦可能殘效過久而影響開花。\n\n### 原理拆解：為什麼會這樣？\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n**感應的是日夜節律，常以夜長最關鍵**\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n**感光與光合作用不是同一需求**\n\n暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。\n\n**產期調節須兼顧可感應階段**\n\n植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。\n\n### 可直接練寫的完整答案\n\n可舉 iba 促菊花插穗不定根、ba 促蘭花組培芽增殖、ga₃ 促部分切花花莖伸長、paclobutrazol 等抑 ga 合成以矮化盆花、乙烯利誘導觀賞鳳梨開花。每例應交代作物、施用部位與生育期，生長素促根不等於高濃度愈有效，抗 ga 藥亦可能殘效過久而影響開花。\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n### 實例：把原理用在情境中\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：五項各約 4 分，藥名、作物、目的與原理。\n\n- **五項各約 4 分，藥名**\n- **目的與原理**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無性繁殖與無病毒畫上等號。\n- 把短日反應簡化為光越少花越多。\n 106 花卉學"},{"id":"花卉學-106-二","s":"花卉學","y":106,"n":"二","t":"土壤 pH 與營養","body":"<h2>第二題｜土壤 pH 與營養（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>土壤 pH 與營養<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>pH 改變礦物溶解、吸附沉澱、微生物及根膜吸收。過酸增加 Al、Mn 毒害及 Ca、Mg 流失，磷可被 Fe、Al 固定；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>第一步是分清吸收、運輸與需求<\/strong><\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p><strong>用新老葉位置推理<\/strong><\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<p><strong>最後必須用適當樣本驗證<\/strong><\/p>\n<p>依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。<\/p>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>pH 改變礦物溶解、吸附沉澱、微生物及根膜吸收。過酸增加 Al、Mn 毒害及 Ca、Mg 流失，磷可被 Fe、Al 固定；<\/p>\n<p>過鹼使 Fe、Mn、Zn 等有效性下降並可能缺鐵黃化，磷可與 Ca 沉澱。多數草花以微酸根域較合適，但杜鵑等喜酸，不能用單一 pH 標準；<\/p>\n<p>先分析再調整。<\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。<\/p>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：酸鹼兩端影響、元素例、作物差異與改善。<\/p>\n<ul>\n<li><strong>酸鹼兩端影響<\/strong><\/li>\n<li><strong>元素例<\/strong><\/li>\n<li><strong>作物差異與改善<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>只寫缺肥會黃葉，沒有指出葉齡與黃化分布。<\/li>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=2","md":"106年花卉學_逐題教學詳解.md","search":"土壤 ph 與營養 ## 第二題｜土壤 ph 與營養（10 分）\n\n### 題意與作答範圍\n\n本題重點：**土壤 ph 與營養**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=2)。\n\n### 先掌握答案\n\nph 改變礦物溶解、吸附沉澱、微生物及根膜吸收。過酸增加 al、mn 毒害及 ca、mg 流失，磷可被 fe、al 固定；\n\n### 原理拆解：為什麼會這樣？\n\n**第一步是分清吸收、運輸與需求**\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n**用新老葉位置推理**\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n**最後必須用適當樣本驗證**\n\n依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n### 可直接練寫的完整答案\n\nph 改變礦物溶解、吸附沉澱、微生物及根膜吸收。過酸增加 al、mn 毒害及 ca、mg 流失，磷可被 fe、al 固定；\n\n過鹼使 fe、mn、zn 等有效性下降並可能缺鐵黃化，磷可與 ca 沉澱。多數草花以微酸根域較合適，但杜鵑等喜酸，不能用單一 ph 標準；\n\n先分析再調整。\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n### 實例：把原理用在情境中\n\n老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：酸鹼兩端影響、元素例、作物差異與改善。\n\n- **酸鹼兩端影響**\n- **元素例**\n- **作物差異與改善**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 只寫缺肥會黃葉，沒有指出葉齡與黃化分布。\n- 將連作障礙全部歸因於缺肥。\n 106 花卉學"},{"id":"花卉學-106-三","s":"花卉學","y":106,"n":"三","t":"臺灣八氣候區與觀賞植物","body":"<h2>第三題｜臺灣八氣候區與觀賞植物（32 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>臺灣八氣候區與觀賞植物<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>本題可依園藝常用雨量季節性區分：東北區冬雨多，如杜鵑；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>氣候分區不是一套全球唯一名單<\/strong><\/p>\n<p>題目若沿用教材八區，應依該教材的區名作答，並以冬季溫度、降雨、乾濕季與海拔連結適合植物。臺灣地形造成短距離環境差異，同緯度也可有涼濕與乾暖產區，不能僅用南北一條線解釋所有花卉配置。區名有版本差異時應說明採用口徑。<\/p>\n<p><strong>設施先改變能量與物質交換<\/strong><\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p><strong>各因子必須一起管理<\/strong><\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<p><strong>控制成效要用植株與環境資料驗證<\/strong><\/p>\n<p>以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>此處採植物生態的水平八氣候區：NE 東北、NW 西北、CW 中西、SW 西南、EN 東區北段、ES 東區南段、SE 東南及 LAN 蘭嶼，與氣象署一般四區的目的不同。<\/p>\n<p>分區依據可對照<a href=\"https://acac.niu.edu.tw/var/file/43/1043/img/772/657070970.pdf\">宜蘭大學植群與氣候分區資料<\/a>。花卉是適生或栽培應用例，不能宣稱某植物只存在於單一氣候區。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>本題可依園藝常用雨量季節性區分：東北區冬雨多，如杜鵑；<\/p>\n<p>西北區冬冷、夏雨，如茶花；<\/p>\n<p>中西區冬較乾、夏雨，如菊花；<\/p>\n<p>西南區乾濕季明顯，如火鶴；<\/p>\n<p>東部北段雨量較均，如觀葉植物；<\/p>\n<p>東部南段較暖濕，如蝴蝶蘭；<\/p>\n<p>東南區乾季與焚風顯著，如熱帶觀賞植物；<\/p>\n<p>蘭嶼區熱帶海洋性，如原生蝴蝶蘭。上述為適生／產業例，不宣稱各例僅存在該區；<\/p>\n<p>八區邊界與名稱須依授課圖。<\/p>\n<p>題目若沿用教材八區，應依該教材的區名作答，並以冬季溫度、降雨、乾濕季與海拔連結適合植物。臺灣地形造成短距離環境差異，同緯度也可有涼濕與乾暖產區，不能僅用南北一條線解釋所有花卉配置。區名有版本差異時應說明採用口徑。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>32 分：八區名稱各 2 分、相應作物各 2 分；配對要能用氣候解釋。<\/p>\n<ul>\n<li><strong>八區名稱各 2 分<\/strong><\/li>\n<li><strong>相應作物各 2 分<\/strong><\/li>\n<li><strong>配對要能用氣候解釋<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將溫室直接等同低溫環境。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=2","md":"106年花卉學_逐題教學詳解.md","search":"臺灣八氣候區與觀賞植物 ## 第三題｜臺灣八氣候區與觀賞植物（32 分）\n\n### 題意與作答範圍\n\n本題重點：**臺灣八氣候區與觀賞植物**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=2)。\n\n### 先掌握答案\n\n本題可依園藝常用雨量季節性區分：東北區冬雨多，如杜鵑；\n\n### 原理拆解：為什麼會這樣？\n\n**氣候分區不是一套全球唯一名單**\n\n題目若沿用教材八區，應依該教材的區名作答，並以冬季溫度、降雨、乾濕季與海拔連結適合植物。臺灣地形造成短距離環境差異，同緯度也可有涼濕與乾暖產區，不能僅用南北一條線解釋所有花卉配置。區名有版本差異時應說明採用口徑。\n\n**設施先改變能量與物質交換**\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n**各因子必須一起管理**\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n**控制成效要用植株與環境資料驗證**\n\n以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。\n\n### 這題要特別注意\n\n此處採植物生態的水平八氣候區：ne 東北、nw 西北、cw 中西、sw 西南、en 東區北段、es 東區南段、se 東南及 lan 蘭嶼，與氣象署一般四區的目的不同。\n\n分區依據可對照[宜蘭大學植群與氣候分區資料](https://acac.niu.edu.tw/var/file/43/1043/img/772/657070970.pdf)。花卉是適生或栽培應用例，不能宣稱某植物只存在於單一氣候區。\n\n### 可直接練寫的完整答案\n\n本題可依園藝常用雨量季節性區分：東北區冬雨多，如杜鵑；\n\n西北區冬冷、夏雨，如茶花；\n\n中西區冬較乾、夏雨，如菊花；\n\n西南區乾濕季明顯，如火鶴；\n\n東部北段雨量較均，如觀葉植物；\n\n東部南段較暖濕，如蝴蝶蘭；\n\n東南區乾季與焚風顯著，如熱帶觀賞植物；\n\n蘭嶼區熱帶海洋性，如原生蝴蝶蘭。上述為適生／產業例，不宣稱各例僅存在該區；\n\n八區邊界與名稱須依授課圖。\n\n題目若沿用教材八區，應依該教材的區名作答，並以冬季溫度、降雨、乾濕季與海拔連結適合植物。臺灣地形造成短距離環境差異，同緯度也可有涼濕與乾暖產區，不能僅用南北一條線解釋所有花卉配置。區名有版本差異時應說明採用口徑。\n\n### 實例：把原理用在情境中\n\n臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。\n\n### 配分重點：哪些內容不能漏？\n\n32 分：八區名稱各 2 分、相應作物各 2 分；配對要能用氣候解釋。\n\n- **八區名稱各 2 分**\n- **相應作物各 2 分**\n- **配對要能用氣候解釋**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將溫室直接等同低溫環境。\n 106 花卉學"},{"id":"花卉學-106-四","s":"花卉學","y":106,"n":"四","t":"設施對花卉重要性","body":"<h2>第四題｜設施對花卉重要性（12 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>設施對花卉重要性<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>臺灣颱風、豪雨、夏熱與冬季冷濕使露地花品質不穩，設施可避雨防風、保溫降溫、補光遮光與控制水肥，提升花莖長度、潔淨度、均一性與交貨穩定，支援外銷。仍須計入耐風結構、透光、通風、能源與折舊，避免高溫高濕加劇病害。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>設施先改變能量與物質交換<\/strong><\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p><strong>各因子必須一起管理<\/strong><\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<p><strong>控制成效要用植株與環境資料驗證<\/strong><\/p>\n<p>以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>臺灣颱風、豪雨、夏熱與冬季冷濕使露地花品質不穩，設施可避雨防風、保溫降溫、補光遮光與控制水肥，提升花莖長度、潔淨度、均一性與交貨穩定，支援外銷。仍須計入耐風結構、透光、通風、能源與折舊，避免高溫高濕加劇病害。<\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>12 分：氣候需求、品質與產調效益、風險成本。<\/p>\n<ul>\n<li><strong>氣候需求<\/strong><\/li>\n<li><strong>品質與產調效益<\/strong><\/l trong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>未生根插穗仍蒸散，間歇噴霧增加葉周濕度並蒸發降葉溫，減少萎凋，得以保留葉片供碳；<\/p>\n<p>可提高成活、發根整齊度、減少人工與過度遮光。應按輻射、溫度與插穗階段調霧量，生根後逐步減霧，避免介質缺氧與病害。<\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：水分機制、保葉與發根、規模化、過濕限制。<\/p>\n<ul>\n<li><strong>水分機制<\/strong><\/li>\n<li><strong>保葉與發根<\/strong><\/li>\n<li><strong>規模化<\/strong><\/li>\n<li><strong>過濕限制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=2","md":"106年花卉學_逐題教學詳解.md","search":"噴霧扦插優點 ## 第五題｜噴霧扦插優點（10 分）\n\n### 題意與作答範圍\n\n本題重點：**噴霧扦插優點**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=2)。\n\n### 先掌握答案\n\n未生根插穗仍蒸散，間歇噴霧增加葉周濕度並蒸發降葉溫，減少萎凋，得以保留葉片供碳；\n\n### 原理拆解：為什麼會這樣？\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n### 可直接練寫的完整答案\n\n未生根插穗仍蒸散，間歇噴霧增加葉周濕度並蒸發降葉溫，減少萎凋，得以保留葉片供碳；\n\n可提高成活、發根整齊度、減少人工與過度遮光。應按輻射、溫度與插穗階段調霧量，生根後逐步減霧，避免介質缺氧與病害。\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n### 實例：把原理用在情境中\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：水分機制、保葉與發根、規模化、過濕限制。\n\n- **水分機制**\n- **保葉與發根**\n- **規模化**\n- **過濕限制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無性繁殖與無病毒畫上等號。\n 106 花卉學"},{"id":"花卉學-106-六","s":"花卉學","y":106,"n":"六","t":"八名詞","body":"<h2>第六題｜八名詞（16 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>八名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Bulb 鱗莖，短縮莖與肉質鱗片，如百合；<\/p>\n<p>embryo culture 胚培養，無菌培養胚以育苗或救援；<\/p>\n<p>foliage plants 觀葉植物；<\/p>\n<p>monopodial orchids 單莖性蘭，如蝴蝶蘭；<\/p>\n<p>Phalaenopsis 蝴蝶蘭屬；<\/p>\n<p>protocorm-like body 類原球體 PLB，可再生成苗；<\/p>\n<p>scooping 挖底法，風信子基盤挖除促小球；<\/p>\n<p>succulent plants 多肉植物，葉莖根等具有儲水組織。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bulb 鱗莖，短縮莖與肉質鱗片，如百合；<\/td>\n<td>主要貯藏組織是肉質葉或葉基，底部有短縮莖基盤，例如百合、洋蔥。<\/td>\n<\/tr>\n<tr>\n<td>protocorm-like body 類原球體 PLB，可再生成苗；<\/td>\n<td>類原球體可用於蘭花增殖，但須控制代數及變異，並不是每個 PLB 都等於一株可販售成苗。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Bulb 鱗莖，短縮莖與肉質鱗片，如百合；<\/p>\n<p>embryo culture 胚培養，無菌培養胚以育苗或救援；<\/p>\n<p>foliage plants 觀葉植物；<\/p>\n<p>monopodial orchids 單莖性蘭，如蝴蝶蘭；<\/p>\n<p>Phalaenopsis 蝴蝶蘭屬；<\/p>\n<p>protocorm-like body 類原球體 PLB，可再生成苗；<\/p>\n<p>scooping 挖底法，風信子基盤挖除促小球；<\/p>\n<p>succulent plants 多肉植物，葉莖根等具有儲水組織。<\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>16 分：各 2 分，譯名與構造／用途。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=2","md":"106年花卉學_逐題教學詳解.md","search":"八名詞 ## 第六題｜八名詞（16 分）\n\n### 題意與作答範圍\n\n本題重點：**八名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=2)。\n\n### 先掌握答案\n\nbulb 鱗莖，短縮莖與肉質鱗片，如百合；\n\nembryo culture 胚培養，無菌培養胚以育苗或救援；\n\nfoliage plants 觀葉植物；\n\nmonopodial orchids 單莖性蘭，如蝴蝶蘭；\n\nphalaenopsis 蝴蝶蘭屬；\n\nprotocorm-like body 類原球體 plb，可再生成苗；\n\nscooping 挖底法，風信子基盤挖除促小球；\n\nsucculent plants 多肉植物，葉莖根等具有儲水組織。\n\n### 原理拆解：為什麼會這樣？\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| bulb 鱗莖，短縮莖與肉質鱗片，如百合； | 主要貯藏組織是肉質葉或葉基，底部有短縮莖基盤，例如百合、洋蔥。 |\n| protocorm-like body 類原球體 plb，可再生成苗； | 類原球體可用於蘭花增殖，但須控制代數及變異，並不是每個 plb 都等於一株可販售成苗。 |\n\n### 可直接練寫的完整答案\n\nbulb 鱗莖，短縮莖與肉質鱗片，如百合；\n\nembryo culture 胚培養，無菌培養胚以育苗或救援；\n\nfoliage plants 觀葉植物；\n\nmonopodial orchids 單莖性蘭，如蝴蝶蘭；\n\nphalaenopsis 蝴蝶蘭屬；\n\nprotocorm-like body 類原球體 plb，可再生成苗；\n\nscooping 挖底法，風信子基盤挖除促小球；\n\nsucculent plants 多肉植物，葉莖根等具有儲水組織。\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n### 實例：把原理用在情境中\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n### 配分重點：哪些內容不能漏？\n\n16 分：各 2 分，譯名與構造／用途。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無性繁殖與無病毒畫上等號。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 106 花卉學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));f subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
