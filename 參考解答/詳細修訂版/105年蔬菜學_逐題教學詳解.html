<strong>設施鹽害原因與改善<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=6\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>覆蓋阻隔雨水淋洗，長期施肥及灌溉水帶鹽、蒸散濃縮使 EC 增高，低水勢限制吸水並可能離子毒害與養分拮抗。先測根域 EC、pH 和水質、查排水，減少過肥與不必要鹽，分次供應、用良水灌洗並確實排出，必要換介質或輪作，不能只加水卻不排水。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<p><strong>先理解水勢與膨壓<\/strong><\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p><strong>由缺水到減產的連鎖<\/strong><\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<p><strong>管理不是只問澆多少<\/strong><\/p>\n<p>應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>覆蓋阻隔雨水淋洗，長期施肥及灌溉水帶鹽、蒸散濃縮使 EC 增高，低水勢限制吸水並可能離子毒害與養分拮抗。先測根域 EC、pH 和水質、查排水，減少過肥與不必要鹽，分次供應、用良水灌洗並確實排出，必要換介質或輪作，不能只加水卻不排水。<\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<p>旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：累積來源、滲透與離子機制、檢測、灌洗排水與施肥。<\/p>\n<ul>\n<li><strong>累積來源<\/strong><\/li>\n<li><strong>滲透與離子機制<\/strong><\/li>\n<li><strong>灌洗排水與施肥<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<li>把有水等同根一定能吸到水。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=6","md":"105年蔬菜學_逐題教學詳解.md","search":"設施鹽害原因與改善 ## 第一題｜設施鹽害原因與改善（15 分）\n\n### 題意與作答範圍\n\n本題重點：**設施鹽害原因與改善**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=6)。\n\n### 先掌握答案\n\n覆蓋阻隔雨水淋洗，長期施肥及灌溉水帶鹽、蒸散濃縮使 ec 增高，低水勢限制吸水並可能離子毒害與養分拮抗。先測根域 ec、ph 和水質、查排水，減少過肥與不必要鹽，分次供應、用良水灌洗並確實排出，必要換介質或輪作，不能只加水卻不排水。\n\n### 原理拆解：為什麼會這樣？\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n**先理解水勢與膨壓**\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n**由缺水到減產的連鎖**\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n**管理不是只問澆多少**\n\n應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。\n\n### 可直接練寫的完整答案\n\n覆蓋阻隔雨水淋洗，長期施肥及灌溉水帶鹽、蒸散濃縮使 ec 增高，低水勢限制吸水並可能離子毒害與養分拮抗。先測根域 ec、ph 和水質、查排水，減少過肥與不必要鹽，分次供應、用良水灌洗並確實排出，必要換介質或輪作，不能只加水卻不排水。\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n### 實例：把原理用在情境中\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：累積來源、滲透與離子機制、檢測、灌洗排水與施肥。\n\n- **累積來源**\n- **滲透與離子機制**\n- **灌洗排水與施肥**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將連作障礙全部歸因於缺肥。\n- 把有水等同根一定能吸到水。\n 105 蔬菜學"},{"id":"蔬菜學-105-二","s":"蔬菜學","y":105,"n":"二","t":"102–103 年產量與產值前五","body":"<h2>第二題｜102–103 年產量與產值前五（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>102–103 年產量與產值前五<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=6\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>選題目容許範圍中的 102 年，依當年農業統計年報「蔬菜」分類、排除「其他」集合項，產量前五：甘藍 354390 公噸、竹筍 267092、西瓜 212690、番茄 141881、胡蘿蔔 113524。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先說明產品和統計口徑<\/strong><\/p>\n<p>市場題應區分產量、產值、種植面積、批發與零售，以及指定年度與地區。鮮切花、盆花與蔬菜供應鏈的商品單位不同，不能把總量或售價直接互相比較。<\/p>\n<p><strong>產銷差異有可解釋的環節<\/strong><\/p>\n<p>分級、包裝、耗損、運輸、冷藏與交易成本都會影響售價；產品易腐、需求集中及天候變動會加劇短期波動。要用流程解釋差異，避免只列「成本高」而未指出環節。<\/p>\n<p><strong>歷史答案不能用今天資料代填<\/strong><\/p>\n<p>考古題要求某年排名、當時市場型態或事件時，應採當年資料。若未取得可核對的舊資料，應揭露限制；若有精確數字，列單位及來源，使讀者能確認比較基準。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>選題目容許範圍中的 102 年，依當年農業統計年報「蔬菜」分類、排除「其他」集合項，產量前五：甘藍 354390 公噸、竹筍 267092、西瓜 212690、番茄 141881、胡蘿蔔 113524。<\/p>\n<p>產值前五：竹筍 7155400 千元、甘藍 5400896、蔥 4304797、番茄 4081905、西瓜 2764964。年報把菇類另列，故此口徑不把香菇混入。量值排名不同，反映單價與商品價值，不能用產量名次直接代產值。<\/p>\n<p>來源：<a href=\"https://eng.moa.gov.tw/upload/files/eng_web_structure/2501663/8-5.pdf\">102 年農業統計年報量值表<\/a>。<\/p>\n<p>市場題應區分產量、產值、種植面積、批發與零售，以及指定年度與地區。鮮切花、盆花與蔬菜供應鏈的商品單位不同，不能把總量或售價直接互相比較。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同年度產量最多的蔬菜未必產值最高，因為商品單價與品質不同；花卉拍賣價也不能直接當作零售花店售價。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：明定 102 年與蔬菜口徑、兩組各五名、單位及排除集合／菇類；數字取自官方原表。<\/p>\n<ul>\n<li><strong>明定 102 年與蔬菜口徑<\/strong><\/li>\n<li><strong>兩組各五名<\/strong><\/li>\n<li><strong>單位及排除集合／菇類<\/strong><\/li>\n<li><strong>數字取自官方原表<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>混用年度、產量與產值排名。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=6","md":"105年蔬菜學_逐題教學詳解.md","search":"102–103 年產量與產值前五 ## 第二題｜102–103 年產量與產值前五（15 分）\n\n### 題意與作答範圍\n\n本題重點：**102–103 年產量與產值前五**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=6)。\n\n### 先掌握答案\n\n選題目容許範圍中的 102 年，依當年農業統計年報「蔬菜」分類、排除「其他」集合項，產量前五：甘藍 354390 公噸、竹筍 267092、西瓜 212690、番茄 141881、胡蘿蔔 113524。\n\n### 原理拆解：為什麼會這樣？\n\n**先說明產品和統計口徑**\n\n市場題應區分產量、產值、種植面積、批發與零售，以及指定年度與地區。鮮切花、盆花與蔬菜供應鏈的商品單位不同，不能把總量或售價直接互相比較。\n\n**產銷差異有可解釋的環節**\n\n分級、包裝、耗損、運輸、冷藏與交易成本都會影響售價；產品易腐、需求集中及天候變動會加劇短期波動。要用流程解釋差異，避免只列「成本高」而未指出環節。\n\n**歷史答案不能用今天資料代填**\n\n考古題要求某年排名、當時市場型態或事件時，應採當年資料。若未取得可核對的舊資料，應揭露限制；若有精確數字，列單位及來源，使讀者能確認比較基準。\n\n### 可直接練寫的完整答案\n\n選題目容許範圍中的 102 年，依當年農業統計年報「蔬菜」分類、排除「其他」集合項，產量前五：甘藍 354390 公噸、竹筍 267092、西瓜 212690、番茄 141881、胡蘿蔔 113524。\n\n產值前五：竹筍 7155400 千元、甘藍 5400896、蔥 4304797、番茄 4081905、西瓜 2764964。年報把菇類另列，故此口徑不把香菇混入。量值排名不同，反映單價與商品價值，不能用產量名次直接代產值。\n\n來源：[102 年農業統計年報量值表](https://eng.moa.gov.tw/upload/files/eng_web_structure/2501663/8-5.pdf)。\n\n市場題應區分產量、產值、種植面積、批發與零售，以及指定年度與地區。鮮切花、盆花與蔬菜供應鏈的商品單位不同，不能把總量或售價直接互相比較。\n\n### 實例：把原理用在情境中\n\n同年度產量最多的蔬菜未必產值最高，因為商品單價與品質不同；花卉拍賣價也不能直接當作零售花店售價。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：明定 102 年與蔬菜口徑、兩組各五名、單位及排除集合／菇類；數字取自官方原表。\n\n- **明定 102 年與蔬菜口徑**\n- **兩組各五名**\n- **單位及排除集合／菇類**\n- **數字取自官方原表**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 混用年度、產量與產值排名。\n 105 蔬菜學"},{"id":"蔬菜學-105-三","s":"蔬菜學","y":105,"n":"三","t":"綠肥重要性與注意","body":"<h2>第三題｜綠肥重要性與注意（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>綠肥重要性與注意<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=6\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>綠肥增加有機碳、改善團粒與保水保肥，豆科固氮，地表覆蓋減蝕抑草並促微生物。選適季、非主要病蟲共同寄主且易管理的作物，在過度木質化、結籽前翻埋，留足腐熟期後種菜；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>翻埋後為何不能立刻忽略分解過程？<\/strong><\/p>\n<p>土壤微生物分解鮮綠肥會耗氧，高碳氮比材料可能暫時固定無機氮；若濕土中大量翻埋後立即種植，可能根部缺氧或受分解產物傷害。豆科固氮也取決有效共生與生長條件，不能把所有綠肥都當成相同氮肥量。應依材料、季節與分解情形安排間隔。<\/p>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<p><strong>雜草是出現在不適位置的植物<\/strong><\/p>\n<p>同一植物在綠肥田可能有用，在苗床卻可能競爭資源。主要問題包括爭光、水、養分與空間，寄生病蟲、干擾採收及污染商品；有些田間植被也有保土與生態功能，須依位置管理。<\/p>\n<p><strong>關鍵在競爭時期與繁殖源<\/strong><\/p>\n<p>作物幼苗與行間尚未封閉時通常較易受競爭；種子庫與地下繁殖器官使雜草反覆出現。應在結籽或形成大量地下繁殖體前處理，避免只消除可見地上部。<\/p>\n<p><strong>整合方法降低反覆發生<\/strong><\/p>\n<p>輪作、清潔種苗、覆蓋、適當密植、中耕、人工與合規藥劑各有時機。覆蓋須注意水分、病害與殘材，除草劑須依核准作物與標示使用；不能用不分選擇性的處理傷及栽培作物。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>綠肥增加有機碳、改善團粒與保水保肥，豆科固氮，地表覆蓋減蝕抑草並促微生物。選適季、非主要病蟲共同寄主且易管理的作物，在過度木質化、結籽前翻埋，留足腐熟期後種菜；<\/p>\n<p>高 C/N 材料短期固定氮，鮮物過多可缺氧或產生有機酸，需配水分與耕作。<\/p>\n<p>土壤微生物分解鮮綠肥會耗氧，高碳氮比材料可能暫時固定無機氮；若濕土中大量翻埋後立即種植，可能根部缺氧或受分解產物傷害。豆科固氮也取決有效共生與生長條件，不能把所有綠肥都當成相同氮肥量。應依材料、季節與分解情形安排間隔。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<p>短期葉菜可先處理播種前的雜草，再利用均勻出苗與適度密植縮短裸地期間；多年生地下莖雜草則需反覆耗竭或移除繁殖體，僅割一次常會再生。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：土壤、生物、氮與覆蓋效益，翻埋時機及腐熟風險。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<li>將所有田間非作物植被都視為沒有任何效益。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=6","md":"105年蔬菜學_逐題教學詳解.md","search":"綠肥重要性與注意 ## 第三題｜綠肥重要性與注意（15 分）\n\n### 題意與作答範圍\n\n本題重點：**綠肥重要性與注意**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=6)。\n\n### 先掌握答案\n\n綠肥增加有機碳、改善團粒與保水保肥，豆科固氮，地表覆蓋減蝕抑草並促微生物。選適季、非主要病蟲共同寄主且易管理的作物，在過度木質化、結籽前翻埋，留足腐熟期後種菜；\n\n### 原理拆解：為什麼會這樣？\n\n**翻埋後為何不能立刻忽略分解過程？**\n\n土壤微生物分解鮮綠肥會耗氧，高碳氮比材料可能暫時固定無機氮；若濕土中大量翻埋後立即種植，可能根部缺氧或受分解產物傷害。豆科固氮也取決有效共生與生長條件，不能把所有綠肥都當成相同氮肥量。應依材料、季節與分解情形安排間隔。\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n**雜草是出現在不適位置的植物**\n\n同一植物在綠肥田可能有用，在苗床卻可能競爭資源。主要問題包括爭光、水、養分與空間，寄生病蟲、干擾採收及污染商品；有些田間植被也有保土與生態功能，須依位置管理。\n\n**關鍵在競爭時期與繁殖源**\n\n作物幼苗與行間尚未封閉時通常較易受競爭；種子庫與地下繁殖器官使雜草反覆出現。應在結籽或形成大量地下繁殖體前處理，避免只消除可見地上部。\n\n**整合方法降低反覆發生**\n\n輪作、清潔種苗、覆蓋、適當密植、中耕、人工與合規藥劑各有時機。覆蓋須注意水分、病害與殘材，除草劑須依核准作物與標示使用；不能用不分選擇性的處理傷及栽培作物。\n\n### 可直接練寫的完整答案\n\n綠肥增加有機碳、改善團粒與保水保肥，豆科固氮，地表覆蓋減蝕抑草並促微生物。選適季、非主要病蟲共同寄主且易管理的作物，在過度木質化、結籽前翻埋，留足腐熟期後種菜；\n\n高 c/n 材料短期固定氮，鮮物過多可缺氧或產生有機酸，需配水分與耕作。\n\n土壤微生物分解鮮綠肥會耗氧，高碳氮比材料可能暫時固定無機氮；若濕土中大量翻埋後立即種植，可能根部缺氧或受分解產物傷害。豆科固氮也取決有效共生與生長條件，不能把所有綠肥都當成相同氮肥量。應依材料、季節與分解情形安排間隔。\n\n### 實例：把原理用在情境中\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n短期葉菜可先處理播種前的雜草，再利用均勻出苗與適度密植縮短裸地期間；多年生地下莖雜草則需反覆耗竭或移除繁殖體，僅割一次常會再生。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：土壤、生物、氮與覆蓋效益，翻埋時機及腐熟風險。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將連作障礙全部歸因於缺肥。\n- 將所有田間非作物植被都視為沒有任何效益。\n 105 蔬菜學"},{"id":"蔬菜學-105-四","s":"蔬菜學","y":105,"n":"四","t":"缺水反應與因應","body":"<h2>第四題｜缺水反應與因應（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>缺水反應與因應<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=6\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>初期葉水勢下降、膨壓與擴張受抑，ABA 促氣孔關閉減蒸散但也限制 CO₂；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先理解水勢與膨壓<\/strong><\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p><strong>由缺水到減產的連鎖<\/strong><\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<p><strong>管理不是只問澆多少<\/strong><\/p>\n<p>應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。<\/p>\n<p><strong>先區分傷害種類與發生條件<\/strong><\/p>\n<p>乾旱、淹水、高溫、寒害、凍害與鹽害的起始機制不同。寒害可在冰點以上發生於敏感作物，凍害則涉及結冰；淹水即使土壤水多，也可能因缺氧而使根無法正常供水。<\/p>\n<p><strong>從細胞功能連到可見症狀<\/strong><\/p>\n<p>膜性質改變、活性氧增加、酵素與能量代謝受阻，最後表現萎凋、褐化、落花或生長停滯。短期氣孔關閉可節水，長期卻限制 CO₂ 吸收；適應反應與傷害結果應分別說明。<\/p>\n<p><strong>預防與恢復管理各有時機<\/strong><\/p>\n<p>品種與產季選擇、灌排、覆蓋、通風遮陰及適度馴化可降低風險。受害後先評估根與生長點是否存活，再調整水肥；重施肥不能代替環境修復，受傷根系也可能無法利用增加的養分。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>初期葉水勢下降、膨壓與擴張受抑，ABA 促氣孔關閉減蒸散但也限制 CO₂；<\/p>\n<p>嚴重時光合與膜受損、活性氧增加、花果脫落，品質及產量下降。選抗旱材料、適播期、深健根、覆蓋、滴灌與土壤含水監測，合理密度與肥量，避免在高耗水季形成高負載。<\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。<\/p>\n<p>熱帶果菜低溫貯藏後可能出現凹陷、褐化與腐敗，而未曾結冰；應檢查該作物安全溫度與累積暴露時間，不能只把冷庫調得更冷。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：由早到晚生理、葉根花果、至少四管理及取捨。<\/p>\n<ul>\n<li><strong>由早到晚生理<\/strong><\/li>\n<li><strong>葉根花果<\/strong><\/li>\n<li><strong>至少四管理及取捨<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把有水等同根一定能吸到水。<\/li>\n<li>把寒害與凍害當成同義詞。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=6","md":"105年蔬菜學_逐題教學詳解.md","search":"缺水反應與因應 ## 第四題｜缺水反應與因應（15 分）\n\n### 題意與作答範圍\n\n本題重點：**缺水反應與因應**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=6)。\n\n### 先掌握答案\n\n初期葉水勢下降、膨壓與擴張受抑，aba 促氣孔關閉減蒸散但也限制 co₂；\n\n### 原理拆解：為什麼會這樣？\n\n**先理解水勢與膨壓**\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n**由缺水到減產的連鎖**\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n**管理不是只問澆多少**\n\n應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。\n\n**先區分傷害種類與發生條件**\n\n乾旱、淹水、高溫、寒害、凍害與鹽害的起始機制不同。寒害可在冰點以上發生於敏感作物，凍害則涉及結冰；淹水即使土壤水多，也可能因缺氧而使根無法正常供水。\n\n**從細胞功能連到可見症狀**\n\n膜性質改變、活性氧增加、酵素與能量代謝受阻，最後表現萎凋、褐化、落花或生長停滯。短期氣孔關閉可節水，長期卻限制 co₂ 吸收；適應反應與傷害結果應分別說明。\n\n**預防與恢復管理各有時機**\n\n品種與產季選擇、灌排、覆蓋、通風遮陰及適度馴化可降低風險。受害後先評估根與生長點是否存活，再調整水肥；重施肥不能代替環境修復，受傷根系也可能無法利用增加的養分。\n\n### 可直接練寫的完整答案\n\n初期葉水勢下降、膨壓與擴張受抑，aba 促氣孔關閉減蒸散但也限制 co₂；\n\n嚴重時光合與膜受損、活性氧增加、花果脫落，品質及產量下降。選抗旱材料、適播期、深健根、覆蓋、滴灌與土壤含水監測，合理密度與肥量，避免在高耗水季形成高負載。\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n### 實例：把原理用在情境中\n\n旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。\n\n熱帶果菜低溫貯藏後可能出現凹陷、褐化與腐敗，而未曾結冰；應檢查該作物安全溫度與累積暴露時間，不能只把冷庫調得更冷。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：由早到晚生理、葉根花果、至少四管理及取捨。\n\n- **由早到晚生理**\n- **葉根花果**\n- **至少四管理及取捨**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把有水等同根一定能吸到水。\n- 把寒害與凍害當成同義詞。\n 105 蔬菜學"},{"id":"蔬菜學-105-五","s":"蔬菜學","y":105,"n":"五","t":"甘藍抗黑腐遠緣雜交","body":"<h2>第五題｜甘藍抗黑腐遠緣雜交（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>甘藍抗黑腐遠緣雜交<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=6\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>遠緣親本可有授粉不親和、花粉管生長失敗、胚乳／胚敗育與後代不稔，抗性導入亦可能連帶不良性狀。可換正反交、橋樑親本、花粉／胚珠操作及胚救援，必要倍加恢復配對，再回交保留甘藍品質，利用標誌與病原接種選抗並做多地試驗；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<p><strong>標誌提供基因型線索<\/strong><\/p>\n<p>分子標誌是可檢測的 DNA 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 MAS 與基因轉殖的操作與法規概念不同。<\/p>\n<p><strong>連鎖不等於永遠不分離<\/strong><\/p>\n<p>若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。<\/p>\n<p><strong>回交可兼顧前景與背景選拔<\/strong><\/p>\n<p>前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。MAS 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>遠緣親本可有授粉不親和、花粉管生長失敗、胚乳／胚敗育與後代不稔，抗性導入亦可能連帶不良性狀。可換正反交、橋樑親本、花粉／胚珠操作及胚救援，必要倍加恢復配對，再回交保留甘藍品質，利用標誌與病原接種選抗並做多地試驗；<\/p>\n<p>克服結實不等於已得到商用品種。<\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<p>抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：前後受精障礙、救援／倍加、回交選拔與抗性驗證。<\/p>\n<ul>\n<li><strong>前後受精障礙<\/strong><\/li>\n<li><strong>救援／倍加<\/strong><\/li>\n<li><strong>回交選拔與抗性驗證<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<li>把分子標誌說成施用後使植物產生抗性的藥劑。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=6","md":"105年蔬菜學_逐題教學詳解.md","search":"甘藍抗黑腐遠緣雜交 ## 第五題｜甘藍抗黑腐遠緣雜交（15 分）\n\n### 題意與作答範圍\n\n本題重點：**甘藍抗黑腐遠緣雜交**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=6)。\n\n### 先掌握答案\n\n遠緣親本可有授粉不親和、花粉管生長失敗、胚乳／胚敗育與後代不稔，抗性導入亦可能連帶不良性狀。可換正反交、橋樑親本、花粉／胚珠操作及胚救援，必要倍加恢復配對，再回交保留甘藍品質，利用標誌與病原接種選抗並做多地試驗；\n\n### 原理拆解：為什麼會這樣？\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n**標誌提供基因型線索**\n\n分子標誌是可檢測的 dna 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 mas 與基因轉殖的操作與法規概念不同。\n\n**連鎖不等於永遠不分離**\n\n若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。\n\n**回交可兼顧前景與背景選拔**\n\n前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。mas 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。\n\n### 可直接練寫的完整答案\n\n遠緣親本可有授粉不親和、花粉管生長失敗、胚乳／胚敗育與後代不稔，抗性導入亦可能連帶不良性狀。可換正反交、橋樑親本、花粉／胚珠操作及胚救援，必要倍加恢復配對，再回交保留甘藍品質，利用標誌與病原接種選抗並做多地試驗；\n\n克服結實不等於已得到商用品種。\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n### 實例：把原理用在情境中\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：前後受精障礙、救援／倍加、回交選拔與抗性驗證。\n\n- **前後受精障礙**\n- **救援／倍加**\n- **回交選拔與抗性驗證**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把轉入基因成功直接等同育成可商業化品種。\n- 把分子標誌說成施用後使植物產生抗性的藥劑。\n 105 蔬菜學"},{"id":"蔬菜學-105-六","s":"蔬菜學","y":105,"n":"六","t":"三種子名詞","body":"<h2>第六題｜三種子名詞（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>三種子名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=6\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Transplanting shock 移植休克，根傷與水分供需失衡造成暫時萎凋停長；<\/p>\n<p>hard seed 硬實種子，種皮不透水造成物理休眠，可適度破皮；<\/p>\n<p>thermodormancy 高溫誘發休眠，高溫使種子即使回較適溫仍可能暫不萌發，與只在高溫當下受抑制的熱抑制需區分。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>發芽率、活力與壽命要分開<\/strong><\/p>\n<p>發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。<\/p>\n<p><strong>劣化涉及膜與修復能力<\/strong><\/p>\n<p>貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。<\/p>\n<p><strong>保存與檢測依種子特性選擇<\/strong><\/p>\n<p>耐乾燥的正貯型種子通常可適度乾燥、低溫與防潮保存；不耐乾燥的種子不能照抄同法。發芽試驗、加速老化、導電度或低溫試驗各反映不同面向，須選適合作物的條件與標準。<\/p>\n<p><strong>健康與整齊度要從母本或種子源開始<\/strong><\/p>\n<p>母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。<\/p>\n<p><strong>育苗目標是可定植且恢復快<\/strong><\/p>\n<p>適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。<\/p>\n<p><strong>無菌培養後仍有馴化關卡<\/strong><\/p>\n<p>瓶內高濕、低光與外加糖可使幼苗角質層、氣孔及根功能與田間不同。出瓶須逐步調整光濕條件並防感染。組培倍率、出瓶存活率與成品率應分開計算，不能只用增殖數宣稱生產效率。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Transplanting shock 移植休克，根傷與水分供需失衡造成暫時萎凋停長；<\/p>\n<p>hard seed 硬實種子，種皮不透水造成物理休眠，可適度破皮；<\/p>\n<p>thermodormancy 高溫誘發休眠，高溫使種子即使回較適溫仍可能暫不萌發，與只在高溫當下受抑制的熱抑制需區分。<\/p>\n<p>發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>蔥種子貯藏後即使標準發芽率尚可，活力降低也可能使育苗出苗不整；先做活力或小規模出苗比較，比直接增加播種密度更能掌握苗數。<\/p>\n<p>蝴蝶蘭分生苗可用組織培養大量增殖，但需檢測母株病毒並控制培養代數；出瓶後先馴化，再依葉片與根系生長分級，不宜把瓶苗數直接當成上市盆花數。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：各 5 分，定義、原因與處理例。<\/p>\n<ul>\n<li><strong>各 5 分，定義<\/strong><\/li>\n<li><strong>原因與處理例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有未發芽種子都判為死亡，漏掉休眠。<\/li>\n<li>將組織培養視為自動消除所有病原。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=6","md":"105年蔬菜學_逐題教學詳解.md","search":"三種子名詞 ## 第六題｜三種子名詞（15 分）\n\n### 題意與作答範圍\n\n本題重點：**三種子名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=6)。\n\n### 先掌握答案\n\ntransplanting shock 移植休克，根傷與水分供需失衡造成暫時萎凋停長；\n\nhard seed 硬實種子，種皮不透水造成物理休眠，可適度破皮；\n\nthermodormancy 高溫誘發休眠，高溫使種子即使回較適溫仍可能暫不萌發，與只在高溫當下受抑制的熱抑制需區分。\n\n### 原理拆解：為什麼會這樣？\n\n**發芽率、活力與壽命要分開**\n\n發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。\n\n**劣化涉及膜與修復能力**\n\n貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。\n\n**保存與檢測依種子特性選擇**\n\n耐乾燥的正貯型種子通常可適度乾燥、低溫與防潮保存；不耐乾燥的種子不能照抄同法。發芽試驗、加速老化、導電度或低溫試驗各反映不同面向，須選適合作物的條件與標準。\n\n**健康與整齊度要從母本或種子源開始**\n\n母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。\n\n**育苗目標是可定植且恢復快**\n\n適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。\n\n**無菌培養後仍有馴化關卡**\n\n瓶內高濕、低光與外加糖可使幼苗角質層、氣孔及根功能與田間不同。出瓶須逐步調整光濕條件並防感染。組培倍率、出瓶存活率與成品率應分開計算，不能只用增殖數宣稱生產效率。\n\n### 可直接練寫的完整答案\n\ntransplanting shock 移植休克，根傷與水分供需失衡造成暫時萎凋停長；\n\nhard seed 硬實種子，種皮不透水造成物理休眠，可適度破皮；\n\nthermodormancy 高溫誘發休眠，高溫使種子即使回較適溫仍可能暫不萌發，與只在高溫當下受抑制的熱抑制需區分。\n\n發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。\n\n### 實例：把原理用在情境中\n\n蔥種子貯藏後即使標準發芽率尚可，活力降低也可能使育苗出苗不整；先做活力或小規模出苗比較，比直接增加播種密度更能掌握苗數。\n\n蝴蝶蘭分生苗可用組織培養大量增殖，但需檢測母株病毒並控制培養代數；出瓶後先馴化，再依葉片與根系生長分級，不宜把瓶苗數直接當成上市盆花數。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：各 5 分，定義、原因與處理例。\n\n- **各 5 分，定義**\n- **原因與處理例**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有未發芽種子都判為死亡，漏掉休眠。\n- 將組織培養視為自動消除所有病原。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 105 蔬菜學"},{"id":"蔬菜學-105-七","s":"蔬菜學","y":105,"n":"七","t":"轉殖茄子英文翻譯","body":"<h2>第七題｜轉殖茄子英文翻譯（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>轉殖茄子英文翻譯<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=6\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。<\/p>\n<h3>完整參考譯文<\/h3>\n<p>研究藉導入 iaaM 基因，調控果實發育期間的生長素含量，育成具有單為結果果實的轉殖茄子。這些茄子在沒有授粉、也不外施植物荷爾蒙的情況下，仍可形成無子單為果，甚至在通常會抑制非轉殖品系結果的低溫下亦如此。在未加溫玻璃溫室試驗中，其冬季產量顯著高於非轉殖植株與一個商業雜交種。露地夏作與溫室早春試驗也確認，轉殖單為結果 F1 相較未轉殖對照兼有更高生產量與改善的果品質。<\/p>\n<h3>讀懂這段研究在說什麼<\/h3>\n<p><strong>單為結果的形成與試驗比較<\/strong><\/p>\n<p>因果鏈是導入 iaaM、改變果實發育部位的生長素狀態，再比較是否能在未授粉與低溫下結果。單為結果是機制，無子是觀察結果；不能把「不外施激素」譯成植物內部完全沒有激素。對照組與正常條件必須保留，否則容易把特定品系結果擴張成全部茄子皆如此。<\/p>\n<h3>專業詞彙與翻譯辨析<\/h3>\n<table>\n<thead>\n<tr>\n<th>英文用語<\/th>\n<th>建議譯法<\/th>\n<th>讀法與限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>parthenocarpy<\/td>\n<td>單為結果<\/td>\n<td>未經受精形成果實<\/td>\n<\/tr>\n<tr>\n<td>auxin<\/td>\n<td>生長素<\/td>\n<td>植物激素類別，不等同泛稱所有荷爾蒙<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>配分重點與檢查順序<\/h3>\n<p>10 分：iaaM／生長素、無授粉無外施、低溫、三試驗與對照。<\/p>\n<p>先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。<\/p>\n<h3>常見失分<\/h3>\n<ul>\n<li>把專業名詞按一般字義翻譯，或把相關性改成因果。<\/li>\n<li>省略轉折、條件或限制，使研究結論比原文更強。<\/li>\n<li>以摘要取代全文翻譯。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=6","md":"105年蔬菜學_逐題教學詳解.md","search":"轉殖茄子英文翻譯 ## 第七題｜轉殖茄子英文翻譯（10 分）\n\n### 題意與作答範圍\n\n本題重點：**轉殖茄子英文翻譯**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=6)。\n\n### 先掌握答案\n\n這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。\n\n### 完整參考譯文\n\n研究藉導入 iaam 基因，調控果實發育期間的生長素含量，育成具有單為結果果實的轉殖茄子。這些茄子在沒有授粉、也不外施植物荷爾蒙的情況下，仍可形成無子單為果，甚至在通常會抑制非轉殖品系結果的低溫下亦如此。在未加溫玻璃溫室試驗中，其冬季產量顯著高於非轉殖植株與一個商業雜交種。露地夏作與溫室早春試驗也確認，轉殖單為結果 f1 相較未轉殖對照兼有更高生產量與改善的果品質。\n\n### 讀懂這段研究在說什麼\n\n**單為結果的形成與試驗比較**\n\n因果鏈是導入 iaam、改變果實發育部位的生長素狀態，再比較是否能在未授粉與低溫下結果。單為結果是機制，無子是觀察結果；不能把「不外施激素」譯成植物內部完全沒有激素。對照組與正常條件必須保留，否則容易把特定品系結果擴張成全部茄子皆如此。\n\n### 專業詞彙與翻譯辨析\n\n| 英文用語 | 建議譯法 | 讀法與限制 |\n| --- | --- | --- |\n| parthenocarpy | 單為結果 | 未經受精形成果實 |\n| auxin | 生長素 | 植物激素類別，不等同泛稱所有荷爾蒙 |\n\n### 配分重點與檢查順序\n\n10 分：iaam／生長素、無授粉無外施、低溫、三試驗與對照。\n\n先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。\n\n### 常見失分\n\n- 把專業名詞按一般字義翻譯，或把相關性改成因果。\n- 省略轉折、條件或限制，使研究結論比原文更強。\n- 以摘要取代全文翻譯。\n 105 蔬菜學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
