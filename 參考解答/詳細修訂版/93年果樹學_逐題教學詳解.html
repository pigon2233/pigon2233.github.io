ls{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 7 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"果樹學-93-一","s":"果樹學","y":93,"n":"一","t":"五名詞","body":"<h2>第一題｜五名詞（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=40\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>LAI 葉面積指數＝單位地面上的單面葉面積／地面積；<\/p>\n<p>critical concentration 礦養臨界濃度為足以支持指定相對產量的組織濃度邊界，常以約 90–95% 最大生長定義；<\/p>\n<p>sink/source 庫／源；<\/p>\n<p>RQ 呼吸商＝CO₂ 產生／O₂ 消耗莫耳比；<\/p>\n<p>園藝成熟為符合特定用途的採收狀態。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把源與庫接起來<\/strong><\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<p><strong>壓力流與跨膜運輸不是同一層次<\/strong><\/p>\n<p>源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；H⁺-ATPase 建立電化學梯度，可支援 H⁺／蔗糖共運輸。<\/p>\n<p><strong>庫強決定競爭，不只看果實大小<\/strong><\/p>\n<p>庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>RQ 呼吸商＝CO₂ 產生／O₂ 消耗莫耳比；<\/td>\n<td>RQ＝放出 CO₂ 莫耳數／消耗 O₂ 莫耳數；它是比例，不能作為呼吸強度的同義詞。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>LAI 葉面積指數＝單位地面上的單面葉面積／地面積；<\/p>\n<p>critical concentration 礦養臨界濃度為足以支持指定相對產量的組織濃度邊界，常以約 90–95% 最大生長定義；<\/p>\n<p>sink/source 庫／源；<\/p>\n<p>RQ 呼吸商＝CO₂ 產生／O₂ 消耗莫耳比；<\/p>\n<p>園藝成熟為符合特定用途的採收狀態。<\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：每項定義、式或用途。<\/p>\n<ul>\n<li><strong>每項定義<\/strong><\/li>\n<li><strong>式或用途<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把長距離糖運輸寫成主要沿木質部。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=40","md":"93年果樹學_逐題教學詳解.md","search":"五名詞 ## 第一題｜五名詞（10 分）\n\n### 題意與作答範圍\n\n本題重點：**五名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=40)。\n\n### 先掌握答案\n\nlai 葉面積指數＝單位地面上的單面葉面積／地面積；\n\ncritical concentration 礦養臨界濃度為足以支持指定相對產量的組織濃度邊界，常以約 90–95% 最大生長定義；\n\nsink/source 庫／源；\n\nrq 呼吸商＝co₂ 產生／o₂ 消耗莫耳比；\n\n園藝成熟為符合特定用途的採收狀態。\n\n### 原理拆解：為什麼會這樣？\n\n**先把源與庫接起來**\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n**壓力流與跨膜運輸不是同一層次**\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n**庫強決定競爭，不只看果實大小**\n\n庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| rq 呼吸商＝co₂ 產生／o₂ 消耗莫耳比； | rq＝放出 co₂ 莫耳數／消耗 o₂ 莫耳數；它是比例，不能作為呼吸強度的同義詞。 |\n\n### 可直接練寫的完整答案\n\nlai 葉面積指數＝單位地面上的單面葉面積／地面積；\n\ncritical concentration 礦養臨界濃度為足以支持指定相對產量的組織濃度邊界，常以約 90–95% 最大生長定義；\n\nsink/source 庫／源；\n\nrq 呼吸商＝co₂ 產生／o₂ 消耗莫耳比；\n\n園藝成熟為符合特定用途的採收狀態。\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n### 實例：把原理用在情境中\n\n同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：每項定義、式或用途。\n\n- **每項定義**\n- **式或用途**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把長距離糖運輸寫成主要沿木質部。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 93 果樹學"},{"id":"果樹學-93-二","s":"果樹學","y":93,"n":"二","t":"氮吸收同化與品質","body":"<h2>第二題｜氮吸收同化與品質（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>氮吸收同化與品質<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=40\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>主要吸收 NO₃⁻ 及 NH₄⁺，NO₃⁻ 經硝酸還原酶、亞硝酸還原酶還原為銨，再經 GS/GOGAT 形成胺基酸，銨亦可直接進該途徑。缺氮生長與葉面積低、果小及產量差；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>氮為何促進營養生長<\/strong><\/p>\n<p>氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。<\/p>\n<p><strong>吸收氮不等於已同化<\/strong><\/p>\n<p>根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 GS/GOGAT 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。<\/p>\n<p><strong>形式、總量與時期一起決定結果<\/strong><\/p>\n<p>銨態並非不好，但根域容量小、緩衝弱時，過量銨容易酸化、毒害及拮抗鈣鉀鎂。果實期又須避免過氮徒長、陰蔽與品質下降。因此應依土水、光量、生育需求分次施肥，而不是只選一個氮形式就認為問題解決。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>主要吸收 NO₃⁻ 及 NH₄⁺，NO₃⁻ 經硝酸還原酶、亞硝酸還原酶還原為銨，再經 GS/GOGAT 形成胺基酸，銨亦可直接進該途徑。缺氮生長與葉面積低、果小及產量差；<\/p>\n<p>過氮徒長、遮蔭、著色與糖度及耐貯性下降，可能延遲成熟並增加病害。<\/p>\n<p>氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。<\/p>\n<p>根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 GS/GOGAT 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>番茄結果後期若高氨加上灌溉不穩，果端鈣供應更易失衡；改硝態為主仍須同時控制總氮、供水與根活力，才能有效降低風險。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：兩吸收型、兩還原與 GS/GOGAT、過少過多及果實例。<\/p>\n<ul>\n<li><strong>兩吸收型<\/strong><\/li>\n<li><strong>兩還原與 GS/GOGAT<\/strong><\/li>\n<li><strong>過少過多及果實例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把硝酸鹽累積說成所有氮都完全不能被利用。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=40","md":"93年果樹學_逐題教學詳解.md","search":"氮吸收同化與品質 ## 第二題｜氮吸收同化與品質（15 分）\n\n### 題意與作答範圍\n\n本題重點：**氮吸收同化與品質**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=40)。\n\n### 先掌握答案\n\n主要吸收 no₃⁻ 及 nh₄⁺，no₃⁻ 經硝酸還原酶、亞硝酸還原酶還原為銨，再經 gs/gogat 形成胺基酸，銨亦可直接進該途徑。缺氮生長與葉面積低、果小及產量差；\n\n### 原理拆解：為什麼會這樣？\n\n**氮為何促進營養生長**\n\n氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。\n\n**吸收氮不等於已同化**\n\n根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 gs/gogat 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。\n\n**形式、總量與時期一起決定結果**\n\n銨態並非不好，但根域容量小、緩衝弱時，過量銨容易酸化、毒害及拮抗鈣鉀鎂。果實期又須避免過氮徒長、陰蔽與品質下降。因此應依土水、光量、生育需求分次施肥，而不是只選一個氮形式就認為問題解決。\n\n### 可直接練寫的完整答案\n\n主要吸收 no₃⁻ 及 nh₄⁺，no₃⁻ 經硝酸還原酶、亞硝酸還原酶還原為銨，再經 gs/gogat 形成胺基酸，銨亦可直接進該途徑。缺氮生長與葉面積低、果小及產量差；\n\n過氮徒長、遮蔭、著色與糖度及耐貯性下降，可能延遲成熟並增加病害。\n\n氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。\n\n根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 gs/gogat 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。\n\n### 實例：把原理用在情境中\n\n番茄結果後期若高氨加上灌溉不穩，果端鈣供應更易失衡；改硝態為主仍須同時控制總氮、供水與根活力，才能有效降低風險。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：兩吸收型、兩還原與 gs/gogat、過少過多及果實例。\n\n- **兩吸收型**\n- **兩還原與 gs/gogat**\n- **過少過多及果實例**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把硝酸鹽累積說成所有氮都完全不能被利用。\n 93 果樹學"},{"id":"果樹學-93-三","s":"果樹學","y":93,"n":"三","t":"行株配置與密植","body":"<h2>第三題｜行株配置與密植（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>行株配置與密植<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=40\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>行向應兼顧日照、坡地保土、風向與機械作業，配置授粉樹、道路灌排，行株距依樹種砧木與成冠大小。密植可早期提高截光與土地產量，缺點是冠閉後陰蔽、競爭、病害及管理費高，需矮化整枝與適當間伐／更新計畫。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>產量要以單位土地和有效葉面積看<\/strong><\/p>\n<p>大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。<\/p>\n<p><strong>整枝、修剪和負載互相制約<\/strong><\/p>\n<p>整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。<\/p>\n<p><strong>矮化與密植的效益有條件<\/strong><\/p>\n<p>矮砧、低幹與細長冠可早形成土地有效葉面積、方便作業，且減大型骨架消耗；但過密仍會陰蔽、著色差與病害。支架、灌溉、疏果及持續更新是技術成本，不應只列早產優點。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>行向應兼顧日照、坡地保土、風向與機械作業，配置授粉樹、道路灌排，行株距依樹種砧木與成冠大小。密植可早期提高截光與土地產量，缺點是冠閉後陰蔽、競爭、病害及管理費高，需矮化整枝與適當間伐／更新計畫。<\/p>\n<p>大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。<\/p>\n<p>整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>矮砧蘋果密植常可提高早期每公頃產量，即使單株產量較低；若後期冠層封閉卻不調枝，早期優勢會被陰蔽與品質下降抵銷。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：配置因素、授粉作業、密植優缺及對策。<\/p>\n<ul>\n<li><strong>配置因素<\/strong><\/li>\n<li><strong>授粉作業<\/strong><\/li>\n<li><strong>密植優缺及對策<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把修剪一律理解為越重越好。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=40","md":"93年果樹學_逐題教學詳解.md","search":"行株配置與密植 ## 第三題｜行株配置與密植（15 分）\n\n### 題意與作答範圍\n\n本題重點：**行株配置與密植**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=40)。\n\n### 先掌握答案\n\n行向應兼顧日照、坡地保土、風向與機械作業，配置授粉樹、道路灌排，行株距依樹種砧木與成冠大小。密植可早期提高截光與土地產量，缺點是冠閉後陰蔽、競爭、病害及管理費高，需矮化整枝與適當間伐／更新計畫。\n\n### 原理拆解：為什麼會這樣？\n\n**產量要以單位土地和有效葉面積看**\n\n大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。\n\n**整枝、修剪和負載互相制約**\n\n整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。\n\n**矮化與密植的效益有條件**\n\n矮砧、低幹與細長冠可早形成土地有效葉面積、方便作業，且減大型骨架消耗；但過密仍會陰蔽、著色差與病害。支架、灌溉、疏果及持續更新是技術成本，不應只列早產優點。\n\n### 可直接練寫的完整答案\n\n行向應兼顧日照、坡地保土、風向與機械作業，配置授粉樹、道路灌排，行株距依樹種砧木與成冠大小。密植可早期提高截光與土地產量，缺點是冠閉後陰蔽、競爭、病害及管理費高，需矮化整枝與適當間伐／更新計畫。\n\n大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。\n\n整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。\n\n### 實例：把原理用在情境中\n\n矮砧蘋果密植常可提高早期每公頃產量，即使單株產量較低；若後期冠層封閉卻不調枝，早期優勢會被陰蔽與品質下降抵銷。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：配置因素、授粉作業、密植優缺及對策。\n\n- **配置因素**\n- **授粉作業**\n- **密植優缺及對策**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把修剪一律理解為越重越好。\n 93 果樹學"},{"id":"果樹學-93-四","s":"果樹學","y":93,"n":"四","t":"打頂與摘心","body":"<h2>第四題｜打頂與摘心（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>打頂與摘心<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=40\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>摘心多只去柔嫩梢尖與少量幼葉，破頂端優勢、促就近側芽，較保留葉面積；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>產量要以單位土地和有效葉面積看<\/strong><\/p>\n<p>大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。<\/p>\n<p><strong>整枝、修剪和負載互相制約<\/strong><\/p>\n<p>整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。<\/p>\n<p><strong>矮化與密植的效益有條件<\/strong><\/p>\n<p>矮砧、低幹與細長冠可早形成土地有效葉面積、方便作業，且減大型骨架消耗；但過密仍會陰蔽、著色差與病害。支架、灌溉、疏果及持續更新是技術成本，不應只列早產優點。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>摘心多只去柔嫩梢尖與少量幼葉，破頂端優勢、促就近側芽，較保留葉面積；<\/p>\n<p>打頂通常去除較長或較成熟梢段，對樹冠高度、枝數與同化物影響較大，可能促強旺再生梢並延後結果。二者為程度與部位差異，操作時期及物種決定結果。<\/p>\n<p>大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。<\/p>\n<p>整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>矮砧蘋果密植常可提高早期每公頃產量，即使單株產量較低；若後期冠層封閉卻不調枝，早期優勢會被陰蔽與品質下降抵銷。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：切除部位、頂端優勢、再萌芽及生殖影響。<\/p>\n<ul>\n<li><strong>切除部位<\/strong><\/li>\n<li><strong>頂端優勢<\/strong><\/li>\n<li><strong>再萌芽及生殖影響<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把修剪一律理解為越重越好。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=40","md":"93年果樹學_逐題教學詳解.md","search":"打頂與摘心 ## 第四題｜打頂與摘心（10 分）\n\n### 題意與作答範圍\n\n本題重點：**打頂與摘心**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=40)。\n\n### 先掌握答案\n\n摘心多只去柔嫩梢尖與少量幼葉，破頂端優勢、促就近側芽，較保留葉面積；\n\n### 原理拆解：為什麼會這樣？\n\n**產量要以單位土地和有效葉面積看**\n\n大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。\n\n**整枝、修剪和負載互相制約**\n\n整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。\n\n**矮化與密植的效益有條件**\n\n矮砧、低幹與細長冠可早形成土地有效葉面積、方便作業，且減大型骨架消耗；但過密仍會陰蔽、著色差與病害。支架、灌溉、疏果及持續更新是技術成本，不應只列早產優點。\n\n### 可直接練寫的完整答案\n\n摘心多只去柔嫩梢尖與少量幼葉，破頂端優勢、促就近側芽，較保留葉面積；\n\n打頂通常去除較長或較成熟梢段，對樹冠高度、枝數與同化物影響較大，可能促強旺再生梢並延後結果。二者為程度與部位差異，操作時期及物種決定結果。\n\n大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。\n\n整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。\n\n### 實例：把原理用在情境中\n\n矮砧蘋果密植常可提高早期每公頃產量，即使單株產量較低；若後期冠層封閉卻不調枝，早期優勢會被陰蔽與品質下降抵銷。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：切除部位、頂端優勢、再萌芽及生殖影響。\n\n- **切除部位**\n- **頂端優勢**\n- **再萌芽及生殖影響**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把修剪一律理解為越重越好。\n 93 果樹學"},{"id":"果樹學-93-五","s":"果樹學","y":93,"n":"五","t":"DNA 標誌用於果樹","body":"<h2>第五題｜DNA 標誌用於果樹（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>DNA 標誌用於果樹<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=40\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>以 SSR、SNP 等鑑別品種親緣與真偽、建立遺傳圖譜，追蹤抗病、果色或性別等基因，進行幼苗早選、回交背景選擇與基因聚合。可減少多年培養無用後代的成本，但連鎖重組與環境作用使果品質仍須表型試驗。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>標誌提供基因型線索<\/strong><\/p>\n<p>分子標誌是可檢測的 DNA 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 MAS 與基因轉殖的操作與法規概念不同。<\/p>\n<p><strong>連鎖不等於永遠不分離<\/strong><\/p>\n<p>若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。<\/p>\n<p><strong>回交可兼顧前景與背景選拔<\/strong><\/p>\n<p>前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。MAS 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。<\/p>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>以 SSR、SNP 等鑑別品種親緣與真偽、建立遺傳圖譜，追蹤抗病、果色或性別等基因，進行幼苗早選、回交背景選擇與基因聚合。可減少多年培養無用後代的成本，但連鎖重組與環境作用使果品質仍須表型試驗。<\/p>\n<p>分子標誌是可檢測的 DNA 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 MAS 與基因轉殖的操作與法規概念不同。<\/p>\n<p>若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。<\/p>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：鑑定、圖譜與早選、具名性狀及限制。<\/p>\n<ul>\n<li><strong>圖譜與早選<\/strong><\/li>\n<li><strong>具名性狀及限制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把分子標誌說成施用後使植物產生抗性的藥劑。<\/li>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=40","md":"93年果樹學_逐題教學詳解.md","search":"dna 標誌用於果樹 ## 第五題｜dna 標誌用於果樹（10 分）\n\n### 題意與作答範圍\n\n本題重點：**dna 標誌用於果樹**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=40)。\n\n### 先掌握答案\n\n以 ssr、snp 等鑑別品種親緣與真偽、建立遺傳圖譜，追蹤抗病、果色或性別等基因，進行幼苗早選、回交背景選擇與基因聚合。可減少多年培養無用後代的成本，但連鎖重組與環境作用使果品質仍須表型試驗。\n\n### 原理拆解：為什麼會這樣？\n\n**標誌提供基因型線索**\n\n分子標誌是可檢測的 dna 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 mas 與基因轉殖的操作與法規概念不同。\n\n**連鎖不等於永遠不分離**\n\n若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。\n\n**回交可兼顧前景與背景選拔**\n\n前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。mas 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n### 可直接練寫的完整答案\n\n以 ssr、snp 等鑑別品種親緣與真偽、建立遺傳圖譜，追蹤抗病、果色或性別等基因，進行幼苗早選、回交背景選擇與基因聚合。可減少多年培養無用後代的成本，但連鎖重組與環境作用使果品質仍須表型試驗。\n\n分子標誌是可檢測的 dna 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 mas 與基因轉殖的操作與法規概念不同。\n\n若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。\n\n### 實例：把原理用在情境中\n\n抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：鑑定、圖譜與早選、具名性狀及限制。\n\n- **圖譜與早選**\n- **具名性狀及限制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把分子標誌說成施用後使植物產生抗性的藥劑。\n- 把轉入基因成功直接等同育成可商業化品種。\n 93 果樹學"},{"id":"果樹學-93-六","s":"果樹學","y":93,"n":"六","t":"WTO 後產業調整","body":"<h2>第六題｜WTO 後產業調整（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>WTO 後產業調整<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=40\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>以題目當年進口競爭背景，提升品質與品牌、採共同分級冷鏈降低成本，選育特色耐運品種與調節產期，拓展外銷及加工／休閒多元收入，改善老園與勞力機械化。對競爭力弱且生態敏感產區宜輔導轉作與保育；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<p><strong>為何採後仍會變差<\/strong><\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p><strong>低溫有效，但有適用範圍<\/strong><\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<p><strong>把全程串起來<\/strong><\/p>\n<p>採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>以題目當年進口競爭背景，提升品質與品牌、採共同分級冷鏈降低成本，選育特色耐運品種與調節產期，拓展外銷及加工／休閒多元收入，改善老園與勞力機械化。對競爭力弱且生態敏感產區宜輔導轉作與保育；<\/p>\n<p>以資訊、契作及追溯穩供，不能只以補貼擴產。<\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<p>驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：生產成本品質、市場、組織、產區調整與永續。<\/p>\n<ul>\n<li><strong>生產成本品質<\/strong><\/li>\n<li><strong>產區調整與永續<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<li>認為溫度越低、保存效果一定越好。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=40","md":"93年果樹學_逐題教學詳解.md","search":"wto 後產業調整 ## 第六題｜wto 後產業調整（15 分）\n\n### 題意與作答範圍\n\n本題重點：**wto 後產業調整**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=40)。\n\n### 先掌握答案\n\n以題目當年進口競爭背景，提升品質與品牌、採共同分級冷鏈降低成本，選育特色耐運品種與調節產期，拓展外銷及加工／休閒多元收入，改善老園與勞力機械化。對競爭力弱且生態敏感產區宜輔導轉作與保育；\n\n### 原理拆解：為什麼會這樣？\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n**為何採後仍會變差**\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n**低溫有效，但有適用範圍**\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n**把全程串起來**\n\n採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。\n\n### 可直接練寫的完整答案\n\n以題目當年進口競爭背景，提升品質與品牌、採共同分級冷鏈降低成本，選育特色耐運品種與調節產期，拓展外銷及加工／休閒多元收入，改善老園與勞力機械化。對競爭力弱且生態敏感產區宜輔導轉作與保育；\n\n以資訊、契作及追溯穩供，不能只以補貼擴產。\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n### 實例：把原理用在情境中\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：生產成本品質、市場、組織、產區調整與永續。\n\n- **生產成本品質**\n- **產區調整與永續**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把轉入基因成功直接等同育成可商業化品種。\n- 認為溫度越低、保存效果一定越好。\n 93 果樹學"},{"id":"果樹學-93-七","s":"果樹學","y":93,"n":"七","t":"五項採後處理","body":"<h2>第七題｜五項採後處理（25 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五項採後處理<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=40\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>分級按大小、成熟與瑕疵分群，便標準定價與一致處理；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先分清預冷與冷藏<\/strong><\/p>\n<p>採收時產品常接近田間溫度；若只把大量溫熱貨物放進冷庫，外層先冷、箱內與果心仍熱，呼吸及失水會持續。預冷的目標是迅速降低產品溫度，冷藏則是把已降溫的產品維持在適溫，兩者目的與設備負荷不同。<\/p>\n<p><strong>冷得快，必須讓熱有出口<\/strong><\/p>\n<p>壓差預冷靠風扇建立壓差，迫使冷空氣穿過箱孔與產品間隙；箱孔不對齊或氣流短路時，庫溫低也不代表果心降得快。水冷以冷水接觸傳熱，但要控制水質與交叉污染。真空預冷則降低氣壓，使組織水分在低溫蒸發，帶走潛熱。<\/p>\n<p><strong>依器官結構選方法<\/strong><\/p>\n<p>葉菜表面積相對大，真空法常有效；大果實的果心熱須先傳到外層，表皮又限制蒸發，因此真空法可能慢且失重。方法選定後，還須量果心或代表部位溫度，訂冷卻終點，而不是只記處理分鐘。<\/p>\n<p><strong>為何採後仍會變差<\/strong><\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p><strong>低溫有效，但有適用範圍<\/strong><\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<p><strong>把全程串起來<\/strong><\/p>\n<p>採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>分級按大小、成熟與瑕疵分群，便標準定價與一致處理；<\/p>\n<p>整修去枯傷葉梗或不需要部分，減污染及體積；<\/p>\n<p>塗蠟補表皮屏障減失水、增外觀，但過厚可阻氣致異味；<\/p>\n<p>預冷迅速移田間熱；<\/p>\n<p>癒傷讓傷口形成木栓／保護層，如甘藷、馬鈴薯，須適合溫濕度及通風，不是所有水果都通用。<\/p>\n<p>採收時產品常接近田間溫度；若只把大量溫熱貨物放進冷庫，外層先冷、箱內與果心仍熱，呼吸及失水會持續。預冷的目標是迅速降低產品溫度，冷藏則是把已降溫的產品維持在適溫，兩者目的與設備負荷不同。<\/p>\n<p>壓差預冷靠風扇建立壓差，迫使冷空氣穿過箱孔與產品間隙；箱孔不對齊或氣流短路時，庫溫低也不代表果心降得快。水冷以冷水接觸傳熱，但要控制水質與交叉污染。真空預冷則降低氣壓，使組織水分在低溫蒸發，帶走潛熱。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>包裝場可將同一箱產品放置多點溫度計，畫降溫曲線，比較箱心與外側。這能檢查通氣孔、堆裝與風量是否合適，也可同時量失重，避免用犧牲水分換取冷卻速度。<\/p>\n<p>驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。<\/p>\n<table>\n<thead>\n<tr>\n<th>方法<\/th>\n<th>主要傳熱機制<\/th>\n<th>判斷重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>房冷<\/td>\n<td>自然或一般循環冷空氣<\/td>\n<td>便宜但箱心降溫較慢<\/td>\n<\/tr>\n<tr>\n<td>壓差<\/td>\n<td>強制冷氣穿箱<\/td>\n<td>箱孔與氣流路徑<\/td>\n<\/tr>\n<tr>\n<td>水冷<\/td>\n<td>冷水接觸傳熱<\/td>\n<td>耐水性與水衛生<\/td>\n<\/tr>\n<tr>\n<td>真空<\/td>\n<td>減壓蒸發吸熱<\/td>\n<td>表面積、失水與器官構造<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>25 分：每項目的、機制、作物例及限制各約 5 分。<\/p>\n<ul>\n<li><strong>每項目的<\/strong><\/li>\n<li><strong>作物例及限制各約 5 分<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把預冷寫成單純放進冰箱，沒有交代移除田間熱。<\/li>\n<li>認為溫度越低、保存效果一定越好。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=40","md":"93年果樹學_逐題教學詳解.md","search":"五項採後處理 ## 第七題｜五項採後處理（25 分）\n\n### 題意與作答範圍\n\n本題重點：**五項採後處理**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=40)。\n\n### 先掌握答案\n\n分級按大小、成熟與瑕疵分群，便標準定價與一致處理；\n\n### 原理拆解：為什麼會這樣？\n\n**先分清預冷與冷藏**\n\n採收時產品常接近田間溫度；若只把大量溫熱貨物放進冷庫，外層先冷、箱內與果心仍熱，呼吸及失水會持續。預冷的目標是迅速降低產品溫度，冷藏則是把已降溫的產品維持在適溫，兩者目的與設備負荷不同。\n\n**冷得快，必須讓熱有出口**\n\n壓差預冷靠風扇建立壓差，迫使冷空氣穿過箱孔與產品間隙；箱孔不對齊或氣流短路時，庫溫低也不代表果心降得快。水冷以冷水接觸傳熱，但要控制水質與交叉污染。真空預冷則降低氣壓，使組織水分在低溫蒸發，帶走潛熱。\n\n**依器官結構選方法**\n\n葉菜表面積相對大，真空法常有效；大果實的果心熱須先傳到外層，表皮又限制蒸發，因此真空法可能慢且失重。方法選定後，還須量果心或代表部位溫度，訂冷卻終點，而不是只記處理分鐘。\n\n**為何採後仍會變差**\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n**低溫有效，但有適用範圍**\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n**把全程串起來**\n\n採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。\n\n### 可直接練寫的完整答案\n\n分級按大小、成熟與瑕疵分群，便標準定價與一致處理；\n\n整修去枯傷葉梗或不需要部分，減污染及體積；\n\n塗蠟補表皮屏障減失水、增外觀，但過厚可阻氣致異味；\n\n預冷迅速移田間熱；\n\n癒傷讓傷口形成木栓／保護層，如甘藷、馬鈴薯，須適合溫濕度及通風，不是所有水果都通用。\n\n採收時產品常接近田間溫度；若只把大量溫熱貨物放進冷庫，外層先冷、箱內與果心仍熱，呼吸及失水會持續。預冷的目標是迅速降低產品溫度，冷藏則是把已降溫的產品維持在適溫，兩者目的與設備負荷不同。\n\n壓差預冷靠風扇建立壓差，迫使冷空氣穿過箱孔與產品間隙；箱孔不對齊或氣流短路時，庫溫低也不代表果心降得快。水冷以冷水接觸傳熱，但要控制水質與交叉污染。真空預冷則降低氣壓，使組織水分在低溫蒸發，帶走潛熱。\n\n### 實例：把原理用在情境中\n\n包裝場可將同一箱產品放置多點溫度計，畫降溫曲線，比較箱心與外側。這能檢查通氣孔、堆裝與風量是否合適，也可同時量失重，避免用犧牲水分換取冷卻速度。\n\n驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。\n\n| 方法 | 主要傳熱機制 | 判斷重點 |\n| --- | --- | --- |\n| 房冷 | 自然或一般循環冷空氣 | 便宜但箱心降溫較慢 |\n| 壓差 | 強制冷氣穿箱 | 箱孔與氣流路徑 |\n| 水冷 | 冷水接觸傳熱 | 耐水性與水衛生 |\n| 真空 | 減壓蒸發吸熱 | 表面積、失水與器官構造 |\n\n### 配分重點：哪些內容不能漏？\n\n25 分：每項目的、機制、作物例及限制各約 5 分。\n\n- **每項目的**\n- **作物例及限制各約 5 分**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把預冷寫成單純放進冰箱，沒有交代移除田間熱。\n- 認為溫度越低、保存效果一定越好。\n 93 果樹學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
