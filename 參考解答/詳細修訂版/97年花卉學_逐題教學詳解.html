ls{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 6 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"花卉學-97-一","s":"花卉學","y":97,"n":"一","t":"優良培養土","body":"<h2>第一題｜優良培養土（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>優良培養土<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=29\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>良好水氣比、保水與排水、穩定孔隙及適當重量，具適合 pH 與 EC、養分緩衝、易潤濕、清潔無病草毒害；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>根需要水，也需要氧<\/strong><\/p>\n<p>介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。<\/p>\n<p><strong>化學性質會改變肥培結果<\/strong><\/p>\n<p>pH 影響元素溶解與有效性，EC 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 EC 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；pH 與 EC 是不同指標，不能相互替代。<\/p>\n<p><strong>配方應可重複而且衛生<\/strong><\/p>\n<p>選擇穩定、無病原與雜草種子、粒徑一致的材料，混合後實測保水、通氣、pH 及 EC。泥炭、椰纖、樹皮等有機材料會分解或吸附養分；珍珠石等材料的作用也受比例與粒徑影響，配方必須搭配灌肥管理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>良好水氣比、保水與排水、穩定孔隙及適當重量，具適合 pH 與 EC、養分緩衝、易潤濕、清潔無病草毒害；<\/p>\n<p>材料均一、來源穩定且經濟。須依作物及灌溉選配，蘭花與短期穴盤草花不能完全同配方。<\/p>\n<p>介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。<\/p>\n<p>pH 影響元素溶解與有效性，EC 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 EC 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；pH 與 EC 是不同指標，不能相互替代。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一泥炭與珍珠石配方用於矮盆時，底部飽和區占比可能較高；若又照高盆的頻率灌水，根部缺氧風險便增加。應從盆器與水分實測修正，而非只換肥料。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：物理、化學、生物、管理與經濟各面向。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無土介質寫成完全不含有機物。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=29","md":"97年花卉學_逐題教學詳解.md","search":"優良培養土 ## 第一題｜優良培養土（15 分）\n\n### 題意與作答範圍\n\n本題重點：**優良培養土**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=29)。\n\n### 先掌握答案\n\n良好水氣比、保水與排水、穩定孔隙及適當重量，具適合 ph 與 ec、養分緩衝、易潤濕、清潔無病草毒害；\n\n### 原理拆解：為什麼會這樣？\n\n**根需要水，也需要氧**\n\n介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。\n\n**化學性質會改變肥培結果**\n\nph 影響元素溶解與有效性，ec 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 ec 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；ph 與 ec 是不同指標，不能相互替代。\n\n**配方應可重複而且衛生**\n\n選擇穩定、無病原與雜草種子、粒徑一致的材料，混合後實測保水、通氣、ph 及 ec。泥炭、椰纖、樹皮等有機材料會分解或吸附養分；珍珠石等材料的作用也受比例與粒徑影響，配方必須搭配灌肥管理。\n\n### 可直接練寫的完整答案\n\n良好水氣比、保水與排水、穩定孔隙及適當重量，具適合 ph 與 ec、養分緩衝、易潤濕、清潔無病草毒害；\n\n材料均一、來源穩定且經濟。須依作物及灌溉選配，蘭花與短期穴盤草花不能完全同配方。\n\n介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。\n\nph 影響元素溶解與有效性，ec 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 ec 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；ph 與 ec 是不同指標，不能相互替代。\n\n### 實例：把原理用在情境中\n\n同一泥炭與珍珠石配方用於矮盆時，底部飽和區占比可能較高；若又照高盆的頻率灌水，根部缺氧風險便增加。應從盆器與水分實測修正，而非只換肥料。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：物理、化學、生物、管理與經濟各面向。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無土介質寫成完全不含有機物。\n 97 花卉學"},{"id":"花卉學-97-二","s":"花卉學","y":97,"n":"二","t":"文心蘭採後瓶頸","body":"<h2>第二題｜文心蘭採後瓶頸（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>文心蘭採後瓶頸<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=29\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>瓶頸為花梗長而易彎折碰傷、失水、幼蕾開放不良、碳源不足、微生物堵管及溫度不適。選適當開花比例，立即補水、用潔淨酸化抑菌與依試驗糖液，保護花序、適溫高濕包裝冷鏈；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>切離後的水分與碳收支轉為赤字<\/strong><\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p><strong>不同處理各有明確功能<\/strong><\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<p><strong>採收成熟度與溫度決定後續品質上限<\/strong><\/p>\n<p>過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>瓶頸為花梗長而易彎折碰傷、失水、幼蕾開放不良、碳源不足、微生物堵管及溫度不適。選適當開花比例，立即補水、用潔淨酸化抑菌與依試驗糖液，保護花序、適溫高濕包裝冷鏈；<\/p>\n<p>防乙烯並測抵港與瓶插壽命，避免只測出貨外觀。<\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：瓶頸與對策成對、冷鏈及驗證終點。<\/p>\n<ul>\n<li><strong>瓶頸與對策成對<\/strong><\/li>\n<li><strong>冷鏈及驗證終點<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短時高濃度預措液與全程瓶插液視為相同用法。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=29","md":"97年花卉學_逐題教學詳解.md","search":"文心蘭採後瓶頸 ## 第二題｜文心蘭採後瓶頸（10 分）\n\n### 題意與作答範圍\n\n本題重點：**文心蘭採後瓶頸**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=29)。\n\n### 先掌握答案\n\n瓶頸為花梗長而易彎折碰傷、失水、幼蕾開放不良、碳源不足、微生物堵管及溫度不適。選適當開花比例，立即補水、用潔淨酸化抑菌與依試驗糖液，保護花序、適溫高濕包裝冷鏈；\n\n### 原理拆解：為什麼會這樣？\n\n**切離後的水分與碳收支轉為赤字**\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n**不同處理各有明確功能**\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n**採收成熟度與溫度決定後續品質上限**\n\n過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。\n\n### 可直接練寫的完整答案\n\n瓶頸為花梗長而易彎折碰傷、失水、幼蕾開放不良、碳源不足、微生物堵管及溫度不適。選適當開花比例，立即補水、用潔淨酸化抑菌與依試驗糖液，保護花序、適溫高濕包裝冷鏈；\n\n防乙烯並測抵港與瓶插壽命，避免只測出貨外觀。\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n### 實例：把原理用在情境中\n\n百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：瓶頸與對策成對、冷鏈及驗證終點。\n\n- **瓶頸與對策成對**\n- **冷鏈及驗證終點**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短時高濃度預措液與全程瓶插液視為相同用法。\n 97 花卉學"},{"id":"花卉學-97-三","s":"花卉學","y":97,"n":"三","t":"水分、pF 與吸水圖","body":"<h2>第三題｜水分、pF 與吸水圖（25 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>水分、pF 與吸水圖<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=29\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>水分維持膨壓、光合原料、運輸與蒸散降溫。pF＝log10｜土壤水吸力水柱高度 cm｜，數值高代表基質吸力大、土較乾，非含水百分率。圖示可寫「土壤水→根毛→皮層→內皮層→木質部→葉肉→氣孔→大氣」，隨水勢逐降流動，跨膜由水通道促進，根內皮層具選擇性。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先理解水勢與膨壓<\/strong><\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p><strong>由缺水到減產的連鎖<\/strong><\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<p><strong>管理不是只問澆多少<\/strong><\/p>\n<p>應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>水分維持膨壓、光合原料、運輸與蒸散降溫。pF＝log10｜土壤水吸力水柱高度 cm｜，數值高代表基質吸力大、土較乾，非含水百分率。圖示可寫「土壤水→根毛→皮層→內皮層→木質部→葉肉→氣孔→大氣」，隨水勢逐降流動，跨膜由水通道促進，根內皮層具選擇性。<\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>25 分：水功能 5、pF 10、路徑與水勢圖 10。<\/p>\n<ul>\n<li><strong>水功能 5<\/strong><\/li>\n<li><strong>pF 10<\/strong><\/li>\n<li><strong>路徑與水勢圖 10<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把有水等同根一定能吸到水。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=29","md":"97年花卉學_逐題教學詳解.md","search":"水分、pf 與吸水圖 ## 第三題｜水分、pf 與吸水圖（25 分）\n\n### 題意與作答範圍\n\n本題重點：**水分、pf 與吸水圖**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=29)。\n\n### 先掌握答案\n\n水分維持膨壓、光合原料、運輸與蒸散降溫。pf＝log10｜土壤水吸力水柱高度 cm｜，數值高代表基質吸力大、土較乾，非含水百分率。圖示可寫「土壤水→根毛→皮層→內皮層→木質部→葉肉→氣孔→大氣」，隨水勢逐降流動，跨膜由水通道促進，根內皮層具選擇性。\n\n### 原理拆解：為什麼會這樣？\n\n**先理解水勢與膨壓**\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n**由缺水到減產的連鎖**\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n**管理不是只問澆多少**\n\n應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。\n\n### 可直接練寫的完整答案\n\n水分維持膨壓、光合原料、運輸與蒸散降溫。pf＝log10｜土壤水吸力水柱高度 cm｜，數值高代表基質吸力大、土較乾，非含水百分率。圖示可寫「土壤水→根毛→皮層→內皮層→木質部→葉肉→氣孔→大氣」，隨水勢逐降流動，跨膜由水通道促進，根內皮層具選擇性。\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n### 實例：把原理用在情境中\n\n旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。\n\n### 配分重點：哪些內容不能漏？\n\n25 分：水功能 5、pf 10、路徑與水勢圖 10。\n\n- **水功能 5**\n- **pf 10**\n- **路徑與水勢圖 10**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把有水等同根一定能吸到水。\n 97 花卉學"},{"id":"花卉學-97-四","s":"花卉學","y":97,"n":"四","t":"臺灣原生百合與用途","body":"<h2>第四題｜臺灣原生百合與用途（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>臺灣原生百合與用途<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=29\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>常見分類包括臺灣百合 Lilium formosanum，分布海岸至高山；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>常見分類包括臺灣百合 Lilium formosanum，分布海岸至高山；<\/p>\n<p>鐵砲百合 L. longiflorum，臺灣東北、東部沿海及離島；<\/p>\n<p>艷紅鹿子百合 L. speciosum var. gloriosoides，北部山區。臺灣百合具早熟與適應性，可作新鐵砲雜交、切花、盆花及復育；<\/p>\n<p>鐵砲供大白花與種球育種；<\/p>\n<p>艷紅鹿子具花形花色育種與保育價值，商業利用需合法繁殖不可野採。<\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：三物種名稱、分布及育種／經濟用途；分類異名可註。<\/p>\n<ul>\n<li><strong>三物種名稱<\/strong><\/li>\n<li><strong>分布及育種／經濟用途<\/strong><\/li>\n<li><strong>分類異名可註<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=29","md":"97年花卉學_逐題教學詳解.md","search":"臺灣原生百合與用途 ## 第四題｜臺灣原生百合與用途（15 分）\n\n### 題意與作答範圍\n\n本題重點：**臺灣原生百合與用途**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=29)。\n\n### 先掌握答案\n\n常見分類包括臺灣百合 lilium formosanum，分布海岸至高山；\n\n### 原理拆解：為什麼會這樣？\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n### 可直接練寫的完整答案\n\n常見分類包括臺灣百合 lilium formosanum，分布海岸至高山；\n\n鐵砲百合 l. longiflorum，臺灣東北、東部沿海及離島；\n\n艷紅鹿子百合 l. speciosum var. gloriosoides，北部山區。臺灣百合具早熟與適應性，可作新鐵砲雜交、切花、盆花及復育；\n\n鐵砲供大白花與種球育種；\n\n艷紅鹿子具花形花色育種與保育價值，商業利用需合法繁殖不可野採。\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n### 實例：把原理用在情境中\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：三物種名稱、分布及育種／經濟用途；分類異名可註。\n\n- **三物種名稱**\n- **分布及育種／經濟用途**\n- **分類異名可註**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把轉入基因成功直接等同育成可商業化品種。\n 97 花卉學"},{"id":"花卉學-97-五","s":"花卉學","y":97,"n":"五","t":"蝴蝶蘭效率與病毒管理","body":"<h2>第五題｜蝴蝶蘭效率與病毒管理（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>蝴蝶蘭效率與病毒管理<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=29\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>以優良母株花梗芽或 PLB 量繁，優化培養、液體系統與分級育苗提高效率；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>病毒管理與量產效率互相牽動<\/strong><\/p>\n<p>蝴蝶蘭無性繁殖會保留母株性狀，也可能同步放大病毒感染；剪具、分株、採外植體及共用操作都可能傳播。效率提升應從母本檢測、工具衛生、分區與批次追溯開始，搭配可靠增殖與馴化率。只縮短培養週期而放大感染，最後商品率可能更低。<\/p>\n<p><strong>健康與整齊度要從母本或種子源開始<\/strong><\/p>\n<p>母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。<\/p>\n<p><strong>育苗目標是可定植且恢復快<\/strong><\/p>\n<p>適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。<\/p>\n<p><strong>無菌培養後仍有馴化關卡<\/strong><\/p>\n<p>瓶內高濕、低光與外加糖可使幼苗角質層、氣孔及根功能與田間不同。出瓶須逐步調整光濕條件並防感染。組培倍率、出瓶存活率與成品率應分開計算，不能只用增殖數宣稱生產效率。<\/p>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>以優良母株花梗芽或 PLB 量繁，優化培養、液體系統與分級育苗提高效率；<\/p>\n<p>同步建立無病毒母本，以 ELISA、RT-PCR 等檢測 CymMV、ORSV 等，必要莖頂培養與療法後再檢。工具消毒、批次隔離、去病株及追溯，過多繼代監測變異，組培不自動保證無病毒。<\/p>\n<p>蝴蝶蘭無性繁殖會保留母株性狀，也可能同步放大病毒感染；剪具、分株、採外植體及共用操作都可能傳播。效率提升應從母本檢測、工具衛生、分區與批次追溯開始，搭配可靠增殖與馴化率。只縮短培養週期而放大感染，最後商品率可能更低。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>蝴蝶蘭分生苗可用組織培養大量增殖，但需檢測母株病毒並控制培養代數；出瓶後先馴化，再依葉片與根系生長分級，不宜把瓶苗數直接當成上市盆花數。<\/p>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：效率技術、病毒檢測、清潔母本與隔離。<\/p>\n<ul>\n<li><strong>效率技術<\/strong><\/li>\n<li><strong>病毒檢測<\/strong><\/li>\n<li><strong>清潔母本與隔離<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將組織培養視為自動消除所有病原。<\/li>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=29","md":"97年花卉學_逐題教學詳解.md","search":"蝴蝶蘭效率與病毒管理 ## 第五題｜蝴蝶蘭效率與病毒管理（10 分）\n\n### 題意與作答範圍\n\n本題重點：**蝴蝶蘭效率與病毒管理**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=29)。\n\n### 先掌握答案\n\n以優良母株花梗芽或 plb 量繁，優化培養、液體系統與分級育苗提高效率；\n\n### 原理拆解：為什麼會這樣？\n\n**病毒管理與量產效率互相牽動**\n\n蝴蝶蘭無性繁殖會保留母株性狀，也可能同步放大病毒感染；剪具、分株、採外植體及共用操作都可能傳播。效率提升應從母本檢測、工具衛生、分區與批次追溯開始，搭配可靠增殖與馴化率。只縮短培養週期而放大感染，最後商品率可能更低。\n\n**健康與整齊度要從母本或種子源開始**\n\n母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。\n\n**育苗目標是可定植且恢復快**\n\n適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。\n\n**無菌培養後仍有馴化關卡**\n\n瓶內高濕、低光與外加糖可使幼苗角質層、氣孔及根功能與田間不同。出瓶須逐步調整光濕條件並防感染。組培倍率、出瓶存活率與成品率應分開計算，不能只用增殖數宣稱生產效率。\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n### 可直接練寫的完整答案\n\n以優良母株花梗芽或 plb 量繁，優化培養、液體系統與分級育苗提高效率；\n\n同步建立無病毒母本，以 elisa、rt-pcr 等檢測 cymmv、orsv 等，必要莖頂培養與療法後再檢。工具消毒、批次隔離、去病株及追溯，過多繼代監測變異，組培不自動保證無病毒。\n\n蝴蝶蘭無性繁殖會保留母株性狀，也可能同步放大病毒感染；剪具、分株、採外植體及共用操作都可能傳播。效率提升應從母本檢測、工具衛生、分區與批次追溯開始，搭配可靠增殖與馴化率。只縮短培養週期而放大感染，最後商品率可能更低。\n\n### 實例：把原理用在情境中\n\n蝴蝶蘭分生苗可用組織培養大量增殖，但需檢測母株病毒並控制培養代數；出瓶後先馴化，再依葉片與根系生長分級，不宜把瓶苗數直接當成上市盆花數。\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：效率技術、病毒檢測、清潔母本與隔離。\n\n- **效率技術**\n- **病毒檢測**\n- **清潔母本與隔離**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將組織培養視為自動消除所有病原。\n- 把無性繁殖與無病毒畫上等號。\n 97 花卉學"},{"id":"花卉學-97-六","s":"花卉學","y":97,"n":"六","t":"十組名詞比較","body":"<h2>第六題｜十組名詞比較（25 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>十組名詞比較<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=29\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>(1)scape 花葶，stalk 為梗的泛稱，flowering stem 為可具葉節的開花莖。<\/p>\n<p>(2)舌狀／管狀小花形狀不同。<\/p>\n<p>(3)C3 白天直接 Calvin cycle，C4 空間濃縮 CO₂，CAM 時間分隔夜固碳晝脫羧。<\/p>\n<p>(4)日中性不依賴特定日長，中間型植物在中等日長較易成花。<\/p>\n<p>(5)+DIF 日暖夜冷、−DIF 日冷夜暖、0 DIF 相等。<\/p>\n<p>(6)haploid 一套染色體、tetraploid 四套。<\/p>\n<p>(7)cybrid 胞質雜種主要混合胞質來源，F1 為有性雜交第一代。<\/p>\n<p>(8)spray 一枝多花，standard 一枝主花。<\/p>\n<p>(9)thermozero 成花對溫度變化較不敏感，thermopositive 較暖促、thermonegative 較冷促，須指明生育階段。(10)塊根無節芽、塊莖有節芽、根莖橫走具節。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>感應的是日夜節律，常以夜長最關鍵<\/strong><\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<p><strong>感光與光合作用不是同一需求<\/strong><\/p>\n<p>暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。<\/p>\n<p><strong>產期調節須兼顧可感應階段<\/strong><\/p>\n<p>植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。<\/p>\n<p><strong>先理解水勢與膨壓<\/strong><\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p><strong>由缺水到減產的連鎖<\/strong><\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<p><strong>管理不是只問澆多少<\/strong><\/p>\n<p>應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>(9)thermozero 成花對溫度變化較不敏感，thermopositive 較暖促、thermonegative 較冷促，須指明生育階段。(10)塊根無節芽、塊莖有節芽、根莖橫走具節。<\/td>\n<td>是橫走的莖，具有節與芽；蓮藕、薑雖俗稱根，實際為莖。 是根的肥大，不具有典型莖節與芽眼；應與馬鈴薯莖塊莖區分。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>(1)scape 花葶，stalk 為梗的泛稱，flowering stem 為可具葉節的開花莖。<\/p>\n<p>(2)舌狀／管狀小花形狀不同。<\/p>\n<p>(3)C3 白天直接 Calvin cycle，C4 空間濃縮 CO₂，CAM 時間分隔夜固碳晝脫羧。<\/p>\n<p>(4)日中性不依賴特定日長，中間型植物在中等日長較易成花。<\/p>\n<p>(5)+DIF 日暖夜冷、−DIF 日冷夜暖、0 DIF 相等。<\/p>\n<p>(6)haploid 一套染色體、tetraploid 四套。<\/p>\n<p>(7)cybrid 胞質雜種主要混合胞質來源，F1 為有性雜交第一代。<\/p>\n<p>(8)spray 一枝多花，standard 一枝主花。<\/p>\n<p>(9)thermozero 成花對溫度變化較不敏感，thermopositive 較暖促、thermonegative 較冷促，須指明生育階段。(10)塊根無節芽、塊莖有節芽、根莖橫走具節。<\/p>\n<p>短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。<\/p>\n<p>旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>25 分：十組逐一對照，需列差異與園藝例，勿把中間型譯成日中性。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短日反應簡化為光越少花越多。<\/li>\n<li>把有水等同根一定能吸到水。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=29","md":"97年花卉學_逐題教學詳解.md","search":"十組名詞比較 ## 第六題｜十組名詞比較（25 分）\n\n### 題意與作答範圍\n\n本題重點：**十組名詞比較**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=29)。\n\n### 先掌握答案\n\n(1)scape 花葶，stalk 為梗的泛稱，flowering stem 為可具葉節的開花莖。\n\n(2)舌狀／管狀小花形狀不同。\n\n(3)c3 白天直接 calvin cycle，c4 空間濃縮 co₂，cam 時間分隔夜固碳晝脫羧。\n\n(4)日中性不依賴特定日長，中間型植物在中等日長較易成花。\n\n(5)+dif 日暖夜冷、−dif 日冷夜暖、0 dif 相等。\n\n(6)haploid 一套染色體、tetraploid 四套。\n\n(7)cybrid 胞質雜種主要混合胞質來源，f1 為有性雜交第一代。\n\n(8)spray 一枝多花，standard 一枝主花。\n\n(9)thermozero 成花對溫度變化較不敏感，thermopositive 較暖促、thermonegative 較冷促，須指明生育階段。(10)塊根無節芽、塊莖有節芽、根莖橫走具節。\n\n### 原理拆解：為什麼會這樣？\n\n**感應的是日夜節律，常以夜長最關鍵**\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n**感光與光合作用不是同一需求**\n\n暗期中斷以低強度照光便可能改變光週期訊號；補光增加每日光積量，主要補足同化需求。兩者目的、光強與操作時間不同，不能用「照燈會增產」取代成花機制。\n\n**產期調節須兼顧可感應階段**\n\n植株須具適當生理年齡，才能有效接受成花訊號。先在營養生長階段建立株型，再用遮光短日或夜間照光調整成花；花芽形成後仍受溫度與碳供應影響，處理日數不可跨品種硬套。\n\n**先理解水勢與膨壓**\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n**由缺水到減產的連鎖**\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n**管理不是只問澆多少**\n\n應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| (9)thermozero 成花對溫度變化較不敏感，thermopositive 較暖促、thermonegative 較冷促，須指明生育階段。(10)塊根無節芽、塊莖有節芽、根莖橫走具節。 | 是橫走的莖，具有節與芽；蓮藕、薑雖俗稱根，實際為莖。 是根的肥大，不具有典型莖節與芽眼；應與馬鈴薯莖塊莖區分。 |\n\n### 可直接練寫的完整答案\n\n(1)scape 花葶，stalk 為梗的泛稱，flowering stem 為可具葉節的開花莖。\n\n(2)舌狀／管狀小花形狀不同。\n\n(3)c3 白天直接 calvin cycle，c4 空間濃縮 co₂，cam 時間分隔夜固碳晝脫羧。\n\n(4)日中性不依賴特定日長，中間型植物在中等日長較易成花。\n\n(5)+dif 日暖夜冷、−dif 日冷夜暖、0 dif 相等。\n\n(6)haploid 一套染色體、tetraploid 四套。\n\n(7)cybrid 胞質雜種主要混合胞質來源，f1 為有性雜交第一代。\n\n(8)spray 一枝多花，standard 一枝主花。\n\n(9)thermozero 成花對溫度變化較不敏感，thermopositive 較暖促、thermonegative 較冷促，須指明生育階段。(10)塊根無節芽、塊莖有節芽、根莖橫走具節。\n\n短日植物通常需足夠長且連續的黑暗期，長日植物則在適當日長或短夜下促花；日中性不代表完全不受光量影響。須區分絕對與相對反應，以及品種、葉齡與溫度造成的差異。\n\n### 實例：把原理用在情境中\n\n菊花可先用夜間照光延長營養生長、累積足夠莖長，達規格後停止照光並提供適宜短日，使花期配合市場。單靠弱光夜照不足以補足低日照下的生長能量。\n\n旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。\n\n### 配分重點：哪些內容不能漏？\n\n25 分：十組逐一對照，需列差異與園藝例，勿把中間型譯成日中性。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短日反應簡化為光越少花越多。\n- 把有水等同根一定能吸到水。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 97 花卉學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
