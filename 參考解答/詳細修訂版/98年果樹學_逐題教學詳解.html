ls{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 9 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"果樹學-98-一","s":"果樹學","y":98,"n":"一","t":"五名詞","body":"<h2>第一題｜五名詞（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=25\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>RDI 調節性限制灌溉；<\/p>\n<p>rejuvenation 返幼，成熟材料回到較幼年生理形態；<\/p>\n<p>pit hardening 硬核，核果內果皮木質化；<\/p>\n<p>stamen carpellody 雄蕊心皮化，雄蕊發育成雌性心皮樣構造，番木瓜可致畸形；<\/p>\n<p>effective pollination period 有效授粉期，柱頭可接受花粉且花粉管能在胚珠存活期間到達完成受精的時窗。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>RDI 的核心是選期與可控制<\/strong><\/p>\n<p>調節性限制灌溉不是隨意少澆水，而是依發育階段對缺水敏感度不同，刻意在較可容忍階段降低供水，並設定監測及補水門檻。成功指標應同時看節水、產量、果徑、品質和下一期樹勢。<\/p>\n<p><strong>為何輕度缺水可能有利<\/strong><\/p>\n<p>細胞擴張對膨壓降低較敏感，常早於嚴重光合下降而受抑。輕度限灌因此可能減少徒長和果實水分稀釋，配合滲透調節改變溶質濃度。但糖度是濃度，糖度上升不一定代表每果糖總量增加。<\/p>\n<p><strong>文旦如何選階段<\/strong><\/p>\n<p>花期、幼果與快速膨大期缺水容易影響著果、細胞生長及果重；膨大已趨緩的採前成熟階段，才較適合評估限灌。須合併雨量、土壤、根深、負載與水勢監測，若葉片持續失水、落葉或光合受重損，就已超出改善品質的合理範圍。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>rejuvenation 返幼，成熟材料回到較幼年生理形態；<\/td>\n<td>重點是未具充分成花能力，不能僅憑株高或幹粗判斷。<\/td>\n<\/tr>\n<tr>\n<td>effective pollination period 有效授粉期，柱頭可接受花粉且花粉管能在胚珠存活期間到達完成受精的時窗。<\/td>\n<td>多在受精後形成種子，胚珠與子房兩者層級不同。 負責接受花粉，與花柱的支持及花粉管通道功能不同。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>RDI 調節性限制灌溉；<\/p>\n<p>rejuvenation 返幼，成熟材料回到較幼年生理形態；<\/p>\n<p>pit hardening 硬核，核果內果皮木質化；<\/p>\n<p>stamen carpellody 雄蕊心皮化，雄蕊發育成雌性心皮樣構造，番木瓜可致畸形；<\/p>\n<p>effective pollination period 有效授粉期，柱頭可接受花粉且花粉管能在胚珠存活期間到達完成受精的時窗。<\/p>\n<p>調節性限制灌溉不是隨意少澆水，而是依發育階段對缺水敏感度不同，刻意在較可容忍階段降低供水，並設定監測及補水門檻。成功指標應同時看節水、產量、果徑、品質和下一期樹勢。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>可比較充分灌溉與採前適度限灌的果實糖度、果重、汁率及單果糖量。若只有糖度較高而果重、汁率明顯下降，便不能直接宣稱總品質與收益皆改善。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：每項定義，硬核與心皮化舉果樹例。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>不管生育期一律斷水。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=25","md":"98年果樹學_逐題教學詳解.md","search":"五名詞 ## 第一題｜五名詞（10 分）\n\n### 題意與作答範圍\n\n本題重點：**五名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=25)。\n\n### 先掌握答案\n\nrdi 調節性限制灌溉；\n\nrejuvenation 返幼，成熟材料回到較幼年生理形態；\n\npit hardening 硬核，核果內果皮木質化；\n\nstamen carpellody 雄蕊心皮化，雄蕊發育成雌性心皮樣構造，番木瓜可致畸形；\n\neffective pollination period 有效授粉期，柱頭可接受花粉且花粉管能在胚珠存活期間到達完成受精的時窗。\n\n### 原理拆解：為什麼會這樣？\n\n**rdi 的核心是選期與可控制**\n\n調節性限制灌溉不是隨意少澆水，而是依發育階段對缺水敏感度不同，刻意在較可容忍階段降低供水，並設定監測及補水門檻。成功指標應同時看節水、產量、果徑、品質和下一期樹勢。\n\n**為何輕度缺水可能有利**\n\n細胞擴張對膨壓降低較敏感，常早於嚴重光合下降而受抑。輕度限灌因此可能減少徒長和果實水分稀釋，配合滲透調節改變溶質濃度。但糖度是濃度，糖度上升不一定代表每果糖總量增加。\n\n**文旦如何選階段**\n\n花期、幼果與快速膨大期缺水容易影響著果、細胞生長及果重；膨大已趨緩的採前成熟階段，才較適合評估限灌。須合併雨量、土壤、根深、負載與水勢監測，若葉片持續失水、落葉或光合受重損，就已超出改善品質的合理範圍。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| rejuvenation 返幼，成熟材料回到較幼年生理形態； | 重點是未具充分成花能力，不能僅憑株高或幹粗判斷。 |\n| effective pollination period 有效授粉期，柱頭可接受花粉且花粉管能在胚珠存活期間到達完成受精的時窗。 | 多在受精後形成種子，胚珠與子房兩者層級不同。 負責接受花粉，與花柱的支持及花粉管通道功能不同。 |\n\n### 可直接練寫的完整答案\n\nrdi 調節性限制灌溉；\n\nrejuvenation 返幼，成熟材料回到較幼年生理形態；\n\npit hardening 硬核，核果內果皮木質化；\n\nstamen carpellody 雄蕊心皮化，雄蕊發育成雌性心皮樣構造，番木瓜可致畸形；\n\neffective pollination period 有效授粉期，柱頭可接受花粉且花粉管能在胚珠存活期間到達完成受精的時窗。\n\n調節性限制灌溉不是隨意少澆水，而是依發育階段對缺水敏感度不同，刻意在較可容忍階段降低供水，並設定監測及補水門檻。成功指標應同時看節水、產量、果徑、品質和下一期樹勢。\n\n### 實例：把原理用在情境中\n\n可比較充分灌溉與採前適度限灌的果實糖度、果重、汁率及單果糖量。若只有糖度較高而果重、汁率明顯下降，便不能直接宣稱總品質與收益皆改善。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：每項定義，硬核與心皮化舉果樹例。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 不管生育期一律斷水。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 98 果樹學"},{"id":"果樹學-98-二","s":"果樹學","y":98,"n":"二","t":"糖運輸與貯藏","body":"<h2>第二題｜糖運輸與貯藏（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>糖運輸與貯藏<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=25\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>光合糖以蔗糖為主要運輸形式，部分果樹亦運山梨醇等；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把源與庫接起來<\/strong><\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<p><strong>壓力流與跨膜運輸不是同一層次<\/strong><\/p>\n<p>源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；H⁺-ATPase 建立電化學梯度，可支援 H⁺／蔗糖共運輸。<\/p>\n<p><strong>庫強決定競爭，不只看果實大小<\/strong><\/p>\n<p>庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。<\/p>\n<p><strong>三種酵素要看反應而非只背名稱<\/strong><\/p>\n<p>轉化酶水解蔗糖，生成葡萄糖與果糖；蔗糖合成酶可逆地轉換蔗糖與 UDP-葡萄糖、果糖，在許多庫組織常參與裂解；蔗糖磷酸合成酶則參與蔗糖合成。不能因名稱含「合成」就斷定反應在所有組織一定只向合成方向。<\/p>\n<p><strong>酵素改變糖種類，也影響庫的吸引力<\/strong><\/p>\n<p>庫端把蔗糖裂解可維持輸入梯度、供呼吸和細胞壁合成，己糖也具滲透與訊號作用。若成熟期蔗糖合成加強、分解下降並有足夠運入，就可能較多累積蔗糖；但結果仍受細胞區室及液泡運輸限制。<\/p>\n<p><strong>不可用一次活性推全部品質<\/strong><\/p>\n<p>應比較發育時序、酵素位置、糖總量與含水。糖度較高可能因水少，不必然是酵素使糖總量提高；有機酸也受合成、呼吸利用與液泡貯藏影響，需與糖酸比、風味一起判讀。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>光合糖以蔗糖為主要運輸形式，部分果樹亦運山梨醇等；<\/p>\n<p>由韌皮部裝載、壓力流及卸載入果肉，再經轉化、利用與液泡貯藏。成熟果常見蔗糖、葡萄糖、果糖，種類與比例隨物種而異。<\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<p>源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；H⁺-ATPase 建立電化學梯度，可支援 H⁺／蔗糖共運輸。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。<\/p>\n<p>研究上可同測蔗糖、葡萄糖、果糖的含量與相關酵素，若只有轉化酶較高而糖輸入不足，仍不能推定成熟果一定更甜。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：運輸形式、路徑、液泡貯藏與三糖。<\/p>\n<ul>\n<li><strong>運輸形式<\/strong><\/li>\n<li><strong>液泡貯藏與三糖<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把長距離糖運輸寫成主要沿木質部。<\/li>\n<li>把蔗糖合成酶等同只能合成蔗糖。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=25","md":"98年果樹學_逐題教學詳解.md","search":"糖運輸與貯藏 ## 第二題｜糖運輸與貯藏（10 分）\n\n### 題意與作答範圍\n\n本題重點：**糖運輸與貯藏**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=25)。\n\n### 先掌握答案\n\n光合糖以蔗糖為主要運輸形式，部分果樹亦運山梨醇等；\n\n### 原理拆解：為什麼會這樣？\n\n**先把源與庫接起來**\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n**壓力流與跨膜運輸不是同一層次**\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n**庫強決定競爭，不只看果實大小**\n\n庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。\n\n**三種酵素要看反應而非只背名稱**\n\n轉化酶水解蔗糖，生成葡萄糖與果糖；蔗糖合成酶可逆地轉換蔗糖與 udp-葡萄糖、果糖，在許多庫組織常參與裂解；蔗糖磷酸合成酶則參與蔗糖合成。不能因名稱含「合成」就斷定反應在所有組織一定只向合成方向。\n\n**酵素改變糖種類，也影響庫的吸引力**\n\n庫端把蔗糖裂解可維持輸入梯度、供呼吸和細胞壁合成，己糖也具滲透與訊號作用。若成熟期蔗糖合成加強、分解下降並有足夠運入，就可能較多累積蔗糖；但結果仍受細胞區室及液泡運輸限制。\n\n**不可用一次活性推全部品質**\n\n應比較發育時序、酵素位置、糖總量與含水。糖度較高可能因水少，不必然是酵素使糖總量提高；有機酸也受合成、呼吸利用與液泡貯藏影響，需與糖酸比、風味一起判讀。\n\n### 可直接練寫的完整答案\n\n光合糖以蔗糖為主要運輸形式，部分果樹亦運山梨醇等；\n\n由韌皮部裝載、壓力流及卸載入果肉，再經轉化、利用與液泡貯藏。成熟果常見蔗糖、葡萄糖、果糖，種類與比例隨物種而異。\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n### 實例：把原理用在情境中\n\n同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。\n\n研究上可同測蔗糖、葡萄糖、果糖的含量與相關酵素，若只有轉化酶較高而糖輸入不足，仍不能推定成熟果一定更甜。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：運輸形式、路徑、液泡貯藏與三糖。\n\n- **運輸形式**\n- **液泡貯藏與三糖**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把長距離糖運輸寫成主要沿木質部。\n- 把蔗糖合成酶等同只能合成蔗糖。\n 98 果樹學"},{"id":"果樹學-98-三","s":"果樹學","y":98,"n":"三","t":"果園規劃與建立","body":"<h2>第三題｜果園規劃與建立（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>果園規劃與建立<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=25\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>先評估市場、品種砧木、氣候需冷、土水、坡向海拔、勞力與交通，再規劃行株距、授粉樹、防風、道路、灌排及保土。施作時清除病根多年生草、檢土改良、建立排水灌溉、選健康苗、適期定植固定與整形，建立品種圖、栽培及追溯紀錄。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<p><strong>產量要以單位土地和有效葉面積看<\/strong><\/p>\n<p>大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。<\/p>\n<p><strong>整枝、修剪和負載互相制約<\/strong><\/p>\n<p>整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。<\/p>\n<p><strong>矮化與密植的效益有條件<\/strong><\/p>\n<p>矮砧、低幹與細長冠可早形成土地有效葉面積、方便作業，且減大型骨架消耗；但過密仍會陰蔽、著色差與病害。支架、灌溉、疏果及持續更新是技術成本，不應只列早產優點。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>先評估市場、品種砧木、氣候需冷、土水、坡向海拔、勞力與交通，再規劃行株距、授粉樹、防風、道路、灌排及保土。施作時清除病根多年生草、檢土改良、建立排水灌溉、選健康苗、適期定植固定與整形，建立品種圖、栽培及追溯紀錄。<\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<p>矮砧蘋果密植常可提高早期每公頃產量，即使單株產量較低；若後期冠層封閉卻不調枝，早期優勢會被陰蔽與品質下降抵銷。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：生態經濟評估、設計、施工定植與初期管理。<\/p>\n<ul>\n<li><strong>生態經濟評估<\/strong><\/li>\n<li><strong>施工定植與初期管理<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<li>把修剪一律理解為越重越好。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=25","md":"98年果樹學_逐題教學詳解.md","search":"果園規劃與建立 ## 第三題｜果園規劃與建立（10 分）\n\n### 題意與作答範圍\n\n本題重點：**果園規劃與建立**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=25)。\n\n### 先掌握答案\n\n先評估市場、品種砧木、氣候需冷、土水、坡向海拔、勞力與交通，再規劃行株距、授粉樹、防風、道路、灌排及保土。施作時清除病根多年生草、檢土改良、建立排水灌溉、選健康苗、適期定植固定與整形，建立品種圖、栽培及追溯紀錄。\n\n### 原理拆解：為什麼會這樣？\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n**產量要以單位土地和有效葉面積看**\n\n大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。\n\n**整枝、修剪和負載互相制約**\n\n整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。\n\n**矮化與密植的效益有條件**\n\n矮砧、低幹與細長冠可早形成土地有效葉面積、方便作業，且減大型骨架消耗；但過密仍會陰蔽、著色差與病害。支架、灌溉、疏果及持續更新是技術成本，不應只列早產優點。\n\n### 可直接練寫的完整答案\n\n先評估市場、品種砧木、氣候需冷、土水、坡向海拔、勞力與交通，再規劃行株距、授粉樹、防風、道路、灌排及保土。施作時清除病根多年生草、檢土改良、建立排水灌溉、選健康苗、適期定植固定與整形，建立品種圖、栽培及追溯紀錄。\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n### 實例：把原理用在情境中\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n矮砧蘋果密植常可提高早期每公頃產量，即使單株產量較低；若後期冠層封閉卻不調枝，早期優勢會被陰蔽與品質下降抵銷。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：生態經濟評估、設計、施工定植與初期管理。\n\n- **生態經濟評估**\n- **施工定植與初期管理**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將連作障礙全部歸因於缺肥。\n- 把修剪一律理解為越重越好。\n 98 果樹學"},{"id":"果樹學-98-四","s":"果樹學","y":98,"n":"四","t":"矮化利弊與五種常綠果樹","body":"<h2>第四題｜矮化利弊與五種常綠果樹（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>矮化利弊與五種常綠果樹<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=25\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>低樹冠便採收、修剪、噴藥與防災，促有效受光與早期土地利用；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>產量要以單位土地和有效葉面積看<\/strong><\/p>\n<p>大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。<\/p>\n<p><strong>整枝、修剪和負載互相制約<\/strong><\/p>\n<p>整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。<\/p>\n<p><strong>矮化與密植的效益有條件<\/strong><\/p>\n<p>矮砧、低幹與細長冠可早形成土地有效葉面積、方便作業，且減大型骨架消耗；但過密仍會陰蔽、著色差與病害。支架、灌溉、疏果及持續更新是技術成本，不應只列早產優點。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>低樹冠便採收、修剪、噴藥與防災，促有效受光與早期土地利用；<\/p>\n<p>缺點為需精細控梢負載、支架及肥水，過度矮化減葉面積與產量。臺灣可舉芒果、荔枝、龍眼、番石榴、蓮霧採低幹修剪與更新栽培；<\/p>\n<p>矮化途徑不必都是矮砧。<\/p>\n<p>大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。<\/p>\n<p>整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>矮砧蘋果密植常可提高早期每公頃產量，即使單株產量較低；若後期冠層封閉卻不調枝，早期優勢會被陰蔽與品質下降抵銷。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：優缺點、五作物與矮化方法區分。<\/p>\n<ul>\n<li><strong>優缺點<\/strong><\/li>\n<li><strong>五作物與矮化方法區分<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把修剪一律理解為越重越好。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=25","md":"98年果樹學_逐題教學詳解.md","search":"矮化利弊與五種常綠果樹 ## 第四題｜矮化利弊與五種常綠果樹（10 分）\n\n### 題意與作答範圍\n\n本題重點：**矮化利弊與五種常綠果樹**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=25)。\n\n### 先掌握答案\n\n低樹冠便採收、修剪、噴藥與防災，促有效受光與早期土地利用；\n\n### 原理拆解：為什麼會這樣？\n\n**產量要以單位土地和有效葉面積看**\n\n大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。\n\n**整枝、修剪和負載互相制約**\n\n整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。\n\n**矮化與密植的效益有條件**\n\n矮砧、低幹與細長冠可早形成土地有效葉面積、方便作業，且減大型骨架消耗；但過密仍會陰蔽、著色差與病害。支架、灌溉、疏果及持續更新是技術成本，不應只列早產優點。\n\n### 可直接練寫的完整答案\n\n低樹冠便採收、修剪、噴藥與防災，促有效受光與早期土地利用；\n\n缺點為需精細控梢負載、支架及肥水，過度矮化減葉面積與產量。臺灣可舉芒果、荔枝、龍眼、番石榴、蓮霧採低幹修剪與更新栽培；\n\n矮化途徑不必都是矮砧。\n\n大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。\n\n整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。\n\n### 實例：把原理用在情境中\n\n矮砧蘋果密植常可提高早期每公頃產量，即使單株產量較低；若後期冠層封閉卻不調枝，早期優勢會被陰蔽與品質下降抵銷。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：優缺點、五作物與矮化方法區分。\n\n- **優缺點**\n- **五作物與矮化方法區分**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把修剪一律理解為越重越好。\n 98 果樹學"},{"id":"果樹學-98-五","s":"果樹學","y":98,"n":"五","t":"切接失敗的實務與教學","body":"<h2>第五題｜切接失敗的實務與教學（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>切接失敗的實務與教學<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=25\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>實務常因砧穗不親和、接穗乾失水、形成層未對準、刀面粗糙污染、季節與砧木活性不對、綁紮不良或接口積水而失敗。教學應示範辨認形成層、削面角度及單側對準，先練刀工，再分組控制材料與日期、記錄存活及維管癒合；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>實務常因砧穗不親和、接穗乾失水、形成層未對準、刀面粗糙污染、季節與砧木活性不對、綁紮不良或接口積水而失敗。教學應示範辨認形成層、削面角度及單側對準，先練刀工，再分組控制材料與日期、記錄存活及維管癒合；<\/p>\n<p>用失敗樣本回查原因，不能只看葉片暫時未乾便判成功。<\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：實務至少五項、對應教學設計、真正成功判準。<\/p>\n<ul>\n<li><strong>實務至少五項<\/strong><\/li>\n<li><strong>對應教學設計<\/strong><\/li>\n<li><strong>真正成功判準<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=25","md":"98年果樹學_逐題教學詳解.md","search":"切接失敗的實務與教學 ## 第五題｜切接失敗的實務與教學（20 分）\n\n### 題意與作答範圍\n\n本題重點：**切接失敗的實務與教學**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=25)。\n\n### 先掌握答案\n\n實務常因砧穗不親和、接穗乾失水、形成層未對準、刀面粗糙污染、季節與砧木活性不對、綁紮不良或接口積水而失敗。教學應示範辨認形成層、削面角度及單側對準，先練刀工，再分組控制材料與日期、記錄存活及維管癒合；\n\n### 原理拆解：為什麼會這樣？\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n### 可直接練寫的完整答案\n\n實務常因砧穗不親和、接穗乾失水、形成層未對準、刀面粗糙污染、季節與砧木活性不對、綁紮不良或接口積水而失敗。教學應示範辨認形成層、削面角度及單側對準，先練刀工，再分組控制材料與日期、記錄存活及維管癒合；\n\n用失敗樣本回查原因，不能只看葉片暫時未乾便判成功。\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n### 實例：把原理用在情境中\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：實務至少五項、對應教學設計、真正成功判準。\n\n- **實務至少五項**\n- **對應教學設計**\n- **真正成功判準**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無性繁殖與無病毒畫上等號。\n 98 果樹學"},{"id":"果樹學-98-六","s":"果樹學","y":98,"n":"六","t":"高磷鉀與生長開花","body":"<h2>第六題｜高磷鉀與生長開花（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>高磷鉀與生長開花<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=25\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>磷參與 ATP、核酸與膜，是能量轉移與根、生殖發育所需；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>磷鉀不等於直接開花開關<\/strong><\/p>\n<p>養分不足時補足磷鉀可恢復代謝、碳運輸與生長，但元素過量不能取代花芽所需的枝齡、低溫、日長及樹勢條件。高鹽或養分拮抗反而可能傷根並限制其他元素吸收。完整答法須分成「原先缺乏」「原先足量」兩種情境，而不是宣稱施高磷肥必然促花。<\/p>\n<p><strong>第一步是分清吸收、運輸與需求<\/strong><\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p><strong>用新老葉位置推理<\/strong><\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<p><strong>最後必須用適當樣本驗證<\/strong><\/p>\n<p>依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。<\/p>\n<p><strong>先把源與庫接起來<\/strong><\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<p><strong>壓力流與跨膜運輸不是同一層次<\/strong><\/p>\n<p>源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；H⁺-ATPase 建立電化學梯度，可支援 H⁺／蔗糖共運輸。<\/p>\n<p><strong>庫強決定競爭，不只看果實大小<\/strong><\/p>\n<p>庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>磷參與 ATP、核酸與膜，是能量轉移與根、生殖發育所需；<\/p>\n<p>鉀活化酵素、調氣孔膨壓及糖運輸，有助果實充實。缺乏會限制生長，但超過適量不會無限促花；<\/p>\n<p>高磷可能誘微量元素失衡，高鉀拮抗鈣鎂，應以土葉分析和平衡施肥為本。<\/p>\n<p>養分不足時補足磷鉀可恢復代謝、碳運輸與生長，但元素過量不能取代花芽所需的枝齡、低溫、日長及樹勢條件。高鹽或養分拮抗反而可能傷根並限制其他元素吸收。完整答法須分成「原先缺乏」「原先足量」兩種情境，而不是宣稱施高磷肥必然促花。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。<\/p>\n<p>同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：P、K 作用、缺乏與過量、破除高磷必促花迷思。<\/p>\n<ul>\n<li><strong>K 作用<\/strong><\/li>\n<li><strong>缺乏與過量<\/strong><\/li>\n<li><strong>破除高磷必促花迷思<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>只寫缺肥會黃葉，沒有指出葉齡與黃化分布。<\/li>\n<li>把長距離糖運輸寫成主要沿木質部。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=25","md":"98年果樹學_逐題教學詳解.md","search":"高磷鉀與生長開花 ## 第六題｜高磷鉀與生長開花（10 分）\n\n### 題意與作答範圍\n\n本題重點：**高磷鉀與生長開花**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=25)。\n\n### 先掌握答案\n\n磷參與 atp、核酸與膜，是能量轉移與根、生殖發育所需；\n\n### 原理拆解：為什麼會這樣？\n\n**磷鉀不等於直接開花開關**\n\n養分不足時補足磷鉀可恢復代謝、碳運輸與生長，但元素過量不能取代花芽所需的枝齡、低溫、日長及樹勢條件。高鹽或養分拮抗反而可能傷根並限制其他元素吸收。完整答法須分成「原先缺乏」「原先足量」兩種情境，而不是宣稱施高磷肥必然促花。\n\n**第一步是分清吸收、運輸與需求**\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n**用新老葉位置推理**\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n**最後必須用適當樣本驗證**\n\n依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。\n\n**先把源與庫接起來**\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n**壓力流與跨膜運輸不是同一層次**\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n**庫強決定競爭，不只看果實大小**\n\n庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。\n\n### 可直接練寫的完整答案\n\n磷參與 atp、核酸與膜，是能量轉移與根、生殖發育所需；\n\n鉀活化酵素、調氣孔膨壓及糖運輸，有助果實充實。缺乏會限制生長，但超過適量不會無限促花；\n\n高磷可能誘微量元素失衡，高鉀拮抗鈣鎂，應以土葉分析和平衡施肥為本。\n\n養分不足時補足磷鉀可恢復代謝、碳運輸與生長，但元素過量不能取代花芽所需的枝齡、低溫、日長及樹勢條件。高鹽或養分拮抗反而可能傷根並限制其他元素吸收。完整答法須分成「原先缺乏」「原先足量」兩種情境，而不是宣稱施高磷肥必然促花。\n\n### 實例：把原理用在情境中\n\n老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。\n\n同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：p、k 作用、缺乏與過量、破除高磷必促花迷思。\n\n- **k 作用**\n- **缺乏與過量**\n- **破除高磷必促花迷思**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 只寫缺肥會黃葉，沒有指出葉齡與黃化分布。\n- 把長距離糖運輸寫成主要沿木質部。\n 98 果樹學"},{"id":"果樹學-98-七","s":"果樹學","y":98,"n":"七","t":"木瓜網室瘤果與裂葉","body":"<h2>第七題｜木瓜網室瘤果與裂葉（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>木瓜網室瘤果與裂葉<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=25\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>葉脆捲縮、葉柄裂流膠、果面凹凸優先考慮缺硼，網室排雨與局部灌溉可能使硼供應與根吸收不穩，乾旱、pH 不當亦加劇。應測土葉並檢查水分，均勻少量補硼、穩定根域水分與改善酸鹼，不可僅增加大量氮肥。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>缺硼先傷哪些功能<\/strong><\/p>\n<p>硼參與細胞壁穩定及分生組織發育，亦影響花粉萌發、花粉管伸長與受精。缺乏時幼嫩組織生長不正常，可見脆裂、頂芽受損或果實凹凸，生殖器官也可能先失去功能而減少著果。<\/p>\n<p><strong>為何水分與土壤也重要<\/strong><\/p>\n<p>硼供應受土壤有效性、根域 pH、含水及根系活力影響。乾旱可使根吸收與輸送不足，土中有硼不代表發育部位已收到。硼在體內的再移動依物種而異，具多元醇運輸的部分果樹不能套用完全不移動的規則。<\/p>\n<p><strong>診斷與補充的界線<\/strong><\/p>\n<p>以作物、葉齡、裂柄流膠及果實畸形的組合建立判斷，配土葉分析排除病毒、藥害與鈣問題。硼的缺乏與毒害範圍較窄，補充應少量、均勻、依建議執行；過量也會造成葉片壞死，不能把所有裂果一律用硼處理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>葉脆捲縮、葉柄裂流膠、果面凹凸優先考慮缺硼，網室排雨與局部灌溉可能使硼供應與根吸收不穩，乾旱、pH 不當亦加劇。應測土葉並檢查水分，均勻少量補硼、穩定根域水分與改善酸鹼，不可僅增加大量氮肥。<\/p>\n<p>硼參與細胞壁穩定及分生組織發育，亦影響花粉萌發、花粉管伸長與受精。缺乏時幼嫩組織生長不正常，可見脆裂、頂芽受損或果實凹凸，生殖器官也可能先失去功能而減少著果。<\/p>\n<p>硼供應受土壤有效性、根域 pH、含水及根系活力影響。乾旱可使根吸收與輸送不足，土中有硼不代表發育部位已收到。硼在體內的再移動依物種而異，具多元醇運輸的部分果樹不能套用完全不移動的規則。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>番木瓜若同時有新葉脆、葉柄龜裂流膠與瘤果，比只有一個果實畸形更支持缺硼；若全園只有單株葉斑，則須更重視局部根病或感染性問題。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：診斷、易發條件、驗證與安全改善。<\/p>\n<ul>\n<li><strong>易發條件<\/strong><\/li>\n<li><strong>驗證與安全改善<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有硬果、空心或裂果都直接診斷成缺硼。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=25","md":"98年果樹學_逐題教學詳解.md","search":"木瓜網室瘤果與裂葉 ## 第七題｜木瓜網室瘤果與裂葉（10 分）\n\n### 題意與作答範圍\n\n本題重點：**木瓜網室瘤果與裂葉**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=25)。\n\n### 先掌握答案\n\n葉脆捲縮、葉柄裂流膠、果面凹凸優先考慮缺硼，網室排雨與局部灌溉可能使硼供應與根吸收不穩，乾旱、ph 不當亦加劇。應測土葉並檢查水分，均勻少量補硼、穩定根域水分與改善酸鹼，不可僅增加大量氮肥。\n\n### 原理拆解：為什麼會這樣？\n\n**缺硼先傷哪些功能**\n\n硼參與細胞壁穩定及分生組織發育，亦影響花粉萌發、花粉管伸長與受精。缺乏時幼嫩組織生長不正常，可見脆裂、頂芽受損或果實凹凸，生殖器官也可能先失去功能而減少著果。\n\n**為何水分與土壤也重要**\n\n硼供應受土壤有效性、根域 ph、含水及根系活力影響。乾旱可使根吸收與輸送不足，土中有硼不代表發育部位已收到。硼在體內的再移動依物種而異，具多元醇運輸的部分果樹不能套用完全不移動的規則。\n\n**診斷與補充的界線**\n\n以作物、葉齡、裂柄流膠及果實畸形的組合建立判斷，配土葉分析排除病毒、藥害與鈣問題。硼的缺乏與毒害範圍較窄，補充應少量、均勻、依建議執行；過量也會造成葉片壞死，不能把所有裂果一律用硼處理。\n\n### 可直接練寫的完整答案\n\n葉脆捲縮、葉柄裂流膠、果面凹凸優先考慮缺硼，網室排雨與局部灌溉可能使硼供應與根吸收不穩，乾旱、ph 不當亦加劇。應測土葉並檢查水分，均勻少量補硼、穩定根域水分與改善酸鹼，不可僅增加大量氮肥。\n\n硼參與細胞壁穩定及分生組織發育，亦影響花粉萌發、花粉管伸長與受精。缺乏時幼嫩組織生長不正常，可見脆裂、頂芽受損或果實凹凸，生殖器官也可能先失去功能而減少著果。\n\n硼供應受土壤有效性、根域 ph、含水及根系活力影響。乾旱可使根吸收與輸送不足，土中有硼不代表發育部位已收到。硼在體內的再移動依物種而異，具多元醇運輸的部分果樹不能套用完全不移動的規則。\n\n### 實例：把原理用在情境中\n\n番木瓜若同時有新葉脆、葉柄龜裂流膠與瘤果，比只有一個果實畸形更支持缺硼；若全園只有單株葉斑，則須更重視局部根病或感染性問題。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：診斷、易發條件、驗證與安全改善。\n\n- **易發條件**\n- **驗證與安全改善**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有硬果、空心或裂果都直接診斷成缺硼。\n 98 果樹學"},{"id":"果樹學-98-八","s":"果樹學","y":98,"n":"八","t":"幼果呼吸幾乎零是否正確","body":"<h2>第八題｜幼果呼吸幾乎零是否正確（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>幼果呼吸幾乎零是否正確<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=25\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>活的發育幼果必須呼吸供能，若近零要查量測方法。幼果小、絕對釋放量低，儀器解析度、漏氣及背景扣除可造成假零；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>幼嫩組織必須有能量來源<\/strong><\/p>\n<p>細胞分裂、離子吸收及生合成都需要 ATP，幼果並不因體積小就停止呼吸。討論呼吸資料須區分單位重量呼吸率、單果總量、淨氣體交換與檢測極限。<\/p>\n<p><strong>量測到零不代表生理上不存在<\/strong><\/p>\n<p>光下固定 CO₂ 可能抵銷呼吸釋放，儀器不夠靈敏或計算基準不同也會使數值近零。應檢查暗測或光測、鮮重與時間單位、空白校正及組織是否活體，而不是直接接受不合理結論。<\/p>\n<p><strong>呼吸高峰需連同成熟階段解釋<\/strong><\/p>\n<p>更年性果實的成熟呼吸上升與自催化乙烯有關，但單見呼吸上升仍須排除傷害、溫度或病原。非更年性不等於不呼吸，也不等於完全不對乙烯產生任何反應。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>活的發育幼果必須呼吸供能，若近零要查量測方法。幼果小、絕對釋放量低，儀器解析度、漏氣及背景扣除可造成假零；<\/p>\n<p>光下果皮光合作用也能抵銷 CO₂。應增加適當樣量、暗測、做空白校正與重複，並報每 kg 每小時及檢出限。<\/p>\n<p>細胞分裂、離子吸收及生合成都需要 ATP，幼果並不因體積小就停止呼吸。討論呼吸資料須區分單位重量呼吸率、單果總量、淨氣體交換與檢測極限。<\/p>\n<p>光下固定 CO₂ 可能抵銷呼吸釋放，儀器不夠靈敏或計算基準不同也會使數值近零。應檢查暗測或光測、鮮重與時間單位、空白校正及組織是否活體，而不是直接接受不合理結論。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>木瓜幼果若測得淨 CO₂ 釋放接近零，先比較暗中量測與光下量測，再確認是每克還是每果；不能據此斷言幼果不需要能量。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：生理判斷、技術誤差、淨交換與改進。<\/p>\n<ul>\n<li><strong>生理判斷<\/strong><\/li>\n<li><strong>技術誤差<\/strong><\/li>\n<li><strong>淨交換與改進<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把淨交換為零寫成粒線體停止代謝。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=25","md":"98年果樹學_逐題教學詳解.md","search":"幼果呼吸幾乎零是否正確 ## 第八題｜幼果呼吸幾乎零是否正確（10 分）\n\n### 題意與作答範圍\n\n本題重點：**幼果呼吸幾乎零是否正確**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=25)。\n\n### 先掌握答案\n\n活的發育幼果必須呼吸供能，若近零要查量測方法。幼果小、絕對釋放量低，儀器解析度、漏氣及背景扣除可造成假零；\n\n### 原理拆解：為什麼會這樣？\n\n**幼嫩組織必須有能量來源**\n\n細胞分裂、離子吸收及生合成都需要 atp，幼果並不因體積小就停止呼吸。討論呼吸資料須區分單位重量呼吸率、單果總量、淨氣體交換與檢測極限。\n\n**量測到零不代表生理上不存在**\n\n光下固定 co₂ 可能抵銷呼吸釋放，儀器不夠靈敏或計算基準不同也會使數值近零。應檢查暗測或光測、鮮重與時間單位、空白校正及組織是否活體，而不是直接接受不合理結論。\n\n**呼吸高峰需連同成熟階段解釋**\n\n更年性果實的成熟呼吸上升與自催化乙烯有關，但單見呼吸上升仍須排除傷害、溫度或病原。非更年性不等於不呼吸，也不等於完全不對乙烯產生任何反應。\n\n### 可直接練寫的完整答案\n\n活的發育幼果必須呼吸供能，若近零要查量測方法。幼果小、絕對釋放量低，儀器解析度、漏氣及背景扣除可造成假零；\n\n光下果皮光合作用也能抵銷 co₂。應增加適當樣量、暗測、做空白校正與重複，並報每 kg 每小時及檢出限。\n\n細胞分裂、離子吸收及生合成都需要 atp，幼果並不因體積小就停止呼吸。討論呼吸資料須區分單位重量呼吸率、單果總量、淨氣體交換與檢測極限。\n\n光下固定 co₂ 可能抵銷呼吸釋放，儀器不夠靈敏或計算基準不同也會使數值近零。應檢查暗測或光測、鮮重與時間單位、空白校正及組織是否活體，而不是直接接受不合理結論。\n\n### 實例：把原理用在情境中\n\n木瓜幼果若測得淨 co₂ 釋放接近零，先比較暗中量測與光下量測，再確認是每克還是每果；不能據此斷言幼果不需要能量。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：生理判斷、技術誤差、淨交換與改進。\n\n- **生理判斷**\n- **技術誤差**\n- **淨交換與改進**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把淨交換為零寫成粒線體停止代謝。\n 98 果樹學"},{"id":"果樹學-98-九","s":"果樹學","y":98,"n":"九","t":"木瓜轉色呼吸上升意義","body":"<h2>第九題｜木瓜轉色呼吸上升意義（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>木瓜轉色呼吸上升意義<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=25\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>番木瓜為更年性果實，轉色期呼吸上升可反映成熟躍變，伴隨乙烯自催化、軟化與香氣形成。但單次上升也可能由傷害、病害或溫度改變造成，宜連續量測、控制溫度並同測乙烯、硬度和色澤。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>幼嫩組織必須有能量來源<\/strong><\/p>\n<p>細胞分裂、離子吸收及生合成都需要 ATP，幼果並不因體積小就停止呼吸。討論呼吸資料須區分單位重量呼吸率、單果總量、淨氣體交換與檢測極限。<\/p>\n<p><strong>量測到零不代表生理上不存在<\/strong><\/p>\n<p>光下固定 CO₂ 可能抵銷呼吸釋放，儀器不夠靈敏或計算基準不同也會使數值近零。應檢查暗測或光測、鮮重與時間單位、空白校正及組織是否活體，而不是直接接受不合理結論。<\/p>\n<p><strong>呼吸高峰需連同成熟階段解釋<\/strong><\/p>\n<p>更年性果實的成熟呼吸上升與自催化乙烯有關，但單見呼吸上升仍須排除傷害、溫度或病原。非更年性不等於不呼吸，也不等於完全不對乙烯產生任何反應。<\/p>\n<p><strong>成熟反應與乙烯感受<\/strong><\/p>\n<p>乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。<\/p>\n<p><strong>更年性與非更年性要比較反應型態<\/strong><\/p>\n<p>具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。<\/p>\n<p><strong>催熟與延後成熟都不能忽略品質<\/strong><\/p>\n<p>乙烯可整齊催熟已達生理成熟的果，卻不能讓極幼果補足田間累積不足的乾物；1-MCP 阻斷感受可延緩部分產品老化，但過強處理可能影響正常後熟。脫綠、果肉軟化和增甜亦不是必然同步。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>番木瓜為更年性果實，轉色期呼吸上升可反映成熟躍變，伴隨乙烯自催化、軟化與香氣形成。但單次上升也可能由傷害、病害或溫度改變造成，宜連續量測、控制溫度並同測乙烯、硬度和色澤。<\/p>\n<p>細胞分裂、離子吸收及生合成都需要 ATP，幼果並不因體積小就停止呼吸。討論呼吸資料須區分單位重量呼吸率、單果總量、淨氣體交換與檢測極限。<\/p>\n<p>光下固定 CO₂ 可能抵銷呼吸釋放，儀器不夠靈敏或計算基準不同也會使數值近零。應檢查暗測或光測、鮮重與時間單位、空白校正及組織是否活體，而不是直接接受不合理結論。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>木瓜幼果若測得淨 CO₂ 釋放接近零，先比較暗中量測與光下量測，再確認是每克還是每果；不能據此斷言幼果不需要能量。<\/p>\n<p>香蕉在不當高溫下，果肉可軟化而果皮仍綠，顯示果肉成熟與葉綠素降解可不同步。不能僅看果皮未黃，就判斷乙烯完全沒有作用。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：更年性後熟、伴隨特徵、排除非成熟原因。<\/p>\n<ul>\n<li><strong>更年性後熟<\/strong><\/li>\n<li><strong>伴隨特徵<\/strong><\/li>\n<li><strong>排除非成熟原因<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把淨交換為零寫成粒線體停止代謝。<\/li>\n<li>說非更年性果實完全不會回應乙烯。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=25","md":"98年果樹學_逐題教學詳解.md","search":"木瓜轉色呼吸上升意義 ## 第九題｜木瓜轉色呼吸上升意義（10 分）\n\n### 題意與作答範圍\n\n本題重點：**木瓜轉色呼吸上升意義**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=25)。\n\n### 先掌握答案\n\n番木瓜為更年性果實，轉色期呼吸上升可反映成熟躍變，伴隨乙烯自催化、軟化與香氣形成。但單次上升也可能由傷害、病害或溫度改變造成，宜連續量測、控制溫度並同測乙烯、硬度和色澤。\n\n### 原理拆解：為什麼會這樣？\n\n**幼嫩組織必須有能量來源**\n\n細胞分裂、離子吸收及生合成都需要 atp，幼果並不因體積小就停止呼吸。討論呼吸資料須區分單位重量呼吸率、單果總量、淨氣體交換與檢測極限。\n\n**量測到零不代表生理上不存在**\n\n光下固定 co₂ 可能抵銷呼吸釋放，儀器不夠靈敏或計算基準不同也會使數值近零。應檢查暗測或光測、鮮重與時間單位、空白校正及組織是否活體，而不是直接接受不合理結論。\n\n**呼吸高峰需連同成熟階段解釋**\n\n更年性果實的成熟呼吸上升與自催化乙烯有關，但單見呼吸上升仍須排除傷害、溫度或病原。非更年性不等於不呼吸，也不等於完全不對乙烯產生任何反應。\n\n**成熟反應與乙烯感受**\n\n乙烯是氣態激素，與受體結合後解除受體對下游的負調節，經訊號與轉錄調控影響軟化、色素、香氣及衰老。反應取決種類、果齡、溫度、濃度與時間，不是所有組織都以相同方式回應。\n\n**更年性與非更年性要比較反應型態**\n\n具後熟能力的更年性果實，外源乙烯可啟動自催化乙烯與呼吸躍升，常主要改變高峰出現時間。非更年性也可能暫時增加呼吸或脫綠，但通常不發展同樣的自催化成熟程序；移除乙烯後的反應因此重要。\n\n**催熟與延後成熟都不能忽略品質**\n\n乙烯可整齊催熟已達生理成熟的果，卻不能讓極幼果補足田間累積不足的乾物；1-mcp 阻斷感受可延緩部分產品老化，但過強處理可能影響正常後熟。脫綠、果肉軟化和增甜亦不是必然同步。\n\n### 可直接練寫的完整答案\n\n番木瓜為更年性果實，轉色期呼吸上升可反映成熟躍變，伴隨乙烯自催化、軟化與香氣形成。但單次上升也可能由傷害、病害或溫度改變造成，宜連續量測、控制溫度並同測乙烯、硬度和色澤。\n\n細胞分裂、離子吸收及生合成都需要 atp，幼果並不因體積小就停止呼吸。討論呼吸資料須區分單位重量呼吸率、單果總量、淨氣體交換與檢測極限。\n\n光下固定 co₂ 可能抵銷呼吸釋放，儀器不夠靈敏或計算基準不同也會使數值近零。應檢查暗測或光測、鮮重與時間單位、空白校正及組織是否活體，而不是直接接受不合理結論。\n\n### 實例：把原理用在情境中\n\n木瓜幼果若測得淨 co₂ 釋放接近零，先比較暗中量測與光下量測，再確認是每克還是每果；不能據此斷言幼果不需要能量。\n\n香蕉在不當高溫下，果肉可軟化而果皮仍綠，顯示果肉成熟與葉綠素降解可不同步。不能僅看果皮未黃，就判斷乙烯完全沒有作用。\n\n### 配分重點：哪些內容不能漏？
