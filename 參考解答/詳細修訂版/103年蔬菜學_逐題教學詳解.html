ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 6 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"蔬菜學-103-一","s":"蔬菜學","y":103,"n":"一","t":"回交與 MAS","body":"<h2>第一題｜回交與 MAS（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>回交與 MAS<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=12\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>回交將含目標性狀的雜交後代反覆與優良輪迴親本交配，保留其大部分背景並導入目標基因。用標誌做前景選拔保抗性、重組選拔減連鎖拖累、背景選拔加速恢復輪迴親本，最後自交固定並表型驗證；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>標誌提供基因型線索<\/strong><\/p>\n<p>分子標誌是可檢測的 DNA 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 MAS 與基因轉殖的操作與法規概念不同。<\/p>\n<p><strong>連鎖不等於永遠不分離<\/strong><\/p>\n<p>若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。<\/p>\n<p><strong>回交可兼顧前景與背景選拔<\/strong><\/p>\n<p>前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。MAS 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。<\/p>\n<p><strong>F1 一致性來自親本與受控交配<\/strong><\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<p><strong>制種須阻止不需要的授粉<\/strong><\/p>\n<p>去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。<\/p>\n<p><strong>F2 分離是留種限制的主因<\/strong><\/p>\n<p>F1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>回交將含目標性狀的雜交後代反覆與優良輪迴親本交配，保留其大部分背景並導入目標基因。用標誌做前景選拔保抗性、重組選拔減連鎖拖累、背景選拔加速恢復輪迴親本，最後自交固定並表型驗證；<\/p>\n<p>適合少數主效基因，複雜性狀不能只靠一個標誌。<\/p>\n<p>分子標誌是可檢測的 DNA 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 MAS 與基因轉殖的操作與法規概念不同。<\/p>\n<p>若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。<\/p>\n<p>西瓜 F1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 F1 果實留種所得下一代，不能保證維持原果形與整齊性。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：回交目的流程、三類標誌選拔與優勢限制。<\/p>\n<ul>\n<li><strong>回交目的流程<\/strong><\/li>\n<li><strong>三類標誌選拔與優勢限制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把分子標誌說成施用後使植物產生抗性的藥劑。<\/li>\n<li>寫成 F1 種子完全不能發芽。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=12","md":"103年蔬菜學_逐題教學詳解.md","search":"回交與 mas ## 第一題｜回交與 mas（15 分）\n\n### 題意與作答範圍\n\n本題重點：**回交與 mas**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=12)。\n\n### 先掌握答案\n\n回交將含目標性狀的雜交後代反覆與優良輪迴親本交配，保留其大部分背景並導入目標基因。用標誌做前景選拔保抗性、重組選拔減連鎖拖累、背景選拔加速恢復輪迴親本，最後自交固定並表型驗證；\n\n### 原理拆解：為什麼會這樣？\n\n**標誌提供基因型線索**\n\n分子標誌是可檢測的 dna 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 mas 與基因轉殖的操作與法規概念不同。\n\n**連鎖不等於永遠不分離**\n\n若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。\n\n**回交可兼顧前景與背景選拔**\n\n前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。mas 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。\n\n**f1 一致性來自親本與受控交配**\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n**制種須阻止不需要的授粉**\n\n去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。\n\n**f2 分離是留種限制的主因**\n\nf1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。\n\n### 可直接練寫的完整答案\n\n回交將含目標性狀的雜交後代反覆與優良輪迴親本交配，保留其大部分背景並導入目標基因。用標誌做前景選拔保抗性、重組選拔減連鎖拖累、背景選拔加速恢復輪迴親本，最後自交固定並表型驗證；\n\n適合少數主效基因，複雜性狀不能只靠一個標誌。\n\n分子標誌是可檢測的 dna 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 mas 與基因轉殖的操作與法規概念不同。\n\n若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。\n\n### 實例：把原理用在情境中\n\n抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。\n\n西瓜 f1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 f1 果實留種所得下一代，不能保證維持原果形與整齊性。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：回交目的流程、三類標誌選拔與優勢限制。\n\n- **回交目的流程**\n- **三類標誌選拔與優勢限制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把分子標誌說成施用後使植物產生抗性的藥劑。\n- 寫成 f1 種子完全不能發芽。\n 103 蔬菜學"},{"id":"蔬菜學-103-二","s":"蔬菜學","y":103,"n":"二","t":"氮肥種類時機與硝酸鹽","body":"<h2>第二題｜氮肥種類時機與硝酸鹽（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>氮肥種類時機與硝酸鹽<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=12\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>基肥依土壤選腐熟有機肥與適量緩效氮，生長需氮期分次用硝態、銨態或尿素；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>氮為何促進營養生長<\/strong><\/p>\n<p>氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。<\/p>\n<p><strong>吸收氮不等於已同化<\/strong><\/p>\n<p>根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 GS/GOGAT 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。<\/p>\n<p><strong>形式、總量與時期一起決定結果<\/strong><\/p>\n<p>銨態並非不好，但根域容量小、緩衝弱時，過量銨容易酸化、毒害及拮抗鈣鉀鎂。果實期又須避免過氮徒長、陰蔽與品質下降。因此應依土水、光量、生育需求分次施肥，而不是只選一個氮形式就認為問題解決。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>基肥依土壤選腐熟有機肥與適量緩效氮，生長需氮期分次用硝態、銨態或尿素；<\/p>\n<p>結實後避免氮過量而徒長。硝酸鹽累積因吸收超過還原同化，常見低光、低溫、氮過量及品種差異。以分析施肥、採前合理減氮、良好光環境與適熟採收減少，不能把硝酸鹽當與所有氮同義。<\/p>\n<p>氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。<\/p>\n<p>根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 GS/GOGAT 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>番茄結果後期若高氨加上灌溉不穩，果端鈣供應更易失衡；改硝態為主仍須同時控制總氮、供水與根活力，才能有效降低風險。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：形式、時期目的、累積機制與防範。<\/p>\n<ul>\n<li><strong>時期目的<\/strong><\/li>\n<li><strong>累積機制與防範<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把硝酸鹽累積說成所有氮都完全不能被利用。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=12","md":"103年蔬菜學_逐題教學詳解.md","search":"氮肥種類時機與硝酸鹽 ## 第二題｜氮肥種類時機與硝酸鹽（15 分）\n\n### 題意與作答範圍\n\n本題重點：**氮肥種類時機與硝酸鹽**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=12)。\n\n### 先掌握答案\n\n基肥依土壤選腐熟有機肥與適量緩效氮，生長需氮期分次用硝態、銨態或尿素；\n\n### 原理拆解：為什麼會這樣？\n\n**氮為何促進營養生長**\n\n氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。\n\n**吸收氮不等於已同化**\n\n根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 gs/gogat 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。\n\n**形式、總量與時期一起決定結果**\n\n銨態並非不好，但根域容量小、緩衝弱時，過量銨容易酸化、毒害及拮抗鈣鉀鎂。果實期又須避免過氮徒長、陰蔽與品質下降。因此應依土水、光量、生育需求分次施肥，而不是只選一個氮形式就認為問題解決。\n\n### 可直接練寫的完整答案\n\n基肥依土壤選腐熟有機肥與適量緩效氮，生長需氮期分次用硝態、銨態或尿素；\n\n結實後避免氮過量而徒長。硝酸鹽累積因吸收超過還原同化，常見低光、低溫、氮過量及品種差異。以分析施肥、採前合理減氮、良好光環境與適熟採收減少，不能把硝酸鹽當與所有氮同義。\n\n氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。\n\n根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 gs/gogat 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。\n\n### 實例：把原理用在情境中\n\n番茄結果後期若高氨加上灌溉不穩，果端鈣供應更易失衡；改硝態為主仍須同時控制總氮、供水與根活力，才能有效降低風險。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：形式、時期目的、累積機制與防範。\n\n- **時期目的**\n- **累積機制與防範**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把硝酸鹽累積說成所有氮都完全不能被利用。\n 103 蔬菜學"},{"id":"蔬菜學-103-三","s":"蔬菜學","y":103,"n":"三","t":"五種調節處理","body":"<h2>第三題｜五種調節處理（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五種調節處理<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=12\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>胡瓜乙烯利通常於幼苗適期促雌花；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先辨識限制產期的生理關卡<\/strong><\/p>\n<p>產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。<\/p>\n<p><strong>處理須在可反應的階段<\/strong><\/p>\n<p>同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。<\/p>\n<p><strong>移動花期之後仍有生產風險<\/strong><\/p>\n<p>非自然盛產期可能遇不利授粉、低光、高溫或病蟲，果實品質與產量不保證同步提高。完整答案應包含後續授粉、負載與採收安排，以及是否能以售價補償成本。<\/p>\n<p><strong>先問有沒有受精<\/strong><\/p>\n<p>單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。<\/p>\n<p><strong>為何沒有正常種子仍能結果<\/strong><\/p>\n<p>正常發育種子會提供或誘導支持子房生長的激素訊號。遺傳性單為結果或外施調節劑可在缺乏受精時提供相似支持；種子敗育型則可能在初期已建立足以使果實繼續生長的條件。<\/p>\n<p><strong>無子化與膨大必須分開思考<\/strong><\/p>\n<p>有子葡萄的無子化須依品種、花期以合適處理影響種子形成，花後可能另需促果粒膨大。時機錯誤會落果、穗軸或果粒異常；不能給一個濃度宣稱適用所有葡萄。無融合生殖是無正常有性受精而產胚，仍可有種子，並非同義詞。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>胡瓜乙烯利通常於幼苗適期促雌花；<\/p>\n<p>馬鈴薯塊莖 α-萘乙酸甲酯曾用抑芽保藏，須與現行登記區分；<\/p>\n<p>番茄開花花序用 2,4-D 類生長素與激勃素可促低溫等條件下坐果／單為結果，但錯期過量致畸；<\/p>\n<p>芹菜採收前適期 GA 促葉柄伸長；<\/p>\n<p>洋蔥在近成熟而葉仍能吸收時 MH 抑制貯藏萌芽。實際均以核准用途與時機為準。<\/p>\n<p>產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。<\/p>\n<p>同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>紅龍果適當品種可利用夜間照光調節開花，但仍須評估夜溫、花粉與授粉作業；有花並不等於必能達到預期果重與採收量。<\/p>\n<p>栽培香蕉可用作單為結果例，許多無子葡萄作種子敗育例；柑橘珠心胚說明無融合生殖可產生帶胚種子，三者不能互換。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：各 4 分，目的、時期、原理與錯用風險。<\/p>\n<ul>\n<li><strong>各 4 分，目的<\/strong><\/li>\n<li><strong>原理與錯用風險<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將所有產調都解釋成解除休眠。<\/li>\n<li>把所有無子葡萄都說成未曾受精。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=12","md":"103年蔬菜學_逐題教學詳解.md","search":"五種調節處理 ## 第三題｜五種調節處理（20 分）\n\n### 題意與作答範圍\n\n本題重點：**五種調節處理**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=12)。\n\n### 先掌握答案\n\n胡瓜乙烯利通常於幼苗適期促雌花；\n\n### 原理拆解：為什麼會這樣？\n\n**先辨識限制產期的生理關卡**\n\n產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。\n\n**處理須在可反應的階段**\n\n同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。\n\n**移動花期之後仍有生產風險**\n\n非自然盛產期可能遇不利授粉、低光、高溫或病蟲，果實品質與產量不保證同步提高。完整答案應包含後續授粉、負載與採收安排，以及是否能以售價補償成本。\n\n**先問有沒有受精**\n\n單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。\n\n**為何沒有正常種子仍能結果**\n\n正常發育種子會提供或誘導支持子房生長的激素訊號。遺傳性單為結果或外施調節劑可在缺乏受精時提供相似支持；種子敗育型則可能在初期已建立足以使果實繼續生長的條件。\n\n**無子化與膨大必須分開思考**\n\n有子葡萄的無子化須依品種、花期以合適處理影響種子形成，花後可能另需促果粒膨大。時機錯誤會落果、穗軸或果粒異常；不能給一個濃度宣稱適用所有葡萄。無融合生殖是無正常有性受精而產胚，仍可有種子，並非同義詞。\n\n### 可直接練寫的完整答案\n\n胡瓜乙烯利通常於幼苗適期促雌花；\n\n馬鈴薯塊莖 α-萘乙酸甲酯曾用抑芽保藏，須與現行登記區分；\n\n番茄開花花序用 2,4-d 類生長素與激勃素可促低溫等條件下坐果／單為結果，但錯期過量致畸；\n\n芹菜採收前適期 ga 促葉柄伸長；\n\n洋蔥在近成熟而葉仍能吸收時 mh 抑制貯藏萌芽。實際均以核准用途與時機為準。\n\n產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。\n\n同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。\n\n### 實例：把原理用在情境中\n\n紅龍果適當品種可利用夜間照光調節開花，但仍須評估夜溫、花粉與授粉作業；有花並不等於必能達到預期果重與採收量。\n\n栽培香蕉可用作單為結果例，許多無子葡萄作種子敗育例；柑橘珠心胚說明無融合生殖可產生帶胚種子，三者不能互換。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：各 4 分，目的、時期、原理與錯用風險。\n\n- **各 4 分，目的**\n- **原理與錯用風險**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將所有產調都解釋成解除休眠。\n- 把所有無子葡萄都說成未曾受精。\n 103 蔬菜學"},{"id":"蔬菜學-103-四","s":"蔬菜學","y":103,"n":"四","t":"甘藍裂球","body":"<h2>第四題｜甘藍裂球（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>甘藍裂球<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=12\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>成熟葉球外葉擴張能力有限，遇旱後大量降雨／灌溉、過氮或延遲採收，內葉快速生長增加壓力造成裂開。選耐裂品種、均勻供水、適氮及成熟即採，雨前分批採收；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>裂球的直接原因是內外生長失衡<\/strong><\/p>\n<p>葉球形成後外層限制較強，內葉在突然供水或高氮下快速膨大，可使葉球裂開。預防宜在成熟前維持均勻供水、避免過氮並按成熟度採收；裂口後腐敗可能是次生感染，不能把後續病菌當成最初裂球原因。<\/p>\n<p><strong>先理解水勢與膨壓<\/strong><\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p><strong>由缺水到減產的連鎖<\/strong><\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<p><strong>管理不是只問澆多少<\/strong><\/p>\n<p>應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。<\/p>\n<p><strong>氮為何促進營養生長<\/strong><\/p>\n<p>氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。<\/p>\n<p><strong>吸收氮不等於已同化<\/strong><\/p>\n<p>根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 GS/GOGAT 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。<\/p>\n<p><strong>形式、總量與時期一起決定結果<\/strong><\/p>\n<p>銨態並非不好，但根域容量小、緩衝弱時，過量銨容易酸化、毒害及拮抗鈣鉀鎂。果實期又須避免過氮徒長、陰蔽與品質下降。因此應依土水、光量、生育需求分次施肥，而不是只選一個氮形式就認為問題解決。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>成熟葉球外葉擴張能力有限，遇旱後大量降雨／灌溉、過氮或延遲採收，內葉快速生長增加壓力造成裂開。選耐裂品種、均勻供水、適氮及成熟即採，雨前分批採收；<\/p>\n<p>必要適當傷根控水須避免病害與品質風險，不可把裂球當感染性病原。<\/p>\n<p>葉球形成後外層限制較強，內葉在突然供水或高氮下快速膨大，可使葉球裂開。預防宜在成熟前維持均勻供水、避免過氮並按成熟度採收；裂口後腐敗可能是次生感染，不能把後續病菌當成最初裂球原因。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。<\/p>\n<p>番茄結果後期若高氨加上灌溉不穩，果端鈣供應更易失衡；改硝態為主仍須同時控制總氮、供水與根活力，才能有效降低風險。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：內外生長差、環境營養、品種、採期與管理。<\/p>\n<ul>\n<li><strong>內外生長差<\/strong><\/li>\n<li><strong>環境營養<\/strong><\/li>\n<li><strong>採期與管理<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把有水等同根一定能吸到水。<\/li>\n<li>把硝酸鹽累積說成所有氮都完全不能被利用。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=12","md":"103年蔬菜學_逐題教學詳解.md","search":"甘藍裂球 ## 第四題｜甘藍裂球（15 分）\n\n### 題意與作答範圍\n\n本題重點：**甘藍裂球**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=12)。\n\n### 先掌握答案\n\n成熟葉球外葉擴張能力有限，遇旱後大量降雨／灌溉、過氮或延遲採收，內葉快速生長增加壓力造成裂開。選耐裂品種、均勻供水、適氮及成熟即採，雨前分批採收；\n\n### 原理拆解：為什麼會這樣？\n\n**裂球的直接原因是內外生長失衡**\n\n葉球形成後外層限制較強，內葉在突然供水或高氮下快速膨大，可使葉球裂開。預防宜在成熟前維持均勻供水、避免過氮並按成熟度採收；裂口後腐敗可能是次生感染，不能把後續病菌當成最初裂球原因。\n\n**先理解水勢與膨壓**\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n**由缺水到減產的連鎖**\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n**管理不是只問澆多少**\n\n應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。\n\n**氮為何促進營養生長**\n\n氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。\n\n**吸收氮不等於已同化**\n\n根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 gs/gogat 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。\n\n**形式、總量與時期一起決定結果**\n\n銨態並非不好，但根域容量小、緩衝弱時，過量銨容易酸化、毒害及拮抗鈣鉀鎂。果實期又須避免過氮徒長、陰蔽與品質下降。因此應依土水、光量、生育需求分次施肥，而不是只選一個氮形式就認為問題解決。\n\n### 可直接練寫的完整答案\n\n成熟葉球外葉擴張能力有限，遇旱後大量降雨／灌溉、過氮或延遲採收，內葉快速生長增加壓力造成裂開。選耐裂品種、均勻供水、適氮及成熟即採，雨前分批採收；\n\n必要適當傷根控水須避免病害與品質風險，不可把裂球當感染性病原。\n\n葉球形成後外層限制較強，內葉在突然供水或高氮下快速膨大，可使葉球裂開。預防宜在成熟前維持均勻供水、避免過氮並按成熟度採收；裂口後腐敗可能是次生感染，不能把後續病菌當成最初裂球原因。\n\n### 實例：把原理用在情境中\n\n旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。\n\n番茄結果後期若高氨加上灌溉不穩，果端鈣供應更易失衡；改硝態為主仍須同時控制總氮、供水與根活力，才能有效降低風險。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：內外生長差、環境營養、品種、採期與管理。\n\n- **內外生長差**\n- **環境營養**\n- **採期與管理**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把有水等同根一定能吸到水。\n- 把硝酸鹽累積說成所有氮都完全不能被利用。\n 103 蔬菜學"},{"id":"蔬菜學-103-五","s":"蔬菜學","y":103,"n":"五","t":"十種科、部位、英名","body":"<h2>第五題｜十種科、部位、英名（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>十種科、部位、英名<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=12\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>芹菜 celery：繖形科，葉柄葉；<\/p>\n<p>根芥菜 root mustard：十字花科，肥大下胚軸／根；<\/p>\n<p>薑 ginger：薑科，根莖；<\/p>\n<p>豆薯 yam bean：豆科，肥大貯藏根；<\/p>\n<p>馬鈴薯 potato：茄科，地下莖塊莖；<\/p>\n<p>蘆筍 asparagus：天門冬科（舊百合科），嫩梢；<\/p>\n<p>蕹菜 water spinach：旋花科，嫩莖葉；<\/p>\n<p>朝鮮薊 globe artichoke：菊科，未開頭狀花序的肉質總苞基部與花托；<\/p>\n<p>蓮藕 lotus root：蓮科（舊睡蓮科），根莖；<\/p>\n<p>荸薺 water chestnut：莎草科，球莖。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>器官來源比外觀名稱更可靠<\/strong><\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<p><strong>不同分類軸不能混用<\/strong><\/p>\n<p>花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。<\/p>\n<p><strong>名稱與例子要一對一<\/strong><\/p>\n<p>寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>薑 ginger：薑科，根莖；<\/td>\n<td>是橫走的莖，具有節與芽；蓮藕、薑雖俗稱根，實際為莖。<\/td>\n<\/tr>\n<tr>\n<td>蓮藕 lotus root：蓮科（舊睡蓮科），根莖；<\/td>\n<td>是橫走的莖，具有節與芽；蓮藕、薑雖俗稱根，實際為莖。<\/td>\n<\/tr>\n<tr>\n<td>荸薺 water chestnut：莎草科，球莖。<\/td>\n<td>主要是實心肥大莖，與以肉質鱗片葉儲藏的鱗莖不同，例如唐菖蒲、荸薺。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>芹菜 celery：繖形科，葉柄葉；<\/p>\n<p>根芥菜 root mustard：十字花科，肥大下胚軸／根；<\/p>\n<p>薑 ginger：薑科，根莖；<\/p>\n<p>豆薯 yam bean：豆科，肥大貯藏根；<\/p>\n<p>馬鈴薯 potato：茄科，地下莖塊莖；<\/p>\n<p>蘆筍 asparagus：天門冬科（舊百合科），嫩梢；<\/p>\n<p>蕹菜 water spinach：旋花科，嫩莖葉；<\/p>\n<p>朝鮮薊 globe artichoke：菊科，未開頭狀花序的肉質總苞基部與花托；<\/p>\n<p>蓮藕 lotus root：蓮科（舊睡蓮科），根莖；<\/p>\n<p>荸薺 water chestnut：莎草科，球莖。<\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：各 2 分，科、食部、英文三欄都列。<\/p>\n<ul>\n<li><strong>各 2 分，科<\/strong><\/li>\n<li><strong>英文三欄都列<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>看到地下器官就全部寫成根。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=12","md":"103年蔬菜學_逐題教學詳解.md","search":"十種科、部位、英名 ## 第五題｜十種科、部位、英名（20 分）\n\n### 題意與作答範圍\n\n本題重點：**十種科、部位、英名**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=12)。\n\n### 先掌握答案\n\n芹菜 celery：繖形科，葉柄葉；\n\n根芥菜 root mustard：十字花科，肥大下胚軸／根；\n\n薑 ginger：薑科，根莖；\n\n豆薯 yam bean：豆科，肥大貯藏根；\n\n馬鈴薯 potato：茄科，地下莖塊莖；\n\n蘆筍 asparagus：天門冬科（舊百合科），嫩梢；\n\n蕹菜 water spinach：旋花科，嫩莖葉；\n\n朝鮮薊 globe artichoke：菊科，未開頭狀花序的肉質總苞基部與花托；\n\n蓮藕 lotus root：蓮科（舊睡蓮科），根莖；\n\n荸薺 water chestnut：莎草科，球莖。\n\n### 原理拆解：為什麼會這樣？\n\n**器官來源比外觀名稱更可靠**\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n**不同分類軸不能混用**\n\n花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。\n\n**名稱與例子要一對一**\n\n寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| 薑 ginger：薑科，根莖； | 是橫走的莖，具有節與芽；蓮藕、薑雖俗稱根，實際為莖。 |\n| 蓮藕 lotus root：蓮科（舊睡蓮科），根莖； | 是橫走的莖，具有節與芽；蓮藕、薑雖俗稱根，實際為莖。 |\n| 荸薺 water chestnut：莎草科，球莖。 | 主要是實心肥大莖，與以肉質鱗片葉儲藏的鱗莖不同，例如唐菖蒲、荸薺。 |\n\n### 可直接練寫的完整答案\n\n芹菜 celery：繖形科，葉柄葉；\n\n根芥菜 root mustard：十字花科，肥大下胚軸／根；\n\n薑 ginger：薑科，根莖；\n\n豆薯 yam bean：豆科，肥大貯藏根；\n\n馬鈴薯 potato：茄科，地下莖塊莖；\n\n蘆筍 asparagus：天門冬科（舊百合科），嫩梢；\n\n蕹菜 water spinach：旋花科，嫩莖葉；\n\n朝鮮薊 globe artichoke：菊科，未開頭狀花序的肉質總苞基部與花托；\n\n蓮藕 lotus root：蓮科（舊睡蓮科），根莖；\n\n荸薺 water chestnut：莎草科，球莖。\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n### 實例：把原理用在情境中\n\n馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：各 2 分，科、食部、英文三欄都列。\n\n- **各 2 分，科**\n- **英文三欄都列**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 看到地下器官就全部寫成根。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 103 蔬菜學"},{"id":"蔬菜學-103-六","s":"蔬菜學","y":103,"n":"六","t":"青花菜硫苷英文翻譯","body":"<h2>第六題｜青花菜硫苷英文翻譯（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>青花菜硫苷英文翻譯<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=12\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。<\/p>\n<h3>完整參考譯文<\/h3>\n<p>青花菜富含硫代葡萄糖苷 GS，這些植物化學物可水解成具有已知抗癌生物活性的異硫氰酸酯。增加飲食中的硒攝取亦可降低癌症風險。先前研究指出，高濃度施硒會降低十字花科植物 GS 濃度。本研究針對五種基因型，測定硒施肥對青花菜花蕾組織不同 GS 累積的影響。茉莉酸甲酯為已知能刺激吲哚型 GS 生合成的誘導物，研究用它分析富硒條件下青花菜花蕾中吲哚型 GS 生合成能力的改變。<\/p>\n<h3>讀懂這段研究在說什麼<\/h3>\n<p><strong>營養提升是否犧牲原有機能成分<\/strong><\/p>\n<p>研究背景是硫苷水解產物及硒的營養價值，問題在施硒可能降低硫苷，接著比較五種基因型。需要分清 GS 原料與其水解產物，並保留高濃度處理的限制。原文涉及健康效果時應忠實譯為研究敘述，不能另加「食用即可治癌」等更強結論。<\/p>\n<h3>專業詞彙與翻譯辨析<\/h3>\n<table>\n<thead>\n<tr>\n<th>英文用語<\/th>\n<th>建議譯法<\/th>\n<th>讀法與限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>glucosinolates<\/td>\n<td>硫代葡萄糖苷<\/td>\n<td>可水解成其他生物活性產物的含硫化合物<\/td>\n<\/tr>\n<tr>\n<td>isothiocyanates<\/td>\n<td>異硫氰酸酯<\/td>\n<td>勿與原來的硫苷視為同一化合物<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>配分重點與檢查順序<\/h3>\n<p>15 分：GS 水解、硒高量效應、五基因型、茉莉酸甲酯及研究目的；健康敘述按原文翻譯。<\/p>\n<p>先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。<\/p>\n<h3>常見失分<\/h3>\n<ul>\n<li>把專業名詞按一般字義翻譯，或把相關性改成因果。<\/li>\n<li>省略轉折、條件或限制，使研究結論比原文更強。<\/li>\n<li>以摘要取代全文翻譯。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=12","md":"103年蔬菜學_逐題教學詳解.md","search":"青花菜硫苷英文翻譯 ## 第六題｜青花菜硫苷英文翻譯（15 分）\n\n### 題意與作答範圍\n\n本題重點：**青花菜硫苷英文翻譯**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=12)。\n\n### 先掌握答案\n\n這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。\n\n### 完整參考譯文\n\n青花菜富含硫代葡萄糖苷 gs，這些植物化學物可水解成具有已知抗癌生物活性的異硫氰酸酯。增加飲食中的硒攝取亦可降低癌症風險。先前研究指出，高濃度施硒會降低十字花科植物 gs 濃度。本研究針對五種基因型，測定硒施肥對青花菜花蕾組織不同 gs 累積的影響。茉莉酸甲酯為已知能刺激吲哚型 gs 生合成的誘導物，研究用它分析富硒條件下青花菜花蕾中吲哚型 gs 生合成能力的改變。\n\n### 讀懂這段研究在說什麼\n\n**營養提升是否犧牲原有機能成分**\n\n研究背景是硫苷水解產物及硒的營養價值，問題在施硒可能降低硫苷，接著比較五種基因型。需要分清 gs 原料與其水解產物，並保留高濃度處理的限制。原文涉及健康效果時應忠實譯為研究敘述，不能另加「食用即可治癌」等更強結論。\n\n### 專業詞彙與翻譯辨析\n\n| 英文用語 | 建議譯法 | 讀法與限制 |\n| --- | --- | --- |\n| glucosinolates | 硫代葡萄糖苷 | 可水解成其他生物活性產物的含硫化合物 |\n| isothiocyanates | 異硫氰酸酯 | 勿與原來的硫苷視為同一化合物 |\n\n### 配分重點與檢查順序\n\n15 分：gs 水解、硒高量效應、五基因型、茉莉酸甲酯及研究目的；健康敘述按原文翻譯。\n\n先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。\n\n### 常見失分\n\n- 把專業名詞按一般字義翻譯，或把相關性改成因果。\n- 省略轉折、條件或限制，使研究結論比原文更強。\n- 以摘要取代全文翻譯。\n 103 蔬菜學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
