ong>五種中文名與科<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C113.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Coriandrum sativum 芫荽／香菜，繖形科 Apiaceae；<\/p>\n<p>Solanum tuberosum 馬鈴薯，茄科；<\/p>\n<p>Momordica charantia 苦瓜，葫蘆科；<\/p>\n<p>Pisum sativum 豌豆，豆科；<\/p>\n<p>Allium fistulosum 青蔥，石蒜科（舊蔥科／百合科）。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>器官來源比外觀名稱更可靠<\/strong><\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<p><strong>不同分類軸不能混用<\/strong><\/p>\n<p>花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。<\/p>\n<p><strong>名稱與例子要一對一<\/strong><\/p>\n<p>寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>青蔥與洋蔥不同種，不能把 A. fistulosum 譯洋蔥。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Coriandrum sativum 芫荽／香菜，繖形科 Apiaceae；<\/p>\n<p>Solanum tuberosum 馬鈴薯，茄科；<\/p>\n<p>Momordica charantia 苦瓜，葫蘆科；<\/p>\n<p>Pisum sativum 豌豆，豆科；<\/p>\n<p>Allium fistulosum 青蔥，石蒜科（舊蔥科／百合科）。<\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：五種中文與科名，Allium 舊新分類可並列。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>看到地下器官就全部寫成根。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../C113.pdf#page=2","md":"113年蔬菜學_逐題教學詳解.md","search":"五種中文名與科 ## 第一題｜五種中文名與科（10 分）\n\n### 題意與作答範圍\n\n本題重點：**五種中文名與科**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c113.pdf#page=2)。\n\n### 先掌握答案\n\ncoriandrum sativum 芫荽／香菜，繖形科 apiaceae；\n\nsolanum tuberosum 馬鈴薯，茄科；\n\nmomordica charantia 苦瓜，葫蘆科；\n\npisum sativum 豌豆，豆科；\n\nallium fistulosum 青蔥，石蒜科（舊蔥科／百合科）。\n\n### 原理拆解：為什麼會這樣？\n\n**器官來源比外觀名稱更可靠**\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n**不同分類軸不能混用**\n\n花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。\n\n**名稱與例子要一對一**\n\n寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。\n\n### 這題要特別注意\n\n青蔥與洋蔥不同種，不能把 a. fistulosum 譯洋蔥。\n\n### 可直接練寫的完整答案\n\ncoriandrum sativum 芫荽／香菜，繖形科 apiaceae；\n\nsolanum tuberosum 馬鈴薯，茄科；\n\nmomordica charantia 苦瓜，葫蘆科；\n\npisum sativum 豌豆，豆科；\n\nallium fistulosum 青蔥，石蒜科（舊蔥科／百合科）。\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n### 實例：把原理用在情境中\n\n馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：五種中文與科名，allium 舊新分類可並列。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 看到地下器官就全部寫成根。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 113 蔬菜學"},{"id":"蔬菜學-113-二","s":"蔬菜學","y":113,"n":"二","t":"胡瓜苦味","body":"<h2>第二題｜胡瓜苦味（25 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>胡瓜苦味<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C113.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>主因為葫蘆素類 cucurbitacins（胡瓜常涉及 cucurbitacin C）的累積。基因型決定合成潛力，乾旱、溫度極端、供水不穩及其他逆境可增加苦味，果梗附近常較明顯。選無苦味穩定品種、維持均勻灌溉與適溫、平衡施肥、適熟採收；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>苦味不是糖分不足的同義詞<\/strong><\/p>\n<p>葫蘆素是特定苦味化合物，累積受遺傳與逆境共同影響。補糖或催熟不能合理當作去除苦味的方法。管理以穩定品種與環境、降低水熱逆境為主；異常苦果須剔除，不能只以加強調味掩蓋後銷售。<\/p>\n<p><strong>先區分傷害種類與發生條件<\/strong><\/p>\n<p>乾旱、淹水、高溫、寒害、凍害與鹽害的起始機制不同。寒害可在冰點以上發生於敏感作物，凍害則涉及結冰；淹水即使土壤水多，也可能因缺氧而使根無法正常供水。<\/p>\n<p><strong>從細胞功能連到可見症狀<\/strong><\/p>\n<p>膜性質改變、活性氧增加、酵素與能量代謝受阻，最後表現萎凋、褐化、落花或生長停滯。短期氣孔關閉可節水，長期卻限制 CO₂ 吸收；適應反應與傷害結果應分別說明。<\/p>\n<p><strong>預防與恢復管理各有時機<\/strong><\/p>\n<p>品種與產季選擇、灌排、覆蓋、通風遮陰及適度馴化可降低風險。受害後先評估根與生長點是否存活，再調整水肥；重施肥不能代替環境修復，受傷根系也可能無法利用增加的養分。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>苦味不是單純缺肥，也不能以靠近苦瓜種植就必然產生苦味解釋；<\/p>\n<p>當代授粉通常不會直接改變母體果肉的基因型。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>主因為葫蘆素類 cucurbitacins（胡瓜常涉及 cucurbitacin C）的累積。基因型決定合成潛力，乾旱、溫度極端、供水不穩及其他逆境可增加苦味，果梗附近常較明顯。選無苦味穩定品種、維持均勻灌溉與適溫、平衡施肥、適熟採收；<\/p>\n<p>嚴重異常苦果應剔除。<\/p>\n<p>葫蘆素是特定苦味化合物，累積受遺傳與逆境共同影響。補糖或催熟不能合理當作去除苦味的方法。管理以穩定品種與環境、降低水熱逆境為主；異常苦果須剔除，不能只以加強調味掩蓋後銷售。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>熱帶果菜低溫貯藏後可能出現凹陷、褐化與腐敗，而未曾結冰；應檢查該作物安全溫度與累積暴露時間，不能只把冷庫調得更冷。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>25 分：葫蘆素 5、基因與逆境 10、品種水肥等改善 10。<\/p>\n<ul>\n<li><strong>葫蘆素 5<\/strong><\/li>\n<li><strong>基因與逆境 10<\/strong><\/li>\n<li><strong>品種水肥等改善 10<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把寒害與凍害當成同義詞。<\/li>\n<\/ul>","source":"../../C113.pdf#page=2","md":"113年蔬菜學_逐題教學詳解.md","search":"胡瓜苦味 ## 第二題｜胡瓜苦味（25 分）\n\n### 題意與作答範圍\n\n本題重點：**胡瓜苦味**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c113.pdf#page=2)。\n\n### 先掌握答案\n\n主因為葫蘆素類 cucurbitacins（胡瓜常涉及 cucurbitacin c）的累積。基因型決定合成潛力，乾旱、溫度極端、供水不穩及其他逆境可增加苦味，果梗附近常較明顯。選無苦味穩定品種、維持均勻灌溉與適溫、平衡施肥、適熟採收；\n\n### 原理拆解：為什麼會這樣？\n\n**苦味不是糖分不足的同義詞**\n\n葫蘆素是特定苦味化合物，累積受遺傳與逆境共同影響。補糖或催熟不能合理當作去除苦味的方法。管理以穩定品種與環境、降低水熱逆境為主；異常苦果須剔除，不能只以加強調味掩蓋後銷售。\n\n**先區分傷害種類與發生條件**\n\n乾旱、淹水、高溫、寒害、凍害與鹽害的起始機制不同。寒害可在冰點以上發生於敏感作物，凍害則涉及結冰；淹水即使土壤水多，也可能因缺氧而使根無法正常供水。\n\n**從細胞功能連到可見症狀**\n\n膜性質改變、活性氧增加、酵素與能量代謝受阻，最後表現萎凋、褐化、落花或生長停滯。短期氣孔關閉可節水，長期卻限制 co₂ 吸收；適應反應與傷害結果應分別說明。\n\n**預防與恢復管理各有時機**\n\n品種與產季選擇、灌排、覆蓋、通風遮陰及適度馴化可降低風險。受害後先評估根與生長點是否存活，再調整水肥；重施肥不能代替環境修復，受傷根系也可能無法利用增加的養分。\n\n### 這題要特別注意\n\n苦味不是單純缺肥，也不能以靠近苦瓜種植就必然產生苦味解釋；\n\n當代授粉通常不會直接改變母體果肉的基因型。\n\n### 可直接練寫的完整答案\n\n主因為葫蘆素類 cucurbitacins（胡瓜常涉及 cucurbitacin c）的累積。基因型決定合成潛力，乾旱、溫度極端、供水不穩及其他逆境可增加苦味，果梗附近常較明顯。選無苦味穩定品種、維持均勻灌溉與適溫、平衡施肥、適熟採收；\n\n嚴重異常苦果應剔除。\n\n葫蘆素是特定苦味化合物，累積受遺傳與逆境共同影響。補糖或催熟不能合理當作去除苦味的方法。管理以穩定品種與環境、降低水熱逆境為主；異常苦果須剔除，不能只以加強調味掩蓋後銷售。\n\n### 實例：把原理用在情境中\n\n熱帶果菜低溫貯藏後可能出現凹陷、褐化與腐敗，而未曾結冰；應檢查該作物安全溫度與累積暴露時間，不能只把冷庫調得更冷。\n\n### 配分重點：哪些內容不能漏？\n\n25 分：葫蘆素 5、基因與逆境 10、品種水肥等改善 10。\n\n- **葫蘆素 5**\n- **基因與逆境 10**\n- **品種水肥等改善 10**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把寒害與凍害當成同義詞。\n 113 蔬菜學"},{"id":"蔬菜學-113-三","s":"蔬菜學","y":113,"n":"三","t":"結球萵苣產季、成熟度與外銷貯運","body":"<h2>第三題｜結球萵苣產季、成熟度與外銷貯運（16 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>結球萵苣產季、成熟度與外銷貯運<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C113.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>臺灣平地主要在秋冬至早春冷涼期生產。輸日長途貯運通常採適當緊實、尚未過熟的商業成熟球，俗稱約七至八分熟，實際依品種與客戶規格。輕採、剔病傷葉、迅速真空預冷或合適強制通風預冷，使用透氣保濕包裝與接近 0°C、避免凍結的冷鏈，維持高相對濕度並避乙烯。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>採後仍活著，也仍在消耗<\/strong><\/p>\n<p>蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。<\/p>\n<p><strong>低溫與保濕要兼顧氣體交換<\/strong><\/p>\n<p>快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。<\/p>\n<p><strong>截切菜需把安全與外觀一起管理<\/strong><\/p>\n<p>流程包括原料驗收、去除不良部位、適當清洗、切割、清洗消毒、瀝乾、包裝與冷藏配送，細節依設備與產品調整。消毒水須管控有效濃度、接觸時間與有機物負荷，目標包含避免交叉污染，並不等於滅菌。<\/p>\n<p><strong>生理成熟與食用成熟不同<\/strong><\/p>\n<p>生理成熟表示已達一定發育能力，食用成熟則符合風味、質地與用途；商業成熟還須考量運輸與客戶規格。更年性果實可能在適當生理成熟階段採後後熟，非更年性果實通常更依賴樹上累積品質。<\/p>\n<p><strong>用多指標降低誤判<\/strong><\/p>\n<p>外觀轉色受光與溫度影響，硬度受品種與水分影響，糖度也不是全部風味。澱粉指數、乾物率、可溶性固形物、酸度、底色及開花後日數等須依作物選用並互相校核。<\/p>\n<p><strong>採得早不必然更耐運且更好<\/strong><\/p>\n<p>過早採可能糖不足、無法正常軟化或風味差；過晚則易軟傷與腐敗。應依預計貯運時間設成熟範圍，配合溫度與包裝，不能用冷藏補回採收前未形成的糖與風味。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>預冷移除田間熱，低溫抑呼吸與黃化，高濕減失水；<\/p>\n<p>過熟球容易裂球與腐敗，過生則重量及口感不佳。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>臺灣平地主要在秋冬至早春冷涼期生產。輸日長途貯運通常採適當緊實、尚未過熟的商業成熟球，俗稱約七至八分熟，實際依品種與客戶規格。輕採、剔病傷葉、迅速真空預冷或合適強制通風預冷，使用透氣保濕包裝與接近 0°C、避免凍結的冷鏈，維持高相對濕度並避乙烯。<\/p>\n<p>蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。<\/p>\n<p>快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>截切萵苣若只處理褐變而未瀝乾與維持冷鏈，仍可能滲液、腐敗或發生微生物風險；應用同批產品的外觀、失重與衛生檢測共同決定期限。<\/p>\n<p>蘋果可用澱粉碘染、硬度與底色交叉判斷；鳳梨則需配合果肉糖酸與轉色，不能因外皮黃便推定所有果目和果肉成熟度相同。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>16 分：產季 2、成熟 2、貯藏技術 6、原理 6；七八分熟依規格。<\/p>\n<ul>\n<li><strong>產季 2<\/strong><\/li>\n<li><strong>成熟 2<\/strong><\/li>\n<li><strong>貯藏技術 6<\/strong><\/li>\n<li><strong>原理 6<\/strong><\/li>\n<li><strong>七八分熟依規格<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把清洗消毒寫成可以保證完全無菌。<\/li>\n<li>將採後可以軟化解釋成採得再早也能形成好風味。<\/li>\n<\/ul>","source":"../../C113.pdf#page=2","md":"113年蔬菜學_逐題教學詳解.md","search":"結球萵苣產季、成熟度與外銷貯運 ## 第三題｜結球萵苣產季、成熟度與外銷貯運（16 分）\n\n### 題意與作答範圍\n\n本題重點：**結球萵苣產季、成熟度與外銷貯運**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c113.pdf#page=2)。\n\n### 先掌握答案\n\n臺灣平地主要在秋冬至早春冷涼期生產。輸日長途貯運通常採適當緊實、尚未過熟的商業成熟球，俗稱約七至八分熟，實際依品種與客戶規格。輕採、剔病傷葉、迅速真空預冷或合適強制通風預冷，使用透氣保濕包裝與接近 0°c、避免凍結的冷鏈，維持高相對濕度並避乙烯。\n\n### 原理拆解：為什麼會這樣？\n\n**採後仍活著，也仍在消耗**\n\n蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。\n\n**低溫與保濕要兼顧氣體交換**\n\n快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。\n\n**截切菜需把安全與外觀一起管理**\n\n流程包括原料驗收、去除不良部位、適當清洗、切割、清洗消毒、瀝乾、包裝與冷藏配送，細節依設備與產品調整。消毒水須管控有效濃度、接觸時間與有機物負荷，目標包含避免交叉污染，並不等於滅菌。\n\n**生理成熟與食用成熟不同**\n\n生理成熟表示已達一定發育能力，食用成熟則符合風味、質地與用途；商業成熟還須考量運輸與客戶規格。更年性果實可能在適當生理成熟階段採後後熟，非更年性果實通常更依賴樹上累積品質。\n\n**用多指標降低誤判**\n\n外觀轉色受光與溫度影響，硬度受品種與水分影響，糖度也不是全部風味。澱粉指數、乾物率、可溶性固形物、酸度、底色及開花後日數等須依作物選用並互相校核。\n\n**採得早不必然更耐運且更好**\n\n過早採可能糖不足、無法正常軟化或風味差；過晚則易軟傷與腐敗。應依預計貯運時間設成熟範圍，配合溫度與包裝，不能用冷藏補回採收前未形成的糖與風味。\n\n### 這題要特別注意\n\n預冷移除田間熱，低溫抑呼吸與黃化，高濕減失水；\n\n過熟球容易裂球與腐敗，過生則重量及口感不佳。\n\n### 可直接練寫的完整答案\n\n臺灣平地主要在秋冬至早春冷涼期生產。輸日長途貯運通常採適當緊實、尚未過熟的商業成熟球，俗稱約七至八分熟，實際依品種與客戶規格。輕採、剔病傷葉、迅速真空預冷或合適強制通風預冷，使用透氣保濕包裝與接近 0°c、避免凍結的冷鏈，維持高相對濕度並避乙烯。\n\n蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。\n\n快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。\n\n### 實例：把原理用在情境中\n\n截切萵苣若只處理褐變而未瀝乾與維持冷鏈，仍可能滲液、腐敗或發生微生物風險；應用同批產品的外觀、失重與衛生檢測共同決定期限。\n\n蘋果可用澱粉碘染、硬度與底色交叉判斷；鳳梨則需配合果肉糖酸與轉色，不能因外皮黃便推定所有果目和果肉成熟度相同。\n\n### 配分重點：哪些內容不能漏？\n\n16 分：產季 2、成熟 2、貯藏技術 6、原理 6；七八分熟依規格。\n\n- **產季 2**\n- **成熟 2**\n- **貯藏技術 6**\n- **原理 6**\n- **七八分熟依規格**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把清洗消毒寫成可以保證完全無菌。\n- 將採後可以軟化解釋成採得再早也能形成好風味。\n 113 蔬菜學"},{"id":"蔬菜學-113-四","s":"蔬菜學","y":113,"n":"四","t":"截切萵苣流程與原理","body":"<h2>第四題｜截切萵苣流程與原理（14 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>截切萵苣流程與原理<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C113.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>驗收→低溫整理外葉與去芯→潔淨截切→飲用水品質清洗與經驗證消毒→瀝水／離心脫水→稱量→合適膜材／氣調包裝→全程低溫配送及陳列。潔淨加工減污染，低溫抑傷口呼吸與褐變，去除自由水減微生物，包裝減失水並調節 O₂、CO₂。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>採後仍活著，也仍在消耗<\/strong><\/p>\n<p>蔬 。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。\n\n快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。\n\n### 實例：把原理用在情境中\n\n截切萵苣若只處理褐變而未瀝乾與維持冷鏈，仍可能滲液、腐敗或發生微生物風險；應用同批產品的外觀、失重與衛生檢測共同決定期限。\n\n### 配分重點：哪些內容不能漏？\n\n14 分：流程 7、抑代謝保水衛生及氣體原理 7。\n\n- **流程 7**\n- **抑代謝保水衛生及氣體原理 7**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把清洗消毒寫成可以保證完全無菌。\n 113 蔬菜學"},{"id":"蔬菜學-113-五","s":"蔬菜學","y":113,"n":"五","t":"孟德爾三定律與例外","body":"<h2>第五題｜孟德爾三定律與例外（25 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>孟德爾三定律與例外<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C113.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>①顯隱性／均一律：純合親本相交，F1 表現整齊，完全顯性時呈顯性性狀。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先區分基因型與表型<\/strong><\/p>\n<p>基因型決定遺傳組合，表型則是基因型、環境及兩者交互作用的結果。相似表型不一定有相同基因型，環境造成的差異也不必然能遺傳給下一代。<\/p>\n<p><strong>孟德爾比例有適用前提<\/strong><\/p>\n<p>等位基因在減數分裂分離；不連鎖或相距夠遠的基因可近似獨立分配。3:1 或 9:3:3:1 的表型比還依完全顯性、相應交配方式及無其他干擾等條件，不是所有雜交都必須得到同一比例。<\/p>\n<p><strong>例外要說明改變哪個前提<\/strong><\/p>\n<p>緊密連鎖使親本型較多，上位作用改變基因間的表型組合，不完全顯性使雜合型可區辨，細胞質遺傳則可能有母系效應。多倍體、致死與選汰也會改變預期比例，不能只背例外名稱。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>現代教材常只稱兩大遺傳定律，顯性並非普遍；<\/p>\n<p>連鎖限制獨立分配適用條件，通常不表示等位基因不分離。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>①顯隱性／均一律：純合親本相交，F1 表現整齊，完全顯性時呈顯性性狀。<\/p>\n<p>②分離律：成對等位基因於配子形成時分離。<\/p>\n<p>③獨立分配律：不同基因座在不連鎖或足夠遠時，各自獨立分配。例外可舉番茄兩個緊密連鎖基因，後代親本型多於重組型，不符簡單 9:3:3:1；<\/p>\n<p>另有不完全顯性、上位作用、細胞質遺傳等改變表型比例。<\/p>\n<p>基因型決定遺傳組合，表型則是基因型、環境及兩者交互作用的結果。相似表型不一定有相同基因型，環境造成的差異也不必然能遺傳給下一代。<\/p>\n<p>等位基因在減數分裂分離；不連鎖或相距夠遠的基因可近似獨立分配。3:1 或 9:3:3:1 的表型比還依完全顯性、相應交配方式及無其他干擾等條件，不是所有雜交都必須得到同一比例。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>兩個緊密連鎖的番茄基因在測交後可能以親本組合為多，重組型較少；這是獨立分配前提不成立，不代表等位基因不再分離。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>25 分：三定律、遺傳比例條件、連鎖或其他例外與正確解釋。<\/p>\n<ul>\n<li><strong>三定律<\/strong><\/li>\n<li><strong>遺傳比例條件<\/strong><\/li>\n<li><strong>連鎖或其他例外與正確解釋<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>認為表型比不符 9:3:3:1 就推翻全部遺傳定律。<\/li>\n<\/ul>","source":"../../C113.pdf#page=2","md":"113年蔬菜學_逐題教學詳解.md","search":"孟德爾三定律與例外 ## 第五題｜孟德爾三定律與例外（25 分）\n\n### 題意與作答範圍\n\n本題重點：**孟德爾三定律與例外**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c113.pdf#page=2)。\n\n### 先掌握答案\n\n①顯隱性／均一律：純合親本相交，f1 表現整齊，完全顯性時呈顯性性狀。\n\n### 原理拆解：為什麼會這樣？\n\n**先區分基因型與表型**\n\n基因型決定遺傳組合，表型則是基因型、環境及兩者交互作用的結果。相似表型不一定有相同基因型，環境造成的差異也不必然能遺傳給下一代。\n\n**孟德爾比例有適用前提**\n\n等位基因在減數分裂分離；不連鎖或相距夠遠的基因可近似獨立分配。3:1 或 9:3:3:1 的表型比還依完全顯性、相應交配方式及無其他干擾等條件，不是所有雜交都必須得到同一比例。\n\n**例外要說明改變哪個前提**\n\n緊密連鎖使親本型較多，上位作用改變基因間的表型組合，不完全顯性使雜合型可區辨，細胞質遺傳則可能有母系效應。多倍體、致死與選汰也會改變預期比例，不能只背例外名稱。\n\n### 這題要特別注意\n\n現代教材常只稱兩大遺傳定律，顯性並非普遍；\n\n連鎖限制獨立分配適用條件，通常不表示等位基因不分離。\n\n### 可直接練寫的完整答案\n\n①顯隱性／均一律：純合親本相交，f1 表現整齊，完全顯性時呈顯性性狀。\n\n②分離律：成對等位基因於配子形成時分離。\n\n③獨立分配律：不同基因座在不連鎖或足夠遠時，各自獨立分配。例外可舉番茄兩個緊密連鎖基因，後代親本型多於重組型，不符簡單 9:3:3:1；\n\n另有不完全顯性、上位作用、細胞質遺傳等改變表型比例。\n\n基因型決定遺傳組合，表型則是基因型、環境及兩者交互作用的結果。相似表型不一定有相同基因型，環境造成的差異也不必然能遺傳給下一代。\n\n等位基因在減數分裂分離；不連鎖或相距夠遠的基因可近似獨立分配。3:1 或 9:3:3:1 的表型比還依完全顯性、相應交配方式及無其他干擾等條件，不是所有雜交都必須得到同一比例。\n\n### 實例：把原理用在情境中\n\n兩個緊密連鎖的番茄基因在測交後可能以親本組合為多，重組型較少；這是獨立分配前提不成立，不代表等位基因不再分離。\n\n### 配分重點：哪些內容不能漏？\n\n25 分：三定律、遺傳比例條件、連鎖或其他例外與正確解釋。\n\n- **三定律**\n- **遺傳比例條件**\n- **連鎖或其他例外與正確解釋**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 認為表型比不符 9:3:3:1 就推翻全部遺傳定律。\n 113 蔬菜學"},{"id":"蔬菜學-113-六","s":"蔬菜學","y":113,"n":"六","t":"英文翻譯","body":"<h2>第六題｜英文翻譯（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>英文翻譯<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C113.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。<\/p>\n<h3>完整參考譯文<\/h3>\n<p>GABA 是一種非蛋白質胺基酸，具有降低血壓的作用。番茄為全球最廣泛栽培與食用的蔬菜之一，其 GABA 含量高於其他許多主要作物。提高含量可進一步增強番茄果實的降血壓功能。麩胺酸脫羧酶 GAD 是 GABA 生合成的關鍵酵素；<\/p>\n<p>其 C 端具有調控酵素功能的自我抑制區域，刪除該區域會增加 GAD 活性。番茄基因體有五個 GAD 基因，其中兩個會在果實發育期間表現。<\/p>\n<p>為提高番茄 GABA 含量，我們利用 CRISPR/Cas9 技術，刪除兩個 GAD 基因的自我抑制區域，使 GABA 累積量增加 7 至 15 倍，但對植株大小、果實大小及產量造成不同程度影響。這是首篇描述利用 CRISPR/Cas9 系統提高番茄果實 GABA 含量的研究。<\/p>\n<p>結果為利用 CRISPR/Cas9 基因改造改善其他作物提供基礎。<\/p>\n<h3>讀懂這段研究在說什麼<\/h3>\n<p><strong>解除抑制提高 GABA 合成<\/strong><\/p>\n<p>GAD 催化麩胺酸脫羧形成 GABA；若刪除其自我抑制區，可能提高酵素活性與累積量。這與刪除整個功能基因方向相反。不同方法對生長的影響需依原文逐一比較，不能把「不同影響」譯成完全沒有影響，也不能把研究效果改成無條件醫療保證。<\/p>\n<h3>專業詞彙與翻譯辨析<\/h3>\n<table>\n<thead>\n<tr>\n<th>英文用語<\/th>\n<th>建議譯法<\/th>\n<th>讀法與限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>gamma-aminobutyric acid<\/td>\n<td>GABA<\/td>\n<td>γ-胺基丁酸，非蛋白質胺基酸<\/td>\n<\/tr>\n<tr>\n<td>glutamate decarboxylase<\/td>\n<td>GAD<\/td>\n<td>麩胺酸脫羧酶<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>容易譯錯的地方<\/h3>\n<p>刪除抑制區是提高酵素活性，不是刪除整個功能基因；「不同影響」不能翻成完全沒有副作用。<\/p>\n<h3>配分重點與檢查順序<\/h3>\n<p>10 分：GAD、自抑制 C 端、兩基因、7–15 倍與農藝副作用完整。<\/p>\n<p>先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。<\/p>\n<h3>常見失分<\/h3>\n<ul>\n<li>把專業名詞按一般字義翻譯，或把相關性改成因果。<\/li>\n<li>省略轉折、條件或限制，使研究結論比原文更強。<\/li>\n<li>以摘要取代全文翻譯。<\/li>\n<\/ul>","source":"../../C113.pdf#page=2","md":"113年蔬菜學_逐題教學詳解.md","search":"英文翻譯 ## 第六題｜英文翻譯（10 分）\n\n### 題意與作答範圍\n\n本題重點：**英文翻譯**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c113.pdf#page=2)。\n\n### 先掌握答案\n\n這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。\n\n### 完整參考譯文\n\ngaba 是一種非蛋白質胺基酸，具有降低血壓的作用。番茄為全球最廣泛栽培與食用的蔬菜之一，其 gaba 含量高於其他許多主要作物。提高含量可進一步增強番茄果實的降血壓功能。麩胺酸脫羧酶 gad 是 gaba 生合成的關鍵酵素；\n\n其 c 端具有調控酵素功能的自我抑制區域，刪除該區域會增加 gad 活性。番茄基因體有五個 gad 基因，其中兩個會在果實發育期間表現。\n\n為提高番茄 gaba 含量，我們利用 crispr/cas9 技術，刪除兩個 gad 基因的自我抑制區域，使 gaba 累積量增加 7 至 15 倍，但對植株大小、果實大小及產量造成不同程度影響。這是首篇描述利用 crispr/cas9 系統提高番茄果實 gaba 含量的研究。\n\n結果為利用 crispr/cas9 基因改造改善其他作物提供基礎。\n\n### 讀懂這段研究在說什麼\n\n**解除抑制提高 gaba 合成**\n\ngad 催化麩胺酸脫羧形成 gaba；若刪除其自我抑制區，可能提高酵素活性與累積量。這與刪除整個功能基因方向相反。不同方法對生長的影響需依原文逐一比較，不能把「不同影響」譯成完全沒有影響，也不能把研究效果改成無條件醫療保證。\n\n### 專業詞彙與翻譯辨析\n\n| 英文用語 | 建議譯法 | 讀法與限制 |\n| --- | --- | --- |\n| gamma-aminobutyric acid | gaba | γ-胺基丁酸，非蛋白質胺基酸 |\n| glutamate decarboxylase | gad | 麩胺酸脫羧酶 |\n\n### 容易譯錯的地方\n\n刪除抑制區是提高酵素活性，不是刪除整個功能基因；「不同影響」不能翻成完全沒有副作用。\n\n### 配分重點與檢查順序\n\n10 分：gad、自抑制 c 端、兩基因、7–15 倍與農藝副作用完整。\n\n先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。\n\n### 常見失分\n\n- 把專業名詞按一般字義翻譯，或把相關性改成因果。\n- 省略轉折、條件或限制，使研究結論比原文更強。\n- 以摘要取代全文翻譯。\n 113 蔬菜學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
