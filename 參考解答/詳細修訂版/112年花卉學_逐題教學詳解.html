ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 8 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"花卉學-112-一","s":"花卉學","y":112,"n":"一","t":"十種花序","body":"<h2>第一題｜十種花序（25 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>十種花序<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B112.pdf#page=1\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>(1)馬鞭草：無限花序，穗狀（園藝美女櫻常緊密呈繖房狀外觀，依所指材料）。<\/p>\n<p>(2)石竹：有限，聚繖。<\/p>\n<p>(3)唐菖蒲：無限，穗狀。<\/p>\n<p>(4)火鶴花：無限，肉穗。<\/p>\n<p>(5)棋盤腳：無限，總狀。<\/p>\n<p>(6)仙丹花：有限，頂生聚繖／複聚繖。<\/p>\n<p>(7)紅蝴蝶：若指豆科洋金鳳，無限，總狀。<\/p>\n<p>(8)鳶尾：有限，蠍尾狀聚繖／扇狀聚繖。<\/p>\n<p>(9)文殊蘭：常於園藝教材列無限繖形花序；<\/p>\n<p>嚴格發育形態亦有繖形狀聚繖的解釋。(10)向日葵：無限，頭狀。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先看主軸頂端是否終止於花<\/strong><\/p>\n<p>無限花序主軸可持續延伸，常見基部或周緣先開、往頂端或中心續開；有限花序主軸以頂花終止，後由側軸接續，常見頂端或中央先開。需看發育次序，不只看成熟時外形。<\/p>\n<p><strong>再看花梗、軸長與分枝<\/strong><\/p>\n<p>總狀花序具明顯主軸與有梗小花；穗狀小花無梗或近無梗；繖形花梗集中於近同一點；頭狀花序小花密集於膨大花托；肉穗花序的花軸肉質，常伴佛焰苞。<\/p>\n<p><strong>複合結構與俗名要註清<\/strong><\/p>\n<p>圓錐花序常由分枝總狀系統構成，複聚繖則由有限分枝重複。某些花序外觀近似繖形但發育屬聚繖，教材口徑可能不同，答題可在主要分類後註明，不宜用外形直接否定發育分類。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>看主軸頂端是否以花終止及開花次序，而非單看外形。「紅蝴蝶」等俗名有歧義，正式作答可補學名；<\/p>\n<p>文殊蘭宜依授課分類並說明外觀繖形。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>(1)馬鞭草：無限花序，穗狀（園藝美女櫻常緊密呈繖房狀外觀，依所指材料）。<\/p>\n<p>(2)石竹：有限，聚繖。<\/p>\n<p>(3)唐菖蒲：無限，穗狀。<\/p>\n<p>(4)火鶴花：無限，肉穗。<\/p>\n<p>(5)棋盤腳：無限，總狀。<\/p>\n<p>(6)仙丹花：有限，頂生聚繖／複聚繖。<\/p>\n<p>(7)紅蝴蝶：若指豆科洋金鳳，無限，總狀。<\/p>\n<p>(8)鳶尾：有限，蠍尾狀聚繖／扇狀聚繖。<\/p>\n<p>(9)文殊蘭：常於園藝教材列無限繖形花序；<\/p>\n<p>嚴格發育形態亦有繖形狀聚繖的解釋。(10)向日葵：無限，頭狀。<\/p>\n<p>無限花序主軸可持續延伸，常見基部或周緣先開、往頂端或中心續開；有限花序主軸以頂花終止，後由側軸接續，常見頂端或中央先開。需看發育次序，不只看成熟時外形。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>向日葵看似一朵大花，實為多個舌狀與管狀小花構成頭狀花序；火鶴則以肉穗花序承載許多小花，外側顯著彩色部分是佛焰苞。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>25 分：每作物 2.5 分，有限／無限 1、花序名 1.5；俗名材料先說清。<\/p>\n<ul>\n<li><strong>每作物 2.5 分，有限／無限 1<\/strong><\/li>\n<li><strong>花序名 1.5<\/strong><\/li>\n<li><strong>俗名材料先說清<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把花序名稱與花冠形狀混寫。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../B112.pdf#page=1","md":"112年花卉學_逐題教學詳解.md","search":"十種花序 ## 第一題｜十種花序（25 分）\n\n### 題意與作答範圍\n\n本題重點：**十種花序**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b112.pdf#page=1)。\n\n### 先掌握答案\n\n(1)馬鞭草：無限花序，穗狀（園藝美女櫻常緊密呈繖房狀外觀，依所指材料）。\n\n(2)石竹：有限，聚繖。\n\n(3)唐菖蒲：無限，穗狀。\n\n(4)火鶴花：無限，肉穗。\n\n(5)棋盤腳：無限，總狀。\n\n(6)仙丹花：有限，頂生聚繖／複聚繖。\n\n(7)紅蝴蝶：若指豆科洋金鳳，無限，總狀。\n\n(8)鳶尾：有限，蠍尾狀聚繖／扇狀聚繖。\n\n(9)文殊蘭：常於園藝教材列無限繖形花序；\n\n嚴格發育形態亦有繖形狀聚繖的解釋。(10)向日葵：無限，頭狀。\n\n### 原理拆解：為什麼會這樣？\n\n**先看主軸頂端是否終止於花**\n\n無限花序主軸可持續延伸，常見基部或周緣先開、往頂端或中心續開；有限花序主軸以頂花終止，後由側軸接續，常見頂端或中央先開。需看發育次序，不只看成熟時外形。\n\n**再看花梗、軸長與分枝**\n\n總狀花序具明顯主軸與有梗小花；穗狀小花無梗或近無梗；繖形花梗集中於近同一點；頭狀花序小花密集於膨大花托；肉穗花序的花軸肉質，常伴佛焰苞。\n\n**複合結構與俗名要註清**\n\n圓錐花序常由分枝總狀系統構成，複聚繖則由有限分枝重複。某些花序外觀近似繖形但發育屬聚繖，教材口徑可能不同，答題可在主要分類後註明，不宜用外形直接否定發育分類。\n\n### 這題要特別注意\n\n看主軸頂端是否以花終止及開花次序，而非單看外形。「紅蝴蝶」等俗名有歧義，正式作答可補學名；\n\n文殊蘭宜依授課分類並說明外觀繖形。\n\n### 可直接練寫的完整答案\n\n(1)馬鞭草：無限花序，穗狀（園藝美女櫻常緊密呈繖房狀外觀，依所指材料）。\n\n(2)石竹：有限，聚繖。\n\n(3)唐菖蒲：無限，穗狀。\n\n(4)火鶴花：無限，肉穗。\n\n(5)棋盤腳：無限，總狀。\n\n(6)仙丹花：有限，頂生聚繖／複聚繖。\n\n(7)紅蝴蝶：若指豆科洋金鳳，無限，總狀。\n\n(8)鳶尾：有限，蠍尾狀聚繖／扇狀聚繖。\n\n(9)文殊蘭：常於園藝教材列無限繖形花序；\n\n嚴格發育形態亦有繖形狀聚繖的解釋。(10)向日葵：無限，頭狀。\n\n無限花序主軸可持續延伸，常見基部或周緣先開、往頂端或中心續開；有限花序主軸以頂花終止，後由側軸接續，常見頂端或中央先開。需看發育次序，不只看成熟時外形。\n\n### 實例：把原理用在情境中\n\n向日葵看似一朵大花，實為多個舌狀與管狀小花構成頭狀花序；火鶴則以肉穗花序承載許多小花，外側顯著彩色部分是佛焰苞。\n\n### 配分重點：哪些內容不能漏？\n\n25 分：每作物 2.5 分，有限／無限 1、花序名 1.5；俗名材料先說清。\n\n- **每作物 2.5 分，有限／無限 1**\n- **花序名 1.5**\n- **俗名材料先說清**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把花序名稱與花冠形狀混寫。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 112 花卉學"},{"id":"花卉學-112-二","s":"花卉學","y":112,"n":"二","t":"繡球花期與花色","body":"<h2>第二題｜繡球花期與花色（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>繡球花期與花色<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B112.pdf#page=1\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>選品種並讓枝條成熟、短日與適溫形成花芽，經足夠低溫解除休眠，再升溫促成開花；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先找色素，再找影響顯色的環境<\/strong><\/p>\n<p>花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。<\/p>\n<p><strong>同一色素也能呈不同顏色<\/strong><\/p>\n<p>液泡 pH、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 pH 不會不經生理過程就等於花瓣液泡 pH。<\/p>\n<p><strong>用可驗證的機制解釋栽培或育種操作<\/strong><\/p>\n<p>繡球花的藍色涉及鋁有效性與花器內的色素複合，需同時考慮品種與介質；藍玫瑰育種則涉及花青素生合成途徑、競爭酵素與細胞條件。不能只以「施酸肥」解釋所有藍花。<\/p>\n<p><strong>用限制來源分類<\/strong><\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p><strong>冬天的冷與春天的暖做不同工作<\/strong><\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<p><strong>技術必須對應真正瓶頸<\/strong><\/p>\n<p>摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>不是 pH 直接把花染色；<\/p>\n<p>基因型、鋁、磷及介質緩衝共同影響。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>選品種並讓枝條成熟、短日與適溫形成花芽，經足夠低溫解除休眠，再升溫促成開花；<\/p>\n<p>修剪不可剪除已分化的頂芽。花色多由花青素與可吸收鋁的交互作用決定：酸性介質有利鋁有效性，適度供鋁可偏藍；<\/p>\n<p>較高 pH、降低鋁吸收偏粉紅。白花等缺少相應花青素的品種不會因此必然變藍。<\/p>\n<p>花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。<\/p>\n<p>液泡 pH、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 pH 不會不經生理過程就等於花瓣液泡 pH。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同品種繡球在適合條件下，可因根域酸度影響鋁有效性而改變顯色；白花或缺乏相關色素能力的品種，不能保證以同一方法轉成藍花。<\/p>\n<p>平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：花期與花色各有方法和機制，白花與基因型限制。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有黃花都歸因於花青素。<\/li>\n<li>把需冷不足與萌芽後霜害混為同一問題。<\/li>\n<\/ul>","source":"../../B112.pdf#page=1","md":"112年花卉學_逐題教學詳解.md","search":"繡球花期與花色 ## 第二題｜繡球花期與花色（10 分）\n\n### 題意與作答範圍\n\n本題重點：**繡球花期與花色**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b112.pdf#page=1)。\n\n### 先掌握答案\n\n選品種並讓枝條成熟、短日與適溫形成花芽，經足夠低溫解除休眠，再升溫促成開花；\n\n### 原理拆解：為什麼會這樣？\n\n**先找色素，再找影響顯色的環境**\n\n花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。\n\n**同一色素也能呈不同顏色**\n\n液泡 ph、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 ph 不會不經生理過程就等於花瓣液泡 ph。\n\n**用可驗證的機制解釋栽培或育種操作**\n\n繡球花的藍色涉及鋁有效性與花器內的色素複合，需同時考慮品種與介質；藍玫瑰育種則涉及花青素生合成途徑、競爭酵素與細胞條件。不能只以「施酸肥」解釋所有藍花。\n\n**用限制來源分類**\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n**冬天的冷與春天的暖做不同工作**\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n**技術必須對應真正瓶頸**\n\n摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。\n\n### 這題要特別注意\n\n不是 ph 直接把花染色；\n\n基因型、鋁、磷及介質緩衝共同影響。\n\n### 可直接練寫的完整答案\n\n選品種並讓枝條成熟、短日與適溫形成花芽，經足夠低溫解除休眠，再升溫促成開花；\n\n修剪不可剪除已分化的頂芽。花色多由花青素與可吸收鋁的交互作用決定：酸性介質有利鋁有效性，適度供鋁可偏藍；\n\n較高 ph、降低鋁吸收偏粉紅。白花等缺少相應花青素的品種不會因此必然變藍。\n\n花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。\n\n液泡 ph、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 ph 不會不經生理過程就等於花瓣液泡 ph。\n\n### 實例：把原理用在情境中\n\n同品種繡球在適合條件下，可因根域酸度影響鋁有效性而改變顯色；白花或缺乏相關色素能力的品種，不能保證以同一方法轉成藍花。\n\n平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：花期與花色各有方法和機制，白花與基因型限制。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有黃花都歸因於花青素。\n- 把需冷不足與萌芽後霜害混為同一問題。\n 112 花卉學"},{"id":"花卉學-112-三","s":"花卉學","y":112,"n":"三","t":"養液水耕優缺點","body":"<h2>第三題｜養液水耕優缺點（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>養液水耕優缺點<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B112.pdf#page=1\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>優點為水肥精準、節水、根域均一、減少土傳病與清潔管理、可自動化及高密度生產。缺點為設備能源成本、停電或供液失常風險、根部病原隨循環液擴散、鹽分／離子失衡、需控制 pH、EC、溫度及溶氧，管理技術要求高。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>根需要水，也需要氧<\/strong><\/p>\n<p>介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。<\/p>\n<p><strong>化學性質會改變肥培結果<\/strong><\/p>\n<p>pH 影響元素溶解與有效性，EC 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 EC 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；pH 與 EC 是不同指標，不能相互替代。<\/p>\n<p><strong>配方應可重複而且衛生<\/strong><\/p>\n<p>選擇穩定、無病原與雜草種子、粒徑一致的材料，混合後實測保水、通氣、pH 及 EC。泥炭、椰纖、樹皮等有機材料會分解或吸附養分；珍珠石等材料的作用也受比例與粒徑影響，配方必須搭配灌肥管理。<\/p>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>無土不等於無病，也不等於不需消毒與檢測。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>優點為水肥精準、節水、根域均一、減少土傳病與清潔管理、可自動化及高密度生產。缺點為設備能源成本、停電或供液失常風險、根部病原隨循環液擴散、鹽分／離子失衡、需控制 pH、EC、溫度及溶氧，管理技術要求高。<\/p>\n<p>介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。<\/p>\n<p>pH 影響元素溶解與有效性，EC 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 EC 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；pH 與 EC 是不同指標，不能相互替代。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一泥炭與珍珠石配方用於矮盆時，底部飽和區占比可能較高；若又照高盆的頻率灌水，根部缺氧風險便增加。應從盆器與水分實測修正，而非只換肥料。<\/p>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：水肥均一等優點、設備根病失衡等缺點、根域原理。<\/p>\n<ul>\n<li><strong>水肥均一等優點<\/strong><\/li>\n<li><strong>設備根病失衡等缺點<\/strong><\/li>\n<li><strong>根域原理<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無土介質寫成完全不含有機物。<\/li>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<\/ul>","source":"../../B112.pdf#page=1","md":"112年花卉學_逐題教學詳解.md","search":"養液水耕優缺點 ## 第三題｜養液水耕優缺點（10 分）\n\n### 題意與作答範圍\n\n本題重點：**養液水耕優缺點**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b112.pdf#page=1)。\n\n### 先掌握答案\n\n優點為水肥精準、節水、根域均一、減少土傳病與清潔管理、可自動化及高密度生產。缺點為設備能源成本、停電或供液失常風險、根部病原隨循環液擴散、鹽分／離子失衡、需控制 ph、ec、溫度及溶氧，管理技術要求高。\n\n### 原理拆解：為什麼會這樣？\n\n**根需要水，也需要氧**\n\n介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。\n\n**化學性質會改變肥培結果**\n\nph 影響元素溶解與有效性，ec 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 ec 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；ph 與 ec 是不同指標，不能相互替代。\n\n**配方應可重複而且衛生**\n\n選擇穩定、無病原與雜草種子、粒徑一致的材料，混合後實測保水、通氣、ph 及 ec。泥炭、椰纖、樹皮等有機材料會分解或吸附養分；珍珠石等材料的作用也受比例與粒徑影響，配方必須搭配灌肥管理。\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n### 這題要特別注意\n\n無土不等於無病，也不等於不需消毒與檢測。\n\n### 可直接練寫的完整答案\n\n優點為水肥精準、節水、根域均一、減少土傳病與清潔管理、可自動化及高密度生產。缺點為設備能源成本、停電或供液失常風險、根部病原隨循環液擴散、鹽分／離子失衡、需控制 ph、ec、溫度及溶氧，管理技術要求高。\n\n介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。\n\nph 影響元素溶解與有效性，ec 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 ec 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；ph 與 ec 是不同指標，不能相互替代。\n\n### 實例：把原理用在情境中\n\n同一泥炭與珍珠石配方用於矮盆時，底部飽和區占比可能較高；若又照高盆的頻率灌水，根部缺氧風險便增加。應從盆器與水分實測修正，而非只換肥料。\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：水肥均一等優點、設備根病失衡等缺點、根域原理。\n\n- **水肥均一等優點**\n- **設備根病失衡等缺點**\n- **根域原理**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無土介質寫成完全不含有機物。\n- 將連作障礙全部歸因於缺肥。\n 112 花卉學"},{"id":"花卉學-112-四","s":"花卉學","y":112,"n":"四","t":"發根粉調製與保存","body":"<h2>第四題｜發根粉調製與保存（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>發根粉調製與保存<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B112.pdf#page=1\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>按作物確定 IBA／NAA 目標濃度；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>調製的核心是含量計算、均勻分散及避免交叉污染；<\/p>\n<p>濃度過高會傷害基部，不能固定套用一個萬用比例。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>按作物確定 IBA／NAA 目標濃度；<\/p>\n<p>精秤有效成分，必要時先以少量合適溶劑溶解，再與滑石粉等惰性載體逐級混勻，乾燥、過篩、標示有效成分與濃度日期。插穗基部略潤後沾粉、去除多餘粉，再插入潔淨介質。避光、低溫、乾燥、密閉保存，取小份使用，剩餘用過粉不可倒回母罐。<\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：目標濃度與有效成分、逐級混粉、使用避污、乾燥避光保存。<\/p>\n<ul>\n<li><strong>目標濃度與有效成分<\/strong><\/li>\n<li><strong>逐級混粉<\/strong><\/li>\n<li><strong>使用避污<\/strong><\/li>\n<li><strong>乾燥避光保存<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<\/ul>","source":"../../B112.pdf#page=1","md":"112年花卉學_逐題教學詳解.md","search":"發根粉調製與保存 ## 第四題｜發根粉調製與保存（10 分）\n\n### 題意與作答範圍\n\n本題重點：**發根粉調製與保存**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b112.pdf#page=1)。\n\n### 先掌握答案\n\n按作物確定 iba／naa 目標濃度；\n\n### 原理拆解：為什麼會這樣？\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n### 這題要特別注意\n\n調製的核心是含量計算、均勻分散及避免交叉污染；\n\n濃度過高會傷害基部，不能固定套用一個萬用比例。\n\n### 可直接練寫的完整答案\n\n按作物確定 iba／naa 目標濃度；\n\n精秤有效成分，必要時先以少量合適溶劑溶解，再與滑石粉等惰性載體逐級混勻，乾燥、過篩、標示有效成分與濃度日期。插穗基部略潤後沾粉、去除多餘粉，再插入潔淨介質。避光、低溫、乾燥、密閉保存，取小份使用，剩餘用過粉不可倒回母罐。\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n### 實例：把原理用在情境中\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：目標濃度與有效成分、逐級混粉、使用避污、乾燥避光保存。\n\n- **目標濃度與有效成分**\n- **逐級混粉**\n- **使用避污**\n- **乾燥避光保存**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無性繁殖與無病毒畫上等號。\n 112 花卉學"},{"id":"花卉學-112-五","s":"花卉學","y":112,"n":"五","t":"五種生長調節劑例","body":"<h2>第五題｜五種生長調節劑例（5 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五種生長調節劑例<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B112.pdf#page=1\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>IBA 促菊花插穗發根；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>激素作用依器官與時期改變<\/strong><\/p>\n<p>生長素、吉貝素、細胞分裂素、乙烯與 ABA 均有多重功能；相同物質在不同濃度、器官和時期可能呈不同結果。必須用「作物＋物質＋時期＋目的」完整描述，不能只列藥名。<\/p>\n<p><strong>外施處理是在改變既有訊號系統<\/strong><\/p>\n<p>生長素可用於促不定根，也可能依條件疏果或減落果；GA 可促伸長、果粒膨大或調整種子發育；乙烯可誘導鳳梨開花，亦可能加速敏感花卉衰老。作用不能跨作物無條件推論。<\/p>\n<p><strong>生產應以核准用途與小量驗證為準<\/strong><\/p>\n<p>濃度、吸收量、天氣與施用位置會影響效果及藥害。考題可以說明機制，但不應從教材例子直接推定所有地區皆核准使用；回答時仍應保留品種、適期與合法用途的 f=\"../../B112.pdf#page=1\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>實生：選親本、人工授粉→蒴果發育數月→無菌播種→原球體、幼苗→瓶苗生根→出瓶馴化、分級換盆→大苗催花；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>健康與整齊度要從母本或種子源開始<\/strong><\/p>\n<p>母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。<\/p>\n<p><strong>育苗目標是可定植且恢復快<\/strong><\/p>\n<p>適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。<\/p>\n<p><strong>無菌培養後仍有馴化關卡<\/strong><\/p>\n<p>瓶內高濕、低光與外加糖可使幼苗角質層、氣孔及根功能與田間不同。出瓶須逐步調整光濕條件並防感染。組培倍率、出瓶存活率與成品率應分開計算，不能只用增殖數宣稱生產效率。<\/p>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>實生有遺傳分離適育種，分生求大量一致；<\/p>\n<p>不能承諾分生從建系到首花一定比任何實生都快。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>實生：選親本、人工授粉→蒴果發育數月→無菌播種→原球體、幼苗→瓶苗生根→出瓶馴化、分級換盆→大苗催花；<\/p>\n<p>常需約 2–4 年到首花，隨親本而變。分生：選優母株→取花梗節／莖頂等外植體→消毒→芽體或 PLB 誘導→多次增殖→分化、生根→出瓶育苗→催花；<\/p>\n<p>建系至量產常需數年，既有穩定系的單批增殖、育苗可較有效率。<\/p>\n<p>母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。<\/p>\n<p>適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>蝴蝶蘭分生苗可用組織培養大量增殖，但需檢測母株病毒並控制培養代數；出瓶後先馴化，再依葉片與根系生長分級，不宜把瓶苗數直接當成上市盆花數。<\/p>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：實生與分生目的、初代、增殖、出瓶、實際年限範圍。<\/p>\n<ul>\n<li><strong>實生與分生目的<\/strong><\/li>\n<li><strong>實際年限範圍<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將組織培養視為自動消除所有病原。<\/li>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<\/ul>","source":"../../B112.pdf#page=1","md":"112年花卉學_逐題教學詳解.md","search":"蝴蝶蘭實生苗與分生苗流程時程 ## 第六題｜蝴蝶蘭實生苗與分生苗流程時程（10 分）\n\n### 題意與作答範圍\n\n本題重點：**蝴蝶蘭實生苗與分生苗流程時程**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b112.pdf#page=1)。\n\n### 先掌握答案\n\n實生：選親本、人工授粉→蒴果發育數月→無菌播種→原球體、幼苗→瓶苗生根→出瓶馴化、分級換盆→大苗催花；\n\n### 原理拆解：為什麼會這樣？\n\n**健康與整齊度要從母本或種子源開始**\n\n母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。\n\n**育苗目標是可定植且恢復快**\n\n適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。\n\n**無菌培養後仍有馴化關卡**\n\n瓶內高濕、低光與外加糖可使幼苗角質層、氣孔及根功能與田間不同。出瓶須逐步調整光濕條件並防感染。組培倍率、出瓶存活率與成品率應分開計算，不能只用增殖數宣稱生產效率。\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n### 這題要特別注意\n\n實生有遺傳分離適育種，分生求大量一致；\n\n不能承諾分生從建系到首花一定比任何實生都快。\n\n### 可直接練寫的完整答案\n\n實生：選親本、人工授粉→蒴果發育數月→無菌播種→原球體、幼苗→瓶苗生根→出瓶馴化、分級換盆→大苗催花；\n\n常需約 2–4 年到首花，隨親本而變。分生：選優母株→取花梗節／莖頂等外植體→消毒→芽體或 plb 誘導→多次增殖→分化、生根→出瓶育苗→催花；\n\n建系至量產常需數年，既有穩定系的單批增殖、育苗可較有效率。\n\n母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。\n\n適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。\n\n### 實例：把原理用在情境中\n\n蝴蝶蘭分生苗可用組織培養大量增殖，但需檢測母株病毒並控制培養代數；出瓶後先馴化，再依葉片與根系生長分級，不宜把瓶苗數直接當成上市盆花數。\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：實生與分生目的、初代、增殖、出瓶、實際年限範圍。\n\n- **實生與分生目的**\n- **實際年限範圍**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將組織培養視為自動消除所有病原。\n- 把無性繁殖與無病毒畫上等號。\n 112 花卉學"},{"id":"花卉學-112-七","s":"花卉學","y":112,"n":"七","t":"百合採收與保鮮","body":"<h2>第七題｜百合採收與保鮮（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>百合採收與保鮮<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B112.pdf#page=1\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>在下位花蕾充分膨大、顯色而未全開時依運距採切；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>鱗莖是當期萌發與下一期生長的貯藏器官<\/strong><\/p>\n<p>肉質鱗片葉連在基盤，提供萌芽抽莖初期的資源；隨後新葉光合，再回補新生鱗片與子球。鱗莖不是實心球莖，也不是肥大根。<\/p>\n<p><strong>種球歷程影響開花整齊度<\/strong><\/p>\n<p>品種、球徑、養球成熟度、健康與低溫處理會影響抽芽和花芽發育。採購指定規格種球是成品生產的重要起點；僅知道當地有原生百合，不能推定可直接取代商業種球。<\/p>\n<p><strong>種球生產與切花採收目標不同<\/strong><\/p>\n<p>養球可適期摘蕾減少生殖庫競爭，並保留健康莖葉供碳；切花則須在可正常開放的顯色蕾期採收並注意補水保鮮。切得過低會減少留田葉量，後續球重與再生可能受影響。<\/p>\n<p><strong>切離後的水分與碳收支轉為赤字<\/strong><\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p><strong>不同處理各有明確功能<\/strong><\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<p><strong>採收成熟度與溫度決定後續品質上限<\/strong><\/p>\n<p>過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>太早採會開花不良，太晚採易碰傷；<\/p>\n<p>採收成熟度須與海運／空運及品種配合。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>在下位花蕾充分膨大、顯色而未全開時依運距採切；<\/p>\n<p>留適當葉片、潔淨剪口→立即補水、去除水線下葉→分級束花→依品種採低溫預冷、冷藏與運輸→到貨重新剪基部、清潔水桶，供適當糖與抑菌保鮮液並避乙烯。依需求去花藥可減花粉污染。<\/p>\n<p>肉質鱗片葉連在基盤，提供萌芽抽莖初期的資源；隨後新葉光合，再回補新生鱗片與子球。鱗莖不是實心球莖，也不是肥大根。<\/p>\n<p>品種、球徑、養球成熟度、健康與低溫處理會影響抽芽和花芽發育。採購指定規格種球是成品生產的重要起點；僅知道當地有原生百合，不能推定可直接取代商業種球。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一品種若用不同球徑與不同低溫歷程，花枝高度和開花整齊度可能不同；試驗應先固定種球規格，再比較肥水，否則難分辨管理效果。<\/p>\n<p>百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：顯色蕾採、補水分級、冷鏈、到貨再剪與衛生。<\/p>\n<ul>\n<li><strong>顯色蕾採<\/strong><\/li>\n<li><strong>補水分級<\/strong><\/li>\n<li><strong>到貨再剪與衛生<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將百合鱗莖誤寫成唐菖蒲式實心球莖。<\/li>\n<li>把短時高濃度預措液與全程瓶插液視為相同用法。<\/li>\n<\/ul>","source":"../../B112.pdf#page=1","md":"112年花卉學_逐題教學詳解.md","search":"百合採收與保鮮 ## 第七題｜百合採收與保鮮（10 分）\n\n### 題意與作答範圍\n\n本題重點：**百合採收與保鮮**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b112.pdf#page=1)。\n\n### 先掌握答案\n\n在下位花蕾充分膨大、顯色而未全開時依運距採切；\n\n### 原理拆解：為什麼會這樣？\n\n**鱗莖是當期萌發與下一期生長的貯藏器官**\n\n肉質鱗片葉連在基盤，提供萌芽抽莖初期的資源；隨後新葉光合，再回補新生鱗片與子球。鱗莖不是實心球莖，也不是肥大根。\n\n**種球歷程影響開花整齊度**\n\n品種、球徑、養球成熟度、健康與低溫處理會影響抽芽和花芽發育。採購指定規格種球是成品生產的重要起點；僅知道當地有原生百合，不能推定可直接取代商業種球。\n\n**種球生產與切花採收目標不同**\n\n養球可適期摘蕾減少生殖庫競爭，並保留健康莖葉供碳；切花則須在可正常開放的顯色蕾期採收並注意補水保鮮。切得過低會減少留田葉量，後續球重與再生可能受影響。\n\n**切離後的水分與碳收支轉為赤字**\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n**不同處理各有明確功能**\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n**採收成熟度與溫度決定後續品質上限**\n\n過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。\n\n### 這題要特別注意\n\n太早採會開花不良，太晚採易碰傷；\n\n採收成熟度須與海運／空運及品種配合。\n\n### 可直接練寫的完整答案\n\n在下位花蕾充分膨大、顯色而未全開時依運距採切；\n\n留適當葉片、潔淨剪口→立即補水、去除水線下葉→分級束花→依品種採低溫預冷、冷藏與運輸→到貨重新剪基部、清潔水桶，供適當糖與抑菌保鮮液並避乙烯。依需求去花藥可減花粉污染。\n\n肉質鱗片葉連在基盤，提供萌芽抽莖初期的資源；隨後新葉光合，再回補新生鱗片與子球。鱗莖不是實心球莖，也不是肥大根。\n\n品種、球徑、養球成熟度、健康與低溫處理會影響抽芽和花芽發育。採購指定規格種球是成品生產的重要起點；僅知道當地有原生百合，不能推定可直接取代商業種球。\n\n### 實例：把原理用在情境中\n\n同一品種若用不同球徑與不同低溫歷程，花枝高度和開花整齊度可能不同；試驗應先固定種球規格，再比較肥水，否則難分辨管理效果。\n\n百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：顯色蕾採、補水分級、冷鏈、到貨再剪與衛生。\n\n- **顯色蕾採**\n- **補水分級**\n- **到貨再剪與衛生**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將百合鱗莖誤寫成唐菖蒲式實心球莖。\n- 把短時高濃度預措液與全程瓶插液視為相同用法。\n 112 花卉學"},{"id":"花卉學-112-八","s":"花卉學","y":112,"n":"八","t":"十個名詞","body":"<h2>第八題｜十個名詞（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>十個名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B112.pdf#page=1\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>層積法：種子在適溫濕潤介質中放置一定期間以解除休眠。摘心：去除嫩梢頂端以促側芽。除蕾：去掉不必要花蕾以集中養分。芽條變異：芽部突變形成特異枝條，可無性保存。花卉園藝：觀賞植物繁殖、栽培、育種及採後利用之學問。嫁接親和性：接穗與砧木能正常癒合、運輸並持續協調生長。<\/p>\n<p>空氣斷根法：根尖到容器通氣孔後失水停止伸長，促盆內側根分枝。宿根草本花卉：多年生草本，靠宿存器官延續。木子：球根花卉的小型營養繁殖體俗稱，如唐菖蒲的子球莖 cormel，養成達開花規格後用作種球。絕對性短日植物：必須有短於臨界日長、足夠連續長夜才能成花。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<p><strong>先找色素，再找影響顯色的環境<\/strong><\/p>\n<p>花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。<\/p>\n<p><strong>同一色素也能呈不同顏色<\/strong><\/p>\n<p>液泡 pH、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 pH 不會不經生理過程就等於花瓣液泡 pH。<\/p>\n<p><strong>用可驗證的機制解釋栽培或育種操作<\/strong><\/p>\n<p>繡球花的藍色涉及鋁有效性與花器內的色素複合，需同時考慮品種與介質；藍玫瑰育種則涉及花青素生合成途徑、競爭酵素與細胞條件。不能只以「施酸肥」解釋所有藍花。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>層積法：種子在適溫濕潤介質中放置一定期間以解除休眠。摘心：去除嫩梢頂端以促側芽。除蕾：去掉不必要花蕾以集中養分。芽條變異：芽部突變形成特異枝條，可無性保存。花卉園藝：觀賞植物繁殖、栽培、育種及採後利用之學問。嫁接親和性：接穗與砧木能正常癒合、運輸並持續協調生長。<\/td>\n<td>後代通常保留母株基因型，但仍可能累積突變、嵌合或系統性病原。<\/td>\n<\/tr>\n<tr>\n<td>空氣斷根法：根尖到容器通氣孔後失水停止伸長，促盆內側根分枝。宿根草本花卉：多年生草本，靠宿存器官延續。木子：球根花卉的小型營養繁殖體俗稱，如唐菖蒲的子球莖 cormel，養成達開花規格後用作種球。絕對性短日植物：必須有短於臨界日長、足夠連續長夜才能成花。<\/td>\n<td>主要是實心肥大莖，與以肉質鱗片葉儲藏的鱗莖不同，例如唐菖蒲、荸薺。 此俗名可指小型營養繁殖體，需依唐菖蒲小球莖或百合小鱗莖的材料背景解釋。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>這題要特別注意<\/h3>\n<p>木子為臺灣球根栽培俗稱，唐菖蒲常指 cormel，百合文獻亦可指小鱗莖；<\/p>\n<p>不是木本植物。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>層積法：種子在適溫濕潤介質中放置一定期間以解除休眠。摘心：去除嫩梢頂端以促側芽。除蕾：去掉不必要花蕾以集中養分。芽條變異：芽部突變形成特異枝條，可無性保存。花卉園藝：觀賞植物繁殖、栽培、育種及採後利用之學問。嫁接親和性：接穗與砧木能正常癒合、運輸並持續協調生長。<\/p>\n<p>空氣斷根法：根尖到容器通氣孔後失水停止伸長，促盆內側根分枝。宿根草本花卉：多年生草本，靠宿存器官延續。木子：球根花卉的小型營養繁殖體俗稱，如唐菖蒲的子球莖 cormel，養成達開花規格後用作種球。絕對性短日植物：必須有短於臨界日長、足夠連續長夜才能成花。<\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<p>同品種繡球在適合條件下，可因根域酸度影響鋁有效性而改變顯色；白花或缺乏相關色素能力的品種，不能保證以同一方法轉成藍花。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：十名詞各 2 分；第九項木子須說明小球繁殖體及唐菖蒲例。<\/p>\n<ul>\n<li><strong>十名詞各 2 分<\/strong><\/li>\n<li><strong>第九項木子須說明小球繁殖體及唐菖蒲例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<li>把所有黃花都歸因於花青素。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../B112.pdf#page=1","md":"112年花卉學_逐題教學詳解.md","search":"十個名詞 ## 第八題｜十個名詞（20 分）\n\n### 題意與作答範圍\n\n本題重點：**十個名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b112.pdf#page=1)。\n\n### 先掌握答案\n\n層積法：種子在適溫濕潤介質中放置一定期間以解除休眠。摘心：去除嫩梢頂端以促側芽。除蕾：去掉不必要花蕾以集中養分。芽條變異：芽部突變形成特異枝條，可無性保存。花卉園藝：觀賞植物繁殖、栽培、育種及採後利用之學問。嫁接親和性：接穗與砧木能正常癒合、運輸並持續協調生長。\n\n空氣斷根法：根尖到容器通氣孔後失水停止伸長，促盆內側根分枝。宿根草本花卉：多年生草本，靠宿存器官延續。木子：球根花卉的小型營養繁殖體俗稱，如唐菖蒲的子球莖 cormel，養成達開花規格後用作種球。絕對性短日植物：必須有短於臨界日長、足夠連續長夜才能成花。\n\n### 原理拆解：為什麼會這樣？\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n**先找色素，再找影響顯色的環境**\n\n花青素主要形成紅紫藍色系，類胡蘿蔔素形成黃橙色系，葉綠素呈綠；部分植物另有甜菜色素。外觀顏色不是單一色素濃度的直接讀值，還受細胞位置、組織結構與光散射影響。\n\n**同一色素也能呈不同顏色**\n\n液泡 ph、金屬離子、共色作用、糖基化與醯基化可改變花青素的穩定與吸收特性；基因調控決定合成哪些色素及其位置。土壤 ph 不會不經生理過程就等於花瓣液泡 ph。\n\n**用可驗證的機制解釋栽培或育種操作**\n\n繡球花的藍色涉及鋁有效性與花器內的色素複合，需同時考慮品種與介質；藍玫瑰育種則涉及花青素生合成途徑、競爭酵素與細胞條件。不能只以「施酸肥」解釋所有藍花。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| 層積法：種子在適溫濕潤介質中放置一定期間以解除休眠。摘心：去除嫩梢頂端以促側芽。除蕾：去掉不必要花蕾以集中養分。芽條變異：芽部突變形成特異枝條，可無性保存。花卉園藝：觀賞植物繁殖、栽培、育種及採後利用之學問。嫁接親和性：接穗與砧木能正常癒合、運輸並持續協調生長。 | 後代通常保留母株基因型，但仍可能累積突變、嵌合或系統性病原。 |\n| 空氣斷根法：根尖到容器通氣孔後失水停止伸長，促盆內側根分枝。宿根草本花卉：多年生草本，靠宿存器官延續。木子：球根花卉的小型營養繁殖體俗稱，如唐菖蒲的子球莖 cormel，養成達開花規格後用作種球。絕對性短日植物：必須有短於臨界日長、足夠連續長夜才能成花。 | 主要是實心肥大莖，與以肉質鱗片葉儲藏的鱗莖不同，例如唐菖蒲、荸薺。 此俗名可指小型營養繁殖體，需依唐菖蒲小球莖或百合小鱗莖的材料背景解釋。 |\n\n### 這題要特別注意\n\n木子為臺灣球根栽培俗稱，唐菖蒲常指 cormel，百合文獻亦可指小鱗莖；\n\n不是木本植物。\n\n### 可直接練寫的完整答案\n\n層積法：種子在適溫濕潤介質中放置一定期間以解除休眠。摘心：去除嫩梢頂端以促側芽。除蕾：去掉不必要花蕾以集中養分。芽條變異：芽部突變形成特異枝條，可無性保存。花卉園藝：觀賞植物繁殖、栽培、育種及採後利用之學問。嫁接親和性：接穗與砧木能正常癒合、運輸並持續協調生長。\n\n空氣斷根法：根尖到容器通氣孔後失水停止伸長，促盆內側根分枝。宿根草本花卉：多年生草本，靠宿存器官延續。木子：球根花卉的小型營養繁殖體俗稱，如唐菖蒲的子球莖 cormel，養成達開花規格後用作種球。絕對性短日植物：必須有短於臨界日長、足夠連續長夜才能成花。\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n### 實例：把原理用在情境中\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n同品種繡球在適合條件下，可因根域酸度影響鋁有效性而改變顯色；白花或缺乏相關色素能力的品種，不能保證以同一方法轉成藍花。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：十名詞各 2 分；第九項木子須說明小球繁殖體及唐菖蒲例。\n\n- **十名詞各 2 分**\n- **第九項木子須說明小球繁殖體及唐菖蒲例**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無性繁殖與無病毒畫上等號。\n- 把所有黃花都歸因於花青素。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 112 花卉學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').jo
