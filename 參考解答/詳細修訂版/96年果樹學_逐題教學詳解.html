trong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=31\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Climacteric fruits 更年性果實；<\/p>\n<p>stenospermocarpy 受精後種子敗育型無子果；<\/p>\n<p>multiple fruit 多花果，如鳳梨；<\/p>\n<p>pinching 摘心，去嫩梢頂端促側芽；<\/p>\n<p>hermaphrodite 兩性花，同朵具雌雄蕊，如多數桃花，與雌雄同株分花不同。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先問有沒有受精<\/strong><\/p>\n<p>單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。<\/p>\n<p><strong>為何沒有正常種子仍能結果<\/strong><\/p>\n<p>正常發育種子會提供或誘導支持子房生長的激素訊號。遺傳性單為結果或外施調節劑可在缺乏受精時提供相似支持；種子敗育型則可能在初期已建立足以使果實繼續生長的條件。<\/p>\n<p><strong>無子化與膨大必須分開思考<\/strong><\/p>\n<p>有子葡萄的無子化須依品種、花期以合適處理影響種子形成，花後可能另需促果粒膨大。時機錯誤會落果、穗軸或果粒異常；不能給一個濃度宣稱適用所有葡萄。無融合生殖是無正常有性受精而產胚，仍可有種子，並非同義詞。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Climacteric fruits 更年性果實；<\/td>\n<td>分類時先看一花或多花，再看子房個數及附屬組織，避免把聚合果、多花果與假果混為一類。<\/td>\n<\/tr>\n<tr>\n<td>stenospermocarpy 受精後種子敗育型無子果；<\/td>\n<td>已發生授粉受精，後續胚或胚乳中止發育，常可能留有種痕，不等同從未受精。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Climacteric fruits 更年性果實；<\/p>\n<p>stenospermocarpy 受精後種子敗育型無子果；<\/p>\n<p>multiple fruit 多花果，如鳳梨；<\/p>\n<p>pinching 摘心，去嫩梢頂端促側芽；<\/p>\n<p>hermaphrodite 兩性花，同朵具雌雄蕊，如多數桃花，與雌雄同株分花不同。<\/p>\n<p>單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>栽培香蕉可用作單為結果例，許多無子葡萄作種子敗育例；柑橘珠心胚說明無融合生殖可產生帶胚種子，三者不能互換。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：每小題 4 分，定義、機制與例。<\/p>\n<ul>\n<li><strong>每小題 4 分，定義<\/strong><\/li>\n<li><strong>機制與例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有無子葡萄都說成未曾受精。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=31","md":"96年果樹學_逐題教學詳解.md","search":"五名詞 ## 第一題｜五名詞（20 分）\n\n### 題意與作答範圍\n\n本題重點：**五名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=31)。\n\n### 先掌握答案\n\nclimacteric fruits 更年性果實；\n\nstenospermocarpy 受精後種子敗育型無子果；\n\nmultiple fruit 多花果，如鳳梨；\n\npinching 摘心，去嫩梢頂端促側芽；\n\nhermaphrodite 兩性花，同朵具雌雄蕊，如多數桃花，與雌雄同株分花不同。\n\n### 原理拆解：為什麼會這樣？\n\n**先問有沒有受精**\n\n單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。\n\n**為何沒有正常種子仍能結果**\n\n正常發育種子會提供或誘導支持子房生長的激素訊號。遺傳性單為結果或外施調節劑可在缺乏受精時提供相似支持；種子敗育型則可能在初期已建立足以使果實繼續生長的條件。\n\n**無子化與膨大必須分開思考**\n\n有子葡萄的無子化須依品種、花期以合適處理影響種子形成，花後可能另需促果粒膨大。時機錯誤會落果、穗軸或果粒異常；不能給一個濃度宣稱適用所有葡萄。無融合生殖是無正常有性受精而產胚，仍可有種子，並非同義詞。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| climacteric fruits 更年性果實； | 分類時先看一花或多花，再看子房個數及附屬組織，避免把聚合果、多花果與假果混為一類。 |\n| stenospermocarpy 受精後種子敗育型無子果； | 已發生授粉受精，後續胚或胚乳中止發育，常可能留有種痕，不等同從未受精。 |\n\n### 可直接練寫的完整答案\n\nclimacteric fruits 更年性果實；\n\nstenospermocarpy 受精後種子敗育型無子果；\n\nmultiple fruit 多花果，如鳳梨；\n\npinching 摘心，去嫩梢頂端促側芽；\n\nhermaphrodite 兩性花，同朵具雌雄蕊，如多數桃花，與雌雄同株分花不同。\n\n單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。\n\n### 實例：把原理用在情境中\n\n栽培香蕉可用作單為結果例，許多無子葡萄作種子敗育例；柑橘珠心胚說明無融合生殖可產生帶胚種子，三者不能互換。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：每小題 4 分，定義、機制與例。\n\n- **每小題 4 分，定義**\n- **機制與例**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有無子葡萄都說成未曾受精。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 96 果樹學"},{"id":"果樹學-96-二","s":"果樹學","y":96,"n":"二","t":"磷與開花結果","body":"<h2>第二題｜磷與開花結果（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>磷與開花結果<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=31\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>磷是 ATP／ADP、核酸與磷脂成分，支持能量轉移、細胞分裂、根發育與生殖器官形成。缺磷會生長慢、延遲成熟與減少結果；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>第一步是分清吸收、運輸與需求<\/strong><\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p><strong>用新老葉位置推理<\/strong><\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<p><strong>最後必須用適當樣本驗證<\/strong><\/p>\n<p>依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>磷是 ATP／ADP、核酸與磷脂成分，支持能量轉移、細胞分裂、根發育與生殖器官形成。缺磷會生長慢、延遲成熟與減少結果；<\/p>\n<p>若原本供應足量，再增高磷不一定促花，花誘導仍受溫度、日長、枝梢成熟、氮及碳分配限制。過量還可誘微量元素缺乏。<\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：生化功能、缺磷影響、花誘導條件與過量限制。<\/p>\n<ul>\n<li><strong>生化功能<\/strong><\/li>\n<li><strong>缺磷影響<\/strong><\/li>\n<li><strong>花誘導條件與過量限制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>只寫缺肥會黃葉，沒有指出葉齡與黃化分布。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=31","md":"96年果樹學_逐題教學詳解.md","search":"磷與開花結果 ## 第二題｜磷與開花結果（10 分）\n\n### 題意與作答範圍\n\n本題重點：**磷與開花結果**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=31)。\n\n### 先掌握答案\n\n磷是 atp／adp、核酸與磷脂成分，支持能量轉移、細胞分裂、根發育與生殖器官形成。缺磷會生長慢、延遲成熟與減少結果；\n\n### 原理拆解：為什麼會這樣？\n\n**第一步是分清吸收、運輸與需求**\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n**用新老葉位置推理**\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n**最後必須用適當樣本驗證**\n\n依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。\n\n### 可直接練寫的完整答案\n\n磷是 atp／adp、核酸與磷脂成分，支持能量轉移、細胞分裂、根發育與生殖器官形成。缺磷會生長慢、延遲成熟與減少結果；\n\n若原本供應足量，再增高磷不一定促花，花誘導仍受溫度、日長、枝梢成熟、氮及碳分配限制。過量還可誘微量元素缺乏。\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n### 實例：把原理用在情境中\n\n老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：生化功能、缺磷影響、花誘導條件與過量限制。\n\n- **生化功能**\n- **缺磷影響**\n- **花誘導條件與過量限制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 只寫缺肥會黃葉，沒有指出葉齡與黃化分布。\n 96 果樹學"},{"id":"果樹學-96-三","s":"果樹學","y":96,"n":"三","t":"五種缺素","body":"<h2>第三題｜五種缺素（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五種缺素<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=31\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>老葉脈間黃化：鎂；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>第一步是分清吸收、運輸與需求<\/strong><\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p><strong>用新老葉位置推理<\/strong><\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<p><strong>最後必須用適當樣本驗證<\/strong><\/p>\n<p>依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>老葉脈間黃化：鎂；<\/p>\n<p>新梢枯死：可優先考慮硼／銅，需作物與伴隨徵狀鑑別，不能僅憑 dieback 唯一確診；<\/p>\n<p>全株細弱矮化：常見氮不足，但磷缺與其他根域問題亦可能；<\/p>\n<p>蘋果苦痘：鈣；<\/p>\n<p>老葉葉緣壞死：鉀。題幹缺少作物與完整照片時應列主要判斷及限制。<\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：每項 2 分，正確元素；不具專一性的症狀須說明鑑別。<\/p>\n<ul>\n<li><strong>每項 2 分，正確元素<\/strong><\/li>\n<li><strong>不具專一性的症狀須說明鑑別<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>只寫缺肥會黃葉，沒有指出葉齡與黃化分布。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=31","md":"96年果樹學_逐題教學詳解.md","search":"五種缺素 ## 第三題｜五種缺素（10 分）\n\n### 題意與作答範圍\n\n本題重點：**五種缺素**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=31)。\n\n### 先掌握答案\n\n老葉脈間黃化：鎂；\n\n### 原理拆解：為什麼會這樣？\n\n**第一步是分清吸收、運輸與需求**\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n**用新老葉位置推理**\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n**最後必須用適當樣本驗證**\n\n依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。\n\n### 可直接練寫的完整答案\n\n老葉脈間黃化：鎂；\n\n新梢枯死：可優先考慮硼／銅，需作物與伴隨徵狀鑑別，不能僅憑 dieback 唯一確診；\n\n全株細弱矮化：常見氮不足，但磷缺與其他根域問題亦可能；\n\n蘋果苦痘：鈣；\n\n老葉葉緣壞死：鉀。題幹缺少作物與完整照片時應列主要判斷及限制。\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n### 實例：把原理用在情境中\n\n老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：每項 2 分，正確元素；不具專一性的症狀須說明鑑別。\n\n- **每項 2 分，正確元素**\n- **不具專一性的症狀須說明鑑別**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 只寫缺肥會黃葉，沒有指出葉齡與黃化分布。\n 96 果樹學"},{"id":"果樹學-96-四","s":"果樹學","y":96,"n":"四","t":"葉裝載與果卸載","body":"<h2>第四題｜葉裝載與果卸載（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>葉裝載與果卸載<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=31\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>葉片裝載可經胞間連絲共質體或跨膜質外體途徑，後者由 H⁺ 梯度驅動糖共運輸；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把源與庫接起來<\/strong><\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<p><strong>壓力流與跨膜運輸不是同一層次<\/strong><\/p>\n<p>源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；H⁺-ATPase 建立電化學梯度，可支援 H⁺／蔗糖共運輸。<\/p>\n<p><strong>庫強決定競爭，不只看果實大小<\/strong><\/p>\n<p>庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>葉片裝載可經胞間連絲共質體或跨膜質外體途徑，後者由 H⁺ 梯度驅動糖共運輸；<\/p>\n<p>果實卸載亦可走兩途徑，且依物種及發育期轉換。糖裂解、液泡貯藏與果實生長保持庫端需求，配合源庫膨壓差促長距運輸。<\/p>\n<p>成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。<\/p>\n<p>源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；H⁺-ATPase 建立電化學梯度，可支援 H⁺／蔗糖共運輸。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：裝卸載各兩路徑、跨膜能量、調控。<\/p>\n<ul>\n<li><strong>裝卸載各兩路徑<\/strong><\/li>\n<li><strong>跨膜能量<\/strong><\/li>\n<li><strong>調控<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把長距離糖運輸寫成主要沿木質部。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=31","md":"96年果樹學_逐題教學詳解.md","search":"葉裝載與果卸載 ## 第四題｜葉裝載與果卸載（10 分）\n\n### 題意與作答範圍\n\n本題重點：**葉裝載與果卸載**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=31)。\n\n### 先掌握答案\n\n葉片裝載可經胞間連絲共質體或跨膜質外體途徑，後者由 h⁺ 梯度驅動糖共運輸；\n\n### 原理拆解：為什麼會這樣？\n\n**先把源與庫接起來**\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n**壓力流與跨膜運輸不是同一層次**\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n**庫強決定競爭，不只看果實大小**\n\n庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。\n\n### 可直接練寫的完整答案\n\n葉片裝載可經胞間連絲共質體或跨膜質外體途徑，後者由 h⁺ 梯度驅動糖共運輸；\n\n果實卸載亦可走兩途徑，且依物種及發育期轉換。糖裂解、液泡貯藏與果實生長保持庫端需求，配合源庫膨壓差促長距運輸。\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n### 實例：把原理用在情境中\n\n同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：裝卸載各兩路徑、跨膜能量、調控。\n\n- **裝卸載各兩路徑**\n- **跨膜能量**\n- **調控**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把長距離糖運輸寫成主要沿木質部。\n 96 果樹學"},{"id":"果樹學-96-五","s":"果樹學","y":96,"n":"五","t":"IFP","body":"<h2>第五題｜IFP（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>IFP<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=31\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>整合性果實生產把適地適種、土壤與水分保育、平衡施肥、樹冠負載、整合病蟲、採後冷鏈及安全追溯結合；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先建立可預防的栽培條件<\/strong><\/p>\n<p>健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。<\/p>\n<p><strong>監測後再選處理<\/strong><\/p>\n<p>定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。<\/p>\n<p><strong>整合與追蹤效果<\/strong><\/p>\n<p>不同手段應互相相容，保護天敵並避免抗藥性累積。處理後確認受害是否降低，保存用藥、環境與採收紀錄；有機生產也須依規範使用資材，並不代表可以省略病蟲管理。<\/p>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>整合性果實生產把適地適種、土壤與水分保育、平衡施肥、樹冠負載、整合病蟲、採後冷鏈及安全追溯結合；<\/p>\n<p>以監測與經濟生態指標持續修正，不以單一藥劑或零農藥作唯一標準。<\/p>\n<p>健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。<\/p>\n<p>定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>番茄管理可由健康苗、防蟲設施與田間監測降低媒介昆蟲傳播病毒的機會；已感染植株的處置與媒介控制須配合，不能只噴一次藥便認定病毒消失。<\/p>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：定義、至少五管理面向及紀錄驗證。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把有機栽培理解成完全不防治。<\/li>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=31","md":"96年果樹學_逐題教學詳解.md","search":"ifp ## 第五題｜ifp（10 分）\n\n### 題意與作答範圍\n\n本題重點：**ifp**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=31)。\n\n### 先掌握答案\n\n整合性果實生產把適地適種、土壤與水分保育、平衡施肥、樹冠負載、整合病蟲、採後冷鏈及安全追溯結合；\n\n### 原理拆解：為什麼會這樣？\n\n**先建立可預防的栽培條件**\n\n健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。\n\n**監測後再選處理**\n\n定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。\n\n**整合與追蹤效果**\n\n不同手段應互相相容，保護天敵並避免抗藥性累積。處理後確認受害是否降低，保存用藥、環境與採收紀錄；有機生產也須依規範使用資材，並不代表可以省略病蟲管理。\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n### 可直接練寫的完整答案\n\n整合性果實生產把適地適種、土壤與水分保育、平衡施肥、樹冠負載、整合病蟲、採後冷鏈及安全追溯結合；\n\n以監測與經濟生態指標持續修正，不以單一藥劑或零農藥作唯一標準。\n\n健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。\n\n定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。\n\n### 實例：把原理用在情境中\n\n番茄管理可由健康苗、防蟲設施與田間監測降低媒介昆蟲傳播病毒的機會；已感染植株的處置與媒介控制須配合，不能只噴一次藥便認定病毒消失。\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：定義、至少五管理面向及紀錄驗證。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把有機栽培理解成完全不防治。\n- 將連作障礙全部歸因於缺肥。\n 96 果樹學"},{"id":"果樹學-96-六","s":"果樹學","y":96,"n":"六","t":"臺灣果樹發展策略","body":"<h2>第六題｜臺灣果樹發展策略（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>臺灣果樹發展策略<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=31\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>以品質、特色和穩定供應因應進口與成本競爭：育成適地抗逆耐運品種，健康種苗與精準肥水、機械化減勞力，分散產期及市場，共同集貨分級、冷鏈與外銷檢疫、追溯品牌。並限制脆弱坡地開墾、調整老園、節水保土與培育經營人才。策略須對應小農、老化及氣候風險，不能只擴產。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<p><strong>為何採後仍會變差<\/strong><\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p><strong>低溫有效，但有適用範圍<\/strong><\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<p><strong>把全程串起來<\/strong><\/p>\n<p>採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>以品質、特色和穩定供應因應進口與成本競爭：育成適地抗逆耐運品種，健康種苗與精準肥水、機械化減勞力，分散產期及市場，共同集貨分級、冷鏈與外銷檢疫、追溯品牌。並限制脆弱坡地開墾、調整老園、節水保土與培育經營人才。策略須對應小農、老化及氣候風險，不能只擴產。<\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<p>驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：生產、技術、流通市場、組織、環境及人才各有實施例。<\/p>\n<ul>\n<li><strong>流通市場<\/strong><\/li>\n<li><strong>環境及人才各有實施例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<li>認為溫度越低、保存效果一定越好。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=31","md":"96年果樹學_逐題教學詳解.md","search":"臺灣果樹發展策略 ## 第六題｜臺灣果樹發展策略（20 分）\n\n### 題意與作答範圍\n\n本題重點：**臺灣果樹發展策略**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=31)。\n\n### 先掌握答案\n\n以品質、特色和穩定供應因應進口與成本競爭：育成適地抗逆耐運品種，健康種苗與精準肥水、機械化減勞力，分散產期及市場，共同集貨分級、冷鏈與外銷檢疫、追溯品牌。並限制脆弱坡地開墾、調整老園、節水保土與培育經營人才。策略須對應小農、老化及氣候風險，不能只擴產。\n\n### 原理拆解：為什麼會這樣？\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n**為何採後仍會變差**\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n**低溫有效，但有適用範圍**\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n**把全程串起來**\n\n採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。\n\n### 可直接練寫的完整答案\n\n以品質、特色和穩定供應因應進口與成本競爭：育成適地抗逆耐運品種，健康種苗與精準肥水、機械化減勞力，分散產期及市場，共同集貨分級、冷鏈與外銷檢疫、追溯品牌。並限制脆弱坡地開墾、調整老園、節水保土與培育經營人才。策略須對應小農、老化及氣候風險，不能只擴產。\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n### 實例：把原理用在情境中\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：生產、技術、流通市場、組織、環境及人才各有實施例。\n\n- **流通市場**\n- **環境及人才各有實施例**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把轉入基因成功直接等同育成可商業化品種。\n- 認為溫度越低、保存效果一定越好。\n 96 果樹學"},{"id":" e class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
