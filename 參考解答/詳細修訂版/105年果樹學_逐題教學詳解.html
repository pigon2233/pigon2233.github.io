trong>番石榴海運加拿大<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=4\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>採耐運適熟果、田間防治與用藥紀錄，果實輕採後分級去病傷果、清潔並預冷；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>為何採後仍會變差<\/strong><\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p><strong>低溫有效，但有適用範圍<\/strong><\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<p><strong>把全程串起來<\/strong><\/p>\n<p>採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>採耐運適熟果、田間防治與用藥紀錄，果實輕採後分級去病傷果、清潔並預冷；<\/p>\n<p>用個果緩衝、透氣保濕箱及合適冷藏溫濕度，監控果溫與乙烯、避免寒害、結露和冷鏈中斷。出貨前確認目的國有效檢疫、殘留與文件要求，並以實際船期加貨架期驗證。<\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：採前、成熟度、預冷包裝、冷鏈、檢疫與抵港品質。<\/p>\n<ul>\n<li><strong>成熟度<\/strong><\/li>\n<li><strong>預冷包裝<\/strong><\/li>\n<li><strong>檢疫與抵港品質<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>認為溫度越低、保存效果一定越好。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=4","md":"105年果樹學_逐題教學詳解.md","search":"番石榴海運加拿大 ## 第一題｜番石榴海運加拿大（15 分）\n\n### 題意與作答範圍\n\n本題重點：**番石榴海運加拿大**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=4)。\n\n### 先掌握答案\n\n採耐運適熟果、田間防治與用藥紀錄，果實輕採後分級去病傷果、清潔並預冷；\n\n### 原理拆解：為什麼會這樣？\n\n**為何採後仍會變差**\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n**低溫有效，但有適用範圍**\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n**把全程串起來**\n\n採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。\n\n### 可直接練寫的完整答案\n\n採耐運適熟果、田間防治與用藥紀錄，果實輕採後分級去病傷果、清潔並預冷；\n\n用個果緩衝、透氣保濕箱及合適冷藏溫濕度，監控果溫與乙烯、避免寒害、結露和冷鏈中斷。出貨前確認目的國有效檢疫、殘留與文件要求，並以實際船期加貨架期驗證。\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n### 實例：把原理用在情境中\n\n驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：採前、成熟度、預冷包裝、冷鏈、檢疫與抵港品質。\n\n- **成熟度**\n- **預冷包裝**\n- **檢疫與抵港品質**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 認為溫度越低、保存效果一定越好。\n 105 果樹學"},{"id":"果樹學-105-二","s":"果樹學","y":105,"n":"二","t":"五名詞","body":"<h2>第二題｜五名詞（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=4\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Climacteric rise 更年性呼吸上升：成熟前後出現的呼吸躍升；<\/p>\n<p>forced-air cooling 壓差預冷：迫使冷空氣穿過貨物；<\/p>\n<p>curing 癒傷：適溫濕條件促傷口形成保護層；<\/p>\n<p>respiration quotient 呼吸商：CO₂ 產生量／O₂ 消耗量（同莫耳基準）；<\/p>\n<p>horticultural maturity 園藝成熟：達特定市場用途所需採收狀態，不必等同種子生理成熟。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先分清預冷與冷藏<\/strong><\/p>\n<p>採收時產品常接近田間溫度；若只把大量溫熱貨物放進冷庫，外層先冷、箱內與果心仍熱，呼吸及失水會持續。預冷的目標是迅速降低產品溫度，冷藏則是把已降溫的產品維持在適溫，兩者目的與設備負荷不同。<\/p>\n<p><strong>冷得快，必須讓熱有出口<\/strong><\/p>\n<p>壓差預冷靠風扇建立壓差，迫使冷空氣穿過箱孔與產品間隙；箱孔不對齊或氣流短路時，庫溫低也不代表果心降得快。水冷以冷水接觸傳熱，但要控制水質與交叉污染。真空預冷則降低氣壓，使組織水分在低溫蒸發，帶走潛熱。<\/p>\n<p><strong>依器官結構選方法<\/strong><\/p>\n<p>葉菜表面積相對大，真空法常有效；大果實的果心熱須先傳到外層，表皮又限制蒸發，因此真空法可能慢且失重。方法選定後，還須量果心或代表部位溫度，訂冷卻終點，而不是只記處理分鐘。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>forced-air cooling 壓差預冷：迫使冷空氣穿過貨物；<\/td>\n<td>移除田間熱的初步快速降溫，與之後持續維持低溫的冷藏不同。<\/td>\n<\/tr>\n<tr>\n<td>respiration quotient 呼吸商：CO₂ 產生量／O₂ 消耗量（同莫耳基準）；<\/td>\n<td>RQ＝放出 CO₂ 莫耳數／消耗 O₂ 莫耳數；它是比例，不能作為呼吸強度的同義詞。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Climacteric rise 更年性呼吸上升：成熟前後出現的呼吸躍升；<\/p>\n<p>forced-air cooling 壓差預冷：迫使冷空氣穿過貨物；<\/p>\n<p>curing 癒傷：適溫濕條件促傷口形成保護層；<\/p>\n<p>respiration quotient 呼吸商：CO₂ 產生量／O₂ 消耗量（同莫耳基準）；<\/p>\n<p>horticultural maturity 園藝成熟：達特定市場用途所需採收狀態，不必等同種子生理成熟。<\/p>\n<p>採收時產品常接近田間溫度；若只把大量溫熱貨物放進冷庫，外層先冷、箱內與果心仍熱，呼吸及失水會持續。預冷的目標是迅速降低產品溫度，冷藏則是把已降溫的產品維持在適溫，兩者目的與設備負荷不同。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>包裝場可將同一箱產品放置多點溫度計，畫降溫曲線，比較箱心與外側。這能檢查通氣孔、堆裝與風量是否合適，也可同時量失重，避免用犧牲水分換取冷卻速度。<\/p>\n<table>\n<thead>\n<tr>\n<th>方法<\/th>\n<th>主要傳熱機制<\/th>\n<th>判斷重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>房冷<\/td>\n<td>自然或一般循環冷空氣<\/td>\n<td>便宜但箱心降溫較慢<\/td>\n<\/tr>\n<tr>\n<td>壓差<\/td>\n<td>強制冷氣穿箱<\/td>\n<td>箱孔與氣流路徑<\/td>\n<\/tr>\n<tr>\n<td>水冷<\/td>\n<td>冷水接觸傳熱<\/td>\n<td>耐水性與水衛生<\/td>\n<\/tr>\n<tr>\n<td>真空<\/td>\n<td>減壓蒸發吸熱<\/td>\n<td>表面積、失水與器官構造<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>每題 2 分，共 10 分：正確譯名、定義與一項用途。<\/p>\n<ul>\n<li><strong>每題 2 分，共 10 分：正確譯名<\/strong><\/li>\n<li><strong>定義與一項用途<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把預冷寫成單純放進冰箱，沒有交代移除田間熱。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=4","md":"105年果樹學_逐題教學詳解.md","search":"五名詞 ## 第二題｜五名詞（10 分）\n\n### 題意與作答範圍\n\n本題重點：**五名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=4)。\n\n### 先掌握答案\n\nclimacteric rise 更年性呼吸上升：成熟前後出現的呼吸躍升；\n\nforced-air cooling 壓差預冷：迫使冷空氣穿過貨物；\n\ncuring 癒傷：適溫濕條件促傷口形成保護層；\n\nrespiration quotient 呼吸商：co₂ 產生量／o₂ 消耗量（同莫耳基準）；\n\nhorticultural maturity 園藝成熟：達特定市場用途所需採收狀態，不必等同種子生理成熟。\n\n### 原理拆解：為什麼會這樣？\n\n**先分清預冷與冷藏**\n\n採收時產品常接近田間溫度；若只把大量溫熱貨物放進冷庫，外層先冷、箱內與果心仍熱，呼吸及失水會持續。預冷的目標是迅速降低產品溫度，冷藏則是把已降溫的產品維持在適溫，兩者目的與設備負荷不同。\n\n**冷得快，必須讓熱有出口**\n\n壓差預冷靠風扇建立壓差，迫使冷空氣穿過箱孔與產品間隙；箱孔不對齊或氣流短路時，庫溫低也不代表果心降得快。水冷以冷水接觸傳熱，但要控制水質與交叉污染。真空預冷則降低氣壓，使組織水分在低溫蒸發，帶走潛熱。\n\n**依器官結構選方法**\n\n葉菜表面積相對大，真空法常有效；大果實的果心熱須先傳到外層，表皮又限制蒸發，因此真空法可能慢且失重。方法選定後，還須量果心或代表部位溫度，訂冷卻終點，而不是只記處理分鐘。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| forced-air cooling 壓差預冷：迫使冷空氣穿過貨物； | 移除田間熱的初步快速降溫，與之後持續維持低溫的冷藏不同。 |\n| respiration quotient 呼吸商：co₂ 產生量／o₂ 消耗量（同莫耳基準）； | rq＝放出 co₂ 莫耳數／消耗 o₂ 莫耳數；它是比例，不能作為呼吸強度的同義詞。 |\n\n### 可直接練寫的完整答案\n\nclimacteric rise 更年性呼吸上升：成熟前後出現的呼吸躍升；\n\nforced-air cooling 壓差預冷：迫使冷空氣穿過貨物；\n\ncuring 癒傷：適溫濕條件促傷口形成保護層；\n\nrespiration quotient 呼吸商：co₂ 產生量／o₂ 消耗量（同莫耳基準）；\n\nhorticultural maturity 園藝成熟：達特定市場用途所需採收狀態，不必等同種子生理成熟。\n\n採收時產品常接近田間溫度；若只把大量溫熱貨物放進冷庫，外層先冷、箱內與果心仍熱，呼吸及失水會持續。預冷的目標是迅速降低產品溫度，冷藏則是把已降溫的產品維持在適溫，兩者目的與設備負荷不同。\n\n### 實例：把原理用在情境中\n\n包裝場可將同一箱產品放置多點溫度計，畫降溫曲線，比較箱心與外側。這能檢查通氣孔、堆裝與風量是否合適，也可同時量失重，避免用犧牲水分換取冷卻速度。\n\n| 方法 | 主要傳熱機制 | 判斷重點 |\n| --- | --- | --- |\n| 房冷 | 自然或一般循環冷空氣 | 便宜但箱心降溫較慢 |\n| 壓差 | 強制冷氣穿箱 | 箱孔與氣流路徑 |\n| 水冷 | 冷水接觸傳熱 | 耐水性與水衛生 |\n| 真空 | 減壓蒸發吸熱 | 表面積、失水與器官構造 |\n\n### 配分重點：哪些內容不能漏？\n\n每題 2 分，共 10 分：正確譯名、定義與一項用途。\n\n- **每題 2 分，共 10 分：正確譯名**\n- **定義與一項用途**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把預冷寫成單純放進冰箱，沒有交代移除田間熱。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 105 果樹學"},{"id":"果樹學-105-三","s":"果樹學","y":105,"n":"三","t":"番木瓜脆葉裂柄流膠與瘤果","body":"<h2>第三題｜番木瓜脆葉裂柄流膠與瘤果（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>番木瓜脆葉裂柄流膠與瘤果<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=4\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>綜合新葉脆、頂芽壞死、葉柄龜裂流膠及果面瘤狀，優先診斷缺硼。硼不足破壞細胞壁與分生組織發育，也影響花粉管及果實組織均勻生長。先分析土葉、檢查根傷及乾旱，再依建議量以土施或低濃度葉施補硼，改善水分與 pH，避免過量造成毒害。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>缺硼先傷哪些功能<\/strong><\/p>\n<p>硼參與細胞壁穩定及分生組織發育，亦影響花粉萌發、花粉管伸長與受精。缺乏時幼嫩組織生長不正常，可見脆裂、頂芽受損或果實凹凸，生殖器官也可能先失去功能而減少著果。<\/p>\n<p><strong>為何水分與土壤也重要<\/strong><\/p>\n<p>硼供應受土壤有效性、根域 pH、含水及根系活力影響。乾旱可使根吸收與輸送不足，土中有硼不代表發育部位已收到。硼在體內的再移動依物種而異，具多元醇運輸的部分果樹不能套用完全不移動的規則。<\/p>\n<p><strong>診斷與補充的界線<\/strong><\/p>\n<p>以作物、葉齡、裂柄流膠及果實畸形的組合建立判斷，配土葉分析排除病毒、藥害與鈣問題。硼的缺乏與毒害範圍較窄，補充應少量、均勻、依建議執行；過量也會造成葉片壞死，不能把所有裂果一律用硼處理。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>綜合新葉脆、頂芽壞死、葉柄龜裂流膠及果面瘤狀，優先診斷缺硼。硼不足破壞細胞壁與分生組織發育，也影響花粉管及果實組織均勻生長。先分析土葉、檢查根傷及乾旱，再依建議量以土施或低濃度葉施補硼，改善水分與 pH，避免過量造成毒害。<\/p>\n<p>硼參與細胞壁穩定及分生組織發育，亦影響花粉萌發、花粉管伸長與受精。缺乏時幼嫩組織生長不正常，可見脆裂、頂芽受損或果實凹凸，生殖器官也可能先失去功能而減少著果。<\/p>\n<p>硼供應受土壤有效性、根域 pH、含水及根系活力影響。乾旱可使根吸收與輸送不足，土中有硼不代表發育部位已收到。硼在體內的再移動依物種而異，具多元醇運輸的部分果樹不能套用完全不移動的規則。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>番木瓜若同時有新葉脆、葉柄龜裂流膠與瘤果，比只有一個果實畸形更支持缺硼；若全園只有單株葉斑，則須更重視局部根病或感染性問題。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：判斷元素、症狀連結、功能、分析與改善。<\/p>\n<ul>\n<li><strong>判斷元素<\/strong><\/li>\n<li><strong>症狀連結<\/strong><\/li>\n<li><strong>分析與改善<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有硬果、空心或裂果都直接診斷成缺硼。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=4","md":"105年果樹學_逐題教學詳解.md","search":"番木瓜脆葉裂柄流膠與瘤果 ## 第三題｜番木瓜脆葉裂柄流膠與瘤果（15 分）\n\n### 題意與作答範圍\n\n本題重點：**番木瓜脆葉裂柄流膠與瘤果**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=4)。\n\n### 先掌握答案\n\n綜合新葉脆、頂芽壞死、葉柄龜裂流膠及果面瘤狀，優先診斷缺硼。硼不足破壞細胞壁與分生組織發育，也影響花粉管及果實組織均勻生長。先分析土葉、檢查根傷及乾旱，再依建議量以土施或低濃度葉施補硼，改善水分與 ph，避免過量造成毒害。\n\n### 原理拆解：為什麼會這樣？\n\n**缺硼先傷哪些功能**\n\n硼參與細胞壁穩定及分生組織發育，亦影響花粉萌發、花粉管伸長與受精。缺乏時幼嫩組織生長不正常，可見脆裂、頂芽受損或果實凹凸，生殖器官也可能先失去功能而減少著果。\n\n**為何水分與土壤也重要**\n\n硼供應受土壤有效性、根域 ph、含水及根系活力影響。乾旱可使根吸收與輸送不足，土中有硼不代表發育部位已收到。硼在體內的再移動依物種而異，具多元醇運輸的部分果樹不能套用完全不移動的規則。\n\n**診斷與補充的界線**\n\n以作物、葉齡、裂柄流膠及果實畸形的組合建立判斷，配土葉分析排除病毒、藥害與鈣問題。硼的缺乏與毒害範圍較窄，補充應少量、均勻、依建議執行；過量也會造成葉片壞死，不能把所有裂果一律用硼處理。\n\n### 可直接練寫的完整答案\n\n綜合新葉脆、頂芽壞死、葉柄龜裂流膠及果面瘤狀，優先診斷缺硼。硼不足破壞細胞壁與分生組織發育，也影響花粉管及果實組織均勻生長。先分析土葉、檢查根傷及乾旱，再依建議量以土施或低濃度葉施補硼，改善水分與 ph，避免過量造成毒害。\n\n硼參與細胞壁穩定及分生組織發育，亦影響花粉萌發、花粉管伸長與受精。缺乏時幼嫩組織生長不正常，可見脆裂、頂芽受損或果實凹凸，生殖器官也可能先失去功能而減少著果。\n\n硼供應受土壤有效性、根域 ph、含水及根系活力影響。乾旱可使根吸收與輸送不足，土中有硼不代表發育部位已收到。硼在體內的再移動依物種而異，具多元醇運輸的部分果樹不能套用完全不移動的規則。\n\n### 實例：把原理用在情境中\n\n番木瓜若同時有新葉脆、葉柄龜裂流膠與瘤果，比只有一個果實畸形更支持缺硼；若全園只有單株葉斑，則須更重視局部根病或感染性問題。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：判斷元素、症狀連結、功能、分析與改善。\n\n- **判斷元素**\n- **症狀連結**\n- **分析與改善**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有硬果、空心或裂果都直接診斷成缺硼。\n 105 果樹學"},{"id":"果樹學-105-四","s":"果樹學","y":105,"n":"四","t":"番石榴育種與量繁","body":"<h2>第四題｜番石榴育種與量繁（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>番石榴育種與量繁<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=4\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>目標包括脆甜風味、適當酸度、少籽或無籽、果型外觀、耐病、耐貯運及產期穩定。可由地方種原、實生變異與芽變選拔，或優良親本雜交並評估後代。優株需多地多年及採後試驗，之後以健康母本嫁接、壓條或可行的組培系統快速無性量繁，並確保品種純度。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>目標包括脆甜風味、適當酸度、少籽或無籽、果型外觀、耐病、耐貯運及產期穩定。可由地方種原、實生變異與芽變選拔，或優良親本雜交並評估後代。優株需多地多年及採後試驗，之後以健康母本嫁接、壓條或可行的組培系統快速無性量繁，並確保品種純度。<\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：目標、選拔／雜交、驗證、無性量繁與健康。<\/p>\n<ul>\n<li><strong>選拔／雜交<\/strong><\/li>\n<li><strong>無性量繁與健康<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=4","md":"105年果樹學_逐題教學詳解.md","search":"番石榴育種與量繁 ## 第四題｜番石榴育種與量繁（10 分）\n\n### 題意與作答範圍\n\n本題重點：**番石榴育種與量繁**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=4)。\n\n### 先掌握答案\n\n目標包括脆甜風味、適當酸度、少籽或無籽、果型外觀、耐病、耐貯運及產期穩定。可由地方種原、實生變異與芽變選拔，或優良親本雜交並評估後代。優株需多地多年及採後試驗，之後以健康母本嫁接、壓條或可行的組培系統快速無性量繁，並確保品種純度。\n\n### 原理拆解：為什麼會這樣？\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n### 可直接練寫的完整答案\n\n目標包括脆甜風味、適當酸度、少籽或無籽、果型外觀、耐病、耐貯運及產期穩定。可由地方種原、實生變異與芽變選拔，或優良親本雜交並評估後代。優株需多地多年及採後試驗，之後以健康母本嫁接、壓條或可行的組培系統快速無性量繁，並確保品種純度。\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n### 實例：把原理用在情境中\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：目標、選拔／雜交、驗證、無性量繁與健康。\n\n- **選拔／雜交**\n- **無性量繁與健康**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把轉入基因成功直接等同育成可商業化品種。\n- 把無性繁殖與無病毒畫上等號。\n 105 果樹學"},{"id":"果樹學-105-五","s":"果樹學","y":105,"n":"五","t":"臺灣溫帶果樹產業條件與變遷","body":"<h2>第五題｜臺灣溫帶果樹產業條件與變遷（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>臺灣溫帶果樹產業條件與變遷<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=4\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>中央山地隨海拔降低氣溫，提供溫帶果樹需冷；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>用限制來源分類<\/strong><\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p><strong>冬天的冷與春天的暖做不同工作<\/strong><\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<p><strong>技術必須對應真正瓶頸<\/strong><\/p>\n<p>摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。<\/p>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>中央山地隨海拔降低氣溫，提供溫帶果樹需冷；<\/p>\n<p>另有低需冷品種、梨穗高接及促成等技術，使低緯度仍可生產。早期偏重中高海拔蘋果、水梨、桃等，後受進口競爭、山坡地保育與勞力限制，逐漸轉向低需冷與平地高接梨、特色高品質產品及休閒利用；<\/p>\n<p>不能只靠擴大高山墾殖競爭。<\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。<\/p>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：地形氣候、技術突破、產區與產業結構、進口及保育壓力。<\/p>\n<ul>\n<li><strong>地形氣候<\/strong><\/li>\n<li><strong>技術突破<\/strong><\/li>\n<li><strong>產區與產業結構<\/strong><\/li>\n<li><strong>進口及保育壓力<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把需冷不足與萌芽後霜害混為同一問題。<\/li>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=4","md":"105年果樹學_逐題教學詳解.md","search":"臺灣溫帶果樹產業條件與變遷 ## 第五題｜臺灣溫帶果樹產業條件與變遷（15 分）\n\n### 題意與作答範圍\n\n本題重點：**臺灣溫帶果樹產業條件與變遷**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=4)。\n\n### 先掌握答案\n\n中央山地隨海拔降低氣溫，提供溫帶果樹需冷；\n\n### 原理拆解：為什麼會這樣？\n\n**用限制來源分類**\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n**冬天的冷與春天的暖做不同工作**\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n**技術必須對應真正瓶頸**\n\n摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n### 可直接練寫的完整答案\n\n中央山地隨海拔降低氣溫，提供溫帶果樹需冷；\n\n另有低需冷品種、梨穗高接及促成等技術，使低緯度仍可生產。早期偏重中高海拔蘋果、水梨、桃等，後受進口競爭、山坡地保育與勞力限制，逐漸轉向低需冷與平地高接梨、特色高品質產品及休閒利用；\n\n不能只靠擴大高山墾殖競爭。\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n### 實例：把原理用在情境中\n\n平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：地形氣候、技術突破、產區與產業結構、進口及保育壓力。\n\n- **地形氣候**\n- **技術突破**\n- **產區與產業結構**\n- **進口及保育壓力**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把需冷不足與萌芽後霜害混為同一問題。\n- 把轉入基因成功直接等同育成可商業化品種。\n 105 果樹學"},{"id":"果樹學-105-六","s":"果樹學","y":105,"n":"六","t":"荔枝品種變遷與瓶頸","body":"<h2>第六題｜荔枝品種變遷與瓶頸（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>荔枝品種變遷與瓶頸<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=4\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>早期產業以黑葉等較易栽培品種及加工、鮮銷為主，之後增加玉荷包等早生高價品種與大果小核特色種，以錯開集中產期並提升鮮食品質。瓶頸有品種集中、產期短且重疊、裂果、大小年、採後褐變與蟲害檢疫；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先辨識限制產期的生理關卡<\/strong><\/p>\n<p>產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。<\/p>\n<p><strong>處理須在可反應的階段<\/strong><\/p>\n<p>同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。<\/p>\n<p><strong>移動花期之後仍有生產風險<\/strong><\/p>\n<p>非自然盛產期可能遇不利授粉、低光、高溫或病蟲，果實品質與產量不保證同步提高。完整答案應包含後續授粉、負載與採收安排，以及是否能以售價補償成本。<\/p>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>早期產業以黑葉等較易栽培品種及加工、鮮銷為主，之後增加玉荷包等早生高價品種與大果小核特色種，以錯開集中產期並提升鮮食品質。瓶頸有品種集中、產期短且重疊、裂果、大小年、採後褐變與蟲害檢疫；<\/p>\n<p>暖冬使需低溫誘導的開花更不穩。應分散成熟期、適地適種並加強冷鏈與產銷契作。<\/p>\n<p>產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。<\/p>\n<p>同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>紅龍果適當品種可利用夜間照光調節開花，但仍須評估夜溫、花粉與授粉作業；有花並不等於必能達到預期果重與採收量。<\/p>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：歷史方向、具名品種、品質與產銷瓶頸及氣候。<\/p>\n<ul>\n<li><strong>歷史方向<\/strong><\/li>\n<li><strong>具名品種<\/strong><\/li>\n<li><strong>品質與產銷瓶頸及氣候<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將所有產調都解釋成解除休眠。<\/li>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=4","md":"105年果樹學_逐題教學詳解.md","search":"荔枝品種變遷與瓶頸 ## 第六題｜荔枝品種變遷與瓶頸（10 分）\n\n### 題意與作答範圍\n\n本題重點：**荔枝品種變遷與瓶頸**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=4)。\n\n### 先掌握答案\n\n早期產業以黑葉等較易栽培品種及加工、鮮銷為主，之後增加玉荷包等早生高價品種與大果小核特色種，以錯開集中產期並提升鮮食品質。瓶頸有品種集中、產期短且重疊、裂果、大小年、採後褐變與蟲害檢疫；\n\n### 原理拆解：為什麼會這樣？\n\n**先辨識限制產期的生理關卡**\n\n產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。\n\n**處理須在可反應的階段**\n\n同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。\n\n**移動花期之後仍有生產風險**\n\n非自然盛產期可能遇不利授粉、低光、高溫或病蟲，果實品質與產量不保證同步提高。完整答案應包含後續授粉、負載與採收安排，以及是否能以售價補償成本。\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n### 可直接練寫的完整答案\n\n早期產業以黑葉等較易栽培品種及加工、鮮銷為主，之後增加玉荷包等早生高價品種與大果小核特色種，以錯開集中產期並提升鮮食品質。瓶頸有品種集中、產期短且重疊、裂果、大小年、採後褐變與蟲害檢疫；\n\n暖冬使需低溫誘導的開花更不穩。應分散成熟期、適地適種並加強冷鏈與產銷契作。\n\n產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。\n\n同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。\n\n### 實例：把原理用在情境中\n\n紅龍果適當品種可利用夜間照光調節開花，但仍須評估夜溫、花粉與授粉作業；有花並不等於必能達到預期果重與採收量。\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：歷史方向、具名品種、品質與產銷瓶頸及氣候。\n\n- **歷史方向**\n- **具名品種**\n- **品質與產銷瓶頸及氣候**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將所有產調都解釋成解除休眠。\n- 把轉入基因成功直接等同育成可商業化品種。\n 105 果樹學"},{"id":"果樹學-105-七","s":"果樹學","y":105,"n":"七","t":"葡萄、鳳梨、蓮霧產調","body":"<h2>第七題｜葡萄、鳳梨、蓮霧產調（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>葡萄、鳳梨、蓮霧產調<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=4\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>葡萄以冬夏修剪、整齊萌芽及成熟花芽進行兩收或設施促成；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先辨識限制產期的生理關卡<\/strong><\/p>\n<p>產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。<\/p>\n<p><strong>處理須在可反應的階段<\/strong><\/p>\n<p>同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。<\/p>\n<p><strong>移動花期之後仍有生產風險<\/strong><\/p>\n<p>非自然盛產期可能遇不利授粉、低光、高溫或病蟲，果實品質與產量不保證同步提高。完整答案應包含後續授粉、負載與採收安排，以及是否能以售價補償成本。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>葡萄以冬夏修剪、整齊萌芽及成熟花芽進行兩收或設施促成；<\/p>\n<p>鳳梨待植株達可誘花大小，以乙烯利等誘花，依處理日安排採期；<\/p>\n<p>蓮霧利用修剪、遮光、浸水或乾濕管理等適地技術，使新梢整齊成熟後誘導花芽，並疏花果控制負載。三者分別依芽體、植株成熟度及枝梢節律操作，不能直接互換。<\/p>\n<p>產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。<\/p>\n<p>同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>紅龍果適當品種可利用夜間照光調節開花，但仍須評估夜溫、花粉與授粉作業；有花並不等於必能達到預期果重與採收量。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：每種方法、作用階段及原理各約三分之一。<\/p>\n<ul>\n<li><strong>每種方法<\/strong><\/li>\n<li><strong>作用階段及原理各約三分之一<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將所有產調都解釋成解除休眠。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=4","md":"105年果樹學_逐題教學詳解.md","search":"葡萄、鳳梨、蓮霧產調 ## 第七題｜葡萄、鳳梨、蓮霧產調（15 分）\n\n### 題意與作答範圍\n\n本題重點：**葡萄、鳳梨、蓮霧產調**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=4)。\n\n### 先掌握答案\n\n葡萄以冬夏修剪、整齊萌芽及成熟花芽進行兩收或設施促成；\n\n### 原理拆解：為什麼會這樣？\n\n**先辨識限制產期的生理關卡**\n\n產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。\n\n**處理須在可反應的階段**\n\n同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。\n\n**移動花期之後仍有生產風險**\n\n非自然盛產期可能遇不利授粉、低光、高溫或病蟲，果實品質與產量不保證同步提高。完整答案應包含後續授粉、負載與採收安排，以及是否能以售價補償成本。\n\n### 可直接練寫的完整答案\n\n葡萄以冬夏修剪、整齊萌芽及成熟花芽進行兩收或設施促成；\n\n鳳梨待植株達可誘花大小，以乙烯利等誘花，依處理日安排採期；\n\n蓮霧利用修剪、遮光、浸水或乾濕管理等適地技術，使新梢整齊成熟後誘導花芽，並疏花果控制負載。三者分別依芽體、植株成熟度及枝梢節律操作，不能直接互換。\n\n產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。\n\n同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。\n\n### 實例：把原理用在情境中\n\n紅龍果適當品種可利用夜間照光調節開花，但仍須評估夜溫、花粉與授粉作業；有花並不等於必能達到預期果重與採收量。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：每種方法、作用階段及原理各約三分之一。\n\n- **每種方法**\n- **作用階段及原理各約三分之一**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將所有產調都解釋成解除休眠。\n 105 果樹學"},{"id":"果樹學-105-八","s":"果樹學","y":105,"n":"八","t":"三種糖酵素與果實糖","body":"<h2>第八題｜三種糖酵素與果實糖（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>三種糖酵素與果實糖<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=4\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>果實糖度與糖種類受輸入量、呼吸消耗、果實含水及貯藏共同決定。轉化酶強可將蔗糖轉為己糖、維持庫端濃度梯度；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>三種酵素要以反應式區別<\/strong><\/p>\n<p>轉化酶把蔗糖不可逆水解為葡萄糖與果糖；蔗糖合成酶可催化蔗糖與 UDP 形成 UDP-葡萄糖及果糖，反應可逆；蔗糖磷酸合成酶將 UDP-葡萄糖與果糖-6-磷酸形成蔗糖-6-磷酸，再去磷酸形成蔗糖。前兩者常與庫端利用、細胞壁合成或卸載相關，後者常與蔗糖合成相關；不能僅由一種酵素高低推定所有果實必然更甜。<\/p>\n<p><strong>三種酵素要看反應而非只背名稱<\/strong><\/p>\n<p>轉化酶水解蔗糖，生成葡萄糖與果糖；蔗糖合成酶可逆地轉換蔗糖與 UDP-葡萄糖、果糖，在許多庫組織常參與裂解；蔗糖磷酸合成酶則參與蔗糖合成。不能因名稱含「合成」就斷定反應在所有組織一定只向合成方向。<\/p>\n<p><strong>酵素改變糖種類，也影響庫的吸引力<\/strong><\/p>\n<p>庫端把蔗糖裂解可維持輸入梯度、供呼吸和細胞壁合成，己糖也具滲透與訊號作用。若成熟期蔗糖合成加強、分解下降並有足夠運入，就可能較多累積蔗糖；但結果仍受細胞區室及液泡運輸限制。<\/p>\n<p><strong>不可用一次活性推全部品質<\/strong><\/p>\n<p>應比較發育時序、酵素位置、糖總量與含水。糖度較高可能因水少，不必然是酵素使糖總量提高；有機酸也受合成、呼吸利用與液泡貯藏影響，需與糖酸比、風味一起判讀。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>果實糖度與糖種類受輸入量、呼吸消耗、果實含水及貯藏共同決定。轉化酶強可將蔗糖轉為己糖、維持庫端濃度梯度；<\/p>\n<p>蔗糖合成酶反應可逆，常在庫組織供裂解與生合成底物；<\/p>\n<p>蔗糖磷酸合成酶有利蔗糖合成。應比較發育時序與細胞區室，不能把酵素名稱直接等同作用方向。<\/p>\n<p>轉化酶把蔗糖不可逆水解為葡萄糖與果糖；蔗糖合成酶可催化蔗糖與 UDP 形成 UDP-葡萄糖及果糖，反應可逆；蔗糖磷酸合成酶將 UDP-葡萄糖與果糖-6-磷酸形成蔗糖-6-磷酸，再去磷酸形成蔗糖。前兩者常與庫端利用、細胞壁合成或卸載相關，後者常與蔗糖合成相關；不能僅由一種酵素高低推定所有果實必然更甜。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>研究上可同測蔗糖、葡萄糖、果糖的含量與相關酵素，若只有轉化酶較高而糖輸入不足，仍不能推定成熟果一定更甜。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：三酵素反應及糖組成、發育與總糖的限制。<\/p>\n<ul>\n<li><strong>三酵素反應及糖組成<\/strong><\/li>\n<li><strong>發育與總糖的限制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把蔗糖合成酶等同只能合成蔗糖。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=4","md":"105年果樹學_逐題教學詳解.md","search":"三種糖酵素與果實糖 ## 第八題｜三種糖酵素與果實糖（10 分）\n\n### 題意與作答範圍\n\n本題重點：**三種糖酵素與果實糖**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=4)。\n\n### 先掌握答案\n\n果實糖度與糖種類受輸入量、呼吸消耗、果實含水及貯藏共同決定。轉化酶強可將蔗糖轉為己糖、維持庫端濃度梯度；\n\n### 原理拆解：為什麼會這樣？\n\n**三種酵素要以反應式區別**\n\n轉化酶把蔗糖不可逆水解為葡萄糖與果糖；蔗糖合成酶可催化蔗糖與 udp 形成 udp-葡萄糖及果糖，反應可逆；蔗糖磷酸合成酶將 udp-葡萄糖與果糖-6-磷酸形成蔗糖-6-磷酸，再去磷酸形成蔗糖。前兩者常與庫端利用、細胞壁合成或卸載相關，後者常與蔗糖合成相關；不能僅由一種酵素高低推定所有果實必然更甜。\n\n**三種酵素要看反應而非只背名稱**\n\n轉化酶水解蔗糖，生成葡萄糖與果糖；蔗糖合成酶可逆地轉換蔗糖與 udp-葡萄糖、果糖，在許多庫組織常參與裂解；蔗糖磷酸合成酶則參與蔗糖合成。不能因名稱含「合成」就斷定反應在所有組織一定只向合成方向。\n\n**酵素改變糖種類，也影響庫的吸引力**\n\n庫端把蔗糖裂解可維持輸入梯度、供呼吸和細胞壁合成，己糖也具滲透與訊號作用。若成熟期蔗糖合成加強、分解下降並有足夠運入，就可能較多累積蔗糖；但結果仍受細胞區室及液泡運輸限制。\n\n**不可用一次活性推全部品質**\n\n應比較發育時序、酵素位置、糖總量與含水。糖度較高可能因水少，不必然是酵素使糖總量提高；有機酸也受合成、呼吸利用與液泡貯藏影響，需與糖酸比、風味一起判讀。\n\n### 可直接練寫的完整答案\n\n果實糖度與糖種類受輸入量、呼吸消耗、果實含水及貯藏共同決定。轉化酶強可將蔗糖轉為己糖、維持庫端濃度梯度；\n\n蔗糖合成酶反應可逆，常在庫組織供裂解與生合成底物；\n\n蔗糖磷酸合成酶有利蔗糖合成。應比較發育時序與細胞區室，不能把酵素名稱直接等同作用方向。\n\n轉化酶把蔗糖不可逆水解為葡萄糖與果糖；蔗糖合成酶可催化蔗糖與 udp 形成 udp-葡萄糖及果糖，反應可逆；蔗糖磷酸合成酶將 udp-葡萄糖與果糖-6-磷酸形成蔗糖-6-磷酸，再去磷酸形成蔗糖。前兩者常與庫端利用、細胞壁合成或卸載相關，後者常與蔗糖合成相關；不能僅由一種酵素高低推定所有果實必然更甜。\n\n### 實例：把原理用在情境中\n\n研究上可同測蔗糖、葡萄糖、果糖的含量與相關酵素，若只有轉化酶較高而糖輸入不足，仍不能推定成熟果一定更甜。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：三酵素反應及糖組成、發育與總糖的限制。\n\n- **三酵素反應及糖組成**\n- **發育與總糖的限制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把蔗糖合成酶等同只能合成蔗糖。\n 105 果樹學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
