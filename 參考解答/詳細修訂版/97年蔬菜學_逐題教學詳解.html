ls{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 7 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"蔬菜學-97-一","s":"蔬菜學","y":97,"n":"一","t":"萵苣發芽資料判讀","body":"<h2>第一題｜萵苣發芽資料判讀（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>萵苣發芽資料判讀<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=30\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>新採 20°C 暗發芽 42%，8°C 存六個月後升至 86%，可解釋為後熟使部分初生休眠解除，不代表種子數量增加。30°C 暗僅 6%、光下 40%，顯示高溫抑芽且光可部分促進；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>判圖要分熱抑制與真正休眠<\/strong><\/p>\n<p>種子在高溫不能發芽，移回適溫後迅速恢復，較接近可逆熱抑制；若高溫處理後回適溫仍不能正常發芽，須考慮誘發熱休眠或劣化。應比較處理前後活力與破眠反應，不能單憑高溫發芽率低便判種子已死亡。光敏性與品種也會改變萵苣結果。<\/p>\n<p><strong>發芽率、活力與壽命要分開<\/strong><\/p>\n<p>發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。<\/p>\n<p><strong>劣化涉及膜與修復能力<\/strong><\/p>\n<p>貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。<\/p>\n<p><strong>保存與檢測依種子特性選擇<\/strong><\/p>\n<p>耐乾燥的正貯型種子通常可適度乾燥、低溫與防潮保存；不耐乾燥的種子不能照抄同法。發芽試驗、加速老化、導電度或低溫試驗各反映不同面向，須選適合作物的條件與標準。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>新採 20°C 暗發芽 42%，8°C 存六個月後升至 86%，可解釋為後熟使部分初生休眠解除，不代表種子數量增加。30°C 暗僅 6%、光下 40%，顯示高溫抑芽且光可部分促進；<\/p>\n<p>PEG −1.2 MPa 48 小時後洗淨，在 30°C 暗達 85%，表示滲調引發在胚根未突出前啟動代謝與修復，改善高溫發芽。須另回適溫測試才區分高溫抑制與真正誘發休眠，不能由單點就斷言。<\/p>\n<p>種子在高溫不能發芽，移回適溫後迅速恢復，較接近可逆熱抑制；若高溫處理後回適溫仍不能正常發芽，須考慮誘發熱休眠或劣化。應比較處理前後活力與破眠反應，不能單憑高溫發芽率低便判種子已死亡。光敏性與品種也會改變萵苣結果。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>蔥種子貯藏後即使標準發芽率尚可，活力降低也可能使育苗出苗不整；先做活力或小規模出苗比較，比直接增加播種密度更能掌握苗數。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：逐數字推論、後熟、光與高溫、PEG 原理及證據限制。<\/p>\n<ul>\n<li><strong>逐數字推論<\/strong><\/li>\n<li><strong>光與高溫<\/strong><\/li>\n<li><strong>PEG 原理及證據限制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有未發芽種子都判為死亡，漏掉休眠。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=30","md":"97年蔬菜學_逐題教學詳解.md","search":"萵苣發芽資料判讀 ## 第一題｜萵苣發芽資料判讀（15 分）\n\n### 題意與作答範圍\n\n本題重點：**萵苣發芽資料判讀**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=30)。\n\n### 先掌握答案\n\n新採 20°c 暗發芽 42%，8°c 存六個月後升至 86%，可解釋為後熟使部分初生休眠解除，不代表種子數量增加。30°c 暗僅 6%、光下 40%，顯示高溫抑芽且光可部分促進；\n\n### 原理拆解：為什麼會這樣？\n\n**判圖要分熱抑制與真正休眠**\n\n種子在高溫不能發芽，移回適溫後迅速恢復，較接近可逆熱抑制；若高溫處理後回適溫仍不能正常發芽，須考慮誘發熱休眠或劣化。應比較處理前後活力與破眠反應，不能單憑高溫發芽率低便判種子已死亡。光敏性與品種也會改變萵苣結果。\n\n**發芽率、活力與壽命要分開**\n\n發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。\n\n**劣化涉及膜與修復能力**\n\n貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。\n\n**保存與檢測依種子特性選擇**\n\n耐乾燥的正貯型種子通常可適度乾燥、低溫與防潮保存；不耐乾燥的種子不能照抄同法。發芽試驗、加速老化、導電度或低溫試驗各反映不同面向，須選適合作物的條件與標準。\n\n### 可直接練寫的完整答案\n\n新採 20°c 暗發芽 42%，8°c 存六個月後升至 86%，可解釋為後熟使部分初生休眠解除，不代表種子數量增加。30°c 暗僅 6%、光下 40%，顯示高溫抑芽且光可部分促進；\n\npeg −1.2 mpa 48 小時後洗淨，在 30°c 暗達 85%，表示滲調引發在胚根未突出前啟動代謝與修復，改善高溫發芽。須另回適溫測試才區分高溫抑制與真正誘發休眠，不能由單點就斷言。\n\n種子在高溫不能發芽，移回適溫後迅速恢復，較接近可逆熱抑制；若高溫處理後回適溫仍不能正常發芽，須考慮誘發熱休眠或劣化。應比較處理前後活力與破眠反應，不能單憑高溫發芽率低便判種子已死亡。光敏性與品種也會改變萵苣結果。\n\n### 實例：把原理用在情境中\n\n蔥種子貯藏後即使標準發芽率尚可，活力降低也可能使育苗出苗不整；先做活力或小規模出苗比較，比直接增加播種密度更能掌握苗數。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：逐數字推論、後熟、光與高溫、peg 原理及證據限制。\n\n- **逐數字推論**\n- **光與高溫**\n- **peg 原理及證據限制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有未發芽種子都判為死亡，漏掉休眠。\n 97 蔬菜學"},{"id":"蔬菜學-97-二","s":"蔬菜學","y":97,"n":"二","t":"豪雨淹水致死","body":"<h2>第二題｜豪雨淹水致死（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>豪雨淹水致死<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=30\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>土孔被水填滿使氧擴散劇降，根氧化呼吸與 ATP 供應不足，水肥吸收及膜功能受抑；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>土孔被水填滿使氧擴散劇降，根氧化呼吸與 ATP 供應不足，水肥吸收及膜功能受抑；<\/p>\n<p>厭氧代謝、毒性物質與活性氧、根腐再加劇，地上部即使有水仍萎凋。長淹後根死亡，排水回氧亦可能再傷。用高畦、明暗溝、土壤結構與耐濕材料預防，災後先排水復根不濃肥。<\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：缺氧、能量吸收、代謝病害與管理。<\/p>\n<ul>\n<li><strong>能量吸收<\/strong><\/li>\n<li><strong>代謝病害與管理<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=30","md":"97年蔬菜學_逐題教學詳解.md","search":"豪雨淹水致死 ## 第二題｜豪雨淹水致死（10 分）\n\n### 題意與作答範圍\n\n本題重點：**豪雨淹水致死**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=30)。\n\n### 先掌握答案\n\n土孔被水填滿使氧擴散劇降，根氧化呼吸與 atp 供應不足，水肥吸收及膜功能受抑；\n\n### 原理拆解：為什麼會這樣？\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n### 可直接練寫的完整答案\n\n土孔被水填滿使氧擴散劇降，根氧化呼吸與 atp 供應不足，水肥吸收及膜功能受抑；\n\n厭氧代謝、毒性物質與活性氧、根腐再加劇，地上部即使有水仍萎凋。長淹後根死亡，排水回氧亦可能再傷。用高畦、明暗溝、土壤結構與耐濕材料預防，災後先排水復根不濃肥。\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n### 實例：把原理用在情境中\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：缺氧、能量吸收、代謝病害與管理。\n\n- **能量吸收**\n- **代謝病害與管理**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將連作障礙全部歸因於缺肥。\n 97 蔬菜學"},{"id":"蔬菜學-97-三","s":"蔬菜學","y":97,"n":"三","t":"西瓜 F1 育種","body":"<h2>第三題｜西瓜 F1 育種（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>西瓜 F1 育種<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=30\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>選親本來源與市場目標，連續自交選出純化系並維持抗性、花性及品質；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>F1 一致性來自親本與受控交配<\/strong><\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<p><strong>制種須阻止不需要的授粉<\/strong><\/p>\n<p>去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。<\/p>\n<p><strong>F2 分離是留種限制的主因<\/strong><\/p>\n<p>F1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>選親本來源與市場目標，連續自交選出純化系並維持抗性、花性及品質；<\/p>\n<p>試交看一般／特殊配合力，選 F1 多季多地與果品質試驗；<\/p>\n<p>安排父母本花期與隔離，去除母本雄花或採可控性別型、人工授粉採種，最後檢純度發芽與健康，保留親本。<\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<p>去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>西瓜 F1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 F1 果實留種所得下一代，不能保證維持原果形與整齊性。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：親本、配合力、試驗、控授粉、品質檢驗。<\/p>\n<ul>\n<li><strong>配合力<\/strong><\/li>\n<li><strong>控授粉<\/strong><\/li>\n<li><strong>品質檢驗<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>寫成 F1 種子完全不能發芽。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=30","md":"97年蔬菜學_逐題教學詳解.md","search":"西瓜 f1 育種 ## 第三題｜西瓜 f1 育種（15 分）\n\n### 題意與作答範圍\n\n本題重點：**西瓜 f1 育種**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=30)。\n\n### 先掌握答案\n\n選親本來源與市場目標，連續自交選出純化系並維持抗性、花性及品質；\n\n### 原理拆解：為什麼會這樣？\n\n**f1 一致性來自親本與受控交配**\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n**制種須阻止不需要的授粉**\n\n去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。\n\n**f2 分離是留種限制的主因**\n\nf1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。\n\n### 可直接練寫的完整答案\n\n選親本來源與市場目標，連續自交選出純化系並維持抗性、花性及品質；\n\n試交看一般／特殊配合力，選 f1 多季多地與果品質試驗；\n\n安排父母本花期與隔離，去除母本雄花或採可控性別型、人工授粉採種，最後檢純度發芽與健康，保留親本。\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。\n\n### 實例：把原理用在情境中\n\n西瓜 f1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 f1 果實留種所得下一代，不能保證維持原果形與整齊性。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：親本、配合力、試驗、控授粉、品質檢驗。\n\n- **配合力**\n- **控授粉**\n- **品質檢驗**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 寫成 f1 種子完全不能發芽。\n 97 蔬菜學"},{"id":"蔬菜學-97-四","s":"蔬菜學","y":97,"n":"四","t":"主要五蔬菜科學名與原產","body":"<h2>第四題｜主要五蔬菜科學名與原產（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>主要五蔬菜科學名與原產<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=30\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>以考試前已可取得的 96 年農業統計年報為歷史口徑，排除「其他」集合類目，前十大栽培面積作物中可任選以下五種。甘藍：十字花科 Brassicaceae，Brassica oleracea var. capitata，原產地中海沿岸歐洲，種植面積 8396 公頃；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>器官來源比外觀名稱更可靠<\/strong><\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<p><strong>不同分類軸不能混用<\/strong><\/p>\n<p>花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。<\/p>\n<p><strong>名稱與例子要一對一<\/strong><\/p>\n<p>寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>歷史面積已核對官方 96 年年報：<a href=\"https://eng.moa.gov.tw/upload/files/eng_web_structure/17853/046.pdf\">蘿蔔<\/a>、<a href=\"https://eng.moa.gov.tw/upload/files/eng_web_structure/17853/048.pdf\">青蔥<\/a>、<a href=\"https://eng.moa.gov.tw/upload/files/eng_web_structure/17853/056.pdf\">甘藍<\/a>、<a href=\"https://eng.moa.gov.tw/upload/files/eng_web_structure/17853/064.pdf\">番茄<\/a>、<a href=\"https://eng.moa.gov.tw/upload/files/eng_web_structure/17853/068.pdf\">西瓜<\/a>。<\/p>\n<p>學名、原產與統計品項是不同資訊，答案逐一對應；<\/p>\n<p>新舊科名可註明以便對照舊教材。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>以考試前已可取得的 96 年農業統計年報為歷史口徑，排除「其他」集合類目，前十大栽培面積作物中可任選以下五種。甘藍：十字花科 Brassicaceae，Brassica oleracea var. capitata，原產地中海沿岸歐洲，種植面積 8396 公頃；<\/p>\n<p>西瓜：葫蘆科 Cucurbitaceae，Citrullus lanatus，原產非洲，14198 公頃；<\/p>\n<p>蘿蔔：十字花科 Brassicaceae，Raphanus sativus，地中海至西亞起源說，東亞有重要多樣化，3204 公頃；<\/p>\n<p>青蔥：石蒜科 Amaryllidaceae（舊蔥科／百合科），Allium fistulosum，原產東亞，5226 公頃；<\/p>\n<p>番茄：茄科 Solanaceae，Solanum lycopersicum，南美安地斯起源、墨西哥馴化，3936 公頃。面積為當年統計量，不能以今日排名替代。<\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：五作物科、學名、原產地；歷史前十資格另核表。<\/p>\n<ul>\n<li><strong>五作物科<\/strong><\/li>\n<li><strong>原產地<\/strong><\/li>\n<li><strong>歷史前十資格另核表<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>看到地下器官就全部寫成根。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=30","md":"97年蔬菜學_逐題教學詳解.md","search":"主要五蔬菜科學名與原產 ## 第四題｜主要五蔬菜科學名與原產（15 分）\n\n### 題意與作答範圍\n\n本題重點：**主要五蔬菜科學名與原產**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=30)。\n\n### 先掌握答案\n\n以考試前已可取得的 96 年農業統計年報為歷史口徑，排除「其他」集合類目，前十大栽培面積作物中可任選以下五種。甘藍：十字花科 brassicaceae，brassica oleracea var. capitata，原產地中海沿岸歐洲，種植面積 8396 公頃；\n\n### 原理拆解：為什麼會這樣？\n\n**器官來源比外觀名稱更可靠**\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n**不同分類軸不能混用**\n\n花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。\n\n**名稱與例子要一對一**\n\n寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。\n\n### 這題要特別注意\n\n歷史面積已核對官方 96 年年報：[蘿蔔](https://eng.moa.gov.tw/upload/files/eng_web_structure/17853/046.pdf)、[青蔥](https://eng.moa.gov.tw/upload/files/eng_web_structure/17853/048.pdf)、[甘藍](https://eng.moa.gov.tw/upload/files/eng_web_structure/17853/056.pdf)、[番茄](https://eng.moa.gov.tw/upload/files/eng_web_structure/17853/064.pdf)、[西瓜](https://eng.moa.gov.tw/upload/files/eng_web_structure/17853/068.pdf)。\n\n學名、原產與統計品項是不同資訊，答案逐一對應；\n\n新舊科名可註明以便對照舊教材。\n\n### 可直接練寫的完整答案\n\n以考試前已可取得的 96 年農業統計年報為歷史口徑，排除「其他」集合類目，前十大栽培面積作物中可任選以下五種。甘藍：十字花科 brassicaceae，brassica oleracea var. capitata，原產地中海沿岸歐洲，種植面積 8396 公頃；\n\n西瓜：葫蘆科 cucurbitaceae，citrullus lanatus，原產非洲，14198 公頃；\n\n蘿蔔：十字花科 brassicaceae，raphanus sativus，地中海至西亞起源說，東亞有重要多樣化，3204 公頃；\n\n青蔥：石蒜科 amaryllidaceae（舊蔥科／百合科），allium fistulosum，原產東亞，5226 公頃；\n\n番茄：茄科 solanaceae，solanum lycopersicum，南美安地斯起源、墨西哥馴化，3936 公頃。面積為當年統計量，不能以今日排名替代。\n\n地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。\n\n### 實例：把原理用在情境中\n\n馬鈴薯雖在地下，薯塊有芽眼，屬莖塊莖；甘藷的肥大貯藏器官屬塊根。兩者都儲藏澱粉，不能因此判為相同器官。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：五作物科、學名、原產地；歷史前十資格另核表。\n\n- **五作物科**\n- **原產地**\n- **歷史前十資格另核表**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 看到地下器官就全部寫成根。\n 97 蔬菜學"},{"id":"蔬菜學-97-五","s":"蔬菜學","y":97,"n":"五","t":"常用生長調節劑","body":"<h2>第五題｜常用生長調節劑（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>常用生長調節劑<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=30\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>乙烯利於胡瓜幼苗適期促雌花；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先辨識限制產期的生理關卡<\/strong><\/p>\n<p>產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。<\/p>\n<p><strong>處理須在可反應的階段<\/strong><\/p>\n<p>同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。<\/p>\n<p><strong>移動花期之後仍有生產風險<\/strong><\/p>\n<p>非自然盛產期可能遇不利授粉、低光、高溫或病蟲，果實品質與產量不保證同步提高。完整答案應包含後續授粉、負載與採收安排，以及是否能以售價補償成本。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>乙烯利於胡瓜幼苗適期促雌花；<\/p>\n<p>GA 促芹菜葉柄伸長或番茄特殊條件坐果；<\/p>\n<p>生長素類於番茄花期促坐果／單為結果；<\/p>\n<p>MH 曾於洋蔥近成熟期抑貯藏萌芽；<\/p>\n<p>IBA 可用苗木／砧苗發根。說明施用部位、時期與目的，過量可畸形、落花及殘留，原理舉例不能代替現行登記核准。<\/p>\n<p>產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。<\/p>\n<p>同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>紅龍果適當品種可利用夜間照光調節開花，但仍須評估夜溫、花粉與授粉作業；有花並不等於必能達到預期果重與採收量。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：多類與具體菜例、時期及風險。<\/p>\n<ul>\n<li><strong>多類與具體菜例<\/strong><\/li>\n<li><strong>時期及風險<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將所有產調都解釋成解除休眠。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=30","md":"97年蔬菜學_逐題教學詳解.md","search":"常用生長調節劑 ## 第五題｜常用生長調節劑（10 分）\n\n### 題意與作答範圍\n\n本題重點：**常用生長調節劑**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=30)。\n\n### 先掌握答案\n\n乙烯利於胡瓜幼苗適期促雌花；\n\n### 原理拆解：為什麼會這樣？\n\n**先辨識限制產期的生理關卡**\n\n產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。\n\n**處理須在可反應的階段**\n\n同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。\n\n**移動花期之後仍有生產風險**\n\n非自然盛產期可能遇不利授粉、低光、高溫或病蟲，果實品質與產量不保證同步提高。完整答案應包含後續授粉、負載與採收安排，以及是否能以售價補償成本。\n\n### 可直接練寫的完整答案\n\n乙烯利於胡瓜幼苗適期促雌花；\n\nga 促芹菜葉柄伸長或番茄特殊條件坐果；\n\n生長素類於番茄花期促坐果／單為結果；\n\nmh 曾於洋蔥近成熟期抑貯藏萌芽；\n\niba 可用苗木／砧苗發根。說明施用部位、時期與目的，過量可畸形、落花及殘留，原理舉例不能代替現行登記核准。\n\n產期可能受芽休眠、成花、萌芽、授粉或果實發育速率限制。應先指出作物的限制，再選修剪、摘葉、光溫、水分或調節劑，不能只列操作名稱便當作原理。\n\n同一修剪在枝條成熟度或季節不同時，可能促營養梢，也可能促有花芽萌發。低溫與日長處理也有生理年齡要求；操作須以樹勢、葉齡、芽狀態與當地氣候調整。\n\n### 實例：把原理用在情境中\n\n紅龍果適當品種可利用夜間照光調節開花，但仍須評估夜溫、花粉與授粉作業；有花並不等於必能達到預期果重與採收量。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：多類與具體菜例、時期及風險。\n\n- **多類與具體菜例**\n- **時期及風險**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將所有產調都解釋成解除休眠。\n 97 蔬菜學"},{"id":"蔬菜學-97-六","s":"蔬菜學","y":97,"n":"六","t":"五名詞","body":"<h2>第六題｜五名詞（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=30\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Thermodormancy 高溫誘發休眠；<\/p>\n<p>inbred line 自交系，經多代自交選拔達相對純合一致；<\/p>\n<p>seed priming 種子引發，控制吸水啟代謝但不出胚根，再回乾或直接播；<\/p>\n<p>fertigation 灌溉施肥，肥溶於灌溉水精準供根；<\/p>\n<p>blanching culture 軟白栽培，遮光使食器低葉綠素與較嫩，如白蘆筍。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>發芽率、活力與壽命要分開<\/strong><\/p>\n<p>發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。<\/p>\n<p><strong>劣化涉及膜與修復能力<\/strong><\/p>\n<p>貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。<\/p>\n<p><strong>保存與檢測依種子特性選擇<\/strong><\/p>\n<p>耐乾燥的正貯型種子通常可適度乾燥、低溫與防潮保存；不耐乾燥的種子不能照抄同法。發芽試驗、加速老化、導電度或低溫試驗各反映不同面向，須選適合作物的條件與標準。<\/p>\n<p><strong>先理解水勢與膨壓<\/strong><\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p><strong>由缺水到減產的連鎖<\/strong><\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<p><strong>管理不是只問澆多少<\/strong><\/p>\n<p>應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Thermodormancy 高溫誘發休眠；<\/p>\n<p>inbred line 自交系，經多代自交選拔達相對純合一致；<\/p>\n<p>seed priming 種子引發，控制吸水啟代謝但不出胚根，再回乾或直接播；<\/p>\n<p>fertigation 灌溉施肥，肥溶於灌溉水精準供根；<\/p>\n<p>blanching culture 軟白栽培，遮光使食器低葉綠素與較嫩，如白蘆筍。<\/p>\n<p>發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>蔥種子貯藏後即使標準發芽率尚可，活力降低也可能使育苗出苗不整；先做活力或小規模出苗比較，比直接增加播種密度更能掌握苗數。<\/p>\n<p>旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：各 3 分，定義與使用例。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有未發芽種子都判為死亡，漏掉休眠。<\/li>\n<li>把有水等同根一定能吸到水。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=30","md":"97年蔬菜學_逐題教學詳解.md","search":"五名詞 ## 第六題｜五名詞（15 分）\n\n### 題意與作答範圍\n\n本題重點：**五名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=30)。\n\n### 先掌握答案\n\nthermodormancy 高溫誘發休眠；\n\ninbred line 自交系，經多代自交選拔達相對純合一致；\n\nseed priming 種子引發，控制吸水啟代謝但不出胚根，再回乾或直接播；\n\nfertigation 灌溉施肥，肥溶於灌溉水精準供根；\n\nblanching culture 軟白栽培，遮光使食器低葉綠素與較嫩，如白蘆筍。\n\n### 原理拆解：為什麼會這樣？\n\n**發芽率、活力與壽命要分開**\n\n發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。\n\n**劣化涉及膜與修復能力**\n\n貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。\n\n**保存與檢測依種子特性選擇**\n\n耐乾燥的正貯型種子通常可適度乾燥、低溫與防潮保存；不耐乾燥的種子不能照抄同法。發芽試驗、加速老化、導電度或低溫試驗各反映不同面向，須選適合作物的條件與標準。\n\n**先理解水勢與膨壓**\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n**由缺水到減產的連鎖**\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n**管理不是只問澆多少**\n\n應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。\n\n### 可直接練寫的完整答案\n\nthermodormancy 高溫誘發休眠；\n\ninbred line 自交系，經多代自交選拔達相對純合一致；\n\nseed priming 種子引發，控制吸水啟代謝但不出胚根，再回乾或直接播；\n\nfertigation 灌溉施肥，肥溶於灌溉水精準供根；\n\nblanching culture 軟白栽培，遮光使食器低葉綠素與較嫩，如白蘆筍。\n\n發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。\n\n### 實例：把原理用在情境中\n\n蔥種子貯藏後即使標準發芽率尚可，活力降低也可能使育苗出苗不整；先做活力或小規模出苗比較，比直接增加播種密度更能掌握苗數。\n\n旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：各 3 分，定義與使用例。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有未發芽種子都判為死亡，漏掉休眠。\n- 把有水等同根一定能吸到水。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 97 蔬菜學"},{"id":"蔬菜學-97-七","s":"蔬菜學","y":97,"n":"七","t":"基因轉入四段翻譯","body":"<h2>第七題｜基因轉入四段翻譯（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>基因轉入四段翻譯<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=30\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。<\/p>\n<h3>完整參考譯文<\/h3>\n<p>1.以重組 DNA 為基礎的現代基因轉入技術正快速發展，為展現其經濟效用提供龐大機會。2.蔬菜應用包括增產、改變營養品質、提升抗病蟲與除草劑性，以及開發具療效價值食品。3.此外，優先研究目標還包括耐非生物逆境、生產力與固氮相關基因、利用雄不稔製造雜交種、延長貯藏壽命及改善外觀。<\/p>\n<p>4.在蔬菜中，馬鈴薯、番茄、茄子、椒類、胡瓜、花椰菜、甘藍與胡蘿蔔受到最多關注，尤其為病蟲、除草劑抗性與品質改良。<\/p>\n<h3>讀懂這段研究在說什麼<\/h3>\n<p><strong>四段列出技術、用途與優先研究目標<\/strong><\/p>\n<p>先保留重組 DNA 技術的發展與經濟潛力，再逐項翻出產量、營養、抗病蟲與其他目標。機會與潛力不等於已實現效益；抗除草劑與抗病是不同性狀，也不能把具有療效價值食品直接譯成已核准藥品。四段各自的主語與轉折不能省略。<\/p>\n<h3>專業詞彙與翻譯辨析<\/h3>\n<table>\n<thead>\n<tr>\n<th>英文用語<\/th>\n<th>建議譯法<\/th>\n<th>讀法與限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>stress<\/td>\n<td>逆境<\/td>\n<td>不利生長條件，依文意分生物或非生物<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>配分重點與檢查順序<\/h3>\n<p>20 分：每段 5 分，保持各應用分類；固氮為原文研究目標，不等於已完成所有菜固氮。<\/p>\n<p>先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。<\/p>\n<h3>常見失分<\/h3>\n<ul>\n<li>把專業名詞按一般字義翻譯，或把相關性改成因果。<\/li>\n<li>省略轉折、條件或限制，使研究結論比原文更強。<\/li>\n<li>以摘要取代全文翻譯。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=30","md":"97年蔬菜學_逐題教學詳解.md","search":"基因轉入四段翻譯 ## 第七題｜基因轉入四段翻譯（20 分）\n\n### 題意與作答範圍\n\n本題重點：**基因轉入四段翻譯**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=30)。\n\n### 先掌握答案\n\n這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。\n\n### 完整參考譯文\n\n1.以重組 dna 為基礎的現代基因轉入技術正快速發展，為展現其經濟效用提供龐大機會。2.蔬菜應用包括增產、改變營養品質、提升抗病蟲與除草劑性，以及開發具療效價值食品。3.此外，優先研究目標還包括耐非生物逆境、生產力與固氮相關基因、利用雄不稔製造雜交種、延長貯藏壽命及改善外觀。\n\n4.在蔬菜中，馬鈴薯、番茄、茄子、椒類、胡瓜、花椰菜、甘藍與胡蘿蔔受到最多關注，尤其為病蟲、除草劑抗性與品質改良。\n\n### 讀懂這段研究在說什麼\n\n**四段列出技術、用途與優先研究目標**\n\n先保留重組 dna 技術的發展與經濟潛力，再逐項翻出產量、營養、抗病蟲與其他目標。機會與潛力不等於已實現效益；抗除草劑與抗病是不同性狀，也不能把具有療效價值食品直接譯成已核准藥品。四段各自的主語與轉折不能省略。\n\n### 專業詞彙與翻譯辨析\n\n| 英文用語 | 建議譯法 | 讀法與限制 |\n| --- | --- | --- |\n| stress | 逆境 | 不利生長條件，依文意分生物或非生物 |\n\n### 配分重點與檢查順序\n\n20 分：每段 5 分，保持各應用分類；固氮為原文研究目標，不等於已完成所有菜固氮。\n\n先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。\n\n### 常見失分\n\n- 把專業名詞按一般字義翻譯，或把相關性改成因果。\n- 省略轉折、條件或限制，使研究結論比原文更強。\n- 以摘要取代全文翻譯。\n 97 蔬菜學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
