ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 6 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"果樹學-112-一","s":"果樹學","y":112,"n":"一","t":"名詞翻譯與解釋","body":"<h2>第一題｜名詞翻譯與解釋（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>名詞翻譯與解釋<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A112.pdf#page=1\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>(1)必要元素與有益元素：前者缺乏便無法完成生活史、作用不可替代，且直接參與代謝或結構；<\/p>\n<p>後者只對某些種類或特定環境有益，如矽、鈉。<\/p>\n<p>(2)共質體／質外體運輸：前者經胞質及胞間連絲；<\/p>\n<p>後者經細胞壁、胞間隙等膜外連續體。<\/p>\n<p>(3)嫁接／空中壓條：前者把接穗與砧木接合，後者令仍連母株的枝條在環剝、包介質處生根後切離。<\/p>\n<p>(4)強制通風冷卻／真空冷卻：前者以壓差迫使冷空氣穿過包裝；<\/p>\n<p>後者減壓使組織表面水分蒸發吸熱。<\/p>\n<p>(5)呼吸溫度係數 Q10＝R(T+10)/R(T)；<\/p>\n<p>呼吸商 RQ＝產生 CO₂ 莫耳量／消耗 O₂ 莫耳量。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>第一步是分清吸收、運輸與需求<\/strong><\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<p><strong>用新老葉位置推理<\/strong><\/p>\n<p>容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。<\/p>\n<p><strong>最後必須用適當樣本驗證<\/strong><\/p>\n<p>依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。<\/p>\n<p><strong>幼嫩組織必須有能量來源<\/strong><\/p>\n<p>細胞分裂、離子吸收及生合成都需要 ATP，幼果並不因體積小就停止呼吸。討論呼吸資料須區分單位重量呼吸率、單果總量、淨氣體交換與檢測極限。<\/p>\n<p><strong>量測到零不代表生理上不存在<\/strong><\/p>\n<p>光下固定 CO₂ 可能抵銷呼吸釋放，儀器不夠靈敏或計算基準不同也會使數值近零。應檢查暗測或光測、鮮重與時間單位、空白校正及組織是否活體，而不是直接接受不合理結論。<\/p>\n<p><strong>呼吸高峰需連同成熟階段解釋<\/strong><\/p>\n<p>更年性果實的成熟呼吸上升與自催化乙烯有關，但單見呼吸上升仍須排除傷害、溫度或病原。非更年性不等於不呼吸，也不等於完全不對乙烯產生任何反應。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>(1)必要元素與有益元素：前者缺乏便無法完成生活史、作用不可替代，且直接參與代謝或結構；<\/td>\n<td>判準不只是組織裡測得到，而是缺乏即妨礙完成生活史、作用不可替代並直接參與生理功能。 對部分物種或條件有益，不代表對所有高等植物都符合必要性判準。<\/td>\n<\/tr>\n<tr>\n<td>(2)共質體／質外體運輸：前者經胞質及胞間連絲；<\/td>\n<td>質外體路徑遇到選擇性膜界面時仍須跨膜運輸，不能理解為糖可一路無限制穿過所有組織。 胞間連絲連通活細胞細胞質，與細胞壁及細胞間隙的質外體路徑不同。<\/td>\n<\/tr>\n<tr>\n<td>呼吸商 RQ＝產生 CO₂ 莫耳量／消耗 O₂ 莫耳量。<\/td>\n<td>RQ＝放出 CO₂ 莫耳數／消耗 O₂ 莫耳數；它是比例，不能作為呼吸強度的同義詞。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>這題要特別注意<\/h3>\n<p>真空預冷容易造成失水，通常較適於高表面積葉菜；<\/p>\n<p>RQ 不是呼吸量，糖有氧呼吸約為 1。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>(1)必要元素與有益元素：前者缺乏便無法完成生活史、作用不可替代，且直接參與代謝或結構；<\/p>\n<p>後者只對某些種類或特定環境有益，如矽、鈉。<\/p>\n<p>(2)共質體／質外體運輸：前者經胞質及胞間連絲；<\/p>\n<p>後者經細胞壁、胞間隙等膜外連續體。<\/p>\n<p>(3)嫁接／空中壓條：前者把接穗與砧木接合，後者令仍連母株的枝條在環剝、包介質處生根後切離。<\/p>\n<p>(4)強制通風冷卻／真空冷卻：前者以壓差迫使冷空氣穿過包裝；<\/p>\n<p>後者減壓使組織表面水分蒸發吸熱。<\/p>\n<p>(5)呼吸溫度係數 Q10＝R(T+10)/R(T)；<\/p>\n<p>呼吸商 RQ＝產生 CO₂ 莫耳量／消耗 O₂ 莫耳量。<\/p>\n<p>營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；pH、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。<\/p>\n<p>木瓜幼果若測得淨 CO₂ 釋放接近零，先比較暗中量測與光下量測，再確認是每克還是每果；不能據此斷言幼果不需要能量。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：五組各 4 分，先翻譯再比較作用；Q10、RQ 列式。<\/p>\n<ul>\n<li><strong>五組各 4 分，先翻譯再比較作用<\/strong><\/li>\n<li><strong>Q10<\/strong><\/li>\n<li><strong>RQ 列式<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>只寫缺肥會黃葉，沒有指出葉齡與黃化分布。<\/li>\n<li>把淨交換為零寫成粒線體停止代謝。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../A112.pdf#page=1","md":"112年果樹學_逐題教學詳解.md","search":"名詞翻譯與解釋 ## 第一題｜名詞翻譯與解釋（20 分）\n\n### 題意與作答範圍\n\n本題重點：**名詞翻譯與解釋**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a112.pdf#page=1)。\n\n### 先掌握答案\n\n(1)必要元素與有益元素：前者缺乏便無法完成生活史、作用不可替代，且直接參與代謝或結構；\n\n後者只對某些種類或特定環境有益，如矽、鈉。\n\n(2)共質體／質外體運輸：前者經胞質及胞間連絲；\n\n後者經細胞壁、胞間隙等膜外連續體。\n\n(3)嫁接／空中壓條：前者把接穗與砧木接合，後者令仍連母株的枝條在環剝、包介質處生根後切離。\n\n(4)強制通風冷卻／真空冷卻：前者以壓差迫使冷空氣穿過包裝；\n\n後者減壓使組織表面水分蒸發吸熱。\n\n(5)呼吸溫度係數 q10＝r(t+10)/r(t)；\n\n呼吸商 rq＝產生 co₂ 莫耳量／消耗 o₂ 莫耳量。\n\n### 原理拆解：為什麼會這樣？\n\n**第一步是分清吸收、運輸與需求**\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n**用新老葉位置推理**\n\n容易由老葉再移動的元素，如氮、鉀與鎂，缺乏時常先犧牲老葉；難再移動的鐵、鈣等，常先影響幼葉或新生器官。還需分脈間黃化、葉緣壞死或均勻失綠，才能縮小候選範圍。\n\n**最後必須用適當樣本驗證**\n\n依作物固定葉齡、枝位、季節與結果狀態，多株採代表樣；病症與正常對照分開，避免噴肥與泥土污染。診斷應把組織、土壤、水質與根系資料放在一起，排除病害、鹽害與生長稀釋，才決定施肥。\n\n**幼嫩組織必須有能量來源**\n\n細胞分裂、離子吸收及生合成都需要 atp，幼果並不因體積小就停止呼吸。討論呼吸資料須區分單位重量呼吸率、單果總量、淨氣體交換與檢測極限。\n\n**量測到零不代表生理上不存在**\n\n光下固定 co₂ 可能抵銷呼吸釋放，儀器不夠靈敏或計算基準不同也會使數值近零。應檢查暗測或光測、鮮重與時間單位、空白校正及組織是否活體，而不是直接接受不合理結論。\n\n**呼吸高峰需連同成熟階段解釋**\n\n更年性果實的成熟呼吸上升與自催化乙烯有關，但單見呼吸上升仍須排除傷害、溫度或病原。非更年性不等於不呼吸，也不等於完全不對乙烯產生任何反應。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| (1)必要元素與有益元素：前者缺乏便無法完成生活史、作用不可替代，且直接參與代謝或結構； | 判準不只是組織裡測得到，而是缺乏即妨礙完成生活史、作用不可替代並直接參與生理功能。 對部分物種或條件有益，不代表對所有高等植物都符合必要性判準。 |\n| (2)共質體／質外體運輸：前者經胞質及胞間連絲； | 質外體路徑遇到選擇性膜界面時仍須跨膜運輸，不能理解為糖可一路無限制穿過所有組織。 胞間連絲連通活細胞細胞質，與細胞壁及細胞間隙的質外體路徑不同。 |\n| 呼吸商 rq＝產生 co₂ 莫耳量／消耗 o₂ 莫耳量。 | rq＝放出 co₂ 莫耳數／消耗 o₂ 莫耳數；它是比例，不能作為呼吸強度的同義詞。 |\n\n### 這題要特別注意\n\n真空預冷容易造成失水，通常較適於高表面積葉菜；\n\nrq 不是呼吸量，糖有氧呼吸約為 1。\n\n### 可直接練寫的完整答案\n\n(1)必要元素與有益元素：前者缺乏便無法完成生活史、作用不可替代，且直接參與代謝或結構；\n\n後者只對某些種類或特定環境有益，如矽、鈉。\n\n(2)共質體／質外體運輸：前者經胞質及胞間連絲；\n\n後者經細胞壁、胞間隙等膜外連續體。\n\n(3)嫁接／空中壓條：前者把接穗與砧木接合，後者令仍連母株的枝條在環剝、包介質處生根後切離。\n\n(4)強制通風冷卻／真空冷卻：前者以壓差迫使冷空氣穿過包裝；\n\n後者減壓使組織表面水分蒸發吸熱。\n\n(5)呼吸溫度係數 q10＝r(t+10)/r(t)；\n\n呼吸商 rq＝產生 co₂ 莫耳量／消耗 o₂ 莫耳量。\n\n營養元素必須以可吸收形式到達根或葉表，再跨膜進入組織。總土壤含量、有效態與植物組織含量並不相同；ph、氧化還原、吸附沉澱及離子競爭都可造成供應瓶頸。\n\n### 實例：把原理用在情境中\n\n老葉脈間黃化與幼葉脈間黃化，外觀同樣「黃」，卻分別較支持缺鎂與缺鐵。這正是元素移動性有助判讀、但仍不能替代分析的例子。\n\n木瓜幼果若測得淨 co₂ 釋放接近零，先比較暗中量測與光下量測，再確認是每克還是每果；不能據此斷言幼果不需要能量。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：五組各 4 分，先翻譯再比較作用；q10、rq 列式。\n\n- **五組各 4 分，先翻譯再比較作用**\n- **q10**\n- **rq 列式**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 只寫缺肥會黃葉，沒有指出葉齡與黃化分布。\n- 把淨交換為零寫成粒線體停止代謝。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 112 果樹學"},{"id":"果樹學-112-二","s":"果樹學","y":112,"n":"二","t":"鳳梨中國市場禁輸與保鮮障礙","body":"<h2>第二題｜鳳梨中國市場禁輸與保鮮障礙（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>鳳梨中國市場禁輸與保鮮障礙<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A112.pdf#page=1\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>歷史事件應以 2021 年公告為背景：中國方面所述理由為檢出有害生物（介殼蟲等），屬檢疫爭議。採後障礙包括果實與冠芽藏蟲、成熟度不一、冠芽失水、擦壓傷、腐敗及低溫誘發內部褐化／黑心。改善採前整合防治與清園、適熟採收、精選清潔、包裝防傷、迅速建立適合品種的冷鏈，並以經驗證且目的國接受的檢疫處理及監測確保合規。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>為何採後仍會變差<\/strong><\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p><strong>低溫有效，但有適用範圍<\/strong><\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<p><strong>把全程串起來<\/strong><\/p>\n<p>採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。<\/p>\n<p><strong>先建立可預防的栽培條件<\/strong><\/p>\n<p>健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。<\/p>\n<p><strong>監測後再選處理<\/strong><\/p>\n<p>定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。<\/p>\n<p><strong>整合與追蹤效果<\/strong><\/p>\n<p>不同手段應互相相容，保護天敵並避免抗藥性累積。處理後確認受害是否降低，保存用藥、環境與採收紀錄；有機生產也須依規範使用資材，並不代表可以省略病蟲管理。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>要區分「輸入檢疫原因」與「果肉品質問題」，冷藏本身不能解決所有害蟲。禁輸為題目當年情境，不把它寫成永久現況。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>歷史事件應以 2021 年公告為背景：中國方面所述理由為檢出有害生物（介殼蟲等），屬檢疫爭議。採後障礙包括果實與冠芽藏蟲、成熟度不一、冠芽失水、擦壓傷、腐敗及低溫誘發內部褐化／黑心。改善採前整合防治與清園、適熟採收、精選清潔、包裝防傷、迅速建立適合品種的冷鏈，並以經驗證且目的國接受的檢疫處理及監測確保合規。<\/p>\n<p>離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。<\/p>\n<p>降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。<\/p>\n<p>番茄管理可由健康苗、防蟲設施與田間監測降低媒介昆蟲傳播病毒的機會；已感染植株的處置與媒介控制須配合，不能只噴一次藥便認定病毒消失。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：歷史禁輸理由、品質與檢疫障礙、各對策；不套現行永久禁令。<\/p>\n<ul>\n<li><strong>歷史禁輸理由<\/strong><\/li>\n<li><strong>品質與檢疫障礙<\/strong><\/li>\n<li><strong>各對策<\/strong><\/li>\n<li><strong>不套現行永久禁令<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>認為溫度越低、保存效果一定越好。<\/li>\n<li>把有機栽培理解成完全不防治。<\/li>\n<\/ul>","source":"../../A112.pdf#page=1","md":"112年果樹學_逐題教學詳解.md","search":"鳳梨中國市場禁輸與保鮮障礙 ## 第二題｜鳳梨中國市場禁輸與保鮮障礙（15 分）\n\n### 題意與作答範圍\n\n本題重點：**鳳梨中國市場禁輸與保鮮障礙**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a112.pdf#page=1)。\n\n### 先掌握答案\n\n歷史事件應以 2021 年公告為背景：中國方面所述理由為檢出有害生物（介殼蟲等），屬檢疫爭議。採後障礙包括果實與冠芽藏蟲、成熟度不一、冠芽失水、擦壓傷、腐敗及低溫誘發內部褐化／黑心。改善採前整合防治與清園、適熟採收、精選清潔、包裝防傷、迅速建立適合品種的冷鏈，並以經驗證且目的國接受的檢疫處理及監測確保合規。\n\n### 原理拆解：為什麼會這樣？\n\n**為何採後仍會變差**\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n**低溫有效，但有適用範圍**\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n**把全程串起來**\n\n採收成熟度、預冷、包裝、冷庫、運輸、通關和貨架期必須一起設計。高相對濕度可減少失水，但表面凝水會增加腐敗；包裝保濕也必須讓產品有足夠氣體交換。混櫃還需檢查溫度、濕度、乙烯敏感性與最長耐運時間是否相容。\n\n**先建立可預防的栽培條件**\n\n健康苗、抗性品種、適地適期、合理密度、灌排與清園可降低病蟲建立機會。輪作須確認不是共同寄主，設施防蟲網也需兼顧通風，措施應有明確針對對象。\n\n**監測後再選處理**\n\n定期查病蟲種類、密度與分布，區分病原、蟲害與生理障礙，再選物理、生物或合規化學措施。把缺鈣、鹽害等生理問題當病害噴藥，通常不能解決根因。\n\n**整合與追蹤效果**\n\n不同手段應互相相容，保護天敵並避免抗藥性累積。處理後確認受害是否降低，保存用藥、環境與採收紀錄；有機生產也須依規範使用資材，並不代表可以省略病蟲管理。\n\n### 這題要特別注意\n\n要區分「輸入檢疫原因」與「果肉品質問題」，冷藏本身不能解決所有害蟲。禁輸為題目當年情境，不把它寫成永久現況。\n\n### 可直接練寫的完整答案\n\n歷史事件應以 2021 年公告為背景：中國方面所述理由為檢出有害生物（介殼蟲等），屬檢疫爭議。採後障礙包括果實與冠芽藏蟲、成熟度不一、冠芽失水、擦壓傷、腐敗及低溫誘發內部褐化／黑心。改善採前整合防治與清園、適熟採收、精選清潔、包裝防傷、迅速建立適合品種的冷鏈，並以經驗證且目的國接受的檢疫處理及監測確保合規。\n\n離開母株的果蔬仍是活組織，會呼吸消耗糖與有機酸，蒸散造成失水，部分產品也會產生或回應乙烯。產品不再得到母株穩定供應，原有貯藏物和水分逐步減少，因此採後處理的功能主要是延緩損耗，不能把原先不合格果恢復成高品質。\n\n降低溫度通常減慢呼吸、衰老與病原生長；然而熱帶產品若低於其安全溫度而放置過久，膜與代謝會受損，出現凹陷、褐化、後熟異常等寒害。寒害可在回溫後才明顯，與組織結冰的凍害不同。\n\n### 實例：把原理用在情境中\n\n驗證海運方案時，應模擬「船期＋通關＋到貨販售」，到貨後再觀察能否正常後熟、是否產生異味與腐敗。只證明冷庫內外觀正常，不能證明到市場仍有商品價值。\n\n番茄管理可由健康苗、防蟲設施與田間監測降低媒介昆蟲傳播病毒的機會；已感染植株的處置與媒介控制須配合，不能只噴一次藥便認定病毒消失。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：歷史禁輸理由、品質與檢疫障礙、各對策；不套現行永久禁令。\n\n- **歷史禁輸理由**\n- **品質與檢疫障礙**\n- **各對策**\n- **不套現行永久禁令**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 認為溫度越低、保存效果一定越好。\n- 把有機栽培理解成完全不防治。\n 112 果樹學"},{"id":"果樹學-112-三","s":"果樹學","y":112,"n":"三","t":"中部設施葡萄優缺點","body":"<h2>第三題｜中部設施葡萄優缺點（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>中部設施葡萄優缺點<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A112.pdf#page=1\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>優點為避雨、降低裂果和雨傳病害、提高商品率、利於提早或延後產期、較能控制肥水與作業。缺點為設施與維護成本高、夏季高溫和通風不足、遮光影響著色與花芽分化、鹽分累積、蟲蟎及特定病害、颱風結構風險。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>設施先改變能量與物質交換<\/strong><\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p><strong>各因子必須一起管理<\/strong><\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<p><strong>控制成效要用植株與環境資料驗證<\/strong><\/p>\n<p>以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。<\/p>\n<p><strong>花序在新梢，結果能力卻與芽的過去有關<\/strong><\/p>\n<p>葡萄新梢由結果母枝上的芽萌發，芽內花序原基常已在之前的枝梢生長期間形成。修剪改變芽的萌發機會，因此產期安排要先確認枝條與芽成熟度，不能把修剪當成憑空製造花芽。<\/p>\n<p><strong>一年二收需要兩次完整資源循環<\/strong><\/p>\n<p>冬剪後萌芽開花取得第一期果；採後保健康葉、適量補水肥，恢復貯藏並培養下一期成熟枝，再夏剪萌芽取得第二期。若第一期負載過大或葉片早落，第二期即使萌芽也可能花弱、著果差或糖低。<\/p>\n<p><strong>促成與二收各有環境限制<\/strong><\/p>\n<p>春果促成靠保溫設施與提早萌芽，使低溫季仍能發育；冬果則要防秋冬光熱不足。兩者均需疏梢、整穗及葉果比管理，日期依品種、產區與設施倒推，不宜用一個月份表套全臺。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>品質改善來自環境穩定；<\/p>\n<p>若忽略通風與透光，也會因設施而變差。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>優點為避雨、降低裂果和雨傳病害、提高商品率、利於提早或延後產期、較能控制肥水與作業。缺點為設施與維護成本高、夏季高溫和通風不足、遮光影響著色與花芽分化、鹽分累積、蟲蟎及特定病害、颱風結構風險。<\/p>\n<p>覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。<\/p>\n<p>增加光照而不供水可能加劇失水，提高 CO₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 CO₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。<\/p>\n<p>同一園連續兩期採滿量而不保留健康葉，短期總採收似多，卻可能使翌期枝條與花芽變差；合理負載應看跨季樹勢與商品果率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：優缺兩面，各至少三點並連生理品質。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將溫室直接等同低溫環境。<\/li>\n<li>以為剪枝本身就使任何芽都能帶花。<\/li>\n<\/ul>","source":"../../A112.pdf#page=1","md":"112年果樹學_逐題教學詳解.md","search":"中部設施葡萄優缺點 ## 第三題｜中部設施葡萄優缺點（10 分）\n\n### 題意與作答範圍\n\n本題重點：**中部設施葡萄優缺點**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a112.pdf#page=1)。\n\n### 先掌握答案\n\n優點為避雨、降低裂果和雨傳病害、提高商品率、利於提早或延後產期、較能控制肥水與作業。缺點為設施與維護成本高、夏季高溫和通風不足、遮光影響著色與花芽分化、鹽分累積、蟲蟎及特定病害、颱風結構風險。\n\n### 原理拆解：為什麼會這樣？\n\n**設施先改變能量與物質交換**\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n**各因子必須一起管理**\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n**控制成效要用植株與環境資料驗證**\n\n以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。\n\n**花序在新梢，結果能力卻與芽的過去有關**\n\n葡萄新梢由結果母枝上的芽萌發，芽內花序原基常已在之前的枝梢生長期間形成。修剪改變芽的萌發機會，因此產期安排要先確認枝條與芽成熟度，不能把修剪當成憑空製造花芽。\n\n**一年二收需要兩次完整資源循環**\n\n冬剪後萌芽開花取得第一期果；採後保健康葉、適量補水肥，恢復貯藏並培養下一期成熟枝，再夏剪萌芽取得第二期。若第一期負載過大或葉片早落，第二期即使萌芽也可能花弱、著果差或糖低。\n\n**促成與二收各有環境限制**\n\n春果促成靠保溫設施與提早萌芽，使低溫季仍能發育；冬果則要防秋冬光熱不足。兩者均需疏梢、整穗及葉果比管理，日期依品種、產區與設施倒推，不宜用一個月份表套全臺。\n\n### 這題要特別注意\n\n品質改善來自環境穩定；\n\n若忽略通風與透光，也會因設施而變差。\n\n### 可直接練寫的完整答案\n\n優點為避雨、降低裂果和雨傳病害、提高商品率、利於提早或延後產期、較能控制肥水與作業。缺點為設施與維護成本高、夏季高溫和通風不足、遮光影響著色與花芽分化、鹽分累積、蟲蟎及特定病害、颱風結構風險。\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n### 實例：把原理用在情境中\n\n臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。\n\n同一園連續兩期採滿量而不保留健康葉，短期總採收似多，卻可能使翌期枝條與花芽變差；合理負載應看跨季樹勢與商品果率。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：優缺兩面，各至少三點並連生理品質。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將溫室直接等同低溫環境。\n- 以為剪枝本身就使任何芽都能帶花。\n 112 果樹學"},{"id":"果樹學-112-四","s":"果樹學","y":112,"n":"四","t":"四種果樹生長調節劑","body":"<h2>第四題｜四種果樹生長調節劑（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>四種果樹生長調節劑<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A112.pdf#page=1\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>鳳梨：乙烯利（ethephon）釋放乙烯誘導開花。葡萄：GA₃ 依品種與花期前後處理，誘導無子化及促進果粒膨大。蘋果：NAA 等在適期疏果，或依用途防採前落果。梨：GA₃／GA₄₊₇ 等依品種促進著果或果實膨大。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>激素作用依器官與時期改變<\/strong><\/p>\n<p>生長素、吉貝素、細胞分裂素、乙烯與 ABA 均有多重功能；相同物質在不同濃度、器官和時期可能呈不同結果。必須用「作物＋物質＋時期＋目的」完整描述，不能只列藥名。<\/p>\n<p><strong>外施處理是在改變既有訊號系統<\/strong><\/p>\n<p>生長素可用於促不定根，也可能依條件疏果或減落果；GA 可促伸長、果粒膨大或調整種子發育；乙烯可誘導鳳梨開花，亦可能加速敏感花卉衰老。作用不能跨作物無條件推論。<\/p>\n<p><strong>生產應以核准用途與小量驗證為準<\/strong><\/p>\n<p>濃度、吸收量、天氣與施用位置會影響效果及藥害。考題可以說明機制，但不應從教材例子直接推定所有地區皆核准使用；回答時仍應保留品種、適期與合法用途的條件。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>同一藥劑因時期、濃度而有不同效果，作答需寫用途；<\/p>\n<p>此為生理學舉例，田間應用依合法登記使用。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>鳳梨：乙烯利（ethephon）釋放乙烯誘導開花。葡萄：GA₃ 依品種與花期前後處理，誘導無子化及促進果粒膨大。蘋果：NAA 等在適期疏果，或依用途防採前落果。梨：GA₃／GA₄₊₇ 等依品種促進著果或果實膨大。<\/p>\n<p>生長素、吉貝素、細胞分裂素、乙烯與 ABA 均有多重功能；相同物質在不同濃度、器官和時期可能呈不同結果。必須用「作物＋物質＋時期＋目的」完整描述，不能只列藥名。<\/p>\n<p>生長素可用於促不定根，也可能依條件疏果或減 n<p>定植前先測土壤 pH、肥力、土層、排水及灌溉水，清除多年生雜草與病根；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<p><strong>產量要以單位土地和有效葉面積看<\/strong><\/p>\n<p>大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。<\/p>\n<p><strong>整枝、修剪和負載互相制約<\/strong><\/p>\n<p>整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。<\/p>\n<p><strong>矮化與密植的效益有條件<\/strong><\/p>\n<p>矮砧、低幹與細長冠可早形成土地有效葉面積、方便作業，且減大型骨架消耗；但過密仍會陰蔽、著色差與病害。支架、灌溉、疏果及持續更新是技術成本，不應只列早產優點。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>坡地首要是排水與保土，不宜全面翻裸土；<\/p>\n<p>施肥不可讓濃肥直接接觸幼根。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>定植前先測土壤 pH、肥力、土層、排水及灌溉水，清除多年生雜草與病根；<\/p>\n<p>規劃等高線、作業道、防風、排水和土壤保持，改善硬盤與有機質，按檢測結果調整酸度。選適地低需冷品種與健康砧木苗，確認授粉需求、花期與市場；<\/p>\n<p>依樹勢配置行株距與授粉樹。定植時避梅雨與極端熱乾，穴深配合根系、不埋嫁接部；<\/p>\n<p>根向外舒展、分層覆土壓實、充分灌水、立支柱並覆蓋保濕；<\/p>\n<p>定幹整形、標示品種，初期防風、防草和保護根域。<\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<p>矮砧蘋果密植常可提高早期每公頃產量，即使單株產量較低；若後期冠層封閉卻不調枝，早期優勢會被陰蔽與品質下降抵銷。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：定植前調查規劃、坡地保土灌排、品種砧木及定植程序。<\/p>\n<ul>\n<li><strong>定植前調查規劃<\/strong><\/li>\n<li><strong>坡地保土灌排<\/strong><\/li>\n<li><strong>品種砧木及定植程序<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<li>把修剪一律理解為越重越好。<\/li>\n<\/ul>","source":"../../A112.pdf#page=1","md":"112年果樹學_逐題教學詳解.md","search":"東勢緩坡地建立低需冷桃園 ## 第五題｜東勢緩坡地建立低需冷桃園（15 分）\n\n### 題意與作答範圍\n\n本題重點：**東勢緩坡地建立低需冷桃園**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a112.pdf#page=1)。\n\n### 先掌握答案\n\n定植前先測土壤 ph、肥力、土層、排水及灌溉水，清除多年生雜草與病根；\n\n### 原理拆解：為什麼會這樣？\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n**產量要以單位土地和有效葉面積看**\n\n大樹不一定比小冠密植高產，因為冠內葉片可能長期受陰。產量與品質取決土地截光、光分布、葉片利用效率，以及同化物分給果實的比例；單株產量與每公頃產量必須分別討論。\n\n**整枝、修剪和負載互相制約**\n\n整枝建立骨架與結果部位，修剪移除特定枝芽葉，拉枝改變角度與優勢，疏果降低庫競爭。操作須保留足量健康葉；過重剪雖降低高度，卻會減供碳並促旺梢，不保證提高當期花果。\n\n**矮化與密植的效益有條件**\n\n矮砧、低幹與細長冠可早形成土地有效葉面積、方便作業，且減大型骨架消耗；但過密仍會陰蔽、著色差與病害。支架、灌溉、疏果及持續更新是技術成本，不應只列早產優點。\n\n### 這題要特別注意\n\n坡地首要是排水與保土，不宜全面翻裸土；\n\n施肥不可讓濃肥直接接觸幼根。\n\n### 可直接練寫的完整答案\n\n定植前先測土壤 ph、肥力、土層、排水及灌溉水，清除多年生雜草與病根；\n\n規劃等高線、作業道、防風、排水和土壤保持，改善硬盤與有機質，按檢測結果調整酸度。選適地低需冷品種與健康砧木苗，確認授粉需求、花期與市場；\n\n依樹勢配置行株距與授粉樹。定植時避梅雨與極端熱乾，穴深配合根系、不埋嫁接部；\n\n根向外舒展、分層覆土壓實、充分灌水、立支柱並覆蓋保濕；\n\n定幹整形、標示品種，初期防風、防草和保護根域。\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n### 實例：把原理用在情境中\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n矮砧蘋果密植常可提高早期每公頃產量，即使單株產量較低；若後期冠層封閉卻不調枝，早期優勢會被陰蔽與品質下降抵銷。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：定植前調查規劃、坡地保土灌排、品種砧木及定植程序。\n\n- **定植前調查規劃**\n- **坡地保土灌排**\n- **品種砧木及定植程序**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將連作障礙全部歸因於缺肥。\n- 把修剪一律理解為越重越好。\n 112 果樹學"},{"id":"果樹學-112-六","s":"果樹學","y":112,"n":"六","t":"荔枝焦核、平地獼猴桃與自根苗","body":"<h2>第六題｜荔枝焦核、平地獼猴桃與自根苗（30 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>荔枝焦核、平地獼猴桃與自根苗<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../A112.pdf#page=1\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>(1)糯米糍受精後胚發育停止形成焦核；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先問有沒有受精<\/strong><\/p>\n<p>單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。<\/p>\n<p><strong>為何沒有正常種子仍能結果<\/strong><\/p>\n<p>正常發育種子會提供或誘導支持子房生長的激素訊號。遺傳性單為結果或外施調節劑可在缺乏受精時提供相似支持；種子敗育型則可能在初期已建立足以使果實繼續生長的條件。<\/p>\n<p><strong>無子化與膨大必須分開思考<\/strong><\/p>\n<p>有子葡萄的無子化須依品種、花期以合適處理影響種子形成，花後可能另需促果粒膨大。時機錯誤會落果、穗軸或果粒異常；不能給一個濃度宣稱適用所有葡萄。無融合生殖是無正常有性受精而產胚，仍可有種子，並非同義詞。<\/p>\n<p><strong>用限制來源分類<\/strong><\/p>\n<p>相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。<\/p>\n<p><strong>冬天的冷與春天的暖做不同工作<\/strong><\/p>\n<p>有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。<\/p>\n<p><strong>技術必須對應真正瓶頸<\/strong><\/p>\n<p>摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>焦核是種子發育問題，獼猴桃則要分別回答開花整齊與授粉結實，兩者不能混為一因。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>(1)糯米糍受精後胚發育停止形成焦核；<\/p>\n<p>胚敗育比例受品種、授粉組合與花期環境影響。維持適中樹勢、適量疏果與肥水，挑選可提高焦核比例但仍能穩定著果的授粉組合；<\/p>\n<p>不能以破壞授粉或施高濃度藥劑保證焦核。<\/p>\n<p>(2)常見溫帶獼猴桃在海拔 50 m 以下冬季需冷不足，休眠解除不完全而開花不齊；<\/p>\n<p>多數雌雄異株，花器正常仍可能因缺雄株、花期不合、花粉不足或昆蟲少而結實不良，夏季熱害亦不利。<\/p>\n<p>(3)自根苗是根與地上部同屬自身個體、非藉另一砧木生長者；<\/p>\n<p>包括實生苗如木瓜、扦插苗如葡萄、壓條苗如荔枝。分株及組培亦可形成自根苗，題目「三大類」可按實生、扦插、壓條作答，分類口徑須說明。<\/p>\n<p>單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>栽培香蕉可用作單為結果例，許多無子葡萄作種子敗育例；柑橘珠心胚說明無融合生殖可產生帶胚種子，三者不能互換。<\/p>\n<p>平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>30 分：焦核 9、獼猴桃 9、自根苗 12；成花與受精分答、三苗類各一例。<\/p>\n<ul>\n<li><strong>焦核 9<\/strong><\/li>\n<li><strong>獼猴桃 9<\/strong><\/li>\n<li><strong>自根苗 12<\/strong><\/li>\n<li><strong>成花與受精分答<\/strong><\/li>\n<li><strong>三苗類各一例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有無子葡萄都說成未曾受精。<\/li>\n<li>把需冷不足與萌芽後霜害混為同一問題。<\/li>\n<\/ul>","source":"../../A112.pdf#page=1","md":"112年果樹學_逐題教學詳解.md","search":"荔枝焦核、平地獼猴桃與自根苗 ## 第六題｜荔枝焦核、平地獼猴桃與自根苗（30 分）\n\n### 題意與作答範圍\n\n本題重點：**荔枝焦核、平地獼猴桃與自根苗**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../a112.pdf#page=1)。\n\n### 先掌握答案\n\n(1)糯米糍受精後胚發育停止形成焦核；\n\n### 原理拆解：為什麼會這樣？\n\n**先問有沒有受精**\n\n單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。\n\n**為何沒有正常種子仍能結果**\n\n正常發育種子會提供或誘導支持子房生長的激素訊號。遺傳性單為結果或外施調節劑可在缺乏受精時提供相似支持；種子敗育型則可能在初期已建立足以使果實繼續生長的條件。\n\n**無子化與膨大必須分開思考**\n\n有子葡萄的無子化須依品種、花期以合適處理影響種子形成，花後可能另需促果粒膨大。時機錯誤會落果、穗軸或果粒異常；不能給一個濃度宣稱適用所有葡萄。無融合生殖是無正常有性受精而產胚，仍可有種子，並非同義詞。\n\n**用限制來源分類**\n\n相關休眠的抑制來自芽外，如頂芽優勢；內生休眠來自芽自身，即使外面適宜仍難萌；環境休眠則是芽已有能力，但外界低溫或缺水限制。三者不能以落葉與否判斷，也不必在同株所有芽同時發生。\n\n**冬天的冷與春天的暖做不同工作**\n\n有效低溫累積可逐漸解除內生休眠，稱滿足需冷；解除後，芽仍須合適環境及一定熱量才能萌發。因此短暫暖冬回溫可能促進已滿冷的芽，卻無法補救尚未滿足需冷的芽。\n\n**技術必須對應真正瓶頸**\n\n摘心只能解除相關抑制，不能保證解除內生休眠；低需冷品種與冷地花芽穗可用來適應暖地，但花芽後續仍需合適熱量與授粉。成花誘導的低溫反應也不宜直接與落葉果樹的芽休眠需冷完全畫等號。\n\n### 這題要特別注意\n\n焦核是種子發育問題，獼猴桃則要分別回答開花整齊與授粉結實，兩者不能混為一因。\n\n### 可直接練寫的完整答案\n\n(1)糯米糍受精後胚發育停止形成焦核；\n\n胚敗育比例受品種、授粉組合與花期環境影響。維持適中樹勢、適量疏果與肥水，挑選可提高焦核比例但仍能穩定著果的授粉組合；\n\n不能以破壞授粉或施高濃度藥劑保證焦核。\n\n(2)常見溫帶獼猴桃在海拔 50 m 以下冬季需冷不足，休眠解除不完全而開花不齊；\n\n多數雌雄異株，花器正常仍可能因缺雄株、花期不合、花粉不足或昆蟲少而結實不良，夏季熱害亦不利。\n\n(3)自根苗是根與地上部同屬自身個體、非藉另一砧木生長者；\n\n包括實生苗如木瓜、扦插苗如葡萄、壓條苗如荔枝。分株及組培亦可形成自根苗，題目「三大類」可按實生、扦插、壓條作答，分類口徑須說明。\n\n單為結果不需要受精便使子房發育；有些完全不需授粉，有些需授粉刺激但仍不完成受精。種子敗育型則曾受精，後來胚或胚乳發育失敗，因此常留種痕。分類看發育過程，不是只看成熟果有沒有硬種。\n\n### 實例：把原理用在情境中\n\n栽培香蕉可用作單為結果例，許多無子葡萄作種子敗育例；柑橘珠心胚說明無融合生殖可產生帶胚種子，三者不能互換。\n\n平地高接梨把已在冷地完成所需低溫的花芽穗帶到暖地，利用當地較早回暖開花結果；不是讓高需冷芽在低地神奇地不再需要低溫。\n\n### 配分重點：哪些內容不能漏？\n\n30 分：焦核 9、獼猴桃 9、自根苗 12；成花與受精分答、三苗類各一例。\n\n- **焦核 9**\n- **獼猴桃 9**\n- **自根苗 12**\n- **成花與受精分答**\n- **三苗類各一例**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有無子葡萄都說成未曾受精。\n- 把需冷不足與萌芽後霜害混為同一問題。\n 112 果樹學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
