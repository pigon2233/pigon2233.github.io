ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 7 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"蔬菜學-106-一","s":"蔬菜學","y":106,"n":"一","t":"寒害蔬菜、症狀與管理","body":"<h2>第一題｜寒害蔬菜、症狀與管理（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>寒害蔬菜、症狀與管理<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=3\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>胡瓜、苦瓜、茄子、番茄等暖季菜在低於其適溫、尚未結冰時可寒害，表現出苗慢、葉片水浸斑或失綠壞死、萎凋、根吸收下降、落花著果差；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先區分傷害種類與發生條件<\/strong><\/p>\n<p>乾旱、淹水、高溫、寒害、凍害與鹽害的起始機制不同。寒害可在冰點以上發生於敏感作物，凍害則涉及結冰；淹水即使土壤水多，也可能因缺氧而使根無法正常供水。<\/p>\n<p><strong>從細胞功能連到可見症狀<\/strong><\/p>\n<p>膜性質改變、活性氧增加、酵素與能量代謝受阻，最後表現萎凋、褐化、落花或生長停滯。短期氣孔關閉可節水，長期卻限制 CO₂ 吸收；適應反應與傷害結果應分別說明。<\/p>\n<p><strong>預防與恢復管理各有時機<\/strong><\/p>\n<p>品種與產季選擇、灌排、覆蓋、通風遮陰及適度馴化可降低風險。受害後先評估根與生長點是否存活，再調整水肥；重施肥不能代替環境修復，受傷根系也可能無法利用增加的養分。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>胡瓜、苦瓜、茄子、番茄等暖季菜在低於其適溫、尚未結冰時可寒害，表現出苗慢、葉片水浸斑或失綠壞死、萎凋、根吸收下降、落花著果差；<\/p>\n<p>果實採後也可能凹斑褐化。選耐寒材料與適季播種、保溫育苗、隧道／不織布覆蓋、防風與根域管理，冷後先恢復根活力、勿立即濃肥。<\/p>\n<p>乾旱、淹水、高溫、寒害、凍害與鹽害的起始機制不同。寒害可在冰點以上發生於敏感作物，凍害則涉及結冰；淹水即使土壤水多，也可能因缺氧而使根無法正常供水。<\/p>\n<p>膜性質改變、活性氧增加、酵素與能量代謝受阻，最後表現萎凋、褐化、落花或生長停滯。短期氣孔關閉可節水，長期卻限制 CO₂ 吸收；適應反應與傷害結果應分別說明。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>熱帶果菜低溫貯藏後可能出現凹陷、褐化與腐敗，而未曾結冰；應檢查該作物安全溫度與累積暴露時間，不能只把冷庫調得更冷。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：作物例、葉根花果症狀、低溫機制與預防。<\/p>\n<ul>\n<li><strong>作物例<\/strong><\/li>\n<li><strong>葉根花果症狀<\/strong><\/li>\n<li><strong>低溫機制與預防<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把寒害與凍害當成同義詞。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=3","md":"106年蔬菜學_逐題教學詳解.md","search":"寒害蔬菜、症狀與管理 ## 第一題｜寒害蔬菜、症狀與管理（15 分）\n\n### 題意與作答範圍\n\n本題重點：**寒害蔬菜、症狀與管理**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=3)。\n\n### 先掌握答案\n\n胡瓜、苦瓜、茄子、番茄等暖季菜在低於其適溫、尚未結冰時可寒害，表現出苗慢、葉片水浸斑或失綠壞死、萎凋、根吸收下降、落花著果差；\n\n### 原理拆解：為什麼會這樣？\n\n**先區分傷害種類與發生條件**\n\n乾旱、淹水、高溫、寒害、凍害與鹽害的起始機制不同。寒害可在冰點以上發生於敏感作物，凍害則涉及結冰；淹水即使土壤水多，也可能因缺氧而使根無法正常供水。\n\n**從細胞功能連到可見症狀**\n\n膜性質改變、活性氧增加、酵素與能量代謝受阻，最後表現萎凋、褐化、落花或生長停滯。短期氣孔關閉可節水，長期卻限制 co₂ 吸收；適應反應與傷害結果應分別說明。\n\n**預防與恢復管理各有時機**\n\n品種與產季選擇、灌排、覆蓋、通風遮陰及適度馴化可降低風險。受害後先評估根與生長點是否存活，再調整水肥；重施肥不能代替環境修復，受傷根系也可能無法利用增加的養分。\n\n### 可直接練寫的完整答案\n\n胡瓜、苦瓜、茄子、番茄等暖季菜在低於其適溫、尚未結冰時可寒害，表現出苗慢、葉片水浸斑或失綠壞死、萎凋、根吸收下降、落花著果差；\n\n果實採後也可能凹斑褐化。選耐寒材料與適季播種、保溫育苗、隧道／不織布覆蓋、防風與根域管理，冷後先恢復根活力、勿立即濃肥。\n\n乾旱、淹水、高溫、寒害、凍害與鹽害的起始機制不同。寒害可在冰點以上發生於敏感作物，凍害則涉及結冰；淹水即使土壤水多，也可能因缺氧而使根無法正常供水。\n\n膜性質改變、活性氧增加、酵素與能量代謝受阻，最後表現萎凋、褐化、落花或生長停滯。短期氣孔關閉可節水，長期卻限制 co₂ 吸收；適應反應與傷害結果應分別說明。\n\n### 實例：把原理用在情境中\n\n熱帶果菜低溫貯藏後可能出現凹陷、褐化與腐敗，而未曾結冰；應檢查該作物安全溫度與累積暴露時間，不能只把冷庫調得更冷。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：作物例、葉根花果症狀、低溫機制與預防。\n\n- **作物例**\n- **葉根花果症狀**\n- **低溫機制與預防**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把寒害與凍害當成同義詞。\n 106 蔬菜學"},{"id":"蔬菜學-106-二","s":"蔬菜學","y":106,"n":"二","t":"四土壤問題","body":"<h2>第二題｜四土壤問題（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>四土壤問題<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=3\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>過酸：Al/Mn 毒害、Ca/Mg 缺及磷固定，分析後石灰改良；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<p><strong>氮為何促進營養生長<\/strong><\/p>\n<p>氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。<\/p>\n<p><strong>吸收氮不等於已同化<\/strong><\/p>\n<p>根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 GS/GOGAT 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。<\/p>\n<p><strong>形式、總量與時期一起決定結果<\/strong><\/p>\n<p>銨態並非不好，但根域容量小、緩衝弱時，過量銨容易酸化、毒害及拮抗鈣鉀鎂。果實期又須避免過氮徒長、陰蔽與品質下降。因此應依土水、光量、生育需求分次施肥，而不是只選一個氮形式就認為問題解決。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>過酸：Al/Mn 毒害、Ca/Mg 缺及磷固定，分析後石灰改良；<\/p>\n<p>過氮：徒長、硝酸鹽、品質與病害，按需分次、減氮並提高光利用；<\/p>\n<p>有機質不足：結構與保水保肥差，用成熟堆肥、綠肥與保土；<\/p>\n<p>土傳病害：病原累積傷根，健康苗、輪作、抗病砧木、清園及適當消毒。每項先確診，再選措施，不能用同一種肥料解決四者。<\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<p>番茄結果後期若高氨加上灌溉不穩，果端鈣供應更易失衡；改硝態為主仍須同時控制總氮、供水與根活力，才能有效降低風險。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：各 5 分，對生長影響、機制與具體改善。<\/p>\n<ul>\n<li><strong>各 5 分，對生長影響<\/strong><\/li>\n<li><strong>機制與具體改善<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<li>把硝酸鹽累積說成所有氮都完全不能被利用。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=3","md":"106年蔬菜學_逐題教學詳解.md","search":"四土壤問題 ## 第二題｜四土壤問題（20 分）\n\n### 題意與作答範圍\n\n本題重點：**四土壤問題**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=3)。\n\n### 先掌握答案\n\n過酸：al/mn 毒害、ca/mg 缺及磷固定，分析後石灰改良；\n\n### 原理拆解：為什麼會這樣？\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n**氮為何促進營養生長**\n\n氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。\n\n**吸收氮不等於已同化**\n\n根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 gs/gogat 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。\n\n**形式、總量與時期一起決定結果**\n\n銨態並非不好，但根域容量小、緩衝弱時，過量銨容易酸化、毒害及拮抗鈣鉀鎂。果實期又須避免過氮徒長、陰蔽與品質下降。因此應依土水、光量、生育需求分次施肥，而不是只選一個氮形式就認為問題解決。\n\n### 可直接練寫的完整答案\n\n過酸：al/mn 毒害、ca/mg 缺及磷固定，分析後石灰改良；\n\n過氮：徒長、硝酸鹽、品質與病害，按需分次、減氮並提高光利用；\n\n有機質不足：結構與保水保肥差，用成熟堆肥、綠肥與保土；\n\n土傳病害：病原累積傷根，健康苗、輪作、抗病砧木、清園及適當消毒。每項先確診，再選措施，不能用同一種肥料解決四者。\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n### 實例：把原理用在情境中\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n番茄結果後期若高氨加上灌溉不穩，果端鈣供應更易失衡；改硝態為主仍須同時控制總氮、供水與根活力，才能有效降低風險。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：各 5 分，對生長影響、機制與具體改善。\n\n- **各 5 分，對生長影響**\n- **機制與具體改善**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將連作障礙全部歸因於缺肥。\n- 把硝酸鹽累積說成所有氮都完全不能被利用。\n 106 蔬菜學"},{"id":"蔬菜學-106-三","s":"蔬菜學","y":106,"n":"三","t":"品種與 F1 純度鑑定","body":"<h2>第三題｜品種與 F1 純度鑑定（16 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>品種與 F1 純度鑑定<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=3\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>栽培品種是經人選育、具可辨識且能適當繁殖維持特徵的植物群。F1 純度可用田間／溫室 grow-out 比對形態，生化同工酶及 SSR、SNP 等 DNA 鑑定親本與雜交型，配合種子抽樣與留樣。形態費時且受環境影響，分子法快但需可區分親本的有效標誌；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>F1 一致性來自親本與受控交配<\/strong><\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<p><strong>制種須阻止不需要的授粉<\/strong><\/p>\n<p>去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。<\/p>\n<p><strong>F2 分離是留種限制的主因<\/strong><\/p>\n<p>F1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。<\/p>\n<p><strong>標誌提供基因型線索<\/strong><\/p>\n<p>分子標誌是可檢測的 DNA 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 MAS 與基因轉殖的操作與法規概念不同。<\/p>\n<p><strong>連鎖不等於永遠不分離<\/strong><\/p>\n<p>若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。<\/p>\n<p><strong>回交可兼顧前景與背景選拔<\/strong><\/p>\n<p>前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。MAS 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>栽培品種是經人選育、具可辨識且能適當繁殖維持特徵的植物群。F1 純度可用田間／溫室 grow-out 比對形態，生化同工酶及 SSR、SNP 等 DNA 鑑定親本與雜交型，配合種子抽樣與留樣。形態費時且受環境影響，分子法快但需可區分親本的有效標誌；<\/p>\n<p>發芽率與純度是不同指標。<\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<p>去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>西瓜 F1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 F1 果實留種所得下一代，不能保證維持原果形與整齊性。<\/p>\n<p>抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>16 分：品種定義、至少三檢法、原理及優缺。<\/p>\n<ul>\n<li><strong>品種定義<\/strong><\/li>\n<li><strong>至少三檢法<\/strong><\/li>\n<li><strong>原理及優缺<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>寫成 F1 種子完全不能發芽。<\/li>\n<li>把分子標誌說成施用後使植物產生抗性的藥劑。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=3","md":"106年蔬菜學_逐題教學詳解.md","search":"品種與 f1 純度鑑定 ## 第三題｜品種與 f1 純度鑑定（16 分）\n\n### 題意與作答範圍\n\n本題重點：**品種與 f1 純度鑑定**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=3)。\n\n### 先掌握答案\n\n栽培品種是經人選育、具可辨識且能適當繁殖維持特徵的植物群。f1 純度可用田間／溫室 grow-out 比對形態，生化同工酶及 ssr、snp 等 dna 鑑定親本與雜交型，配合種子抽樣與留樣。形態費時且受環境影響，分子法快但需可區分親本的有效標誌；\n\n### 原理拆解：為什麼會這樣？\n\n**f1 一致性來自親本與受控交配**\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n**制種須阻止不需要的授粉**\n\n去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。\n\n**f2 分離是留種限制的主因**\n\nf1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。\n\n**標誌提供基因型線索**\n\n分子標誌是可檢測的 dna 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 mas 與基因轉殖的操作與法規概念不同。\n\n**連鎖不等於永遠不分離**\n\n若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。\n\n**回交可兼顧前景與背景選拔**\n\n前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。mas 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。\n\n### 可直接練寫的完整答案\n\n栽培品種是經人選育、具可辨識且能適當繁殖維持特徵的植物群。f1 純度可用田間／溫室 grow-out 比對形態，生化同工酶及 ssr、snp 等 dna 鑑定親本與雜交型，配合種子抽樣與留樣。形態費時且受環境影響，分子法快但需可區分親本的有效標誌；\n\n發芽率與純度是不同指標。\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。\n\n### 實例：把原理用在情境中\n\n西瓜 f1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 f1 果實留種所得下一代，不能保證維持原果形與整齊性。\n\n抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。\n\n### 配分重點：哪些內容不能漏？\n\n16 分：品種定義、至少三檢法、原理及優缺。\n\n- **品種定義**\n- **至少三檢法**\n- **原理及優缺**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 寫成 f1 種子完全不能發芽。\n- 把分子標誌說成施用後使植物產生抗性的藥劑。\n 106 蔬菜學"},{"id":"蔬菜學-106-四","s":"蔬菜學","y":106,"n":"四","t":"番茄四生理異常","body":"<h2>第四題｜番茄四生理異常（12 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>番茄四生理異常<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=3\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>落花常因高低溫、花粉活力與供碳不足，亦受水分逆境；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>四症狀的共同點與差別<\/strong><\/p>\n<p>落花主要涉及花粉與同化物不足，開窗果涉及早期花器分化，花序回春涉及生殖與營養分化平衡，空洞果涉及授粉後種子與胎座發育。雖都可能受溫度與營養影響，發生時間和受影響器官不同；管理必須對應到花芽分化期、開花期或幼果期，不能用同一種催果處理概括。<\/p>\n<p><strong>授粉、種子與果實膨大互相連結<\/strong><\/p>\n<p>適當花粉發育、花藥開裂與授粉受精提供正常種子及激素訊號，支援胎座與果肉發育。高低溫或其他逆境可在不同階段造成落花、畸形或空洞；果實看似膨大也不保證內部組織正常。<\/p>\n<p><strong>營養生長不能無限制與果實競爭<\/strong><\/p>\n<p>整枝、摘心與適當去葉可調整株型、通風及後期無效果實，但葉是同化供源。過氮促旺梢，過度去葉則減供碳並暴露果面；需以花序位置、葉果比和目標採收期安排。<\/p>\n<p><strong>水熱與根域決定品質風險<\/strong><\/p>\n<p>均勻供水、適量鈣與良好根系有助減少局部缺鈣風險；突然大量供水可能增加裂果。高溫影響花粉與色素形成，適度通風遮陰須兼顧每日光積量，不能只靠催熟或催果處理解決所有問題。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>落花常因高低溫、花粉活力與供碳不足，亦受水分逆境；<\/p>\n<p>開窗果 catface 為花器分化期低溫等引起心皮與花痕異常，品種敏感與高氮可加劇；<\/p>\n<p>花序回春為已生殖分化的花序又出營養芽葉，常與環境和營養失衡有關；<\/p>\n<p>空洞果由授粉受精不足、種子與膠質胎座發育差，果皮仍膨大形成空隙。<\/p>\n<p>落花主要涉及花粉與同化物不足，開窗果涉及早期花器分化，花序回春涉及生殖與營養分化平衡，空洞果涉及授粉後種子與胎座發育。雖都可能受溫度與營養影響，發生時間和受影響器官不同；管理必須對應到花芽分化期、開花期或幼果期，不能用同一種催果處理概括。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>夏季番茄若落花且果面日燒，管理須同時改善花期高溫、保留健康遮蔭葉與均勻供水；只施生長素促果，未必改善授粉、內部品質或日燒。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>12 分：每小題 3 分，明確器官與成因，catface 不等同裂果。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將所有果實異常都判為同一種缺素。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=3","md":"106年蔬菜學_逐題教學詳解.md","search":"番茄四生理異常 ## 第四題｜番茄四生理異常（12 分）\n\n### 題意與作答範圍\n\n本題重點：**番茄四生理異常**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=3)。\n\n### 先掌握答案\n\n落花常因高低溫、花粉活力與供碳不足，亦受水分逆境；\n\n### 原理拆解：為什麼會這樣？\n\n**四症狀的共同點與差別**\n\n落花主要涉及花粉與同化物不足，開窗果涉及早期花器分化，花序回春涉及生殖與營養分化平衡，空洞果涉及授粉後種子與胎座發育。雖都可能受溫度與營養影響，發生時間和受影響器官不同；管理必須對應到花芽分化期、開花期或幼果期，不能用同一種催果處理概括。\n\n**授粉、種子與果實膨大互相連結**\n\n適當花粉發育、花藥開裂與授粉受精提供正常種子及激素訊號，支援胎座與果肉發育。高低溫或其他逆境可在不同階段造成落花、畸形或空洞；果實看似膨大也不保證內部組織正常。\n\n**營養生長不能無限制與果實競爭**\n\n整枝、摘心與適當去葉可調整株型、通風及後期無效果實，但葉是同化供源。過氮促旺梢，過度去葉則減供碳並暴露果面；需以花序位置、葉果比和目標採收期安排。\n\n**水熱與根域決定品質風險**\n\n均勻供水、適量鈣與良好根系有助減少局部缺鈣風險；突然大量供水可能增加裂果。高溫影響花粉與色素形成，適度通風遮陰須兼顧每日光積量，不能只靠催熟或催果處理解決所有問題。\n\n### 可直接練寫的完整答案\n\n落花常因高低溫、花粉活力與供碳不足，亦受水分逆境；\n\n開窗果 catface 為花器分化期低溫等 留母莖後，葉狀枝光合補回碳源，才支援後續採筍。連續採收而不留足母莖會使根盤耗竭、筍細與產量下降。週年化是安排不同批次的採收與養株，不代表同株永不休養。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。<\/p>\n<p>臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：根盤貯藏、母莖光合、採留輪替、環境及避免耗竭。<\/p>\n<ul>\n<li><strong>根盤貯藏<\/strong><\/li>\n<li><strong>母莖光合<\/strong><\/li>\n<li><strong>採留輪替<\/strong><\/li>\n<li><strong>環境及避免耗竭<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把長距離糖運輸寫成主要沿木質部。<\/li>\n<li>將溫室直接等同低溫環境。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=3","md":"106年蔬菜學_逐題教學詳解.md","search":"蘆筍週年栽培 ## 第五題｜蘆筍週年栽培（15 分）\n\n### 題意與作答範圍\n\n本題重點：**蘆筍週年栽培**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=3)。\n\n### 先掌握答案\n\n利用多次採筍與留母莖輪替：成熟母莖葉狀枝光合、補充根盤貯藏，累積後可刈除老莖促新筍，再分批採收並適時留新母莖。配灌溉、水肥、土溫與病蟲管理，避免連續採到根盤耗竭。臺灣暖地可延長生長季，設施避雨與季節安排可增加供貨窗口，但非全年每日同量。\n\n### 原理拆解：為什麼會這樣？\n\n**採筍其實在動用地下貯藏**\n\n嫩筍尚無足量同化葉，其快速生長主要仰賴根盤貯藏；留母莖後，葉狀枝光合補回碳源，才支援後續採筍。連續採收而不留足母莖會使根盤耗竭、筍細與產量下降。週年化是安排不同批次的採收與養株，不代表同株永不休養。\n\n**先把源與庫接起來**\n\n成熟葉通常是淨輸出同化物的源，果實、幼芽及根等是利用或貯藏同化物的庫。糖由葉肉到小葉脈，經伴細胞—篩管裝載，沿葉柄、枝幹與果梗韌皮部運輸，到果實卸載再由果肉利用或存入液泡。\n\n**壓力流與跨膜運輸不是同一層次**\n\n源端糖裝載降低水勢，吸水建立較高膨壓；庫端卸糖降低壓力，形成長距離質流。共質體路徑走胞間連絲，質外體路徑需糖跨膜轉運；h⁺-atpase 建立電化學梯度，可支援 h⁺／蔗糖共運輸。\n\n**庫強決定競爭，不只看果實大小**\n\n庫強可概念化為庫大小乘單位活性，受細胞數、膨大、種子激素、維管連結及糖分解貯藏能力影響。其他果實與新梢亦競爭同化物；疏果能增加單果分配，但過度疏果降低總收量，需在品質與產量間取捨。\n\n**設施先改變能量與物質交換**\n\n覆蓋材料改變光量、光質、輻射與通風；避雨可降低葉面濕潤與部分病害，卻可能增加熱與濕度。說明設施效益時須指出控制的是哪項環境因子，以及該因子如何影響生長或商品品質。\n\n**各因子必須一起管理**\n\n增加光照而不供水可能加劇失水，提高 co₂ 而遇高溫或低光也難充分增產。通風可以降溫除濕，但會流失補充 co₂；遮陰可降輻射熱，也會減少光合。設備選擇是對限制因子與成本的整體調整。\n\n**控制成效要用植株與環境資料驗證**\n\n以葉溫、根域溫度、濕度、光量及品質記錄調整設定；空氣溫度不等於葉片溫度。病蟲隔離、結露管理與根域衛生仍須另行建立，不能以設施覆蓋代替全部栽培管理。\n\n### 可直接練寫的完整答案\n\n利用多次採筍與留母莖輪替：成熟母莖葉狀枝光合、補充根盤貯藏，累積後可刈除老莖促新筍，再分批採收並適時留新母莖。配灌溉、水肥、土溫與病蟲管理，避免連續採到根盤耗竭。臺灣暖地可延長生長季，設施避雨與季節安排可增加供貨窗口，但非全年每日同量。\n\n嫩筍尚無足量同化葉，其快速生長主要仰賴根盤貯藏；留母莖後，葉狀枝光合補回碳源，才支援後續採筍。連續採收而不留足母莖會使根盤耗竭、筍細與產量下降。週年化是安排不同批次的採收與養株，不代表同株永不休養。\n\n### 實例：把原理用在情境中\n\n同一樹上果實負載增加，若健康受光葉量不變，單果可分得的碳可能下降。這能解釋為何保葉、疏果與控制徒長枝，常比單獨追加「甜果肥」更重要。\n\n臺灣夏季溫室若僅關閉側窗，可能因通風不足而升溫；可依外氣濕度與作物耐熱性搭配遮陰、通風及蒸發冷卻，再用葉溫與成品品質確認效果。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：根盤貯藏、母莖光合、採留輪替、環境及避免耗竭。\n\n- **根盤貯藏**\n- **母莖光合**\n- **採留輪替**\n- **環境及避免耗竭**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把長距離糖運輸寫成主要沿木質部。\n- 將溫室直接等同低溫環境。\n 106 蔬菜學"},{"id":"蔬菜學-106-六","s":"蔬菜學","y":106,"n":"六","t":"四名詞","body":"<h2>第六題｜四名詞（12 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>四名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=3\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Ridging 培土／作畦，將土堆向植株基部或成畦以排水、支撐或遮光；<\/p>\n<p>side dressing 追肥／側施肥，在生長期於根旁分次供肥；<\/p>\n<p>thinning 間苗或疏果，去過密個體調資源；<\/p>\n<p>topping 打頂，去主蔓頂端控制伸長與分枝。例為青蔥培土增白、蔬菜側施追肥、蘿蔔間苗、番茄末花序上留葉打頂。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>激素作用依器官與時期改變<\/strong><\/p>\n<p>生長素、吉貝素、細胞分裂素、乙烯與 ABA 均有多重功能；相同物質在不同濃度、器官和時期可能呈不同結果。必須用「作物＋物質＋時期＋目的」完整描述，不能只列藥名。<\/p>\n<p><strong>外施處理是在改變既有訊號系統<\/strong><\/p>\n<p>生長素可用於促不定根，也可能依條件疏果或減落果；GA 可促伸長、果粒膨大或調整種子發育；乙烯可誘導鳳梨開花，亦可能加速敏感花卉衰老。作用不能跨作物無條件推論。<\/p>\n<p><strong>生產應以核准用途與小量驗證為準<\/strong><\/p>\n<p>濃度、吸收量、天氣與施用位置會影響效果及藥害。考題可以說明機制，但不應從教材例子直接推定所有地區皆核准使用；回答時仍應保留品種、適期與合法用途的條件。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Ridging 培土／作畦，將土堆向植株基部或成畦以排水、支撐或遮光；<\/p>\n<p>side dressing 追肥／側施肥，在生長期於根旁分次供肥；<\/p>\n<p>thinning 間苗或疏果，去過密個體調資源；<\/p>\n<p>topping 打頂，去主蔓頂端控制伸長與分枝。例為青蔥培土增白、蔬菜側施追肥、蘿蔔間苗、番茄末花序上留葉打頂。<\/p>\n<p>生長素、吉貝素、細胞分裂素、乙烯與 ABA 均有多重功能；相同物質在不同濃度、器官和時期可能呈不同結果。必須用「作物＋物質＋時期＋目的」完整描述，不能只列藥名。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>IBA 用於扦插促根，而 GA₃ 可用於適當葡萄品種的無子化及膨大；兩者處理部位與時期不同，不能因同屬調節劑便互換。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>12 分：每項 3 分，翻譯、目的與作物例。<\/p>\n<ul>\n<li><strong>每項 3 分，翻譯<\/strong><\/li>\n<li><strong>目的與作物例<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>只背某激素「促進生長」，不寫促進哪個器官或過程。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=3","md":"106年蔬菜學_逐題教學詳解.md","search":"四名詞 ## 第六題｜四名詞（12 分）\n\n### 題意與作答範圍\n\n本題重點：**四名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=3)。\n\n### 先掌握答案\n\nridging 培土／作畦，將土堆向植株基部或成畦以排水、支撐或遮光；\n\nside dressing 追肥／側施肥，在生長期於根旁分次供肥；\n\nthinning 間苗或疏果，去過密個體調資源；\n\ntopping 打頂，去主蔓頂端控制伸長與分枝。例為青蔥培土增白、蔬菜側施追肥、蘿蔔間苗、番茄末花序上留葉打頂。\n\n### 原理拆解：為什麼會這樣？\n\n**激素作用依器官與時期改變**\n\n生長素、吉貝素、細胞分裂素、乙烯與 aba 均有多重功能；相同物質在不同濃度、器官和時期可能呈不同結果。必須用「作物＋物質＋時期＋目的」完整描述，不能只列藥名。\n\n**外施處理是在改變既有訊號系統**\n\n生長素可用於促不定根，也可能依條件疏果或減落果；ga 可促伸長、果粒膨大或調整種子發育；乙烯可誘導鳳梨開花，亦可能加速敏感花卉衰老。作用不能跨作物無條件推論。\n\n**生產應以核准用途與小量驗證為準**\n\n濃度、吸收量、天氣與施用位置會影響效果及藥害。考題可以說明機制，但不應從教材例子直接推定所有地區皆核准使用；回答時仍應保留品種、適期與合法用途的條件。\n\n### 可直接練寫的完整答案\n\nridging 培土／作畦，將土堆向植株基部或成畦以排水、支撐或遮光；\n\nside dressing 追肥／側施肥，在生長期於根旁分次供肥；\n\nthinning 間苗或疏果，去過密個體調資源；\n\ntopping 打頂，去主蔓頂端控制伸長與分枝。例為青蔥培土增白、蔬菜側施追肥、蘿蔔間苗、番茄末花序上留葉打頂。\n\n生長素、吉貝素、細胞分裂素、乙烯與 aba 均有多重功能；相同物質在不同濃度、器官和時期可能呈不同結果。必須用「作物＋物質＋時期＋目的」完整描述，不能只列藥名。\n\n### 實例：把原理用在情境中\n\niba 用於扦插促根，而 ga₃ 可用於適當葡萄品種的無子化及膨大；兩者處理部位與時期不同，不能因同屬調節劑便互換。\n\n### 配分重點：哪些內容不能漏？\n\n12 分：每項 3 分，翻譯、目的與作物例。\n\n- **每項 3 分，翻譯**\n- **目的與作物例**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 只背某激素「促進生長」，不寫促進哪個器官或過程。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 106 蔬菜學"},{"id":"蔬菜學-106-七","s":"蔬菜學","y":106,"n":"七","t":"滴灌英文翻譯","body":"<h2>第七題｜滴灌英文翻譯（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>滴灌英文翻譯<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=3\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。<\/p>\n<h3>完整參考譯文<\/h3>\n<p>滴灌是一種局部灌溉技術，可把水分及溶解養分直接供給作物根部。相較其他灌溉方式，滴灌較節水，且有較高均勻度及施用效率。不同作物的多項研究已證實滴灌有助提高產量。胡瓜在整個發育週期常受生物與非生物逆境，導致產量及品質降低。玻璃溫室無土栽培者擔心水量可能未達植物生長的最適程度。因此，了解滴灌系統下胡瓜最佳生長所需的最適供水制度相當重要。<\/p>\n<h3>讀懂這段研究在說什麼<\/h3>\n<p><strong>灌溉技術與逆境的研究背景<\/strong><\/p>\n<p>這段先定義滴灌，再比較節水、均勻度與施用效率，最後引入胡瓜面臨的逆境。翻譯時須區分水分「供到哪裡」與「利用效率多高」；文中研究支持的增產效果不能翻成任何環境必然增產。生物逆境包括病蟲，非生物逆境包括水熱與鹽等，不能漏掉其中一類。<\/p>\n<h3>專業詞彙與翻譯辨析<\/h3>\n<table>\n<thead>\n<tr>\n<th>英文用語<\/th>\n<th>建議譯法<\/th>\n<th>讀法與限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>drip irrigation<\/td>\n<td>滴灌<\/td>\n<td>將水局部供至根域<\/td>\n<\/tr>\n<tr>\n<td>stress<\/td>\n<td>逆境<\/td>\n<td>不利生長條件，依文意分生物或非生物<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>配分重點與檢查順序<\/h3>\n<p>10 分：局部供水肥、均勻效率、逆境、研究最適供水而非水愈多愈好。<\/p>\n<p>先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。<\/p>\n<h3>常見失分<\/h3>\n<ul>\n<li>把專業名詞按一般字義翻譯，或把相關性改成因果。<\/li>\n<li>省略轉折、條件或限制，使研究結論比原文更強。<\/li>\n<li>以摘要取代全文翻譯。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=3","md":"106年蔬菜學_逐題教學詳解.md","search":"滴灌英文翻譯 ## 第七題｜滴灌英文翻譯（10 分）\n\n### 題意與作答範圍\n\n本題重點：**滴灌英文翻譯**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=3)。\n\n### 先掌握答案\n\n這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。\n\n### 完整參考譯文\n\n滴灌是一種局部灌溉技術，可把水分及溶解養分直接供給作物根部。相較其他灌溉方式，滴灌較節水，且有較高均勻度及施用效率。不同作物的多項研究已證實滴灌有助提高產量。胡瓜在整個發育週期常受生物與非生物逆境，導致產量及品質降低。玻璃溫室無土栽培者擔心水量可能未達植物生長的最適程度。因此，了解滴灌系統下胡瓜最佳生長所需的最適供水制度相當重要。\n\n### 讀懂這段研究在說什麼\n\n**灌溉技術與逆境的研究背景**\n\n這段先定義滴灌，再比較節水、均勻度與施用效率，最後引入胡瓜面臨的逆境。翻譯時須區分水分「供到哪裡」與「利用效率多高」；文中研究支持的增產效果不能翻成任何環境必然增產。生物逆境包括病蟲，非生物逆境包括水熱與鹽等，不能漏掉其中一類。\n\n### 專業詞彙與翻譯辨析\n\n| 英文用語 | 建議譯法 | 讀法與限制 |\n| --- | --- | --- |\n| drip irrigation | 滴灌 | 將水局部供至根域 |\n| stress | 逆境 | 不利生長條件，依文意分生物或非生物 |\n\n### 配分重點與檢查順序\n\n10 分：局部供水肥、均勻效率、逆境、研究最適供水而非水愈多愈好。\n\n先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。\n\n### 常見失分\n\n- 把專業名詞按一般字義翻譯，或把相關性改成因果。\n- 省略轉折、條件或限制，使研究結論比原文更強。\n- 以摘要取代全文翻譯。\n 106 蔬菜學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
