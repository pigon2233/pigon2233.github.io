<strong>十種無土植材及特性<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B113.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>泥炭 peat moss 保水保肥偏酸；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>根需要水，也需要氧<\/strong><\/p>\n<p>介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。<\/p>\n<p><strong>化學性質會改變肥培結果<\/strong><\/p>\n<p>pH 影響元素溶解與有效性，EC 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 EC 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；pH 與 EC 是不同指標，不能相互替代。<\/p>\n<p><strong>配方應可重複而且衛生<\/strong><\/p>\n<p>選擇穩定、無病原與雜草種子、粒徑一致的材料，混合後實測保水、通氣、pH 及 EC。泥炭、椰纖、樹皮等有機材料會分解或吸附養分；珍珠石等材料的作用也受比例與粒徑影響，配方必須搭配灌肥管理。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>性質須連結用途，不能僅寫中英文名稱。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>泥炭 peat moss 保水保肥偏酸；<\/p>\n<p>椰纖 coir 保水且較易再濕、須注意鹽；<\/p>\n<p>樹皮 bark 通氣良好、分解較慢；<\/p>\n<p>水苔 sphagnum moss 高保水；<\/p>\n<p>珍珠石 perlite 輕、低養分、增通氣；<\/p>\n<p>蛭石 vermiculite 保水及交換陽離子；<\/p>\n<p>岩棉 rockwool 均勻、需控制含水；<\/p>\n<p>浮石 pumice 穩定多孔；<\/p>\n<p>陶粒 expanded clay 耐用、粗孔多；<\/p>\n<p>炭化稻殼 carbonized rice hull 輕質通氣、pH 與 EC 須檢測。<\/p>\n<p>介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同一泥炭與珍珠石配方用於矮盆時，底部飽和區占比可能較高；若又照高盆的頻率灌水，根部缺氧風險便增加。應從盆器與水分實測修正，而非只換肥料。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：十種中英文及基本性質，材料特性與功能相連。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無土介質寫成完全不含有機物。<\/li>\n<\/ul>","source":"../../B113.pdf#page=2","md":"113年花卉學_逐題教學詳解.md","search":"十種無土植材及特性 ## 第一題｜十種無土植材及特性（10 分）\n\n### 題意與作答範圍\n\n本題重點：**十種無土植材及特性**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b113.pdf#page=2)。\n\n### 先掌握答案\n\n泥炭 peat moss 保水保肥偏酸；\n\n### 原理拆解：為什麼會這樣？\n\n**根需要水，也需要氧**\n\n介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。\n\n**化學性質會改變肥培結果**\n\nph 影響元素溶解與有效性，ec 反映可溶性鹽類總量，陽離子交換容量影響養分緩衝。高 ec 可能使根吸水困難，即使盆土潮濕也會出現生理乾旱；ph 與 ec 是不同指標，不能相互替代。\n\n**配方應可重複而且衛生**\n\n選擇穩定、無病原與雜草種子、粒徑一致的材料，混合後實測保水、通氣、ph 及 ec。泥炭、椰纖、樹皮等有機材料會分解或吸附養分；珍珠石等材料的作用也受比例與粒徑影響，配方必須搭配灌肥管理。\n\n### 這題要特別注意\n\n性質須連結用途，不能僅寫中英文名稱。\n\n### 可直接練寫的完整答案\n\n泥炭 peat moss 保水保肥偏酸；\n\n椰纖 coir 保水且較易再濕、須注意鹽；\n\n樹皮 bark 通氣良好、分解較慢；\n\n水苔 sphagnum moss 高保水；\n\n珍珠石 perlite 輕、低養分、增通氣；\n\n蛭石 vermiculite 保水及交換陽離子；\n\n岩棉 rockwool 均勻、需控制含水；\n\n浮石 pumice 穩定多孔；\n\n陶粒 expanded clay 耐用、粗孔多；\n\n炭化稻殼 carbonized rice hull 輕質通氣、ph 與 ec 須檢測。\n\n介質總孔隙由充水與充氣孔隙共同構成。細料增加保水未必增加有效供水；若長期飽和，根呼吸受阻，吸收能力反而下降。因此要依盆高、灌溉頻率與根系特性調配，不能單以原料名稱判斷好壞。\n\n### 實例：把原理用在情境中\n\n同一泥炭與珍珠石配方用於矮盆時，底部飽和區占比可能較高；若又照高盆的頻率灌水，根部缺氧風險便增加。應從盆器與水分實測修正，而非只換肥料。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：十種中英文及基本性質，材料特性與功能相連。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無土介質寫成完全不含有機物。\n 113 花卉學"},{"id":"花卉學-113-二","s":"花卉學","y":113,"n":"二","t":"五種株高調節方法","body":"<h2>第二題｜五種株高調節方法（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五種株高調節方法<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B113.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>①摘心破除頂端優勢，促側枝且降低主軸高度。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>株高由節數與節間共同決定<\/strong><\/p>\n<p>降低高度可能來自縮短節間、改變節數或頂芽生長。摘心改變頂端優勢並促側枝，生長抑制劑常影響 GA 路徑與伸長；兩者造成的株型和開花時程未必相同。<\/p>\n<p><strong>環境也會改變伸長訊號<\/strong><\/p>\n<p>過密弱光引起避陰伸長，適度增加光量與盆距可改善；負 DIF 指日溫低於夜溫，部分花卉節間伸長因此降低。DIF 是日夜溫差，不能把負 DIF 寫成整日低溫。<\/p>\n<p><strong>矮而健康才是商品目標<\/strong><\/p>\n<p>過度控水、控氮或藥劑會減根、延遲開花、縮小花朵或造成藥害。應衡量株高、分枝數、冠幅與花量，按品種及市場規格安排處理，並記錄後續恢復生長的情形。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>降低株高不等於全面抑制生物量，目標是株型緊湊、花數與品質合格。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>①摘心破除頂端優勢，促側枝且降低主軸高度。<\/p>\n<p>②用 GA 抑制劑減少節間伸長。<\/p>\n<p>③負 DIF（日溫低於夜溫）抑伸長。<\/p>\n<p>④提高適合光量、降低過密遮蔭，減少避陰伸長。<\/p>\n<p>⑤適度控水與氮、機械輕觸等控制伸長，但避免傷害與失去品質。<\/p>\n<p>降低高度可能來自縮短節間、改變節數或頂芽生長。摘心改變頂端優勢並促側枝，生長抑制劑常影響 GA 路徑與伸長；兩者造成的株型和開花時程未必相同。<\/p>\n<p>過密弱光引起避陰伸長，適度增加光量與盆距可改善；負 DIF 指日溫低於夜溫，部分花卉節間伸長因此降低。DIF 是日夜溫差，不能把負 DIF 寫成整日低溫。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>盆栽聖誕紅可搭配適當摘心、盆距及環境管理達成整齊冠形；若只大量施矮化劑，可能節間太短、株形僵硬而失去商品性。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：五法各 2 分，頂端優勢、GA、DIF、光及水肥機制。<\/p>\n<ul>\n<li><strong>五法各 2 分，頂端優勢<\/strong><\/li>\n<li><strong>DIF<\/strong><\/li>\n<li><strong>光及水肥機制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。 結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>切花仍活著，水、碳與衰老三者共同決定觀賞壽命。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>受品種、採切成熟度、碳水化合物、水分平衡、導管堵塞、乙烯、病原、溫濕度及機械傷影響。對策為適熟輕採、即時補水預冷、潔淨容器與剪口、去水下葉、適合糖與抑菌酸化液、冷鏈、高濕而不凝水、避果實與廢氣乙烯；<\/p>\n<p>敏感種類用核准抗乙烯措施。<\/p>\n<p>採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。<\/p>\n<p>潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：水、碳、乙烯、溫度病原各有對策。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把短時高濃度預措液與全程瓶插液視為相同用法。<\/li>\n<\/ul>","source":"../../B113.pdf#page=2","md":"113年花卉學_逐題教學詳解.md","search":"瓶插壽命因素與對策 ## 第三題｜瓶插壽命因素與對策（10 分）\n\n### 題意與作答範圍\n\n本題重點：**瓶插壽命因素與對策**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b113.pdf#page=2)。\n\n### 先掌握答案\n\n受品種、採切成熟度、碳水化合物、水分平衡、導管堵塞、乙烯、病原、溫濕度及機械傷影響。對策為適熟輕採、即時補水預冷、潔淨容器與剪口、去水下葉、適合糖與抑菌酸化液、冷鏈、高濕而不凝水、避果實與廢氣乙烯；\n\n### 原理拆解：為什麼會這樣？\n\n**切離後的水分與碳收支轉為赤字**\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n**不同處理各有明確功能**\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n**採收成熟度與溫度決定後續品質上限**\n\n過早採收雖便運輸，花蕾卻可能缺乏開放能力；過晚採則失去貯運時間。盡速移除田間熱，使用該花卉可耐的低溫並避免凝結水；熱帶花材須防寒害，不宜所有花都用同一冷藏設定。\n\n### 這題要特別注意\n\n切花仍活著，水、碳與衰老三者共同決定觀賞壽命。\n\n### 可直接練寫的完整答案\n\n受品種、採切成熟度、碳水化合物、水分平衡、導管堵塞、乙烯、病原、溫濕度及機械傷影響。對策為適熟輕採、即時補水預冷、潔淨容器與剪口、去水下葉、適合糖與抑菌酸化液、冷鏈、高濕而不凝水、避果實與廢氣乙烯；\n\n敏感種類用核准抗乙烯措施。\n\n採後失去根系供水，葉片與花器卻仍蒸散和呼吸。氣栓、切口微生物與導管阻塞會降低吸水；碳源不足則使花蕾開放不良。保鮮須同時處理失水、輸水受阻與能量消耗。\n\n潔淨用水、切口更新與適當酸化有助輸水；糖供呼吸與開花，抑菌成分降低污染，抗乙烯處理只對適當敏感材料有用。高糖若缺乏衛生控制，可能促進微生物，並非加糖越多越好。\n\n### 實例：把原理用在情境中\n\n百合可在適當顯色蕾期採收，搭配補水、潔淨與品種適用的保鮮處理；若蕾太幼小，即使瓶插液含糖，也未必恢復正常花朵大小與開放率。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：水、碳、乙烯、溫度病原各有對策。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把短時高濃度預措液與全程瓶插液視為相同用法。\n 113 花卉學"},{"id":"花卉學-113-四","s":"花卉學","y":113,"n":"四","t":"雜交育種步驟","body":"<h2>第四題｜雜交育種步驟（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>雜交育種步驟<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B113.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>訂目標→蒐集評估親本→設計配對與確認倍數性／親和性→花前去雄、套袋→適期採粉與授粉、標記→育果採種或胚救援→播種培育→評估分離後代→優株選拔與無性增殖→多季、多地及採後試驗→品種命名、保護與種苗量產。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先把育種目標寫成可測量性狀<\/strong><\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p><strong>創造變異與選出穩定材料是兩階段<\/strong><\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<p><strong>田間與商品試驗不能省略<\/strong><\/p>\n<p>分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>親本好不保證子代同時擁有優點，需足量後代與穩定性驗證。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>訂目標→蒐集評估親本→設計配對與確認倍數性／親和性→花前去雄、套袋→適期採粉與授粉、標記→育果採種或胚救援→播種培育→評估分離後代→優株選拔與無性增殖→多季、多地及採後試驗→品種命名、保護與種苗量產。<\/p>\n<p>抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。<\/p>\n<p>雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：目標親本→授粉→採種／胚救援→選拔試驗→量產完整流程。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把轉入基因成功直接等同育成可商業化品種。<\/li>\n<\/ul>","source":"../../B113.pdf#page=2","md":"113年花卉學_逐題教學詳解.md","search":"雜交育種步驟 ## 第四題｜雜交育種步驟（10 分）\n\n### 題意與作答範圍\n\n本題重點：**雜交育種步驟**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b113.pdf#page=2)。\n\n### 先掌握答案\n\n訂目標→蒐集評估親本→設計配對與確認倍數性／親和性→花前去雄、套袋→適期採粉與授粉、標記→育果採種或胚救援→播種培育→評估分離後代→優株選拔與無性增殖→多季、多地及採後試驗→品種命名、保護與種苗量產。\n\n### 原理拆解：為什麼會這樣？\n\n**先把育種目標寫成可測量性狀**\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n**創造變異與選出穩定材料是兩階段**\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n**田間與商品試驗不能省略**\n\n分子或培養室結果不能代替多環境試驗。應在目標季節與產區比較產量、品質、抗性和栽培成本，必要時再回交去除不良背景。新品系的登錄、繁殖純度與種苗供應也影響實際推廣。\n\n### 這題要特別注意\n\n親本好不保證子代同時擁有優點，需足量後代與穩定性驗證。\n\n### 可直接練寫的完整答案\n\n訂目標→蒐集評估親本→設計配對與確認倍數性／親和性→花前去雄、套袋→適期採粉與授粉、標記→育果採種或胚救援→播種培育→評估分離後代→優株選拔與無性增殖→多季、多地及採後試驗→品種命名、保護與種苗量產。\n\n抗病、品質、產量與環境適應常同時重要，但選拔方法不同。須先定義病原或逆境、品質指標及目標產區，再選有差異的親本；只說培育優良品種，無法說明如何選拔。\n\n雜交、誘變、倍數變化與基因工程提供不同變異來源；後續仍要確認目標性狀、農藝表現、遺傳穩定與不利連帶效應。有性後代會分離，無性增殖可保留選中的個體，但仍須評估體細胞變異。\n\n### 實例：把原理用在情境中\n\n導入抗病基因後，仍須在接種條件確認抗性，並比較果形、熟期與產量；若抗病供體帶入劣質性狀，可透過回交與選拔恢復商品背景。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：目標親本→授粉→採種／胚救援→選拔試驗→量產完整流程。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把轉入基因成功直接等同育成可商業化品種。\n 113 花卉學"},{"id":"花卉學-113-五","s":"花卉學","y":113,"n":"五","t":"三種嫁接及癒合原理","body":"<h2>第五題｜三種嫁接及癒合原理（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>三種嫁接及癒合原理<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B113.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>可舉切接、劈接、芽接。選健康親和砧穗、平整切面並至少一側形成層對準、綁紮保濕。傷口細胞產生癒傷組織，雙方癒傷橋連接，重新形成連續形成層並分化木質部、韌皮部，恢復水分與同化物輸送。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>形成層接觸是癒合的重要基礎<\/strong><\/p>\n<p>砧穗需健康且具親和性，切面平整並避免失水與污染。粗細不一致時至少對準一側形成層，不是只把木質部中心對在一起；綁紮須固定且不造成後續勒傷。<\/p>\n<p><strong>從癒傷橋到維管束連續<\/strong><\/p>\n<p>傷口附近細胞增生形成癒傷組織，接觸後建立連接，進一步形成連續形成層並分化新木質部與韌皮部，才逐漸恢復供水與同化物運輸。接穗短期萌芽可使用原存養分，不足以證明已成功癒合。<\/p>\n<p><strong>成功還包含長期親和性<\/strong><\/p>\n<p>砧木可影響樹勢、抗逆、礦養與成熟，但通常不會把接穗果實的基因型改成砧木品種。若有延遲不親和，早期成活後仍可能在接口或樹勢上出問題，須持續觀察。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>只長癒傷組織不等於嫁接成功，維管束能持續連通才是關鍵。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>可舉切接、劈接、芽接。選健康親和砧穗、平整切面並至少一側形成層對準、綁紮保濕。傷口細胞產生癒傷組織，雙方癒傷橋連接，重新形成連續形成層並分化木質部、韌皮部，恢復水分與同化物輸送。<\/p>\n<p>砧穗需健康且具親和性，切面平整並避免失水與污染。粗細不一致時至少對準一側形成層，不是只把木質部中心對在一起；綁紮須固定且不造成後續勒傷。<\/p>\n<p>傷口附近細胞增生形成癒傷組織，接觸後建立連接，進一步形成連續形成層並分化新木質部與韌皮部，才逐漸恢復供水與同化物運輸。接穗短期萌芽可使用原存養分，不足以證明已成功癒合。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>切接後接穗先抽芽但隨後萎凋，可能是儲藏養分暫時支持萌芽，維管束卻未充分連接；應回查形成層對準、保濕與砧穗親和。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：三接法、形成層、癒傷橋、維管束重建與親和。<\/p>\n<ul>\n<li><strong>三接法<\/strong><\/li>\n<li><strong>形成層<\/strong><\/li>\n<li><strong>癒傷橋<\/strong><\/li>\n<li><strong>維管束重建與親和<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>只對準髓部，忽略形成層。<\/li>\n<\/ul>","source":"../../B113.pdf#page=2","md":"113年花卉學_逐題教學詳解.md","search":"三種嫁接及癒合原理 ## 第五題｜三種嫁接及癒合原理（10 分）\n\n### 題意與作答範圍\n\n本題重點：**三種嫁接及癒合原理**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b113.pdf#page=2)。\n\n### 先掌握答案\n\n可舉切接、劈接、芽接。選健康親和砧穗、平整切面並至少一側形成層對準、綁紮保濕。傷口細胞產生癒傷組織，雙方癒傷橋連接，重新形成連續形成層並分化木質部、韌皮部，恢復水分與同化物輸送。\n\n### 原理拆解：為什麼會這樣？\n\n**形成層接觸是癒合的重要基礎**\n\n砧穗需健康且具親和性，切面平整並避免失水與污染。粗細不一致時至少對準一側形成層，不是只把木質部中心對在一起；綁紮須固定且不造成後續勒傷。\n\n**從癒傷橋到維管束連續**\n\n傷口附近細胞增生形成癒傷組織，接觸後建立連接，進一步形成連續形成層並分化新木質部與韌皮部，才逐漸恢復供水與同化物運輸。接穗短期萌芽可使用原存養分，不足以證明已成功癒合。\n\n**成功還包含長期親和性**\n\n砧木可影響樹勢、抗逆、礦養與成熟，但通常不會把接穗果實的基因型改成砧木品種。若有延遲不親和，早期成活後仍可能在接口或樹勢上出問題，須持續觀察。\n\n### 這題要特別注意\n\n只長癒傷組織不等於嫁接成功，維管束能持續連通才是關鍵。\n\n### 可直接練寫的完整答案\n\n可舉切接、劈接、芽接。選健康親和砧穗、平整切面並至少一側形成層對準、綁紮保濕。傷口細胞產生癒傷組織，雙方癒傷橋連接，重新形成連續形成層並分化木質部、韌皮部，恢復水分與同化物輸送。\n\n砧穗需健康且具親和性，切面平整並避免失水與污染。粗細不一致時至少對準一側形成層，不是只把木質部中心對在一起；綁紮須固定且不造成後續勒傷。\n\n傷口附近細胞增生形成癒傷組織，接觸後建立連接，進一步形成連續形成層並分化新木質部與韌皮部，才逐漸恢復供水與同化物運輸。接穗短期萌芽可使用原存養分，不足以證明已成功癒合。\n\n### 實例：把原理用在情境中\n\n切接後接穗先抽芽但隨後萎凋，可能是儲藏養分暫時支持萌芽，維管束卻未充分連接；應回查形成層對準、保濕與砧穗親和。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：三接法、形成層、癒傷橋、維管束重建與親和。\n\n- **三接法**\n- **形成層**\n- **癒傷橋**\n- **維管束重建與親和**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 只對準髓部，忽略形成層。\n 113 花卉學"},{"id":"花卉學-113-六","s":"花卉學","y":113,"n":"六","t":"三類草花","body":"<h2>第六題｜三類草花（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>三類草花<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../B113.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>一年生草花在一年／一季完成生活史，如百日草。宿根草花可多年存活、每年重新萌發，如萱草。球根花卉具有膨大地下貯藏器官，如百合鱗莖、唐菖蒲球莖、大理花塊根。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>器官來源比外觀名稱更可靠<\/strong><\/p>\n<p>地下、肥大或肉質都不能單獨決定是根、莖或葉。莖常有節、節間與芽，根有根冠與根系構造，葉則依附於莖節；判讀食用或觀賞部位時，應由發育來源辨識。<\/p>\n<p><strong>不同分類軸不能混用<\/strong><\/p>\n<p>花序型依花的著生與主軸生長方式分類；果實型則看一花或多花、單個或多個子房以及附屬組織。兩性花與完全花也不同：前者具雄雌蕊，後者還須具萼與瓣。<\/p>\n<p><strong>名稱與例子要一對一<\/strong><\/p>\n<p>寫出構造後立即給正確例子，必要時補充品種或教材口徑。同俗名可能指不同植物，新舊分類也可能用不同科名；可並列通行新名與舊名，避免用俗名差異冒充生物構造差異。<\/p>\n<h3>這題要特別注意 事件時，應採當年資料。若未取得可核對的舊資料，應揭露限制；若有精確數字，列單位及來源，使讀者能確認比較基準。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>「交易制度」與「距產地或消費地」是兩個不同分類軸；<\/p>\n<p>國家市場多元，不能宣稱某國全部只用單一制度。本題依出題年代概括，當代交易比例需另查。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>以教材常見歷史型態：日本為拍賣型，分散產地集貨批發；<\/p>\n<p>丹麥盆花市場以合作組織、協商／訂單交易及產地集貨為代表；<\/p>\n<p>美國以協商／契約、進口分銷及大型產銷為代表；<\/p>\n<p>臺北花市為消費地批發市場，切花拍賣亦有議價；<\/p>\n<p>彰化田尾為近產地生產、集散與零售觀光兼具、以議價為主。<\/p>\n<p>市場題應區分產量、產值、種植面積、批發與零售，以及指定年度與地區。鮮切花、盆花與蔬菜供應鏈的商品單位不同，不能把總量或售價直接互相比較。<\/p>\n<p>分級、包裝、耗損、運輸、冷藏與交易成本都會影響售價；產品易腐、需求集中及天候變動會加劇短期波動。要用流程解釋差異，避免只列「成本高」而未指出環節。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>同年度產量最多的蔬菜未必產值最高，因為商品單價與品質不同；花卉拍賣價也不能直接當作零售花店售價。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>25 分：五地各 5 分，交易與產地／消費地兩軸、歷史型態與限制。<\/p>\n<ul>\n<li><strong>五地各 5 分，交易與產地／消費地兩軸<\/strong><\/li>\n<li><strong>歷史型態與限制<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>混用年度、產量與產值排名。<\/li>\n<\/ul>","source":"../../B113.pdf#page=2","md":"113年花卉學_逐題教學詳解.md","search":"花卉市場類型 ## 第八題｜花卉市場類型（25 分）\n\n### 題意與作答範圍\n\n本題重點：**花卉市場類型**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../b113.pdf#page=2)。\n\n### 先掌握答案\n\n以教材常見歷史型態：日本為拍賣型，分散產地集貨批發；\n\n### 原理拆解：為什麼會這樣？\n\n**先說明產品和統計口徑**\n\n市場題應區分產量、產值、種植面積、批發與零售，以及指定年度與地區。鮮切花、盆花與蔬菜供應鏈的商品單位不同，不能把總量或售價直接互相比較。\n\n**產銷差異有可解釋的環節**\n\n分級、包裝、耗損、運輸、冷藏與交易成本都會影響售價；產品易腐、需求集中及天候變動會加劇短期波動。要用流程解釋差異，避免只列「成本高」而未指出環節。\n\n**歷史答案不能用今天資料代填**\n\n考古題要求某年排名、當時市場型態或事件時，應採當年資料。若未取得可核對的舊資料，應揭露限制；若有精確數字，列單位及來源，使讀者能確認比較基準。\n\n### 這題要特別注意\n\n「交易制度」與「距產地或消費地」是兩個不同分類軸；\n\n國家市場多元，不能宣稱某國全部只用單一制度。本題依出題年代概括，當代交易比例需另查。\n\n### 可直接練寫的完整答案\n\n以教材常見歷史型態：日本為拍賣型，分散產地集貨批發；\n\n丹麥盆花市場以合作組織、協商／訂單交易及產地集貨為代表；\n\n美國以協商／契約、進口分銷及大型產銷為代表；\n\n臺北花市為消費地批發市場，切花拍賣亦有議價；\n\n彰化田尾為近產地生產、集散與零售觀光兼具、以議價為主。\n\n市場題應區分產量、產值、種植面積、批發與零售，以及指定年度與地區。鮮切花、盆花與蔬菜供應鏈的商品單位不同，不能把總量或售價直接互相比較。\n\n分級、包裝、耗損、運輸、冷藏與交易成本都會影響售價；產品易腐、需求集中及天候變動會加劇短期波動。要用流程解釋差異，避免只列「成本高」而未指出環節。\n\n### 實例：把原理用在情境中\n\n同年度產量最多的蔬菜未必產值最高，因為商品單價與品質不同；花卉拍賣價也不能直接當作零售花店售價。\n\n### 配分重點：哪些內容不能漏？\n\n25 分：五地各 5 分，交易與產地／消費地兩軸、歷史型態與限制。\n\n- **五地各 5 分，交易與產地／消費地兩軸**\n- **歷史型態與限制**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 混用年度、產量與產值排名。\n 113 花卉學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
