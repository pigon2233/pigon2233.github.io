\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C112.pdf#page=1\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Olericulture 蔬菜園藝／蔬菜學，研究蔬菜繁殖、育種、栽培與利用。Abiotic stress 非生物逆境，如高低溫、乾旱、鹽、淹水。Devernalization 去春化，春化效應在特定條件如下階段高溫下被削弱或消除。<\/p>\n<p>Light saturation point 光飽和點，其他條件一定時，光增加已不再顯著增加光合速率的光量。Phototropin 向光素，感受藍光的蛋白激酶光受體，調控向光性、葉綠體移動及氣孔等。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>低溫建立的是成花能力<\/strong><\/p>\n<p>春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。<\/p>\n<p><strong>反應取決品種與發育年齡<\/strong><\/p>\n<p>種子或幼苗可感受低溫的類型，與須先達一定大小的綠體春化型不同。低溫的有效程度受溫度、持續時間、植株大小及後續條件影響；未達感應能力時，長時間低溫也不一定得到同樣效果。<\/p>\n<p><strong>感應完成仍須完成花芽發育<\/strong><\/p>\n<p>春化後的日長、溫度與營養決定抽薹和花器發育。部分植物在特定條件下有去春化反應，不能把處理完成看成保證當日開花。生產上須將育苗、低溫與後續栽培排成完整時程。<\/p>\n<p><strong>淨光合是固定與消耗的差額<\/strong><\/p>\n<p>在零光時仍有呼吸，淨 CO₂ 交換可為負；補償點是淨交換為零，不表示光合作用或呼吸停止。光量再增加時光合上升，至其他因素限制而接近飽和。<\/p>\n<p><strong>超過飽和不等於一定立刻受傷<\/strong><\/p>\n<p>飽和代表增加光量的邊際收益小；光抑制則是強光造成光合效率下降，兩者不同。葉溫、CO₂、氣孔、水分與光系統狀態會改變曲線，陰葉與陽葉也不能共用固定數值。<\/p>\n<p><strong>管理要讓真正的限制因子改善<\/strong><\/p>\n<p>改善冠層光分布可讓陰葉利用光，提高適宜 CO₂ 或降低熱與水分壓力可能改善效率。若已有高溫失水，單純加光常無效；遮陰也須避免過度降低每日有效同化量。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Olericulture 蔬菜園藝／蔬菜學，研究蔬菜繁殖、育種、栽培與利用。Abiotic stress 非生物逆境，如高低溫、乾旱、鹽、淹水。Devernalization 去春化，春化效應在特定條件如下階段高溫下被削弱或消除。<\/td>\n<td>使植物獲得或增強成花能力，與打破芽休眠和單純冷藏保鮮不同。 指已獲得的春化效應被削弱或取消，不是任何高溫對植物造成的傷害。<\/td>\n<\/tr>\n<tr>\n<td>Light saturation point 光飽和點，其他條件一定時，光增加已不再顯著增加光合速率的光量。Phototropin 向光素，感受藍光的蛋白激酶光受體，調控向光性、葉綠體移動及氣孔等。<\/td>\n<td>主要為藍光受體蛋白激酶，參與向光性、葉綠體運動與部分氣孔反應。 是再增加光強已難提高光合的區域，須指定其他條件，不等同開始嚴重光傷害的固定值。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>這題要特別注意<\/h3>\n<p>向光素不是生長素；<\/p>\n<p>去春化也不是單純休眠解除。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Olericulture 蔬菜園藝／蔬菜學，研究蔬菜繁殖、育種、栽培與利用。Abiotic stress 非生物逆境，如高低溫、乾旱、鹽、淹水。Devernalization 去春化，春化效應在特定條件如下階段高溫下被削弱或消除。<\/p>\n<p>Light saturation point 光飽和點，其他條件一定時，光增加已不再顯著增加光合速率的光量。Phototropin 向光素，感受藍光的蛋白激酶光受體，調控向光性、葉綠體移動及氣孔等。<\/p>\n<p>春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>部分甘藍類須先長到足夠大小再受低溫，才能順利抽薹開花供採種；食用生產則要避免幼苗過早達感應大小後遇冷，以減少未熟抽薹。<\/p>\n<p>密植果園外層葉受光已接近飽和，內層葉卻低於補償點；合理疏枝可提高內層受光，而非只是讓外層葉接受更多光。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：五名詞各 3 分，譯名、機制、例；向光素非激素。<\/p>\n<ul>\n<li><strong>五名詞各 3 分，譯名<\/strong><\/li>\n<li><strong>向光素非激素<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把低溫解除休眠與低溫誘導成花當成同義。<\/li>\n<li>將光補償點寫成沒有呼吸。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../C112.pdf#page=1","md":"112年蔬菜學_逐題教學詳解.md","search":"五名詞 ## 第一題｜五名詞（15 分）\n\n### 題意與作答範圍\n\n本題重點：**五名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c112.pdf#page=1)。\n\n### 先掌握答案\n\nolericulture 蔬菜園藝／蔬菜學，研究蔬菜繁殖、育種、栽培與利用。abiotic stress 非生物逆境，如高低溫、乾旱、鹽、淹水。devernalization 去春化，春化效應在特定條件如下階段高溫下被削弱或消除。\n\nlight saturation point 光飽和點，其他條件一定時，光增加已不再顯著增加光合速率的光量。phototropin 向光素，感受藍光的蛋白激酶光受體，調控向光性、葉綠體移動及氣孔等。\n\n### 原理拆解：為什麼會這樣？\n\n**低溫建立的是成花能力**\n\n春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。\n\n**反應取決品種與發育年齡**\n\n種子或幼苗可感受低溫的類型，與須先達一定大小的綠體春化型不同。低溫的有效程度受溫度、持續時間、植株大小及後續條件影響；未達感應能力時，長時間低溫也不一定得到同樣效果。\n\n**感應完成仍須完成花芽發育**\n\n春化後的日長、溫度與營養決定抽薹和花器發育。部分植物在特定條件下有去春化反應，不能把處理完成看成保證當日開花。生產上須將育苗、低溫與後續栽培排成完整時程。\n\n**淨光合是固定與消耗的差額**\n\n在零光時仍有呼吸，淨 co₂ 交換可為負；補償點是淨交換為零，不表示光合作用或呼吸停止。光量再增加時光合上升，至其他因素限制而接近飽和。\n\n**超過飽和不等於一定立刻受傷**\n\n飽和代表增加光量的邊際收益小；光抑制則是強光造成光合效率下降，兩者不同。葉溫、co₂、氣孔、水分與光系統狀態會改變曲線，陰葉與陽葉也不能共用固定數值。\n\n**管理要讓真正的限制因子改善**\n\n改善冠層光分布可讓陰葉利用光，提高適宜 co₂ 或降低熱與水分壓力可能改善效率。若已有高溫失水，單純加光常無效；遮陰也須避免過度降低每日有效同化量。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| olericulture 蔬菜園藝／蔬菜學，研究蔬菜繁殖、育種、栽培與利用。abiotic stress 非生物逆境，如高低溫、乾旱、鹽、淹水。devernalization 去春化，春化效應在特定條件如下階段高溫下被削弱或消除。 | 使植物獲得或增強成花能力，與打破芽休眠和單純冷藏保鮮不同。 指已獲得的春化效應被削弱或取消，不是任何高溫對植物造成的傷害。 |\n| light saturation point 光飽和點，其他條件一定時，光增加已不再顯著增加光合速率的光量。phototropin 向光素，感受藍光的蛋白激酶光受體，調控向光性、葉綠體移動及氣孔等。 | 主要為藍光受體蛋白激酶，參與向光性、葉綠體運動與部分氣孔反應。 是再增加光強已難提高光合的區域，須指定其他條件，不等同開始嚴重光傷害的固定值。 |\n\n### 這題要特別注意\n\n向光素不是生長素；\n\n去春化也不是單純休眠解除。\n\n### 可直接練寫的完整答案\n\nolericulture 蔬菜園藝／蔬菜學，研究蔬菜繁殖、育種、栽培與利用。abiotic stress 非生物逆境，如高低溫、乾旱、鹽、淹水。devernalization 去春化，春化效應在特定條件如下階段高溫下被削弱或消除。\n\nlight saturation point 光飽和點，其他條件一定時，光增加已不再顯著增加光合速率的光量。phototropin 向光素，感受藍光的蛋白激酶光受體，調控向光性、葉綠體移動及氣孔等。\n\n春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。\n\n### 實例：把原理用在情境中\n\n部分甘藍類須先長到足夠大小再受低溫，才能順利抽薹開花供採種；食用生產則要避免幼苗過早達感應大小後遇冷，以減少未熟抽薹。\n\n密植果園外層葉受光已接近飽和，內層葉卻低於補償點；合理疏枝可提高內層受光，而非只是讓外層葉接受更多光。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：五名詞各 3 分，譯名、機制、例；向光素非激素。\n\n- **五名詞各 3 分，譯名**\n- **向光素非激素**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把低溫解除休眠與低溫誘導成花當成同義。\n- 將光補償點寫成沒有呼吸。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 112 蔬菜學"},{"id":"蔬菜學-112-二","s":"蔬菜學","y":112,"n":"二","t":"草桿覆蓋利弊","body":"<h2>第二題｜草桿覆蓋利弊（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>草桿覆蓋利弊<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C112.pdf#page=1\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>優點：抑草、減少蒸發與雨滴沖蝕、穩定土溫、防泥濺及果實接地污染、分解增加有機質與土壤生物。缺點：帶入雜草種子或病蟲、提供蝸牛與鼠藏身處；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>根部問題先分辨物理、化學與生物因子<\/strong><\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p><strong>處置要對應限制因子<\/strong><\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<p><strong>改善後仍須追蹤<\/strong><\/p>\n<p>以土壤或介質 EC、pH、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。<\/p>\n<p><strong>雜草是出現在不適位置的植物<\/strong><\/p>\n<p>同一植物在綠肥田可能有用，在苗床卻可能競爭資源。主要問題包括爭光、水、養分與空間，寄生病蟲、干擾採收及污染商品；有些田間植被也有保土與生態功能，須依位置管理。<\/p>\n<p><strong>關鍵在競爭時期與繁殖源<\/strong><\/p>\n<p>作物幼苗與行間尚未封閉時通常較易受競爭；種子庫與地下繁殖器官使雜草反覆出現。應在結籽或形成大量地下繁殖體前處理，避免只消除可見地上部。<\/p>\n<p><strong>整合方法降低反覆發生<\/strong><\/p>\n<p>輪作、清潔種苗、覆蓋、適當密植、中耕、人工與合規藥劑各有時機。覆蓋須注意水分、病害與殘材，除草劑須依核准作物與標示使用；不能用不分選擇性的處理傷及栽培作物。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>效果受覆蓋厚度、原料與季節影響；<\/p>\n<p>並非所有覆蓋都一定增溫。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>優點：抑草、減少蒸發與雨滴沖蝕、穩定土溫、防泥濺及果實接地污染、分解增加有機質與土壤生物。缺點：帶入雜草種子或病蟲、提供蝸牛與鼠藏身處；<\/p>\n<p>低溫季可能延緩土溫回升，過厚阻出苗或使根頸過濕；<\/p>\n<p>分解暫時固定氮，乾燥時有火災與散落風險。<\/p>\n<p>積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。<\/p>\n<p>排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 EC 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。<\/p>\n<p>短期葉菜可先處理播種前的雜草，再利用均勻出苗與適度密植縮短裸地期間；多年生地下莖雜草則需反覆耗竭或移除繁殖體，僅割一次常會再生。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：水、溫、草、保土等優點與病蟲、氮競爭等限制逐項。<\/p>\n<ul>\n<li><strong>保土等優點與病蟲<\/strong><\/li>\n<li><strong>氮競爭等限制逐項<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將連作障礙全部歸因於缺肥。<\/li>\n<li>將所有田間非作物植被都視為沒有任何效益。<\/li>\n<\/ul>","source":"../../C112.pdf#page=1","md":"112年蔬菜學_逐題教學詳解.md","search":"草桿覆蓋利弊 ## 第二題｜草桿覆蓋利弊（20 分）\n\n### 題意與作答範圍\n\n本題重點：**草桿覆蓋利弊**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c112.pdf#page=1)。\n\n### 先掌握答案\n\n優點：抑草、減少蒸發與雨滴沖蝕、穩定土溫、防泥濺及果實接地污染、分解增加有機質與土壤生物。缺點：帶入雜草種子或病蟲、提供蝸牛與鼠藏身處；\n\n### 原理拆解：為什麼會這樣？\n\n**根部問題先分辨物理、化學與生物因子**\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n**處置要對應限制因子**\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n**改善後仍須追蹤**\n\n以土壤或介質 ec、ph、根系健康與灌排水品質驗證。淋洗鹽分須有排水出口，輪作須選非共同寄主；單次消毒若之後再引入帶病苗，問題仍可能快速復發。\n\n**雜草是出現在不適位置的植物**\n\n同一植物在綠肥田可能有用，在苗床卻可能競爭資源。主要問題包括爭光、水、養分與空間，寄生病蟲、干擾採收及污染商品；有些田間植被也有保土與生態功能，須依位置管理。\n\n**關鍵在競爭時期與繁殖源**\n\n作物幼苗與行間尚未封閉時通常較易受競爭；種子庫與地下繁殖器官使雜草反覆出現。應在結籽或形成大量地下繁殖體前處理，避免只消除可見地上部。\n\n**整合方法降低反覆發生**\n\n輪作、清潔種苗、覆蓋、適當密植、中耕、人工與合規藥劑各有時機。覆蓋須注意水分、病害與殘材，除草劑須依核准作物與標示使用；不能用不分選擇性的處理傷及栽培作物。\n\n### 這題要特別注意\n\n效果受覆蓋厚度、原料與季節影響；\n\n並非所有覆蓋都一定增溫。\n\n### 可直接練寫的完整答案\n\n優點：抑草、減少蒸發與雨滴沖蝕、穩定土溫、防泥濺及果實接地污染、分解增加有機質與土壤生物。缺點：帶入雜草種子或病蟲、提供蝸牛與鼠藏身處；\n\n低溫季可能延緩土溫回升，過厚阻出苗或使根頸過濕；\n\n分解暫時固定氮，乾燥時有火災與散落風險。\n\n積水與壓實造成缺氧，鹽類累積降低水勢，酸鹼失衡改變養分有效性，連作則可能累積特定病原及根系有害物。症狀都可能表現生長慢或萎凋，診斷不能只看地上部。\n\n排水與改良結構處理缺氧；適當灌排與降低過量施肥處理鹽分；輪作、健康苗、清園和衛生處理降低病原。若只增加有機質卻未確認成熟度與含鹽量，可能加重耗氧或鹽害。\n\n### 實例：把原理用在情境中\n\n設施內缺乏雨水淋洗又持續過量施肥時，表土可累積鹽類；應先測 ec 並查灌溉水，再調整肥量與排水淋洗，不能看到萎凋就一律再追肥。\n\n短期葉菜可先處理播種前的雜草，再利用均勻出苗與適度密植縮短裸地期間；多年生地下莖雜草則需反覆耗竭或移除繁殖體，僅割一次常會再生。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：水、溫、草、保土等優點與病蟲、氮競爭等限制逐項。\n\n- **保土等優點與病蟲**\n- **氮競爭等限制逐項**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將連作障礙全部歸因於缺肥。\n- 將所有田間非作物植被都視為沒有任何效益。\n 112 蔬菜學"},{"id":"蔬菜學-112-三","s":"蔬菜學","y":112,"n":"三","t":"甘藍即食截切菜","body":"<h2>第三題｜甘藍即食截切菜（30 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>甘藍即食截切菜<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C112.pdf#page=1\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>(1)採前使用合格水源與腐熟肥、控制病蟲與殘留、避免污水與動物糞便污染，建立衛生及追溯，適熟採收。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>採後仍活著，也仍在消耗<\/strong><\/p>\n<p>蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。<\/p>\n<p><strong>低溫與保濕要兼顧氣體交換<\/strong><\/p>\n<p>快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。<\/p>\n<p><strong>截切菜需把安全與外觀一起管理<\/strong><\/p>\n<p>流程包括原料驗收、去除不良部位、適當清洗、切割、清洗消毒、瀝乾、包裝與冷藏配送，細節依設備與產品調整。消毒水須管控有效濃度、接觸時間與有機物負荷，目標包含避免交叉污染，並不等於滅菌。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>清洗消毒降低風險，無法保證滅菌；<\/p>\n<p>截切會提高呼吸與滲出營養，冷鏈及衛生必須從田間到貨架連續。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>(1)採前使用合格水源與腐熟肥、控制病蟲與殘留、避免污水與動物糞便污染，建立衛生及追溯，適熟採收。<\/p>\n<p>(2)採收遮蔭→快速運至潔淨場→驗收剔除病傷外葉→預冷→清潔原料→潔淨器械去芯截切→合適飲用水品質之清洗消毒→漂洗（依消毒程序）→瀝水／離心脫水→稱量、適當透氣或氣調包裝→低溫貯運→超市冷藏陳列。<\/p>\n<p>(3)快速降溫抑呼吸和微生物；<\/p>\n<p>避免傷口與酵素褐變；<\/p>\n<p>消毒水監控有效成分、有機負荷與接觸時間，防交叉污染；<\/p>\n<p>去表面自由水抑腐敗，包裝維濕且避免缺氧發酵。<\/p>\n<p>蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>截切萵苣若只處理褐變而未瀝乾與維持冷鏈，仍可能滲液、腐敗或發生微生物風險；應用同批產品的外觀、失重與衛生檢測共同決定期限。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>30 分：採前 6、全流程 12、各技術原理 12，生食安全與交叉污染。<\/p>\n<ul>\n<li><strong>採前 6<\/strong><\/li>\n<li><strong>全流程 12<\/strong><\/li>\n<li><strong>各技術原理 12，生食安全與交叉污染<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把清洗消毒寫成可以保證完全無菌。<\/li>\n<\/ul>","source":"../../C112.pdf#page=1","md":"112年蔬菜學_逐題教學詳解.md","search":"甘藍即食截切菜 ## 第三題｜甘藍即食截切菜（30 分）\n\n### 題意與作答範圍\n\n本題重點：**甘藍即食截切菜**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c112.pdf#page=1)。\n\n### 先掌握答案\n\n(1)採前使用合格水源與腐熟肥、控制病蟲與殘留、避免污水與動物糞便污染，建立衛生及追溯，適熟採收。\n\n### 原理拆解：為什麼會這樣？\n\n**採後仍活著，也仍在消耗**\n\n蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。\n\n**低溫與保濕要兼顧氣體交換**\n\n快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。\n\n**截切菜需把安全與外觀一起管理**\n\n流程包括原料驗收、去除不良部位、適當清洗、切割、清洗消毒、瀝乾、包裝與冷藏配送，細節依設備與產品調整。消毒水須管控有效濃度、接觸時間與有機物負荷，目標包含避免交叉污染，並不等於滅菌。\n\n### 這題要特別注意\n\n清洗消毒降低風險，無法保證滅菌；\n\n截切會提高呼吸與滲出營養，冷鏈及衛生必須從田間到貨架連續。\n\n### 可直接練寫的完整答案\n\n(1)採前使用合格水源與腐熟肥、控制病蟲與殘留、避免污水與動物糞便污染，建立衛生及追溯，適熟採收。\n\n(2)採收遮蔭→快速運至潔淨場→驗收剔除病傷外葉→預冷→清潔原料→潔淨器械去芯截切→合適飲用水品質之清洗消毒→漂洗（依消毒程序）→瀝水／離心脫水→稱量、適當透氣或氣調包裝→低溫貯運→超市冷藏陳列。\n\n(3)快速降溫抑呼吸和微生物；\n\n避免傷口與酵素褐變；\n\n消毒水監控有效成分、有機負荷與接觸時間，防交叉污染；\n\n去表面自由水抑腐敗，包裝維濕且避免缺氧發酵。\n\n蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。\n\n### 實例：把原理用在情境中\n\n截切萵苣若只處理褐變而未瀝乾與維持冷鏈，仍可能滲液、腐敗或發生微生物風險；應用同批產品的外觀、失重與衛生檢測共同決定期限。\n\n### 配分重點：哪些內容不能漏？\n\n30 分：採前 6、全流程 12、各技術原理 12，生食安全與交叉污染。\n\n- **採前 6**\n- **全流程 12**\n- **各技術原理 12，生食安全與交叉污染**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把清洗消毒寫成可以保證完全無菌。\n 112 蔬菜學"},{"id":"蔬菜學-112-四","s":"蔬菜學","y":112,"n":"四","t":"F1 種子範圍與優缺點","body":"<h2>第四題｜F1 種子範圍與優缺點（25 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>F1 種子範圍與優缺點<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C112.pdf#page=1\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>利用遺傳不同且相對純合親本交配產生第一代雜交種，適用於能經濟製種、具雜種優勢或均一性價值的作物，如番茄、甜椒、瓜類、甘藍、青花菜、洋蔥等，可利用去雄、雄不稔、自交不親和或性別型控制製種。優點是整齊、旺盛、可聚合雙親抗性與品質、利商品保護；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>F1 一致性來自親本與受控交配<\/strong><\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<p><strong>制種須阻止不需要的授粉<\/strong><\/p>\n<p>去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。<\/p>\n<p><strong>F2 分離是留種限制的主因<\/strong><\/p>\n<p>F1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>F1 不是不會產種，而是下一代性狀常分離；<\/p>\n<p>自交作物同樣可用 F1，但須符合經濟性。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>利用遺傳不同且相對純合親本交配產生第一代雜交種，適用於能經濟製種、具雜種優勢或均一性價值的作物，如番茄、甜椒、瓜類、甘藍、青花菜、洋蔥等，可利用去雄、雄不稔、自交不親和或性別型控制製種。優點是整齊、旺盛、可聚合雙親抗性與品質、利商品保護；<\/p>\n<p>缺點是親本維持及製種成本高、需控授粉、防自交混雜，F2 分離不宜自行留種，未必每個組合都超越優良固定品種。<\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<p>去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>西瓜 F1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 F1 果實留種所得下一代，不能保證維持原果形與整齊性。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>25 分：遺傳與製種適用性、作物例、優缺及 F2 分離。<\/p>\n<ul>\n<li><strong>遺傳與製種適用性<\/strong><\/li>\n<li><strong>作物例<\/strong><\/li>\n<li><strong>優缺及 F2 分離<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>寫成 F1 種子完全不能發芽。<\/li>\n<\/ul>","source":"../../C112.pdf#page=1","md":"112年蔬菜學_逐題教學詳解.md","search":"f1 種子範圍與優缺點 ## 第四題｜f1 種子範圍與優缺點（25 分）\n\n### 題意與作答範圍\n\n本題重點：**f1 種子範圍與優缺點**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c112.pdf#page=1)。\n\n### 先掌握答案\n\n利用遺傳不同且相對純合親本交配產生第一代雜交種，適用於能經濟製種、具雜種優勢或均一性價值的作物，如番茄、甜椒、瓜類、甘藍、青花菜、洋蔥等，可利用去雄、雄不稔、自交不親和或性別型控制製種。優點是整齊、旺盛、可聚合雙親抗性與品質、利商品保護；\n\n### 原理拆解：為什麼會這樣？\n\n**f1 一致性來自親本與受控交配**\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n**制種須阻止不需要的授粉**\n\n去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。\n\n**f2 分離是留種限制的主因**\n\nf1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。\n\n### 這題要特別注意\n\nf1 不是不會產種，而是下一代性狀常分離；\n\n自交作物同樣可用 f1，但須符合經濟性。\n\n### 可直接練寫的完整答案\n\n利用遺傳不同且相對純合親本交配產生第一代雜交種，適用於能經濟製種、具雜種優勢或均一性價值的作物，如番茄、甜椒、瓜類、甘藍、青花菜、洋蔥等，可利用去雄、雄不稔、自交不親和或性別型控制製種。優點是整齊、旺盛、可聚合雙親抗性與品質、利商品保護；\n\n缺點是親本維持及製種成本高、需控授粉、防自交混雜，f2 分離不宜自行留種，未必每個組合都超越優良固定品種。\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。\n\n### 實例：把原理用在情境中\n\n西瓜 f1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 f1 果實留種所得下一代，不能保證維持原果形與整齊性。\n\n### 配分重點：哪些內容不能漏？\n\n25 分：遺傳與製種適用性、作物例、優缺及 f2 分離。\n\n- **遺傳與製種適用性**\n- **作物例**\n- **優缺及 f2 分離**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 寫成 f1 種子完全不能發芽。\n 112 蔬菜學"},{"id":"蔬菜學-112-五","s":"蔬菜學","y":112,"n":"五","t":"英文翻譯","body":"<h2>第五題｜英文翻譯（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>英文翻譯<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C112.pdf#page=1\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。<\/p>\n<h3>完整參考譯文<\/h3>\n<p>營養不良包括營養不足、微量營養素缺乏與營養過剩，其普遍程度高於飢餓，並影響全球大多數國家。生產與消費食物的多樣性及品質，是處理這三重營養不良負擔的關鍵因素。在此背景下，水果、蔬菜與堅果日益受到營養界重視。農業政策與投資多集中於主糧生產，忽略了果蔬的經濟與營養潛力。<\/p>\n<p>必須在非洲及亞洲蔬菜多樣性熱點進行蒐集，在種原被現代品種取代之前加以保存。在正式種子產業中，蔬菜育種者需能取得多樣遺傳資源，主要包括農民品種、地方品種與作物野生近緣種。基因體輔助育種正日益促進具有複雜遺傳模式的有利基因與數量性狀基因座，從野生種滲入栽培種。這將使野生近緣種更廣泛用於開發具有韌性的品種。<\/p>\n<h3>讀懂這段研究在說什麼<\/h3>\n<p><strong>從三重營養不良到作物多樣性<\/strong><\/p>\n<p>營養不良包含不足、微量缺乏與過剩，因此不等同飢餓。水果、蔬菜、堅果的多樣性與品質，連到育種和韌性生產的需求；introgression 表示遺傳片段經雜交回交等導入，不能逕譯為基因轉殖。resilient 包含適應與恢復，不只耐旱一項。<\/p>\n<h3>專業詞彙與翻譯辨析<\/h3>\n<table>\n<thead>\n<tr>\n<th>英文用語<\/th>\n<th>建議譯法<\/th>\n<th>讀法與限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>malnutrition<\/td>\n<td>營養不良<\/td>\n<td>包含不足、微量缺乏與過剩<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>容易譯錯的地方<\/h3>\n<p>introgression 為經雜交回交導入的基因滲入，不直接等同轉殖；resilient 包含對變動環境的適應恢復能力。<\/p>\n<h3>配分重點與檢查順序<\/h3>\n<p>10 分：三重營養、種原保存、地方野生資源、基因滲入與韌性。<\/p>\n<p>先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。<\/p>\n<h3>常見失分<\/h3>\n<ul>\n<li>把專業名詞按一般字義翻譯，或把相關性改成因果。<\/li>\n<li>省略轉折、條件或限制，使研究結論比原文更強。<\/li>\n<li>以摘要取代全文翻譯。<\/li>\n<\/ul>","source":"../../C112.pdf#page=1","md":"112年蔬菜學_逐題教學詳解.md","search":"英文翻譯 ## 第五題｜英文翻譯（10 分）\n\n### 題意與作答範圍\n\n本題重點：**英文翻譯**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c112.pdf#page=1)。\n\n### 先掌握答案\n\n這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。\n\n### 完整參考譯文\n\n營養不良包括營養不足、微量營養素缺乏與營養過剩，其普遍程度高於飢餓，並影響全球大多數國家。生產與消費食物的多樣性及品質，是處理這三重營養不良負擔的關鍵因素。在此背景下，水果、蔬菜與堅果日益受到營養界重視。農業政策與投資多集中於主糧生產，忽略了果蔬的經濟與營養潛力。\n\n必須在非洲及亞洲蔬菜多樣性熱點進行蒐集，在種原被現代品種取代之前加以保存。在正式種子產業中，蔬菜育種者需能取得多樣遺傳資源，主要包括農民品種、地方品種與作物野生近緣種。基因體輔助育種正日益促進具有複雜遺傳模式的有利基因與數量性狀基因座，從野生種滲入栽培種。這將使野生近緣種更廣泛用於開發具有韌性的品種。\n\n### 讀懂這段研究在說什麼\n\n**從三重營養不良到作物多樣性**\n\n營養不良包含不足、微量缺乏與過剩，因此不等同飢餓。水果、蔬菜、堅果的多樣性與品質，連到育種和韌性生產的需求；introgression 表示遺傳片段經雜交回交等導入，不能逕譯為基因轉殖。resilient 包含適應與恢復，不只耐旱一項。\n\n### 專業詞彙與翻譯辨析\n\n| 英文用語 | 建議譯法 | 讀法與限制 |\n| --- | --- | --- |\n| malnutrition | 營養不良 | 包含不足、微量缺乏與過剩 |\n\n### 容易譯錯的地方\n\nintrogression 為經雜交回交導入的基因滲入，不直接等同轉殖；resilient 包含對變動環境的適應恢復能力。\n\n### 配分重點與檢查順序\n\n10 分：三重營養、種原保存、地方野生資源、基因滲入與韌性。\n\n先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。\n\n### 常見失分\n\n- 把專業名詞按一般字義翻譯，或把相關性改成因果。\n- 省略轉折、條件或限制，使研究結論比原文更強。\n- 以摘要取代全文翻譯。\n 112 蔬菜學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('examTitle').textContent=r.y+' 年 '+r.s;$('source').href=r.source;$('mdLink').href=r.md;$('source').hidden=false;$('mdLink').hidden=false;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const i=list.findIndex(x=>x.id===id);$('counter').textContent=(i+1)+' / '+list.length;$('prev').disabled=i<=0;$('next').disabled=i>=list.length-1;history.replaceState(null,'','#q='+encodeURIComponent(id));if(scroll)window.scrollTo({top:window.innerWidth<=900?document.querySelector('main').offsetTop:0,behavior:'instant'});try{localStorage.setItem('garden-detail-last',id)}catch(e){}}function showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=tru
