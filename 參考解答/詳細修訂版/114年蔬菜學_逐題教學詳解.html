ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 7 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"蔬菜學-114-一","s":"蔬菜學","y":114,"n":"一","t":"五種生理障礙主因","body":"<h2>第一題｜五種生理障礙主因（20 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>五種生理障礙主因<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>(1)番茄花柱異常伸長：高溫使花柱超出花藥筒，品種與氮、水分亦影響。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>診斷題應把主因與加劇因子分開<\/strong><\/p>\n<p>大白菜燒心是生長中內葉局部鈣供應不足，不代表土壤總鈣必然少；花椰菜空莖若伴內褐化更支持缺硼，但單純空莖也可能由快速生長造成。甜椒日燒是果面熱與光傷害，並非侵染性病害；西瓜空心則須看授粉、品種與生長速度，不宜武斷只歸缺硼。<\/p>\n<p><strong>鈣的結構與訊號角色<\/strong><\/p>\n<p>鈣參與細胞壁果膠交聯、膜穩定與細胞訊號。缺鈣組織容易失去完整性，因此常見生長點、新葉或果實局部壞死；但症狀位置須配合實際器官與品種，不能只靠名稱就確診。<\/p>\n<p><strong>為何土壤有鈣，果實仍缺鈣<\/strong><\/p>\n<p>鈣主要隨木質部水流輸送，韌皮部再移動能力低。葉片蒸散強，果實蒸散弱，又可能隨發育降低木質部連結，因此果端等部位會先供應不足。高氮旺長、水分波動、根傷及高銨或其他陽離子競爭會加重分配失衡。<\/p>\n<p><strong>改善要處理運輸瓶頸<\/strong><\/p>\n<p>先確認土水與組織分析，再穩定灌排、維護根活力、平衡氮鉀鎂並調整負載。直接補鈣是否有效，還要看果皮吸收、時期與藥害風險；只在土中加很多鈣，不保證能送達已缺鈣的果實部位。<\/p>\n<p><strong>缺硼先傷哪些功能<\/strong><\/p>\n<p>硼參與細胞壁穩定及分生組織發育，亦影響花粉萌發、花粉管伸長與受精。缺乏時幼嫩組織生長不正常，可見脆裂、頂芽受損或果實凹凸，生殖器官也可能先失去功能而減少著果。<\/p>\n<p><strong>為何水分與土壤也重要<\/strong><\/p>\n<p>硼供應受土壤有效性、根域 pH、含水及根系活力影響。乾旱可使根吸收與輸送不足，土中有硼不代表發育部位已收到。硼在體內的再移動依物種而異，具多元醇運輸的部分果樹不能套用完全不移動的規則。<\/p>\n<p><strong>診斷與補充的界線<\/strong><\/p>\n<p>以作物、葉齡、裂柄流膠及果實畸形的組合建立判斷，配土葉分析排除病毒、藥害與鈣問題。硼的缺乏與毒害範圍較窄，補充應少量、均勻、依建議執行；過量也會造成葉片壞死，不能把所有裂果一律用硼處理。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>不可把所有空洞一律當缺硼；<\/p>\n<p>必須依伴隨徵狀判斷。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>(1)番茄花柱異常伸長：高溫使花柱超出花藥筒，品種與氮、水分亦影響。<\/p>\n<p>(2)花椰菜空莖伴內褐化：優先考慮缺硼，快速生長、株距與水分可加劇；<\/p>\n<p>單純空莖不必然缺硼。<\/p>\n<p>(3)大白菜燒心／葉尖焦枯：內葉局部鈣供應不足，受快速生長、蒸散與水分不均影響。<\/p>\n<p>(4)甜椒果肩日燒：葉遮蔭不足、強光高溫使果面受熱傷害。<\/p>\n<p>(5)西瓜空心：授粉受精不足、種子／胎座發育與果肉生長不協調，品種、快速生長及天氣共同影響。<\/p>\n<p>大白菜燒心是生長中內葉局部鈣供應不足，不代表土壤總鈣必然少；花椰菜空莖若伴內褐化更支持缺硼，但單純空莖也可能由快速生長造成。甜椒日燒是果面熱與光傷害，並非侵染性病害；西瓜空心則須看授粉、品種與生長速度，不宜武斷只歸缺硼。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>蘋果苦痘與番茄尻腐都能用「局部供鈣不足」理解；兩者作物及器官不同，卻共同說明營養障礙不能只看土壤總含量。<\/p>\n<p>番木瓜若同時有新葉脆、葉柄龜裂流膠與瘤果，比只有一個果實畸形更支持缺硼；若全園只有單株葉斑，則須更重視局部根病或感染性問題。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>20 分：五障礙各 4 分，花柱熱、褐空莖硼、燒心鈣、椒日燒、瓜授粉。<\/p>\n<ul>\n<li><strong>五障礙各 4 分，花柱熱<\/strong><\/li>\n<li><strong>褐空莖硼<\/strong><\/li>\n<li><strong>燒心鈣<\/strong><\/li>\n<li><strong>椒日燒<\/strong><\/li>\n<li><strong>瓜授粉<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>以為鈣能像氮一樣由老葉大量移到缺鈣果實。<\/li>\n<li>把所有硬果、空心或裂果都直接診斷成缺硼。<\/li>\n<\/ul>","source":"../../C114.pdf#page=2","md":"114年蔬菜學_逐題教學詳解.md","search":"五種生理障礙主因 ## 第一題｜五種生理障礙主因（20 分）\n\n### 題意與作答範圍\n\n本題重點：**五種生理障礙主因**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c114.pdf#page=2)。\n\n### 先掌握答案\n\n(1)番茄花柱異常伸長：高溫使花柱超出花藥筒，品種與氮、水分亦影響。\n\n### 原理拆解：為什麼會這樣？\n\n**診斷題應把主因與加劇因子分開**\n\n大白菜燒心是生長中內葉局部鈣供應不足，不代表土壤總鈣必然少；花椰菜空莖若伴內褐化更支持缺硼，但單純空莖也可能由快速生長造成。甜椒日燒是果面熱與光傷害，並非侵染性病害；西瓜空心則須看授粉、品種與生長速度，不宜武斷只歸缺硼。\n\n**鈣的結構與訊號角色**\n\n鈣參與細胞壁果膠交聯、膜穩定與細胞訊號。缺鈣組織容易失去完整性，因此常見生長點、新葉或果實局部壞死；但症狀位置須配合實際器官與品種，不能只靠名稱就確診。\n\n**為何土壤有鈣，果實仍缺鈣**\n\n鈣主要隨木質部水流輸送，韌皮部再移動能力低。葉片蒸散強，果實蒸散弱，又可能隨發育降低木質部連結，因此果端等部位會先供應不足。高氮旺長、水分波動、根傷及高銨或其他陽離子競爭會加重分配失衡。\n\n**改善要處理運輸瓶頸**\n\n先確認土水與組織分析，再穩定灌排、維護根活力、平衡氮鉀鎂並調整負載。直接補鈣是否有效，還要看果皮吸收、時期與藥害風險；只在土中加很多鈣，不保證能送達已缺鈣的果實部位。\n\n**缺硼先傷哪些功能**\n\n硼參與細胞壁穩定及分生組織發育，亦影響花粉萌發、花粉管伸長與受精。缺乏時幼嫩組織生長不正常，可見脆裂、頂芽受損或果實凹凸，生殖器官也可能先失去功能而減少著果。\n\n**為何水分與土壤也重要**\n\n硼供應受土壤有效性、根域 ph、含水及根系活力影響。乾旱可使根吸收與輸送不足，土中有硼不代表發育部位已收到。硼在體內的再移動依物種而異，具多元醇運輸的部分果樹不能套用完全不移動的規則。\n\n**診斷與補充的界線**\n\n以作物、葉齡、裂柄流膠及果實畸形的組合建立判斷，配土葉分析排除病毒、藥害與鈣問題。硼的缺乏與毒害範圍較窄，補充應少量、均勻、依建議執行；過量也會造成葉片壞死，不能把所有裂果一律用硼處理。\n\n### 這題要特別注意\n\n不可把所有空洞一律當缺硼；\n\n必須依伴隨徵狀判斷。\n\n### 可直接練寫的完整答案\n\n(1)番茄花柱異常伸長：高溫使花柱超出花藥筒，品種與氮、水分亦影響。\n\n(2)花椰菜空莖伴內褐化：優先考慮缺硼，快速生長、株距與水分可加劇；\n\n單純空莖不必然缺硼。\n\n(3)大白菜燒心／葉尖焦枯：內葉局部鈣供應不足，受快速生長、蒸散與水分不均影響。\n\n(4)甜椒果肩日燒：葉遮蔭不足、強光高溫使果面受熱傷害。\n\n(5)西瓜空心：授粉受精不足、種子／胎座發育與果肉生長不協調，品種、快速生長及天氣共同影響。\n\n大白菜燒心是生長中內葉局部鈣供應不足，不代表土壤總鈣必然少；花椰菜空莖若伴內褐化更支持缺硼，但單純空莖也可能由快速生長造成。甜椒日燒是果面熱與光傷害，並非侵染性病害；西瓜空心則須看授粉、品種與生長速度，不宜武斷只歸缺硼。\n\n### 實例：把原理用在情境中\n\n蘋果苦痘與番茄尻腐都能用「局部供鈣不足」理解；兩者作物及器官不同，卻共同說明營養障礙不能只看土壤總含量。\n\n番木瓜若同時有新葉脆、葉柄龜裂流膠與瘤果，比只有一個果實畸形更支持缺硼；若全園只有單株葉斑，則須更重視局部根病或感染性問題。\n\n### 配分重點：哪些內容不能漏？\n\n20 分：五障礙各 4 分，花柱熱、褐空莖硼、燒心鈣、椒日燒、瓜授粉。\n\n- **五障礙各 4 分，花柱熱**\n- **褐空莖硼**\n- **燒心鈣**\n- **椒日燒**\n- **瓜授粉**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 以為鈣能像氮一樣由老葉大量移到缺鈣果實。\n- 把所有硬果、空心或裂果都直接診斷成缺硼。\n 114 蔬菜學"},{"id":"蔬菜學-114-二","s":"蔬菜學","y":114,"n":"二","t":"低溫後才能抽薹開花","body":"<h2>第二題｜低溫後才能抽薹開花（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>低溫後才能抽薹開花<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>稱春化作用 vernalization。依感受期分：種子型，可在已吸水種子／幼苗階段感受低溫，如部分白菜、蘿蔔；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>低溫建立的是成花能力<\/strong><\/p>\n<p>春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。<\/p>\n<p><strong>反應取決品種與發育年齡<\/strong><\/p>\n<p>種子或幼苗可感受低溫的類型，與須先達一定大小的綠體春化型不同。低溫的有效程度受溫度、持續時間、植株大小及後續條件影響；未達感應能力時，長時間低溫也不一定得到同樣效果。<\/p>\n<p><strong>感應完成仍須完成花芽發育<\/strong><\/p>\n<p>春化後的日長、溫度與營養決定抽薹和花器發育。部分植物在特定條件下有去春化反應，不能把處理完成看成保證當日開花。生產上須將育苗、低溫與後續栽培排成完整時程。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>乾燥種子通常無法有效春化；<\/p>\n<p>實際需冷量及幼年期受品種控制。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>稱春化作用 vernalization。依感受期分：種子型，可在已吸水種子／幼苗階段感受低溫，如部分白菜、蘿蔔；<\/p>\n<p>綠體型，需先達一定葉齡或植株大小，如甘藍、洋蔥、胡蘿蔔的許多品種。<\/p>\n<p>春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。<\/p>\n<p>種子或幼苗可感受低溫的類型，與須先達一定大小的綠體春化型不同。低溫的有效程度受溫度、持續時間、植株大小及後續條件影響；未達感應能力時，長時間低溫也不一定得到同樣效果。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>部分甘藍類須先長到足夠大小再受低溫，才能順利抽薹開花供採種；食用生產則要避免幼苗過早達感應大小後遇冷，以減少未熟抽薹。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：春化名稱 5、兩感冷發育類型與作物例 10。<\/p>\n<ul>\n<li><strong>春化名稱 5<\/strong><\/li>\n<li><strong>兩感冷發育類型與作物例 10<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把低溫解除休眠與低溫誘導成花當成同義。<\/li>\n<\/ul>","source":"../../C114.pdf#page=2","md":"114年蔬菜學_逐題教學詳解.md","search":"低溫後才能抽薹開花 ## 第二題｜低溫後才能抽薹開花（15 分）\n\n### 題意與作答範圍\n\n本題重點：**低溫後才能抽薹開花**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c114.pdf#page=2)。\n\n### 先掌握答案\n\n稱春化作用 vernalization。依感受期分：種子型，可在已吸水種子／幼苗階段感受低溫，如部分白菜、蘿蔔；\n\n### 原理拆解：為什麼會這樣？\n\n**低溫建立的是成花能力**\n\n春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。\n\n**反應取決品種與發育年齡**\n\n種子或幼苗可感受低溫的類型，與須先達一定大小的綠體春化型不同。低溫的有效程度受溫度、持續時間、植株大小及後續條件影響；未達感應能力時，長時間低溫也不一定得到同樣效果。\n\n**感應完成仍須完成花芽發育**\n\n春化後的日長、溫度與營養決定抽薹和花器發育。部分植物在特定條件下有去春化反應，不能把處理完成看成保證當日開花。生產上須將育苗、低溫與後續栽培排成完整時程。\n\n### 這題要特別注意\n\n乾燥種子通常無法有效春化；\n\n實際需冷量及幼年期受品種控制。\n\n### 可直接練寫的完整答案\n\n稱春化作用 vernalization。依感受期分：種子型，可在已吸水種子／幼苗階段感受低溫，如部分白菜、蘿蔔；\n\n綠體型，需先達一定葉齡或植株大小，如甘藍、洋蔥、胡蘿蔔的許多品種。\n\n春化為適當低溫使植物獲得或加速成花能力的作用。並非所有低溫處理都叫春化；解除芽休眠、促球根生根與果實冷藏各有不同生理目的，必須先辨識作用組織與後續反應。\n\n種子或幼苗可感受低溫的類型，與須先達一定大小的綠體春化型不同。低溫的有效程度受溫度、持續時間、植株大小及後續條件影響；未達感應能力時，長時間低溫也不一定得到同樣效果。\n\n### 實例：把原理用在情境中\n\n部分甘藍類須先長到足夠大小再受低溫，才能順利抽薹開花供採種；食用生產則要避免幼苗過早達感應大小後遇冷，以減少未熟抽薹。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：春化名稱 5、兩感冷發育類型與作物例 10。\n\n- **春化名稱 5**\n- **兩感冷發育類型與作物例 10**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把低溫解除休眠與低溫誘導成花當成同義。\n 114 蔬菜學"},{"id":"蔬菜學-114-三","s":"蔬菜學","y":114,"n":"三","t":"臺灣草莓","body":"<h2>第三題｜臺灣草莓（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>臺灣草莓<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>主要採果季約 11 月至翌年 4 月，以走蔓子苗無性繁殖，健康母株可先以莖頂培養與病原檢測建立。生物逆境包括炭疽病、灰黴病、白粉病、蟎類與蚜蟲等；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>健康與整齊度要從母本或種子源開始<\/strong><\/p>\n<p>母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。<\/p>\n<p><strong>育苗目標是可定植且恢復快<\/strong><\/p>\n<p>適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。<\/p>\n<p><strong>無菌培養後仍有馴化關卡<\/strong><\/p>\n<p>瓶內高濕、低光與外加糖可使幼苗角質層、氣孔及根功能與田間不同。出瓶須逐步調整光濕條件並防感染。組培倍率、出瓶存活率與成品率應分開計算，不能只用增殖數宣稱生產效率。<\/p>\n<p><strong>先區分傷害種類與發生條件<\/strong><\/p>\n<p>乾旱、淹水、高溫、寒害、凍害與鹽害的起始機制不同。寒害可在冰點以上發生於敏感作物，凍害則涉及結冰；淹水即使土壤水多，也可能因缺氧而使根無法正常供水。<\/p>\n<p><strong>從細胞功能連到可見症狀<\/strong><\/p>\n<p>膜性質改變、活性氧增加、酵素與能量代謝受阻，最後表現萎凋、褐化、落花或生長停滯。短期氣孔關閉可節水，長期卻限制 CO₂ 吸收；適應反應與傷害結果應分別說明。<\/p>\n<p><strong>預防與恢復管理各有時機<\/strong><\/p>\n<p>品種與產季選擇、灌排、覆蓋、通風遮陰及適度馴化可降低風險。受害後先評估根與生長點是否存活，再調整水肥；重施肥不能代替環境修復，受傷根系也可能無法利用增加的養分。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>走蔓苗可複製品種，也會帶病，健康母株體系是關鍵。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>主要採果季約 11 月至翌年 4 月，以走蔓子苗無性繁殖，健康母株可先以莖頂培養與病原檢測建立。生物逆境包括炭疽病、灰黴病、白粉病、蟎類與蚜蟲等；<\/p>\n<p>非生物逆境包括高溫、豪雨淹水、低日照、鹽害與寒害。改善健康苗、母苗分區與清園、高畦排水、避雨、適當通風遮蔭、精準肥水、抗病品種及整合防治。<\/p>\n<p>母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。<\/p>\n<p>適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>蝴蝶蘭分生苗可用組織培養大量增殖，但需檢測母株病毒並控制培養代數；出瓶後先馴化，再依葉片與根系生長分級，不宜把瓶苗數直接當成上市盆花數。<\/p>\n<p>熱帶果菜低溫貯藏後可能出現凹陷、褐化與腐敗，而未曾結冰；應檢查該作物安全溫度與累積暴露時間，不能只把冷庫調得更冷。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：產季 2、走蔓繁殖 2、生物非生物逆境 6、措施 5。<\/p>\n<ul>\n<li><strong>產季 2<\/strong><\/li>\n<li><strong>走蔓繁殖 2<\/strong><\/li>\n<li><strong>生物非生物逆境 6<\/strong><\/li>\n<li><strong>措施 5<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將組織培養視為自動消除所有病原。<\/li>\n<li>把寒害與凍害當成同義詞。<\/li>\n<\/ul>","source":"../../C114.pdf#page=2","md":"114年蔬菜學_逐題教學詳解.md","search":"臺灣草莓 ## 第三題｜臺灣草莓（15 分）\n\n### 題意與作答範圍\n\n本題重點：**臺灣草莓**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c114.pdf#page=2)。\n\n### 先掌握答案\n\n主要採果季約 11 月至翌年 4 月，以走蔓子苗無性繁殖，健康母株可先以莖頂培養與病原檢測建立。生物逆境包括炭疽病、灰黴病、白粉病、蟎類與蚜蟲等；\n\n### 原理拆解：為什麼會這樣？\n\n**健康與整齊度要從母本或種子源開始**\n\n母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。\n\n**育苗目標是可定植且恢復快**\n\n適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。\n\n**無菌培養後仍有馴化關卡**\n\n瓶內高濕、低光與外加糖可使幼苗角質層、氣孔及根功能與田間不同。出瓶須逐步調整光濕條件並防感染。組培倍率、出瓶存活率與成品率應分開計算，不能只用增殖數宣稱生產效率。\n\n**先區分傷害種類與發生條件**\n\n乾旱、淹水、高溫、寒害、凍害與鹽害的起始機制不同。寒害可在冰點以上發生於敏感作物，凍害則涉及結冰；淹水即使土壤水多，也可能因缺氧而使根無法正常供水。\n\n**從細胞功能連到可見症狀**\n\n膜性質改變、活性氧增加、酵素與能量代謝受阻，最後表現萎凋、褐化、落花或生長停滯。短期氣孔關閉可節水，長期卻限制 co₂ 吸收；適應反應與傷害結果應分別說明。\n\n**預防與恢復管理各有時機**\n\n品種與產季選擇、灌排、覆蓋、通風遮陰及適度馴化可降低風險。受害後先評估根與生長點是否存活，再調整水肥；重施肥不能代替環境修復，受傷根系也可能無法利用增加的養分。\n\n### 這題要特別注意\n\n走蔓苗可複製品種，也會帶病，健康母株體系是關鍵。\n\n### 可直接練寫的完整答案\n\n主要採果季約 11 月至翌年 4 月，以走蔓子苗無性繁殖，健康母株可先以莖頂培養與病原檢測建立。生物逆境包括炭疽病、灰黴病、白粉病、蟎類與蚜蟲等；\n\n非生物逆境包括高溫、豪雨淹水、低日照、鹽害與寒害。改善健康苗、母苗分區與清園、高畦排水、避雨、適當通風遮蔭、精準肥水、抗病品種及整合防治。\n\n母株帶病、種子混雜或發芽不整齊，往往無法只靠後段管理補救。應先選品種與合格種源，建立隔離、檢測與批次追溯；外觀正常並不保證無系統性病毒。\n\n適度根系、適當苗齡、均衡地上部與根部，以及無重大病蟲是核心。過度氮肥使苗大且柔嫩，可能反而提高失水與病害；根滿盆、盤根或苗齡過老也會限制定植後生長。\n\n### 不同；維持親本時也要有相應措施。<\/p>\n<p><strong>F2 分離是留種限制的主因<\/strong><\/p>\n<p>F1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。<\/p>\n<p><strong>淨光合是固定與消耗的差額<\/strong><\/p>\n<p>在零光時仍有呼吸，淨 CO₂ 交換可為負；補償點是淨交換為零，不表示光合作用或呼吸停止。光量再增加時光合上升，至其他因素限制而接近飽和。<\/p>\n<p><strong>超過飽和不等於一定立刻受傷<\/strong><\/p>\n<p>飽和代表增加光量的邊際收益小；光抑制則是強光造成光合效率下降，兩者不同。葉溫、CO₂、氣孔、水分與光系統狀態會改變曲線，陰葉與陽葉也不能共用固定數值。<\/p>\n<p><strong>管理要讓真正的限制因子改善<\/strong><\/p>\n<p>改善冠層光分布可讓陰葉利用光，提高適宜 CO₂ 或降低熱與水分壓力可能改善效率。若已有高溫失水，單純加光常無效；遮陰也須避免過度降低每日有效同化量。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Self-incompatibility 自交不親和：有功能的花粉與胚珠，卻因遺傳辨識而排斥自身或相同不親和型花粉，阻止受精，與雄不稔不同。Light compensation point 光補償點：光合作用固定 CO₂ 恰與呼吸釋放平衡、淨光合為零時的光強度。<\/td>\n<td>多在受精後形成種子，胚珠與子房兩者層級不同。 是淨光合為零的光強；總光合作用與呼吸仍在進行。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>這題要特別注意<\/h3>\n<p>補償點以下持續淨耗碳；<\/p>\n<p>不親和性可用於 F1 製種，但親本維持須克服自交障礙。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Self-incompatibility 自交不親和：有功能的花粉與胚珠，卻因遺傳辨識而排斥自身或相同不親和型花粉，阻止受精，與雄不稔不同。Light compensation point 光補償點：光合作用固定 CO₂ 恰與呼吸釋放平衡、淨光合為零時的光強度。<\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>西瓜 F1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 F1 果實留種所得下一代，不能保證維持原果形與整齊性。<\/p>\n<p>密植果園外層葉受光已接近飽和，內層葉卻低於補償點；合理疏枝可提高內層受光，而非只是讓外層葉接受更多光。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：兩名詞各 5 分，功能雌雄存在但排斥、淨光合零點。<\/p>\n<ul>\n<li><strong>兩名詞各 5 分，功能雌雄存在但排斥<\/strong><\/li>\n<li><strong>淨光合零點<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>寫成 F1 種子完全不能發芽。<\/li>\n<li>將光補償點寫成沒有呼吸。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../C114.pdf#page=2","md":"114年蔬菜學_逐題教學詳解.md","search":"兩名詞 ## 第五題｜兩名詞（10 分）\n\n### 題意與作答範圍\n\n本題重點：**兩名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c114.pdf#page=2)。\n\n### 先掌握答案\n\nself-incompatibility 自交不親和：有功能的花粉與胚珠，卻因遺傳辨識而排斥自身或相同不親和型花粉，阻止受精，與雄不稔不同。light compensation point 光補償點：光合作用固定 co₂ 恰與呼吸釋放平衡、淨光合為零時的光強度。\n\n### 原理拆解：為什麼會這樣？\n\n**f1 一致性來自親本與受控交配**\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n**制種須阻止不需要的授粉**\n\n去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。\n\n**f2 分離是留種限制的主因**\n\nf1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。\n\n**淨光合是固定與消耗的差額**\n\n在零光時仍有呼吸，淨 co₂ 交換可為負；補償點是淨交換為零，不表示光合作用或呼吸停止。光量再增加時光合上升，至其他因素限制而接近飽和。\n\n**超過飽和不等於一定立刻受傷**\n\n飽和代表增加光量的邊際收益小；光抑制則是強光造成光合效率下降，兩者不同。葉溫、co₂、氣孔、水分與光系統狀態會改變曲線，陰葉與陽葉也不能共用固定數值。\n\n**管理要讓真正的限制因子改善**\n\n改善冠層光分布可讓陰葉利用光，提高適宜 co₂ 或降低熱與水分壓力可能改善效率。若已有高溫失水，單純加光常無效；遮陰也須避免過度降低每日有效同化量。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| self-incompatibility 自交不親和：有功能的花粉與胚珠，卻因遺傳辨識而排斥自身或相同不親和型花粉，阻止受精，與雄不稔不同。light compensation point 光補償點：光合作用固定 co₂ 恰與呼吸釋放平衡、淨光合為零時的光強度。 | 多在受精後形成種子，胚珠與子房兩者層級不同。 是淨光合為零的光強；總光合作用與呼吸仍在進行。 |\n\n### 這題要特別注意\n\n補償點以下持續淨耗碳；\n\n不親和性可用於 f1 製種，但親本維持須克服自交障礙。\n\n### 可直接練寫的完整答案\n\nself-incompatibility 自交不親和：有功能的花粉與胚珠，卻因遺傳辨識而排斥自身或相同不親和型花粉，阻止受精，與雄不稔不同。light compensation point 光補償點：光合作用固定 co₂ 恰與呼吸釋放平衡、淨光合為零時的光強度。\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n### 實例：把原理用在情境中\n\n西瓜 f1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 f1 果實留種所得下一代，不能保證維持原果形與整齊性。\n\n密植果園外層葉受光已接近飽和，內層葉卻低於補償點；合理疏枝可提高內層受光，而非只是讓外層葉接受更多光。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：兩名詞各 5 分，功能雌雄存在但排斥、淨光合零點。\n\n- **兩名詞各 5 分，功能雌雄存在但排斥**\n- **淨光合零點**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 寫成 f1 種子完全不能發芽。\n- 將光補償點寫成沒有呼吸。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 114 蔬菜學"},{"id":"蔬菜學-114-六","s":"蔬菜學","y":114,"n":"六","t":"分子標誌與 MAS","body":"<h2>第六題｜分子標誌與 MAS（15 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>分子標誌與 MAS<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>分子標誌為可檢測的 DNA 序列多型性，如 SNP、SSR；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>標誌提供基因型線索<\/strong><\/p>\n<p>分子標誌是可檢測的 DNA 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 MAS 與基因轉殖的操作與法規概念不同。<\/p>\n<p><strong>連鎖不等於永遠不分離<\/strong><\/p>\n<p>若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。<\/p>\n<p><strong>回交可兼顧前景與背景選拔<\/strong><\/p>\n<p>前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。MAS 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。<\/p>\n<h3>這題要特別注意<\/h3>\n<p>標誌「接近」目標基因仍可能被交換分離，功能標誌通常較可靠。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>分子標誌為可檢測的 DNA 序列多型性，如 SNP、SSR；<\/p>\n<p>與目標基因連鎖或本身為功能變異時，可用來推定後代基因型。應用包括早期選抗病、鑑定雜交、基因聚合、回交前景及背景選拔。優點為可早選、不需等性狀表現、利隱性基因；<\/p>\n<p>限制為標誌開發成本、重組造成誤判、跨族群不一定適用，複雜性狀仍受環境與多基因影響，需表型驗證。<\/p>\n<p>分子標誌是可檢測的 DNA 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 MAS 與基因轉殖的操作與法規概念不同。<\/p>\n<p>若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>15 分：標誌 5、育種用途 5、優點與限制 5。<\/p>\n<ul>\n<li><strong>標誌 5<\/strong><\/li>\n<li><strong>育種用途 5<\/strong><\/li>\n<li><strong>優點與限制 5<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把分子標誌說成施用後使植物產生抗性的藥劑。<\/li>\n<\/ul>","source":"../../C114.pdf#page=2","md":"114年蔬菜學_逐題教學詳解.md","search":"分子標誌與 mas ## 第六題｜分子標誌與 mas（15 分）\n\n### 題意與作答範圍\n\n本題重點：**分子標誌與 mas**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c114.pdf#page=2)。\n\n### 先掌握答案\n\n分子標誌為可檢測的 dna 序列多型性，如 snp、ssr；\n\n### 原理拆解：為什麼會這樣？\n\n**標誌提供基因型線索**\n\n分子標誌是可檢測的 dna 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 mas 與基因轉殖的操作與法規概念不同。\n\n**連鎖不等於永遠不分離**\n\n若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。\n\n**回交可兼顧前景與背景選拔**\n\n前景選拔保留目標基因，重組選拔縮小供體片段，背景選拔加速恢復輪迴親本。mas 的價值在於減少無效培育與克服晚現或難量測性狀，不是完全取代表型試驗。\n\n### 這題要特別注意\n\n標誌「接近」目標基因仍可能被交換分離，功能標誌通常較可靠。\n\n### 可直接練寫的完整答案\n\n分子標誌為可檢測的 dna 序列多型性，如 snp、ssr；\n\n與目標基因連鎖或本身為功能變異時，可用來推定後代基因型。應用包括早期選抗病、鑑定雜交、基因聚合、回交前景及背景選拔。優點為可早選、不需等性狀表現、利隱性基因；\n\n限制為標誌開發成本、重組造成誤判、跨族群不一定適用，複雜性狀仍受環境與多基因影響，需表型驗證。\n\n分子標誌是可檢測的 dna 多型性；標誌輔助選拔利用與目標基因連鎖或位於基因內的標誌提早判斷後代。它不是把基因轉入植物，因此 mas 與基因轉殖的操作與法規概念不同。\n\n若標誌不在功能變異上，重組可能使標誌與性狀脫離。應在育種族群確認標誌可靠性，搭配兩側標誌、接種或田間表型；多基因且受環境影響大的性狀，不能只用單一標誌保證表現。\n\n### 實例：把原理用在情境中\n\n抗病回交時先用標誌篩除未帶抗性等位基因的苗，再對保留苗接種確認抗性；同時評估果形與產量，以避免只保住抗性卻失去商品性。\n\n### 配分重點：哪些內容不能漏？\n\n15 分：標誌 5、育種用途 5、優點與限制 5。\n\n- **標誌 5**\n- **育種用途 5**\n- **優點與限制 5**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把分子標誌說成施用後使植物產生抗性的藥劑。\n 114 蔬菜學"},{"id":"蔬菜學-114-七","s":"蔬菜學","y":114,"n":"七","t":"英文翻譯（兩頁完整段落）","body":"<h2>第七題｜英文翻譯（兩頁完整段落）（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>英文翻譯（兩頁完整段落）<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../C114.pdf#page=2\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。<\/p>\n<h3>完整參考譯文<\/h3>\n<p>雖然冷藏是維持園產品品質、延長貨架壽命最有效的方法，卻也可能造成採後損失與浪費。溫度每上升 10°C，代謝反應速率約增加 2–3 倍；<\/p>\n<p>低溫貯藏透過減慢呼吸與乙烯生成，以及降低病原生長和水分損失，延緩劣變。對低溫敏感的種類，其組織貯藏於 0–15°C 範圍內時可能開始發生採後寒害，但症狀常在移至較暖條件後才顯現。常見表型包括組織褐化或變黑、表面凹陷、皺縮、質地、碳水化合物與揮發香氣的不利改變，以及真菌感染。<\/p>\n<p>採後寒害的嚴重程度由許多因素決定，其中溫度與貯藏時間最重要。若低溫不太強且暴露短暫，許多代謝功能可在回溫後恢復，且可能不出現可見症狀。若持續受低溫逆境，組織無法順利適應，會耗竭並發生嚴重採後寒害。採前因素包括基因型、環境變數及栽培措施，彼此交互作用而影響寒害程度。在達到園藝成熟前採收的組織，採後寒害較嚴重，因其發育路徑尚未完成，易受低溫及回溫大幅干擾。<\/p>\n<h3>讀懂這段研究在說什麼<\/h3>\n<p><strong>低溫保鮮的利益與寒害限制並存<\/strong><\/p>\n<p>前段解釋降溫減慢呼吸、乙烯、病原與失水，後段轉入敏感種類的寒害。Q10 約 2–3 是代謝對升溫的概括反應，不是任何指標都精確翻倍；0–15°C 的描述也不能當成所有蔬菜的禁用範圍。兩頁原文的轉折與後續機制應完整連續翻出。<\/p>\n<h3>專業詞彙與翻譯辨析<\/h3>\n<table>\n<thead>\n<tr>\n<th>英文用語<\/th>\n<th>建議譯法<\/th>\n<th>讀法與限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>stress<\/td>\n<td>逆境<\/td>\n<td>不利生長條件，依文意分生物或非生物<\/td>\n<\/tr>\n<tr>\n<td>chilling injury<\/td>\n<td>寒害<\/td>\n<td>敏感材料在未結冰低溫下受傷<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>容易譯錯的地方<\/h3>\n<p>原文 0–15°C 為敏感種類的概括範圍，不能解讀成所有蔬菜都不能置於此範圍；寒害不同於組織結冰的凍害。<\/p>\n<h3>配分重點與檢查順序<\/h3>\n<p>10 分：兩頁全文、0–15°C 的敏感種條件、回溫顯症與未熟組織較敏感。<\/p>\n<p>先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。<\/p>\n<h3>常見失分<\/h3>\n<ul>\n<li>把專業名詞按一般字義翻譯，或把相關性改成因果。<\/li>\n<li>省略轉折、條件或限制，使研究結論比原文更強。<\/li>\n<li>以摘要取代全文翻譯。<\/li>\n<\/ul>","source":"../../C114.pdf#page=2","md":"114年蔬菜學_逐題教學詳解.md","search":"英文翻譯（兩頁完整段落） ## 第七題｜英文翻譯（兩頁完整段落）（10 分）\n\n### 題意與作答範圍\n\n本題重點：**英文翻譯（兩頁完整段落）**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../c114.pdf#page=2)。\n\n### 先掌握答案\n\n這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。\n\n### 完整參考譯文\n\n雖然冷藏是維持園產品品質、延長貨架壽命最有效的方法，卻也可能造成採後損失與浪費。溫度每上升 10°c，代謝反應速率約增加 2–3 倍；\n\n低溫貯藏透過減慢呼吸與乙烯生成，以及降低病原生長和水分損失，延緩劣變。對低溫敏感的種類，其組織貯藏於 0–15°c 範圍內時可能開始發生採後寒害，但症狀常在移至較暖條件後才顯現。常見表型包括組織褐化或變黑、表面凹陷、皺縮、質地、碳水化合物與揮發香氣的不利改變，以及真菌感染。\n\n採後寒害的嚴重程度由許多因素決定，其中溫度與貯藏時間最重要。若低溫不太強且暴露短暫，許多代謝功能可在回溫後恢復，且可能不出現可見症狀。若持續受低溫逆境，組織無法順利適應，會耗竭並發生嚴重採後寒害。採前因素包括基因型、環境變數及栽培措施，彼此交互作用而影響寒害程度。在達到園藝成熟前採收的組織，採後寒害較嚴重，因其發育路徑尚未完成，易受低溫及回溫大幅干擾。\n\n### 讀懂這段研究在說什麼\n\n**低溫保鮮的利益與寒害限制並存**\n\n前段解釋降溫減慢呼吸、乙烯、病原與失水，後段轉入敏感種類的寒害。q10 約 2–3 是代謝對升溫的概括反應，不是任何指標都精確翻倍；0–15°c 的描述也不能當成所有蔬菜的禁用範圍。兩頁原文的轉折與後續機制應完整連續翻出。\n\n### 專業詞彙與翻譯辨析\n\n| 英文用語 | 建議譯法 | 讀法與限制 |\n| --- | --- | --- |\n| stress | 逆境 | 不利生長條件，依文意分生物或非生物 |\n| chilling injury | 寒害 | 敏感材料在未結冰低溫下受傷 |\n\n### 容易譯錯的地方\n\n原文 0–15°c 為敏感種類的概括範圍，不能解讀成所有蔬菜都不能置於此範圍；寒害不同於組織結冰的凍害。\n\n### 配分重點與檢查順序\n\n10 分：兩頁全文、0–15°c 的敏感種條件、回溫顯症與未熟組織較敏感。\n\n先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。\n\n### 常見失分\n\n- 把專業名詞按一般字義翻譯，或把相關性改成因果。\n- 省略轉折、條件或限制，使研究結論比原文更強。\n- 以摘要取代全文翻譯。\n 114 蔬菜學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r tion showExam(print=false){if(!current)return;const qs=data.filter(r=>r.s===current.s&&r.y===current.y);examMode=true;document.body.classList.add('exam');$('content').innerHTML='<p class="modehint">本卷全文模式：'+qs.length+' 大題。按左側題號可回到逐題閱讀。</p>'+qs.map(r=>'<article class="page exam-page">'+r.body+'</article>').join('');prepareContent();$('counter').textContent='本卷全文 · '+qs.length+' 題';$('prev').disabled=true;$('next').disabled=true;if(print)requestAnimationFrame(()=>window.print());else window.scrollTo(0,0)}$('subject').onchange=()=>{setYears();$('search').value='';filter()};$('year').onchange=()=>{$('search').value='';filter()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>filter(),160)};$('clear').onclick=()=>{$('search').value='';filter()};$('prev').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i>0)show(list[i-1].id)};$('next').onclick=()=>{const i=list.findIndex(r=>r.id===current.id);if(i<list.length-1)show(list[i+1].id)};$('all').onclick=()=>showExam();$('print').onclick=()=>showExam(true);$('mobileToggle').onclick=()=>document.body.classList.toggle('navclosed');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&!$('next').disabled)$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});let initial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
