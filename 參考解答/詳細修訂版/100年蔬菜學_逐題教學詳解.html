ols{display:none}.page p{overflow-wrap:anywhere}#counter{font-size:12px}footer button{font-size:14px}aside .note{margin-bottom:0}}@media print{aside,footer,header,.sectionnav,.modehint{display:none!important}main{margin:0;padding:0;max-width:none}.page{display:block!important;max-width:none;break-before:page;border:0}.page:first-of-type{break-before:auto}body{background:white;color:#111;font-size:11pt;line-height:1.8}.page h2{font-size:18pt}.page h3{font-size:13pt;break-after:avoid}.page table{display:table;font-size:9pt}tr,img{break-inside:avoid}.page a{color:inherit;text-decoration:none}p{orphans:3;widows:3}}</style></head><body><aside><div class="kicker">逐題教學詳解 · 完整修訂</div><h1>園藝考古題<br>先理解，再練申論</h1><button id="mobileToggle">展開／收起選題</button><div id="sidebarControls"><div class="selects"><label>科目<select id="subject" aria-label="科目"></select></label><label>年度<select id="year" aria-label="年度"></select></label></div><label for="search">搜尋題目與內容</label><input id="search" type="search" placeholder="例：春化、缺鈣、111" autocomplete="off"><div class="sideactions"><button id="clear">清除搜尋</button><button id="all">本卷全文</button><button id="print">列印本卷</button></div><p id="resultCount" role="status"></p><nav id="nav" aria-label="題目清單"></nav><p class="note">配分重點是建議作答架構，<br>不是校方公布的評分細則。</p><p><a href="../園藝考古題_逐題教學詳解.html">開啟全部科目與年度 →</a></p></div></aside><main><header><div class="kicker">題意 → 原理 → 申論稿 → 實例 → 配分</div><h1 id="examTitle"></h1><div class="topline"><a id="source" target="_blank" rel="noopener">對照原始試卷 ↗</a><a id="mdLink">開啟本卷文字稿</a><span class="status">共 8 題 · 一次閱讀一題</span></div></header><div id="content"></div><noscript>此閱讀器需要 JavaScript 才能切題。請改開同目錄下的逐題教學詳解 Markdown 文字稿。</noscript></main><footer><button id="prev">← 上一題</button><button id="next">下一題 →</button><span id="counter" role="status"></span></footer><script id="data" type="application/json">[{"id":"蔬菜學-100-一","s":"蔬菜學","y":100,"n":"一","t":"四名詞","body":"<h2>第一題｜四名詞（16 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>四名詞<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=21\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>Training 整枝／引蔓，建立株型與支架；<\/p>\n<p>curing 癒傷／乾燥調理，依作物促保護層或乾燥鱗莖頸，如馬鈴薯、洋蔥；<\/p>\n<p>grafting 嫁接，砧穗重建維管連結，如番茄抗病砧；<\/p>\n<p>pruning 修剪，去部分莖葉調株型負載。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先決定繁殖要保留什麼<\/strong><\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<p><strong>器官形成依靠細胞能力與環境<\/strong><\/p>\n<p>扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。<\/p>\n<p><strong>生根前後的管理目標不同<\/strong><\/p>\n<p>未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。<\/p>\n<h3>逐項辨析：定義之外還要知道什麼<\/h3>\n<table>\n<thead>\n<tr>\n<th>本題答案項目<\/th>\n<th>解析與辨別重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>curing 癒傷／乾燥調理，依作物促保護層或乾燥鱗莖頸，如馬鈴薯、洋蔥；<\/td>\n<td>主要貯藏組織是肉質葉或葉基，底部有短縮莖基盤，例如百合、洋蔥。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>可直接練寫的完整答案<\/h3>\n<p>Training 整枝／引蔓，建立株型與支架；<\/p>\n<p>curing 癒傷／乾燥調理，依作物促保護層或乾燥鱗莖頸，如馬鈴薯、洋蔥；<\/p>\n<p>grafting 嫁接，砧穗重建維管連結，如番茄抗病砧；<\/p>\n<p>pruning 修剪，去部分莖葉調株型負載。<\/p>\n<p>有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>16 分：四項各 4 分，名稱、目的、例，curing 依作物區分。<\/p>\n<ul>\n<li><strong>四項各 4 分，名稱<\/strong><\/li>\n<li><strong>例，curing 依作物區分<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把無性繁殖與無病毒畫上等號。<\/li>\n<li>只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=21","md":"100年蔬菜學_逐題教學詳解.md","search":"四名詞 ## 第一題｜四名詞（16 分）\n\n### 題意與作答範圍\n\n本題重點：**四名詞**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=21)。\n\n### 先掌握答案\n\ntraining 整枝／引蔓，建立株型與支架；\n\ncuring 癒傷／乾燥調理，依作物促保護層或乾燥鱗莖頸，如馬鈴薯、洋蔥；\n\ngrafting 嫁接，砧穗重建維管連結，如番茄抗病砧；\n\npruning 修剪，去部分莖葉調株型負載。\n\n### 原理拆解：為什麼會這樣？\n\n**先決定繁殖要保留什麼**\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n**器官形成依靠細胞能力與環境**\n\n扦插須由適合的細胞形成不定根；插穗的成熟度、碳水化合物與內生激素影響能力。生長素可促根原基形成，但過量可能抑制根伸長或造成傷害；並非所有難發根材料都可用提高濃度解決。\n\n**生根前後的管理目標不同**\n\n未生根時以降低葉片失水、保持基部供氧為主；生根後逐漸降低濕度並增加光照，使根系與氣孔功能適應外界。全程積水雖濕度高，卻會降低氧氣、增加腐敗；發根率也應與成苗率分開評估。\n\n### 逐項辨析：定義之外還要知道什麼\n\n| 本題答案項目 | 解析與辨別重點 |\n| --- | --- |\n| curing 癒傷／乾燥調理，依作物促保護層或乾燥鱗莖頸，如馬鈴薯、洋蔥； | 主要貯藏組織是肉質葉或葉基，底部有短縮莖基盤，例如百合、洋蔥。 |\n\n### 可直接練寫的完整答案\n\ntraining 整枝／引蔓，建立株型與支架；\n\ncuring 癒傷／乾燥調理，依作物促保護層或乾燥鱗莖頸，如馬鈴薯、洋蔥；\n\ngrafting 嫁接，砧穗重建維管連結，如番茄抗病砧；\n\npruning 修剪，去部分莖葉調株型負載。\n\n有性繁殖經減數分裂與受精，後代可能分離；無性繁殖主要保留母株基因型，適合維持優良栽培品種，但不能因此保證無病毒。選方法時須同時考慮繁殖倍率、遺傳整齊度、母株健康與成本。\n\n### 實例：把原理用在情境中\n\n玫瑰插穗在間歇噴霧下可減少萎凋，但仍須用排水良好的介質；移出苗床前逐步馴化，才不會把「已發根」誤當成「可直接定植」。\n\n### 配分重點：哪些內容不能漏？\n\n16 分：四項各 4 分，名稱、目的、例，curing 依作物區分。\n\n- **四項各 4 分，名稱**\n- **例，curing 依作物區分**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把無性繁殖與無病毒畫上等號。\n- 只抄中文名稱，漏掉題目要求的構造、英文、例子或區別。\n 100 蔬菜學"},{"id":"蔬菜學-100-二","s":"蔬菜學","y":100,"n":"二","t":"有效雜草管理","body":"<h2>第二題｜有效雜草管理（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>有效雜草管理<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=21\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>先辨一年生／多年生、種子與根莖來源，結合潔淨種苗、輪作、假播種床、覆蓋、早期中耕手除、滴灌減畦間草，必要合規除草劑且輪替機制。重點在幼苗競爭關鍵期與結籽前處理，避免中耕傷根和藥劑飄移。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>雜草是出現在不適位置的植物<\/strong><\/p>\n<p>同一植物在綠肥田可能有用，在苗床卻可能競爭資源。主要問題包括爭光、水、養分與空間，寄生病蟲、干擾採收及污染商品；有些田間植被也有保土與生態功能，須依位置管理。<\/p>\n<p><strong>關鍵在競爭時期與繁殖源<\/strong><\/p>\n<p>作物幼苗與行間尚未封閉時通常較易受競爭；種子庫與地下繁殖器官使雜草反覆出現。應在結籽或形成大量地下繁殖體前處理，避免只消除可見地上部。<\/p>\n<p><strong>整合方法降低反覆發生<\/strong><\/p>\n<p>輪作、清潔種苗、覆蓋、適當密植、中耕、人工與合規藥劑各有時機。覆蓋須注意水分、病害與殘材，除草劑須依核准作物與標示使用；不能用不分選擇性的處理傷及栽培作物。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>先辨一年生／多年生、種子與根莖來源，結合潔淨種苗、輪作、假播種床、覆蓋、早期中耕手除、滴灌減畦間草，必要合規除草劑且輪替機制。重點在幼苗競爭關鍵期與結籽前處理，避免中耕傷根和藥劑飄移。<\/p>\n<p>同一植物在綠肥田可能有用，在苗床卻可能競爭資源。主要問題包括爭光、水、養分與空間，寄生病蟲、干擾採收及污染商品；有些田間植被也有保土與生態功能，須依位置管理。<\/p>\n<p>作物幼苗與行間尚未封閉時通常較易受競爭；種子庫與地下繁殖器官使雜草反覆出現。應在結籽或形成大量地下繁殖體前處理，避免只消除可見地上部。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>短期葉菜可先處理播種前的雜草，再利用均勻出苗與適度密植縮短裸地期間；多年生地下莖雜草則需反覆耗竭或移除繁殖體，僅割一次常會再生。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：預防、耕作、物理化學、時機與安全。<\/p>\n<ul>\n<li><strong>物理化學<\/strong><\/li>\n<li><strong>時機與安全<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>將所有田間非作物植被都視為沒有任何效益。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=21","md":"100年蔬菜學_逐題教學詳解.md","search":"有效雜草管理 ## 第二題｜有效雜草管理（10 分）\n\n### 題意與作答範圍\n\n本題重點：**有效雜草管理**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=21)。\n\n### 先掌握答案\n\n先辨一年生／多年生、種子與根莖來源，結合潔淨種苗、輪作、假播種床、覆蓋、早期中耕手除、滴灌減畦間草，必要合規除草劑且輪替機制。重點在幼苗競爭關鍵期與結籽前處理，避免中耕傷根和藥劑飄移。\n\n### 原理拆解：為什麼會這樣？\n\n**雜草是出現在不適位置的植物**\n\n同一植物在綠肥田可能有用，在苗床卻可能競爭資源。主要問題包括爭光、水、養分與空間，寄生病蟲、干擾採收及污染商品；有些田間植被也有保土與生態功能，須依位置管理。\n\n**關鍵在競爭時期與繁殖源**\n\n作物幼苗與行間尚未封閉時通常較易受競爭；種子庫與地下繁殖器官使雜草反覆出現。應在結籽或形成大量地下繁殖體前處理，避免只消除可見地上部。\n\n**整合方法降低反覆發生**\n\n輪作、清潔種苗、覆蓋、適當密植、中耕、人工與合規藥劑各有時機。覆蓋須注意水分、病害與殘材，除草劑須依核准作物與標示使用；不能用不分選擇性的處理傷及栽培作物。\n\n### 可直接練寫的完整答案\n\n先辨一年生／多年生、種子與根莖來源，結合潔淨種苗、輪作、假播種床、覆蓋、早期中耕手除、滴灌減畦間草，必要合規除草劑且輪替機制。重點在幼苗競爭關鍵期與結籽前處理，避免中耕傷根和藥劑飄移。\n\n同一植物在綠肥田可能有用，在苗床卻可能競爭資源。主要問題包括爭光、水、養分與空間，寄生病蟲、干擾採收及污染商品；有些田間植被也有保土與生態功能，須依位置管理。\n\n作物幼苗與行間尚未封閉時通常較易受競爭；種子庫與地下繁殖器官使雜草反覆出現。應在結籽或形成大量地下繁殖體前處理，避免只消除可見地上部。\n\n### 實例：把原理用在情境中\n\n短期葉菜可先處理播種前的雜草，再利用均勻出苗與適度密植縮短裸地期間；多年生地下莖雜草則需反覆耗竭或移除繁殖體，僅割一次常會再生。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：預防、耕作、物理化學、時機與安全。\n\n- **物理化學**\n- **時機與安全**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 將所有田間非作物植被都視為沒有任何效益。\n 100 蔬菜學"},{"id":"蔬菜學-100-三","s":"蔬菜學","y":100,"n":"三","t":"F1 育種程序","body":"<h2>第三題｜F1 育種程序（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>F1 育種程序<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=21\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>設定目標並蒐集材料→自交選拔建穩定親本→配合力及試交→優良 F1 多地多季評估→保持親本、隔離控授粉製種→採收調製→純度、發芽、健康檢驗→商品化。需預先設計成本可行的去雄、雄不稔或不親和系統，並確保父母本花期一致。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>F1 一致性來自親本與受控交配<\/strong><\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<p><strong>制種須阻止不需要的授粉<\/strong><\/p>\n<p>去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。<\/p>\n<p><strong>F2 分離是留種限制的主因<\/strong><\/p>\n<p>F1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>設定目標並蒐集材料→自交選拔建穩定親本→配合力及試交→優良 F1 多地多季評估→保持親本、隔離控授粉製種→採收調製→純度、發芽、健康檢驗→商品化。需預先設計成本可行的去雄、雄不稔或不親和系統，並確保父母本花期一致。<\/p>\n<p>兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 F1。親本維持與交配純度是種子品質的基礎。<\/p>\n<p>去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>西瓜 F1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 F1 果實留種所得下一代，不能保證維持原果形與整齊性。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：育親本、配合力、試驗、製種和檢驗順序。<\/p>\n<ul>\n<li><strong>育親本<\/strong><\/li>\n<li><strong>配合力<\/strong><\/li>\n<li><strong>製種和檢驗順序<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>寫成 F1 種子完全不能發芽。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=21","md":"100年蔬菜學_逐題教學詳解.md","search":"f1 育種程序 ## 第三題｜f1 育種程序（10 分）\n\n### 題意與作答範圍\n\n本題重點：**f1 育種程序**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=21)。\n\n### 先掌握答案\n\n設定目標並蒐集材料→自交選拔建穩定親本→配合力及試交→優良 f1 多地多季評估→保持親本、隔離控授粉製種→採收調製→純度、發芽、健康檢驗→商品化。需預先設計成本可行的去雄、雄不稔或不親和系統，並確保父母本花期一致。\n\n### 原理拆解：為什麼會這樣？\n\n**f1 一致性來自親本與受控交配**\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n**制種須阻止不需要的授粉**\n\n去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。\n\n**f2 分離是留種限制的主因**\n\nf1 自交或同代互交後，後代基因分離與重組，整齊度和優勢可能下降。商品種子需每次由原親本重製，並透過田間性狀、種子檢查或分子標誌檢驗純度；不能把發芽率當作雜交純度。\n\n### 可直接練寫的完整答案\n\n設定目標並蒐集材料→自交選拔建穩定親本→配合力及試交→優良 f1 多地多季評估→保持親本、隔離控授粉製種→採收調製→純度、發芽、健康檢驗→商品化。需預先設計成本可行的去雄、雄不稔或不親和系統，並確保父母本花期一致。\n\n兩個遺傳整齊且互補的親本雜交，可使第一代基因型較一致並表現雜種優勢；不是任何兩株混合授粉都能產生整齊商品 f1。親本維持與交配純度是種子品質的基礎。\n\n去雄、雄不稔、自交不親和、隔離與人工授粉等，目的在減少自交或外來花粉。自交不親和是花粉與雌蕊間辨識反應，與雄蕊不產正常花粉的雄不稔不同；維持親本時也要有相應措施。\n\n### 實例：把原理用在情境中\n\n西瓜 f1 制種以固定親本定向授粉並隔離雜粉；收得種子須檢驗純度與發芽品質。消費者從 f1 果實留種所得下一代，不能保證維持原果形與整齊性。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：育親本、配合力、試驗、製種和檢驗順序。\n\n- **育親本**\n- **配合力**\n- **製種和檢驗順序**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 寫成 f1 種子完全不能發芽。\n 100 蔬菜學"},{"id":"蔬菜學-100-四","s":"蔬菜學","y":100,"n":"四","t":"四果實障礙","body":"<h2>第四題｜四果實障礙（16 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>四果實障礙<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=21\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>西瓜空心常由授粉受精不充分與胎座、果肉發育不同步，受品種與快速生長影響；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>先理解水勢與膨壓<\/strong><\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p><strong>由缺水到減產的連鎖<\/strong><\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<p><strong>管理不是只問澆多少<\/strong><\/p>\n<p>應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。<\/p>\n<p><strong>結果節位先由作物與品種決定<\/strong><\/p>\n<p>不同瓜類雌花或兩性花出現於主蔓、子蔓、孫蔓的習性不同，整枝應據此保留有效結果枝。不能把甜瓜、胡瓜、苦瓜與西瓜全部套用相同摘心節位。<\/p>\n<p><strong>整枝是調整葉果關係與通風<\/strong><\/p>\n<p>去除不需要的側枝可降低競爭、方便授粉採收並改善通風；同時保留果實所需的供源葉。疏果決定庫數目，摘心決定後續生長，兩者須一起考慮目標果重與品質。<\/p>\n<p><strong>操作規格隨栽培系統調整<\/strong><\/p>\n<p>露地與立體栽培、單蔓與多蔓、早熟與連續採收的需求不同。應先交代系統，再寫保留枝蔓、結果節位與留果量；過早重摘葉可能減少供碳並增加日燒。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>西瓜空心常由授粉受精不充分與胎座、果肉發育不同步，受品種與快速生長影響；<\/p>\n<p>番茄空洞為種子、膠質胎座發育不良；<\/p>\n<p>胡瓜大肚瓜為果實各部生長不均，常見授粉種子分布、同化物與水肥失衡；<\/p>\n<p>甜瓜裂果因表皮擴張與內部膨大失衡，常在水分驟增、過熟或薄皮敏感品種。<\/p>\n<p>水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。<\/p>\n<p>根域變乾、葉水勢下降後，ABA 等訊號促氣孔關閉以節水；但 CO₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。<\/p>\n<p>網室直立甜瓜可依品種在合適子蔓上留果，控制留果數並保留上方健康葉；露地西瓜多蔓留果的操作不能直接照搬同一節位表。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>16 分：各 4 分，具體組織與主因，勿全部歸缺硼。<\/p>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把有水等同根一定能吸到水。<\/li>\n<li>只寫摘心，未說要促生或保留哪一級枝蔓。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=21","md":"100年蔬菜學_逐題教學詳解.md","search":"四果實障礙 ## 第四題｜四果實障礙（16 分）\n\n### 題意與作答範圍\n\n本題重點：**四果實障礙**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=21)。\n\n### 先掌握答案\n\n西瓜空心常由授粉受精不充分與胎座、果肉發育不同步，受品種與快速生長影響；\n\n### 原理拆解：為什麼會這樣？\n\n**先理解水勢與膨壓**\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n**由缺水到減產的連鎖**\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n**管理不是只問澆多少**\n\n應先看土壤保水與排水、根深、作物生育期及蒸散需求，用根域含水或水勢、植株狀態訂補水時機。覆蓋可減土面蒸發，滴灌可提高供水效率，但若根已病死或缺氧，增加灌水反而可能使吸水更差。\n\n**結果節位先由作物與品種決定**\n\n不同瓜類雌花或兩性花出現於主蔓、子蔓、孫蔓的習性不同，整枝應據此保留有效結果枝。不能把甜瓜、胡瓜、苦瓜與西瓜全部套用相同摘心節位。\n\n**整枝是調整葉果關係與通風**\n\n去除不需要的側枝可降低競爭、方便授粉採收並改善通風；同時保留果實所需的供源葉。疏果決定庫數目，摘心決定後續生長，兩者須一起考慮目標果重與品質。\n\n**操作規格隨栽培系統調整**\n\n露地與立體栽培、單蔓與多蔓、早熟與連續採收的需求不同。應先交代系統，再寫保留枝蔓、結果節位與留果量；過早重摘葉可能減少供碳並增加日燒。\n\n### 可直接練寫的完整答案\n\n西瓜空心常由授粉受精不充分與胎座、果肉發育不同步，受品種與快速生長影響；\n\n番茄空洞為種子、膠質胎座發育不良；\n\n胡瓜大肚瓜為果實各部生長不均，常見授粉種子分布、同化物與水肥失衡；\n\n甜瓜裂果因表皮擴張與內部膨大失衡，常在水分驟增、過熟或薄皮敏感品種。\n\n水由較高水勢流向較低水勢。細胞內溶質降低滲透勢，使水進入並建立膨壓；膨壓維持葉片挺立，也是細胞擴張的重要驅動力。因此缺水初期，即使葉片尚未明顯枯死，生長速度也可能先下降。\n\n根域變乾、葉水勢下降後，aba 等訊號促氣孔關閉以節水；但 co₂ 進入也減少，光合供碳受限。缺水再加重會破壞膜、酵素與運輸，造成落花落果、果實小與葉片早衰。復水後是否恢復，取決逆境強度、時間及受傷器官。\n\n### 實例：把原理用在情境中\n\n旱後突然大水可讓部分果實內部快速吸水膨大，外皮卻來不及延展，增加裂果。因此穩定供水有時比季節總水量更能解釋商品率。\n\n網室直立甜瓜可依品種在合適子蔓上留果，控制留果數並保留上方健康葉；露地西瓜多蔓留果的操作不能直接照搬同一節位表。\n\n### 配分重點：哪些內容不能漏？\n\n16 分：各 4 分，具體組織與主因，勿全部歸缺硼。\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把有水等同根一定能吸到水。\n- 只寫摘心，未說要促生或保留哪一級枝蔓。\n 100 蔬菜學"},{"id":"蔬菜學-100-五","s":"蔬菜學","y":100,"n":"五","t":"價差與採後品質","body":"<h2>第五題｜價差與採後品質（10 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>價差與採後品質<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=21\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>蔬菜含水高、呼吸旺、易機械傷、易失水黃化與微生物腐敗，供應又受天候與成熟集中影響，分級、耗損、冷鏈和物流加大運銷價差。以適熟輕採、遮蔭、預冷、保濕透氣包裝、衛生、分級、氣調及冷鏈保品質；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>採後仍活著，也仍在消耗<\/strong><\/p>\n<p>蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。<\/p>\n<p><strong>低溫與保濕要兼顧氣體交換<\/strong><\/p>\n<p>快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。<\/p>\n<p><strong>截切菜需把安全與外觀一起管理<\/strong><\/p>\n<p>流程包括原料驗收、去除不良部位、適當清洗、切割、清洗消毒、瀝乾、包裝與冷藏配送，細節依設備與產品調整。消毒水須管控有效濃度、接觸時間與有機物負荷，目標包含避免交叉污染，並不等於滅菌。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>蔬菜含水高、呼吸旺、易機械傷、易失水黃化與微生物腐敗，供應又受天候與成熟集中影響，分級、耗損、冷鏈和物流加大運銷價差。以適熟輕採、遮蔭、預冷、保濕透氣包裝、衛生、分級、氣調及冷鏈保品質；<\/p>\n<p>也須改善供需資訊和批量配送，而非只壓低產地價格。<\/p>\n<p>蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。<\/p>\n<p>快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>截切萵苣若只處理褐變而未瀝乾與維持冷鏈，仍可能滲液、腐敗或發生微生物風險；應用同批產品的外觀、失重與衛生檢測共同決定期限。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>10 分：產品生理與流通成本、至少五保鮮法及原理。<\/p>\n<ul>\n<li><strong>產品生理與流通成本<\/strong><\/li>\n<li><strong>至少五保鮮法及原理<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把清洗消毒寫成可以保證完全無菌。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=21","md":"100年蔬菜學_逐題教學詳解.md","search":"價差與採後品質 ## 第五題｜價差與採後品質（10 分）\n\n### 題意與作答範圍\n\n本題重點：**價差與採後品質**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=21)。\n\n### 先掌握答案\n\n蔬菜含水高、呼吸旺、易機械傷、易失水黃化與微生物腐敗，供應又受天候與成熟集中影響，分級、耗損、冷鏈和物流加大運銷價差。以適熟輕採、遮蔭、預冷、保濕透氣包裝、衛生、分級、氣調及冷鏈保品質；\n\n### 原理拆解：為什麼會這樣？\n\n**採後仍活著，也仍在消耗**\n\n蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。\n\n**低溫與保濕要兼顧氣體交換**\n\n快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。\n\n**截切菜需把安全與外觀一起管理**\n\n流程包括原料驗收、去除不良部位、適當清洗、切割、清洗消毒、瀝乾、包裝與冷藏配送，細節依設備與產品調整。消毒水須管控有效濃度、接觸時間與有機物負荷，目標包含避免交叉污染，並不等於滅菌。\n\n### 可直接練寫的完整答案\n\n蔬菜含水高、呼吸旺、易機械傷、易失水黃化與微生物腐敗，供應又受天候與成熟集中影響，分級、耗損、冷鏈和物流加大運銷價差。以適熟輕採、遮蔭、預冷、保濕透氣包裝、衛生、分級、氣調及冷鏈保品質；\n\n也須改善供需資訊和批量配送，而非只壓低產地價格。\n\n蔬菜採收後持續呼吸、蒸散與衰老，葉菜尤其容易失水萎凋；切割又增加傷口、呼吸與酵素反應。保鮮無法把未達標的原料變成優良商品，應先選適熟、完整且健康的材料。\n\n快速預冷和連續冷鏈可降低代謝，但須避開寒害；高相對濕度可減失水，表面長期游離水卻可能助長腐敗。包裝或氣調若使氧過低，可能產生厭氧代謝與異味，不能單純越密封越好。\n\n### 實例：把原理用在情境中\n\n截切萵苣若只處理褐變而未瀝乾與維持冷鏈，仍可能滲液、腐敗或發生微生物風險；應用同批產品的外觀、失重與衛生檢測共同決定期限。\n\n### 配分重點：哪些內容不能漏？\n\n10 分：產品生理與流通成本、至少五保鮮法及原理。\n\n- **產品生理與流通成本**\n- **至少五保鮮法及原理**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把清洗消毒寫成可以保證完全無菌。\n 100 蔬菜學"},{"id":"蔬菜學-100-六","s":"蔬菜學","y":100,"n":"六","t":"種子活力衰退表現","body":"<h2>第六題｜種子活力衰退表現（8 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>種子活力衰退表現<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=21\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>發芽慢、平均發芽時間延長、出苗不齊、在逆境下發芽率先降、異常苗及根短增加，後續生長弱。生理上膜損害導致電解質滲漏，呼吸與修復能力降低、脂質氧化和酵素失活，標準適溫發芽率可能仍高而田間出苗已差。<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>發芽率、活力與壽命要分開<\/strong><\/p>\n<p>發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。<\/p>\n<p><strong>劣化涉及膜與修復能力<\/strong><\/p>\n<p>貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。<\/p>\n<p><strong>保存與檢測依種子特性選擇<\/strong><\/p>\n<p>耐乾燥的正貯型種子通常可適度乾燥、低溫與防潮保存；不耐乾燥的種子不能照抄同法。發芽試驗、加速老化、導電度或低溫試驗各反映不同面向，須選適合作物的條件與標準。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>發芽慢、平均發芽時間延長、出苗不齊、在逆境下發芽率先降、異常苗及根短增加，後續生長弱。生理上膜損害導致電解質滲漏，呼吸與修復能力降低、脂質氧化和酵素失活，標準適溫發芽率可能仍高而田間出苗已差。<\/p>\n<p>發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。<\/p>\n<p>貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>蔥種子貯藏後即使標準發芽率尚可，活力降低也可能使育苗出苗不整；先做活力或小規模出苗比較，比直接增加播種密度更能掌握苗數。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>8 分：形態與速度、逆境、膜酵素與發芽率差別。<\/p>\n<ul>\n<li><strong>形態與速度<\/strong><\/li>\n<li><strong>膜酵素與發芽率差別<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把所有未發芽種子都判為死亡，漏掉休眠。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=21","md":"100年蔬菜學_逐題教學詳解.md","search":"種子活力衰退表現 ## 第六題｜種子活力衰退表現（8 分）\n\n### 題意與作答範圍\n\n本題重點：**種子活力衰退表現**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=21)。\n\n### 先掌握答案\n\n發芽慢、平均發芽時間延長、出苗不齊、在逆境下發芽率先降、異常苗及根短增加，後續生長弱。生理上膜損害導致電解質滲漏，呼吸與修復能力降低、脂質氧化和酵素失活，標準適溫發芽率可能仍高而田間出苗已差。\n\n### 原理拆解：為什麼會這樣？\n\n**發芽率、活力與壽命要分開**\n\n發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。\n\n**劣化涉及膜與修復能力**\n\n貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。\n\n**保存與檢測依種子特性選擇**\n\n耐乾燥的正貯型種子通常可適度乾燥、低溫與防潮保存；不耐乾燥的種子不能照抄同法。發芽試驗、加速老化、導電度或低溫試驗各反映不同面向，須選適合作物的條件與標準。\n\n### 可直接練寫的完整答案\n\n發芽慢、平均發芽時間延長、出苗不齊、在逆境下發芽率先降、異常苗及根短增加，後續生長弱。生理上膜損害導致電解質滲漏，呼吸與修復能力降低、脂質氧化和酵素失活，標準適溫發芽率可能仍高而田間出苗已差。\n\n發芽率是在規定適宜條件下形成正常幼苗的比例；活力反映較廣環境下快速、整齊出苗的能力；壽命是維持可用生活力的時間。兩批種子發芽率相近，低溫或逆境下的田間出苗仍可能不同。\n\n貯藏時氧化與脂質過氧化、膜完整性下降、酵素和核酸損傷會累積，使吸脹滲漏增加、發芽延遲或異常苗增加。單純補肥不能逆轉已嚴重劣化種子的遺傳與細胞損傷。\n\n### 實例：把原理用在情境中\n\n蔥種子貯藏後即使標準發芽率尚可，活力降低也可能使育苗出苗不整；先做活力或小規模出苗比較，比直接增加播種密度更能掌握苗數。\n\n### 配分重點：哪些內容不能漏？\n\n8 分：形態與速度、逆境、膜酵素與發芽率差別。\n\n- **形態與速度**\n- **膜酵素與發芽率差別**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把所有未發芽種子都判為死亡，漏掉休眠。\n 100 蔬菜學"},{"id":"蔬菜學-100-七","s":"蔬菜學","y":100,"n":"七","t":"氮目的、缺氮與硝酸鹽","body":"<h2>第七題｜氮目的、缺氮與硝酸鹽（14 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>氮目的、缺氮與硝酸鹽<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=21\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>氮供蛋白質、酵素、核酸及葉綠素，促適度營養生長。缺氮由老葉均勻黃化、植株矮小、葉面積及產量下降；<\/p>\n<h3>原理拆解：為什麼會這樣？<\/h3>\n<p><strong>氮為何促進營養生長<\/strong><\/p>\n<p>氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。<\/p>\n<p><strong>吸收氮不等於已同化<\/strong><\/p>\n<p>根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 GS/GOGAT 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。<\/p>\n<p><strong>形式、總量與時期一起決定結果<\/strong><\/p>\n<p>銨態並非不好，但根域容量小、緩衝弱時，過量銨容易酸化、毒害及拮抗鈣鉀鎂。果實期又須避免過氮徒長、陰蔽與品質下降。因此應依土水、光量、生育需求分次施肥，而不是只選一個氮形式就認為問題解決。<\/p>\n<h3>可直接練寫的完整答案<\/h3>\n<p>氮供蛋白質、酵素、核酸及葉綠素，促適度營養生長。缺氮由老葉均勻黃化、植株矮小、葉面積及產量下降；<\/p>\n<p>硝酸鹽累積是吸收高於還原同化，低光、過量氮、低溫及品種共同影響。應按需分施、改善光與根域，不能只因葉色濃綠就追加氮。<\/p>\n<p>氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。<\/p>\n<p>根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 GS/GOGAT 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。<\/p>\n<h3>實例：把原理用在情境中<\/h3>\n<p>番茄結果後期若高氨加上灌溉不穩，果端鈣供應更易失衡；改硝態為主仍須同時控制總氮、供水與根活力，才能有效降低風險。<\/p>\n<h3>配分重點：哪些內容不能漏？<\/h3>\n<p>14 分：功能、缺氮部位症狀、累積原因及管理。<\/p>\n<ul>\n<li><strong>缺氮部位症狀<\/strong><\/li>\n<li><strong>累積原因及管理<\/strong><\/li>\n<\/ul>\n<p>細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。<\/p>\n<h3>常見錯誤與修正<\/h3>\n<ul>\n<li>把硝酸鹽累積說成所有氮都完全不能被利用。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=21","md":"100年蔬菜學_逐題教學詳解.md","search":"氮目的、缺氮與硝酸鹽 ## 第七題｜氮目的、缺氮與硝酸鹽（14 分）\n\n### 題意與作答範圍\n\n本題重點：**氮目的、缺氮與硝酸鹽**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=21)。\n\n### 先掌握答案\n\n氮供蛋白質、酵素、核酸及葉綠素，促適度營養生長。缺氮由老葉均勻黃化、植株矮小、葉面積及產量下降；\n\n### 原理拆解：為什麼會這樣？\n\n**氮為何促進營養生長**\n\n氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。\n\n**吸收氮不等於已同化**\n\n根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 gs/gogat 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。\n\n**形式、總量與時期一起決定結果**\n\n銨態並非不好，但根域容量小、緩衝弱時，過量銨容易酸化、毒害及拮抗鈣鉀鎂。果實期又須避免過氮徒長、陰蔽與品質下降。因此應依土水、光量、生育需求分次施肥，而不是只選一個氮形式就認為問題解決。\n\n### 可直接練寫的完整答案\n\n氮供蛋白質、酵素、核酸及葉綠素，促適度營養生長。缺氮由老葉均勻黃化、植株矮小、葉面積及產量下降；\n\n硝酸鹽累積是吸收高於還原同化，低光、過量氮、低溫及品種共同影響。應按需分施、改善光與根域，不能只因葉色濃綠就追加氮。\n\n氮是胺基酸、蛋白質、核酸與葉綠素等的成分，供應不足會限制葉面積、酵素和光合能力。氮可再移動，典型缺氮常先從老葉均勻黃化，再造成全株細弱與減產。\n\n根主要吸收硝態與銨態氮；硝態須先經硝酸、亞硝酸還原後成銨，再由 gs/gogat 等途徑結合碳骨架形成有機氮。弱光時還原力與碳供應不足，若仍大量吸硝態，就可能在組織累積硝酸鹽。\n\n### 實例：把原理用在情境中\n\n番茄結果後期若高氨加上灌溉不穩，果端鈣供應更易失衡；改硝態為主仍須同時控制總氮、供水與根活力，才能有效降低風險。\n\n### 配分重點：哪些內容不能漏？\n\n14 分：功能、缺氮部位症狀、累積原因及管理。\n\n- **缺氮部位症狀**\n- **累積原因及管理**\n\n細項為依題意整理的建議得分內容，並非校方公布的評分細則。作答時依原題小題順序，讓定義、機制、實例與管理措施互相對應。\n\n### 常見錯誤與修正\n\n- 把硝酸鹽累積說成所有氮都完全不能被利用。\n 100 蔬菜學"},{"id":"蔬菜學-100-八","s":"蔬菜學","y":100,"n":"八","t":"胡瓜體細胞胚英文翻譯","body":"<h2>第八題｜胡瓜體細胞胚英文翻譯（16 分）<\/h2>\n<h3>題意與作答範圍<\/h3>\n<p>本題重點：<strong>胡瓜體細胞胚英文翻譯<\/strong>。下列依題目主題整理答案；題幹、選項與圖表請對照<a href=\"../../541491416.pdf#page=21\">原始試卷<\/a>。<\/p>\n<h3>先掌握答案<\/h3>\n<p>這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。<\/p>\n<h3>完整參考譯文<\/h3>\n<p>近年園藝植物離體繁殖已廣泛用於經濟生產。胡瓜大量離體繁殖有器官發生與體細胞胚發生兩途徑；<\/p>\n<p>相較器官發生微繁殖，體胚對量繁與遺傳改良有多項潛在優點。體胚較小、大小均一、再生效率高且有長期貯存潛力，因此較適於商業離體操作。體胚通常受生長調節劑控制，但具體流程依基因型、外植體來源、培養基與調節劑等而定。次生體胚增殖率高、依賴外植體來源且可重複進行，亦已成功應用於基因轉殖。<\/p>\n<h3>讀懂這段研究在說什麼<\/h3>\n<p><strong>再生方式與量產潛力的比較<\/strong><\/p>\n<p>器官發生通常先形成芽或根，體胚則形成具胚軸兩極性的胚狀結構。原文比較的是量繁與遺傳改良潛力，不能翻成所有胡瓜體胚技術已完全商業成熟。小、均一、可保存等優點需逐項保留，並分清離體培養與一般田間繁殖。<\/p>\n<h3>專業詞彙與翻譯辨析<\/h3>\n<table>\n<thead>\n<tr>\n<th>英文用語<\/th>\n<th>建議譯法<\/th>\n<th>讀法與限制<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>somatic embryos<\/td>\n<td>體細胞胚<\/td>\n<td>由體細胞形成的胚，不是受精合子胚<\/td>\n<\/tr>\n<tr>\n<td>organogenesis<\/td>\n<td>器官發生<\/td>\n<td>形成不定芽或根等器官<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>配分重點與檢查順序<\/h3>\n<p>16 分：兩途徑、四優勢、流程因素及次生體胚，不把潛力譯保證。<\/p>\n<p>先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。<\/p>\n<h3>常見失分<\/h3>\n<ul>\n<li>把專業名詞按一般字義翻譯，或把相關性改成因果。<\/li>\n<li>省略轉折、條件或限制，使研究結論比原文更強。<\/li>\n<li>以摘要取代全文翻譯。<\/li>\n<\/ul>","source":"../../541491416.pdf#page=21","md":"100年蔬菜學_逐題教學詳解.md","search":"胡瓜體細胞胚英文翻譯 ## 第八題｜胡瓜體細胞胚英文翻譯（16 分）\n\n### 題意與作答範圍\n\n本題重點：**胡瓜體細胞胚英文翻譯**。下列依題目主題整理答案；題幹、選項與圖表請對照[原始試卷](../../541491416.pdf#page=21)。\n\n### 先掌握答案\n\n這是一題全文翻譯，應保留原文的研究對象、因果、比較、數量與限制。下列譯文按意思分段，術語解析另列。\n\n### 完整參考譯文\n\n近年園藝植物離體繁殖已廣泛用於經濟生產。胡瓜大量離體繁殖有器官發生與體細胞胚發生兩途徑；\n\n相較器官發生微繁殖，體胚對量繁與遺傳改良有多項潛在優點。體胚較小、大小均一、再生效率高且有長期貯存潛力，因此較適於商業離體操作。體胚通常受生長調節劑控制，但具體流程依基因型、外植體來源、培養基與調節劑等而定。次生體胚增殖率高、依賴外植體來源且可重複進行，亦已成功應用於基因轉殖。\n\n### 讀懂這段研究在說什麼\n\n**再生方式與量產潛力的比較**\n\n器官發生通常先形成芽或根，體胚則形成具胚軸兩極性的胚狀結構。原文比較的是量繁與遺傳改良潛力，不能翻成所有胡瓜體胚技術已完全商業成熟。小、均一、可保存等優點需逐項保留，並分清離體培養與一般田間繁殖。\n\n### 專業詞彙與翻譯辨析\n\n| 英文用語 | 建議譯法 | 讀法與限制 |\n| --- | --- | --- |\n| somatic embryos | 體細胞胚 | 由體細胞形成的胚，不是受精合子胚 |\n| organogenesis | 器官發生 | 形成不定芽或根等器官 |\n\n### 配分重點與檢查順序\n\n16 分：兩途徑、四優勢、流程因素及次生體胚，不把潛力譯保證。\n\n先檢查是否漏譯整句，再核對否定詞、比較對象、百分比和溫度。研究原文中的「可能」「顯著」「潛力」不可任意改成保證效果；譯文如提到健康或產業效益，應保留為原文陳述，不擴寫成額外建議。\n\n### 常見失分\n\n- 把專業名詞按一般字義翻譯，或把相關性改成因果。\n- 省略轉折、條件或限制，使研究結論比原文更強。\n- 以摘要取代全文翻譯。\n 100 蔬菜學"}]</script><script>const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let list=[],current=null,examMode=false;const subjectOrder=['果樹學','花卉學','蔬菜學','園藝植物學'];const subjects=subjectOrder.filter(s=>data.some(r=>r.s===s));subjects.forEach(s=>$('subject').add(new Option(s,s)));function setYears(prefer){const ys=[...new Set(data.filter(r=>r.s===$('subject').value).map(r=>r.y))].sort((a,b)=>b-a);$('year').replaceChildren();ys.forEach(y=>$('year').add(new Option(y+' 年',y)));if(prefer&&ys.includes(+prefer))$('year').value=prefer}function filter(wanted){const query=$('search').value.trim().toLowerCase();list=data.filter(r=>query?(r.search.includes(query)):(r.s===$('subject').value&&r.y===+$('year').value));$('resultCount').textContent=query?'搜尋結果 '+list.length+' 題（跨全部科目與年度）':'本卷 '+list.length+' 大題';$('nav').replaceChildren();list.forEach((r,i)=>{const b=document.createElement('button');b.dataset.id=r.id;b.innerHTML=(query?'<small>'+r.y+' 年 '+r.s+'</small>':'')+'第'+r.n+'題｜'+escapeHTML(r.t);b.onclick=()=>show(r.id);$('nav').append(b)});if(!list.length){current=null;$('content').innerHTML='<div class="empty">沒有符合的題目。可縮短關鍵字，或清除搜尋後選擇科目與年度。</div>';$('counter').textContent='0 題';$('prev').disabled=true;$('next').disabled=true;return}show(wanted&&list.some(r=>r.id===wanted)?wanted:list[0].id,false)}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prepareContent(){document.querySelectorAll('#content h3').forEach((h,i)=>h.id='section-'+i);if(!examMode){const hs=[...document.querySelectorAll('#content h3')];const links=hs.map(h=>'<a href="#'+h.id+'">'+escapeHTML(h.textContent.split('：')[0])+'</a>').join('');const el=document.createElement('div');el.className='sectionnav';el.innerHTML=links;$('content').prepend(el)}}function show(id,scroll=true){const r=data.find(x=>x.id===id);if(!r)return;current=r;examMode=false;document.body.classList.remove('exam');$('content').innerHTML='<article class="page">'+r.body+'</article>';prepareContent();$('exam ial;try{initial=decodeURIComponent(location.hash.replace(/^#q=/,''))}catch(e){}let r=data.find(x=>x.id===initial);if(!r)r=data.find(x=>x.s==='果樹學'&&x.y===111)||data[0];if(window.innerWidth<=900)document.body.classList.add('navclosed');$('subject').value=r.s;setYears(r.y);filter(r.id);$('content').addEventListener('click',e=>{const a=e.target.closest('.sectionnav a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'});}});window.reader={get current(){return current},get list(){return list},show,showExam,filter,data};</script></body></html>
