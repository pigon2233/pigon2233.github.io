<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="番茄雙幹與三幹：主幹＋保留強側枝"><rect width="1000" height="440" rx="20" fill="#f5f8f3"/><style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#193c32;font-size:21px}.sm{font-size:17px}.ln{fill:none;stroke:#28765b;stroke-width:4}.dash{stroke-dasharray:8 6}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28765b"/></marker></defs><text x="35" y="45" font-size="26">番茄雙幹與三幹：主幹＋保留強側枝</text><path class="ln" d="M240 350V110M240 260L135 145M650 350V110M650 260L545 145M650 220L755 105"/><text x="155" y="85">雙幹：2 條主軸</text><text x="560" y="85">三幹：3 條主軸</text><text x="260" y="140" class="sm">主幹</text><text x="85" y="190" class="sm">保留側枝</text><text x="670" y="140" class="sm">主幹</text><text x="470" y="205" class="sm">側枝一</text><text x="760" y="175" class="sm">側枝二</text><path stroke="#c34b45" stroke-width="4" d="M240 205L285 180M270 176L280 190M650 300L695 275M680 270L690 285"/><text x="135" y="395" class="sm">通常留第一花序下強側枝；三幹再選另一強枝。其餘側芽及早去除（紅線）。</text><text x="135" y="425" class="sm">實際保留節位隨品種、定植密度及生產目標調整，整枝不可過量去除健康葉。</text></svg>