<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="光反應曲線：四個判讀位置"><rect width="1000" height="440" rx="20" fill="#f5f8f3"/><style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#193c32;font-size:21px}.sm{font-size:17px}.ln{fill:none;stroke:#28765b;stroke-width:4}.dash{stroke-dasharray:8 6}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28765b"/></marker></defs><text x="35" y="45" font-size="26">光反應曲線：四個判讀位置</text><path class="ln" d="M100 80V340H930M100 290H930"/><text x="780" y="385">光量增加 →</text><text x="30" y="110" class="sm">淨光合</text><path d="M100 325 C155 310 165 284 210 240 S360 115 510 115 L680 115 Q810 115 910 180" fill="none" stroke="#c47729" stroke-width="6"/><circle cx="170" cy="290" r="7" fill="#c47729"/><path class="ln dash" d="M510 115V290M780 125V290"/><text x="110" y="360" class="sm">暗呼吸：零光時負值</text><text x="180" y="280" class="sm">光補償點：淨值 = 0</text><text x="445" y="100" class="sm">光飽和：接近平臺</text><text x="735" y="210" class="sm">強光抑制：下降</text><text x="105" y="420" class="sm">示意圖；形狀與位置依種類、CO₂、溫度、水分及測量條件改變，非實測數據。</text></svg>