<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="實生果樹相位：同一樹體亦有幼年與成熟部位"><rect width="1000" height="440" rx="20" fill="#f5f8f3"/><style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#193c32;font-size:21px}.sm{font-size:17px}.ln{fill:none;stroke:#28765b;stroke-width:4}.dash{stroke-dasharray:8 6}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28765b"/></marker></defs><text x="35" y="45" font-size="26">實生果樹相位：同一樹體亦有幼年與成熟部位</text><path class="ln" d="M470 345V160M470 240L280 160M470 220L670 140M470 190L390 100M470 170L550 90"/><ellipse cx="475" cy="140" rx="290" ry="70" fill="#cfe4c9" opacity=".8"/><text x="290" y="145">較晚形成的冠部芽：偏成年相</text><path class="ln" d="M470 320L320 275"/><text x="65" y="285">基部芽、萌蘗：較易保留幼年特徵</text><text x="190" y="385">種子 → 幼年期 → 過渡期 → 成年／結果期 → 衰老</text><text x="115" y="425" class="sm">相位不是單靠高度或年齡判定；修剪、繁殖及返幼可改局部表現，此為概念示意。</text></svg>