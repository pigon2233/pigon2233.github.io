<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="源 → 韌皮部 → 果實庫：路徑與壓力流"><rect width="1000" height="440" rx="20" fill="#f5f8f3"/><style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#193c32;font-size:21px}.sm{font-size:17px}.ln{fill:none;stroke:#28765b;stroke-width:4}.dash{stroke-dasharray:8 6}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28765b"/></marker></defs><text x="35" y="45" font-size="26">源 → 韌皮部 → 果實庫：路徑與壓力流</text><rect x="45" y="95" width="250" height="185" rx="15" fill="#d6e9ce"/><rect x="365" y="95" width="270" height="185" rx="15" fill="#e2eddf"/><rect x="705" y="95" width="250" height="185" rx="15" fill="#eedec7"/><text x="70" y="130">成熟葉（源）</text><text x="70" y="175" class="sm">葉肉合成蔗糖</text><text x="70" y="210" class="sm">裝載 → 伴細胞／篩管</text><text x="70" y="250" class="sm">吸水、膨壓較高</text><text x="390" y="130">長距離運輸</text><text x="390" y="175" class="sm">葉脈 → 葉柄 → 枝幹</text><text x="390" y="210" class="sm">→ 果梗韌皮部</text><text x="390" y="250" class="sm">源庫膨壓差驅動質流</text><text x="730" y="130">果實（庫）</text><text x="730" y="175" class="sm">卸載 → 果肉細胞</text><text x="730" y="210" class="sm">利用／轉化／液泡儲存</text><text x="730" y="250" class="sm">卸載使庫端膨壓降低</text><path class="ln" marker-end="url(#arrow)" d="M300 175H355M640 175H695"/><text x="70" y="340">共質體：胞質＋胞間連絲；質外體：細胞壁間隙＋跨膜糖轉運。</text><text x="70" y="385" class="sm">裝卸載路徑可隨果樹種類、果齡改變；不是糖沿木質部直接向下運送。</text></svg>