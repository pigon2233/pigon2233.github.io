<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="香石竹摘心：保留枝與再摘枝"><rect width="1000" height="440" rx="20" fill="#f5f8f3"/><style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#193c32;font-size:21px}.sm{font-size:17px}.ln{fill:none;stroke:#28765b;stroke-width:4}.dash{stroke-dasharray:8 6}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28765b"/></marker></defs><text x="35" y="45" font-size="26">香石竹摘心：保留枝與再摘枝</text><text x="80" y="95">一次摘心</text><path class="ln" d="M170 340V255M170 255L100 180M170 255L240 180"/><text x="135" y="375" class="sm">第一次摘心</text><circle cx="100" cy="170" r="12" fill="#c47729"/><circle cx="240" cy="170" r="12" fill="#c47729"/><text x="410" y="95">一次半摘心</text><path class="ln" d="M500 340V255M500 255L430 180M500 255L570 180"/><text x="465" y="375" class="sm">第一次摘心</text><circle cx="430" cy="170" r="12" fill="#c47729"/><path class="ln" d="M570 180L540 130M570 180L600 130"/><path stroke="#c34b45" stroke-width="5" d="M560 175L580 185"/><circle cx="540" cy="125" r="10" fill="#c47729"/><circle cx="600" cy="125" r="10" fill="#c47729"/><text x="740" y="95">二次摘心</text><path class="ln" d="M830 340V255M830 255L760 180M830 255L900 180"/><text x="795" y="375" class="sm">第一次摘心</text><path class="ln" d="M760 180L730 130M760 180L790 130"/><path stroke="#c34b45" stroke-width="5" d="M750 175L770 185"/><circle cx="730" cy="125" r="10" fill="#c47729"/><circle cx="790" cy="125" r="10" fill="#c47729"/><path class="ln" d="M900 180L870 130M900 180L930 130"/><path stroke="#c34b45" stroke-width="5" d="M890 175L910 185"/><circle cx="870" cy="125" r="10" fill="#c47729"/><circle cx="930" cy="125" r="10" fill="#c47729"/><text x="55" y="420" class="sm">紅線為再摘心位置；橘點為後續花。半摘心保留一部分早花，其餘再分枝較晚花。</text></svg>