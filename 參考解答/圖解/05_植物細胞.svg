<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="植物細胞模式：結構標示示範"><rect width="1000" height="440" rx="20" fill="#f5f8f3"/><style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#193c32;font-size:21px}.sm{font-size:17px}.ln{fill:none;stroke:#28765b;stroke-width:4}.dash{stroke-dasharray:8 6}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28765b"/></marker></defs><text x="35" y="45" font-size="26">植物細胞模式：結構標示示範</text><rect x="70" y="90" width="600" height="285" rx="50" fill="#d5e5c6" stroke="#39724f" stroke-width="13"/><rect x="85" y="105" width="570" height="255" rx="38" fill="#eff4d8" stroke="#d09041" stroke-width="4"/><rect x="260" y="150" width="340" height="180" rx="55" fill="#d5e9f3" stroke="#6d9bb2" stroke-width="3"/><circle cx="165" cy="205" r="47" fill="#d9cde6"/><circle cx="165" cy="205" r="16" fill="#9985b6"/><ellipse cx="160" cy="300" rx="35" ry="18" fill="#78af69"/><ellipse cx="545" cy="125" rx="35" ry="14" fill="#78af69"/><ellipse cx="225" cy="130" rx="25" ry="12" fill="#dda56c"/><path d="M110 140Q140 120 170 140M110 150Q140 130 170 150M105 160Q140 140 180 160" stroke="#a878a5" fill="none" stroke-width="3"/><path d="M205 260Q235 245 250 260M210 270Q235 255 255 270" stroke="#aa8052" fill="none" stroke-width="3"/><text x="375" y="235">大液泡</text><text x="137" y="215" class="sm">核</text><text x="710" y="120" class="sm">細胞壁：最外綠厚線</text><text x="710" y="155" class="sm">質膜：內側橘線</text><text x="710" y="190" class="sm">液泡膜：藍色邊界</text><text x="710" y="225" class="sm">核仁：核內深色圓</text><text x="710" y="260" class="sm">葉綠體：綠橢圓</text><text x="710" y="295" class="sm">粒線體：橘橢圓</text><text x="710" y="330" class="sm">內質網：左上紫曲線</text><text x="710" y="365" class="sm">高基氏體：核右下曲線</text><text x="90" y="415" class="sm">另可補畫核糖體（細點）、胞間連絲（穿壁通道）、過氧化體，並連結各功能。</text></svg>