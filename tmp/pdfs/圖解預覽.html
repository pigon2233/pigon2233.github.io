s a{padding:8px 12px;border:1px solid #c5d3bd;border-radius:6px;background:#fffef9;font-size:14px}.figure{margin:26px 0;background:white;padding:14px;border-radius:12px}.figure svg{width:100%;height:auto}footer{font-size:14px;color:#60715e}.hidden{display:none!important}@media(max-width:720px){header,main,footer{padding:20px}h1{font-size:27px}.controls{padding:0 16px}summary{flex-wrap:wrap;gap:5px 12px;padding:15px}.tag{min-width:100%;margin-left:27px}.answer{padding:0 18px 15px;font-size:16px}.permalink{display:none}}@media print{body{background:white;color:black;font-size:11pt;line-height:1.7}.toolbar,.booklinks,.permalink,.screenonly{display:none}header,main,footer{max-width:none;padding:0}h1{font-size:22pt}.question{border:0;border-bottom:1px solid #bbb;border-radius:0;break-inside:auto}summary{display:block;font-size:13pt;padding:12px 0}.tag{font-size:10pt;margin-right:12px}.answer{padding:0;border:0}.figure{break-inside:avoid}a{color:inherit;text-decoration:none}.sources{border:0;padding:0}header{break-after:page}h2{break-after:avoid}}</style><main><h2>圖解補充</h2><p>以下均為概念示意，非實測曲線；配合對應圖題的文字與配分重點練習。</p><figure class="figure"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="光反應曲線：四個判讀位置"><rect width="1000" height="440" rx="20" fill="#f5f8f3"/><style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#193c32;font-size:21px}.sm{font-size:17px}.ln{fill:none;stroke:#28765b;stroke-width:4}.dash{stroke-dasharray:8 6}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28765b"/></marker></defs><text x="35" y="45" font-size="26">光反應曲線：四個判讀位置</text><path class="ln" d="M100 80V340H930M100 290H930"/><text x="780" y="385">光量增加 →</text><text x="30" y="110" class="sm">淨光合</text><path d="M100 325 C155 310 165 284 210 240 S360 115 510 115 L680 115 Q810 115 910 180" fill="none" stroke="#c47729" stroke-width="6"/><circle cx="170" cy="290" r="7" fill="#c47729"/><path class="ln dash" d="M510 115V290M780 125V290"/><text x="110" y="360" class="sm">暗呼吸：零光時負值</text><text x="180" y="280" class="sm">光補償點：淨值 = 0</text><text x="445" y="100" class="sm">光飽和：接近平臺</text><text x="735" y="210" class="sm">強光抑制：下降</text><text x="105" y="420" class="sm">示意圖；形狀與位置依種類、CO₂、溫度、水分及測量條件改變，非實測數據。</text></svg></figure><figure class="figure"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="源 → 韌皮部 → 果實庫：路徑與壓力流"><rect width="1000" height="440" rx="20" fill="#f5f8f3"/><style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#193c32;font-size:21px}.sm{font-size:17px}.ln{fill:none;stroke:#28765b;stroke-width:4}.dash{stroke-dasharray:8 6}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28765b"/></marker></defs><text x="35" y="45" font-size="26">源 → 韌皮部 → 果實庫：路徑與壓力流</text><rect x="45" y="95" width="250" height="185" rx="15" fill="#d6e9ce"/><rect x="365" y="95" width="270" height="185" rx="15" fill="#e2eddf"/><rect x="705" y="95" width="250" height="185" rx="15" fill="#eedec7"/><text x="70" y="130">成熟葉（源）</text><text x="70" y="175" class="sm">葉肉合成蔗糖</text><text x="70" y="210" class="sm">裝載 → 伴細胞／篩管</text><text x="70" y="250" class="sm">吸水、膨壓較高</text><text x="390" y="130">長距離運輸</text><text x="390" y="175" class="sm">葉脈 → 葉柄 → 枝幹</text><text x="390" y="210" class="sm">→ 果梗韌皮部</text><text x="390" y="250" class="sm">源庫膨壓差驅動質流</text><text x="730" y="130">果實（庫）</text><text x="730" y="175" class="sm">卸載 → 果肉細胞</text><text x="730" y="210" class="sm">利用／轉化／液泡儲存</text><text x="730" y="250" class="sm">卸載使庫端膨壓降低</text><path class="ln" marker-end="url(#arrow)" d="M300 175H355M640 175H695"/><text x="70" y="340">共質體：胞質＋胞間連絲；質外體：細胞壁間隙＋跨膜糖轉運。</text><text x="70" y="385" class="sm">裝卸載路徑可隨果樹種類、果齡改變；不是糖沿木質部直接向下運送。</text></svg></figure><figure class="figure"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="CAM 日韻律：酸含量與外界 CO₂ 固定分別畫"><rect width="1000" height="440" rx="20" fill="#f5f8f3"/><style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#193c32;font-size:21px}.sm{font-size:17px}.ln{fill:none;stroke:#28765b;stroke-width:4}.dash{stroke-dasharray:8 6}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28765b"/></marker></defs><text x="35" y="45" font-size="26">CAM 日韻律：酸含量與外界 CO₂ 固定分別畫</text><rect x="100" y="80" width="390" height="245" fill="#dce4e9"/><rect x="490" y="80" width="390" height="245" fill="#fff3cd"/><text x="250" y="105">夜間</text><text x="650" y="105">白天</text><path class="ln" d="M100 120V325H900"/><path d="M105 290 Q300 220 490 140 Q660 220 880 290" fill="none" stroke="#28765b" stroke-width="5"/><path d="M105 265 Q290 155 485 265 L510 295 Q690 310 865 280" fill="none" stroke="#c47729" stroke-width="5" stroke-dasharray="10 6"/><text x="130" y="350" class="sm">黃昏</text><text x="460" y="350" class="sm">黎明</text><text x="830" y="350" class="sm">黃昏</text><text x="120" y="385" class="sm">綠實線：蘋果酸含量（夜升晝降）</text><text x="530" y="385" class="sm">橘虛線：外界 CO₂ 固定（主要夜間）</text><text x="120" y="420" class="sm">夜 PEPC 固碳存酸；晝脫羧供 Rubisco。僅定性示意，兩指標單位不同。</text></svg></figure><figure class="figure"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="香石竹摘心：保留枝與再摘枝"><rect width="1000" height="440" rx="20" fill="#f5f8f3"/><style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#193c32;font-size:21px}.sm{font-size:17px}.ln{fill:none;stroke:#28765b;stroke-width:4}.dash{stroke-dasharray:8 6}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28765b"/></marker></defs><text x="35" y="45" font-size="26">香石竹摘心：保留枝與再摘枝</text><text x="80" y="95">一次摘心</text><path class="ln" d="M170 340V255M170 255L100 180M170 255L240 180"/><text x="135" y="375" class="sm">第一次摘心</text><circle cx="100" cy="170" r="12" fill="#c47729"/><circle cx="240" cy="170" r="12" fill="#c47729"/><text x="410" y="95">一次半摘心</text><path class="ln" d="M500 340V255M500 255L430 180M500 255L570 180"/><text x="465" y="375" class="sm">第一次摘心</text><circle cx="430" cy="170" r="12" fill="#c47729"/><path class="ln" d="M570 180L540 130M570 180L600 130"/><path stroke="#c34b45" stroke-width="5" d="M560 175L580 185"/><circle cx="540" cy="125" r="10" fill="#c47729"/><circle cx="600" cy="125" r="10" fill="#c47729"/><text x="740" y="95">二次摘心</text><path class="ln" d="M830 340V255M830 255L760 180M830 255L900 180"/><text x="795" y="375" class="sm">第一次摘心</text><path class="ln" d="M760 180L730 130M760 180L790 130"/><path stroke="#c34b45" stroke-width="5" d="M750 175L770 185"/><circle cx="730" cy="125" r="10" fill="#c47729"/><circle cx="790" cy="125" r="10" fill="#c47729"/><path class="ln" d="M900 180L870 130M900 180L930 130"/><path stroke="#c34b45" stroke-width="5" d="M890 175L910 185"/><circle cx="870" cy="125" r="10" fill="#c47729"/><circle cx="930" cy="125" r="10" fill="#c47729"/><text x="55" y="420" class="sm">紅線為再摘心位置；橘點為後續花。半摘心保留一部分早花，其餘再分枝較晚花。</text></svg></figure><figure class="figure"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="植物細胞模式：結構標示示範"><rect width="1000" height="440" rx="20" fill="#f5f8f3"/><style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#193c32;font-size:21px}.sm{font-size:17px}.ln{fill:none;stroke:#28765b;stroke-width:4}.dash{stroke-dasharray:8 6}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28765b"/></marker></defs><text x="35" y="45" font-size="26">植物細胞模式：結構標示示範</text><rect x="70" y="90" width="600" height="285" rx="50" fill="#d5e5c6" stroke="#39724f" stroke-width="13"/><rect x="85" y="105" width="570" height="255" rx="38" fill="#eff4d8" stroke="#d09041" stroke-width="4"/><rect x="260" y="150" width="340" height="180" rx="55" fill="#d5e9f3" stroke="#6d9bb2" stroke-width="3"/><circle cx="165" cy="205" r="47" fill="#d9cde6"/><circle cx="165" cy="205" r="16" fill="#9985b6"/><ellipse cx="160" cy="300" rx="35" ry="18" fill="#78af69"/><ellipse cx="545" cy="125" rx="35" ry="14" fill="#78af69"/><ellipse cx="225" cy="130" rx="25" ry="12" fill="#dda56c"/><path d="M110 140Q140 120 170 140M110 150Q140 130 170 150M105 160Q140 140 180 160" stroke="#a878a5" fill="none" stroke-width="3"/><path d="M205 260Q235 245 250 260M210 270Q235 255 255 270" stroke="#aa8052" fill="none" stroke-width="3"/><text x="375" y="235">大液泡</text><text x="137" y="215" class="sm">核</text><text x="710" y="120" class="sm">細胞壁：最外綠厚線</text><text x="710" y="155" class="sm">質膜：內側橘線</text><text x="710" y="190" class="sm">液泡膜：藍色邊界</text><text x="710" y="225" class="sm">核仁：核內深色圓</text><text x="710" y="260" class="sm">葉綠體：綠橢圓</text><text x="710" y="295" class="sm">粒線體：橘橢圓</text><text x="710" y="330" class="sm">內質網：左上紫曲線</text><text x="710" y="365" class="sm">高基氏體：核右下曲線</text><text x="90" y="415" class="sm">另可補畫核糖體（細點）、胞間連絲（穿壁通道）、過氧化體，並連結各功能。</text></svg></figure><figure class="figure"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="番茄雙幹與三幹：主幹＋保留強側枝"><rect width="1000" height="440" rx="20" fill="#f5f8f3"/><style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#193c32;font-size:21px}.sm{font-size:17px}.ln{fill:none;stroke:#28765b;stroke-width:4}.dash{stroke-dasharray:8 6}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28765b"/></marker></defs><text x="35" y="45" font-size="26">番茄雙幹與三幹：主幹＋保留強側枝</text><path class="ln" d="M240 350V110M240 260L135 145M650 350V110M650 260L545 145M650 220L755 105"/><text x="155" y="85">雙幹：2 條主軸</text><text x="560" y="85">三幹：3 條主軸</text><text x="260" y="140" class="sm">主幹</text><text x="85" y="190" class="sm">保留側枝</text><text x="670" y="140" class="sm">主幹</text><text x="470" y="205" class="sm">側枝一</text><text x="760" y="175" class="sm">側枝二</text><path stroke="#c34b45" stroke-width="4" d="M240 205L285 180M270 176L280 190M650 300L695 275M680 270L690 285"/><text x="135" y="395" class="sm">通常留第一花序下強側枝；三幹再選另一強枝。其餘側芽及早去除（紅線）。</text><text x="135" y="425" class="sm">實際保留節位隨品種、定植密度及生產目標調整，整枝不可過量去除健康葉。</text></svg></figure><figure class="figure"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="實生果樹相位：同一樹體亦有幼年與成熟部位"><rect width="1000" height="440" rx="20" fill="#f5f8f3"/><style>text{font-family:"Noto Sans CJK TC",sans-serif;fill:#193c32;font-size:21px}.sm{font-size:17px}.ln{fill:none;stroke:#28765b;stroke-width:4}.dash{stroke-dasharray:8 6}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28765b"/></marker></defs><text x="35" y="45" font-size="26">實生果樹相位：同一樹體亦有幼年與成熟部位</text><path class="ln" d="M470 345V160M470 240L280 160M470 220L670 140M470 190L390 100M470 170L550 90"/><ellipse cx="475" cy="140" rx="290" ry="70" fill="#cfe4c9" opacity=".8"/><text x="290" y="145">較晚形成的冠部芽：偏成年相</text><path class="ln" d="M470 320L320 275"/><text x="65" y="285">基部芽、萌蘗：較易保留幼年特徵</text><text x="190" y="385">種子 → 幼年期 → 過渡期 → 成年／結果期 → 衰老</text><text x="115" y="425" class="sm">相位不是單靠高度或年齡判定；修剪、繁殖及返幼可改局部表現，此為概念示意。</text></svg></figure></main>
